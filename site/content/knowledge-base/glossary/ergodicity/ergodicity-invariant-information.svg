<svg xmlns="http://www.w3.org/2000/svg" width="760" height="460"
     viewBox="0 0 760 460" role="img"
     aria-labelledby="ergodicityInfoTitle ergodicityInfoDesc">
  <title id="ergodicityInfoTitle">Ergodicity combines measure preservation with invariant-set rigidity</title>
  <desc id="ergodicityInfoDesc">Two labeled inputs join to form full ergodicity. Measure preservation keeps the reference measure unchanged by the dynamics. Pre-ergodic invariant-set rigidity means every measurable exactly invariant set is null or conull. Together they prevent a positive-mass invariant split, so an invariant measurable real output is constant almost everywhere. Position, borders, labels, and color all distinguish the inputs and conclusion.</desc>
  <rect width="760" height="460" fill="#F7F4F0"/>
  <style>
    .t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#2C2924}
    .title{font-size:15px;font-weight:700}.h{font-size:13px;font-weight:700}
    .s{font-size:12px}.m{font-size:11px;fill:#5A544C}.tag{font-size:10px;font-weight:700;letter-spacing:.5px}
    .blue{fill:#E8F0F7;stroke:#4B6787;stroke-width:1.5}
    .green{fill:#EAF1E5;stroke:#6F8D5E;stroke-width:1.5}
    .clay{fill:#F3E8E0;stroke:#A67C52;stroke-width:1.5}
    .cream{fill:#FBF9F6;stroke:#C4B8A8;stroke-width:1.5}
    .arrow{fill:none;stroke:#A67C52;stroke-width:2.2;marker-end:url(#ergodicityArrow)}
  </style>
  <defs>
    <marker id="ergodicityArrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#A67C52"/>
    </marker>
  </defs>

  <text x="24" y="28" class="t title">Ergodicity has two distinct jobs</text>
  <text x="24" y="48" class="t m">Preserve the measure, then rule out positive-mass invariant information.</text>

  <rect x="24" y="76" width="344" height="132" rx="12" class="blue"/>
  <rect x="42" y="94" width="92" height="22" rx="11" fill="#4B6787"/>
  <text x="88" y="109" text-anchor="middle" class="t tag" style="fill:#FFFDF8">DYNAMICS</text>
  <text x="42" y="144" class="t h">MEASURE PRESERVATION</text>
  <text x="42" y="168" class="t s">Pulling an event back through one step</text>
  <text x="42" y="188" class="t s">does not change its measured size.</text>

  <rect x="392" y="76" width="344" height="132" rx="12" class="clay"/>
  <rect x="410" y="94" width="92" height="22" rx="11" fill="#A67C52"/>
  <text x="456" y="109" text-anchor="middle" class="t tag" style="fill:#FFFDF8">RIGIDITY</text>
  <text x="410" y="144" class="t h">PRE-ERGODIC INVARIANT-SET TEST</text>
  <text x="410" y="168" class="t s">Every measurable exactly invariant set</text>
  <text x="410" y="188" class="t s">is null or conull.</text>

  <path d="M 196 212 C 196 246, 300 246, 352 266" class="arrow"/>
  <path d="M 564 212 C 564 246, 460 246, 408 266" class="arrow"/>

  <rect x="128" y="274" width="504" height="78" rx="12" class="green"/>
  <text x="148" y="302" class="t h">FULL ERGODICITY</text>
  <text x="148" y="326" class="t s">No measurable exactly invariant region can split positive mass into two sides.</text>

  <path d="M 380 356 L 380 368" class="arrow"/>
  <rect x="24" y="374" width="712" height="68" rx="10" class="cream"/>
  <text x="44" y="397" class="t h">INVARIANT MEASURABLE OUTPUT</text>
  <text x="44" y="417" class="t s">Result: one constant almost everywhere.</text>
  <text x="44" y="435" class="t m">Null-set exceptions remain allowed; literal pointwise constancy is not claimed.</text>
</svg>
