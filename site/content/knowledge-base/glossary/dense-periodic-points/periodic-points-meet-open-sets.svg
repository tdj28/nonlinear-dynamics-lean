<svg xmlns="http://www.w3.org/2000/svg" width="760" height="320" viewBox="0 0 760 320" role="img" aria-labelledby="denseTitle denseDesc">
  <title id="denseTitle">Periodic points meet every nonempty open set</title>
  <desc id="denseDesc">On the left, three open regions each contain a marked point with a loop. On the right, the contraction has one periodic point zero outside an open interval from one to two.</desc>
  <rect width="760" height="320" fill="#F7F4F0"/>
  <style>.t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#2C2924}.title{font-size:15px;font-weight:700}.h{font-size:13px;font-weight:700}.s{font-size:12px}.m{font-size:11px;fill:#5A544C}.region{fill:#E8F0F7;stroke:#4B6787;stroke-width:1.5}.bad{fill:#F3E8E0;stroke:#A67C52;stroke-width:1.5}.loop{fill:none;stroke:#6F8D5E;stroke-width:2}</style>
  <defs><marker id="loopArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#6F8D5E"/></marker></defs>
  <text x="24" y="28" class="t title">Density asks every open region for a periodic witness</text><text x="24" y="48" class="t m">The witness and its positive period may vary with the region.</text>
  <text x="52" y="82" class="t h">Identity on the real line</text><ellipse cx="125" cy="155" rx="82" ry="52" class="region"/><ellipse cx="230" cy="144" rx="82" ry="52" class="region"/><ellipse cx="322" cy="170" rx="82" ry="52" class="region"/>
  <circle cx="122" cy="155" r="8" fill="#4B6787"/><circle cx="228" cy="142" r="8" fill="#4B6787"/><circle cx="320" cy="169" r="8" fill="#4B6787"/>
  <path d="M110 147C91 118 142 113 137 145" class="loop" marker-end="url(#loopArrow)"/><path d="M216 134C197 105 248 100 243 132" class="loop" marker-end="url(#loopArrow)"/><path d="M308 161C289 132 340 127 335 159" class="loop" marker-end="url(#loopArrow)"/>
  <text x="470" y="82" class="t h">Contraction x / 2</text><line x1="454" y1="170" x2="708" y2="170" stroke="#7F786D" stroke-width="2"/><circle cx="482" cy="170" r="8" fill="#4B6787"/><text x="472" y="195" class="t s">0</text><rect x="566" y="132" width="112" height="76" rx="10" class="bad"/><text x="607" y="162" class="t h">(1, 2)</text><text x="579" y="185" class="t s">no periodic point</text>
  <rect x="24" y="266" width="712" height="34" rx="8" fill="#EAF1E5" stroke="#6F8D5E"/><text x="45" y="288" class="t s">Every point is fixed for the identity; only 0 is periodic for the contraction, so one open interval is enough to refute density.</text>
</svg>
