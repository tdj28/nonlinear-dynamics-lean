<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="930"
     viewBox="0 0 1000 930" role="img"
     aria-labelledby="phaseGridTitle phaseGridDesc">
  <title id="phaseGridTitle">Exact phase regrouping and boundary removal</title>
  <desc id="phaseGridDesc">The upper panel groups twelve orbit starts into four residue phases. Phase zero has starts zero, four, and eight with values one, five, and nine, totaling fifteen. The other row totals are eighteen, twenty-one, and twenty-four. All rows total seventy-eight, matching the consecutive values one through twelve. The lower panel uses a one-point process whose time-zero value is positive one and whose positive-time value is minus the horizon. At block length four, three blocks, terminal parameter two, and phase one, an initial gap value minus one, block total minus twelve, and terminal gap value minus five total the horizon value minus eighteen. Removing only the nonpositive gaps gives minus eighteen at most minus twelve. Phase zero follows a direct route that never discards the positive time-zero value.</desc>

  <rect width="1000" height="930" fill="#F7F4F0"/>
  <style>
    .t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#2C2924}
    .title{font-size:22px;font-weight:700}
    .h{font-size:15px;font-weight:700}
    .s{font-size:13px}
    .m{font-size:12px;fill:#5A544C}
    .neutral{fill:#FBF9F6;stroke:#C4B8A8;stroke-width:1.6}
    .phase{fill:#E8F0F7;stroke:#4B6787;stroke-width:1.6}
    .kept{fill:#EAF1E5;stroke:#6F8D5E;stroke-width:1.6}
    .gap{fill:#F3E8E0;stroke:#8A623E;stroke-width:1.8;stroke-dasharray:8 5}
    .warning{fill:#F3E8E0;stroke:#8A623E;stroke-width:1.6}
    .arrow{fill:none;stroke:#8A623E;stroke-width:2.4;marker-end:url(#arrowhead)}
    .divider{stroke:#A89B8C;stroke-width:1.3;stroke-dasharray:5 4}
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="9" markerHeight="9"
            refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#8A623E"/>
    </marker>
  </defs>

  <text x="24" y="35" class="t title">Every residue phase, then only safe boundary removal</text>
  <text x="24" y="59" class="t m">Two exact toy ledgers: four-by-three regrouping and a positive-at-time-zero process</text>

  <rect x="24" y="80" width="952" height="374" rx="16" class="neutral"/>
  <text x="46" y="112" class="t h">1. Regroup twelve consecutive starts into four phase rows</text>
  <text x="46" y="134" class="t m">Block length four; three samples in each phase; value at start k is k plus one</text>

  <text x="62" y="163" class="t m">phase</text>
  <text x="228" y="163" class="t m">first sample</text>
  <text x="420" y="163" class="t m">second sample</text>
  <text x="612" y="163" class="t m">third sample</text>
  <text x="829" y="163" class="t m">row sum</text>

  <rect x="46" y="175" width="126" height="48" rx="9" class="phase"/>
  <text x="76" y="204" class="t h">phase 0</text>
  <rect x="188" y="175" width="176" height="48" rx="9" class="kept"/>
  <text x="218" y="196" class="t s">start 0</text>
  <text x="294" y="196" class="t s">value 1</text>
  <rect x="380" y="175" width="176" height="48" rx="9" class="kept"/>
  <text x="410" y="196" class="t s">start 4</text>
  <text x="486" y="196" class="t s">value 5</text>
  <rect x="572" y="175" width="176" height="48" rx="9" class="kept"/>
  <text x="602" y="196" class="t s">start 8</text>
  <text x="678" y="196" class="t s">value 9</text>
  <rect x="764" y="175" width="188" height="48" rx="9" class="neutral"/>
  <text x="814" y="204" class="t h">1 + 5 + 9 = 15</text>

  <rect x="46" y="232" width="126" height="48" rx="9" class="phase"/>
  <text x="76" y="261" class="t h">phase 1</text>
  <rect x="188" y="232" width="176" height="48" rx="9" class="kept"/>
  <text x="218" y="253" class="t s">start 1</text>
  <text x="294" y="253" class="t s">value 2</text>
  <rect x="380" y="232" width="176" height="48" rx="9" class="kept"/>
  <text x="410" y="253" class="t s">start 5</text>
  <text x="486" y="253" class="t s">value 6</text>
  <rect x="572" y="232" width="176" height="48" rx="9" class="kept"/>
  <text x="598" y="253" class="t s">start 9</text>
  <text x="672" y="253" class="t s">value 10</text>
  <rect x="764" y="232" width="188" height="48" rx="9" class="neutral"/>
  <text x="806" y="261" class="t h">2 + 6 + 10 = 18</text>

  <rect x="46" y="289" width="126" height="48" rx="9" class="phase"/>
  <text x="76" y="318" class="t h">phase 2</text>
  <rect x="188" y="289" width="176" height="48" rx="9" class="kept"/>
  <text x="218" y="310" class="t s">start 2</text>
  <text x="294" y="310" class="t s">value 3</text>
  <rect x="380" y="289" width="176" height="48" rx="9" class="kept"/>
  <text x="410" y="310" class="t s">start 6</text>
  <text x="486" y="310" class="t s">value 7</text>
  <rect x="572" y="289" width="176" height="48" rx="9" class="kept"/>
  <text x="594" y="310" class="t s">start 10</text>
  <text x="672" y="310" class="t s">value 11</text>
  <rect x="764" y="289" width="188" height="48" rx="9" class="neutral"/>
  <text x="806" y="318" class="t h">3 + 7 + 11 = 21</text>

  <rect x="46" y="346" width="126" height="48" rx="9" class="phase"/>
  <text x="76" y="375" class="t h">phase 3</text>
  <rect x="188" y="346" width="176" height="48" rx="9" class="kept"/>
  <text x="218" y="367" class="t s">start 3</text>
  <text x="294" y="367" class="t s">value 4</text>
  <rect x="380" y="346" width="176" height="48" rx="9" class="kept"/>
  <text x="410" y="367" class="t s">start 7</text>
  <text x="486" y="367" class="t s">value 8</text>
  <rect x="572" y="346" width="176" height="48" rx="9" class="kept"/>
  <text x="594" y="367" class="t s">start 11</text>
  <text x="672" y="367" class="t s">value 12</text>
  <rect x="764" y="346" width="188" height="48" rx="9" class="neutral"/>
  <text x="806" y="375" class="t h">4 + 8 + 12 = 24</text>

  <rect x="46" y="407" width="906" height="32" rx="9" class="kept"/>
  <text x="72" y="428" class="t h">All starts 0 through 11 occur once: 15 + 18 + 21 + 24 = 78 = 1 + 2 + ... + 12</text>

  <rect x="24" y="476" width="952" height="386" rx="16" class="neutral"/>
  <text x="46" y="508" class="t h">2. Keep both gaps first; remove them only after proving their sign</text>
  <text x="46" y="530" class="t m">One-point process: time-zero value is +1; every positive-time value is minus its horizon</text>

  <rect x="46" y="552" width="166" height="118" rx="12" class="phase"/>
  <text x="78" y="579" class="t h">long horizon</text>
  <text x="79" y="604" class="t s">length 18</text>
  <line x1="67" y1="617" x2="191" y2="617" class="divider"/>
  <text x="72" y="643" class="t h">process value -18</text>

  <path d="M220 611 L252 611" class="arrow"/>

  <rect x="264" y="552" width="168" height="118" rx="12" class="gap"/>
  <text x="296" y="579" class="t h">initial gap</text>
  <text x="301" y="604" class="t s">length 1</text>
  <line x1="284" y1="617" x2="412" y2="617" class="divider"/>
  <text x="294" y="643" class="t h">gap value -1</text>

  <rect x="446" y="552" width="250" height="118" rx="12" class="kept"/>
  <text x="496" y="579" class="t h">three complete blocks</text>
  <text x="497" y="604" class="t s">each block has length 4</text>
  <line x1="468" y1="617" x2="674" y2="617" class="divider"/>
  <text x="496" y="643" class="t h">block total 3 x -4 = -12</text>

  <rect x="710" y="552" width="242" height="118" rx="12" class="gap"/>
  <text x="771" y="579" class="t h">terminal gap</text>
  <text x="784" y="604" class="t s">length 5</text>
  <line x1="732" y1="617" x2="930" y2="617" class="divider"/>
  <text x="776" y="643" class="t h">gap value -5</text>

  <rect x="46" y="691" width="906" height="55" rx="10" class="phase"/>
  <text x="70" y="714" class="t h">Boundary-retaining ledger</text>
  <text x="70" y="735" class="t s">Initial -1 plus blocks -12 plus terminal -5 totals horizon -18; lengths 1 + 12 + 5 account for all 18 positions.</text>

  <path d="M500 750 L500 772" class="arrow"/>

  <rect x="46" y="780" width="430" height="61" rx="10" class="kept"/>
  <text x="68" y="805" class="t h">After safe removal</text>
  <text x="68" y="827" class="t s">Both gap values are nonpositive, so -18 is at most -12.</text>

  <rect x="496" y="780" width="456" height="61" rx="10" class="warning"/>
  <text x="518" y="805" class="t h">Phase-zero near-miss</text>
  <text x="518" y="827" class="t s">Time-zero value is +1. Use blocks -12 plus terminal -6; do not discard +1.</text>

  <rect x="24" y="882" width="952" height="34" rx="10" class="kept"/>
  <text x="107" y="904" class="t h">Finite conclusion: all phases reindex exactly; only positive-time nonpositive gaps may be removed.</text>
</svg>
