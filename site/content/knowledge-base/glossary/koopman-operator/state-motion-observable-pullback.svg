<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720"
     viewBox="0 0 1200 720" role="img"
     aria-labelledby="koopmanWorkedTitle koopmanWorkedDesc">
  <title id="koopmanWorkedTitle">A measure-preserving cycle and a non-preserving collapse</title>
  <desc id="koopmanWorkedDesc">The upper panel follows a uniform three-state cycle with observable values two, minus one, and four. One Koopman pullback gives minus one, four, and two, and a second gives four, two, and minus one. Each row has squared L2 norm seven. The lower comparison sends all states to c. Its singleton preimage counts are zero, zero, and three, its pullback is four, four, four, and its squared norm is sixteen rather than seven.</desc>
  <defs>
    <pattern id="cyclePattern" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#E7F0E2"/>
      <path d="M0 10 L10 0" stroke="#B9CDAE" stroke-width="2"/>
    </pattern>
    <pattern id="pullPattern" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#E8F0F7"/>
      <circle cx="2" cy="2" r="1.2" fill="#9FB6CD"/>
      <circle cx="6" cy="6" r="1.2" fill="#9FB6CD"/>
    </pattern>
    <pattern id="warnPattern" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="#F8ECE5"/>
      <path d="M-4 16 L16 -4 M8 20 L20 8" stroke="#E5C6B4" stroke-width="1"/>
    </pattern>
    <marker id="arrowGreen" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#587747"/>
    </marker>
    <marker id="arrowBlue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#476987"/>
    </marker>
    <marker id="arrowWarn" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#9A5D3A"/>
    </marker>
    <style>
      .text { font-family: Inter, Arial, Helvetica, sans-serif; fill: #292620; }
      .title { font-size: 25px; font-weight: 750; }
      .subtitle { font-size: 16px; fill: #514B42; }
      .panelTitle { font-size: 18px; font-weight: 750; letter-spacing: 0.7px; }
      .label { font-size: 16px; font-weight: 700; }
      .body { font-size: 15px; }
      .small { font-size: 13px; fill: #514B42; }
      .value { font-size: 18px; font-weight: 750; }
      .panel { fill: #FCFAF6; stroke: #B8AC9C; stroke-width: 2; }
      .cycleBox { fill: url(#cyclePattern); stroke: #587747; stroke-width: 2; }
      .pullBox { fill: url(#pullPattern); stroke: #476987; stroke-width: 2; }
      .warnBox { fill: url(#warnPattern); stroke: #9A5D3A; stroke-width: 2; }
      .state { fill: #FFFDF9; stroke: #49443C; stroke-width: 2; }
      .cycleArrow { fill: none; stroke: #587747; stroke-width: 3; marker-end: url(#arrowGreen); }
      .pullArrow { fill: none; stroke: #476987; stroke-width: 3; marker-end: url(#arrowBlue); }
      .warnArrow { fill: none; stroke: #9A5D3A; stroke-width: 3; marker-end: url(#arrowWarn); }
      .divider { stroke: #C8BEB0; stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="1200" height="720" fill="#F7F1E7"/>
  <text x="36" y="43" class="text title">Koopman pullback: preserve the mass, preserve the L2 norm</text>
  <text x="36" y="69" class="text subtitle">The same observable separates a measure-preserving cycle from a failed hypothesis.</text>

  <rect x="32" y="92" width="1136" height="350" rx="18" class="panel"/>
  <text x="56" y="125" class="text panelTitle">A. UNIFORM THREE-STATE CYCLE: ONE PREDECESSOR PER STATE</text>

  <rect x="54" y="146" width="382" height="270" rx="14" class="cycleBox"/>
  <text x="74" y="174" class="text label">State motion and original readings</text>
  <text x="74" y="197" class="text small">Each state has probability 1/3.</text>

  <path d="M158 274 C192 219 279 218 315 271" class="cycleArrow"/>
  <path d="M338 300 C330 360 249 385 189 349" class="cycleArrow"/>
  <path d="M146 332 C112 323 104 292 121 270" class="cycleArrow"/>

  <circle cx="135" cy="290" r="38" class="state"/>
  <circle cx="332" cy="290" r="38" class="state"/>
  <circle cx="228" cy="356" r="38" class="state"/>
  <text x="129" y="287" class="text label">a</text>
  <text x="122" y="309" class="text value">2</text>
  <text x="326" y="287" class="text label">b</text>
  <text x="316" y="309" class="text value">-1</text>
  <text x="222" y="353" class="text label">c</text>
  <text x="222" y="375" class="text value">4</text>
  <text x="74" y="397" class="text small">Values inside states are f(a), f(b), f(c).</text>

  <path d="M451 278 H500" class="pullArrow"/>
  <text x="451" y="256" class="text small">pull back</text>

  <rect x="510" y="146" width="634" height="270" rx="14" class="pullBox"/>
  <text x="530" y="174" class="text label">Observable rows in the fixed order (a, b, c)</text>
  <line x1="530" y1="202" x2="1122" y2="202" class="divider"/>

  <text x="545" y="235" class="text label">original f</text>
  <rect x="700" y="211" width="88" height="38" rx="8" class="state"/>
  <rect x="804" y="211" width="88" height="38" rx="8" class="state"/>
  <rect x="908" y="211" width="88" height="38" rx="8" class="state"/>
  <text x="740" y="236" class="text value">2</text>
  <text x="839" y="236" class="text value">-1</text>
  <text x="948" y="236" class="text value">4</text>
  <text x="1008" y="236" class="text small">L2 norm squared = 7</text>

  <text x="545" y="291" class="text label">pull back once</text>
  <rect x="700" y="267" width="88" height="38" rx="8" class="state"/>
  <rect x="804" y="267" width="88" height="38" rx="8" class="state"/>
  <rect x="908" y="267" width="88" height="38" rx="8" class="state"/>
  <text x="735" y="292" class="text value">-1</text>
  <text x="844" y="292" class="text value">4</text>
  <text x="948" y="292" class="text value">2</text>
  <text x="1008" y="292" class="text small">L2 norm squared = 7</text>

  <text x="545" y="347" class="text label">pull back twice</text>
  <rect x="700" y="323" width="88" height="38" rx="8" class="state"/>
  <rect x="804" y="323" width="88" height="38" rx="8" class="state"/>
  <rect x="908" y="323" width="88" height="38" rx="8" class="state"/>
  <text x="740" y="348" class="text value">4</text>
  <text x="844" y="348" class="text value">2</text>
  <text x="943" y="348" class="text value">-1</text>
  <text x="1008" y="348" class="text small">L2 norm squared = 7</text>

  <rect x="530" y="374" width="592" height="28" rx="7" fill="#FFFDF9" stroke="#587747" stroke-width="1.5"/>
  <text x="548" y="394" class="text small">Preimage counts (1, 1, 1): the pullback only permutes equal masses.</text>

  <rect x="32" y="464" width="1136" height="224" rx="18" class="warnBox"/>
  <text x="56" y="497" class="text panelTitle">B. COLLAPSE TO c: COMPOSITION SURVIVES, ISOMETRY DOES NOT</text>

  <circle cx="122" cy="576" r="31" class="state"/>
  <circle cx="246" cy="540" r="31" class="state"/>
  <circle cx="246" cy="622" r="31" class="state"/>
  <circle cx="420" cy="580" r="42" class="state"/>
  <text x="116" y="582" class="text label">a</text>
  <text x="240" y="546" class="text label">b</text>
  <text x="240" y="628" class="text label">c</text>
  <text x="414" y="575" class="text label">c</text>
  <text x="410" y="599" class="text value">4</text>
  <path d="M154 576 H367" class="warnArrow"/>
  <path d="M278 543 C326 544 343 555 372 568" class="warnArrow"/>
  <path d="M278 617 C326 612 344 601 372 590" class="warnArrow"/>
  <text x="74" y="659" class="text small">All three starting states read f(c) = 4.</text>

  <line x1="500" y1="516" x2="500" y2="660" class="divider"/>
  <text x="530" y="544" class="text label">Uniform-mass test</text>
  <text x="530" y="572" class="text body">cycle preimages: (1, 1, 1)</text>
  <text x="530" y="598" class="text body">collapse preimages: (0, 0, 3)</text>
  <text x="530" y="631" class="text label">Not measure preserving</text>

  <line x1="782" y1="516" x2="782" y2="660" class="divider"/>
  <text x="812" y="544" class="text label">Same observable, new pullback</text>
  <rect x="812" y="563" width="86" height="40" rx="8" class="state"/>
  <rect x="912" y="563" width="86" height="40" rx="8" class="state"/>
  <rect x="1012" y="563" width="86" height="40" rx="8" class="state"/>
  <text x="850" y="590" class="text value">4</text>
  <text x="950" y="590" class="text value">4</text>
  <text x="1050" y="590" class="text value">4</text>
  <text x="812" y="632" class="text label">L2 norm squared: 7 becomes 16</text>
  <text x="812" y="657" class="text small">No contradiction: the preservation gate failed.</text>
</svg>
