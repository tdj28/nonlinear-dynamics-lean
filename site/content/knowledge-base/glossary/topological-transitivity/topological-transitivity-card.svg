<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="transCardTitle transCardDesc">
  <title id="transCardTitle">Topological transitivity glossary card</title><desc id="transCardDesc">A point travels on a positive-time arrow from open region U to open region V.</desc>
  <rect width="1200" height="630" fill="#173f46"/><text x="70" y="100" font-family="system-ui,sans-serif" font-size="25" font-weight="700" fill="#77bdba">KNOWLEDGE BASE · GLOSSARY</text><text x="70" y="200" font-family="system-ui,sans-serif" font-size="59" font-weight="800" fill="#f7f2e8">Topological transitivity</text><text x="70" y="270" font-family="system-ui,sans-serif" font-size="28" fill="#d8e8e4">Some positive iterate connects every open-set pair.</text>
  <ellipse cx="300" cy="410" rx="165" ry="100" fill="#E8F0F7" stroke="#77bdba" stroke-width="4"/><ellipse cx="900" cy="410" rx="165" ry="100" fill="#F3E8E0" stroke="#f4c86a" stroke-width="4"/><circle cx="300" cy="410" r="14" fill="#173f46"/><circle cx="900" cy="410" r="14" fill="#173f46"/><path d="M326 393C480 300 690 300 874 393" fill="none" stroke="#f4c86a" stroke-width="8"/><text x="555" y="330" font-family="ui-monospace,monospace" font-size="28" fill="#f4c86a">n &gt; 0</text><text x="270" y="465" font-family="system-ui,sans-serif" font-size="30" font-weight="700" fill="#173f46">U</text><text x="870" y="465" font-family="system-ui,sans-serif" font-size="30" font-weight="700" fill="#173f46">V</text>
</svg>
