<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Undamped pendulum</title>
  <desc id="desc">A pendulum pose appears beside its normalized first-order vector field and energy.</desc>
  <rect width="1200" height="630" fill="#f1e9da"/><rect x="40" y="40" width="1120" height="550" rx="28" fill="#fffaf1" stroke="#315f63" stroke-width="4"/>
  <text x="78" y="105" font-family="system-ui,sans-serif" font-size="25" font-weight="750" fill="#2d7f73">KNOWLEDGE BASE · CONTINUOUS DYNAMICS</text>
  <text x="78" y="185" font-family="system-ui,sans-serif" font-size="54" font-weight="780" fill="#16324f">UNDAMPED PENDULUM</text>
  <circle cx="925" cy="145" r="12" fill="#263c3b"/><line x1="925" y1="145" x2="1055" y2="145" stroke="#315f63" stroke-width="10"/><circle cx="1055" cy="145" r="30" fill="#d18b3c" stroke="#874d3b" stroke-width="4"/>
  <rect x="105" y="270" width="990" height="100" rx="20" fill="#dfece3" stroke="#315f63" stroke-width="3"/><text x="600" y="333" text-anchor="middle" font-family="Georgia,serif" font-size="36" fill="#263c3b">angle′ = velocity · velocity′ = −κ sin(angle)</text>
  <rect x="105" y="407" width="990" height="88" rx="18" fill="#e4eef4"/><text x="600" y="463" text-anchor="middle" font-family="Georgia,serif" font-size="31" fill="#16324f">energy = velocity²/2 + κ(1 − cos(angle))</text>
  <text x="600" y="552" text-anchor="middle" font-family="system-ui,sans-serif" font-size="20" font-weight="650" fill="#874d3b">INSTANTANEOUS FIELD · REPEATED EQUILIBRIA · CONDITIONAL CONSERVATION</text>
</svg>
