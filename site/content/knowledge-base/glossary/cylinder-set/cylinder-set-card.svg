<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">Cylinder set</title><desc id="desc">Three symbolic sequences share a fixed blue prefix and have different orange tails.</desc><rect width="1200" height="630" fill="#f7f3e8"/><text x="70" y="95" font-family="system-ui,sans-serif" font-size="27" font-weight="700" fill="#2d7f73">KNOWLEDGE BASE · GLOSSARY</text><text x="70" y="190" font-family="system-ui,sans-serif" font-size="62" font-weight="800" fill="#17324d">Cylinder set</text><text x="70" y="255" font-family="system-ui,sans-serif" font-size="28" fill="#17324d">fix finitely many coordinates, leave the tail free</text><g font-family="ui-monospace,monospace" font-size="34" font-weight="700"><text x="85" y="355" fill="#17324d">0 1</text><text x="190" y="355" fill="#d96c3f">0 0 0 …</text><text x="85" y="420" fill="#17324d">0 1</text><text x="190" y="420" fill="#d96c3f">1 0 1 …</text><text x="85" y="485" fill="#17324d">0 1</text><text x="190" y="485" fill="#d96c3f">0 1 1 …</text></g><text x="70" y="570" font-family="system-ui,sans-serif" font-size="22" fill="#675d4f">Draft working note · professional review pending</text></svg>
