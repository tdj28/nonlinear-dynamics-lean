<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-labelledby="title desc"><title id="title">Fixed prefix with free tails</title><desc id="desc">Three rows share blue zero and one boxes, then continue with different orange symbols.</desc><rect width="760" height="300" rx="24" fill="#f7f3e8"/><g font-family="ui-monospace,monospace" font-size="20" font-weight="700" text-anchor="middle"><g fill="#17324d"><rect x="65" y="55" width="60" height="48" rx="9"/><rect x="133" y="55" width="60" height="48" rx="9"/><rect x="65" y="126" width="60" height="48" rx="9"/><rect x="133" y="126" width="60" height="48" rx="9"/><rect x="65" y="197" width="60" height="48" rx="9"/><rect x="133" y="197" width="60" height="48" rx="9"/></g><g fill="#fff"><text x="95" y="86">0</text><text x="163" y="86">1</text><text x="95" y="157">0</text><text x="163" y="157">1</text><text x="95" y="228">0</text><text x="163" y="228">1</text></g><g fill="#d96c3f"><text x="310" y="86">0 0 0 …</text><text x="310" y="157">1 0 1 …</text><text x="310" y="228">0 1 1 …</text></g></g><path d="M215 35V265" stroke="#2d7f73" stroke-width="3" stroke-dasharray="8 7"/><text x="515" y="116" font-family="system-ui,sans-serif" font-size="19" font-weight="700" fill="#17324d">fixed coordinates</text><text x="515" y="187" font-family="system-ui,sans-serif" font-size="19" font-weight="700" fill="#d96c3f">free coordinates</text></svg>
