<svg xmlns="http://www.w3.org/2000/svg" width="800" height="560"
     viewBox="0 0 800 560" role="img"
     aria-labelledby="nullCoverTitle nullCoverDesc">
  <title id="nullCoverTitle">Shrinking interval covers force one point to have zero uniform measure</title>
  <desc id="nullCoverDesc">Three zero-to-one number lines use the same scale. The point one half lies inside an open interval of length one half, then one fifth, then one twenty-fifth. The interval widths are proportional to their exact lengths. A conclusion panel says that the covers keep the point while their lengths approach zero.</desc>
  <defs>
    <linearGradient id="nullPaper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFDF8"/>
      <stop offset="1" stop-color="#EEE5D6"/>
    </linearGradient>
    <pattern id="nullCoverHatch" width="9" height="9" patternUnits="userSpaceOnUse"
             patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="9" stroke="#6F8D5E" stroke-width="3"/>
    </pattern>
  </defs>
  <rect width="800" height="560" fill="url(#nullPaper)"/>
  <style>
    .t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#2C2924}
    .title{font-family:Georgia,serif;font-size:25px;font-weight:700;fill:#16243A}
    .sub{font-size:14px;fill:#536070}
    .row{font-size:14px;font-weight:700;fill:#1F5A68}
    .tick{font-size:12px;fill:#536070}
    .label{font-size:13px;fill:#2C2924}
    .result{font-size:17px;font-weight:700;fill:#315F55}
  </style>

  <text x="34" y="40" class="title">Keep the point, shrink the cover</text>
  <text x="34" y="65" class="t sub">Every row uses the same zero-to-one scale, so the interval widths are directly comparable.</text>

  <line x1="370" y1="91" x2="370" y2="402" stroke="#9B3F2B" stroke-width="2" stroke-dasharray="5 7"/>
  <text x="382" y="105" class="t label" fill="#9B3F2B">the point 1/2 stays fixed</text>

  <g aria-label="Open interval from one quarter to three quarters, length one half">
    <text x="34" y="147" class="t row">n = 2</text>
    <line x1="120" y1="155" x2="620" y2="155" stroke="#7F786D" stroke-width="2"/>
    <rect x="245" y="137" width="250" height="36" rx="8" fill="url(#nullCoverHatch)" fill-opacity="0.45" stroke="#315F55" stroke-width="2"/>
    <circle cx="245" cy="155" r="7" fill="#FFFDF8" stroke="#315F55" stroke-width="2"/>
    <circle cx="495" cy="155" r="7" fill="#FFFDF8" stroke="#315F55" stroke-width="2"/>
    <circle cx="370" cy="155" r="7" fill="#9B3F2B" stroke="#FFFDF8" stroke-width="2"/>
    <line x1="120" y1="147" x2="120" y2="163" stroke="#2C2924" stroke-width="2"/>
    <line x1="620" y1="147" x2="620" y2="163" stroke="#2C2924" stroke-width="2"/>
    <text x="116" y="184" class="t tick">0</text>
    <text x="614" y="184" class="t tick">1</text>
    <text x="644" y="151" class="t label">(1/4, 3/4)</text>
    <text x="644" y="171" class="t label">length 1/2</text>
  </g>

  <g aria-label="Open interval from two fifths to three fifths, length one fifth">
    <text x="34" y="251" class="t row">n = 5</text>
    <line x1="120" y1="259" x2="620" y2="259" stroke="#7F786D" stroke-width="2"/>
    <rect x="320" y="241" width="100" height="36" rx="8" fill="url(#nullCoverHatch)" fill-opacity="0.45" stroke="#315F55" stroke-width="2"/>
    <circle cx="320" cy="259" r="7" fill="#FFFDF8" stroke="#315F55" stroke-width="2"/>
    <circle cx="420" cy="259" r="7" fill="#FFFDF8" stroke="#315F55" stroke-width="2"/>
    <circle cx="370" cy="259" r="7" fill="#9B3F2B" stroke="#FFFDF8" stroke-width="2"/>
    <line x1="120" y1="251" x2="120" y2="267" stroke="#2C2924" stroke-width="2"/>
    <line x1="620" y1="251" x2="620" y2="267" stroke="#2C2924" stroke-width="2"/>
    <text x="116" y="288" class="t tick">0</text>
    <text x="614" y="288" class="t tick">1</text>
    <text x="644" y="255" class="t label">(2/5, 3/5)</text>
    <text x="644" y="275" class="t label">length 1/5</text>
  </g>

  <g aria-label="Open interval from twelve twenty-fifths to thirteen twenty-fifths, length one twenty-fifth">
    <text x="34" y="355" class="t row">n = 25</text>
    <line x1="120" y1="363" x2="620" y2="363" stroke="#7F786D" stroke-width="2"/>
    <rect x="360" y="345" width="20" height="36" rx="5" fill="url(#nullCoverHatch)" fill-opacity="0.45" stroke="#315F55" stroke-width="2"/>
    <circle cx="360" cy="363" r="6" fill="#FFFDF8" stroke="#315F55" stroke-width="2"/>
    <circle cx="380" cy="363" r="6" fill="#FFFDF8" stroke="#315F55" stroke-width="2"/>
    <circle cx="370" cy="363" r="6" fill="#9B3F2B" stroke="#FFFDF8" stroke-width="2"/>
    <line x1="120" y1="355" x2="120" y2="371" stroke="#2C2924" stroke-width="2"/>
    <line x1="620" y1="355" x2="620" y2="371" stroke="#2C2924" stroke-width="2"/>
    <text x="116" y="392" class="t tick">0</text>
    <text x="614" y="392" class="t tick">1</text>
    <text x="644" y="359" class="t label">(12/25, 13/25)</text>
    <text x="644" y="379" class="t label">length 1/25</text>
  </g>

  <rect x="34" y="430" width="732" height="94" rx="14" fill="#EAF1E5" stroke="#6F8D5E" stroke-width="2"/>
  <text x="58" y="462" class="t result">The covers keep the point while their lengths approach zero.</text>
  <text x="58" y="489" class="t label">For every n at least 2, the point is inside a cover of length 1/n.</text>
  <text x="58" y="512" class="t label">Monotonicity turns those shrinking lengths into shrinking upper bounds on its mass.</text>
</svg>
