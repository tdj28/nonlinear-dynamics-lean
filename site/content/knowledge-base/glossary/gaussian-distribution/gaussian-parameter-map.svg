<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300"
     viewBox="0 0 760 300" role="img"
     aria-labelledby="gaussianTitle gaussianDesc">
  <title id="gaussianTitle">From a standard Gaussian law to a parameterized Gaussian law</title>
  <desc id="gaussianDesc">A standard law with mean zero and variance one is scaled to set variance, then shifted to set mean. Zero scaling produces a point mass.</desc>
  <rect width="760" height="300" fill="#F7F4F0"/>
  <style>
    .t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#2C2924}
    .title{font-size:15px;font-weight:700}.h{font-size:13px;font-weight:700}
    .s{font-size:12px}.m{font-size:11px;fill:#5A544C}
    .data{fill:#E8F0F7;stroke:#4B6787;stroke-width:1.5}
    .scale{fill:#F3E8E0;stroke:#A67C52;stroke-width:1.5}
    .shift{fill:#FBF9F6;stroke:#C4B8A8;stroke-width:1.5}
    .result{fill:#EAF1E5;stroke:#6F8D5E;stroke-width:1.5}
  </style>
  <defs>
    <marker id="gaussianArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#A67C52"/>
    </marker>
  </defs>
  <text x="24" y="28" class="t title">Two operations set the two Gaussian parameters</text>
  <text x="24" y="48" class="t m">Start from one standard law; scale first, then translate.</text>

  <rect x="24" y="82" width="156" height="112" rx="12" class="data"/>
  <text x="102" y="112" text-anchor="middle" class="t h">Standard law</text>
  <text x="102" y="139" text-anchor="middle" class="t s">mean: zero</text>
  <text x="102" y="160" text-anchor="middle" class="t s">variance: one</text>
  <text x="102" y="181" text-anchor="middle" class="t m">starting measure</text>

  <line x1="180" y1="138" x2="218" y2="138" stroke="#A67C52" stroke-width="2" marker-end="url(#gaussianArrow)"/>
  <rect x="226" y="82" width="142" height="112" rx="12" class="scale"/>
  <text x="297" y="112" text-anchor="middle" class="t h">Scale</text>
  <text x="297" y="139" text-anchor="middle" class="t s">multiply values by</text>
  <text x="297" y="160" text-anchor="middle" class="t s">square root of variance</text>
  <text x="297" y="181" text-anchor="middle" class="t m">sets spread</text>

  <line x1="368" y1="138" x2="406" y2="138" stroke="#A67C52" stroke-width="2" marker-end="url(#gaussianArrow)"/>
  <rect x="414" y="82" width="142" height="112" rx="12" class="shift"/>
  <text x="485" y="112" text-anchor="middle" class="t h">Translate</text>
  <text x="485" y="139" text-anchor="middle" class="t s">add the requested</text>
  <text x="485" y="160" text-anchor="middle" class="t s">mean to every value</text>
  <text x="485" y="181" text-anchor="middle" class="t m">sets center</text>

  <line x1="556" y1="138" x2="594" y2="138" stroke="#A67C52" stroke-width="2" marker-end="url(#gaussianArrow)"/>
  <rect x="602" y="82" width="134" height="112" rx="12" class="result"/>
  <text x="669" y="112" text-anchor="middle" class="t h">Exact law</text>
  <text x="669" y="139" text-anchor="middle" class="t s">requested mean</text>
  <text x="669" y="160" text-anchor="middle" class="t s">requested variance</text>
  <text x="669" y="181" text-anchor="middle" class="t m">parameterized measure</text>

  <rect x="24" y="232" width="712" height="44" rx="10" class="result"/>
  <text x="380" y="259" text-anchor="middle" class="t s">Zero scale is included: it collapses the law to a point mass at the mean.</text>
</svg>
