<svg xmlns="http://www.w3.org/2000/svg" width="960" height="660"
     viewBox="0 0 960 660" role="img"
     aria-labelledby="gaussianExampleTitle gaussianExampleDesc">
  <title id="gaussianExampleTitle">A Gaussian law with mean one and variance four</title>
  <desc id="gaussianExampleDesc">A symmetric bell curve is centered at one. The points minus one and three are each one standard deviation, equal to two, from the center and have equal density height. A side ledger distinguishes variance four from standard deviation two and positive density at one from zero probability at the exact point one. A lower panel shows reflection around one preserving the law, while the zero-variance boundary collapses all mass to a point at one.</desc>
  <defs>
    <linearGradient id="gaussianPaper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFDF8"/>
      <stop offset="1" stop-color="#EEE5D6"/>
    </linearGradient>
    <pattern id="spreadPattern" width="10" height="10" patternUnits="userSpaceOnUse"
             patternTransform="rotate(45)">
      <rect width="10" height="10" fill="#E8F0F7"/>
      <line x1="0" y1="0" x2="0" y2="10" stroke="#4B6787" stroke-width="2"/>
    </pattern>
    <pattern id="boundaryPattern" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F3E8E0"/>
      <circle cx="5" cy="5" r="1.8" fill="#9B3F2B"/>
    </pattern>
    <marker id="gaussianArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7F786D"/>
    </marker>
    <marker id="gaussianArrowStart" markerWidth="9" markerHeight="9" refX="1" refY="4.5"
            orient="auto" markerUnits="strokeWidth">
      <path d="M9,0 L0,4.5 L9,9 Z" fill="#4B6787"/>
    </marker>
  </defs>

  <rect width="960" height="660" fill="url(#gaussianPaper)"/>
  <style>
    .t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#2C2924}
    .title{font-family:Georgia,serif;font-size:25px;font-weight:700;fill:#16243A}
    .sub{font-size:14px;fill:#536070}
    .cap{font-size:13px;font-weight:700;letter-spacing:1.3px;fill:#1F5A68}
    .h{font-size:16px;font-weight:700}
    .s{font-size:13px}
    .m{font-size:12px;fill:#536070}
    .axis{stroke:#5A544C;stroke-width:1.8}
    .guide{stroke:#7F786D;stroke-width:1.5;stroke-dasharray:6 5}
    .curve{fill:#E8F0F7;fill-opacity:.58;stroke:#284E72;stroke-width:3}
    .panel{fill:#FFFDF8;stroke:#C4B8A8;stroke-width:1.8}
    .good{fill:#315F55}
    .warn{fill:#8B3022}
  </style>

  <text x="30" y="39" class="title">Mean 1 and variance 4: read the curve without confusing the parameters</text>
  <text x="30" y="64" class="t sub">The standard deviation is 2, equal distances have equal density, and a point height is not point probability.</text>

  <rect x="28" y="88" width="610" height="340" rx="15" class="panel"/>
  <text x="50" y="118" class="t cap">POSITIVE-VARIANCE LAW</text>
  <text x="50" y="141" class="t m">The curve is symmetric around the center value 1.</text>

  <path d="M74 357
           C135 357 179 346 221 301
           C260 259 290 164 333 148
           C342 145 350 143 358 143
           C366 143 374 145 383 148
           C426 164 456 259 495 301
           C537 346 581 357 614 357
           L614 357 L74 357 Z" class="curve"/>
  <line x1="72" y1="357" x2="616" y2="357" class="axis"/>

  <line x1="225" y1="297" x2="225" y2="357" class="guide"/>
  <line x1="358" y1="143" x2="358" y2="357" class="guide"/>
  <line x1="491" y1="297" x2="491" y2="357" class="guide"/>
  <line x1="225" y1="297" x2="491" y2="297" class="guide"/>
  <circle cx="225" cy="297" r="5" fill="#9B3F2B" stroke="#FFFDF8" stroke-width="2"/>
  <circle cx="491" cy="297" r="5" fill="#9B3F2B" stroke="#FFFDF8" stroke-width="2"/>
  <circle cx="358" cy="143" r="5" fill="#315F55" stroke="#FFFDF8" stroke-width="2"/>

  <text x="225" y="382" text-anchor="middle" class="t h">-1</text>
  <text x="358" y="382" text-anchor="middle" class="t h">1</text>
  <text x="491" y="382" text-anchor="middle" class="t h">3</text>
  <text x="358" y="406" text-anchor="middle" class="t m">center</text>

  <text x="358" y="283" text-anchor="middle" class="t s">equal density heights</text>
  <path d="M232 329 H351" fill="none" stroke="#4B6787" stroke-width="2"
        marker-start="url(#gaussianArrowStart)" marker-end="url(#gaussianArrow)"/>
  <path d="M365 329 H484" fill="none" stroke="#4B6787" stroke-width="2"
        marker-start="url(#gaussianArrowStart)" marker-end="url(#gaussianArrow)"/>
  <text x="291" y="322" text-anchor="middle" class="t m">distance 2</text>
  <text x="425" y="322" text-anchor="middle" class="t m">distance 2</text>

  <rect x="660" y="88" width="272" height="340" rx="15" class="panel"/>
  <text x="682" y="118" class="t cap">PARAMETER LEDGER</text>
  <text x="682" y="141" class="t m">Each number has a different job.</text>

  <rect x="682" y="159" width="228" height="54" rx="9" fill="#EAF1E5" stroke="#6F8D5E" stroke-width="1.5"/>
  <text x="700" y="181" class="t h good">mean: 1</text>
  <text x="700" y="201" class="t s">locates the center</text>

  <rect x="682" y="225" width="228" height="54" rx="9" fill="url(#spreadPattern)" stroke="#4B6787" stroke-width="1.5"/>
  <text x="700" y="247" class="t h">variance: 4</text>
  <text x="700" y="267" class="t s">squared spread parameter</text>

  <rect x="682" y="291" width="228" height="54" rx="9" fill="url(#spreadPattern)" stroke="#4B6787" stroke-width="1.5"/>
  <text x="700" y="313" class="t h">standard deviation: 2</text>
  <text x="700" y="333" class="t s">square root of the variance</text>

  <rect x="682" y="357" width="228" height="51" rx="9" fill="#F3E8E0" stroke="#A67C52" stroke-width="1.5"/>
  <text x="700" y="378" class="t h warn">at the exact point 1</text>
  <text x="700" y="398" class="t s">density positive; probability zero</text>

  <rect x="28" y="454" width="570" height="145" rx="15" class="panel"/>
  <text x="50" y="483" class="t cap">REFLECTION AROUND THE CENTER</text>
  <text x="50" y="506" class="t m">Values equally far from 1 exchange places, but the law stays the same.</text>

  <circle cx="112" cy="548" r="26" fill="url(#spreadPattern)" stroke="#4B6787" stroke-width="1.6"/>
  <text x="112" y="554" text-anchor="middle" class="t h">-1</text>
  <circle cx="234" cy="548" r="26" fill="url(#spreadPattern)" stroke="#4B6787" stroke-width="1.6"/>
  <text x="234" y="554" text-anchor="middle" class="t h">3</text>
  <path d="M145 540 C167 520 195 520 217 540" fill="none" stroke="#7F786D" stroke-width="2.2" marker-end="url(#gaussianArrow)"/>
  <path d="M217 556 C195 578 167 578 145 556" fill="none" stroke="#7F786D" stroke-width="2.2" marker-end="url(#gaussianArrow)"/>
  <text x="173" y="520" text-anchor="middle" class="t m">reflect</text>

  <rect x="286" y="526" width="286" height="49" rx="9" fill="#EAF1E5" stroke="#6F8D5E" stroke-width="1.5"/>
  <text x="429" y="547" text-anchor="middle" class="t h good">same Gaussian law</text>
  <text x="429" y="566" text-anchor="middle" class="t s">center and spread are unchanged</text>

  <rect x="620" y="454" width="312" height="145" rx="15" class="panel"/>
  <text x="642" y="483" class="t cap">ZERO-VARIANCE BOUNDARY</text>
  <text x="642" y="506" class="t m">The bell curve is replaced by a point mass.</text>
  <line x1="659" y1="560" x2="897" y2="560" class="axis"/>
  <line x1="780" y1="560" x2="780" y2="523" stroke="#8B3022" stroke-width="4"/>
  <circle cx="780" cy="523" r="8" fill="url(#boundaryPattern)" stroke="#8B3022" stroke-width="2"/>
  <text x="780" y="582" text-anchor="middle" class="t h">1</text>
  <text x="855" y="537" text-anchor="middle" class="t s warn">all mass here</text>

  <rect x="28" y="619" width="904" height="25" rx="10" fill="#EAF1E5" stroke="#6F8D5E" stroke-width="1.6"/>
  <text x="480" y="636" text-anchor="middle" class="t s">Positive variance: singleton probability is zero. Zero variance: the singleton at the mean has probability one.</text>
</svg>
