<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Forward stability</title>
  <desc id="desc">One initial delta interval feeds epsilon neighborhoods centered along a moving reference orbit.</desc>
  <rect width="1200" height="630" fill="#f1e9da"/>
  <rect x="38" y="38" width="1124" height="554" rx="28" fill="#fbf8f0" stroke="#315f63" stroke-width="4"/>
  <text x="76" y="104" font-family="Arial,sans-serif" font-size="21" letter-spacing="3" fill="#7a4d69">GLOSSARY · DISCRETE DYNAMICS</text>
  <text x="76" y="170" font-family="Georgia,serif" font-size="50" fill="#23343b">Forward stability</text>
  <path d="M115 400 C270 250 450 420 610 285 S860 380 1040 235" fill="none" stroke="#315f63" stroke-width="8"/>
  <path d="M115 435 C270 285 450 455 610 320 S860 415 1040 270" fill="none" stroke="#b24b40" stroke-width="6"/>
  <g fill="#e4efe9" stroke="#315f63" stroke-width="2"><circle cx="115" cy="400" r="55"/><circle cx="360" cy="319" r="55"/><circle cx="610" cy="285" r="55"/><circle cx="820" cy="334" r="55"/><circle cx="1040" cy="235" r="55"/></g>
  <text x="76" y="510" font-family="Arial,sans-serif" font-size="22" fill="#23343b">nearby starts remain close for every n ∈ ℕ</text>
  <text x="76" y="558" font-family="Arial,sans-serif" font-size="18" fill="#7a4d69">fixedness and attraction are separate conditions</text>
</svg>
