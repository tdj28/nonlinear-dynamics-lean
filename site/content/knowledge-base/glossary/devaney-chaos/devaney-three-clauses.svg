<svg xmlns="http://www.w3.org/2000/svg" width="760" height="310" viewBox="0 0 760 310" role="img" aria-labelledby="devTitle devDesc">
  <title id="devTitle">Three clauses of Devaney chaos and the finite boundary</title>
  <desc id="devDesc">Green cards mark transitivity and dense periodic points for a finite cycle. A clay sensitivity card is blocked by a singleton ball. A footer states that infinitude and a genuine metric enable the Banks implication.</desc>
  <rect width="760" height="310" fill="#F7F4F0"/>
  <style>.t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#2C2924}.title{font-size:15px;font-weight:700}.h{font-size:13px;font-weight:700}.s{font-size:12px}.m{font-size:11px;fill:#5A544C}.pass{fill:#EAF1E5;stroke:#6F8D5E;stroke-width:1.5}.stop{fill:#F3E8E0;stroke:#A67C52;stroke-width:1.5}</style>
  <text x="24" y="28" class="t title">The historical package has three separate jobs</text><text x="24" y="48" class="t m">The finite cycle checks why the third is not automatically redundant.</text>
  <rect x="24" y="78" width="216" height="120" rx="12" class="pass"/><rect x="272" y="78" width="216" height="120" rx="12" class="pass"/><rect x="520" y="78" width="216" height="120" rx="12" class="stop"/>
  <text x="44" y="105" class="t h">1. Transitivity</text><text x="44" y="130" class="t s">positive-time transport</text><text x="44" y="151" class="t s">between open sets</text><text x="44" y="177" class="t h">passes on the cycle</text>
  <text x="292" y="105" class="t h">2. Dense periodic points</text><text x="292" y="130" class="t s">every open set contains</text><text x="292" y="151" class="t s">a positive-period point</text><text x="292" y="177" class="t h">passes: every point</text>
  <text x="540" y="105" class="t h">3. Sensitivity</text><text x="540" y="130" class="t s">one metric scale in</text><text x="540" y="151" class="t s">every neighborhood</text><text x="540" y="177" class="t h">fails: singleton ball</text>
  <rect x="24" y="236" width="712" height="48" rx="9" fill="#E8F0F7" stroke="#4B6787"/><text x="45" y="256" class="t h">Banks boundary</text><text x="156" y="256" class="t s">continuous core + infinite genuine metric space</text><text x="481" y="256" class="t h">implies sensitivity</text><text x="45" y="274" class="t m">The implication does not erase the boundary hypotheses or the historical convention.</text>
</svg>
