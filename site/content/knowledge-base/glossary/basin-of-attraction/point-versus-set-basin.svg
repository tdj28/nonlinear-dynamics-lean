<svg xmlns="http://www.w3.org/2000/svg" width="760" height="280" viewBox="0 0 760 280" role="img" aria-labelledby="title desc">
  <title id="title">Point basin and set basin use different limiting statements</title>
  <desc id="desc">The left panel shows an orbit converging to one point p. The right shows an orbit whose distance to a nonempty set A shrinks without selecting one limiting point.</desc>
  <rect width="760" height="280" fill="#F7F4F0"/>
  <style>.t{font-family:Inter,Arial,sans-serif;fill:#2C2924}.title{font-size:16px;font-weight:700}.h{font-size:13px;font-weight:700}.s{font-size:12px}.m{font-size:11px;fill:#5A544C}.path{stroke:#4B6787;stroke-width:2.5;fill:none}</style>
  <text x="24" y="28" class="t title">Point and set basins agree on singletons</text><text x="24" y="49" class="t m">For larger sets, distance-to-set convergence does not select one point.</text>
  <rect x="24" y="72" width="336" height="158" rx="12" fill="#FBF9F6" stroke="#C4B8A8"/><text x="42" y="97" class="t h">point target</text>
  <path d="M63 185 C130 102 210 203 293 142" class="path"/><circle cx="293" cy="142" r="11" fill="#6F8D5E"/><text x="312" y="147" class="t h">p</text><text x="42" y="216" class="t s">the orbit itself tends to p</text>
  <rect x="400" y="72" width="336" height="158" rx="12" fill="#FBF9F6" stroke="#C4B8A8"/><text x="418" y="97" class="t h">nonempty set target</text>
  <path d="M437 189 C495 115 549 193 612 145" class="path"/><path d="M620 109 C687 110 711 151 678 201 C632 223 594 192 606 145 C607 129 611 117 620 109 Z" fill="#EAF1E5" stroke="#6F8D5E" stroke-width="2"/><text x="657" y="164" text-anchor="middle" class="t h">A</text><text x="418" y="216" class="t s">distance from the orbit to A tends to zero</text>
  <rect x="24" y="244" width="712" height="22" rx="7" fill="#F3E8E0" stroke="#A67C52"/><text x="380" y="260" text-anchor="middle" class="t s">For A = {p}, Mathlib's infimum distance is exactly the ordinary distance to p.</text>
</svg>
