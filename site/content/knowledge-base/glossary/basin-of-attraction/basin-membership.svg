<svg xmlns="http://www.w3.org/2000/svg" width="760" height="290" viewBox="0 0 760 290" role="img" aria-labelledby="title desc">
  <title id="title">Basin membership is determined by an orbit limit</title>
  <desc id="desc">Two initial points have paths converging to target p and lie inside the basin. A third path converges elsewhere and lies outside.</desc>
  <rect width="760" height="290" fill="#F7F4F0"/>
  <style>.t{font-family:Inter,Arial,sans-serif;fill:#2C2924}.title{font-size:16px;font-weight:700}.h{font-size:13px;font-weight:700}.s{font-size:12px}.m{font-size:11px;fill:#5A544C}.in{stroke:#4B6787;stroke-width:2.5;fill:none}.out{stroke:#A67C52;stroke-width:2.5;fill:none;stroke-dasharray:6 4}</style>
  <text x="24" y="28" class="t title">The basin collects starts with one specified limit</text><text x="24" y="49" class="t m">Finite prefixes may differ; the eventual destination determines membership.</text>
  <path d="M56 88 C173 58 333 73 430 126 C469 184 400 242 272 251 C147 254 57 211 47 153 C42 125 45 101 56 88 Z" fill="#E8F0F7" stroke="#4B6787" stroke-width="2"/>
  <text x="82" y="111" class="t h">basin B(p)</text>
  <circle cx="367" cy="171" r="11" fill="#6F8D5E"/><text x="384" y="176" class="t h">p</text>
  <circle cx="102" cy="143" r="7" fill="#4B6787"/><circle cx="145" cy="218" r="7" fill="#4B6787"/><circle cx="563" cy="104" r="7" fill="#A67C52"/>
  <path d="M110 143 C203 130 266 154 352 169" class="in"/><path d="M153 215 C230 210 287 185 352 173" class="in"/><path d="M556 110 C526 139 520 195 599 225" class="out"/>
  <circle cx="605" cy="229" r="11" fill="#A67C52"/><text x="622" y="234" class="t h">q</text>
  <rect x="24" y="258" width="712" height="22" rx="7" fill="#EAF1E5" stroke="#6F8D5E"/><text x="380" y="274" text-anchor="middle" class="t s">Inside means the full orbit tends to p, not merely that one iterate enters nearby.</text>
</svg>
