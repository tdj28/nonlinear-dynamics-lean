<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="measurable-space-title measurable-space-desc">
  <title id="measurable-space-title">A valid parity measurable space and an invalid event family on a six-sided die</title>
  <desc id="measurable-space-desc">The valid family contains the empty event, the odd faces, the even faces, and all six faces. Complement swaps odd and even, and union combines them into all faces. A tempting family containing only empty, even, and all faces is invalid because the complement of even, namely odd, is missing.</desc>
  <defs>
    <pattern id="even-stripes" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="10" height="10" fill="#d9e8e2"/>
      <rect width="4" height="10" fill="#3f7567"/>
    </pattern>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#3a3028" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#705947"/>
    </marker>
    <marker id="red-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a43d34"/>
    </marker>
    <style>
      .ink { fill: #29231e; }
      .muted { fill: #665b51; }
      .heading { font: 700 30px Georgia, serif; }
      .subheading { font: 700 21px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .body { font: 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .small { font: 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .set-label { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .face { font: 700 22px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; dominant-baseline: middle; }
    </style>
  </defs>

  <rect width="1200" height="700" rx="24" fill="#f7f0e3"/>
  <text x="48" y="52" class="heading ink">Which die-roll questions may the model ask?</text>
  <text x="48" y="79" class="body muted">A parity-only observation must include every complement and every countable union.</text>

  <rect x="40" y="105" width="735" height="550" rx="22" fill="#fffaf1" stroke="#9a7b5e" stroke-width="2" filter="url(#soft-shadow)"/>
  <rect x="795" y="105" width="365" height="550" rx="22" fill="#fffaf1" stroke="#9a7b5e" stroke-width="2" filter="url(#soft-shadow)"/>

  <text x="70" y="148" class="subheading ink">VALID: the parity event family</text>
  <text x="825" y="148" class="subheading ink">INVALID: one answer is missing</text>

  <text x="70" y="182" class="body muted">Six outcomes, observed only as odd or even</text>
  <g aria-label="Die faces one through six, grouped by parity">
    <circle cx="120" cy="230" r="31" fill="#f2c87c" stroke="#7c5729" stroke-width="3"/>
    <text x="120" y="230" class="face ink">1</text>
    <circle cx="215" cy="230" r="31" fill="url(#even-stripes)" stroke="#315f54" stroke-width="3"/>
    <text x="215" y="230" class="face ink">2</text>
    <circle cx="310" cy="230" r="31" fill="#f2c87c" stroke="#7c5729" stroke-width="3"/>
    <text x="310" y="230" class="face ink">3</text>
    <circle cx="405" cy="230" r="31" fill="url(#even-stripes)" stroke="#315f54" stroke-width="3"/>
    <text x="405" y="230" class="face ink">4</text>
    <circle cx="500" cy="230" r="31" fill="#f2c87c" stroke="#7c5729" stroke-width="3"/>
    <text x="500" y="230" class="face ink">5</text>
    <circle cx="595" cy="230" r="31" fill="url(#even-stripes)" stroke="#315f54" stroke-width="3"/>
    <text x="595" y="230" class="face ink">6</text>
  </g>
  <rect x="650" y="200" width="92" height="25" rx="12" fill="#f2c87c" stroke="#7c5729"/>
  <text x="696" y="218" class="small ink" text-anchor="middle">odd</text>
  <rect x="650" y="236" width="92" height="25" rx="12" fill="url(#even-stripes)" stroke="#315f54"/>
  <text x="696" y="254" class="small ink" text-anchor="middle">even</text>

  <text x="70" y="307" class="body ink">The four measurable events are:</text>
  <g aria-label="The four events in the valid measurable space">
    <rect x="70" y="330" width="155" height="105" rx="14" fill="#f3eee5" stroke="#73675d" stroke-width="2"/>
    <text x="147" y="360" class="set-label ink" text-anchor="middle">none</text>
    <text x="147" y="393" class="body muted" text-anchor="middle">empty set</text>

    <rect x="240" y="330" width="155" height="105" rx="14" fill="#fff0ce" stroke="#7c5729" stroke-width="2"/>
    <text x="317" y="360" class="set-label ink" text-anchor="middle">odd</text>
    <text x="317" y="393" class="body muted" text-anchor="middle">{1, 3, 5}</text>

    <rect x="410" y="330" width="155" height="105" rx="14" fill="url(#even-stripes)" stroke="#315f54" stroke-width="2"/>
    <rect x="420" y="340" width="135" height="85" rx="10" fill="#eaf3ef" fill-opacity="0.88"/>
    <text x="487" y="360" class="set-label ink" text-anchor="middle">even</text>
    <text x="487" y="393" class="body ink" text-anchor="middle">{2, 4, 6}</text>

    <rect x="580" y="330" width="155" height="105" rx="14" fill="#e7dccb" stroke="#705947" stroke-width="2"/>
    <text x="657" y="360" class="set-label ink" text-anchor="middle">all</text>
    <text x="657" y="393" class="body muted" text-anchor="middle">{1, 2, 3, 4, 5, 6}</text>
  </g>

  <path d="M 345 473 L 460 473" fill="none" stroke="#705947" stroke-width="3" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="402" y="515" class="small ink" text-anchor="middle">complement swaps them</text>
  <text x="70" y="575" class="body ink">odd union even = all six outcomes</text>
  <text x="70" y="607" class="small muted">Every complement and every union stays inside this four-event family.</text>

  <text x="825" y="190" class="body muted">Tempting collection:</text>
  <g aria-label="The invalid event family">
    <rect x="825" y="215" width="305" height="58" rx="12" fill="#f3eee5" stroke="#73675d" stroke-width="2"/>
    <text x="847" y="251" class="set-label ink">none</text>
    <rect x="825" y="288" width="305" height="58" rx="12" fill="#eaf3ef" stroke="#315f54" stroke-width="2"/>
    <text x="847" y="324" class="set-label ink">even {2, 4, 6}</text>
    <rect x="825" y="361" width="305" height="58" rx="12" fill="#e7dccb" stroke="#705947" stroke-width="2"/>
    <text x="847" y="397" class="set-label ink">all six outcomes</text>
  </g>

  <path d="M 1130 317 C 1150 327, 1148 445, 1112 465" fill="none" stroke="#a43d34" stroke-width="4" stroke-dasharray="8 7" marker-end="url(#red-arrow)"/>
  <text x="985" y="450" class="small ink">take complement</text>
  <rect x="825" y="470" width="305" height="72" rx="12" fill="#fff5f2" stroke="#a43d34" stroke-width="3" stroke-dasharray="9 6"/>
  <text x="847" y="500" class="set-label ink">MISSING: odd {1, 3, 5}</text>
  <text x="847" y="528" class="small muted">The complement of even must be available.</text>

  <rect x="825" y="565" width="305" height="58" rx="12" fill="#a43d34"/>
  <text x="977" y="601" class="set-label" fill="#ffffff" text-anchor="middle">Not a measurable space</text>
</svg>
