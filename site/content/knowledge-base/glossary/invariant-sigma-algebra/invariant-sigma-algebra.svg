<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400" role="img" aria-labelledby="invariantSigmaTitle invariantSigmaDesc">
  <title id="invariantSigmaTitle">Exact invariant sigma algebra</title>
  <desc id="invariantSigmaDesc">A four-state map has two backward-saturated basins. The set containing a and b has the same preimage and passes the exact invariant-set test. The singleton containing b gains predecessor a under preimage and fails.</desc>
  <defs>
    <marker id="invariantArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#A67C52"/>
    </marker>
  </defs>
  <style>
    .t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#2C2924}
    .title{font-size:16px;font-weight:700}
    .head{font-size:12px;font-weight:700;letter-spacing:.3px}
    .label{font-size:11px}
    .small{font-size:10px;fill:#5A544C}
    .neutral{fill:#FBF9F6;stroke:#C4B8A8;stroke-width:1.5}
    .blue{fill:#E8F0F7;stroke:#4B6787;stroke-width:1.5}
    .green{fill:#EAF1E5;stroke:#6F8D5E;stroke-width:1.5}
    .clay{fill:#F3E8E0;stroke:#A67C52;stroke-width:1.5}
    .node{fill:#FFFDF8;stroke:#4B6787;stroke-width:1.7}
    .arrow{fill:none;stroke:#A67C52;stroke-width:2;marker-end:url(#invariantArrow)}
  </style>
  <rect width="760" height="400" fill="#F7F4F0"/>
  <text x="24" y="29" class="t title">Exact invariant sigma algebra</text>
  <text x="24" y="49" class="t small">An event passes only when pulling it back through one time step changes nothing.</text>

  <rect x="24" y="72" width="302" height="294" rx="17" class="neutral"/>
  <text x="175" y="98" text-anchor="middle" class="t head">TOY STATE MAP</text>
  <rect x="48" y="115" width="254" height="96" rx="14" class="blue"/>
  <text x="60" y="135" class="t small">upper backward-saturated basin</text>
  <circle cx="105" cy="171" r="20" class="node"/>
  <circle cx="245" cy="171" r="20" class="node"/>
  <text x="105" y="175" text-anchor="middle" class="t head">a</text>
  <text x="245" y="175" text-anchor="middle" class="t head">b</text>
  <path d="M128 171 H218" class="arrow"/>
  <path d="M245 148 C287 125 296 184 268 187" class="arrow"/>

  <rect x="48" y="229" width="254" height="96" rx="14" class="green"/>
  <text x="60" y="249" class="t small">lower backward-saturated basin</text>
  <circle cx="105" cy="285" r="20" class="node"/>
  <circle cx="245" cy="285" r="20" class="node"/>
  <text x="105" y="289" text-anchor="middle" class="t head">c</text>
  <text x="245" y="289" text-anchor="middle" class="t head">d</text>
  <path d="M128 285 H218" class="arrow"/>
  <path d="M245 262 C287 239 296 298 268 301" class="arrow"/>
  <text x="175" y="349" text-anchor="middle" class="t small">one time-step map, named T</text>

  <rect x="348" y="72" width="388" height="294" rx="17" class="neutral"/>
  <text x="542" y="98" text-anchor="middle" class="t head">EXACT PREIMAGE TEST</text>

  <rect x="370" y="119" width="344" height="94" rx="14" class="green"/>
  <text x="390" y="144" class="t head">candidate event: {a, b}</text>
  <text x="390" y="169" class="t label">preimage under T: {a, b}</text>
  <rect x="584" y="176" width="108" height="24" rx="12" fill="#FFFDF8" stroke="#6F8D5E"/>
  <text x="638" y="192" text-anchor="middle" class="t head" fill="#315F55">EXACT PASS</text>

  <rect x="370" y="231" width="344" height="94" rx="14" class="clay"/>
  <text x="390" y="256" class="t head">candidate event: {b}</text>
  <text x="390" y="281" class="t label">preimage under T: {a, b}</text>
  <rect x="584" y="288" width="108" height="24" rx="12" fill="#FFFDF8" stroke="#A67C52"/>
  <text x="638" y="304" text-anchor="middle" class="t head" fill="#8B3E33">FAILS</text>
  <text x="542" y="348" text-anchor="middle" class="t small">the predecessor a cannot be omitted from an invariant event</text>
</svg>
