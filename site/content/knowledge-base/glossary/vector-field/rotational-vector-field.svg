<svg xmlns="http://www.w3.org/2000/svg" width="800" height="620" viewBox="0 0 800 620" role="img" aria-labelledby="title desc"><title id="title">Rotational vector field on the plane</title><desc id="desc">Eight points lie around a circle. Each has a counterclockwise tangent arrow. The origin is marked with a dot and the label zero vector.</desc><rect width="800" height="620" fill="#f7f1e5"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L10 3 L0 6 Z" fill="#874d3b"/></marker></defs><text x="45" y="62" font-family="system-ui" font-size="30" font-weight="700" fill="#183c3a">v(x,y) = (−y,x)</text><circle cx="395" cy="330" r="190" fill="none" stroke="#b8cfc3" stroke-width="3"/><g stroke="#874d3b" stroke-width="7" marker-end="url(#a)"><line x1="585" y1="330" x2="585" y2="245"/><line x1="529" y1="196" x2="469" y2="136"/><line x1="395" y1="140" x2="310" y2="140"/><line x1="261" y1="196" x2="201" y2="256"/><line x1="205" y1="330" x2="205" y2="415"/><line x1="261" y1="464" x2="321" y2="524"/><line x1="395" y1="520" x2="480" y2="520"/><line x1="529" y1="464" x2="589" y2="404"/></g><g fill="#315d4b"><circle cx="585" cy="330" r="7"/><circle cx="529" cy="196" r="7"/><circle cx="395" cy="140" r="7"/><circle cx="261" cy="196" r="7"/><circle cx="205" cy="330" r="7"/><circle cx="261" cy="464" r="7"/><circle cx="395" cy="520" r="7"/><circle cx="529" cy="464" r="7"/><circle cx="395" cy="330" r="10"/></g><text x="420" y="337" font-family="system-ui" font-size="22" fill="#263c3b">zero vector</text></svg>
