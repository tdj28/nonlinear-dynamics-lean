<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">Vector field</title><desc id="desc">Counterclockwise tangent arrows sit at points around a circle, with a zero vector at the center.</desc><rect width="1200" height="630" fill="#f7f1e5"/><text x="65" y="90" font-family="system-ui" font-size="28" font-weight="700" fill="#315d4b">GLOSSARY · DIFFERENTIAL EQUATIONS</text><text x="65" y="175" font-family="system-ui" font-size="62" font-weight="750" fill="#183c3a">VECTOR FIELD</text><text x="65" y="225" font-family="system-ui" font-size="26" fill="#263c3b">one tangent vector attached to every point</text><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L10 3 L0 6 Z" fill="#874d3b"/></marker></defs><circle cx="860" cy="350" r="190" fill="none" stroke="#b8cfc3" stroke-width="3"/><g stroke="#874d3b" stroke-width="9" marker-end="url(#a)"><line x1="1050" y1="350" x2="1050" y2="255"/><line x1="995" y1="215" x2="925" y2="145"/><line x1="860" y1="160" x2="765" y2="160"/><line x1="725" y1="215" x2="655" y2="285"/><line x1="670" y1="350" x2="670" y2="445"/><line x1="725" y1="485" x2="795" y2="555"/><line x1="860" y1="540" x2="955" y2="540"/><line x1="995" y1="485" x2="1065" y2="415"/></g><circle cx="860" cy="350" r="11" fill="#315d4b"/><text x="65" y="365" font-family="system-ui" font-size="34" fill="#874d3b">v(x,y) = (−y,x)</text><text x="65" y="430" font-family="system-ui" font-size="25" fill="#263c3b">direction + speed, not a completed trajectory</text></svg>
