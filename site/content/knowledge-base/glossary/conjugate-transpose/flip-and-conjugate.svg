<svg xmlns="http://www.w3.org/2000/svg" width="920" height="600"
     viewBox="0 0 920 600" role="img"
     aria-labelledby="conjTransposeTitle conjTransposeDesc">
  <title id="conjTransposeTitle">Flip a complex matrix across its diagonal, then conjugate its entries</title>
  <desc id="conjTransposeDesc">The original matrix has rows one, two plus i and minus three i, four. Transposition swaps the off-diagonal positions without changing their values. Complex conjugation then changes minus three i to three i and two plus i to two minus i, producing the conjugate transpose. A lower process diagram shows that a product applying B then A has an adjoint applying A conjugate transpose then B conjugate transpose, so the written factor order reverses.</desc>
  <rect width="920" height="600" fill="#F7F4F0"/>
  <style>
    .t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#2C2924}
    .title{font-size:17px;font-weight:700}
    .h{font-size:13px;font-weight:700;letter-spacing:.35px}
    .body{font-size:13px}
    .small{font-size:12px}
    .muted{font-size:11px;fill:#5A544C}
    .panel{fill:#FBF9F6;stroke:#A89C8E;stroke-width:1.6}
    .blue{fill:#E8F0F7;stroke:#4B6787;stroke-width:1.6}
    .clay{fill:#F3E8E0;stroke:#95653E;stroke-width:1.6}
    .green{fill:#EAF1E5;stroke:#5F7F50;stroke-width:1.7}
    .gold{fill:#F5EDD9;stroke:#9A772F;stroke-width:1.6}
    .arrow{fill:none;stroke:#95653E;stroke-width:2.1}
  </style>
  <defs>
    <marker id="conjTransposeArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#95653E"/>
    </marker>
  </defs>

  <text x="24" y="30" class="t title">Conjugate transpose = flip positions + conjugate values</text>
  <text x="24" y="51" class="t muted">The two stages are shown separately so transpose, entrywise conjugation, and conjugate transpose cannot be confused.</text>

  <rect x="24" y="76" width="250" height="260" rx="14" class="blue"/>
  <text x="44" y="103" class="t h">1. ORIGINAL MATRIX A</text>
  <rect x="58" y="130" width="90" height="74" rx="9" class="panel"/>
  <rect x="148" y="130" width="90" height="74" rx="9" class="clay"/>
  <rect x="58" y="204" width="90" height="74" rx="9" class="gold"/>
  <rect x="148" y="204" width="90" height="74" rx="9" class="panel"/>
  <text x="98" y="175" class="t title">1</text>
  <text x="174" y="175" class="t title">2+i</text>
  <text x="84" y="249" class="t title">-3i</text>
  <text x="188" y="249" class="t title">4</text>
  <text x="44" y="307" class="t muted">Off-diagonal values occupy different cells.</text>

  <text x="293" y="158" class="t h">FLIP</text>
  <text x="283" y="178" class="t muted">i,j to j,i</text>
  <path d="M274 205 L332 205" class="arrow" marker-end="url(#conjTransposeArrow)"/>

  <rect x="342" y="76" width="250" height="260" rx="14" class="clay"/>
  <text x="362" y="103" class="t h">2. TRANSPOSE A^T</text>
  <rect x="376" y="130" width="90" height="74" rx="9" class="panel"/>
  <rect x="466" y="130" width="90" height="74" rx="9" class="gold"/>
  <rect x="376" y="204" width="90" height="74" rx="9" class="clay"/>
  <rect x="466" y="204" width="90" height="74" rx="9" class="panel"/>
  <text x="416" y="175" class="t title">1</text>
  <text x="492" y="175" class="t title">-3i</text>
  <text x="402" y="249" class="t title">2+i</text>
  <text x="506" y="249" class="t title">4</text>
  <text x="362" y="307" class="t muted">Positions changed; scalar values did not.</text>

  <text x="610" y="158" class="t h">STAR</text>
  <text x="608" y="178" class="t muted">i to -i</text>
  <path d="M592 205 L650 205" class="arrow" marker-end="url(#conjTransposeArrow)"/>

  <rect x="660" y="76" width="236" height="260" rx="14" class="green"/>
  <text x="680" y="103" class="t h">3. RESULT: A^H</text>
  <text x="680" y="121" class="t muted">conjugate transpose</text>
  <rect x="694" y="130" width="84" height="74" rx="9" class="panel"/>
  <rect x="778" y="130" width="84" height="74" rx="9" class="gold"/>
  <rect x="694" y="204" width="84" height="74" rx="9" class="clay"/>
  <rect x="778" y="204" width="84" height="74" rx="9" class="panel"/>
  <text x="730" y="175" class="t title">1</text>
  <text x="806" y="175" class="t title">3i</text>
  <text x="716" y="249" class="t title">2-i</text>
  <text x="814" y="249" class="t title">4</text>
  <text x="680" y="307" class="t muted">Positions and complex signs changed.</text>

  <rect x="24" y="362" width="872" height="208" rx="14" class="panel"/>
  <text x="44" y="390" class="t h">WHY A PRODUCT REVERSES ORDER</text>
  <text x="44" y="414" class="t body">Forward action of A B on a column vector:</text>
  <rect x="44" y="431" width="88" height="48" rx="9" class="blue"/>
  <text x="83" y="461" class="t h">x</text>
  <path d="M132 455 L196 455" class="arrow" marker-end="url(#conjTransposeArrow)"/>
  <text x="154" y="444" class="t small">apply B</text>
  <rect x="208" y="431" width="108" height="48" rx="9" class="clay"/>
  <text x="252" y="461" class="t h">B x</text>
  <path d="M316 455 L380 455" class="arrow" marker-end="url(#conjTransposeArrow)"/>
  <text x="338" y="444" class="t small">apply A</text>
  <rect x="392" y="431" width="126" height="48" rx="9" class="green"/>
  <text x="432" y="461" class="t h">A B x</text>

  <text x="44" y="514" class="t body">Adjoint action starts with A^H, then B^H:</text>
  <rect x="326" y="496" width="92" height="48" rx="9" class="blue"/>
  <text x="367" y="526" class="t h">y</text>
  <path d="M418 520 L482 520" class="arrow" marker-end="url(#conjTransposeArrow)"/>
  <text x="433" y="509" class="t small">apply A^H</text>
  <rect x="494" y="496" width="126" height="48" rx="9" class="clay"/>
  <text x="533" y="526" class="t h">A^H y</text>
  <path d="M620 520 L684 520" class="arrow" marker-end="url(#conjTransposeArrow)"/>
  <text x="635" y="509" class="t small">apply B^H</text>
  <rect x="696" y="496" width="180" height="48" rx="9" class="green"/>
  <text x="739" y="526" class="t h">B^H A^H y</text>
  <text x="548" y="463" class="t title">(A B)^H = B^H A^H</text>
</svg>
