<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">Symbolic dynamics</title><desc id="desc">Orbit states map to a row of symbols, and a shift arrow advances the row.</desc><rect width="1200" height="630" fill="#f7f3e8"/><text x="70" y="95" font-family="system-ui,sans-serif" font-size="27" font-weight="700" fill="#2d7f73">KNOWLEDGE BASE · GLOSSARY</text><text x="70" y="190" font-family="system-ui,sans-serif" font-size="62" font-weight="800" fill="#17324d">Symbolic dynamics</text><text x="70" y="265" font-family="system-ui,sans-serif" font-size="28" fill="#17324d">record one symbol per update</text><text x="90" y="390" font-family="ui-monospace,monospace" font-size="55" font-weight="700" fill="#d96c3f">0  1  1  0  1  …</text><path d="M120 445H800" stroke="#2d7f73" stroke-width="8"/><path d="M800 445L765 423V467Z" fill="#2d7f73"/><text x="850" y="458" font-family="system-ui,sans-serif" font-size="30" font-weight="700" fill="#17324d">left shift</text><text x="70" y="570" font-family="system-ui,sans-serif" font-size="22" fill="#675d4f">Draft working note · professional review pending</text></svg>
