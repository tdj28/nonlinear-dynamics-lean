<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-labelledby="title desc"><title id="title">Orbit labels form an itinerary</title><desc id="desc">Four orbit states advance left to right; downward arrows map them to four labels in a sequence.</desc><rect width="760" height="300" rx="24" fill="#f7f3e8"/><g font-family="system-ui,sans-serif" text-anchor="middle"><g fill="#17324d"><circle cx="90" cy="80" r="31"/><circle cx="270" cy="80" r="31"/><circle cx="450" cy="80" r="31"/><circle cx="630" cy="80" r="31"/></g><g fill="#fff" font-size="16"><text x="90" y="86">x</text><text x="270" y="86">f(x)</text><text x="450" y="86">f²(x)</text><text x="630" y="86">f³(x)</text></g><g stroke="#2d7f73" stroke-width="4"><path d="M125 80H235"/><path d="M305 80H415"/><path d="M485 80H595"/></g><g stroke="#d96c3f" stroke-width="3"><path d="M90 115V184"/><path d="M270 115V184"/><path d="M450 115V184"/><path d="M630 115V184"/></g><g fill="#d96c3f" font-size="24" font-weight="700"><text x="90" y="225">ℓ₀</text><text x="270" y="225">ℓ₁</text><text x="450" y="225">ℓ₂</text><text x="630" y="225">ℓ₃</text></g><text x="360" y="273" fill="#675d4f" font-size="17">one label for each natural-number time</text></g></svg>
