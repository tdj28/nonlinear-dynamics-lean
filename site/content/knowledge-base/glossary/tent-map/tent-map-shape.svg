<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" role="img" aria-labelledby="title desc">
  <title id="title">The two branches of the tent map</title>
  <desc id="desc">A rising affine branch and a falling affine branch meet at the midpoint with peak height s divided by two. Mirrored states have the same image.</desc>
  <rect width="760" height="420" fill="#F7F4F0"/>
  <style>.t{font-family:Inter,Arial,sans-serif;fill:#2C2924}.h{font-size:19px;font-weight:700}.s{font-size:14px}.m{font-size:12px;fill:#5A544C}.axis{stroke:#7F786D;stroke-width:2}.tent{stroke:#4B6787;stroke-width:7;fill:none}</style>
  <text x="24" y="34" class="t h">One continuous tent from two affine rules</text>
  <text x="24" y="56" class="t m">The state runs from zero to one; the parameter s fixes the two slope magnitudes.</text>
  <line x1="90" y1="330" x2="680" y2="330" class="axis"/>
  <line x1="110" y1="354" x2="110" y2="92" class="axis"/>
  <path d="M110 330 L385 110 L660 330" class="tent"/>
  <circle cx="385" cy="110" r="9" fill="#D18B3C"/>
  <text x="405" y="112" class="t s">peak s / 2</text>
  <text x="190" y="250" class="t h">left rule: s times x</text>
  <text x="430" y="250" class="t h">right rule: s times (1 - x)</text>
  <circle cx="275" cy="198" r="7" fill="#315F63"/><circle cx="495" cy="198" r="7" fill="#315F63"/>
  <path d="M282 184 Q385 132 488 184" fill="none" stroke="#A67C52" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="385" y="168" text-anchor="middle" class="t s">mirrored states, equal images</text>
  <text x="104" y="354" class="t s">0</text><text x="378" y="354" class="t s">1 / 2</text><text x="654" y="354" class="t s">1</text>
  <rect x="24" y="376" width="712" height="32" rx="10" fill="#EAF1E5" stroke="#6F8D5E"/>
  <text x="380" y="397" text-anchor="middle" class="t s">The formulas agree at the midpoint, so the total map is continuous.</text>
</svg>
