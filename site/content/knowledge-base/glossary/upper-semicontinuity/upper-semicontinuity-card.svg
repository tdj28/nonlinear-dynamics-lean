<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Upper semicontinuity</title>
  <desc id="desc">A glossary card showing nearby values below an epsilon roof while downward jumps remain allowed.</desc>
  <rect width="1200" height="630" fill="#f1e9da"/>
  <rect x="38" y="38" width="1124" height="554" rx="28" fill="#fbf8f0" stroke="#315f63" stroke-width="4"/>
  <text x="76" y="104" font-family="Arial,sans-serif" font-size="21" letter-spacing="3" fill="#7a4d69">GLOSSARY · ONE-SIDED CONTINUITY</text>
  <text x="76" y="180" font-family="Georgia,serif" font-size="55" fill="#23343b">Upper semicontinuity</text>
  <text x="76" y="245" font-family="Georgia,serif" font-size="34" fill="#315f63">lim sup f(x_j) ≤ f(x)</text>
  <line x1="100" y1="330" x2="1090" y2="330" stroke="#b24b40" stroke-width="5"/>
  <text x="850" y="312" font-family="Arial,sans-serif" font-size="21" fill="#b24b40">epsilon roof</text>
  <g fill="#315f63"><circle cx="170" cy="390" r="11"/><circle cx="310" cy="365" r="11"/><circle cx="450" cy="420" r="11"/><circle cx="600" cy="375" r="13"/><circle cx="750" cy="500" r="11"/><circle cx="890" cy="400" r="11"/><circle cx="1030" cy="370" r="11"/></g>
  <text x="76" y="550" font-family="Arial,sans-serif" font-size="19" fill="#7a4d69">upward displacement controlled · downward jumps permitted · professional review pending</text>
</svg>
