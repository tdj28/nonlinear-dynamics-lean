<svg xmlns="http://www.w3.org/2000/svg" width="760" height="410"
     viewBox="0 0 760 410" role="img"
     aria-labelledby="finiteMaxTitle finiteMaxDesc">
  <title id="finiteMaxTitle">Strict finite maximal event and one-step peeling</title>
  <desc id="finiteMaxDesc">Time zero anchors a conceptual sequence of finite partial sums at zero. A later positive maximum enters the strict event, and a second panel explains that its first orbit value is peeled before comparison with the shifted running maximum.</desc>
  <rect width="760" height="410" fill="#F7F4F0"/>
  <style>
    .t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#2C2924}
    .title{font-size:15px;font-weight:700}
    .h{font-size:13px;font-weight:700}
    .s{font-size:12px}
    .m{font-size:11px;fill:#5A544C}
    .neutral{fill:#FBF9F6;stroke:#C4B8A8;stroke-width:1.5}
    .data{fill:#E8F0F7;stroke:#4B6787;stroke-width:1.5}
    .kept{fill:#EAF1E5;stroke:#6F8D5E;stroke-width:1.5}
    .warn{fill:#F3E8E0;stroke:#A67C52;stroke-width:1.5}
  </style>
  <text x="24" y="28" class="t title">Strict positivity makes the finite maximum informative</text>
  <text x="24" y="48" class="t m">Time zero supplies the baseline; a positive-time maximizer supplies the peelable witness.</text>

  <rect class="neutral" x="24" y="70" width="430" height="250" rx="12"/>
  <text x="44" y="98" class="t h">Conceptual finite partial sums</text>
  <line x1="62" y1="238" x2="420" y2="238" stroke="#7F786D" stroke-width="1.5"/>
  <line x1="62" y1="122" x2="62" y2="274" stroke="#7F786D" stroke-width="1.5"/>
  <text x="43" y="242" class="t m">zero</text>
  <polyline points="82,238 152,205 222,254 292,157 362,187 414,143"
            fill="none" stroke="#4B6787" stroke-width="3"/>
  <circle cx="82" cy="238" r="6" fill="#FBF9F6" stroke="#2C2924" stroke-width="1.5"/>
  <circle cx="152" cy="205" r="6" fill="#E8F0F7" stroke="#4B6787" stroke-width="1.5"/>
  <circle cx="222" cy="254" r="6" fill="#E8F0F7" stroke="#4B6787" stroke-width="1.5"/>
  <circle cx="292" cy="157" r="8" fill="#EAF1E5" stroke="#6F8D5E" stroke-width="2"/>
  <circle cx="362" cy="187" r="6" fill="#E8F0F7" stroke="#4B6787" stroke-width="1.5"/>
  <circle cx="414" cy="143" r="8" fill="#EAF1E5" stroke="#6F8D5E" stroke-width="2"/>
  <text x="75" y="296" class="t m">time 0</text>
  <text x="198" y="296" class="t m">positive horizons</text>
  <text x="276" y="138" class="t s">positive witness</text>
  <path d="M338 132 L392 144" fill="none" stroke="#A67C52" stroke-width="2"/>
  <polygon points="394,144 384,138 386,149" fill="#A67C52"/>

  <rect class="kept" x="478" y="70" width="258" height="112" rx="12"/>
  <text x="500" y="99" class="t h">STRICT EVENT</text>
  <text x="500" y="125" class="t s">A positive maximum cannot</text>
  <text x="500" y="146" class="t s">be attained only at time zero.</text>
  <text x="500" y="167" class="t m">A positive-time index exists.</text>

  <rect class="warn" x="478" y="198" width="258" height="122" rx="12"/>
  <text x="500" y="227" class="t h">ONE-STEP PEEL</text>
  <text x="500" y="253" class="t s">first orbit value</text>
  <path d="M604 249 L654 249" fill="none" stroke="#A67C52" stroke-width="2.5"/>
  <polygon points="657,249 645,242 645,256" fill="#A67C52"/>
  <text x="500" y="281" class="t s">shifted running maximum</text>
  <text x="500" y="305" class="t m">The two maxima later cancel in the integral.</text>

  <rect class="kept" x="24" y="342" width="712" height="44" rx="10"/>
  <text x="44" y="369" class="t s">Strict selection + first-summand peeling + measure-preserving cancellation = nonnegative event integral.</text>
</svg>
