<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="660"
     viewBox="0 0 1000 660" role="img"
     aria-labelledby="normalizedScalingTitle normalizedScalingDesc">
  <title id="normalizedScalingTitle">Two atom ledgers keep average two under scaling and probability normalization</title>
  <desc id="normalizedScalingDesc">Three labeled rows calculate every atom contribution. Original weights two and one on values one and four give contributions two and four, mass three, integral six, and average two. Fivefold weights ten and five give contributions ten and twenty, mass fifteen, integral thirty, and average two. Probability weights two thirds and one third give contributions two thirds and four thirds, total mass one, and expectation two. Position, labels, equations in plain text, borders, and repeated results carry the comparison without relying on color.</desc>
  <rect width="1000" height="660" fill="#F7F4F0"/>
  <style>
    .t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#2C2924}
    .title{font-size:18px;font-weight:700}.h{font-size:14px;font-weight:700}
    .s{font-size:13px}.m{font-size:12px;fill:#5A544C}
    .tag{font-size:11px;font-weight:700;letter-spacing:.6px}
    .cream{fill:#FBF9F6;stroke:#C4B8A8;stroke-width:1.6}
    .blue{fill:#E8F0F7;stroke:#4B6787;stroke-width:1.6}
    .green{fill:#EAF1E5;stroke:#6F8D5E;stroke-width:1.6}
    .clay{fill:#F3E8E0;stroke:#A67C52;stroke-width:1.6}
    .divider{stroke:#A89B8C;stroke-width:1.3;stroke-dasharray:5 4}
  </style>

  <text x="28" y="32" class="t title">One weighted average, three exact ledgers</text>
  <text x="28" y="54" class="t m">Each row multiplies atom weight by atom value, adds contributions, then divides by total mass.</text>

  <rect x="24" y="76" width="952" height="158" rx="14" class="cream"/>
  <rect x="42" y="94" width="164" height="25" rx="12" fill="#7F786D"/>
  <text x="124" y="111" text-anchor="middle" class="t tag" style="fill:#FFFDF8">ORIGINAL WEIGHTS</text>

  <rect x="42" y="132" width="260" height="78" rx="10" class="blue"/>
  <text x="60" y="153" class="t h">ATOM p</text>
  <text x="60" y="176" class="t s">weight 2 x value 1</text>
  <text x="60" y="197" class="t h">contribution = 2</text>

  <rect x="318" y="132" width="260" height="78" rx="10" class="clay"/>
  <text x="336" y="153" class="t h">ATOM q</text>
  <text x="336" y="176" class="t s">weight 1 x value 4</text>
  <text x="336" y="197" class="t h">contribution = 4</text>

  <rect x="598" y="94" width="352" height="116" rx="11" class="green"/>
  <text x="620" y="120" class="t h">ADD THE TWO LEDGERS</text>
  <text x="620" y="145" class="t s">mass: 2 + 1 = 3</text>
  <text x="620" y="169" class="t s">integral: 2 + 4 = 6</text>
  <line x1="620" y1="181" x2="928" y2="181" class="divider"/>
  <text x="620" y="200" class="t h">average: 6 / 3 = 2</text>

  <rect x="24" y="250" width="952" height="158" rx="14" class="blue"/>
  <rect x="42" y="268" width="204" height="25" rx="12" fill="#4B6787"/>
  <text x="144" y="285" text-anchor="middle" class="t tag" style="fill:#FFFDF8">MULTIPLY MASS BY 5</text>

  <rect x="42" y="306" width="260" height="78" rx="10" class="cream"/>
  <text x="60" y="327" class="t h">ATOM p</text>
  <text x="60" y="350" class="t s">weight 10 x value 1</text>
  <text x="60" y="371" class="t h">contribution = 10</text>

  <rect x="318" y="306" width="260" height="78" rx="10" class="clay"/>
  <text x="336" y="327" class="t h">ATOM q</text>
  <text x="336" y="350" class="t s">weight 5 x value 4</text>
  <text x="336" y="371" class="t h">contribution = 20</text>

  <rect x="598" y="268" width="352" height="116" rx="11" class="green"/>
  <text x="620" y="294" class="t h">BOTH TOTALS GROW FIVEFOLD</text>
  <text x="620" y="319" class="t s">mass: 10 + 5 = 15</text>
  <text x="620" y="343" class="t s">integral: 10 + 20 = 30</text>
  <line x1="620" y1="355" x2="928" y2="355" class="divider"/>
  <text x="620" y="374" class="t h">average: 30 / 15 = 2</text>

  <rect x="24" y="424" width="952" height="158" rx="14" class="green"/>
  <rect x="42" y="442" width="230" height="25" rx="12" fill="#6F8D5E"/>
  <text x="157" y="459" text-anchor="middle" class="t tag" style="fill:#FFFDF8">DIVIDE MASS BY 3</text>

  <rect x="42" y="480" width="260" height="78" rx="10" class="blue"/>
  <text x="60" y="501" class="t h">ATOM p</text>
  <text x="60" y="524" class="t s">probability 2/3 x value 1</text>
  <text x="60" y="545" class="t h">contribution = 2/3</text>

  <rect x="318" y="480" width="260" height="78" rx="10" class="clay"/>
  <text x="336" y="501" class="t h">ATOM q</text>
  <text x="336" y="524" class="t s">probability 1/3 x value 4</text>
  <text x="336" y="545" class="t h">contribution = 4/3</text>

  <rect x="598" y="442" width="352" height="116" rx="11" class="cream"/>
  <text x="620" y="468" class="t h">PROBABILITY MASS IS ONE</text>
  <text x="620" y="493" class="t s">mass: 2/3 + 1/3 = 1</text>
  <text x="620" y="517" class="t s">integral: 2/3 + 4/3 = 2</text>
  <line x1="620" y1="529" x2="928" y2="529" class="divider"/>
  <text x="620" y="548" class="t h">average = integral = expectation = 2</text>

  <rect x="24" y="602" width="952" height="38" rx="10" class="clay"/>
  <text x="500" y="626" text-anchor="middle" class="t s">Common scaling changes mass and integral together; changing relative weights can change the average.</text>
</svg>
