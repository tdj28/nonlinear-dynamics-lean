<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1000"
     viewBox="0 0 1200 1000" role="img"
     aria-labelledby="gueN2Title gueN2Desc">
  <title id="gueN2Title">The size-two Wigner-scaled Gaussian unitary ensemble and its first two moments</title>
  <desc id="gueN2Desc">Four independent centered real Gaussian variables assemble into a two by two Hermitian matrix. The two diagonal variables have variance one half, while the real and imaginary parts of the upper entry have variance one quarter. The expected trace is zero, the expected trace square is two, and dividing the second trace moment by the matrix dimension gives expected empirical spectral second moment one. A footer distinguishes the dimension-zero value zero from the positive-dimensional value one.</desc>
  <defs>
    <pattern id="diagDots" width="12" height="12" patternUnits="userSpaceOnUse">
      <rect width="12" height="12" fill="#EAF4E7"/>
      <circle cx="3" cy="3" r="1.4" fill="#4E7A59"/>
      <circle cx="9" cy="9" r="1.4" fill="#4E7A59"/>
    </pattern>
    <pattern id="upperGrid" width="14" height="14" patternUnits="userSpaceOnUse">
      <rect width="14" height="14" fill="#EAF1F8"/>
      <path d="M0 0H14M0 7H14M0 14H14M0 0V14M7 0V14M14 0V14"
            fill="none" stroke="#7390AD" stroke-width="1"/>
    </pattern>
    <pattern id="spectralStripe" width="12" height="12" patternUnits="userSpaceOnUse"
             patternTransform="rotate(45)">
      <rect width="12" height="12" fill="#F2ECF8"/>
      <path d="M0 0V12" stroke="#8667A2" stroke-width="3"/>
    </pattern>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#372D25" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#695A4C"/>
    </marker>
    <style>
      .ink { fill: #2E2924; font-family: Inter, Arial, Helvetica, sans-serif; }
      .serif { fill: #2E2924; font-family: Georgia, 'Times New Roman', serif; }
      .title { font-size: 34px; font-weight: 700; }
      .subtitle { fill: #685E55; font-size: 17px; }
      .panel-title { font-size: 22px; font-weight: 700; }
      .label { font-size: 17px; font-weight: 700; }
      .body { font-size: 16px; }
      .small { fill: #685E55; font-size: 14px; }
      .math { font-size: 20px; font-weight: 600; }
    </style>
  </defs>

  <rect width="1200" height="1000" rx="24" fill="#F7F0E4"/>
  <text x="48" y="54" class="serif title">Size two: Wigner scaling makes the spectral second moment one</text>
  <text x="48" y="84" class="ink subtitle">The calculation begins with four independent real Gaussian coordinates, not with eigenvalues.</text>

  <g filter="url(#shadow)">
    <rect x="40" y="112" width="414" height="342" rx="20" fill="#FFFDFC" stroke="#A67B50" stroke-width="2"/>
  </g>
  <text x="68" y="151" class="ink panel-title">1. Coordinate law</text>
  <text x="68" y="180" class="ink small">All four real variables are centered and mutually independent.</text>
  <g class="ink">
    <rect x="68" y="206" width="164" height="78" rx="12" fill="url(#diagDots)" stroke="#527A59" stroke-width="1.5"/>
    <rect x="246" y="206" width="164" height="78" rx="12" fill="url(#diagDots)" stroke="#527A59" stroke-width="1.5"/>
    <text x="150" y="237" text-anchor="middle" class="label">a ~ N(0, 1/2)</text>
    <text x="150" y="263" text-anchor="middle" class="small">diagonal</text>
    <text x="328" y="237" text-anchor="middle" class="label">d ~ N(0, 1/2)</text>
    <text x="328" y="263" text-anchor="middle" class="small">diagonal</text>
    <rect x="68" y="302" width="164" height="78" rx="12" fill="url(#upperGrid)" stroke="#4D7197" stroke-width="1.5"/>
    <rect x="246" y="302" width="164" height="78" rx="12" fill="url(#upperGrid)" stroke="#4D7197" stroke-width="1.5"/>
    <text x="150" y="333" text-anchor="middle" class="label">x ~ N(0, 1/4)</text>
    <text x="150" y="359" text-anchor="middle" class="small">upper real part</text>
    <text x="328" y="333" text-anchor="middle" class="label">y ~ N(0, 1/4)</text>
    <text x="328" y="359" text-anchor="middle" class="small">upper imaginary part</text>
    <rect x="68" y="396" width="342" height="40" rx="10" fill="#F6EFE3" stroke="#A67B50"/>
    <text x="239" y="422" text-anchor="middle" class="body">z = x + iy has E|z|² = 1/2</text>
  </g>

  <path d="M466 280H516" fill="none" stroke="#695A4C" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="491" y="264" text-anchor="middle" class="ink small">assemble</text>

  <g filter="url(#shadow)">
    <rect x="532" y="112" width="628" height="342" rx="20" fill="#FFFDFC" stroke="#A67B50" stroke-width="2"/>
  </g>
  <text x="560" y="151" class="ink panel-title">2. Hermitian matrix</text>
  <g transform="translate(574 190)" class="ink math">
    <path d="M16 0H0V178H16M330 0H346V178H330" fill="none" stroke="#3E3934" stroke-width="3"/>
    <rect x="26" y="14" width="140" height="66" rx="10" fill="url(#diagDots)" stroke="#527A59" stroke-width="1.5"/>
    <rect x="180" y="14" width="140" height="66" rx="10" fill="url(#upperGrid)" stroke="#4D7197" stroke-width="1.5"/>
    <rect x="26" y="96" width="140" height="66" rx="10" fill="url(#upperGrid)" stroke="#4D7197" stroke-width="1.5"/>
    <rect x="180" y="96" width="140" height="66" rx="10" fill="url(#diagDots)" stroke="#527A59" stroke-width="1.5"/>
    <text x="96" y="56" text-anchor="middle">a</text>
    <text x="250" y="56" text-anchor="middle">x + iy</text>
    <text x="96" y="138" text-anchor="middle">x − iy</text>
    <text x="250" y="138" text-anchor="middle">d</text>
  </g>
  <g class="ink">
    <rect x="954" y="194" width="176" height="74" rx="12" fill="#F6EFE3" stroke="#A67B50" stroke-width="1.5"/>
    <text x="1042" y="224" text-anchor="middle" class="label">H* = H</text>
    <text x="1042" y="249" text-anchor="middle" class="small">pointwise assembly</text>
    <rect x="954" y="286" width="176" height="104" rx="12" fill="#F6EFE3" stroke="#A67B50" stroke-width="1.5"/>
    <text x="1042" y="316" text-anchor="middle" class="label">Matrix law</text>
    <text x="1042" y="342" text-anchor="middle" class="small">pushforward of the</text>
    <text x="1042" y="364" text-anchor="middle" class="small">coordinate product law</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="40" y="486" width="1120" height="196" rx="20" fill="#FFFDFC" stroke="#527496" stroke-width="2"/>
  </g>
  <text x="68" y="526" class="ink panel-title">3. Ordinary trace moments</text>
  <line x1="600" y1="548" x2="600" y2="652" stroke="#D4C8B9" stroke-width="1.5"/>
  <g class="ink">
    <text x="78" y="576" class="label">First trace</text>
    <text x="78" y="610" class="math">Tr(H) = a + d</text>
    <text x="78" y="643" class="body">E Tr(H) = 0 + 0 = 0</text>
    <text x="630" y="576" class="label">Second trace</text>
    <text x="630" y="610" class="math">Tr(H²) = a² + d² + 2(x² + y²)</text>
    <text x="630" y="643" class="body">E Tr(H²) = 1/2 + 1/2 + 2(1/4 + 1/4) = 2</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="40" y="714" width="1120" height="182" rx="20" fill="#FFFDFC" stroke="#80629B" stroke-width="2"/>
  </g>
  <text x="68" y="754" class="ink panel-title">4. Normalize only when forming the empirical spectral moment</text>
  <rect x="68" y="779" width="362" height="88" rx="14" fill="url(#spectralStripe)" stroke="#80629B" stroke-width="1.5"/>
  <text x="249" y="812" text-anchor="middle" class="ink label">μH = (δλ₁ + δλ₂) / 2</text>
  <text x="249" y="843" text-anchor="middle" class="ink body">one unit of mass split across two eigenvalues</text>
  <path d="M448 823H512" fill="none" stroke="#695A4C" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="530" y="779" width="602" height="88" rx="14" fill="#F2ECF8" stroke="#80629B" stroke-width="1.5"/>
  <text x="831" y="811" text-anchor="middle" class="ink math">E ∫ λ² dμH = (1/2) E Tr(H²)</text>
  <text x="831" y="844" text-anchor="middle" class="ink math">= (1/2) · 2 = 1</text>

  <rect x="40" y="924" width="1120" height="48" rx="12" fill="#F6EFE3" stroke="#A67B50" stroke-width="1.5"/>
  <text x="600" y="954" text-anchor="middle" class="ink body">Boundary ledger: n = 0 gives the zero empirical measure and moment 0; every positive dimension gives expected second empirical moment 1.</text>
</svg>
