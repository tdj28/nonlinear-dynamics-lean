<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1000"
     viewBox="0 0 1200 1000" role="img"
     aria-labelledby="empiricalSpectrumTitle empiricalSpectrumDesc">
  <title id="empiricalSpectrumTitle">A repeated-eigenvalue three by three empirical spectral measure</title>
  <desc id="empiricalSpectrumDesc">The diagonal Hermitian matrix with diagonal entries two, two, and minus one has ordered eigenvalue slots two, two, and minus one. Its counting measure is two Dirac masses at two plus one Dirac mass at minus one, with total mass three. Dividing by three gives empirical masses two thirds and one third. The counting first and second moments are three and nine, matching trace H and trace H squared; the normalized moments are one and three. A footer distinguishes one realized measure, its law under a random matrix, and the zero measure at dimension zero.</desc>
  <defs>
    <pattern id="matrixDots" width="12" height="12" patternUnits="userSpaceOnUse">
      <rect width="12" height="12" fill="#EAF4E7"/>
      <circle cx="3" cy="3" r="1.3" fill="#548060"/>
      <circle cx="9" cy="9" r="1.3" fill="#548060"/>
    </pattern>
    <pattern id="countGrid" width="14" height="14" patternUnits="userSpaceOnUse">
      <rect width="14" height="14" fill="#EAF1F8"/>
      <path d="M0 0H14M0 7H14M0 14H14M0 0V14M7 0V14M14 0V14"
            fill="none" stroke="#7691AC" stroke-width="1"/>
    </pattern>
    <pattern id="probStripe" width="12" height="12" patternUnits="userSpaceOnUse"
             patternTransform="rotate(45)">
      <rect width="12" height="12" fill="#F2ECF8"/>
      <path d="M0 0V12" stroke="#8567A0" stroke-width="3"/>
    </pattern>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#372D25" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#695A4C"/>
    </marker>
    <style>
      .ink { fill: #2E2924; font-family: Inter, Arial, Helvetica, sans-serif; }
      .serif { fill: #2E2924; font-family: Georgia, 'Times New Roman', serif; }
      .title { font-size: 34px; font-weight: 700; }
      .subtitle { fill: #685E55; font-size: 17px; }
      .panel-title { font-size: 22px; font-weight: 700; }
      .label { font-size: 17px; font-weight: 700; }
      .body { font-size: 16px; }
      .small { fill: #685E55; font-size: 14px; }
      .math { font-size: 20px; font-weight: 600; }
    </style>
  </defs>

  <rect width="1200" height="1000" rx="24" fill="#F7F0E4"/>
  <text x="48" y="54" class="serif title">Multiplicity becomes mass</text>
  <text x="48" y="84" class="ink subtitle">One 3 × 3 Hermitian matrix produces a counting measure, then a probability-normalized empirical measure.</text>

  <g filter="url(#shadow)">
    <rect x="40" y="112" width="330" height="332" rx="20" fill="#FFFDFC" stroke="#A67B50" stroke-width="2"/>
  </g>
  <text x="68" y="151" class="ink panel-title">1. One realized matrix</text>
  <g transform="translate(86 190)" class="ink math">
    <path d="M16 0H0V188H16M224 0H240V188H224" fill="none" stroke="#3E3934" stroke-width="3"/>
    <rect x="24" y="10" width="58" height="52" rx="8" fill="url(#matrixDots)" stroke="#548060"/>
    <rect x="88" y="10" width="58" height="52" rx="8" fill="#FBF9F5" stroke="#C7BAAA"/>
    <rect x="152" y="10" width="58" height="52" rx="8" fill="#FBF9F5" stroke="#C7BAAA"/>
    <rect x="24" y="68" width="58" height="52" rx="8" fill="#FBF9F5" stroke="#C7BAAA"/>
    <rect x="88" y="68" width="58" height="52" rx="8" fill="url(#matrixDots)" stroke="#548060"/>
    <rect x="152" y="68" width="58" height="52" rx="8" fill="#FBF9F5" stroke="#C7BAAA"/>
    <rect x="24" y="126" width="58" height="52" rx="8" fill="#FBF9F5" stroke="#C7BAAA"/>
    <rect x="88" y="126" width="58" height="52" rx="8" fill="#FBF9F5" stroke="#C7BAAA"/>
    <rect x="152" y="126" width="58" height="52" rx="8" fill="url(#matrixDots)" stroke="#548060"/>
    <text x="53" y="44" text-anchor="middle">2</text>
    <text x="117" y="44" text-anchor="middle">0</text>
    <text x="181" y="44" text-anchor="middle">0</text>
    <text x="53" y="102" text-anchor="middle">0</text>
    <text x="117" y="102" text-anchor="middle">2</text>
    <text x="181" y="102" text-anchor="middle">0</text>
    <text x="53" y="160" text-anchor="middle">0</text>
    <text x="117" y="160" text-anchor="middle">0</text>
    <text x="181" y="160" text-anchor="middle">−1</text>
  </g>
  <text x="205" y="410" text-anchor="middle" class="ink small">Hermitian because it is real diagonal</text>

  <path d="M382 275H432" fill="none" stroke="#695A4C" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="407" y="258" text-anchor="middle" class="ink small">diagonalize</text>

  <g filter="url(#shadow)">
    <rect x="448" y="112" width="712" height="332" rx="20" fill="#FFFDFC" stroke="#527496" stroke-width="2"/>
  </g>
  <text x="476" y="151" class="ink panel-title">2. Keep all three eigenvalue slots</text>
  <text x="476" y="179" class="ink small">The ordered vector is (2, 2, −1). Equal locations remain separate index slots.</text>
  <g class="ink">
    <rect x="476" y="202" width="154" height="64" rx="12" fill="url(#countGrid)" stroke="#527496" stroke-width="1.5"/>
    <rect x="646" y="202" width="154" height="64" rx="12" fill="url(#countGrid)" stroke="#527496" stroke-width="1.5"/>
    <rect x="816" y="202" width="154" height="64" rx="12" fill="#F6EFE3" stroke="#A67B50" stroke-width="1.5"/>
    <text x="553" y="229" text-anchor="middle" class="label">slot 0</text>
    <text x="553" y="252" text-anchor="middle" class="math">λ₀ = 2</text>
    <text x="723" y="229" text-anchor="middle" class="label">slot 1</text>
    <text x="723" y="252" text-anchor="middle" class="math">λ₁ = 2</text>
    <text x="893" y="229" text-anchor="middle" class="label">slot 2</text>
    <text x="893" y="252" text-anchor="middle" class="math">λ₂ = −1</text>
    <rect x="476" y="292" width="310" height="112" rx="14" fill="url(#countGrid)" stroke="#527496" stroke-width="1.5"/>
    <text x="631" y="325" text-anchor="middle" class="label">Counting measure κH</text>
    <text x="631" y="356" text-anchor="middle" class="math">δ₂ + δ₂ + δ₋₁ = 2δ₂ + δ₋₁</text>
    <text x="631" y="386" text-anchor="middle" class="body">total mass = 3</text>
    <path d="M798 348H840" fill="none" stroke="#695A4C" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="819" y="331" text-anchor="middle" class="small">divide by 3</text>
    <rect x="856" y="292" width="276" height="112" rx="14" fill="url(#probStripe)" stroke="#80629B" stroke-width="1.5"/>
    <text x="994" y="325" text-anchor="middle" class="label">Empirical measure μH</text>
    <text x="994" y="356" text-anchor="middle" class="math">(2/3)δ₂ + (1/3)δ₋₁</text>
    <text x="994" y="386" text-anchor="middle" class="body">total mass = 1</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="40" y="478" width="1120" height="214" rx="20" fill="#FFFDFC" stroke="#80629B" stroke-width="2"/>
  </g>
  <text x="68" y="518" class="ink panel-title">3. Moments are normalized trace powers</text>
  <line x1="600" y1="540" x2="600" y2="662" stroke="#D4C8B9" stroke-width="1.5"/>
  <g class="ink">
    <text x="78" y="568" class="label">First moment</text>
    <text x="78" y="601" class="math">∫ t dκH = 2 + 2 − 1 = 3 = Tr(H)</text>
    <text x="78" y="636" class="math">∫ t dμH = 3 / 3 = 1</text>
    <text x="630" y="568" class="label">Second moment</text>
    <text x="630" y="601" class="math">∫ t² dκH = 4 + 4 + 1 = 9 = Tr(H²)</text>
    <text x="630" y="636" class="math">∫ t² dμH = 9 / 3 = 3</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="40" y="724" width="1120" height="216" rx="20" fill="#FFFDFC" stroke="#A67B50" stroke-width="2"/>
  </g>
  <text x="68" y="764" class="ink panel-title">4. Do not confuse the measure with its random law</text>
  <g class="ink">
    <rect x="68" y="792" width="288" height="112" rx="14" fill="url(#matrixDots)" stroke="#548060" stroke-width="1.5"/>
    <text x="212" y="824" text-anchor="middle" class="label">Fixed matrix H</text>
    <text x="212" y="854" text-anchor="middle" class="body">one point in Hermitian space</text>
    <text x="212" y="883" text-anchor="middle" class="small">deterministic input</text>
    <path d="M370 848H424" fill="none" stroke="#695A4C" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="442" y="792" width="288" height="112" rx="14" fill="url(#probStripe)" stroke="#80629B" stroke-width="1.5"/>
    <text x="586" y="824" text-anchor="middle" class="label">Realized measure μH</text>
    <text x="586" y="854" text-anchor="middle" class="body">one point in Measure(ℝ)</text>
    <text x="586" y="883" text-anchor="middle" class="small">for this H: (2/3)δ₂ + (1/3)δ₋₁</text>
    <path d="M744 848H798" fill="none" stroke="#695A4C" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="816" y="792" width="316" height="112" rx="14" fill="url(#countGrid)" stroke="#527496" stroke-width="1.5"/>
    <text x="974" y="824" text-anchor="middle" class="label">Law of μH when H is random</text>
    <text x="974" y="854" text-anchor="middle" class="body">a probability measure on Measure(ℝ)</text>
    <text x="974" y="883" text-anchor="middle" class="small">distribution across repeated matrix samples</text>
  </g>

  <rect x="40" y="958" width="1120" height="26" rx="10" fill="#F6EFE3" stroke="#A67B50"/>
  <text x="600" y="977" text-anchor="middle" class="ink small">Dimension zero policy: no eigenvalue slots, counting measure 0, empirical measure 0, and no artificial atom.</text>
</svg>
