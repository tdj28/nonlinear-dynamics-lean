<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="500" viewBox="0 0 1040 500" role="img" aria-labelledby="title desc">
  <title id="title">Constructing an orbital Lyapunov derivative</title>
  <desc id="desc">A flow orbit from x enters the scalar map V, producing a real trace g sub x. A tangent on the descending trace is labeled g prime sub x of t less than or equal to zero.</desc>
  <rect width="1040" height="500" rx="24" fill="#fbf8f0"/>
  <text x="48" y="52" font-family="Georgia,serif" font-size="27" fill="#23343b">Pull the scalar back to the real-time axis</text>
  <rect x="48" y="112" width="226" height="98" rx="17" fill="#e8f0f7" stroke="#4b6787" stroke-width="3"/>
  <text x="161" y="150" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#23343b">orbit through x</text><text x="161" y="181" text-anchor="middle" font-family="Georgia,serif" font-size="22" fill="#23343b">t ↦ Φ(t,x)</text>
  <path d="M274 161 H348" stroke="#315f63" stroke-width="5"/><polygon points="348,161 332,151 332,171" fill="#315f63"/>
  <rect x="350" y="112" width="226" height="98" rx="17" fill="#f3e8e0" stroke="#a67c52" stroke-width="3"/>
  <text x="463" y="150" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#23343b">apply the scalar</text><text x="463" y="181" text-anchor="middle" font-family="Georgia,serif" font-size="22" fill="#23343b">V : X → ℝ</text>
  <path d="M576 161 H650" stroke="#315f63" stroke-width="5"/><polygon points="650,161 634,151 634,171" fill="#315f63"/>
  <rect x="652" y="112" width="340" height="98" rx="17" fill="#eaf1e5" stroke="#6f8d5e" stroke-width="3"/>
  <text x="822" y="150" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#23343b">real scalar trace</text><text x="822" y="181" text-anchor="middle" font-family="Georgia,serif" font-size="22" fill="#23343b">gₓ(t) = V(Φ(t,x))</text>
  <line x1="110" y1="408" x2="936" y2="408" stroke="#7f786d" stroke-width="3"/>
  <path d="M128 280 C330 308 536 350 904 390" fill="none" stroke="#315f63" stroke-width="7"/>
  <line x1="492" y1="324" x2="646" y2="362" stroke="#b06f45" stroke-width="6"/>
  <text x="474" y="292" font-family="Arial,sans-serif" font-size="21" fill="#7a4d69">gₓ′(t) ≤ 0</text>
  <text x="110" y="455" font-family="Arial,sans-serif" font-size="18" fill="#7a4d69">ordinary real derivative · vector-field formula requires a chain rule</text>
</svg>
