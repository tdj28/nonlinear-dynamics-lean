<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Orbital Lyapunov derivative</title>
  <desc id="desc">A flow orbit passes through a scalar map V to become a descending real trace with a nonpositive tangent.</desc>
