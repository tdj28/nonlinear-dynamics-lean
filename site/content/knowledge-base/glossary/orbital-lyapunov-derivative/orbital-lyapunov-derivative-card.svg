  <text x="76" y="102" font-family="Arial,sans-serif" font-size="21" letter-spacing="3" fill="#7a4d69">KNOWLEDGE BASE · LYAPUNOV METHODS</text>
  <text x="76" y="181" font-family="Georgia,serif" font-size="55" fill="#23343b">Orbital Lyapunov</text><text x="76" y="244" font-family="Georgia,serif" font-size="55" fill="#23343b">derivative</text>
  <rect x="82" y="304" width="230" height="78" rx="15" fill="#e8f0f7" stroke="#4b6787" stroke-width="3"/><text x="197" y="350" text-anchor="middle" font-family="Georgia,serif" font-size="22" fill="#23343b">t ↦ Φ(t,x)</text>
  <path d="M312 343 H382" stroke="#315f63" stroke-width="5"/><polygon points="382,343 366,333 366,353" fill="#315f63"/>
  <rect x="384" y="304" width="180" height="78" rx="15" fill="#f3e8e0" stroke="#a67c52" stroke-width="3"/><text x="474" y="350" text-anchor="middle" font-family="Georgia,serif" font-size="24" fill="#23343b">V</text>
  <path d="M564 343 H634" stroke="#315f63" stroke-width="5"/><polygon points="634,343 618,333 618,353" fill="#315f63"/>
  <path d="M660 300 C790 322 914 392 1088 420" fill="none" stroke="#315f63" stroke-width="8"/>
  <line x1="786" y1="334" x2="918" y2="390" stroke="#b06f45" stroke-width="6"/>
  <text x="786" y="304" font-family="Arial,sans-serif" font-size="21" fill="#7a4d69">gₓ′(t) ≤ 0</text>
  <text x="76" y="540" font-family="Arial,sans-serif" font-size="19" fill="#7a4d69">pull back along the orbit · differentiate in real time · apply mean value</text>
</svg>
