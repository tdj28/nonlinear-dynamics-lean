<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" role="img" aria-labelledby="title desc">
  <title id="title">Continuous-time forward-stability tube</title>
  <desc id="desc">A delta interval at time zero becomes a shaded epsilon tube centered on a moving reference orbit for all times at or after zero. A nearby orbit stays inside without approaching the center.</desc>
  <rect width="760" height="330" fill="#F7F4F0"/>
  <style>.t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#2C2924}.title{font-size:15px;font-weight:700}.h{font-size:13px;font-weight:700}.s{font-size:12px}.m{font-size:11px;fill:#5A544C}.axis{stroke:#7F786D;stroke-width:1.4}.ref{stroke:#4B6787;stroke-width:3.5;fill:none}.near{stroke:#A67C52;stroke-width:3;fill:none}.bound{stroke:#6F8D5E;stroke-width:1.5;stroke-dasharray:5 4;fill:none}</style>
  <text x="24" y="28" class="t title">One initial neighborhood controls every nonnegative real time</text>
  <text x="24" y="48" class="t m">The center moves with the reference orbit; the nearby orbit need not converge to it.</text>
  <line x1="74" y1="270" x2="714" y2="270" class="axis"/><text x="676" y="294" class="t s">t >= 0</text>
  <path d="M86 224 C218 187 335 132 462 145 S619 187 700 92 L700 146 C616 240 540 194 462 195 S220 241 86 270 Z" fill="#EAF1E5" opacity="0.86"/>
  <path d="M86 224 C218 187 335 132 462 145 S619 187 700 92" class="bound"/>
  <path d="M86 270 C220 241 335 182 462 195 S616 240 700 146" class="bound"/>
  <path d="M86 247 C220 214 335 157 462 170 S618 214 700 119" class="ref"/>
  <path d="M86 257 C220 226 335 169 462 182 S616 226 700 131" class="near"/>
  <line x1="58" y1="244" x2="58" y2="264" stroke="#A67C52" stroke-width="2"/><text x="24" y="260" class="t s">delta</text>
  <text x="522" y="154" class="t h">epsilon tube</text><text x="284" y="132" class="t s">reference</text><text x="302" y="204" class="t s">nearby</text>
  <rect x="24" y="296" width="712" height="24" rx="7" fill="#EAF1E5" stroke="#6F8D5E"/><text x="380" y="313" text-anchor="middle" class="t s">Uniform closeness is an all-time bound, not a long-time limit.</text>
</svg>
