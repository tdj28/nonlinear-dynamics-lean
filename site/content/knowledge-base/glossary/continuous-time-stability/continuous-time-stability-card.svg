<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Continuous-time stability</title>
  <desc id="desc">One delta neighborhood at time zero controls a shaded epsilon tube following a moving reference orbit for all nonnegative real times.</desc>
  <rect width="1200" height="630" fill="#f1e9da"/><rect x="38" y="38" width="1124" height="554" rx="28" fill="#fbf8f0" stroke="#315f63" stroke-width="4"/>
  <text x="76" y="102" font-family="Arial,sans-serif" font-size="21" letter-spacing="3" fill="#7a4d69">KNOWLEDGE BASE · STABILITY</text>
  <text x="76" y="181" font-family="Georgia,serif" font-size="56" fill="#23343b">Continuous-time</text><text x="76" y="244" font-family="Georgia,serif" font-size="56" fill="#23343b">forward stability</text>
  <path d="M86 425 C258 292 420 449 608 324 S842 346 1082 254" fill="none" stroke="#6F8D5E" stroke-width="76" opacity="0.28"/>
  <path d="M86 413 C258 280 420 437 608 312 S842 334 1082 242" fill="none" stroke="#315f63" stroke-width="7"/>
  <path d="M86 437 C258 304 420 461 608 336 S842 358 1082 266" fill="none" stroke="#b06f45" stroke-width="6"/>
  <text x="90" y="494" font-family="Arial,sans-serif" font-size="18" fill="#7a4d69">one delta at time zero</text><text x="820" y="206" font-family="Arial,sans-serif" font-size="18" fill="#7a4d69">one epsilon tube for all t >= 0</text>
  <text x="76" y="548" font-family="Arial,sans-serif" font-size="19" fill="#7a4d69">remain close · moving center allowed · attraction is separate</text>
</svg>
