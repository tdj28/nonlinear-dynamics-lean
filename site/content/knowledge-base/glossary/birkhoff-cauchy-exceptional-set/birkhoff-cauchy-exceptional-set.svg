<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="birkhoffCauchySetTitle birkhoffCauchySetDesc">
  <title id="birkhoffCauchySetTitle">Birkhoff Cauchy exceptional set</title>
  <desc id="birkhoffCauchySetDesc">Three successive tail cutoffs each retain a pair of averages separated at one fixed scale. The complement supplies a tail controlled at that scale; avoiding every reciprocal-scale event supplies the Cauchy property.</desc>
  <defs>
    <marker id="birkhoffCauchyArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#A67C52"/>
    </marker>
  </defs>
  <style>
    .t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#2C2924}
    .title{font-size:16px;font-weight:700}
    .h{font-size:12px;font-weight:700}
    .s{font-size:11px}
    .m{font-size:10px;fill:#5A544C}
    .neutral{fill:#FBF9F6;stroke:#C4B8A8;stroke-width:1.5}
    .blue{fill:#E8F0F7;stroke:#4B6787;stroke-width:1.5}
    .green{fill:#EAF1E5;stroke:#6F8D5E;stroke-width:1.5}
    .clay{fill:#F3E8E0;stroke:#A67C52;stroke-width:1.5}
    .arrow{fill:none;stroke:#A67C52;stroke-width:2;marker-end:url(#birkhoffCauchyArrow)}
  </style>
  <rect width="720" height="360" fill="#F7F4F0"/>
  <text x="24" y="29" class="t title">Birkhoff Cauchy exceptional set</text>
  <text x="24" y="49" class="t m">Persistent separation survives every attempt to enter a stable tail.</text>

  <rect x="24" y="82" width="460" height="190" rx="16" class="neutral"/>
  <text x="48" y="108" class="t h">EVERY TAIL CUTOFF</text>
  <text x="48" y="144" class="t m">first tail</text>
  <path d="M124 140 H444" stroke="#C4B8A8" stroke-width="2"/>
  <circle cx="248" cy="127" r="7" fill="#A67C52"/>
  <circle cx="362" cy="153" r="7" fill="#4B6787"/>
  <path d="M248 166 V174 H362 V166" fill="none" stroke="#A67C52" stroke-width="1.8"/>

  <text x="48" y="200" class="t m">later tail</text>
  <path d="M172 196 H444" stroke="#C4B8A8" stroke-width="2"/>
  <circle cx="299" cy="183" r="7" fill="#A67C52"/>
  <circle cx="405" cy="209" r="7" fill="#4B6787"/>
  <path d="M299 222 V230 H405 V222" fill="none" stroke="#A67C52" stroke-width="1.8"/>
  <text x="352" y="250" text-anchor="middle" class="t s">a separated pair remains</text>

  <path d="M490 176 H520" class="arrow"/>
  <rect x="528" y="92" width="168" height="168" rx="16" class="clay"/>
  <text x="612" y="121" text-anchor="middle" class="t h">EXCEPTIONAL STATE</text>
  <path d="M570 149 C548 149 548 170 565 176 C548 182 548 203 570 203" fill="none" stroke="#A67C52" stroke-width="2.4"/>
  <circle cx="600" cy="160" r="7" fill="#A67C52"/>
  <circle cx="645" cy="192" r="7" fill="#4B6787"/>
  <text x="612" y="229" text-anchor="middle" class="t s">failure persists</text>
  <text x="612" y="246" text-anchor="middle" class="t m">at one fixed scale</text>

  <rect x="94" y="298" width="532" height="42" rx="12" class="green"/>
  <text x="360" y="324" text-anchor="middle" class="t s">One scale controls one tail; all reciprocal scales give Cauchy.</text>
</svg>
