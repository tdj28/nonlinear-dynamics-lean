<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" role="img" aria-labelledby="uniformIntegrabilityTitle uniformIntegrabilityDesc">
  <title id="uniformIntegrabilityTitle">Uniform integrability and the finite-measure Vitali bridge</title>
  <desc id="uniformIntegrabilityDesc">One common large-value threshold is applied to every member of a function family, placing every tail below one requested integrable-norm tolerance. Together with almost-everywhere convergence on a finite measure space, this gives integrable-norm convergence.</desc>
  <defs>
    <marker id="uniformArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#A67C52"/>
    </marker>
  </defs>
  <style>
    .t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#2C2924}
    .title{font-size:16px;font-weight:700}
    .head{font-size:12px;font-weight:700;letter-spacing:.3px}
    .label{font-size:11px}
    .small{font-size:10px;fill:#5A544C}
    .neutral{fill:#FBF9F6;stroke:#C4B8A8;stroke-width:1.5}
    .blue{fill:#E8F0F7;stroke:#4B6787;stroke-width:1.5}
    .green{fill:#EAF1E5;stroke:#6F8D5E;stroke-width:1.5}
    .clay{fill:#F3E8E0;stroke:#A67C52;stroke-width:1.5}
    .arrow{fill:none;stroke:#A67C52;stroke-width:2.2;marker-end:url(#uniformArrow)}
  </style>
  <rect width="760" height="420" fill="#F7F4F0"/>
  <text x="24" y="29" class="t title">Uniform integrability and the finite-measure Vitali bridge</text>
  <text x="24" y="49" class="t small">The common threshold, not a separate threshold per function, is the essential quantifier.</text>

  <rect x="24" y="78" width="196" height="186" rx="17" class="blue"/>
  <text x="122" y="105" text-anchor="middle" class="t head">WHOLE FAMILY</text>
  <rect x="50" y="126" width="144" height="30" rx="8" class="neutral"/>
  <rect x="50" y="166" width="144" height="30" rx="8" class="neutral"/>
  <rect x="50" y="206" width="144" height="30" rx="8" class="neutral"/>
  <text x="122" y="146" text-anchor="middle" class="t label">function F(0)</text>
  <text x="122" y="186" text-anchor="middle" class="t label">function F(1)</text>
  <text x="122" y="226" text-anchor="middle" class="t label">every later F(i)</text>
  <text x="122" y="251" text-anchor="middle" class="t small">all indices i</text>

  <path d="M226 171 H278" class="arrow"/>
  <rect x="286" y="78" width="190" height="186" rx="17" class="clay"/>
  <text x="381" y="105" text-anchor="middle" class="t head">ONE COMMON GATE</text>
  <path d="M323 154 H439" stroke="#A67C52" stroke-width="2.5"/>
  <path d="M340 130 V178 M422 130 V178" stroke="#A67C52" stroke-width="2.5"/>
  <rect x="340" y="146" width="82" height="16" fill="#FFFDF8" stroke="#A67C52"/>
  <text x="381" y="201" text-anchor="middle" class="t head">threshold C</text>
  <text x="381" y="220" text-anchor="middle" class="t small">chosen after epsilon</text>
  <text x="381" y="238" text-anchor="middle" class="t small">used for every i</text>

  <path d="M484 171 H536" class="arrow"/>
  <rect x="544" y="78" width="192" height="186" rx="17" class="green"/>
  <text x="640" y="105" text-anchor="middle" class="t head">EVERY TAIL IS SMALL</text>
  <rect x="570" y="127" width="140" height="34" rx="9" class="neutral"/>
  <rect x="570" y="172" width="140" height="34" rx="9" class="neutral"/>
  <text x="640" y="148" text-anchor="middle" class="t label">keep values at least C</text>
  <text x="640" y="193" text-anchor="middle" class="t label">tail norm at most epsilon</text>
  <text x="640" y="224" text-anchor="middle" class="t small">uniformly for every index</text>
  <text x="640" y="241" text-anchor="middle" class="t small">no mass escapes</text>

  <rect x="24" y="302" width="202" height="82" rx="14" class="neutral"/>
  <text x="125" y="330" text-anchor="middle" class="t head">ALSO NEEDED</text>
  <text x="125" y="351" text-anchor="middle" class="t label">almost-everywhere convergence</text>
  <text x="125" y="369" text-anchor="middle" class="t small">and finite total measure</text>
  <path d="M234 343 H316" class="arrow"/>
  <rect x="324" y="302" width="180" height="82" rx="14" class="clay"/>
  <text x="414" y="333" text-anchor="middle" class="t head">VITALI THEOREM</text>
  <text x="414" y="354" text-anchor="middle" class="t label">combines both inputs</text>
  <text x="414" y="371" text-anchor="middle" class="t small">at exponent one</text>
  <path d="M512 343 H568" class="arrow"/>
  <rect x="576" y="302" width="160" height="82" rx="14" class="green"/>
  <text x="656" y="333" text-anchor="middle" class="t head">NORM CONVERGENCE</text>
  <text x="656" y="354" text-anchor="middle" class="t label">norm of error goes to zero</text>
  <text x="656" y="371" text-anchor="middle" class="t small">integrals may pass to the limit</text>
</svg>
