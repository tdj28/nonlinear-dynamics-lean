<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700" role="img" aria-labelledby="uniformIntegrabilityTitle uniformIntegrabilityDesc">
  <title id="uniformIntegrabilityTitle">Exact tail comparison for tame and concentrating spike families</title>
  <desc id="uniformIntegrabilityDesc">A geometric probability space has atom probabilities one half, one quarter, one eighth, and so on. At atom three, a tame spike of height four contributes one quarter, while a concentrating spike of height sixteen contributes one. A threshold table shows the tame family's largest retained integral falling from one half to one over 4096 as thresholds grow from two to sixteen, while the concentrating family's value remains one.</desc>
  <defs>
    <pattern id="uniformBlueHatch" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#E8F0F7"/>
      <path d="M0 8 L8 0" stroke="#4B6787" stroke-width="1" opacity="0.26"/>
    </pattern>
    <pattern id="uniformClayHatch" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#F3E8E0"/>
      <path d="M0 0 L8 8" stroke="#8A5E39" stroke-width="1" opacity="0.28"/>
    </pattern>
  </defs>
  <style>
    .t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#2C2924}
    .title{font-size:19px;font-weight:700}
    .subtitle{font-size:12px;fill:#5A544C}
    .h{font-size:14px;font-weight:700}
    .s{font-size:12px}
    .m{font-size:11px;fill:#5A544C}
    .tiny{font-size:10px;fill:#5A544C}
    .neutral{fill:#FBF9F6;stroke:#C4B8A8;stroke-width:1.5}
    .blue{fill:#E8F0F7;stroke:#4B6787;stroke-width:1.6}
    .green{fill:#EAF1E5;stroke:#6F8D5E;stroke-width:1.6}
    .clay{fill:#F3E8E0;stroke:#8A5E39;stroke-width:1.6}
    .grid{stroke:#D9D0C4;stroke-width:1}
    .axis{stroke:#5A544C;stroke-width:1.3}
    .threshold{stroke:#8A5E39;stroke-width:2;stroke-dasharray:7 5}
  </style>

  <rect width="1000" height="700" fill="#F7F4F0"/>
  <text x="30" y="35" class="t title">Two spike families: same atoms, different tail behavior</text>
  <text x="30" y="58" class="t subtitle">Every member is integrable and both families converge pointwise to zero. Only one controls tails uniformly.</text>

  <rect x="30" y="84" width="440" height="274" rx="14" class="neutral"/>
  <text x="52" y="112" class="t h">THE COMMON GEOMETRIC SAMPLE SPACE</text>
  <text x="52" y="132" class="t m">Each row is one atom. Its probability halves at every step.</text>

  <rect x="50" y="148" width="400" height="31" rx="6" fill="#EDE8E1"/>
  <text x="70" y="168" class="t s" font-weight="700">atom</text>
  <text x="132" y="168" class="t s" font-weight="700">probability</text>
  <text x="245" y="168" class="t s" font-weight="700">tame height</text>
  <text x="348" y="168" class="t s" font-weight="700">concentrating height</text>

  <line x1="50" y1="211" x2="450" y2="211" class="grid"/>
  <line x1="50" y1="243" x2="450" y2="243" class="grid"/>
  <line x1="50" y1="275" x2="450" y2="275" class="grid"/>
  <line x1="50" y1="307" x2="450" y2="307" class="grid"/>
  <line x1="50" y1="339" x2="450" y2="339" class="grid"/>

  <text x="72" y="201" class="t s">0</text>
  <text x="155" y="201" class="t s">1/2</text>
  <text x="277" y="201" class="t s">1</text>
  <text x="397" y="201" class="t s">2</text>

  <text x="72" y="233" class="t s">1</text>
  <text x="155" y="233" class="t s">1/4</text>
  <text x="277" y="233" class="t s">2</text>
  <text x="397" y="233" class="t s">4</text>

  <text x="72" y="265" class="t s">2</text>
  <text x="155" y="265" class="t s">1/8</text>
  <text x="277" y="265" class="t s">3</text>
  <text x="397" y="265" class="t s">8</text>

  <text x="72" y="297" class="t s">3</text>
  <text x="155" y="297" class="t s">1/16</text>
  <text x="277" y="297" class="t s">4</text>
  <text x="397" y="297" class="t s">16</text>

  <text x="72" y="329" class="t s">7</text>
  <text x="155" y="329" class="t s">1/256</text>
  <text x="277" y="329" class="t s">8</text>
  <text x="397" y="329" class="t s">256</text>

  <rect x="500" y="84" width="470" height="274" rx="14" class="neutral"/>
  <text x="522" y="112" class="t h">ONE ATOM AT THRESHOLD 4</text>
  <text x="522" y="132" class="t m">At atom 3, values at least 4 are retained. Both spikes remain.</text>

  <line x1="555" y1="310" x2="930" y2="310" class="axis"/>
  <line x1="555" y1="150" x2="555" y2="310" class="axis"/>
  <line x1="550" y1="310" x2="555" y2="310" class="axis"/>
  <line x1="550" y1="270" x2="555" y2="270" class="axis"/>
  <line x1="550" y1="230" x2="555" y2="230" class="axis"/>
  <line x1="550" y1="190" x2="555" y2="190" class="axis"/>
  <line x1="550" y1="150" x2="555" y2="150" class="axis"/>
  <text x="540" y="314" text-anchor="end" class="t tiny">0</text>
  <text x="540" y="274" text-anchor="end" class="t tiny">4</text>
  <text x="540" y="234" text-anchor="end" class="t tiny">8</text>
  <text x="540" y="194" text-anchor="end" class="t tiny">12</text>
  <text x="540" y="154" text-anchor="end" class="t tiny">16</text>
  <text x="518" y="235" transform="rotate(-90 518 235)" text-anchor="middle" class="t tiny">spike height</text>

  <line x1="555" y1="270" x2="930" y2="270" class="threshold"/>
  <text x="925" y="263" text-anchor="end" class="t tiny">cutoff 4</text>

  <rect x="625" y="270" width="92" height="40" fill="url(#uniformBlueHatch)" stroke="#4B6787" stroke-width="1.6"/>
  <text x="671" y="253" text-anchor="middle" class="t s" font-weight="700">height 4</text>
  <text x="671" y="329" text-anchor="middle" class="t s" font-weight="700">TAME</text>
  <text x="671" y="346" text-anchor="middle" class="t tiny">retained integral 1/4</text>

  <rect x="788" y="150" width="92" height="160" fill="url(#uniformClayHatch)" stroke="#8A5E39" stroke-width="1.6"/>
  <text x="834" y="143" text-anchor="middle" class="t s" font-weight="700">height 16</text>
  <text x="834" y="329" text-anchor="middle" class="t s" font-weight="700">CONCENTRATING</text>
  <text x="834" y="346" text-anchor="middle" class="t tiny">retained integral 1</text>

  <rect x="30" y="384" width="940" height="238" rx="14" class="neutral"/>
  <text x="52" y="414" class="t h">ONE THRESHOLD MUST CONTROL THE WHOLE FAMILY</text>
  <text x="52" y="434" class="t m">For each threshold, take the largest retained integral over all family indices.</text>

  <rect x="50" y="451" width="900" height="34" rx="6" fill="#EDE8E1"/>
  <text x="89" y="473" class="t s" font-weight="700">threshold</text>
  <text x="296" y="473" class="t s" font-weight="700">tame family's largest tail</text>
  <text x="666" y="473" class="t s" font-weight="700">concentrating family's largest tail</text>

  <line x1="50" y1="519" x2="950" y2="519" class="grid"/>
  <line x1="50" y1="553" x2="950" y2="553" class="grid"/>
  <line x1="50" y1="587" x2="950" y2="587" class="grid"/>
  <line x1="166" y1="451" x2="166" y2="604" class="grid"/>
  <line x1="535" y1="451" x2="535" y2="604" class="grid"/>

  <text x="106" y="509" text-anchor="middle" class="t s">2</text>
  <text x="350" y="509" text-anchor="middle" class="t s">1/2 at atom 1</text>
  <text x="742" y="509" text-anchor="middle" class="t s">1, still fully retained</text>

  <text x="106" y="543" text-anchor="middle" class="t s">4</text>
  <text x="350" y="543" text-anchor="middle" class="t s">1/4 at atom 3</text>
  <text x="742" y="543" text-anchor="middle" class="t s">1, still fully retained</text>

  <text x="106" y="577" text-anchor="middle" class="t s">8</text>
  <text x="350" y="577" text-anchor="middle" class="t s">1/32 at atom 7</text>
  <text x="742" y="577" text-anchor="middle" class="t s">1, still fully retained</text>

  <text x="106" y="611" text-anchor="middle" class="t s">16</text>
  <text x="350" y="611" text-anchor="middle" class="t s">1/4096 at atom 15</text>
  <text x="742" y="611" text-anchor="middle" class="t s">1, still fully retained</text>

  <rect x="30" y="646" width="940" height="36" rx="10" class="green"/>
  <text x="500" y="669" text-anchor="middle" class="t s" font-weight="700">Uniform integrability stops a fixed amount of integral from hiding on smaller and smaller events.</text>
</svg>
