<svg xmlns="http://www.w3.org/2000/svg" width="760" height="390"
     viewBox="0 0 760 390" role="img"
     aria-labelledby="independenceTitle independenceDesc">
  <title id="independenceTitle">Joint probabilities factor under independence</title>
  <desc id="independenceDesc">A two by two exact probability grid has four cells of one quarter. Each row margin and column margin is one half, so every cell is the product of its margins.</desc>
  <rect width="760" height="390" fill="#F7F4F0"/>
  <style>
    .t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#2C2924}
    .title{font-size:15px;font-weight:700}.h{font-size:13px;font-weight:700}
    .s{font-size:12px}.m{font-size:11px;fill:#5A544C}
    .cellA{fill:#E8F0F7;stroke:#4B6787;stroke-width:1.5}
    .cellB{fill:#FBF9F6;stroke:#C4B8A8;stroke-width:1.5}
    .margin{fill:#F3E8E0;stroke:#A67C52;stroke-width:1.5}
    .result{fill:#EAF1E5;stroke:#6F8D5E;stroke-width:1.5}
  </style>
  <text x="24" y="28" class="t title">Independence fills the joint grid by multiplying margins</text>
  <text x="24" y="48" class="t m">Exact toy law: X and Y are fair bits.</text>

  <text x="306" y="82" text-anchor="middle" class="t h">X = 0</text>
  <text x="442" y="82" text-anchor="middle" class="t h">X = 1</text>
  <text x="548" y="82" text-anchor="middle" class="t h">row margin</text>
  <text x="180" y="137" text-anchor="middle" class="t h">Y = 0</text>
  <text x="180" y="239" text-anchor="middle" class="t h">Y = 1</text>

  <rect x="238" y="96" width="136" height="82" rx="8" class="cellA"/>
  <rect x="374" y="96" width="136" height="82" rx="8" class="cellB"/>
  <rect x="238" y="198" width="136" height="82" rx="8" class="cellB"/>
  <rect x="374" y="198" width="136" height="82" rx="8" class="cellA"/>
  <text x="306" y="130" text-anchor="middle" class="t s">joint outcome</text>
  <text x="306" y="154" text-anchor="middle" class="t h">probability 1/4</text>
  <text x="442" y="130" text-anchor="middle" class="t s">joint outcome</text>
  <text x="442" y="154" text-anchor="middle" class="t h">probability 1/4</text>
  <text x="306" y="232" text-anchor="middle" class="t s">joint outcome</text>
  <text x="306" y="256" text-anchor="middle" class="t h">probability 1/4</text>
  <text x="442" y="232" text-anchor="middle" class="t s">joint outcome</text>
  <text x="442" y="256" text-anchor="middle" class="t h">probability 1/4</text>

  <rect x="528" y="96" width="112" height="82" rx="8" class="margin"/>
  <rect x="528" y="198" width="112" height="82" rx="8" class="margin"/>
  <text x="584" y="143" text-anchor="middle" class="t h">1/2</text>
  <text x="584" y="245" text-anchor="middle" class="t h">1/2</text>

  <text x="180" y="318" text-anchor="middle" class="t h">column margin</text>
  <rect x="238" y="294" width="136" height="46" rx="8" class="margin"/>
  <rect x="374" y="294" width="136" height="46" rx="8" class="margin"/>
  <text x="306" y="323" text-anchor="middle" class="t h">1/2</text>
  <text x="442" y="323" text-anchor="middle" class="t h">1/2</text>

  <rect x="24" y="354" width="712" height="26" rx="10" class="result"/>
  <text x="380" y="372" text-anchor="middle" class="t s">Every cell: one quarter = one half times one half.</text>
</svg>
