<svg xmlns="http://www.w3.org/2000/svg" width="960" height="650"
     viewBox="0 0 960 650" role="img"
     aria-labelledby="dieEventTitle dieEventDesc">
  <title id="dieEventTitle">Events and set operations on six equally likely die outcomes</title>
  <desc id="dieEventDesc">Six numbered outcomes appear in rows. Diagonal hatching marks the even event A containing two, four, and six. Dots mark event B containing four, five, and six. A crossed pattern marks four and six where both events occur. Three result panels show the complement of A as one, three, and five with probability one half; the intersection as four and six with probability one third; and the union as two, four, five, and six with probability two thirds.</desc>
  <defs>
    <linearGradient id="eventPaper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFDF8"/>
      <stop offset="1" stop-color="#EEE5D6"/>
    </linearGradient>
    <pattern id="eventA" width="9" height="9" patternUnits="userSpaceOnUse"
             patternTransform="rotate(45)">
      <rect width="9" height="9" fill="#E8F0F7"/>
      <line x1="0" y1="0" x2="0" y2="9" stroke="#4B6787" stroke-width="3"/>
    </pattern>
    <pattern id="eventB" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F3E8E0"/>
      <circle cx="5" cy="5" r="2" fill="#9B3F2B"/>
    </pattern>
    <pattern id="eventBoth" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#EAF1E5"/>
      <path d="M0 5 H10 M5 0 V10" stroke="#315F55" stroke-width="1.7"/>
    </pattern>
  </defs>
  <rect width="960" height="650" fill="url(#eventPaper)"/>
  <style>
    .t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#2C2924}
    .title{font-family:Georgia,serif;font-size:25px;font-weight:700;fill:#16243A}
    .sub{font-size:14px;fill:#536070}
    .h{font-size:16px;font-weight:700}
    .s{font-size:13px}
    .m{font-size:12px;fill:#536070}
    .face{stroke:#766B5D;stroke-width:1.8}
    .n{font-size:18px;font-weight:700;fill:#16243A}
    .prob{font-size:15px;font-weight:700;fill:#315F55}
  </style>

  <text x="34" y="40" class="title">One outcome is a point; an event is a set of points</text>
  <text x="34" y="65" class="t sub">Fair die model: every face has probability 1/6, and every subset is measurable.</text>

  <rect x="34" y="92" width="892" height="210" rx="15" fill="#FFFDF8" stroke="#C4B8A8" stroke-width="1.8"/>
  <text x="58" y="122" class="t h">Membership ledger</text>
  <text x="58" y="144" class="t m">Outcome 4 is one realized face. It belongs to both multi-outcome events.</text>

  <g aria-label="Pattern legend">
    <rect x="570" y="104" width="22" height="22" rx="4" fill="url(#eventA)" class="face"/>
    <text x="600" y="120" class="t m">A</text>
    <rect x="640" y="104" width="22" height="22" rx="4" fill="url(#eventB)" class="face"/>
    <text x="670" y="120" class="t m">B</text>
    <rect x="710" y="104" width="22" height="22" rx="4" fill="url(#eventBoth)" class="face"/>
    <text x="740" y="120" class="t m">A and B</text>
  </g>

  <text x="68" y="190" class="t h">A = even</text>
  <text x="68" y="252" class="t h">B = at least 4</text>

  <g aria-label="Event A contains two four and six">
    <g transform="translate(220 161)">
      <rect x="0" y="0" width="56" height="44" rx="9" fill="#FFFDF8" class="face"/><text x="28" y="29" text-anchor="middle" class="t n">1</text>
      <rect x="68" y="0" width="56" height="44" rx="9" fill="url(#eventA)" class="face"/><text x="96" y="29" text-anchor="middle" class="t n">2</text>
      <rect x="136" y="0" width="56" height="44" rx="9" fill="#FFFDF8" class="face"/><text x="164" y="29" text-anchor="middle" class="t n">3</text>
      <rect x="204" y="0" width="56" height="44" rx="9" fill="url(#eventBoth)" class="face"/><text x="232" y="29" text-anchor="middle" class="t n">4</text>
      <rect x="272" y="0" width="56" height="44" rx="9" fill="#FFFDF8" class="face"/><text x="300" y="29" text-anchor="middle" class="t n">5</text>
      <rect x="340" y="0" width="56" height="44" rx="9" fill="url(#eventBoth)" class="face"/><text x="368" y="29" text-anchor="middle" class="t n">6</text>
    </g>
    <text x="640" y="190" class="t prob">P(A) = 3/6 = 1/2</text>
  </g>

  <g aria-label="Event B contains four five and six">
    <g transform="translate(220 223)">
      <rect x="0" y="0" width="56" height="44" rx="9" fill="#FFFDF8" class="face"/><text x="28" y="29" text-anchor="middle" class="t n">1</text>
      <rect x="68" y="0" width="56" height="44" rx="9" fill="#FFFDF8" class="face"/><text x="96" y="29" text-anchor="middle" class="t n">2</text>
      <rect x="136" y="0" width="56" height="44" rx="9" fill="#FFFDF8" class="face"/><text x="164" y="29" text-anchor="middle" class="t n">3</text>
      <rect x="204" y="0" width="56" height="44" rx="9" fill="url(#eventBoth)" class="face"/><text x="232" y="29" text-anchor="middle" class="t n">4</text>
      <rect x="272" y="0" width="56" height="44" rx="9" fill="url(#eventB)" class="face"/><text x="300" y="29" text-anchor="middle" class="t n">5</text>
      <rect x="340" y="0" width="56" height="44" rx="9" fill="url(#eventBoth)" class="face"/><text x="368" y="29" text-anchor="middle" class="t n">6</text>
    </g>
    <text x="640" y="252" class="t prob">P(B) = 3/6 = 1/2</text>
  </g>

  <g aria-label="Complement of A contains one three and five">
    <rect x="34" y="328" width="282" height="256" rx="15" fill="#FFFDF8" stroke="#4B6787" stroke-width="1.8"/>
    <text x="56" y="361" class="t h">NOT A: complement</text>
    <text x="56" y="384" class="t s">odd outcomes = {1, 3, 5}</text>
    <g transform="translate(57 412)">
      <rect x="0" y="0" width="54" height="46" rx="9" fill="#DCE8EE" class="face"/><text x="27" y="30" text-anchor="middle" class="t n">1</text>
      <rect x="68" y="0" width="54" height="46" rx="9" fill="#DCE8EE" class="face"/><text x="95" y="30" text-anchor="middle" class="t n">3</text>
      <rect x="136" y="0" width="54" height="46" rx="9" fill="#DCE8EE" class="face"/><text x="163" y="30" text-anchor="middle" class="t n">5</text>
    </g>
    <text x="56" y="494" class="t prob">probability 3/6 = 1/2</text>
    <text x="56" y="527" class="t m">Every face outside A.</text>
    <text x="56" y="550" class="t m">The realized face 4 is not here.</text>
  </g>

  <g aria-label="Intersection of A and B contains four and six">
    <rect x="339" y="328" width="282" height="256" rx="15" fill="#FFFDF8" stroke="#315F55" stroke-width="1.8"/>
    <text x="361" y="361" class="t h">A AND B: intersection</text>
    <text x="361" y="384" class="t s">even and at least 4 = {4, 6}</text>
    <g transform="translate(383 412)">
      <rect x="0" y="0" width="62" height="46" rx="9" fill="url(#eventBoth)" class="face"/><text x="31" y="30" text-anchor="middle" class="t n">4</text>
      <rect x="80" y="0" width="62" height="46" rx="9" fill="url(#eventBoth)" class="face"/><text x="111" y="30" text-anchor="middle" class="t n">6</text>
    </g>
    <text x="361" y="494" class="t prob">probability 2/6 = 1/3</text>
    <text x="361" y="527" class="t m">Both questions are true.</text>
    <text x="361" y="550" class="t m">No independence assumption.</text>
  </g>

  <g aria-label="Union of A and B contains two four five and six">
    <rect x="644" y="328" width="282" height="256" rx="15" fill="#FFFDF8" stroke="#9B3F2B" stroke-width="1.8"/>
    <text x="666" y="361" class="t h">A OR B: union</text>
    <text x="666" y="384" class="t s">inclusive or = {2, 4, 5, 6}</text>
    <g transform="translate(666 412)">
      <rect x="0" y="0" width="48" height="46" rx="9" fill="url(#eventA)" class="face"/><text x="24" y="30" text-anchor="middle" class="t n">2</text>
      <rect x="58" y="0" width="48" height="46" rx="9" fill="url(#eventBoth)" class="face"/><text x="82" y="30" text-anchor="middle" class="t n">4</text>
      <rect x="116" y="0" width="48" height="46" rx="9" fill="url(#eventB)" class="face"/><text x="140" y="30" text-anchor="middle" class="t n">5</text>
      <rect x="174" y="0" width="48" height="46" rx="9" fill="url(#eventBoth)" class="face"/><text x="198" y="30" text-anchor="middle" class="t n">6</text>
    </g>
    <text x="666" y="494" class="t prob">probability 4/6 = 2/3</text>
    <text x="666" y="527" class="t m">Membership in either set counts.</text>
    <text x="666" y="550" class="t m">The overlap is included once.</text>
  </g>

  <rect x="34" y="606" width="892" height="24" rx="8" fill="#EAF1E5" stroke="#6F8D5E" stroke-width="1.3"/>
  <text x="480" y="623" text-anchor="middle" class="t m">Experiment: one face occurs. Event question: does that face belong to the marked set?</text>
</svg>
