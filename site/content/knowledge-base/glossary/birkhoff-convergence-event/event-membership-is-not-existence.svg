<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360"
     viewBox="0 0 760 360" role="img"
     aria-labelledby="eventTitle eventDesc">
  <title id="eventTitle">Convergence-event membership is not a convergence theorem</title>
  <desc id="eventDesc">Two conceptual sequences of finite orbit averages are compared. One settles toward a finite level and its starting point belongs to the event. The other rises without settling and stays outside. A footer says that naming, measuring, or proving invariance of the event does not put all points inside it.</desc>
  <rect width="760" height="360" fill="#F7F4F0"/>
  <style>
    .t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#2C2924}
    .title{font-size:15px;font-weight:700}
    .h{font-size:13px;font-weight:700}
    .s{font-size:12px}
    .m{font-size:11px;fill:#5A544C}
    .good{fill:#EAF1E5;stroke:#6F8D5E;stroke-width:1.5}
    .warn{fill:#F3E8E0;stroke:#A67C52;stroke-width:1.5}
    .plot{fill:#FBF9F6;stroke:#C4B8A8;stroke-width:1.2}
  </style>
  <text x="24" y="28" class="t title">Membership is a property of one whole average sequence</text>
  <text x="24" y="48" class="t m">The two traces are conceptual examples, not measured data.</text>

  <rect class="good" x="24" y="70" width="344" height="218" rx="12"/>
  <text x="44" y="96" class="t h">STARTING POINT A</text>
  <text x="44" y="116" class="t m">finite averages settle toward one finite level</text>
  <rect class="plot" x="44" y="132" width="304" height="100" rx="8"/>
  <line x1="62" y1="210" x2="330" y2="210" stroke="#7F786D" stroke-width="1"/>
  <line x1="62" y1="148" x2="62" y2="210" stroke="#7F786D" stroke-width="1"/>
  <line x1="62" y1="174" x2="330" y2="174" stroke="#6F8D5E" stroke-width="1.5" stroke-dasharray="5 4"/>
  <polyline points="70,196 105,158 140,183 175,168 210,178 245,171 280,175 322,173"
            fill="none" stroke="#4B6787" stroke-width="2.5"/>
  <circle cx="70" cy="196" r="3" fill="#4B6787"/>
  <circle cx="140" cy="183" r="3" fill="#4B6787"/>
  <circle cx="210" cy="178" r="3" fill="#4B6787"/>
  <circle cx="280" cy="175" r="3" fill="#4B6787"/>
  <text x="44" y="258" class="t h" fill="#47633B">IN THE CONVERGENCE EVENT</text>
  <text x="44" y="277" class="t m">a finite real limit exists for this point</text>

  <rect class="warn" x="392" y="70" width="344" height="218" rx="12"/>
  <text x="412" y="96" class="t h">STARTING POINT B</text>
  <text x="412" y="116" class="t m">finite averages keep rising instead of settling</text>
  <rect class="plot" x="412" y="132" width="304" height="100" rx="8"/>
  <line x1="430" y1="210" x2="698" y2="210" stroke="#7F786D" stroke-width="1"/>
  <line x1="430" y1="148" x2="430" y2="210" stroke="#7F786D" stroke-width="1"/>
  <polyline points="438,203 474,196 510,188 546,178 582,166 618,151 654,132 690,108"
            fill="none" stroke="#A67C52" stroke-width="2.5"/>
  <circle cx="438" cy="203" r="3" fill="#A67C52"/>
  <circle cx="510" cy="188" r="3" fill="#A67C52"/>
  <circle cx="582" cy="166" r="3" fill="#A67C52"/>
  <circle cx="654" cy="132" r="3" fill="#A67C52"/>
  <text x="412" y="258" class="t h" fill="#934F1F">OUTSIDE THE CONVERGENCE EVENT</text>
  <text x="412" y="277" class="t m">no finite real limit exists for this point</text>

  <rect x="24" y="306" width="712" height="36" rx="10" fill="#EAF1E5" stroke="#6F8D5E" stroke-width="1.5"/>
  <text x="380" y="329" text-anchor="middle" class="t s">Defining, measuring, or proving invariance of the event does not put every point inside it.</text>
</svg>
