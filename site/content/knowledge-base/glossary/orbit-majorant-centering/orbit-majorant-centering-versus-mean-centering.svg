<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760"
     viewBox="0 0 1000 760" role="img"
     aria-labelledby="orbitCenterTitle orbitCenterDesc">
  <title id="orbitCenterTitle">Orbit-majorant centering computed on a three-state cycle</title>
  <desc id="orbitCenterDesc">A three-state cycle has readings 3, minus 1, and 2. A horizon table starting at state a shows orbit sums 3, 2, 4, 7; triangular penalties 0, 1, 3, 6; process values 3, 1, 1, 1; and orbit-centered remainders 0, minus 1, minus 3, minus 6. A second table at horizon two contrasts the constant orbit-centered value minus 1 with expectation-centered values minus two thirds, minus five thirds, and seven thirds.</desc>
  <rect width="1000" height="760" fill="#F7F1E7"/>
  <style>
    .text{font-family:Inter,Arial,Helvetica,sans-serif;fill:#28231E}
    .title{font-size:28px;font-weight:700}
    .subtitle{font-size:15px;fill:#5B5147}
    .section{font-size:17px;font-weight:700}
    .head{font-size:14px;font-weight:700}
    .body{font-size:14px}
    .small{font-size:12px;fill:#5B5147}
    .orbitBox{fill:#E7EFF6;stroke:#426889;stroke-width:2}
    .majorant{fill:#E8F0E2;stroke:#5D7D4F;stroke-width:2}
    .remainder{fill:#F3E3D5;stroke:#9A6545;stroke-width:2}
    .mean{fill:#EEE8F4;stroke:#735A8E;stroke-width:2}
    .paper{fill:#FFFCF7;stroke:#B6A99A;stroke-width:1.5}
    .line{stroke:#8E8174;stroke-width:1.2}
    .arrow{stroke:#426889;stroke-width:2.4;fill:none;marker-end:url(#arrowhead)}
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="8" refY="3"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#426889"/>
    </marker>
  </defs>

  <text x="40" y="42" class="text title">One orbit sum, two very different centerings</text>
  <text x="40" y="68" class="text subtitle">Exact toy values; no probability limit or ergodic theorem is being inferred</text>

  <text x="40" y="105" class="text section">1. Follow one orbit starting at a</text>
  <rect x="40" y="122" width="176" height="70" rx="12" class="orbitBox"/>
  <text x="128" y="149" text-anchor="middle" class="text head">time 0: state a</text>
  <text x="128" y="175" text-anchor="middle" class="text body">reading g(a) = 3</text>
  <path d="M216 157 H286" class="arrow"/>
  <rect x="296" y="122" width="176" height="70" rx="12" class="orbitBox"/>
  <text x="384" y="149" text-anchor="middle" class="text head">time 1: state b</text>
  <text x="384" y="175" text-anchor="middle" class="text body">reading g(b) = -1</text>
  <path d="M472 157 H542" class="arrow"/>
  <rect x="552" y="122" width="176" height="70" rx="12" class="orbitBox"/>
  <text x="640" y="149" text-anchor="middle" class="text head">time 2: state c</text>
  <text x="640" y="175" text-anchor="middle" class="text body">reading g(c) = 2</text>
  <path d="M728 157 H798" class="arrow"/>
  <rect x="808" y="122" width="152" height="70" rx="12" class="orbitBox"/>
  <text x="884" y="149" text-anchor="middle" class="text head">time 3: state a</text>
  <text x="884" y="175" text-anchor="middle" class="text body">reading = 3</text>

  <text x="40" y="231" class="text section">2. Subtract the triangular penalty from the orbit majorant</text>
  <rect x="40" y="248" width="920" height="232" rx="12" class="paper"/>
  <rect x="40" y="248" width="920" height="42" rx="12" class="majorant"/>
  <text x="83" y="275" text-anchor="middle" class="text head">n</text>
  <text x="210" y="275" text-anchor="middle" class="text head">orbit sum S_n</text>
  <text x="358" y="275" text-anchor="middle" class="text head">penalty c_n</text>
  <text x="498" y="275" text-anchor="middle" class="text head">X_n = S_n - c_n</text>
  <text x="650" y="275" text-anchor="middle" class="text head">Y_n = X_n - S_n</text>
  <text x="830" y="275" text-anchor="middle" class="text head">normalized split</text>
  <line x1="120" y1="248" x2="120" y2="480" class="line"/>
  <line x1="286" y1="248" x2="286" y2="480" class="line"/>
  <line x1="430" y1="248" x2="430" y2="480" class="line"/>
  <line x1="568" y1="248" x2="568" y2="480" class="line"/>
  <line x1="731" y1="248" x2="731" y2="480" class="line"/>
  <line x1="40" y1="337" x2="960" y2="337" class="line"/>
  <line x1="40" y1="385" x2="960" y2="385" class="line"/>
  <line x1="40" y1="433" x2="960" y2="433" class="line"/>

  <text x="83" y="320" text-anchor="middle" class="text body">1</text>
  <text x="210" y="320" text-anchor="middle" class="text body">3</text>
  <text x="358" y="320" text-anchor="middle" class="text body">0</text>
  <text x="498" y="320" text-anchor="middle" class="text body">3</text>
  <text x="650" y="320" text-anchor="middle" class="text body">0</text>
  <text x="830" y="320" text-anchor="middle" class="text body">3 = 0 + 3</text>

  <text x="83" y="368" text-anchor="middle" class="text body">2</text>
  <text x="210" y="368" text-anchor="middle" class="text body">3 + (-1) = 2</text>
  <text x="358" y="368" text-anchor="middle" class="text body">1</text>
  <text x="498" y="368" text-anchor="middle" class="text body">1</text>
  <text x="650" y="368" text-anchor="middle" class="text body">-1</text>
  <text x="830" y="368" text-anchor="middle" class="text body">1/2 = -1/2 + 1</text>

  <text x="83" y="416" text-anchor="middle" class="text body">3</text>
  <text x="210" y="416" text-anchor="middle" class="text body">3 + (-1) + 2 = 4</text>
  <text x="358" y="416" text-anchor="middle" class="text body">3</text>
  <text x="498" y="416" text-anchor="middle" class="text body">1</text>
  <text x="650" y="416" text-anchor="middle" class="text body">-3</text>
  <text x="830" y="416" text-anchor="middle" class="text body">1/3 = -1 + 4/3</text>

  <text x="83" y="464" text-anchor="middle" class="text body">4</text>
  <text x="210" y="464" text-anchor="middle" class="text body">3 + (-1) + 2 + 3 = 7</text>
  <text x="358" y="464" text-anchor="middle" class="text body">6</text>
  <text x="498" y="464" text-anchor="middle" class="text body">1</text>
  <text x="650" y="464" text-anchor="middle" class="text body">-6</text>
  <text x="830" y="464" text-anchor="middle" class="text body">1/4 = -3/2 + 7/4</text>

  <text x="40" y="520" class="text section">3. At horizon two, the pointwise majorant is not a scalar mean</text>
  <rect x="40" y="538" width="920" height="154" rx="12" class="paper"/>
  <rect x="40" y="538" width="920" height="39" rx="12" class="mean"/>
  <text x="105" y="563" text-anchor="middle" class="text head">start</text>
  <text x="255" y="563" text-anchor="middle" class="text head">process X_2</text>
  <text x="470" y="563" text-anchor="middle" class="text head">subtract own S_2</text>
  <text x="470" y="585" text-anchor="middle" class="text small">orbit-centered Y_2</text>
  <text x="745" y="563" text-anchor="middle" class="text head">subtract scalar mean 5/3</text>
  <text x="745" y="585" text-anchor="middle" class="text small">expectation-centered value</text>
  <line x1="170" y1="538" x2="170" y2="692" class="line"/>
  <line x1="340" y1="538" x2="340" y2="692" class="line"/>
  <line x1="610" y1="538" x2="610" y2="692" class="line"/>
  <line x1="40" y1="600" x2="960" y2="600" class="line"/>
  <text x="105" y="625" text-anchor="middle" class="text body">a</text>
  <text x="255" y="625" text-anchor="middle" class="text body">1</text>
  <text x="470" y="625" text-anchor="middle" class="text body">1 - 2 = -1</text>
  <text x="745" y="625" text-anchor="middle" class="text body">1 - 5/3 = -2/3</text>
  <text x="105" y="650" text-anchor="middle" class="text body">b</text>
  <text x="255" y="650" text-anchor="middle" class="text body">0</text>
  <text x="470" y="650" text-anchor="middle" class="text body">0 - 1 = -1</text>
  <text x="745" y="650" text-anchor="middle" class="text body">0 - 5/3 = -5/3</text>
  <text x="105" y="675" text-anchor="middle" class="text body">c</text>
  <text x="255" y="675" text-anchor="middle" class="text body">4</text>
  <text x="470" y="675" text-anchor="middle" class="text body">4 - 5 = -1</text>
  <text x="745" y="675" text-anchor="middle" class="text body">4 - 5/3 = 7/3</text>

  <rect x="40" y="712" width="920" height="32" rx="10" class="remainder"/>
  <text x="500" y="733" text-anchor="middle" class="text head">Orbit-centered mean = -1; expectation-centered mean = 0. Different subtraction, different guarantee.</text>
</svg>
