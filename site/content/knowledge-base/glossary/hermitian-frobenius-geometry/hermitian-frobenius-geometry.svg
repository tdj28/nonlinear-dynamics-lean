<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520"
     viewBox="0 0 800 520" role="img"
     aria-labelledby="frobeniusGeometryTitle frobeniusGeometryDesc">
  <title id="frobeniusGeometryTitle">Hermitian matrices inside Frobenius Euclidean geometry</title>
  <desc id="frobeniusGeometryDesc">An ambient complex matrix has Frobenius squared norm equal to the sum of all entry magnitudes squared. Restricting to Hermitian matrices leaves real diagonal coordinates and conjugate off-diagonal pairs, so each strict-upper real and imaginary coordinate receives weight two. Rescaling those coordinates by square root of two gives real orthonormal coordinates. Unitary congruence preserves the geometry.</desc>
  <rect width="800" height="520" fill="#F7F4F0"/>
  <style>
    .t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#2C2924}
    .title{font-size:15px;font-weight:700}
    .h{font-size:13px;font-weight:700}
    .s{font-size:12px}
    .m{font-size:11px;fill:#5A544C}
    .eq{font-family:Georgia,'Times New Roman',serif;font-size:13px;fill:#2C2924}
  </style>
  <defs>
    <marker id="frobeniusArrow" markerWidth="8" markerHeight="8" refX="7" refY="4"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#A67C52"/>
    </marker>
  </defs>

  <text x="24" y="30" class="t title">The factor-of-two ledger is the Euclidean geometry of Hermitian matrices</text>
  <text x="24" y="50" class="t m">One reflected off-diagonal coordinate occupies two ambient matrix entries.</text>

  <rect x="24" y="78" width="226" height="160" rx="12" fill="#E8F0F7" stroke="#4B6787" stroke-width="1.5"/>
  <text x="137" y="107" text-anchor="middle" class="t h">AMBIENT FROBENIUS SPACE</text>
  <text x="137" y="138" text-anchor="middle" class="t s">FROBENIUS TRACE PAIRING</text>
  <text x="137" y="169" text-anchor="middle" class="t s">NORM SUMS EVERY ENTRY</text>
  <text x="137" y="203" text-anchor="middle" class="t m">the full complex array is visible</text>

  <path d="M252 158 L286 158" fill="none" stroke="#A67C52" stroke-width="2" marker-end="url(#frobeniusArrow)"/>

  <rect x="292" y="78" width="240" height="160" rx="12" fill="#F3E8E0" stroke="#A67C52" stroke-width="1.5"/>
  <text x="412" y="107" text-anchor="middle" class="t h">HERMITIAN REAL SUBSPACE</text>
  <text x="412" y="136" text-anchor="middle" class="t s">REAL DIAGONAL COORDINATES</text>
  <text x="412" y="160" text-anchor="middle" class="t s">FREE COMPLEX VALUES ABOVE</text>
  <text x="412" y="184" text-anchor="middle" class="t s">CONJUGATE REFLECTIONS BELOW</text>
  <text x="412" y="211" text-anchor="middle" class="t m">closed under real, not complex, scaling</text>

  <path d="M534 158 L568 158" fill="none" stroke="#A67C52" stroke-width="2" marker-end="url(#frobeniusArrow)"/>

  <rect x="574" y="78" width="202" height="160" rx="12" fill="#EAF1E5" stroke="#6F8D5E" stroke-width="1.5"/>
  <text x="675" y="107" text-anchor="middle" class="t h">ORTHONORMAL LEDGER</text>
  <text x="675" y="140" text-anchor="middle" class="t s">DIAGONAL SLOTS</text>
  <text x="675" y="166" text-anchor="middle" class="t s">UPPER REAL SLOTS</text>
  <text x="675" y="192" text-anchor="middle" class="t s">UPPER IMAGINARY SLOTS</text>
  <text x="675" y="216" text-anchor="middle" class="t m">one normalized real ledger</text>

  <rect x="70" y="278" width="660" height="88" rx="12" fill="#FBF9F6" stroke="#C4B8A8" stroke-width="1.5"/>
  <text x="400" y="307" text-anchor="middle" class="t h">FACTOR-TWO IDENTITY</text>
  <text x="400" y="337" text-anchor="middle" class="t s">DIAGONAL WEIGHT ONE; OFF-DIAGONAL PAIR WEIGHT TWO</text>
  <text x="400" y="357" text-anchor="middle" class="t m">the upper coordinate and its conjugate reflection make equal contributions</text>

  <path d="M400 368 L400 396" fill="none" stroke="#A67C52" stroke-width="2" marker-end="url(#frobeniusArrow)"/>
  <rect x="150" y="402" width="500" height="78" rx="12" fill="#16243A" stroke="#16243A" stroke-width="1.5"/>
  <text x="400" y="431" text-anchor="middle" class="t h" fill="#FFFDF8" style="fill:#FFFDF8">UNITARY CONGRUENCE IS A REAL LINEAR ISOMETRY</text>
  <text x="400" y="457" text-anchor="middle" class="t s" fill="#FFFDF8" style="fill:#FFFDF8">THE TWO-SIDED UNITARY ACTION PRESERVES THE GEOMETRY</text>

  <text x="24" y="508" class="t m">Geometry explains both the Gaussian scaling bridge and why an intrinsic standard Gaussian is rotation invariant.</text>
</svg>
