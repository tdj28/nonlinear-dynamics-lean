<svg xmlns="http://www.w3.org/2000/svg" width="960" height="700"
     viewBox="0 0 960 700" role="img"
     aria-labelledby="frobeniusExampleTitle frobeniusExampleDesc">
  <title id="frobeniusExampleTitle">A two-by-two Hermitian Frobenius calculation</title>
  <desc id="frobeniusExampleDesc">Two explicit Hermitian matrices are compared cell by cell. Diagonal contributions two and minus two cancel. Conjugate off-diagonal contributions minus two i and plus two i cancel. Weighted real-coordinate vectors have dot product zero. A norm panel shows squared norm nine, norm three, correct normalization by three, and the errors caused by forgetting a reflected entry or dividing by nine.</desc>

  <defs>
    <pattern id="diagonalDots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#E8F0F7"/>
      <circle cx="3" cy="3" r="1.3" fill="#4B6787"/>
    </pattern>
    <pattern id="offDiagonalHatch" width="9" height="9"
             patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="9" height="9" fill="#F7E8DB"/>
      <path d="M0 0 V9" stroke="#B65F2A" stroke-width="2"/>
    </pattern>
    <marker id="ledgerArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#A67C52"/>
    </marker>
  </defs>

  <style>
    .sans { font-family: Inter, Arial, Helvetica, sans-serif; fill: #252A34; }
    .serif { font-family: Georgia, "Times New Roman", serif; fill: #252A34; }
    .title { font-size: 24px; font-weight: 700; }
    .subtitle { font-size: 13px; fill: #5E625F; }
    .panel-title { font-size: 14px; font-weight: 700; letter-spacing: 0.5px; }
    .label { font-size: 13px; font-weight: 700; }
    .body { font-size: 13px; }
    .small { font-size: 11.5px; fill: #5E625F; }
    .value { font-size: 16px; }
    .equation { font-size: 15px; }
    .result { font-size: 18px; font-weight: 700; }
  </style>

  <rect width="960" height="700" fill="#F7F4F0"/>
  <rect x="0" y="0" width="960" height="10" fill="#16243A"/>

  <text x="28" y="43" class="sans title">Audit Frobenius geometry one matrix cell at a time</text>
  <text x="28" y="64" class="sans subtitle">Diagonal slots count once. One free complex upper slot appears again as its conjugate below the diagonal.</text>

  <!-- Explicit matrix pair -->
  <rect x="24" y="82" width="310" height="244" rx="15"
        fill="#FFFDF8" stroke="#C7BDAE" stroke-width="1.5"/>
  <text x="44" y="109" class="sans panel-title">1  START WITH TWO HERMITIAN MATRICES</text>

  <text x="112" y="137" text-anchor="middle" class="serif label">A</text>
  <text x="248" y="137" text-anchor="middle" class="serif label">B</text>

  <g aria-label="Matrix A">
    <rect x="50" y="149" width="62" height="48" fill="url(#diagonalDots)"
          stroke="#4B6787" stroke-width="1.2"/>
    <rect x="112" y="149" width="62" height="48" fill="url(#offDiagonalHatch)"
          stroke="#B65F2A" stroke-width="1.2"/>
    <rect x="50" y="197" width="62" height="48" fill="url(#offDiagonalHatch)"
          stroke="#B65F2A" stroke-width="1.2"/>
    <rect x="112" y="197" width="62" height="48" fill="url(#diagonalDots)"
          stroke="#4B6787" stroke-width="1.2"/>
    <text x="81" y="179" text-anchor="middle" class="serif value">1</text>
    <text x="143" y="179" text-anchor="middle" class="serif value">1+i</text>
    <text x="81" y="227" text-anchor="middle" class="serif value">1−i</text>
    <text x="143" y="227" text-anchor="middle" class="serif value">2</text>
  </g>

  <g aria-label="Matrix B">
    <rect x="186" y="149" width="62" height="48" fill="url(#diagonalDots)"
          stroke="#4B6787" stroke-width="1.2"/>
    <rect x="248" y="149" width="62" height="48" fill="url(#offDiagonalHatch)"
          stroke="#B65F2A" stroke-width="1.2"/>
    <rect x="186" y="197" width="62" height="48" fill="url(#offDiagonalHatch)"
          stroke="#B65F2A" stroke-width="1.2"/>
    <rect x="248" y="197" width="62" height="48" fill="url(#diagonalDots)"
          stroke="#4B6787" stroke-width="1.2"/>
    <text x="217" y="179" text-anchor="middle" class="serif value">2</text>
    <text x="279" y="179" text-anchor="middle" class="serif value">1−i</text>
    <text x="217" y="227" text-anchor="middle" class="serif value">1+i</text>
    <text x="279" y="227" text-anchor="middle" class="serif value">−1</text>
  </g>

  <rect x="48" y="263" width="16" height="16" fill="url(#diagonalDots)"
        stroke="#4B6787"/>
  <text x="70" y="276" class="sans small">diagonal: real, one occupied slot</text>
  <rect x="48" y="289" width="16" height="16" fill="url(#offDiagonalHatch)"
        stroke="#B65F2A"/>
  <text x="70" y="302" class="sans small">off-diagonal: one conjugate-reflected pair</text>

  <!-- Entrywise ledger -->
  <rect x="352" y="82" width="272" height="244" rx="15"
        fill="#FFFDF8" stroke="#C7BDAE" stroke-width="1.5"/>
  <text x="372" y="109" class="sans panel-title">2  CONJUGATE A, MULTIPLY BY B</text>

  <g class="sans body">
    <rect x="372" y="126" width="232" height="36" rx="8" fill="#E8F0F7"/>
    <text x="384" y="149">slot 00</text>
    <text x="493" y="149" class="serif equation">1 × 2 = 2</text>

    <rect x="372" y="167" width="232" height="36" rx="8" fill="#F7E8DB"/>
    <text x="384" y="190">slot 01</text>
    <text x="462" y="190" class="serif equation">(1−i)(1−i) = −2i</text>

    <rect x="372" y="208" width="232" height="36" rx="8" fill="#F7E8DB"/>
    <text x="384" y="231">slot 10</text>
    <text x="462" y="231" class="serif equation">(1+i)(1+i) = 2i</text>

    <rect x="372" y="249" width="232" height="36" rx="8" fill="#E8F0F7"/>
    <text x="384" y="272">slot 11</text>
    <text x="493" y="272" class="serif equation">2 × (−1) = −2</text>
  </g>

  <path d="M397 300 H574" fill="none" stroke="#A67C52" stroke-width="1.5"/>
  <text x="488" y="318" text-anchor="middle" class="serif result">2 − 2i + 2i − 2 = 0</text>

  <!-- Weighted real coordinates -->
  <rect x="642" y="82" width="294" height="244" rx="15"
        fill="#FFFDF8" stroke="#C7BDAE" stroke-width="1.5"/>
  <text x="662" y="109" class="sans panel-title">3  WEIGHT THE REAL COORDINATES</text>

  <text x="662" y="140" class="sans body">free data</text>
  <text x="742" y="140" class="serif body">(d₀, d₁, Re z, Im z)</text>
  <path d="M783 148 V166" stroke="#A67C52" stroke-width="2"
        marker-end="url(#ledgerArrow)"/>
  <text x="662" y="182" class="sans body">metric data</text>
  <text x="742" y="182" class="serif body">(d₀, d₁, √2 Re z, √2 Im z)</text>

  <rect x="662" y="200" width="254" height="47" rx="9"
        fill="#EAF1E5" stroke="#6F8D5E"/>
  <text x="674" y="221" class="serif equation">Φ(A) = (1, 2, √2, √2)</text>
  <text x="674" y="240" class="serif equation">Φ(B) = (2, −1, √2, −√2)</text>

  <text x="789" y="274" text-anchor="middle" class="sans small">ordinary Euclidean dot product</text>
  <text x="789" y="301" text-anchor="middle" class="serif result">2 − 2 + 2 − 2 = 0</text>
  <text x="789" y="318" text-anchor="middle" class="sans small">same orthogonality, now in real coordinates</text>

  <!-- Norm and normalization -->
  <rect x="24" y="348" width="912" height="304" rx="15"
        fill="#FFFDF8" stroke="#C7BDAE" stroke-width="1.5"/>
  <text x="44" y="378" class="sans panel-title">4  DISTINGUISH THE FULL NORM, THE NORM, AND THE SQUARED NORM</text>

  <rect x="44" y="396" width="396" height="164" rx="12"
        fill="#F4F7FA" stroke="#9AAFC3"/>
  <text x="62" y="422" class="sans label">Every occupied cell of A contributes</text>
  <text x="62" y="451" class="serif equation">diagonal:  |1|² + |2|² = 1 + 4 = 5</text>
  <text x="62" y="480" class="serif equation">reflected pair:  |1+i|² + |1−i|² = 2 + 2 = 4</text>
  <path d="M62 493 H420" stroke="#4B6787" stroke-width="1.5"/>
  <text x="62" y="522" class="serif result">‖A‖² = 9</text>
  <path d="M183 514 H232" stroke="#A67C52" stroke-width="2"
        marker-end="url(#ledgerArrow)"/>
  <text x="250" y="522" class="serif result">‖A‖ = √9 = 3</text>
  <text x="62" y="546" class="sans small">The square root separates squared norm from norm.</text>

  <rect x="460" y="396" width="214" height="76" rx="12"
        fill="#EAF1E5" stroke="#6F8D5E" stroke-width="1.5"/>
  <text x="478" y="420" class="sans label" fill="#315F55">CORRECT NORMALIZATION</text>
  <text x="478" y="447" class="serif equation">‖A / 3‖ = 1</text>
  <text x="478" y="464" class="sans small">divide by the norm</text>

  <rect x="692" y="396" width="224" height="76" rx="12"
        fill="#FAECE8" stroke="#B34E3D" stroke-width="1.5"/>
  <text x="710" y="420" class="sans label" fill="#8B352A">NEAR MISS: DIVIDE BY 9</text>
  <text x="710" y="447" class="serif equation">‖A / 9‖ = 1/3</text>
  <text x="710" y="464" class="sans small">squared norm is not the norm</text>

  <rect x="460" y="488" width="456" height="72" rx="12"
        fill="#FFF4E7" stroke="#C27A32" stroke-width="1.5"/>
  <text x="478" y="512" class="sans label" fill="#8A4F18">NEAR MISS: COUNT THE FREE UPPER SLOT ONLY ONCE</text>
  <text x="478" y="538" class="serif equation">1 + 4 + |1+i|² = 7</text>
  <text x="688" y="538" class="sans small">forgot the reflected lower slot</text>

  <rect x="44" y="579" width="872" height="52" rx="11"
        fill="#16243A"/>
  <text x="62" y="601" class="sans label" style="fill:#FFFDF8">GAUSSIAN CONSEQUENCE</text>
  <text x="62" y="620" class="sans body" style="fill:#FFFDF8">Equal variance in (d, √2 Re z, √2 Im z) means raw Re z and Im z each have half the diagonal variance.</text>

  <text x="28" y="683" class="sans small">Pattern and labels carry the diagonal versus off-diagonal distinction; color is supplementary.</text>
</svg>
