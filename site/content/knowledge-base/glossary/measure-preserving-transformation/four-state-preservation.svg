<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="preserve-title preserve-desc">
  <title id="preserve-title">A four-state cycle preserves uniform mass while a collapsing map does not</title>
  <desc id="preserve-desc">Four states numbered zero through three each have probability one quarter. In the upper panel, arrows form the cycle zero to one to two to three to zero. The event A containing zero and one has preimage three and zero, so both have probability one half. In the lower panel, a many-to-one map sends zero and one to zero and sends two and three to two. The singleton F containing zero has preimage zero and one, whose probability one half differs from F's probability one quarter. The event E containing zero and one happens to have the same one-half mass as its preimage, showing that one successful event does not prove preservation. A final strip says that the identity preserves the measure but is not ergodic on four positive-mass states.</desc>
  <defs>
    <pattern id="preserve-a" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="12" height="12" fill="#f7ddb0"/>
      <rect width="4" height="12" fill="#a66b31"/>
    </pattern>
    <pattern id="preserve-pre" width="14" height="14" patternUnits="userSpaceOnUse">
      <rect width="14" height="14" fill="#dcebe3"/>
      <circle cx="4" cy="4" r="2.4" fill="#39725f"/>
      <circle cx="11" cy="11" r="2.4" fill="#39725f"/>
    </pattern>
    <filter id="preserve-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#342a22" flood-opacity="0.13"/>
    </filter>
    <marker id="preserve-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6f5744"/>
    </marker>
    <style>
      .ink { fill: #29231e; }
      .muted { fill: #665b51; }
      .title { font: 700 31px Georgia, serif; }
      .heading { font: 700 21px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .body { font: 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .small { font: 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .equation { font: 700 20px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .state { font: 700 23px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; }
      .center { text-anchor: middle; }
    </style>
  </defs>

  <rect width="1200" height="900" rx="24" fill="#f7f0e3"/>
  <text x="48" y="52" class="title ink">Preservation asks every measurable event</text>
  <text x="48" y="82" class="body muted">Each state has probability 1/4. Preimages reveal whether a map moves the measure.</text>

  <rect x="40" y="108" width="1120" height="336" rx="22" fill="#fffaf1" stroke="#987858" stroke-width="2" filter="url(#preserve-shadow)"/>
  <text x="68" y="148" class="heading ink">The cycle T: 0 → 1 → 2 → 3 → 0 preserves uniform mass</text>

  <path d="M 175 237 C 225 176, 315 176, 365 237" fill="none" stroke="#6f5744" stroke-width="3" marker-end="url(#preserve-arrow)"/>
  <path d="M 425 237 C 475 176, 565 176, 615 237" fill="none" stroke="#6f5744" stroke-width="3" marker-end="url(#preserve-arrow)"/>
  <path d="M 675 237 C 725 176, 815 176, 865 237" fill="none" stroke="#6f5744" stroke-width="3" marker-end="url(#preserve-arrow)"/>
  <path d="M 900 285 C 900 354, 140 354, 140 285" fill="none" stroke="#6f5744" stroke-width="3" marker-end="url(#preserve-arrow)"/>

  <circle cx="140" cy="255" r="42" fill="url(#preserve-a)" stroke="#8a592b" stroke-width="3"/>
  <circle cx="390" cy="255" r="42" fill="url(#preserve-a)" stroke="#8a592b" stroke-width="3"/>
  <circle cx="640" cy="255" r="42" fill="#e6edf5" stroke="#45678d" stroke-width="3"/>
  <circle cx="890" cy="255" r="42" fill="url(#preserve-pre)" stroke="#356753" stroke-width="3"/>
  <text x="140" y="263" class="state ink">0</text>
  <text x="390" y="263" class="state ink">1</text>
  <text x="640" y="263" class="state ink">2</text>
  <text x="890" y="263" class="state ink">3</text>
  <text x="140" y="316" class="small ink center">in A and preimage</text>
  <text x="390" y="316" class="small ink center">in A</text>
  <text x="640" y="316" class="small ink center">outside both</text>
  <text x="890" y="316" class="small ink center">in preimage</text>

  <rect x="68" y="365" width="1018" height="54" rx="14" fill="#f2f7f3" stroke="#39725f" stroke-width="2"/>
  <text x="92" y="398" class="equation ink">A = {0, 1},   T⁻¹(A) = {3, 0},   P(A) = 2/4 = 1/2 = P(T⁻¹(A))</text>
  <text x="925" y="398" class="equation ink">PASS</text>
  <text x="68" y="433" class="small muted">Because T is a permutation, every subset and its preimage contain the same number of quarter-mass states.</text>

  <rect x="40" y="468" width="1120" height="308" rx="22" fill="#fffaf1" stroke="#987858" stroke-width="2" filter="url(#preserve-shadow)"/>
  <text x="68" y="508" class="heading ink">The collapse C: 0,1 ↦ 0 and 2,3 ↦ 2 is measurable but not preserving</text>

  <g aria-label="Many-to-one arrows from four source states to two occupied target states">
    <circle cx="110" cy="570" r="27" fill="#f7ddb0" stroke="#8a592b" stroke-width="2"/>
    <circle cx="110" cy="647" r="27" fill="#f7ddb0" stroke="#8a592b" stroke-width="2"/>
    <circle cx="110" cy="705" r="27" fill="#e6edf5" stroke="#45678d" stroke-width="2"/>
    <circle cx="110" cy="748" r="27" fill="#e6edf5" stroke="#45678d" stroke-width="2"/>
    <text x="110" y="578" class="state ink">0</text>
    <text x="110" y="655" class="state ink">1</text>
    <text x="110" y="713" class="state ink">2</text>
    <text x="110" y="756" class="state ink">3</text>
    <circle cx="332" cy="605" r="36" fill="#fff3dc" stroke="#8a592b" stroke-width="3"/>
    <circle cx="332" cy="718" r="36" fill="#eef3f9" stroke="#45678d" stroke-width="3"/>
    <text x="332" y="613" class="state ink">0</text>
    <text x="332" y="726" class="state ink">2</text>
    <path d="M 140 570 L 286 598" stroke="#6f5744" stroke-width="3" marker-end="url(#preserve-arrow)"/>
    <path d="M 140 647 L 286 612" stroke="#6f5744" stroke-width="3" marker-end="url(#preserve-arrow)"/>
    <path d="M 140 705 L 286 714" stroke="#6f5744" stroke-width="3" marker-end="url(#preserve-arrow)"/>
    <path d="M 140 748 L 286 726" stroke="#6f5744" stroke-width="3" marker-end="url(#preserve-arrow)"/>
    <text x="215" y="545" class="small muted center">source preimages</text>
    <text x="332" y="545" class="small muted center">target</text>
  </g>

  <rect x="410" y="540" width="710" height="91" rx="16" fill="#fff1ee" stroke="#ad4036" stroke-width="3"/>
  <text x="438" y="572" class="heading ink">Failure witness F = {0}</text>
  <text x="438" y="605" class="equation ink">C⁻¹(F) = {0, 1}:   P(C⁻¹(F)) = 1/2 ≠ 1/4 = P(F)</text>
  <text x="1035" y="605" class="equation ink">FAIL</text>

  <rect x="410" y="650" width="710" height="91" rx="16" fill="#f2f7f3" stroke="#39725f" stroke-width="2"/>
  <text x="438" y="682" class="heading ink">One event can pass: E = {0, 1}</text>
  <text x="438" y="715" class="equation ink">C⁻¹(E) = {0, 1}:   P(C⁻¹(E)) = 1/2 = P(E)</text>
  <text x="941" y="715" class="small muted">Still not preservation.</text>
  <text x="410" y="766" class="small muted">All maps on this finite full-power-set space are measurable. Measurability alone does not control masses.</text>

  <rect x="40" y="800" width="1120" height="66" rx="18" fill="#fff4ef" stroke="#ad4036" stroke-width="2"/>
  <text x="68" y="829" class="heading ink">Preserving is not the same as ergodic</text>
  <text x="500" y="829" class="body ink">The identity map preserves P, but every singleton is invariant.</text>
  <text x="500" y="854" class="small muted">On four positive-mass states, identity dynamics are therefore not ergodic.</text>
</svg>
