<svg xmlns="http://www.w3.org/2000/svg" width="960" height="720"
     viewBox="0 0 960 720" role="img"
     aria-labelledby="finiteProductExampleTitle finiteProductExampleDesc">
  <title id="finiteProductExampleTitle">Two noncommuting matrices along two finite sample paths</title>
  <desc id="finiteProductExampleDesc">A red path applies upper shear U at time zero and lower shear L at time one, producing L times U with rows one one and one two. A blue path reverses the times, producing U times L with rows two one and one one. A vector check distinguishes the actions. A horizon ladder starts with the identity. A law panel assigns weights one quarter and three quarters to the realized products. A proof panel separates prefix measurability from integrability.</desc>

  <defs>
    <pattern id="upperShearDots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#E8F0F7"/>
      <circle cx="3" cy="3" r="1.3" fill="#4B6787"/>
    </pattern>
    <pattern id="lowerShearHatch" width="9" height="9"
             patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="9" height="9" fill="#F7E8DB"/>
      <path d="M0 0 V9" stroke="#B65F2A" stroke-width="2"/>
    </pattern>
    <marker id="timeArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#A67C52"/>
    </marker>
  </defs>

  <style>
    .sans { font-family: Inter, Arial, Helvetica, sans-serif; fill: #252A34; }
    .serif { font-family: Georgia, "Times New Roman", serif; fill: #252A34; }
    .title { font-size: 24px; font-weight: 700; }
    .subtitle { font-size: 13px; fill: #5E625F; }
    .panel-title { font-size: 13px; font-weight: 700; letter-spacing: 0.4px; }
    .label { font-size: 13px; font-weight: 700; }
    .body { font-size: 13px; }
    .small { font-size: 11.5px; fill: #5E625F; }
    .matrix { font-size: 15px; }
    .equation { font-size: 16px; }
    .result { font-size: 18px; font-weight: 700; }
  </style>

  <rect width="960" height="720" fill="#F7F4F0"/>
  <rect x="0" y="0" width="960" height="10" fill="#16243A"/>
  <text x="28" y="43" class="sans title">Two steps: time moves right, the written product grows left</text>
  <text x="28" y="64" class="sans subtitle">The same two shear matrices give different products when their time labels are exchanged.</text>

  <!-- Red sample path -->
  <rect x="24" y="82" width="300" height="268" rx="15"
        fill="#FFFDF8" stroke="#C7BDAE" stroke-width="1.5"/>
  <text x="44" y="109" class="sans panel-title">1  RED PATH r: U FIRST, L SECOND</text>
  <text x="94" y="137" text-anchor="middle" class="sans small">time 0</text>
  <text x="244" y="137" text-anchor="middle" class="sans small">time 1</text>

  <g aria-label="Upper shear U at time zero">
    <rect x="54" y="148" width="40" height="38" fill="url(#upperShearDots)"
          stroke="#4B6787"/>
    <rect x="94" y="148" width="40" height="38" fill="url(#upperShearDots)"
          stroke="#4B6787"/>
    <rect x="54" y="186" width="40" height="38" fill="url(#upperShearDots)"
          stroke="#4B6787"/>
    <rect x="94" y="186" width="40" height="38" fill="url(#upperShearDots)"
          stroke="#4B6787"/>
    <text x="74" y="173" text-anchor="middle" class="serif matrix">1</text>
    <text x="114" y="173" text-anchor="middle" class="serif matrix">1</text>
    <text x="74" y="211" text-anchor="middle" class="serif matrix">0</text>
    <text x="114" y="211" text-anchor="middle" class="serif matrix">1</text>
    <text x="94" y="242" text-anchor="middle" class="serif label">U</text>
  </g>

  <path d="M144 186 H188" fill="none" stroke="#A67C52" stroke-width="2.5"
        marker-end="url(#timeArrow)"/>
  <text x="166" y="174" text-anchor="middle" class="sans small">then</text>

  <g aria-label="Lower shear L at time one">
    <rect x="204" y="148" width="40" height="38" fill="url(#lowerShearHatch)"
          stroke="#B65F2A"/>
    <rect x="244" y="148" width="40" height="38" fill="url(#lowerShearHatch)"
          stroke="#B65F2A"/>
    <rect x="204" y="186" width="40" height="38" fill="url(#lowerShearHatch)"
          stroke="#B65F2A"/>
    <rect x="244" y="186" width="40" height="38" fill="url(#lowerShearHatch)"
          stroke="#B65F2A"/>
    <text x="224" y="173" text-anchor="middle" class="serif matrix">1</text>
    <text x="264" y="173" text-anchor="middle" class="serif matrix">0</text>
    <text x="224" y="211" text-anchor="middle" class="serif matrix">1</text>
    <text x="264" y="211" text-anchor="middle" class="serif matrix">1</text>
    <text x="244" y="242" text-anchor="middle" class="serif label">L</text>
  </g>

  <rect x="44" y="260" width="260" height="68" rx="10"
        fill="#EAF1E5" stroke="#6F8D5E"/>
  <text x="174" y="285" text-anchor="middle" class="serif equation">Π₂(r) = L U</text>
  <text x="174" y="313" text-anchor="middle" class="serif result">[ 1  1 ; 1  2 ]</text>

  <!-- Blue reversed path -->
  <rect x="342" y="82" width="286" height="268" rx="15"
        fill="#FFFDF8" stroke="#C7BDAE" stroke-width="1.5"/>
  <text x="362" y="109" class="sans panel-title">2  BLUE PATH b: L FIRST, U SECOND</text>
  <text x="408" y="137" text-anchor="middle" class="sans small">time 0</text>
  <text x="560" y="137" text-anchor="middle" class="sans small">time 1</text>

  <g aria-label="Lower shear L at time zero on blue path">
    <rect x="368" y="148" width="40" height="38" fill="url(#lowerShearHatch)"
          stroke="#B65F2A"/>
    <rect x="408" y="148" width="40" height="38" fill="url(#lowerShearHatch)"
          stroke="#B65F2A"/>
    <rect x="368" y="186" width="40" height="38" fill="url(#lowerShearHatch)"
          stroke="#B65F2A"/>
    <rect x="408" y="186" width="40" height="38" fill="url(#lowerShearHatch)"
          stroke="#B65F2A"/>
    <text x="388" y="173" text-anchor="middle" class="serif matrix">1</text>
    <text x="428" y="173" text-anchor="middle" class="serif matrix">0</text>
    <text x="388" y="211" text-anchor="middle" class="serif matrix">1</text>
    <text x="428" y="211" text-anchor="middle" class="serif matrix">1</text>
    <text x="408" y="242" text-anchor="middle" class="serif label">L</text>
  </g>

  <path d="M458 186 H500" fill="none" stroke="#A67C52" stroke-width="2.5"
        marker-end="url(#timeArrow)"/>
  <text x="479" y="174" text-anchor="middle" class="sans small">then</text>

  <g aria-label="Upper shear U at time one on blue path">
    <rect x="520" y="148" width="40" height="38" fill="url(#upperShearDots)"
          stroke="#4B6787"/>
    <rect x="560" y="148" width="40" height="38" fill="url(#upperShearDots)"
          stroke="#4B6787"/>
    <rect x="520" y="186" width="40" height="38" fill="url(#upperShearDots)"
          stroke="#4B6787"/>
    <rect x="560" y="186" width="40" height="38" fill="url(#upperShearDots)"
          stroke="#4B6787"/>
    <text x="540" y="173" text-anchor="middle" class="serif matrix">1</text>
    <text x="580" y="173" text-anchor="middle" class="serif matrix">1</text>
    <text x="540" y="211" text-anchor="middle" class="serif matrix">0</text>
    <text x="580" y="211" text-anchor="middle" class="serif matrix">1</text>
    <text x="560" y="242" text-anchor="middle" class="serif label">U</text>
  </g>

  <rect x="362" y="260" width="246" height="68" rx="10"
        fill="#FAECE8" stroke="#B34E3D"/>
  <text x="485" y="285" text-anchor="middle" class="serif equation">Π₂(b) = U L</text>
  <text x="485" y="313" text-anchor="middle" class="serif result">[ 2  1 ; 1  1 ]</text>

  <!-- Vector action -->
  <rect x="646" y="82" width="290" height="268" rx="15"
        fill="#FFFDF8" stroke="#C7BDAE" stroke-width="1.5"/>
  <text x="666" y="109" class="sans panel-title">3  ONE VECTOR EXPOSES THE ORDER</text>
  <text x="666" y="140" class="serif equation">e = (1, 0)ᵀ</text>

  <rect x="666" y="157" width="250" height="68" rx="10"
        fill="#EAF1E5" stroke="#6F8D5E"/>
  <text x="680" y="180" class="sans label">RED PATH</text>
  <text x="680" y="207" class="serif equation">e  →U  (1, 0)  →L  (1, 1)</text>

  <rect x="666" y="238" width="250" height="68" rx="10"
        fill="#FAECE8" stroke="#B34E3D"/>
  <text x="680" y="261" class="sans label">BLUE PATH</text>
  <text x="680" y="288" class="serif equation">e  →L  (1, 1)  →U  (2, 1)</text>

  <text x="791" y="329" text-anchor="middle" class="serif result">(1, 1) ≠ (2, 1)</text>

  <!-- Horizon ladder -->
  <rect x="24" y="372" width="286" height="292" rx="15"
        fill="#FFFDF8" stroke="#C7BDAE" stroke-width="1.5"/>
  <text x="44" y="402" class="sans panel-title">4  HORIZON COUNTS FACTORS</text>

  <rect x="44" y="420" width="246" height="50" rx="9"
        fill="#F4F7FA" stroke="#9AAFC3"/>
  <text x="60" y="442" class="sans label">k = 0</text>
  <text x="126" y="452" class="serif equation">Π₀(ω) = I₂</text>
  <text x="60" y="463" class="sans small">no factor has acted</text>

  <path d="M167 472 V488" stroke="#A67C52" stroke-width="2"
        marker-end="url(#timeArrow)"/>
  <rect x="44" y="492" width="246" height="50" rx="9"
        fill="#E8F0F7" stroke="#4B6787"/>
  <text x="60" y="514" class="sans label">k = 1</text>
  <text x="126" y="524" class="serif equation">Π₁(ω) = A₀(ω)</text>
  <text x="60" y="535" class="sans small">index 0 only</text>

  <path d="M167 544 V560" stroke="#A67C52" stroke-width="2"
        marker-end="url(#timeArrow)"/>
  <rect x="44" y="564" width="246" height="62" rx="9"
        fill="#F7E8DB" stroke="#B65F2A"/>
  <text x="60" y="588" class="sans label">k = 2</text>
  <text x="126" y="598" class="serif equation">Π₂(ω) = A₁(ω) A₀(ω)</text>
  <text x="60" y="617" class="sans small">indices 0 and 1, newest on the left</text>

  <text x="167" y="648" text-anchor="middle" class="sans small">The empty product is the identity.</text>

  <!-- Realization and law -->
  <rect x="328" y="372" width="300" height="292" rx="15"
        fill="#FFFDF8" stroke="#C7BDAE" stroke-width="1.5"/>
  <text x="348" y="402" class="sans panel-title">5  REALIZATIONS BECOME A LAW</text>

  <rect x="348" y="420" width="260" height="57" rx="9"
        fill="#EAF1E5" stroke="#6F8D5E"/>
  <text x="364" y="443" class="sans label">outcome r, weight 1/4</text>
  <text x="364" y="466" class="serif equation">Π₂(r) = [ 1  1 ; 1  2 ]</text>

  <rect x="348" y="488" width="260" height="57" rx="9"
        fill="#FAECE8" stroke="#B34E3D"/>
  <text x="364" y="511" class="sans label">outcome b, weight 3/4</text>
  <text x="364" y="534" class="serif equation">Π₂(b) = [ 2  1 ; 1  1 ]</text>

  <path d="M478 548 V566" stroke="#A67C52" stroke-width="2"
        marker-end="url(#timeArrow)"/>
  <rect x="348" y="570" width="260" height="71" rx="10"
        fill="#16243A"/>
  <text x="478" y="595" text-anchor="middle" class="sans label"
        style="fill:#FFFDF8">PUSHFORWARD LAW</text>
  <text x="478" y="618" text-anchor="middle" class="serif equation"
        style="fill:#FFFDF8">1/4 at L U  +  3/4 at U L</text>
  <text x="478" y="636" text-anchor="middle" class="sans small"
        style="fill:#D9E1EA">a measure on matrix values</text>

  <!-- Proof gates -->
  <rect x="646" y="372" width="290" height="292" rx="15"
        fill="#FFFDF8" stroke="#C7BDAE" stroke-width="1.5"/>
  <text x="666" y="402" class="sans panel-title">6  KEEP THE PROOF GATES SEPARATE</text>

  <rect x="666" y="420" width="250" height="48" rx="9"
        fill="#E8F0F7" stroke="#4B6787"/>
  <text x="791" y="441" text-anchor="middle" class="sans label">MEASURABLE PREFIX</text>
  <text x="791" y="459" text-anchor="middle" class="sans small">at k=2, certify A₀ and A₁</text>

  <path d="M791 470 V486" stroke="#A67C52" stroke-width="2"
        marker-end="url(#timeArrow)"/>
  <rect x="666" y="490" width="250" height="48" rx="9"
        fill="#F3E8E0" stroke="#A67C52"/>
  <text x="791" y="511" text-anchor="middle" class="sans label">PRODUCT MAP IS MEASURABLE</text>
  <text x="791" y="529" text-anchor="middle" class="sans small">ordinary matrix-valued random object</text>

  <path d="M791 540 V556" stroke="#A67C52" stroke-width="2"
        marker-end="url(#timeArrow)"/>
  <rect x="666" y="560" width="250" height="48" rx="9"
        fill="#EAF1E5" stroke="#6F8D5E"/>
  <text x="791" y="581" text-anchor="middle" class="sans label">PUSHFORWARD LAW IS DEFINED</text>
  <text x="791" y="599" text-anchor="middle" class="sans small">source weights move to matrix values</text>

  <rect x="666" y="620" width="250" height="28" rx="8"
        fill="#FFF4E7" stroke="#C27A32" stroke-width="1.5"
        stroke-dasharray="6 4"/>
  <text x="791" y="639" text-anchor="middle" class="sans label"
        fill="#8A4F18">INTEGRABILITY IS NOT IMPLIED</text>

  <text x="28" y="701" class="sans small">Patterns, time labels, matrix values, and arrows encode the distinctions; color is supplementary.</text>
</svg>
