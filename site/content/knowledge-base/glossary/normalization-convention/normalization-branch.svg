<svg xmlns="http://www.w3.org/2000/svg" width="760" height="390"
     viewBox="0 0 760 390" role="img"
     aria-labelledby="normalizationTitle normalizationDesc">
  <title id="normalizationTitle">Two valid scalings of the same Gaussian coordinates</title>
  <desc id="normalizationDesc">Two independent centered real Gaussian variables of variance one branch into a divided-by-square-root-of-two complex variable with component variance one half and total second moment one, or an unscaled complex variable with component variance one and total second moment two.</desc>
  <rect width="760" height="390" fill="#F7F4F0"/>
  <style>
    .t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#2C2924}
    .title{font-size:15px;font-weight:700}.h{font-size:13px;font-weight:700}
    .s{font-size:12px}.m{font-size:11px;fill:#5A544C}
    .source{fill:#E8F0F7;stroke:#4B6787;stroke-width:1.5}
    .branchA{fill:#EAF1E5;stroke:#6F8D5E;stroke-width:1.5}
    .branchB{fill:#F3E8E0;stroke:#A67C52;stroke-width:1.5}
    .neutral{fill:#FBF9F6;stroke:#C4B8A8;stroke-width:1.5}
  </style>
  <defs>
    <marker id="normalizationArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#A67C52"/>
    </marker>
  </defs>
  <text x="24" y="28" class="t title">The label is incomplete until the scale is declared</text>
  <text x="24" y="48" class="t m">Exact symbolic example; no sampled or fitted values.</text>

  <rect x="40" y="98" width="216" height="132" rx="12" class="source"/>
  <text x="148" y="128" text-anchor="middle" class="t h">Primitive coordinates</text>
  <text x="148" y="157" text-anchor="middle" class="t s">two independent real laws</text>
  <text x="148" y="180" text-anchor="middle" class="t s">mean zero</text>
  <text x="148" y="203" text-anchor="middle" class="t s">variance one each</text>

  <line x1="256" y1="144" x2="320" y2="112" stroke="#A67C52" stroke-width="2" marker-end="url(#normalizationArrow)"/>
  <line x1="256" y1="188" x2="320" y2="264" stroke="#A67C52" stroke-width="2" marker-end="url(#normalizationArrow)"/>

  <rect x="330" y="78" width="390" height="132" rx="12" class="branchA"/>
  <text x="354" y="108" class="t h">Convention A: divide the complex sum by square root of two</text>
  <text x="354" y="139" class="t s">real-part variance: one half</text>
  <text x="354" y="162" class="t s">imaginary-part variance: one half</text>
  <text x="354" y="185" class="t h">expected squared magnitude: one</text>

  <rect x="330" y="238" width="390" height="112" rx="12" class="branchB"/>
  <text x="354" y="268" class="t h">Convention B: leave the complex sum unscaled</text>
  <text x="354" y="299" class="t s">component variances: one and one</text>
  <text x="354" y="326" class="t h">expected squared magnitude: two</text>

  <rect x="24" y="362" width="712" height="20" rx="10" class="neutral"/>
  <text x="380" y="377" text-anchor="middle" class="t m">Both are valid; a normalization ledger says which one a later definition uses.</text>
</svg>
