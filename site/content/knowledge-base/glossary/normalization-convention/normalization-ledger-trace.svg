<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="920" viewBox="0 0 1200 920" role="img" aria-labelledby="normalization-title normalization-desc">
  <title id="normalization-title">A normalization ledger separates four trace-square conventions</title>
  <desc id="normalization-desc">The two by two matrix A with rows two one and one two has trace of A squared equal to ten. A master formula multiplies this raw trace by the square of a matrix scale s and divides by a trace divisor d. Four ledger rows give raw unscaled value ten, dimension-normalized unscaled value five, raw value five after scaling the matrix by one over square root two, and dimension-normalized scaled value five halves. The two middle values both equal five but describe different objects. A lower project comparison shows expected raw GUE trace square n and expected empirical spectral second moment one in positive dimension, connected by the reciprocal-dimension factor.</desc>
  <defs>
    <pattern id="norm-raw" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="12" height="12" fill="#f5daa1"/>
      <rect width="4" height="12" fill="#9d662f"/>
    </pattern>
    <pattern id="norm-divide" width="14" height="14" patternUnits="userSpaceOnUse">
      <rect width="14" height="14" fill="#dcebe3"/>
      <circle cx="4" cy="4" r="2.4" fill="#39715f"/>
      <circle cx="11" cy="11" r="2.4" fill="#39715f"/>
    </pattern>
    <pattern id="norm-scale" width="14" height="14" patternUnits="userSpaceOnUse">
      <rect width="14" height="14" fill="#e1e8f2"/>
      <path d="M 0 7 H 14 M 7 0 V 14" stroke="#46678b" stroke-width="2"/>
    </pattern>
    <filter id="norm-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#332921" flood-opacity="0.13"/>
    </filter>
    <marker id="norm-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#705846"/>
    </marker>
    <style>
      .ink { fill: #29231e; }
      .muted { fill: #675c52; }
      .title { font: 700 31px Georgia, serif; }
      .heading { font: 700 21px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .body { font: 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .small { font: 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .equation { font: 700 21px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .cell { font: 700 24px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; }
      .center { text-anchor: middle; }
    </style>
  </defs>

  <rect width="1200" height="920" rx="24" fill="#f7f0e3"/>
  <text x="48" y="52" class="title ink">A normalization ledger keeps the factors attached</text>
  <text x="48" y="82" class="body muted">The same matrix can produce 10, 5, or 5/2 without contradiction.</text>

  <rect x="40" y="108" width="1120" height="190" rx="22" fill="#fffaf1" stroke="#997859" stroke-width="2" filter="url(#norm-shadow)"/>
  <text x="68" y="148" class="heading ink">Anchor calculation: n = 2, k = 2, tr(A²) = 10</text>
  <text x="76" y="228" class="equation ink">A =</text>
  <g aria-label="Matrix A with rows two one and one two">
    <rect x="132" y="172" width="64" height="48" rx="7" fill="url(#norm-raw)" stroke="#87582b" stroke-width="2"/>
    <rect x="196" y="172" width="64" height="48" rx="7" fill="#f1eee8" stroke="#796e64" stroke-width="2"/>
    <rect x="132" y="220" width="64" height="48" rx="7" fill="#f1eee8" stroke="#796e64" stroke-width="2"/>
    <rect x="196" y="220" width="64" height="48" rx="7" fill="url(#norm-raw)" stroke="#87582b" stroke-width="2"/>
    <text x="164" y="204" class="cell ink">2</text>
    <text x="228" y="204" class="cell ink">1</text>
    <text x="164" y="252" class="cell ink">1</text>
    <text x="228" y="252" class="cell ink">2</text>
  </g>
  <path d="M 290 220 H 372" stroke="#705846" stroke-width="3" marker-end="url(#norm-arrow)"/>
  <text x="400" y="205" class="body ink">A² has rows (5, 4) and (4, 5)</text>
  <text x="400" y="244" class="equation ink">raw trace square R = 5 + 5 = 10</text>
  <rect x="768" y="164" width="350" height="106" rx="16" fill="#f2f7f3" stroke="#39715f" stroke-width="2"/>
  <text x="792" y="197" class="heading ink">Master ledger formula</text>
  <text x="792" y="236" class="equation ink">Q(s,d) = d⁻¹ s² R</text>
  <text x="792" y="260" class="small muted">s scales the matrix; d divides the trace.</text>

  <rect x="40" y="324" width="1120" height="390" rx="22" fill="#fffaf1" stroke="#997859" stroke-width="2" filter="url(#norm-shadow)"/>
  <text x="68" y="364" class="heading ink">Four conventions from one raw quantity</text>

  <rect x="68" y="390" width="500" height="112" rx="16" fill="#fff3dc" stroke="#95602d" stroke-width="2"/>
  <rect x="68" y="390" width="12" height="112" rx="6" fill="url(#norm-raw)"/>
  <text x="98" y="423" class="heading ink">1. Raw trace of unscaled A</text>
  <text x="98" y="456" class="body ink">s² = 1, d = 1</text>
  <text x="405" y="465" class="equation ink">Q = 10</text>
  <text x="98" y="487" class="small muted">ordinary spectral counting moment</text>

  <rect x="592" y="390" width="500" height="112" rx="16" fill="#eff7f2" stroke="#39715f" stroke-width="3"/>
  <rect x="592" y="390" width="12" height="112" rx="6" fill="url(#norm-divide)"/>
  <text x="622" y="423" class="heading ink">2. Normalized trace of unscaled A</text>
  <text x="622" y="456" class="body ink">s² = 1, d = n = 2</text>
  <text x="929" y="465" class="equation ink">Q = 5</text>
  <text x="622" y="487" class="small muted">empirical spectral second moment</text>

  <rect x="68" y="526" width="500" height="112" rx="16" fill="#eef3f9" stroke="#46678b" stroke-width="3"/>
  <rect x="68" y="526" width="12" height="112" rx="6" fill="url(#norm-scale)"/>
  <text x="98" y="559" class="heading ink">3. Raw trace after B = A / √2</text>
  <text x="98" y="592" class="body ink">s² = 1/2, d = 1</text>
  <text x="405" y="601" class="equation ink">Q = 5</text>
  <text x="98" y="623" class="small muted">matrix scaling, without normalized trace</text>

  <rect x="592" y="526" width="500" height="112" rx="16" fill="#fff2ef" stroke="#ad4036" stroke-width="2"/>
  <rect x="592" y="526" width="12" height="112" rx="6" fill="url(#norm-scale)"/>
  <text x="622" y="559" class="heading ink">4. Normalized trace of scaled B</text>
  <text x="622" y="592" class="body ink">s² = 1/2, d = n = 2</text>
  <text x="929" y="601" class="equation ink">Q = 5/2</text>
  <text x="622" y="623" class="small muted">both normalization choices are active</text>

  <rect x="413" y="647" width="374" height="45" rx="13" fill="#fff2ef" stroke="#ad4036" stroke-width="2"/>
  <text x="600" y="675" class="body ink center">Rows 2 and 3 both equal 5, but name different objects.</text>
  <text x="68" y="701" class="small muted">The ledger prevents an accidental equality at k = 2 from becoming a false claim that the conventions are identical.</text>

  <rect x="40" y="740" width="1120" height="140" rx="20" fill="#fffaf1" stroke="#997859" stroke-width="2"/>
  <text x="68" y="779" class="heading ink">Project near-miss: raw finite GUE versus empirical spectral probability</text>
  <rect x="68" y="800" width="400" height="54" rx="13" fill="#fff3dc" stroke="#95602d" stroke-width="2"/>
  <text x="268" y="834" class="equation ink center">E[tr(H_n^2)] = n</text>
  <path d="M 490 827 H 688" stroke="#705846" stroke-width="3" marker-end="url(#norm-arrow)"/>
  <text x="588" y="814" class="small ink center">multiply by n⁻¹</text>
  <rect x="712" y="800" width="408" height="54" rx="13" fill="#eff7f2" stroke="#39715f" stroke-width="2"/>
  <text x="916" y="834" class="equation ink center">E[∫ x^2 dL_H(x)] = 1</text>
  <text x="68" y="872" class="small muted">For positive dimension, these are the same theorem after the trace-normalization factor is recorded.</text>

  <rect x="40" y="896" width="1120" height="8" rx="4" fill="#e8dcc9"/>
</svg>
