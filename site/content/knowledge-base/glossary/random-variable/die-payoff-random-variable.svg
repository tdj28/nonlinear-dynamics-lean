<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640"
     viewBox="0 0 960 640" role="img"
     aria-labelledby="randomVariableTitle randomVariableDesc">
  <title id="randomVariableTitle">A fair-die payoff random variable and its induced two-point law</title>
  <desc id="randomVariableDesc">The odd die outcomes one, three, and five each have probability one sixth and map to payoff minus one. The even outcomes two, four, and six each have probability one sixth and map to payoff two. Each payoff therefore has law mass one half. A highlighted positive target event contains two, pulls back to the even faces, and has probability one half. A footer distinguishes outcome four, function X, realization X of four equals two, and the two-point law.</desc>
  <defs>
    <linearGradient id="randomPaper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFDF8"/>
      <stop offset="1" stop-color="#EEE5D6"/>
    </linearGradient>
    <pattern id="oddPayoff" width="9" height="9" patternUnits="userSpaceOnUse"
             patternTransform="rotate(45)">
      <rect width="9" height="9" fill="#E8F0F7"/>
      <line x1="0" y1="0" x2="0" y2="9" stroke="#4B6787" stroke-width="3"/>
    </pattern>
    <pattern id="evenPayoff" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F3E8E0"/>
      <circle cx="5" cy="5" r="2" fill="#9B3F2B"/>
    </pattern>
    <marker id="randomArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7F786D"/>
    </marker>
  </defs>
  <rect width="960" height="640" fill="url(#randomPaper)"/>
  <style>
    .t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#2C2924}
    .title{font-family:Georgia,serif;font-size:25px;font-weight:700;fill:#16243A}
    .sub{font-size:14px;fill:#536070}
    .cap{font-size:13px;font-weight:700;letter-spacing:1.4px;fill:#1F5A68}
    .h{font-size:16px;font-weight:700}
    .s{font-size:13px}
    .m{font-size:12px;fill:#536070}
    .face{stroke:#766B5D;stroke-width:1.6}
    .n{font-size:18px;font-weight:700;fill:#16243A}
    .value{font-size:28px;font-weight:700;fill:#16243A}
    .arrow{fill:none;stroke:#7F786D;stroke-width:2.3;marker-end:url(#randomArrow)}
  </style>

  <text x="34" y="40" class="title">A fixed payoff map turns outcomes into real values</text>
  <text x="34" y="65" class="t sub">Fair die: each source face has probability 1/6; the map is fixed before any face is realized.</text>

  <text x="42" y="106" class="t cap">OUTCOMES</text>
  <text x="374" y="106" class="t cap">RANDOM VARIABLE X</text>
  <text x="690" y="106" class="t cap">REAL VALUES AND LAW</text>

  <g aria-label="Odd outcomes one three and five, each with mass one sixth">
    <rect x="34" y="126" width="280" height="128" rx="14" fill="#FFFDF8" stroke="#4B6787" stroke-width="1.8"/>
    <text x="56" y="156" class="t h">odd fiber</text>
    <text x="56" y="178" class="t m">three outcomes, each mass 1/6</text>
    <g transform="translate(56 194)">
      <rect x="0" y="0" width="54" height="42" rx="8" fill="url(#oddPayoff)" class="face"/><text x="27" y="28" text-anchor="middle" class="t n">1</text>
      <rect x="72" y="0" width="54" height="42" rx="8" fill="url(#oddPayoff)" class="face"/><text x="99" y="28" text-anchor="middle" class="t n">3</text>
      <rect x="144" y="0" width="54" height="42" rx="8" fill="url(#oddPayoff)" class="face"/><text x="171" y="28" text-anchor="middle" class="t n">5</text>
    </g>
  </g>

  <g aria-label="Even outcomes two four and six, each with mass one sixth">
    <rect x="34" y="282" width="280" height="128" rx="14" fill="#FFFDF8" stroke="#9B3F2B" stroke-width="1.8"/>
    <text x="56" y="312" class="t h">even fiber</text>
    <text x="56" y="334" class="t m">three outcomes, each mass 1/6</text>
    <g transform="translate(56 350)">
      <rect x="0" y="0" width="54" height="42" rx="8" fill="url(#evenPayoff)" class="face"/><text x="27" y="28" text-anchor="middle" class="t n">2</text>
      <rect x="72" y="0" width="54" height="42" rx="8" fill="url(#evenPayoff)" class="face"/><text x="99" y="28" text-anchor="middle" class="t n">4</text>
      <rect x="144" y="0" width="54" height="42" rx="8" fill="url(#evenPayoff)" class="face"/><text x="171" y="28" text-anchor="middle" class="t n">6</text>
    </g>
  </g>

  <path d="M314 190 C410 190 470 190 574 190" class="arrow"/>
  <text x="370" y="172" class="t s">X(odd) = -1</text>
  <path d="M314 346 C410 346 470 346 574 346" class="arrow"/>
  <text x="370" y="328" class="t s">X(even) = 2</text>

  <g aria-label="Payoff minus one receives probability one half">
    <rect x="590" y="126" width="336" height="128" rx="14" fill="#FFFDF8" stroke="#4B6787" stroke-width="1.8"/>
    <rect x="614" y="150" width="72" height="72" rx="16" fill="url(#oddPayoff)" class="face"/>
    <text x="650" y="196" text-anchor="middle" class="t value">-1</text>
    <text x="712" y="166" class="t h">law mass 3/6 = 1/2</text>
    <text x="712" y="191" class="t s">preimage {-1} = {1, 3, 5}</text>
    <text x="712" y="216" class="t m">not in the positive-value event</text>
  </g>

  <g aria-label="Payoff two receives probability one half and lies in the positive target event">
    <rect x="590" y="282" width="336" height="128" rx="14" fill="#FFFDF8" stroke="#9B3F2B" stroke-width="2.2"/>
    <rect x="614" y="306" width="72" height="72" rx="16" fill="url(#evenPayoff)" class="face"/>
    <text x="650" y="352" text-anchor="middle" class="t value">2</text>
    <text x="712" y="322" class="t h">law mass 3/6 = 1/2</text>
    <text x="712" y="347" class="t s">preimage {2} = {2, 4, 6}</text>
    <text x="712" y="372" class="t m">inside the positive-value event</text>
  </g>

  <rect x="34" y="438" width="892" height="74" rx="13" fill="#EAF1E5" stroke="#6F8D5E" stroke-width="1.8"/>
  <text x="58" y="468" class="t h">Target event: positive values (0, infinity)</text>
  <text x="58" y="494" class="t s">It contains payoff 2, so its preimage is {2, 4, 6} and its probability is 3/6 = 1/2.</text>

  <rect x="34" y="536" width="892" height="72" rx="13" fill="#FFFDF8" stroke="#C4B8A8" stroke-width="1.8"/>
  <text x="56" y="565" class="t h">Keep the four layers separate</text>
  <text x="56" y="589" class="t s">outcome: 4</text>
  <text x="205" y="589" class="t s">variable: the whole map X</text>
  <text x="444" y="589" class="t s">realization: X(4) = 2</text>
  <text x="675" y="589" class="t s">law: half at -1, half at 2</text>
</svg>
