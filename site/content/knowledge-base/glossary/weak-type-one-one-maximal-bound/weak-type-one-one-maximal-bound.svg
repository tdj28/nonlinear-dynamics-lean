<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="weakTypeBoundTitle weakTypeBoundDesc">
  <title id="weakTypeBoundTitle">Weak type one-one maximal bound</title>
  <desc id="weakTypeBoundDesc">A total integrable error budget passes through a positive threshold gate and becomes a budget for the measure of the large-maximal-error event. Labels emphasize that this is an event-measure bound, not a maximal-function norm bound.</desc>
  <defs>
    <marker id="weakTypeArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#A67C52"/>
    </marker>
  </defs>
  <style>
    .t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#2C2924}
    .title{font-size:16px;font-weight:700}
    .h{font-size:12px;font-weight:700}
    .s{font-size:11px}
    .m{font-size:10px;fill:#5A544C}
    .neutral{fill:#FBF9F6;stroke:#C4B8A8;stroke-width:1.5}
    .blue{fill:#E8F0F7;stroke:#4B6787;stroke-width:1.5}
    .green{fill:#EAF1E5;stroke:#6F8D5E;stroke-width:1.5}
    .clay{fill:#F3E8E0;stroke:#A67C52;stroke-width:1.5}
    .arrow{fill:none;stroke:#A67C52;stroke-width:2.2;marker-end:url(#weakTypeArrow)}
  </style>
  <rect width="720" height="360" fill="#F7F4F0"/>
  <text x="24" y="29" class="t title">Weak type one-one maximal bound</text>
  <text x="24" y="49" class="t m">The estimate controls how much space can support a large maximal error.</text>

  <rect x="24" y="102" width="174" height="134" rx="16" class="blue"/>
  <text x="111" y="131" text-anchor="middle" class="t h">TOTAL ERROR BUDGET</text>
  <rect x="57" y="157" width="108" height="18" rx="9" fill="#FBF9F6" stroke="#4B6787"/>
  <rect x="57" y="188" width="72" height="18" rx="9" fill="#FBF9F6" stroke="#4B6787"/>
  <text x="111" y="222" text-anchor="middle" class="t m">integrable size</text>

  <path d="M202 169 H237" class="arrow"/>
  <rect x="244" y="82" width="184" height="174" rx="16" class="clay"/>
  <text x="336" y="112" text-anchor="middle" class="t h">POSITIVE THRESHOLD</text>
  <path d="M280 164 H392" stroke="#A67C52" stroke-width="2.4"/>
  <path d="M300 143 V185 M372 143 V185" stroke="#A67C52" stroke-width="2.4"/>
  <path d="M300 164 H372" stroke="#FBF9F6" stroke-width="8"/>
  <text x="336" y="211" text-anchor="middle" class="t s">defines the large-error event</text>
  <text x="336" y="229" text-anchor="middle" class="t m">smaller error or larger gate</text>
  <text x="336" y="244" text-anchor="middle" class="t m">shrinks the budget</text>

  <path d="M432 169 H467" class="arrow"/>
  <rect x="474" y="102" width="222" height="134" rx="16" class="green"/>
  <text x="585" y="131" text-anchor="middle" class="t h">EXCEPTIONAL-SET MEASURE</text>
  <circle cx="548" cy="174" r="31" fill="#FBF9F6" stroke="#6F8D5E" stroke-width="2"/>
  <circle cx="548" cy="174" r="13" fill="#EAF1E5" stroke="#6F8D5E" stroke-width="2"/>
  <text x="606" y="170" class="t s">event size</text>
  <text x="606" y="188" class="t m">is bounded</text>
  <text x="585" y="222" text-anchor="middle" class="t m">measure control</text>

  <rect x="68" y="286" width="584" height="48" rx="12" class="neutral"/>
  <text x="360" y="307" text-anchor="middle" class="t h">WHAT THE TYPE LABEL MEANS</text>
  <text x="360" y="324" text-anchor="middle" class="t s">An event-measure bound, not a maximal-function norm bound.</text>
</svg>
