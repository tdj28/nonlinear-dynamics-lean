<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700"
 role="img" aria-labelledby="weakTypeTitle weakTypeDesc">
 <title id="weakTypeTitle">Exact weak type one-one bound on four fixed points</title>
 <desc id="weakTypeDesc">Four equally likely fixed points have observable values four, minus two, one, and zero, so the L1 size is seven quarters. At strict threshold two, only value four enters the absolute maximal event. Its measure one quarter is bounded by seven eighths. A scaling table gives event measures and bounds at thresholds one, two, and four. Threshold zero is marked invalid because the event has measure three quarters while totalized division would give zero.</desc>
 <defs><style>
 .i{font-family:Inter,Arial,sans-serif;fill:#25231F}.m{font-family:Inter,Arial,sans-serif;fill:#57514A}
 .t{font-size:23px;font-weight:750}.h{font-size:16px;font-weight:750}.b{font-size:13px}.s{font-size:11px}.k{font-size:11px;font-weight:750;letter-spacing:1px}
 </style><pattern id="selectedDots" width="8" height="8" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#55715B"/></pattern>
 <pattern id="negativeStripes" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><rect width="2.5" height="8" fill="#A4664B"/></pattern></defs>
 <rect width="1000" height="700" fill="#F7F1E8"/>
 <text x="32" y="38" class="i t">A large orbit average can occur, but only on a controlled set</text>
 <text x="32" y="62" class="m b">Four uniform fixed points: every positive-time average equals its starting value.</text>
 <text x="32" y="94" class="m k">STRICT ABSOLUTE THRESHOLD 2</text>
 <g>
  <rect x="32" y="110" width="218" height="150" rx="14" fill="#EEF3EC" stroke="#55715B" stroke-width="2"/><rect x="32" y="110" width="218" height="16" rx="8" fill="url(#selectedDots)"/>
  <text x="141" y="154" text-anchor="middle" class="i h">point p</text><text x="141" y="190" text-anchor="middle" class="i t">|average| = 4</text><text x="141" y="230" text-anchor="middle" class="i b">4 &gt; 2, selected</text>
  <rect x="266" y="110" width="218" height="150" rx="14" fill="#F5E9E2" stroke="#A4664B" stroke-width="2"/><rect x="266" y="110" width="218" height="16" rx="8" fill="url(#negativeStripes)"/>
  <text x="375" y="154" text-anchor="middle" class="i h">point q, value -2</text><text x="375" y="190" text-anchor="middle" class="i t">|average| = 2</text><text x="375" y="230" text-anchor="middle" class="i b">equality, excluded</text>
  <rect x="500" y="110" width="218" height="150" rx="14" fill="#FBFAF7" stroke="#8A7C6D" stroke-width="1.7"/>
  <text x="609" y="154" text-anchor="middle" class="i h">point r</text><text x="609" y="190" text-anchor="middle" class="i t">|average| = 1</text><text x="609" y="230" text-anchor="middle" class="i b">below, excluded</text>
  <rect x="734" y="110" width="234" height="150" rx="14" fill="#FBFAF7" stroke="#8A7C6D" stroke-width="1.7"/>
  <text x="851" y="154" text-anchor="middle" class="i h">point s</text><text x="851" y="190" text-anchor="middle" class="i t">|average| = 0</text><text x="851" y="230" text-anchor="middle" class="i b">below, excluded</text>
 </g>
 <rect x="32" y="290" width="936" height="130" rx="16" fill="#E9EFF3" stroke="#3F5D73" stroke-width="2"/>
 <text x="54" y="321" class="m k">BOTH SIDES OF THE WEAK BOUND</text>
 <text x="54" y="362" class="i h">event measure = 1 / 4</text><text x="330" y="362" class="i h">L1 size = (4 + 2 + 1 + 0) / 4 = 7 / 4</text>
 <rect x="690" y="315" width="250" height="78" rx="11" fill="#FBFAF7" stroke="#3F5D73"/>
 <text x="815" y="346" text-anchor="middle" class="m b">divide by threshold 2</text><text x="815" y="377" text-anchor="middle" class="i t">1 / 4 ≤ 7 / 8</text>
 <rect x="32" y="450" width="580" height="174" rx="16" fill="#FBFAF7" stroke="#8A7C6D" stroke-width="1.7"/>
 <text x="54" y="481" class="m k">THRESHOLD SCALING</text>
 <text x="54" y="518" class="i b">threshold</text><text x="202" y="518" class="i h">1</text><text x="328" y="518" class="i h">2</text><text x="454" y="518" class="i h">4</text>
 <text x="54" y="558" class="i b">event measure</text><text x="202" y="558" class="i h">1/2</text><text x="328" y="558" class="i h">1/4</text><text x="454" y="558" class="i h">0</text>
 <text x="54" y="598" class="i b">theorem bound</text><text x="202" y="598" class="i h">7/4</text><text x="328" y="598" class="i h">7/8</text><text x="454" y="598" class="i h">7/16</text>
 <rect x="640" y="450" width="328" height="174" rx="16" fill="#F5E9E2" stroke="#A4664B" stroke-width="2"/>
 <text x="662" y="481" class="i h">NEAR-MISS: THRESHOLD ZERO</text><text x="662" y="519" class="i b">event = {p, q, r}</text><text x="662" y="548" class="i b">event measure = 3/4</text><text x="662" y="577" class="i b">totalized quotient = 0</text><text x="662" y="606" class="m b">So 3/4 ≤ 0 is false. Require a &gt; 0.</text>
 <text x="32" y="672" class="m b">The negative value at q is detected by absolute value. This is event-measure control, not a pointwise or strong-norm bound.</text>
</svg>
