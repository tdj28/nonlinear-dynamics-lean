  <text x="82" y="198" font-family="system-ui,sans-serif" font-size="62" font-weight="760" fill="#16324f">Lyapunov function</text>
  <text x="82" y="262" font-family="system-ui,sans-serif" font-size="27" fill="#405565">A scalar certificate, not a conclusion by itself</text>
