<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760"
     viewBox="0 0 1000 760" role="img"
     aria-labelledby="visitCountTitle visitCountDesc">
  <title id="visitCountTitle">Visit counts on a uniform seven-state cycle</title>
  <desc id="visitCountDesc">Seven states form a forward cycle, and states zero, two, and five are marked as the target set. Starting at zero with horizon seven gives indicator values one zero one zero zero one zero and count three. At horizon four, starts zero through six give counts two, one, two, one, two, two, two. Their sum is twelve, so the uniform average is twelve sevenths, equal to the horizon four times the target mass three sevenths.</desc>
  <defs>
    <pattern id="targetPattern" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#E8F1E6"/>
      <path d="M0 10L10 0" stroke="#86A783" stroke-width="2"/>
    </pattern>
    <pattern id="missPattern" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F8F5EF"/>
      <circle cx="3" cy="3" r="1" fill="#B5AA9E"/>
    </pattern>
    <marker id="visitArrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0 0L10 4L0 8Z" fill="#756A5F"/>
    </marker>
    <filter id="visitShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#51483F" flood-opacity="0.15"/>
    </filter>
    <style>
      .title { font: 700 28px Georgia, serif; fill: #2E2924; }
      .subtitle { font: 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #625A51; }
      .panelTitle { font: 700 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #2E2924; }
      .node { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #2E2924; }
      .body { font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #443D36; }
      .small { font: 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #675E55; }
      .formula { font: 700 19px Georgia, serif; fill: #2E2924; }
      .result { font: 700 23px Georgia, serif; fill: #315F55; }
    </style>
  </defs>

  <rect width="1000" height="760" fill="#F8F4EC"/>
  <text x="44" y="42" class="title">Count a finite prefix before talking about frequency</text>
  <text x="44" y="67" class="subtitle">One exact seven-state system separates pointwise counting from averaging over starts.</text>

  <rect x="40" y="88" width="920" height="170" rx="18" fill="#FFFDFC"
        stroke="#B98554" stroke-width="1.8" filter="url(#visitShadow)"/>
  <text x="62" y="118" class="panelTitle">1. Uniform base cycle; target set s = {0, 2, 5}</text>
  <text x="690" y="118" class="small">hatched = target · every state has mass 1/7</text>

  <g>
    <path d="M111 172H181M246 172H316M381 172H451M516 172H586M651 172H721M786 172H856"
          stroke="#756A5F" stroke-width="2.5" marker-end="url(#visitArrow)"/>
    <path d="M891 199C891 239 76 239 76 199" fill="none" stroke="#756A5F"
          stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#visitArrow)"/>

    <g transform="translate(76 172)">
      <circle r="29" fill="url(#targetPattern)" stroke="#56805D" stroke-width="2"/>
      <text y="7" text-anchor="middle" class="node">0</text>
    </g>
    <g transform="translate(211 172)">
      <circle r="29" fill="url(#missPattern)" stroke="#9B8E81" stroke-width="1.6"/>
      <text y="7" text-anchor="middle" class="node">1</text>
    </g>
    <g transform="translate(346 172)">
      <circle r="29" fill="url(#targetPattern)" stroke="#56805D" stroke-width="2"/>
      <text y="7" text-anchor="middle" class="node">2</text>
    </g>
    <g transform="translate(481 172)">
      <circle r="29" fill="url(#missPattern)" stroke="#9B8E81" stroke-width="1.6"/>
      <text y="7" text-anchor="middle" class="node">3</text>
    </g>
    <g transform="translate(616 172)">
      <circle r="29" fill="url(#missPattern)" stroke="#9B8E81" stroke-width="1.6"/>
      <text y="7" text-anchor="middle" class="node">4</text>
    </g>
    <g transform="translate(751 172)">
      <circle r="29" fill="url(#targetPattern)" stroke="#56805D" stroke-width="2"/>
      <text y="7" text-anchor="middle" class="node">5</text>
    </g>
    <g transform="translate(886 172)">
      <circle r="29" fill="url(#missPattern)" stroke="#9B8E81" stroke-width="1.6"/>
      <text y="7" text-anchor="middle" class="node">6</text>
    </g>
  </g>

  <rect x="40" y="278" width="920" height="170" rx="18" fill="#FFFDFC"
        stroke="#557A99" stroke-width="1.8" filter="url(#visitShadow)"/>
  <text x="62" y="308" class="panelTitle">2. Start 0, horizon 7: test times 0 through 6; time 7 is excluded</text>

  <g transform="translate(66 326)">
    <g transform="translate(0 0)"><rect width="108" height="66" rx="10" fill="url(#targetPattern)" stroke="#56805D"/><text x="54" y="24" text-anchor="middle" class="body">time 0 · state 0</text><text x="54" y="52" text-anchor="middle" class="formula">1</text></g>
    <g transform="translate(126 0)"><rect width="108" height="66" rx="10" fill="url(#missPattern)" stroke="#9B8E81"/><text x="54" y="24" text-anchor="middle" class="body">time 1 · state 1</text><text x="54" y="52" text-anchor="middle" class="formula">0</text></g>
    <g transform="translate(252 0)"><rect width="108" height="66" rx="10" fill="url(#targetPattern)" stroke="#56805D"/><text x="54" y="24" text-anchor="middle" class="body">time 2 · state 2</text><text x="54" y="52" text-anchor="middle" class="formula">1</text></g>
    <g transform="translate(378 0)"><rect width="108" height="66" rx="10" fill="url(#missPattern)" stroke="#9B8E81"/><text x="54" y="24" text-anchor="middle" class="body">time 3 · state 3</text><text x="54" y="52" text-anchor="middle" class="formula">0</text></g>
    <g transform="translate(504 0)"><rect width="108" height="66" rx="10" fill="url(#missPattern)" stroke="#9B8E81"/><text x="54" y="24" text-anchor="middle" class="body">time 4 · state 4</text><text x="54" y="52" text-anchor="middle" class="formula">0</text></g>
    <g transform="translate(630 0)"><rect width="108" height="66" rx="10" fill="url(#targetPattern)" stroke="#56805D"/><text x="54" y="24" text-anchor="middle" class="body">time 5 · state 5</text><text x="54" y="52" text-anchor="middle" class="formula">1</text></g>
    <g transform="translate(756 0)"><rect width="108" height="66" rx="10" fill="url(#missPattern)" stroke="#9B8E81"/><text x="54" y="24" text-anchor="middle" class="body">time 6 · state 6</text><text x="54" y="52" text-anchor="middle" class="formula">0</text></g>
  </g>
  <text x="500" y="427" text-anchor="middle" class="result">N₇(s, 0) = 1 + 0 + 1 + 0 + 0 + 1 + 0 = 3</text>

  <rect x="40" y="468" width="565" height="235" rx="18" fill="#FFFDFC"
        stroke="#7C6191" stroke-width="1.8" filter="url(#visitShadow)"/>
  <text x="62" y="500" class="panelTitle">3. Horizon 4: count from every possible start</text>
  <text x="62" y="525" class="small">Each bar is a natural count in {0, 1, 2, 3, 4}.</text>

  <g transform="translate(75 548)">
    <line x1="0" y1="102" x2="490" y2="102" stroke="#9B8E81" stroke-width="1.3"/>
    <g transform="translate(0 0)"><rect y="22" width="48" height="80" rx="5" fill="#DCEADF" stroke="#56805D"/><text x="24" y="15" text-anchor="middle" class="formula">2</text><text x="24" y="122" text-anchor="middle" class="small">start 0</text></g>
    <g transform="translate(70 0)"><rect y="62" width="48" height="40" rx="5" fill="#E8EEF5" stroke="#557A99"/><text x="24" y="55" text-anchor="middle" class="formula">1</text><text x="24" y="122" text-anchor="middle" class="small">start 1</text></g>
    <g transform="translate(140 0)"><rect y="22" width="48" height="80" rx="5" fill="#DCEADF" stroke="#56805D"/><text x="24" y="15" text-anchor="middle" class="formula">2</text><text x="24" y="122" text-anchor="middle" class="small">start 2</text></g>
    <g transform="translate(210 0)"><rect y="62" width="48" height="40" rx="5" fill="#E8EEF5" stroke="#557A99"/><text x="24" y="55" text-anchor="middle" class="formula">1</text><text x="24" y="122" text-anchor="middle" class="small">start 3</text></g>
    <g transform="translate(280 0)"><rect y="22" width="48" height="80" rx="5" fill="#DCEADF" stroke="#56805D"/><text x="24" y="15" text-anchor="middle" class="formula">2</text><text x="24" y="122" text-anchor="middle" class="small">start 4</text></g>
    <g transform="translate(350 0)"><rect y="22" width="48" height="80" rx="5" fill="#DCEADF" stroke="#56805D"/><text x="24" y="15" text-anchor="middle" class="formula">2</text><text x="24" y="122" text-anchor="middle" class="small">start 5</text></g>
    <g transform="translate(420 0)"><rect y="22" width="48" height="80" rx="5" fill="#DCEADF" stroke="#56805D"/><text x="24" y="15" text-anchor="middle" class="formula">2</text><text x="24" y="122" text-anchor="middle" class="small">start 6</text></g>
  </g>
  <text x="62" y="687" class="formula">total = 2 + 1 + 2 + 1 + 2 + 2 + 2 = 12</text>

  <rect x="625" y="468" width="335" height="235" rx="18" fill="#EEF4F8"
        stroke="#557A99" stroke-width="1.8" filter="url(#visitShadow)"/>
  <text x="648" y="500" class="panelTitle">4. Average the seven counts</text>
  <text x="648" y="548" class="formula">uniform average = 12/7</text>
  <text x="648" y="588" class="formula">target mass μ(s) = 3/7</text>
  <path d="M648 614H930" stroke="#557A99" stroke-width="1.5"/>
  <text x="792" y="654" text-anchor="middle" class="result">12/7 = 4 · 3/7 = H μ(s)</text>
  <text x="648" y="682" class="small">Preservation, not ergodicity, makes each time contribute μ(s).</text>

  <text x="500" y="738" text-anchor="middle" class="small">Finite count ≠ normalized frequency ≠ asymptotic recurrence claim</text>
</svg>
