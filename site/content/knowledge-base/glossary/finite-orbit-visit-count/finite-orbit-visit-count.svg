<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img" aria-labelledby="visitCountTitle visitCountDesc">
  <title id="visitCountTitle">Seven zero-based orbit positions contain three visits</title>
  <desc id="visitCountDesc">A toy finite horizon contains the positions zero through six. Positions zero, two, and five are marked as visits and carry indicator value one. The other positions carry zero. Summing the indicators gives the natural count three, which is then cast to the real number three for integration. This finite count is not a frequency or recurrence claim.</desc>
  <rect width="760" height="430" fill="#F7F4F0"/>
  <style>.t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#2C2924}.title{font-size:18px;font-weight:700}.h{font-size:14px;font-weight:700}.s{font-size:12px}.m{font-size:11px;fill:#5A544C}.visit{fill:#E8F0F7;stroke:#4B6787;stroke-width:1.6}.miss{fill:#FBF9F6;stroke:#C4B8A8;stroke-width:1.4}.green{fill:#EAF1E5;stroke:#6F8D5E;stroke-width:1.5}.clay{fill:#F3E8E0;stroke:#A67C52;stroke-width:1.5}.arrow{stroke:#A67C52;stroke-width:2;fill:none}</style>
  <text x="24" y="30" class="t title">Count visits in the first seven orbit positions</text>
  <text x="24" y="51" class="t m">The zero-based horizon contains times 0 through 6; time 7 is outside the window.</text>

  <text x="36" y="91" class="t h">TIME INDEX</text>
  <rect x="36" y="108" width="82" height="88" rx="10" class="visit"/>
  <rect x="136" y="108" width="82" height="88" rx="10" class="miss"/>
  <rect x="236" y="108" width="82" height="88" rx="10" class="visit"/>
  <rect x="336" y="108" width="82" height="88" rx="10" class="miss"/>
  <rect x="436" y="108" width="82" height="88" rx="10" class="miss"/>
  <rect x="536" y="108" width="82" height="88" rx="10" class="visit"/>
  <rect x="636" y="108" width="82" height="88" rx="10" class="miss"/>

  <text x="72" y="137" class="t h">0</text><text x="172" y="137" class="t h">1</text><text x="272" y="137" class="t h">2</text><text x="372" y="137" class="t h">3</text><text x="472" y="137" class="t h">4</text><text x="572" y="137" class="t h">5</text><text x="672" y="137" class="t h">6</text>
  <text x="56" y="163" class="t s">VISIT</text><text x="160" y="163" class="t s">MISS</text><text x="256" y="163" class="t s">VISIT</text><text x="360" y="163" class="t s">MISS</text><text x="460" y="163" class="t s">MISS</text><text x="556" y="163" class="t s">VISIT</text><text x="660" y="163" class="t s">MISS</text>
  <text x="73" y="184" class="t h">1</text><text x="173" y="184" class="t h">0</text><text x="273" y="184" class="t h">1</text><text x="373" y="184" class="t h">0</text><text x="473" y="184" class="t h">0</text><text x="573" y="184" class="t h">1</text><text x="673" y="184" class="t h">0</text>

  <path d="M378 207 V229" class="arrow"/>
  <path d="M371 224 L378 232 L385 224" fill="#A67C52"/>
  <rect x="36" y="246" width="328" height="92" rx="12" class="green"/>
  <text x="58" y="276" class="t h">NATURAL COUNT</text>
  <text x="58" y="304" class="t s">1 + 0 + 1 + 0 + 0 + 1 + 0 = 3</text>
  <text x="58" y="325" class="t m">Three marked indices in one finite window</text>

  <path d="M377 292 H399" class="arrow"/>
  <path d="M394 285 L402 292 L394 299" fill="#A67C52"/>
  <rect x="414" y="246" width="304" height="92" rx="12" class="clay"/>
  <text x="436" y="276" class="t h">REAL CAST FOR INTEGRATION</text>
  <text x="436" y="304" class="t s">The same count is represented as real 3.</text>
  <text x="436" y="325" class="t m">Its finite counting meaning is unchanged.</text>

  <rect x="24" y="362" width="712" height="46" rx="12" class="green"/>
  <text x="45" y="390" class="t s">FINITE COUNT ONLY: no division by the horizon, no limiting density, and no recurrence claim.</text>
</svg>

