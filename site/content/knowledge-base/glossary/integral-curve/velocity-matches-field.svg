<svg xmlns="http://www.w3.org/2000/svg" width="800" height="580" viewBox="0 0 800 580" role="img" aria-labelledby="title desc"><title id="title">An integral curve matches the vector field</title><desc id="desc">A horizontal curve has three right-pointing tangent arrows of equal length. The equation gamma prime of t equals one equals v of gamma of t appears below.</desc><rect width="800" height="580" fill="#f7f1e5"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L10 3 L0 6 Z" fill="#874d3b"/></marker></defs><text x="45" y="65" font-family="system-ui" font-size="30" font-weight="700" fill="#183c3a">γ(t) = 3 + t</text><path d="M100 290 C275 245 495 335 700 270" fill="none" stroke="#315d4b" stroke-width="8"/><g stroke="#874d3b" stroke-width="7" marker-end="url(#a)"><line x1="190" y1="270" x2="290" y2="265"/><line x1="380" y1="285" x2="480" y2="290"/><line x1="570" y1="295" x2="670" y2="275"/></g><g fill="#315d4b"><circle cx="190" cy="270" r="8"/><circle cx="380" cy="285" r="8"/><circle cx="570" cy="295" r="8"/></g><text x="135" y="410" font-family="system-ui" font-size="34" font-weight="700" fill="#263c3b">γ′(t) = 1 = v(γ(t))</text><text x="135" y="465" font-family="system-ui" font-size="23" fill="#263c3b">path velocity = field value at the current point</text></svg>
