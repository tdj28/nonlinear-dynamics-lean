<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">Integral curve</title><desc id="desc">A curved path carries tangent arrows that match a vector field, with the equation gamma prime equals v of gamma.</desc><rect width="1200" height="630" fill="#f7f1e5"/><text x="65" y="90" font-family="system-ui" font-size="28" font-weight="700" fill="#315d4b">GLOSSARY · DIFFERENTIAL EQUATIONS</text><text x="65" y="175" font-family="system-ui" font-size="62" font-weight="750" fill="#183c3a">INTEGRAL CURVE</text><text x="65" y="225" font-family="system-ui" font-size="26" fill="#263c3b">the path whose velocity matches the field</text><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L10 3 L0 6 Z" fill="#874d3b"/></marker></defs><path d="M100 420 C315 300 555 500 805 340 S1020 300 1110 360" fill="none" stroke="#315d4b" stroke-width="9"/><g stroke="#874d3b" stroke-width="9" marker-end="url(#a)"><line x1="265" y1="355" x2="385" y2="370"/><line x1="580" y1="420" x2="700" y2="365"/><line x1="875" y1="310" x2="995" y2="325"/></g><text x="65" y="565" font-family="system-ui" font-size="36" font-weight="700" fill="#874d3b">γ′(t) = v(γ(t))</text></svg>
