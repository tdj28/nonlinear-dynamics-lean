<svg xmlns="http://www.w3.org/2000/svg" width="920" height="600"
     viewBox="0 0 920 600" role="img"
     aria-labelledby="matrixTraceTitle matrixTraceDesc">
  <title id="matrixTraceTitle">Extracting a matrix trace and checking its boundaries</title>
  <desc id="matrixTraceDesc">In the matrix with rows two seven and minus one five, only the diagonal cells two and five are selected, so the trace is seven. Swapping the two basis vectors produces the similar matrix with rows five minus one and seven two, whose trace is still seven. The off-diagonal values do not enter the first trace directly, but multiplication moves their products onto the diagonal of A squared, whose trace is fifteen.</desc>
  <rect width="920" height="600" fill="#F7F4F0"/>
  <style>
    .t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#2C2924}
    .title{font-size:17px;font-weight:700}
    .h{font-size:13px;font-weight:700;letter-spacing:.35px}
    .body{font-size:13px}
    .small{font-size:12px}
    .muted{font-size:11px;fill:#5A544C}
    .diag{fill:#F3E8E0;stroke:#95653E;stroke-width:1.8}
    .off{fill:url(#traceHatch);stroke:#777068;stroke-width:1.4}
    .panel{fill:#FBF9F6;stroke:#A89C8E;stroke-width:1.6}
    .blue{fill:#E8F0F7;stroke:#4B6787;stroke-width:1.6}
    .green{fill:#EAF1E5;stroke:#5F7F50;stroke-width:1.7}
    .arrow{fill:none;stroke:#95653E;stroke-width:2.1}
  </style>
  <defs>
    <pattern id="traceHatch" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#F3F0EB"/>
      <path d="M-2 2 L2 -2 M0 8 L8 0 M6 10 L10 6" stroke="#C5BCB2" stroke-width="1"/>
    </pattern>
    <marker id="traceArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#95653E"/>
    </marker>
  </defs>

  <text x="24" y="30" class="t title">Trace reads the diagonal, then adds</text>
  <text x="24" y="51" class="t muted">The omitted off-diagonal cells matter to other expressions, and the same linear map can have a different matrix in another basis.</text>

  <rect x="24" y="76" width="872" height="248" rx="14" class="panel"/>
  <text x="44" y="103" class="t h">THE DIRECT CALCULATION</text>
  <text x="54" y="146" class="t h">A =</text>
  <rect x="100" y="122" width="84" height="72" rx="8" class="diag"/>
  <rect x="184" y="122" width="84" height="72" rx="8" class="off"/>
  <rect x="100" y="194" width="84" height="72" rx="8" class="off"/>
  <rect x="184" y="194" width="84" height="72" rx="8" class="diag"/>
  <text x="136" y="166" class="t title">2</text>
  <text x="220" y="166" class="t title">7</text>
  <text x="132" y="238" class="t title">-1</text>
  <text x="220" y="238" class="t title">5</text>
  <text x="110" y="286" class="t small">solid diagonal: read</text>
  <text x="110" y="306" class="t muted">hatched off-diagonal: skip here</text>

  <path d="M282 194 L337 194" class="arrow" marker-end="url(#traceArrow)"/>
  <rect x="350" y="122" width="230" height="144" rx="12" class="blue"/>
  <text x="370" y="150" class="t h">EXTRACT THE DIAGONAL</text>
  <rect x="370" y="170" width="82" height="58" rx="9" class="diag"/>
  <rect x="478" y="170" width="82" height="58" rx="9" class="diag"/>
  <text x="404" y="206" class="t title">2</text>
  <text x="512" y="206" class="t title">5</text>
  <text x="370" y="250" class="t muted">One entry for each row-column index i = i</text>

  <path d="M580 194 L633 194" class="arrow" marker-end="url(#traceArrow)"/>
  <rect x="646" y="122" width="226" height="144" rx="12" class="green"/>
  <text x="666" y="150" class="t h">ADD THE SELECTED VALUES</text>
  <text x="690" y="196" class="t title">trace(A) = 2 + 5</text>
  <text x="746" y="231" class="t title">= 7</text>
  <text x="666" y="251" class="t muted">No 7 or -1 enters this sum directly.</text>

  <rect x="24" y="348" width="520" height="224" rx="14" class="blue"/>
  <text x="44" y="376" class="t h">BASIS CAVEAT: THE MATRIX CAN CHANGE</text>
  <text x="44" y="401" class="t body">Swap the two basis vectors with P. Then B = P A P^-1:</text>
  <rect x="44" y="421" width="184" height="104" rx="10" class="panel"/>
  <text x="62" y="447" class="t h">A</text>
  <text x="102" y="446" class="t body">[ 2    7 ]</text>
  <text x="102" y="471" class="t body">[ -1   5 ]</text>
  <text x="78" y="506" class="t h">trace = 7</text>
  <path d="M236 473 L282 473" class="arrow" marker-end="url(#traceArrow)"/>
  <rect x="294" y="421" width="230" height="104" rx="10" class="panel"/>
  <text x="312" y="447" class="t h">B</text>
  <text x="352" y="446" class="t body">[ 5   -1 ]</text>
  <text x="352" y="471" class="t body">[ 7    2 ]</text>
  <text x="346" y="506" class="t h">trace = 5 + 2 = 7</text>
  <text x="44" y="551" class="t muted">Similarity preserves trace, but equal traces alone do not prove that two matrices are similar.</text>

  <rect x="568" y="348" width="328" height="224" rx="14" class="green"/>
  <text x="588" y="376" class="t h">OFF-DIAGONAL VALUES STILL MATTER</text>
  <text x="588" y="402" class="t body">Multiplication mixes entries onto the diagonal:</text>
  <rect x="588" y="421" width="288" height="104" rx="10" class="panel"/>
  <text x="608" y="449" class="t h">A^2</text>
  <text x="664" y="448" class="t body">[ -3   49 ]</text>
  <text x="664" y="473" class="t body">[ -7   18 ]</text>
  <text x="625" y="505" class="t h">trace(A^2) = -3 + 18 = 15</text>
  <text x="588" y="551" class="t muted">The values 7 and -1 affect the new diagonal through products.</text>
</svg>
