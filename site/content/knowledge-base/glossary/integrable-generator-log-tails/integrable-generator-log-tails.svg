<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760"
     viewBox="0 0 1000 760" role="img"
     aria-labelledby="integrableTailsTitle integrableTailsDesc">
  <title id="integrableTailsTitle">A fair two-outcome example needs both logarithmic tail budgets</title>
  <desc id="integrableTailsDesc">Outcome u has probability one half and scalar generator two. Its forward tail is log two, inverse tail is zero, and signed log is log two. Outcome v has probability one half and scalar generator one quarter. Its forward tail is zero, inverse tail is log four, and signed log is minus log four. Both satisfy the one-step sandwich. Their weighted forward tail, inverse tail, and absolute signed log are finite. A singular diagonal matrix with entries one half and zero shows why every matrix must have a genuine inverse.</desc>
  <defs>
    <pattern id="tailDots" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#55715B"/>
    </pattern>
    <pattern id="tailStripes" width="8" height="8" patternUnits="userSpaceOnUse"
             patternTransform="rotate(35)">
      <rect width="3" height="8" fill="#945D45"/>
    </pattern>
    <marker id="tailArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7A6E61"/>
    </marker>
    <style>
      .ink{fill:#25231F;font-family:Inter,Arial,Helvetica,sans-serif}
      .muted{fill:#57514A;font-family:Inter,Arial,Helvetica,sans-serif}
      .title{font-size:22px;font-weight:750}
      .subtitle{font-size:13px}
      .kicker{font-size:11px;font-weight:750;letter-spacing:1.1px}
      .head{font-size:17px;font-weight:750}
      .body{font-size:13px}
      .small{font-size:11px}
      .number{font-size:15px;font-weight:750}
    </style>
  </defs>

  <rect width="1000" height="760" fill="#F7F1E8"/>
  <text x="32" y="37" class="ink title">One fair draw, two opposite tails</text>
  <text x="32" y="61" class="muted subtitle">Measure every logarithm in exact units of log 2: expansion is positive, contraction reappears through the inverse.</text>

  <rect x="32" y="88" width="452" height="260" rx="16"
        fill="#EEF3EC" stroke="#55715B" stroke-width="2"/>
  <rect x="32" y="88" width="452" height="48" rx="16" fill="#DDE9DA"/>
  <path d="M32 120 L32 136 L484 136 L484 120" fill="#DDE9DA"/>
  <text x="54" y="117" class="ink head">OUTCOME u: expansion</text>
  <text x="462" y="117" text-anchor="end" class="ink number">probability 1/2</text>
  <text x="54" y="158" class="muted kicker">ONE-BY-ONE GENERATOR</text>
  <text x="244" y="158" class="ink number">scalar 2</text>
  <text x="54" y="181" class="muted kicker">UNIT?</text>
  <text x="165" y="181" class="ink number">yes, inverse 1/2</text>

  <text x="54" y="215" class="ink body">Forward tail</text>
  <rect x="165" y="199" width="92" height="22" rx="5" fill="url(#tailDots)" stroke="#55715B"/>
  <text x="270" y="215" class="ink number">log 2</text>
  <text x="54" y="249" class="ink body">Inverse tail</text>
  <rect x="165" y="233" width="92" height="22" rx="5" fill="#F7F1E8" stroke="#7A6E61"/>
  <text x="270" y="249" class="ink number">0</text>
  <text x="354" y="215" class="muted small">one log-2 unit</text>
  <text x="354" y="249" class="muted small">no contraction budget</text>

  <rect x="54" y="273" width="408" height="51" rx="10" fill="#FBFAF7" stroke="#55715B"/>
  <text x="70" y="292" class="muted kicker">ONE-STEP SANDWICH</text>
  <text x="70" y="313" class="ink number">0 &lt;= signed log 2 &lt;= forward log 2</text>

  <rect x="516" y="88" width="452" height="260" rx="16"
        fill="#F4EAE3" stroke="#945D45" stroke-width="2"/>
  <rect x="516" y="88" width="452" height="48" rx="16" fill="#EEDDD1"/>
  <path d="M516 120 L516 136 L968 136 L968 120" fill="#EEDDD1"/>
  <text x="538" y="117" class="ink head">OUTCOME v: contraction</text>
  <text x="946" y="117" text-anchor="end" class="ink number">probability 1/2</text>
  <text x="538" y="158" class="muted kicker">ONE-BY-ONE GENERATOR</text>
  <text x="728" y="158" class="ink number">scalar 1/4</text>
  <text x="538" y="181" class="muted kicker">UNIT?</text>
  <text x="649" y="181" class="ink number">yes, inverse 4</text>

  <text x="538" y="215" class="ink body">Forward tail</text>
  <rect x="649" y="199" width="92" height="22" rx="5" fill="#F7F1E8" stroke="#7A6E61"/>
  <text x="754" y="215" class="ink number">0</text>
  <text x="538" y="249" class="ink body">Inverse tail</text>
  <rect x="649" y="233" width="184" height="22" rx="5" fill="url(#tailStripes)" stroke="#945D45"/>
  <text x="846" y="249" class="ink number">log 4</text>
  <text x="846" y="215" class="muted small">contraction is clipped</text>
  <text x="846" y="268" class="muted small">two log-2 units</text>

  <rect x="538" y="273" width="408" height="51" rx="10" fill="#FBFAF7" stroke="#945D45"/>
  <text x="554" y="292" class="muted kicker">ONE-STEP SANDWICH</text>
  <text x="554" y="313" class="ink number">-log 4 &lt;= signed -log 4 &lt;= 0</text>

  <path d="M258 350 L258 373 L343 373 L343 390" fill="none" stroke="#7A6E61"
        stroke-width="2" marker-end="url(#tailArrow)"/>
  <path d="M742 350 L742 373 L657 373 L657 390" fill="none" stroke="#7A6E61"
        stroke-width="2" marker-end="url(#tailArrow)"/>

  <rect x="82" y="396" width="836" height="128" rx="16" fill="#FBFAF7"
        stroke="#8A7C6D" stroke-width="1.7"/>
  <text x="104" y="422" class="muted kicker">WEIGHT BY THE TWO PROBABILITIES</text>

  <rect x="104" y="441" width="232" height="62" rx="10" fill="#EEF3EC" stroke="#55715B"/>
  <text x="220" y="463" text-anchor="middle" class="muted small">forward expectation</text>
  <text x="220" y="486" text-anchor="middle" class="ink number">1/2 log 2, finite</text>

  <rect x="384" y="441" width="232" height="62" rx="10" fill="#F4EAE3" stroke="#945D45"/>
  <text x="500" y="463" text-anchor="middle" class="muted small">inverse expectation</text>
  <text x="500" y="486" text-anchor="middle" class="ink number">1/2 log 4 = log 2, finite</text>

  <rect x="664" y="441" width="232" height="62" rx="10" fill="#E9EFF3" stroke="#3F5D73"/>
  <text x="780" y="463" text-anchor="middle" class="muted small">expected absolute signed log</text>
  <text x="780" y="486" text-anchor="middle" class="ink number">3/2 log 2, finite</text>

  <rect x="32" y="552" width="580" height="157" rx="16" fill="#F7E6DF"
        stroke="#8D4434" stroke-width="2"/>
  <text x="54" y="580" class="ink head">NEAR-MISS: singular contraction</text>
  <text x="54" y="605" class="ink body">Diagonal entries: 1/2 and 0</text>
  <text x="54" y="628" class="ink body">Total matrix inverse: zero</text>
  <text x="54" y="651" class="ink body">Inverse tail: 0</text>
  <text x="288" y="605" class="ink body">Signed log norm: -log 2</text>
  <rect x="286" y="622" width="294" height="54" rx="9" fill="#FFF9F6" stroke="#8D4434"/>
  <text x="306" y="645" class="muted kicker">FALSE LOWER RAIL</text>
  <text x="306" y="666" class="ink number">0 &lt;= -log 2</text>
  <path d="M540 634 L566 665 M566 634 L540 665" stroke="#8D4434" stroke-width="3"/>
  <text x="54" y="694" class="muted small">The unit gate rules this out; a total inverse alone erases singular collapse.</text>

  <rect x="636" y="552" width="332" height="157" rx="16" fill="#E9EFF3"
        stroke="#3F5D73" stroke-width="2"/>
  <text x="658" y="580" class="ink head">WHAT THE THREE GATES BUY</text>
  <text x="658" y="607" class="ink body">Every finite signed log norm is</text>
  <text x="658" y="628" class="ink body">measurable and integrable.</text>
  <text x="658" y="655" class="muted small">They prepare a subadditive process.</text>
  <text x="658" y="676" class="muted small">They do not prove a long-time limit,</text>
  <text x="658" y="694" class="muted small">directional rates, or a splitting.</text>

  <text x="32" y="737" class="muted subtitle">Toy values are exact. Patterned bars use one bar-length per log-2 unit; they are not empirical measurements.</text>
</svg>
