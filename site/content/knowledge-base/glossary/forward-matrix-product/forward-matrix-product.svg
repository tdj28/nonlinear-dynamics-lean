<svg xmlns="http://www.w3.org/2000/svg" width="800" height="470"
     viewBox="0 0 800 470" role="img"
     aria-labelledby="forwardProductTitle forwardProductDesc">
  <title id="forwardProductTitle">Chronological action in a forward matrix product</title>
  <desc id="forwardProductDesc">An initial column state moves from left to right through the earliest matrix action, a middle action, and the newest matrix action. The final state appears at the far right. A lower band explains that the written product places the newest factor on the left, while the earliest factor on the right acts first.</desc>
  <rect width="800" height="470" fill="#F7F4F0"/>
  <style>
    .t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#2C2924}
    .title{font-size:16px;font-weight:700}
    .h{font-size:13px;font-weight:700}
    .s{font-size:12px}
    .m{font-size:11px;fill:#5A544C}
  </style>
  <defs>
    <marker id="forwardProductArrow" markerWidth="8" markerHeight="8" refX="7" refY="4"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#A67C52"/>
    </marker>
  </defs>

  <text x="24" y="32" class="t title">Action time and written order tell the same story from opposite directions</text>
  <text x="24" y="53" class="t m">Follow the arrows to see which matrix touches the column state first.</text>

  <rect x="24" y="98" width="126" height="92" rx="12" fill="#E8F0F7" stroke="#4B6787" stroke-width="1.5"/>
  <text x="87" y="132" text-anchor="middle" class="t h">INITIAL</text>
  <text x="87" y="154" text-anchor="middle" class="t h">COLUMN STATE</text>
  <text x="87" y="176" text-anchor="middle" class="t m">time zero</text>

  <path d="M152 144 L188 144" fill="none" stroke="#A67C52" stroke-width="2.5" marker-end="url(#forwardProductArrow)"/>

  <rect x="194" y="88" width="150" height="112" rx="12" fill="#F3E8E0" stroke="#A67C52" stroke-width="1.5"/>
  <text x="269" y="125" text-anchor="middle" class="t h">EARLIEST</text>
  <text x="269" y="148" text-anchor="middle" class="t h">MATRIX ACTION</text>
  <text x="269" y="178" text-anchor="middle" class="t m">acts first</text>

  <path d="M346 144 L382 144" fill="none" stroke="#A67C52" stroke-width="2.5" marker-end="url(#forwardProductArrow)"/>

  <rect x="388" y="88" width="150" height="112" rx="12" fill="#FBF9F6" stroke="#C4B8A8" stroke-width="1.5"/>
  <text x="463" y="125" text-anchor="middle" class="t h">NEXT</text>
  <text x="463" y="148" text-anchor="middle" class="t h">MATRIX ACTION</text>
  <text x="463" y="178" text-anchor="middle" class="t m">continues time</text>

  <path d="M540 144 L576 144" fill="none" stroke="#A67C52" stroke-width="2.5" marker-end="url(#forwardProductArrow)"/>

  <rect x="582" y="88" width="194" height="112" rx="12" fill="#EAF1E5" stroke="#6F8D5E" stroke-width="1.5"/>
  <text x="679" y="125" text-anchor="middle" class="t h">NEWEST</text>
  <text x="679" y="148" text-anchor="middle" class="t h">MATRIX ACTION</text>
  <text x="679" y="178" text-anchor="middle" class="t m">acts last on the final state</text>

  <rect x="64" y="252" width="672" height="142" rx="14" fill="#16243A"/>
  <text x="400" y="288" text-anchor="middle" class="t h" style="fill:#FFFDF8">HOW THE PRODUCT IS WRITTEN</text>
  <text x="400" y="322" text-anchor="middle" class="t s" style="fill:#FFFDF8">NEWEST FACTOR ON THE LEFT</text>
  <text x="400" y="348" text-anchor="middle" class="t s" style="fill:#FFFDF8">EARLIEST FACTOR ON THE RIGHT</text>
  <text x="400" y="377" text-anchor="middle" class="t m" style="fill:#D9E1EA">the rightmost factor reaches a column state first</text>

  <text x="24" y="438" class="t m">The empty horizon performs no update, so its product is the identity action.</text>
</svg>
