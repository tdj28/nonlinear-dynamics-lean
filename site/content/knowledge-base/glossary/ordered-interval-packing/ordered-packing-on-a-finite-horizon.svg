<svg xmlns="http://www.w3.org/2000/svg" width="760" height="720"
     viewBox="0 0 760 720" role="img" aria-labelledby="titleOrderedPacking descOrderedPacking">
  <title id="titleOrderedPacking">An ordered interval packing on a finite horizon</title>
  <desc id="descOrderedPacking">A horizon with positions zero through nine contains the half-open intervals one to three, three to four, and six to nine. The first two abut. Marked starts one, two, three, six, and eight are covered. Insets explain singleton intervals and abutment.</desc>
  <rect width="760" height="720" fill="#F7F4F0"/>
  <style>
    .blue{fill:#E8F0F7;stroke:#4B6787;stroke-width:1.7}
    .cream{fill:#FBF9F6;stroke:#C4B8A8;stroke-width:1.7}
    .green{fill:#EAF1E5;stroke:#6F8D5E;stroke-width:1.7}
    .clay{fill:#F3E8E0;stroke:#A67C52;stroke-width:1.7}
    .gray{fill:#EDE8E1;stroke:#7F786D;stroke-width:1.7}
    .axis{stroke:#7F786D;stroke-width:2;fill:none}
    .dash{stroke:#7F786D;stroke-width:1.5;stroke-dasharray:5 5;fill:none}
    .t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#2C2924}
    .title{font-size:18px;font-weight:700}
    .h{font-size:14px;font-weight:700}
    .s{font-size:13px}
    .m{font-size:12px;fill:#5A544C}
  </style>

  <text x="32" y="38" class="t title">Ordered means chronological; packing means no overlap</text>
  <text x="32" y="62" class="t m">Every interval is half-open: its left endpoint belongs, while its right endpoint does not.</text>

  <text x="32" y="104" class="t h">ONE FINITE HORIZON: POSITIONS 0 THROUGH 9</text>
  <text x="54" y="128" class="t m">initial gap</text>
  <text x="333" y="128" class="t m">positive gap</text>
  <text x="658" y="128" class="t m">tail</text>
  <rect x="116" y="136" width="132" height="72" class="blue"/>
  <rect x="248" y="136" width="66" height="72" class="green"/>
  <rect x="446" y="136" width="198" height="72" class="clay"/>
  <text x="157" y="165" class="t h">[1,3)</text>
  <text x="143" y="190" class="t s">covers 1, 2</text>
  <text x="256" y="165" class="t h">[3,4)</text>
  <text x="255" y="190" class="t s">covers 3</text>
  <text x="514" y="165" class="t h">[6,9)</text>
  <text x="496" y="190" class="t s">covers 6, 7, 8</text>
  <line x1="50" y1="220" x2="710" y2="220" class="axis"/>
  <line x1="50" y1="212" x2="50" y2="228" class="axis"/>
  <line x1="116" y1="212" x2="116" y2="228" class="axis"/>
  <line x1="182" y1="212" x2="182" y2="228" class="axis"/>
  <line x1="248" y1="212" x2="248" y2="228" class="axis"/>
  <line x1="314" y1="212" x2="314" y2="228" class="axis"/>
  <line x1="380" y1="212" x2="380" y2="228" class="axis"/>
  <line x1="446" y1="212" x2="446" y2="228" class="axis"/>
  <line x1="512" y1="212" x2="512" y2="228" class="axis"/>
  <line x1="578" y1="212" x2="578" y2="228" class="axis"/>
  <line x1="644" y1="212" x2="644" y2="228" class="axis"/>
  <line x1="710" y1="212" x2="710" y2="228" class="axis"/>
  <text x="46" y="247" class="t m">0</text><text x="112" y="247" class="t m">1</text>
  <text x="178" y="247" class="t m">2</text><text x="244" y="247" class="t m">3</text>
  <text x="310" y="247" class="t m">4</text><text x="376" y="247" class="t m">5</text>
  <text x="442" y="247" class="t m">6</text><text x="508" y="247" class="t m">7</text>
  <text x="574" y="247" class="t m">8</text><text x="640" y="247" class="t m">9</text>
  <text x="702" y="247" class="t m">10</text>
  <text x="50" y="283" class="t m">marked</text>
  <circle cx="116" cy="279" r="6" fill="#A67C52"/><circle cx="182" cy="279" r="6" fill="#A67C52"/>
  <circle cx="248" cy="279" r="6" fill="#A67C52"/><circle cx="446" cy="279" r="6" fill="#A67C52"/>
  <circle cx="578" cy="279" r="6" fill="#A67C52"/>
  <text x="50" y="311" class="t m">covered</text>
  <circle cx="116" cy="307" r="5" fill="#6F8D5E"/><circle cx="182" cy="307" r="5" fill="#6F8D5E"/>
  <circle cx="248" cy="307" r="5" fill="#6F8D5E"/><circle cx="446" cy="307" r="5" fill="#6F8D5E"/>
  <circle cx="512" cy="307" r="5" fill="#6F8D5E"/><circle cx="578" cy="307" r="5" fill="#6F8D5E"/>
  <text x="116" y="340" class="t s">The first two intervals abut at 3; a positive gap separates the third.</text>

  <rect x="32" y="367" width="331" height="219" rx="14" class="cream"/>
  <text x="55" y="402" class="t h">ONE-POINT INTERVAL</text>
  <line x1="72" y1="485" x2="323" y2="485" class="axis"/>
  <rect x="184" y="449" width="34" height="72" rx="7" class="blue"/>
  <circle cx="201" cy="485" r="7" fill="#4B6787"/>
  <text x="72" y="551" class="t s">Positive length begins at one,</text>
  <text x="72" y="574" class="t s">so a singleton is a real interval.</text>

  <rect x="397" y="367" width="331" height="219" rx="14" class="cream"/>
  <text x="420" y="402" class="t h">ABUTTING INTERVALS</text>
  <line x1="437" y1="485" x2="688" y2="485" class="axis"/>
  <rect x="470" y="449" width="94" height="72" rx="7" class="green"/>
  <rect x="564" y="449" width="94" height="72" rx="7" class="clay"/>
  <line x1="564" y1="440" x2="564" y2="531" class="dash"/>
  <text x="444" y="551" class="t s">A shared boundary is legal:</text>
  <text x="444" y="574" class="t s">the left interval excludes it.</text>

  <rect x="32" y="620" width="696" height="67" rx="12" class="gray"/>
  <text x="54" y="648" class="t h">FINITE COMBINATORIAL OBJECT</text>
  <text x="54" y="671" class="t s">Order, positive lengths, nonnegative gaps, and a final horizon bound are explicit data.</text>
</svg>
