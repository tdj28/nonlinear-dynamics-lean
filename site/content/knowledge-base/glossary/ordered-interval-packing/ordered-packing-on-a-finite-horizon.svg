<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="800"
     viewBox="0 0 1000 800" role="img"
     aria-labelledby="titleOrderedPacking descOrderedPacking">
  <title id="titleOrderedPacking">A valid ordered packing and the overlap that breaks its length count</title>
  <desc id="descOrderedPacking">On a ten-position horizon, three ordered half-open intervals cover positions one, two, three, six, seven, and eight. Their lengths total six, every one of five marks is covered, and the first two intervals meet without overlap. A comparison moves the second start left from three to two, making position two belong to both intervals: the length sum becomes seven while the union still has six positions. A final strip shows the valid gap, length, and tail encoding.</desc>
  <defs>
    <pattern id="overlapHatch" width="8" height="8" patternUnits="userSpaceOnUse"
             patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#F3E8E0"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#8A5D35" stroke-width="3"/>
    </pattern>
  </defs>
  <rect width="1000" height="800" fill="#F7F4F0"/>
  <style>
    .blue{fill:#E8F0F7;stroke:#4B6787;stroke-width:1.7}
    .cream{fill:#FBF9F6;stroke:#C4B8A8;stroke-width:1.7}
    .green{fill:#EAF1E5;stroke:#6F8D5E;stroke-width:1.7}
    .clay{fill:#F3E8E0;stroke:#A67C52;stroke-width:1.7}
    .gray{fill:#EDE8E1;stroke:#7F786D;stroke-width:1.7}
    .axis{stroke:#7F786D;stroke-width:2;fill:none}
    .thin{stroke:#7F786D;stroke-width:1.3;fill:none}
    .dash{stroke:#7F786D;stroke-width:1.5;stroke-dasharray:5 5;fill:none}
    .t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#2C2924}
    .title{font-size:20px;font-weight:700}
    .h{font-size:14px;font-weight:700}
    .s{font-size:13px}
    .m{font-size:12px;fill:#5A544C}
    .tiny{font-size:11px;fill:#5A544C}
  </style>

  <text x="30" y="34" class="t title">One exact packing, one revealing failure</text>
  <text x="30" y="58" class="t m">Half-open endpoints make abutment legal; structural separation makes the length ledger exact.</text>

  <rect x="30" y="82" width="940" height="282" rx="14" class="cream"/>
  <text x="52" y="112" class="t h">VALID FAMILY ON TEN POSITIONS</text>
  <text x="52" y="132" class="t m">Three selected intervals; five marked starts; six distinct covered positions.</text>

  <rect x="130" y="150" width="120" height="58" rx="7" class="blue"/>
  <rect x="250" y="150" width="60" height="58" rx="7" class="green"/>
  <rect x="430" y="150" width="180" height="58" rx="7" class="clay"/>
  <text x="146" y="174" class="t h">A: start 1</text>
  <text x="147" y="195" class="t m">stop 3; length 2</text>
  <text x="258" y="174" class="t h">B</text>
  <text x="256" y="195" class="t tiny">3 to 4</text>
  <text x="468" y="174" class="t h">C: start 6</text>
  <text x="477" y="195" class="t m">stop 9; length 3</text>

  <line x1="70" y1="224" x2="670" y2="224" class="axis"/>
  <g class="axis">
    <line x1="70" y1="216" x2="70" y2="232"/>
    <line x1="130" y1="216" x2="130" y2="232"/>
    <line x1="190" y1="216" x2="190" y2="232"/>
    <line x1="250" y1="216" x2="250" y2="232"/>
    <line x1="310" y1="216" x2="310" y2="232"/>
    <line x1="370" y1="216" x2="370" y2="232"/>
    <line x1="430" y1="216" x2="430" y2="232"/>
    <line x1="490" y1="216" x2="490" y2="232"/>
    <line x1="550" y1="216" x2="550" y2="232"/>
    <line x1="610" y1="216" x2="610" y2="232"/>
    <line x1="670" y1="216" x2="670" y2="232"/>
  </g>
  <g class="t m" text-anchor="middle">
    <text x="70" y="251">0</text><text x="130" y="251">1</text>
    <text x="190" y="251">2</text><text x="250" y="251">3</text>
    <text x="310" y="251">4</text><text x="370" y="251">5</text>
    <text x="430" y="251">6</text><text x="490" y="251">7</text>
    <text x="550" y="251">8</text><text x="610" y="251">9</text>
    <text x="670" y="251">10</text>
  </g>

  <text x="70" y="284" class="t m">marks</text>
  <g fill="#A67C52" stroke="#6E4728" stroke-width="1">
    <circle cx="130" cy="280" r="6"/><circle cx="190" cy="280" r="6"/>
    <circle cx="250" cy="280" r="6"/><circle cx="430" cy="280" r="6"/>
    <circle cx="550" cy="280" r="6"/>
  </g>
  <text x="70" y="323" class="t m">covered</text>
  <g fill="#EAF1E5" stroke="#557545" stroke-width="2">
    <rect x="124" y="312" width="12" height="12" rx="2"/>
    <rect x="184" y="312" width="12" height="12" rx="2"/>
    <rect x="244" y="312" width="12" height="12" rx="2"/>
    <rect x="424" y="312" width="12" height="12" rx="2"/>
    <rect x="484" y="312" width="12" height="12" rx="2"/>
    <rect x="544" y="312" width="12" height="12" rx="2"/>
  </g>
  <text x="130" y="346" class="t m">The mark at 2 is covered inside A; it is not a selected start.</text>

  <rect x="720" y="111" width="220" height="221" rx="12" class="green"/>
  <text x="742" y="141" class="t h">EXACT LEDGER</text>
  <text x="742" y="171" class="t s">lengths: 2 + 1 + 3 = 6</text>
  <text x="742" y="198" class="t s">union size: 6</text>
  <text x="742" y="225" class="t s">marks covered: 5 of 5</text>
  <line x1="742" y1="242" x2="918" y2="242" class="dash"/>
  <text x="742" y="269" class="t s">A stops where B starts.</text>
  <text x="742" y="294" class="t s">B is a one-position interval.</text>
  <text x="742" y="318" class="t m">No positive gap is required.</text>

  <rect x="30" y="388" width="455" height="168" rx="14" class="cream"/>
  <text x="52" y="417" class="t h">LEGAL BOUNDARY: ABUTMENT</text>
  <text x="52" y="438" class="t m">A excludes position 3; B includes position 3.</text>
  <rect x="82" y="463" width="192" height="48" rx="7" class="blue"/>
  <rect x="274" y="463" width="96" height="48" rx="7" class="green"/>
  <line x1="274" y1="451" x2="274" y2="524" class="dash"/>
  <text x="126" y="492" class="t s">A: 1 to 3</text>
  <text x="287" y="492" class="t s">B: 3 to 4</text>
  <text x="82" y="539" class="t m">Shared endpoint, no shared position; the endpoint test passes.</text>

  <rect x="515" y="388" width="455" height="168" rx="14" class="clay"/>
  <text x="537" y="417" class="t h">NEAR-MISS: ONE OVERLAP</text>
  <text x="537" y="438" class="t m">Move B left: position 2 now belongs to both A and B.</text>
  <rect x="557" y="458" width="150" height="38" rx="7" class="blue"/>
  <rect x="632" y="488" width="150" height="38" rx="7" class="green"/>
  <rect x="632" y="458" width="75" height="68" fill="url(#overlapHatch)"
        stroke="#8A5D35" stroke-width="1.8"/>
  <text x="570" y="483" class="t s">A: 1 to 3</text>
  <text x="706" y="514" class="t s">B: 2 to 4</text>
  <text x="795" y="476" class="t h">overlap</text>
  <text x="795" y="496" class="t m">at position 2</text>
  <text x="537" y="544" class="t m">Length sum 7; union size 6; the endpoint test fails.</text>

  <rect x="30" y="579" width="940" height="150" rx="14" class="cream"/>
  <text x="52" y="608" class="t h">THE VALID FAMILY AS GAP, LENGTH, AND TAIL DATA</text>
  <text x="52" y="628" class="t m">Every width below is part of the ten-position horizon; the zero gap is a labeled boundary.</text>

  <rect x="50" y="650" width="90" height="44" class="gray"/>
  <rect x="140" y="650" width="180" height="44" class="blue"/>
  <rect x="320" y="650" width="90" height="44" class="green"/>
  <rect x="410" y="650" width="180" height="44" class="gray"/>
  <rect x="590" y="650" width="270" height="44" class="clay"/>
  <rect x="860" y="650" width="90" height="44" class="gray"/>
  <line x1="320" y1="638" x2="320" y2="706" class="dash"/>
  <g class="t m" text-anchor="middle">
    <text x="95" y="677">gap 1</text>
    <text x="230" y="677">length 2</text>
    <text x="365" y="677">length 1</text>
    <text x="500" y="677">gap 2</text>
    <text x="725" y="677">length 3</text>
    <text x="905" y="677">tail 1</text>
  </g>
  <text x="320" y="720" class="t tiny" text-anchor="middle">gap 0: A and B abut</text>

  <rect x="30" y="749" width="940" height="35" rx="10" class="green"/>
  <text x="500" y="772" class="t s" text-anchor="middle">Valid data totals 1 + 2 + 0 + 1 + 2 + 3 + 1 = 10; overlap is impossible by construction.</text>
</svg>
