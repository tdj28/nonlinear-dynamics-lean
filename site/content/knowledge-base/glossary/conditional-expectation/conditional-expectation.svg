<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400" role="img" aria-labelledby="conditionalExpectationTitle conditionalExpectationDesc">
  <title id="conditionalExpectationTitle">Conditional expectation preserves visible-cell integrals</title>
  <desc id="conditionalExpectationDesc">Four equal-mass atoms with values one, three, two, and six are grouped into two visible cells. Conditional expectation replaces each pair by its cell mean, two and four, while preserving cell totals four and eight.</desc>
  <defs>
    <marker id="conditionalArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#A67C52"/>
    </marker>
  </defs>
  <style>
    .t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#2C2924}
    .title{font-size:16px;font-weight:700}
    .head{font-size:12px;font-weight:700;letter-spacing:.3px}
    .label{font-size:11px}
    .value{font-size:18px;font-weight:700}
    .small{font-size:10px;fill:#5A544C}
    .neutral{fill:#FBF9F6;stroke:#C4B8A8;stroke-width:1.5}
    .blue{fill:#E8F0F7;stroke:#4B6787;stroke-width:1.5}
    .green{fill:#EAF1E5;stroke:#6F8D5E;stroke-width:1.5}
    .clay{fill:#F3E8E0;stroke:#A67C52;stroke-width:1.5}
    .atom{fill:#FFFDF8;stroke:#4B6787;stroke-width:1.3}
    .arrow{fill:none;stroke:#A67C52;stroke-width:2.2;marker-end:url(#conditionalArrow)}
  </style>
  <rect width="760" height="400" fill="#F7F4F0"/>
  <text x="24" y="29" class="t title">Conditional expectation preserves visible-cell integrals</text>
  <text x="24" y="49" class="t small">Counting measure gives every atom equal weight in this worked finite example.</text>

  <rect x="24" y="76" width="280" height="236" rx="17" class="neutral"/>
  <text x="164" y="102" text-anchor="middle" class="t head">FINE OBSERVABLE f</text>
  <rect x="46" y="119" width="236" height="76" rx="13" class="blue"/>
  <text x="58" y="138" class="t small">visible cell A</text>
  <rect x="72" y="149" width="76" height="32" rx="8" class="atom"/>
  <rect x="180" y="149" width="76" height="32" rx="8" class="atom"/>
  <text x="110" y="170" text-anchor="middle" class="t label">a: <tspan class="value">1</tspan></text>
  <text x="218" y="170" text-anchor="middle" class="t label">b: <tspan class="value">3</tspan></text>
  <rect x="46" y="213" width="236" height="76" rx="13" class="green"/>
  <text x="58" y="232" class="t small">visible cell B</text>
  <rect x="72" y="243" width="76" height="32" rx="8" class="atom"/>
  <rect x="180" y="243" width="76" height="32" rx="8" class="atom"/>
  <text x="110" y="264" text-anchor="middle" class="t label">c: <tspan class="value">2</tspan></text>
  <text x="218" y="264" text-anchor="middle" class="t label">d: <tspan class="value">6</tspan></text>

  <path d="M316 194 H426" class="arrow"/>
  <text x="371" y="164" text-anchor="middle" class="t head">KEEP ONLY</text>
  <text x="371" y="179" text-anchor="middle" class="t small">which cell?</text>
  <text x="371" y="220" text-anchor="middle" class="t small">match every</text>
  <text x="371" y="234" text-anchor="middle" class="t small">visible integral</text>

  <rect x="438" y="76" width="298" height="236" rx="17" class="neutral"/>
  <text x="587" y="102" text-anchor="middle" class="t head">CONDITIONAL EXPECTATION</text>
  <rect x="460" y="119" width="254" height="76" rx="13" class="blue"/>
  <text x="472" y="138" class="t small">cell A must be constant</text>
  <rect x="486" y="149" width="82" height="32" rx="8" class="atom"/>
  <rect x="606" y="149" width="82" height="32" rx="8" class="atom"/>
  <text x="527" y="170" text-anchor="middle" class="t label">a: <tspan class="value">2</tspan></text>
  <text x="647" y="170" text-anchor="middle" class="t label">b: <tspan class="value">2</tspan></text>
  <rect x="460" y="213" width="254" height="76" rx="13" class="green"/>
  <text x="472" y="232" class="t small">cell B must be constant</text>
  <rect x="486" y="243" width="82" height="32" rx="8" class="atom"/>
  <rect x="606" y="243" width="82" height="32" rx="8" class="atom"/>
  <text x="527" y="264" text-anchor="middle" class="t label">c: <tspan class="value">4</tspan></text>
  <text x="647" y="264" text-anchor="middle" class="t label">d: <tspan class="value">4</tspan></text>

  <rect x="58" y="335" width="644" height="42" rx="12" class="clay"/>
  <text x="380" y="353" text-anchor="middle" class="t head">VISIBLE-SET RECEIPT</text>
  <text x="380" y="369" text-anchor="middle" class="t label">cell A: 1 + 3 = 2 + 2 = 4     |     cell B: 2 + 6 = 4 + 4 = 8</text>
</svg>
