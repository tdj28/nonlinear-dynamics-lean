<svg xmlns="http://www.w3.org/2000/svg" width="920" height="600" viewBox="0 0 920 600" role="img" aria-labelledby="conditionalExpectationTitle conditionalExpectationDesc">
  <title id="conditionalExpectationTitle">Conditional expectation averages inside visible cells and preserves their integrals</title>
  <desc id="conditionalExpectationDesc">Four states each have probability one quarter. Original values one and three in cell A become two and two, while values two and six in cell B become four and four. Separate receipts verify that the cell integrals remain one and two and the global expectation remains three. A footer notes that swapping states within each pair makes these cells exactly invariant information.</desc>
  <defs>
    <marker id="conditionalArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#A67C52"/>
    </marker>
    <pattern id="cellAPattern" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M0 8 L8 0" stroke="#C6D4E2" stroke-width="1"/>
    </pattern>
    <pattern id="cellBPattern" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#BCD0AF"/>
    </pattern>
  </defs>
  <style>
    .t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#2C2924}
    .title{font-size:17px;font-weight:700}
    .head{font-size:13px;font-weight:700;letter-spacing:.25px}
    .label{font-size:12px}
    .value{font-size:18px;font-weight:700}
    .small{font-size:11px;fill:#5A544C}
    .tiny{font-size:10px;fill:#5A544C}
    .neutral{fill:#FBF9F6;stroke:#C4B8A8;stroke-width:1.5}
    .blue{fill:#E8F0F7;stroke:#4B6787;stroke-width:1.5}
    .green{fill:#EAF1E5;stroke:#6F8D5E;stroke-width:1.5}
    .clay{fill:#F3E8E0;stroke:#A67C52;stroke-width:1.5}
    .atom{fill:#FFFDF8;stroke:#7F786D;stroke-width:1.2}
    .arrow{fill:none;stroke:#A67C52;stroke-width:2.5;marker-end:url(#conditionalArrow)}
  </style>

  <rect width="920" height="600" fill="#F7F4F0"/>
  <text x="24" y="30" class="t title">Conditional expectation keeps every question the coarse information can ask</text>
  <text x="24" y="52" class="t small">Four equally likely states are grouped into two visible cells; each state has probability 1/4.</text>

  <rect x="24" y="78" width="352" height="258" rx="16" class="neutral"/>
  <text x="200" y="104" text-anchor="middle" class="t head">ORIGINAL VARIABLE X</text>

  <rect x="44" y="120" width="312" height="86" rx="12" class="blue"/>
  <rect x="44" y="120" width="312" height="86" rx="12" fill="url(#cellAPattern)" opacity="0.55"/>
  <text x="58" y="141" class="t head">CELL A</text>
  <text x="117" y="141" class="t tiny">the observer cannot separate a from b</text>
  <rect x="70" y="153" width="108" height="40" rx="8" class="atom"/>
  <rect x="222" y="153" width="108" height="40" rx="8" class="atom"/>
  <text x="124" y="179" text-anchor="middle" class="t label">a: <tspan class="value">1</tspan></text>
  <text x="276" y="179" text-anchor="middle" class="t label">b: <tspan class="value">3</tspan></text>

  <rect x="44" y="224" width="312" height="86" rx="12" class="green"/>
  <rect x="44" y="224" width="312" height="86" rx="12" fill="url(#cellBPattern)" opacity="0.55"/>
  <text x="58" y="245" class="t head">CELL B</text>
  <text x="117" y="245" class="t tiny">the observer cannot separate c from d</text>
  <rect x="70" y="257" width="108" height="40" rx="8" class="atom"/>
  <rect x="222" y="257" width="108" height="40" rx="8" class="atom"/>
  <text x="124" y="283" text-anchor="middle" class="t label">c: <tspan class="value">2</tspan></text>
  <text x="276" y="283" text-anchor="middle" class="t label">d: <tspan class="value">6</tspan></text>

  <path d="M392 203 H504" class="arrow"/>
  <text x="448" y="151" text-anchor="middle" class="t head">COARSEN</text>
  <text x="448" y="171" text-anchor="middle" class="t small">hide names</text>
  <text x="448" y="185" text-anchor="middle" class="t small">inside each cell</text>
  <text x="448" y="233" text-anchor="middle" class="t small">preserve each</text>
  <text x="448" y="247" text-anchor="middle" class="t small">visible integral</text>

  <rect x="520" y="78" width="376" height="258" rx="16" class="neutral"/>
  <text x="708" y="104" text-anchor="middle" class="t head">VISIBLE REPLACEMENT G</text>

  <rect x="540" y="120" width="336" height="86" rx="12" class="blue"/>
  <rect x="540" y="120" width="336" height="86" rx="12" fill="url(#cellAPattern)" opacity="0.55"/>
  <text x="554" y="141" class="t head">CELL A USES ITS MEAN</text>
  <rect x="574" y="153" width="108" height="40" rx="8" class="atom"/>
  <rect x="734" y="153" width="108" height="40" rx="8" class="atom"/>
  <text x="628" y="179" text-anchor="middle" class="t label">a: <tspan class="value">2</tspan></text>
  <text x="788" y="179" text-anchor="middle" class="t label">b: <tspan class="value">2</tspan></text>

  <rect x="540" y="224" width="336" height="86" rx="12" class="green"/>
  <rect x="540" y="224" width="336" height="86" rx="12" fill="url(#cellBPattern)" opacity="0.55"/>
  <text x="554" y="245" class="t head">CELL B USES ITS MEAN</text>
  <rect x="574" y="257" width="108" height="40" rx="8" class="atom"/>
  <rect x="734" y="257" width="108" height="40" rx="8" class="atom"/>
  <text x="628" y="283" text-anchor="middle" class="t label">c: <tspan class="value">4</tspan></text>
  <text x="788" y="283" text-anchor="middle" class="t label">d: <tspan class="value">4</tspan></text>

  <rect x="24" y="356" width="280" height="108" rx="13" class="blue"/>
  <text x="164" y="380" text-anchor="middle" class="t head">CELL A RECEIPT</text>
  <text x="44" y="406" class="t label">original: (1 + 3) / 4 = 1</text>
  <text x="44" y="428" class="t label">coarse:  (2 + 2) / 4 = 1</text>
  <text x="44" y="450" class="t small">same integral on the visible event A</text>

  <rect x="320" y="356" width="280" height="108" rx="13" class="green"/>
  <text x="460" y="380" text-anchor="middle" class="t head">CELL B RECEIPT</text>
  <text x="340" y="406" class="t label">original: (2 + 6) / 4 = 2</text>
  <text x="340" y="428" class="t label">coarse:  (4 + 4) / 4 = 2</text>
  <text x="340" y="450" class="t small">same integral on the visible event B</text>

  <rect x="616" y="356" width="280" height="108" rx="13" class="clay"/>
  <text x="756" y="380" text-anchor="middle" class="t head">WHOLE-SPACE CHECK</text>
  <text x="636" y="406" class="t label">original: 12 / 4 = 3</text>
  <text x="636" y="428" class="t label">coarse:  12 / 4 = 3</text>
  <text x="636" y="450" class="t small">G is still not the constant value 3</text>

  <rect x="24" y="486" width="872" height="88" rx="14" class="clay"/>
  <text x="44" y="512" class="t head">THE SAME CELLS CAN BE INVARIANT INFORMATION</text>
  <text x="44" y="537" class="t label">If time swaps a with b and swaps c with d, a step never crosses between cell A and cell B.</text>
  <text x="44" y="558" class="t label">Exactly invariant events are empty, A, B, and the whole space; conditional expectation keeps that cell label.</text>
</svg>
