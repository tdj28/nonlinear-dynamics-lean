<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="weyl-example-title weyl-example-desc">
  <title id="weyl-example-title">Ordered eigenvalue shifts inside a Frobenius perturbation budget</title>
  <desc id="weyl-example-desc">Matrix A has decreasing eigenvalues three and one. Matrix B has decreasing eigenvalues four and minus one. Equal-rank lines connect three to four with shift one and one to minus one with shift two. Both shifts fit inside the matrix Frobenius budget square root five. A crossed dashed line from three to minus one has shift four and is labeled as the wrong matching.</desc>
  <defs>
    <marker id="weyl-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#56656b"/>
    </marker>
    <pattern id="weyl-budget" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="12" height="12" fill="#e7efe2"/>
      <rect width="4" height="12" fill="#708e62"/>
    </pattern>
    <filter id="weyl-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#2b2925" flood-opacity=".14"/>
    </filter>
    <style>
      .t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#292722}
      .title{font-size:28px;font-weight:750}
      .sub{font-size:14px;fill:#5a554e}
      .band{font-size:14px;font-weight:750;letter-spacing:1px}
      .node{font-size:20px;font-weight:750}
      .body{font-size:15px}
      .small{font-size:12px;fill:#5a554e}
      .rank{font-size:13px;font-weight:700;fill:#527184}
      .good{fill:none;stroke:#557d8d;stroke-width:4;marker-end:url(#weyl-arrow)}
      .bad{fill:none;stroke:#a45845;stroke-width:3;stroke-dasharray:9 7;marker-end:url(#weyl-arrow)}
    </style>
  </defs>
  <rect width="1200" height="780" rx="28" fill="#f7f1e7"/>
  <text class="t title" x="48" y="50">Sort first, then spend one matrix perturbation budget</text>
  <text class="t sub" x="48" y="78">Diagonal example: A = diag(3,1), B = diag(4,−1)</text>

  <rect x="34" y="108" width="762" height="500" rx="24" fill="#eaf0f3" stroke="#86a0ab" stroke-width="1.6"/>
  <text class="t band" x="58" y="140" fill="#426672">DECREASING ORDER CREATES THE MATCHING</text>

  <g filter="url(#weyl-shadow)">
    <rect x="76" y="180" width="238" height="364" rx="20" fill="#fffdfa" stroke="#547c8e" stroke-width="2"/>
    <rect x="516" y="180" width="238" height="364" rx="20" fill="#fffdfa" stroke="#547c8e" stroke-width="2"/>
  </g>
  <text class="t node" x="195" y="220" text-anchor="middle">spectrum of A</text>
  <text class="t node" x="635" y="220" text-anchor="middle">spectrum of B</text>
  <line x1="120" y1="288" x2="270" y2="288" stroke="#547c8e" stroke-width="4"/>
  <circle cx="195" cy="288" r="13" fill="#d8e8ef" stroke="#547c8e" stroke-width="3"/>
  <text class="t node" x="195" y="269" text-anchor="middle">3</text>
  <text class="t rank" x="108" y="313">rank 0</text>
  <line x1="120" y1="448" x2="270" y2="448" stroke="#547c8e" stroke-width="4"/>
  <circle cx="195" cy="448" r="13" fill="#d8e8ef" stroke="#547c8e" stroke-width="3"/>
  <text class="t node" x="195" y="429" text-anchor="middle">1</text>
  <text class="t rank" x="108" y="473">rank 1</text>

  <line x1="560" y1="258" x2="710" y2="258" stroke="#547c8e" stroke-width="4"/>
  <circle cx="635" cy="258" r="13" fill="#d8e8ef" stroke="#547c8e" stroke-width="3"/>
  <text class="t node" x="635" y="239" text-anchor="middle">4</text>
  <text class="t rank" x="548" y="283">rank 0</text>
  <line x1="560" y1="488" x2="710" y2="488" stroke="#547c8e" stroke-width="4"/>
  <circle cx="635" cy="488" r="13" fill="#d8e8ef" stroke="#547c8e" stroke-width="3"/>
  <text class="t node" x="635" y="469" text-anchor="middle">−1</text>
  <text class="t rank" x="548" y="513">rank 1</text>

  <path class="good" d="M270 288 C368 288 417 258 550 258"/>
  <path class="good" d="M270 448 C368 448 417 488 550 488"/>
  <rect x="335" y="236" width="144" height="48" rx="12" fill="#fffdfa" stroke="#547c8e" stroke-width="1.5"/>
  <text class="t body" x="407" y="266" text-anchor="middle">shift |3−4| = 1</text>
  <rect x="335" y="464" width="155" height="48" rx="12" fill="#fffdfa" stroke="#547c8e" stroke-width="1.5"/>
  <text class="t body" x="412" y="494" text-anchor="middle">shift |1−(−1)| = 2</text>

  <path class="bad" d="M270 306 C384 345 426 431 550 476"/>
  <rect x="318" y="352" width="210" height="58" rx="13" fill="#f7ded6" stroke="#a45845" stroke-width="1.8"/>
  <text class="t body" x="423" y="377" text-anchor="middle">crossed shift |3−(−1)| = 4</text>
  <text class="t small" x="423" y="397" text-anchor="middle">not an equal-rank pair</text>

  <rect x="826" y="108" width="340" height="500" rx="24" fill="#edf1e8" stroke="#819974" stroke-width="1.6"/>
  <text class="t band" x="850" y="140" fill="#56704b">ONE MATRIX-LEVEL BUDGET</text>
  <g filter="url(#weyl-shadow)">
    <rect x="862" y="178" width="268" height="162" rx="18" fill="url(#weyl-budget)" stroke="#708e62" stroke-width="2"/>
  </g>
  <text class="t node" x="996" y="218" text-anchor="middle">A − B = diag(−1, 2)</text>
  <text class="t body" x="996" y="258" text-anchor="middle">‖A−B‖²_F = (−1)² + 2²</text>
  <text class="t node" x="996" y="302" text-anchor="middle">budget = √5</text>

  <rect x="862" y="374" width="268" height="92" rx="16" fill="#fffdfa" stroke="#708e62" stroke-width="2"/>
  <text class="t node" x="996" y="410" text-anchor="middle">1 ≤ √5</text>
  <text class="t small" x="996" y="440" text-anchor="middle">rank 0 shift fits</text>
  <rect x="862" y="486" width="268" height="92" rx="16" fill="#fffdfa" stroke="#708e62" stroke-width="2"/>
  <text class="t node" x="996" y="522" text-anchor="middle">2 ≤ √5</text>
  <text class="t small" x="996" y="552" text-anchor="middle">rank 1 shift fits</text>

  <rect x="34" y="636" width="1132" height="102" rx="22" fill="#f1e7df" stroke="#a7785d" stroke-width="1.6"/>
  <text class="t node" x="600" y="675" text-anchor="middle">Ordering is not cosmetic</text>
  <text class="t body" x="600" y="708" text-anchor="middle">The same budget controls every equal-rank coordinate; it does not control arbitrary cross-pairings.</text>
</svg>
