<svg xmlns="http://www.w3.org/2000/svg" width="760" height="450" viewBox="0 0 760 450" role="img" aria-labelledby="tailCeilingTitle tailCeilingDesc">
  <title id="tailCeilingTitle">Limit superior is the descending ceiling of sequence tails</title>
  <desc id="tailCeilingDesc">Three later tail windows discard more of the finite prefix. Their ceilings descend or stay level. An oscillating sequence can keep returning to the upper ceiling while also dropping below it, so an upper limsup bound does not imply convergence.</desc>
  <rect width="760" height="450" fill="#F7F4F0"/>
  <style>.t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#2C2924}.title{font-size:18px;font-weight:700}.h{font-size:14px;font-weight:700}.s{font-size:12px}.m{font-size:11px;fill:#5A544C}.blue{fill:#E8F0F7;stroke:#4B6787;stroke-width:1.5}.green{fill:#EAF1E5;stroke:#6F8D5E;stroke-width:1.5}.clay{fill:#F3E8E0;stroke:#A67C52;stroke-width:1.5}.cream{fill:#FBF9F6;stroke:#C4B8A8;stroke-width:1.5}.ceiling{stroke:#A67C52;stroke-width:2;stroke-dasharray:7 5}</style>
  <text x="24" y="30" class="t title">Move the tail forward and watch its ceiling descend</text><text x="24" y="51" class="t m">The sketch is conceptual; vertical position represents relative order only.</text>
  <rect x="24" y="82" width="214" height="220" rx="13" class="blue"/><text x="44" y="112" class="t h">EARLY TAIL</text><line x1="44" y1="150" x2="218" y2="150" class="ceiling"/><text x="44" y="140" class="t m">higher ceiling</text><polyline points="48,242 75,176 102,255 129,192 156,262 183,205 212,270" fill="none" stroke="#4B6787" stroke-width="2.3"/>
  <rect x="273" y="82" width="214" height="220" rx="13" class="cream"/><text x="293" y="112" class="t h">LATER TAIL</text><line x1="293" y1="174" x2="467" y2="174" class="ceiling"/><text x="293" y="164" class="t m">lower ceiling</text><polyline points="297,242 324,194 351,255 378,206 405,262 432,215 461,270" fill="none" stroke="#7F786D" stroke-width="2.3"/>
  <rect x="522" y="82" width="214" height="220" rx="13" class="green"/><text x="542" y="112" class="t h">EVENTUAL TAILS</text><line x1="542" y1="194" x2="716" y2="194" class="ceiling"/><text x="542" y="184" class="t m">eventual upper edge</text><polyline points="546,242 573,210 600,255 627,211 654,262 681,212 710,270" fill="none" stroke="#6F8D5E" stroke-width="2.3"/>
  <rect x="24" y="326" width="344" height="92" rx="13" class="green"/><text x="48" y="356" class="t h">WHAT LIMSUP REMEMBERS</text><text x="48" y="383" class="t s">The highest level reached arbitrarily late.</text><text x="48" y="403" class="t m">Any finite prefix has disappeared.</text>
  <rect x="392" y="326" width="344" height="92" rx="13" class="clay"/><text x="416" y="356" class="t h">WHAT IT DOES NOT PROVE</text><text x="416" y="383" class="t s">The lower edge may remain separated.</text><text x="416" y="403" class="t m">Upper control alone is not convergence.</text>
</svg>
