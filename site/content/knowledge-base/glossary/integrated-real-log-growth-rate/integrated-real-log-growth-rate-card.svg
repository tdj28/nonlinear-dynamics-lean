  <rect x="38" y="38" width="1124" height="554" rx="28" fill="#fbf8f0" stroke="#315f63" stroke-width="4"/>
  <text x="76" y="104" font-family="Arial,sans-serif" font-size="21" letter-spacing="3" fill="#7a4d69">GLOSSARY · SIGNED LONG-RUN GROWTH</text>
  <text x="76" y="178" font-family="Georgia,serif" font-size="49" fill="#23343b">Integrated real-log growth rate</text>
  <text x="76" y="245" font-family="Georgia,serif" font-size="36" fill="#315f63">λ = lim a(n)/n = inf over n ≥ 1</text>
