<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Integrated real-log growth rate</title>
  <desc id="desc">A glossary social card showing normalized signed integrals approaching a finite infimum above an inverse-tail lower bound.</desc>
