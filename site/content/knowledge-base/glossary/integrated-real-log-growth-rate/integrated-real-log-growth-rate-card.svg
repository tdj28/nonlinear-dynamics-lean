  <g fill="#315f63"><circle cx="120" cy="315" r="9"/><circle cx="330" cy="360" r="9"/><circle cx="540" cy="390" r="9"/><circle cx="800" cy="401" r="9"/><circle cx="1050" cy="405" r="9"/></g>
  <text x="990" y="383" font-family="Arial,sans-serif" font-size="22" fill="#8a6d38">λ</text>
  <text x="76" y="548" font-family="Arial,sans-serif" font-size="19" fill="#7a4d69">finite signed Fekete limit · public working note · professional review pending</text>
