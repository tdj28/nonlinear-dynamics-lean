<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="570" viewBox="0 0 1120 570" role="img" aria-labelledby="title desc">
  <title id="title">Lorenz symmetry pairs the two nonzero equilibria</title>
  <desc id="desc">A central sign-flip map connects the positive and negative square-root equilibria. A scope note says that the diagram contains no attractor or chaos theorem.</desc>
  <rect width="1120" height="570" rx="24" fill="#f1e9da"/>
  <text x="560" y="50" text-anchor="middle" font-family="system-ui,sans-serif" font-size="29" font-weight="750" fill="#16324f">ONE SYMMETRY, TWO NONZERO FIELD ZEROS</text>
  <rect x="64" y="116" width="352" height="154" rx="22" fill="#dfece3" stroke="#315f63" stroke-width="3"/>
  <text x="240" y="158" text-anchor="middle" font-family="system-ui,sans-serif" font-size="21" font-weight="700" fill="#285448">POSITIVE SIGN</text>
  <text x="240" y="205" text-anchor="middle" font-family="Georgia,serif" font-size="28" fill="#16324f">(q, q, rho - 1)</text>
  <text x="240" y="242" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" fill="#263c3b">field value = zero</text>
  <rect x="704" y="116" width="352" height="154" rx="22" fill="#f3dfca" stroke="#874d3b" stroke-width="3"/>
  <text x="880" y="158" text-anchor="middle" font-family="system-ui,sans-serif" font-size="21" font-weight="700" fill="#874d3b">NEGATIVE SIGN</text>
  <text x="880" y="205" text-anchor="middle" font-family="Georgia,serif" font-size="28" fill="#16324f">(-q, -q, rho - 1)</text>
  <text x="880" y="242" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" fill="#263c3b">field value = zero</text>
  <rect x="452" y="126" width="216" height="134" rx="67" fill="#e4eef4" stroke="#315f63" stroke-width="3"/>
  <text x="560" y="172" text-anchor="middle" font-family="system-ui,sans-serif" font-size="22" font-weight="750" fill="#16324f">SIGN FLIP</text>
  <text x="560" y="207" text-anchor="middle" font-family="Georgia,serif" font-size="23" fill="#263c3b">x, y negate</text>
  <text x="560" y="238" text-anchor="middle" font-family="Georgia,serif" font-size="23" fill="#263c3b">z stays fixed</text>
  <path d="M416 193 H442" stroke="#315f63" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M668 193 H694" stroke="#874d3b" stroke-width="4" marker-end="url(#arrowWarm)"/>
  <rect x="90" y="332" width="940" height="108" rx="20" fill="#fffaf1" stroke="#315f63" stroke-width="3"/>
  <text x="560" y="374" text-anchor="middle" font-family="system-ui,sans-serif" font-size="22" font-weight="750" fill="#285448">WHAT THE ALGEBRA ESTABLISHES</text>
  <text x="560" y="413" text-anchor="middle" font-family="Georgia,serif" font-size="25" fill="#263c3b">the field commutes with the sign flip and the zeros occur in a pair</text>
  <rect x="90" y="468" width="940" height="66" rx="18" fill="#f3dfca" stroke="#874d3b" stroke-width="3"/>
  <text x="560" y="509" text-anchor="middle" font-family="system-ui,sans-serif" font-size="21" font-weight="700" fill="#874d3b">NO FLOW, ATTRACTOR, SENSITIVITY, OR CHAOS THEOREM IS SHOWN</text>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#315f63"/></marker><marker id="arrowWarm" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#874d3b"/></marker></defs>
</svg>
