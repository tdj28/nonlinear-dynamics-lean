<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Lorenz system glossary chapter</title>
  <desc id="desc">A glossary card places the Lorenz sign flip between its two nonzero equilibria and labels the result as field algebra rather than an attractor theorem.</desc>
  <rect width="1200" height="630" fill="#f1e9da"/>
  <rect x="40" y="40" width="1120" height="550" rx="28" fill="#fffaf1" stroke="#315f63" stroke-width="4"/>
  <text x="78" y="105" font-family="system-ui,sans-serif" font-size="25" font-weight="750" fill="#2d7f73">KNOWLEDGE BASE · GLOSSARY</text>
  <text x="78" y="184" font-family="system-ui,sans-serif" font-size="56" font-weight="780" fill="#16324f">LORENZ SYSTEM</text>
  <text x="78" y="238" font-family="Georgia,serif" font-size="29" fill="#263c3b">three polynomial coordinates, one exact symmetry</text>
  <rect x="90" y="284" width="370" height="112" rx="20" fill="#dfece3" stroke="#315f63" stroke-width="3"/>
  <text x="275" y="331" text-anchor="middle" font-family="system-ui,sans-serif" font-size="20" font-weight="700" fill="#285448">POSITIVE-SIGN ZERO</text>
  <text x="275" y="370" text-anchor="middle" font-family="Georgia,serif" font-size="27" fill="#16324f">(q, q, rho - 1)</text>
  <rect x="740" y="284" width="370" height="112" rx="20" fill="#f3dfca" stroke="#874d3b" stroke-width="3"/>
  <text x="925" y="331" text-anchor="middle" font-family="system-ui,sans-serif" font-size="20" font-weight="700" fill="#874d3b">NEGATIVE-SIGN ZERO</text>
  <text x="925" y="370" text-anchor="middle" font-family="Georgia,serif" font-size="27" fill="#16324f">(-q, -q, rho - 1)</text>
  <rect x="495" y="292" width="210" height="96" rx="48" fill="#e4eef4" stroke="#315f63" stroke-width="3"/>
  <text x="600" y="330" text-anchor="middle" font-family="system-ui,sans-serif" font-size="20" font-weight="750" fill="#16324f">SIGN FLIP</text>
  <text x="600" y="362" text-anchor="middle" font-family="Georgia,serif" font-size="22" fill="#263c3b">x,y negate</text>
  <rect x="150" y="448" width="900" height="72" rx="18" fill="#fffaf1" stroke="#874d3b" stroke-width="3"/>
  <text x="600" y="492" text-anchor="middle" font-family="system-ui,sans-serif" font-size="22" font-weight="700" fill="#874d3b">FIELD ALGEBRA ONLY · NO ATTRACTOR OR CHAOS THEOREM</text>
  <text x="600" y="558" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" fill="#285448">q = sqrt(beta (rho - 1))</text>
</svg>
