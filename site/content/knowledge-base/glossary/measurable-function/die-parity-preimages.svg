<svg xmlns="http://www.w3.org/2000/svg" width="920" height="620"
     viewBox="0 0 920 620" role="img"
     aria-labelledby="measurableFunctionTitle measurableFunctionDesc">
  <title id="measurableFunctionTitle">Testing a die-to-parity function by pulling target events backward</title>
  <desc id="measurableFunctionDesc">A parity function sends die faces one, three, and five to odd and faces two, four, and six to even. The four measurable target events pull back to empty, odd faces, even faces, and all faces, all of which belong to the parity-only source event family. In a contrasting exact-face readout, the measurable target event containing only face two pulls back to the singleton two, which is not available in the parity-only source measurable space.</desc>
  <rect width="920" height="620" fill="#F7F4F0"/>
  <style>
    .t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#2C2924}
    .title{font-size:17px;font-weight:700}
    .h{font-size:13px;font-weight:700;letter-spacing:.35px}
    .body{font-size:13px}
    .small{font-size:12px}
    .muted{font-size:11px;fill:#5A544C}
    .panel{fill:#FBF9F6;stroke:#A89C8E;stroke-width:1.6}
    .odd{fill:#E8F0F7;stroke:#4B6787;stroke-width:1.6}
    .even{fill:url(#measEvenHatch);stroke:#95653E;stroke-width:1.6}
    .good{fill:#EAF1E5;stroke:#5F7F50;stroke-width:1.7}
    .bad{fill:url(#measBadHatch);stroke:#8A3E38;stroke-width:1.8}
    .arrow{fill:none;stroke:#95653E;stroke-width:2.1}
    .back{fill:none;stroke:#4B6787;stroke-width:2;stroke-dasharray:6 4}
    .backBad{fill:none;stroke:#8A3E38;stroke-width:2.2;stroke-dasharray:6 4}
  </style>
  <defs>
    <pattern id="measEvenHatch" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#F3E8E0"/>
      <path d="M-2 2 L2 -2 M0 8 L8 0 M6 10 L10 6" stroke="#D2B69E" stroke-width="1"/>
    </pattern>
    <pattern id="measBadHatch" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#F7E9E7"/>
      <path d="M-2 2 L2 -2 M0 8 L8 0 M6 10 L10 6" stroke="#CF9C97" stroke-width="1"/>
    </pattern>
    <marker id="measArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#95653E"/>
    </marker>
    <marker id="measBackArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#4B6787"/>
    </marker>
    <marker id="measBadArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#8A3E38"/>
    </marker>
  </defs>

  <text x="24" y="30" class="t title">Measurability asks whether every allowed target question pulls back</text>
  <text x="24" y="51" class="t muted">The preimage arrow runs backward from reported values to the source outcomes that produce them.</text>

  <rect x="24" y="76" width="872" height="340" rx="14" class="panel"/>
  <text x="44" y="103" class="t h">PASS: THE PARITY READOUT MATCHES THE PARITY-ONLY SOURCE INFORMATION</text>

  <rect x="44" y="125" width="274" height="156" rx="12" class="odd"/>
  <text x="62" y="151" class="t h">SOURCE OMEGA = {1,2,3,4,5,6}</text>
  <text x="62" y="172" class="t muted">Allowed family F = {empty, O, E, Omega}</text>
  <rect x="62" y="191" width="108" height="66" rx="9" class="odd"/>
  <text x="80" y="215" class="t h">ODD O</text>
  <text x="80" y="240" class="t body">1   3   5</text>
  <rect x="188" y="191" width="108" height="66" rx="9" class="even"/>
  <text x="206" y="215" class="t h">EVEN E</text>
  <text x="206" y="240" class="t body">2   4   6</text>

  <path d="M318 203 L390 203" class="arrow" marker-end="url(#measArrow)"/>
  <text x="342" y="188" class="t h">p</text>
  <text x="328" y="229" class="t muted">report parity</text>

  <rect x="402" y="125" width="184" height="156" rx="12" fill="#FBF9F6" stroke="#95653E" stroke-width="1.6"/>
  <text x="420" y="151" class="t h">TARGET Y</text>
  <text x="420" y="172" class="t muted">Every subset is measurable.</text>
  <rect x="420" y="191" width="62" height="66" rx="9" class="odd"/>
  <text x="434" y="229" class="t h">odd</text>
  <rect x="506" y="191" width="62" height="66" rx="9" class="even"/>
  <text x="516" y="229" class="t h">even</text>

  <rect x="616" y="125" width="260" height="252" rx="12" class="good"/>
  <text x="636" y="151" class="t h">CHECK ALL FOUR TARGET EVENTS</text>
  <text x="636" y="179" class="t body">empty pulls back to empty</text>
  <text x="636" y="210" class="t body">{odd} pulls back to O</text>
  <text x="636" y="241" class="t body">{even} pulls back to E</text>
  <text x="636" y="272" class="t body">Y pulls back to Omega</text>
  <text x="636" y="310" class="t h">ALL FOUR BELONG TO F</text>
  <text x="636" y="335" class="t body">Therefore p is measurable.</text>
  <text x="636" y="360" class="t muted">The check is exhaustive because Y has two points.</text>

  <path d="M616 302 C550 302 474 322 326 322" class="back" marker-end="url(#measBackArrow)"/>
  <text x="401" y="348" class="t muted">preimages travel back to source events</text>
  <text x="44" y="392" class="t small">The function formula p tells us which value is reported. The four pullback checks prove measurability for these chosen structures.</text>

  <rect x="24" y="440" width="872" height="150" rx="14" class="bad"/>
  <text x="44" y="468" class="t h">FAIL: AN EXACT-FACE READOUT ASKS FOR MORE THAN THE SOURCE STRUCTURE RECORDS</text>
  <rect x="44" y="489" width="248" height="70" rx="10" class="panel"/>
  <text x="62" y="515" class="t h">SOURCE STILL USES F</text>
  <text x="62" y="540" class="t body">Only empty, O, E, and Omega</text>
  <path d="M292 524 L398 524" class="arrow" marker-end="url(#measArrow)"/>
  <text x="326" y="510" class="t h">r</text>
  <text x="310" y="550" class="t muted">report exact face</text>
  <rect x="410" y="489" width="196" height="70" rx="10" class="panel"/>
  <text x="428" y="515" class="t h">TARGET EVENT {2}</text>
  <text x="428" y="540" class="t body">Allowed in the full target</text>
  <path d="M410 571 C360 604 260 604 214 566" class="backBad" marker-end="url(#measBadArrow)"/>
  <text x="274" y="582" class="t muted">preimage is {2}</text>
  <rect x="636" y="489" width="240" height="70" rx="10" class="bad"/>
  <text x="654" y="515" class="t h">{2} IS NOT IN F</text>
  <text x="654" y="540" class="t body">So r is not measurable here.</text>
</svg>
