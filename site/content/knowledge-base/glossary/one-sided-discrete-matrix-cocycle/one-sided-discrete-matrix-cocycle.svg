<svg xmlns="http://www.w3.org/2000/svg" width="960" height="800"
     viewBox="0 0 960 800" role="img"
     aria-labelledby="oneSidedCocycleTitle oneSidedCocycleDesc">
  <title id="oneSidedCocycleTitle">A three-state orbit generates an ordered two-step matrix cocycle</title>
  <desc id="oneSidedCocycleDesc">Red advances to green, green to blue, and blue to red. The same generator assigns upper shear U to red, lower shear L to green, and the identity to blue. Starting at red, horizon zero is the identity, horizon one is U, and horizon two is L times U, the matrix with rows one one and one two. Splitting after one step gives an early U block followed by a shifted L block, so L is written on the left. Reversing the order gives a different matrix. Three lower cards contrast state-driven factors with independently supplied factors and state that one-sided time uses only nonnegative indices without requiring invertibility.</desc>
  <rect width="960" height="800" fill="#F7F4F0"/>
  <style>
    .t { font-family: Inter, Arial, Helvetica, sans-serif; fill: #28251F; }
    .title { font-size: 24px; font-weight: 700; }
    .subtitle { font-size: 14px; fill: #514A42; }
    .panelTitle { font-size: 15px; font-weight: 700; letter-spacing: 0.5px; }
    .h { font-size: 15px; font-weight: 700; }
    .body { font-size: 13px; }
    .small { font-size: 13px; fill: #514A42; }
    .tiny { font-size: 11.5px; fill: #514A42; }
    .formula { font-family: Georgia, 'Times New Roman', serif; font-size: 17px; fill: #28251F; }
    .formulaSmall { font-family: Georgia, 'Times New Roman', serif; font-size: 14.5px; fill: #28251F; }
  </style>
  <defs>
    <marker id="cocycleArrow" markerWidth="9" markerHeight="9"
            refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#8B623E"/>
    </marker>
  </defs>

  <text x="28" y="32" class="t title">One base orbit determines every matrix factor</text>
  <text x="28" y="55" class="t subtitle">Concrete calculation, shifted split, and the boundary of one-sided time</text>

  <rect x="24" y="76" width="912" height="188" rx="16"
        fill="#FCFAF7" stroke="#B9AA98" stroke-width="1.5"/>
  <text x="48" y="102" class="t panelTitle">CONCRETE BASE: A THREE-STATE CYCLE</text>
  <text x="912" y="102" text-anchor="end" class="t small">uniform mass 1/3 at each state</text>

  <text x="115" y="126" text-anchor="middle" class="t tiny">TIME 0</text>
  <text x="350" y="126" text-anchor="middle" class="t tiny">TIME 1</text>
  <text x="585" y="126" text-anchor="middle" class="t tiny">TIME 2</text>
  <text x="820" y="126" text-anchor="middle" class="t tiny">TIME 3</text>

  <circle cx="115" cy="158" r="25" fill="#F4DFDA"
          stroke="#9A4D40" stroke-width="2"/>
  <text x="115" y="164" text-anchor="middle" class="t h">r</text>
  <circle cx="350" cy="158" r="25" fill="#E2EDE2"
          stroke="#527657" stroke-width="2"/>
  <text x="350" y="164" text-anchor="middle" class="t h">g</text>
  <circle cx="585" cy="158" r="25" fill="#E2EAF3"
          stroke="#4C6786" stroke-width="2"/>
  <text x="585" y="164" text-anchor="middle" class="t h">b</text>
  <circle cx="820" cy="158" r="25" fill="#F4DFDA"
          stroke="#9A4D40" stroke-width="2"/>
  <text x="820" y="164" text-anchor="middle" class="t h">r</text>

  <line x1="143" y1="158" x2="310" y2="158" stroke="#8B623E" stroke-width="2"/>
  <path d="M310 151 L320 158 L310 165 Z" fill="#8B623E"/>
  <text x="231" y="149" text-anchor="middle" class="t body">T</text>
  <line x1="378" y1="158" x2="545" y2="158" stroke="#8B623E" stroke-width="2"/>
  <path d="M545 151 L555 158 L545 165 Z" fill="#8B623E"/>
  <text x="466" y="149" text-anchor="middle" class="t body">T</text>
  <line x1="613" y1="158" x2="780" y2="158" stroke="#8B623E" stroke-width="2"/>
  <path d="M780 151 L790 158 L780 165 Z" fill="#8B623E"/>
  <text x="701" y="149" text-anchor="middle" class="t body">T</text>

  <rect x="51" y="199" width="128" height="44" rx="9"
        fill="#F4DFDA" stroke="#9A4D40" stroke-width="1.4"/>
  <text x="115" y="216" text-anchor="middle" class="t small">A(r) = U</text>
  <text x="115" y="234" text-anchor="middle" class="t formulaSmall">[[1,1],[0,1]]</text>
  <rect x="286" y="199" width="128" height="44" rx="9"
        fill="#E2EDE2" stroke="#527657" stroke-width="1.4"/>
  <text x="350" y="216" text-anchor="middle" class="t small">A(g) = L</text>
  <text x="350" y="234" text-anchor="middle" class="t formulaSmall">[[1,0],[1,1]]</text>
  <rect x="521" y="199" width="128" height="44" rx="9"
        fill="#E2EAF3" stroke="#4C6786" stroke-width="1.4"/>
  <text x="585" y="216" text-anchor="middle" class="t small">A(b) = I</text>
  <text x="585" y="234" text-anchor="middle" class="t formulaSmall">[[1,0],[0,1]]</text>
  <rect x="756" y="199" width="128" height="44" rx="9"
        fill="#F4DFDA" stroke="#9A4D40" stroke-width="1.4"/>
  <text x="820" y="216" text-anchor="middle" class="t small">A(r) = U again</text>
  <text x="820" y="234" text-anchor="middle" class="t tiny">same state, same factor</text>

  <rect x="24" y="280" width="912" height="172" rx="16"
        fill="#F1EAE1" stroke="#A9825E" stroke-width="1.5"/>
  <text x="48" y="307" class="t panelTitle">FORWARD VALUES: THE NEWEST FACTOR IS WRITTEN ON THE LEFT</text>

  <rect x="48" y="325" width="256" height="100" rx="12"
        fill="#FCFAF7" stroke="#7E756A" stroke-width="1.3"/>
  <text x="176" y="348" text-anchor="middle" class="t small">HORIZON 0: NO FACTOR HAS ACTED</text>
  <text x="176" y="374" text-anchor="middle" class="t formula">Phi(0,r) = I</text>
  <text x="176" y="399" text-anchor="middle" class="t formulaSmall">[[1,0],[0,1]]</text>

  <rect x="352" y="325" width="256" height="100" rx="12"
        fill="#FCFAF7" stroke="#9A4D40" stroke-width="1.3"/>
  <text x="480" y="348" text-anchor="middle" class="t small">HORIZON 1: SAMPLE AT r</text>
  <text x="480" y="374" text-anchor="middle" class="t formula">Phi(1,r) = U</text>
  <text x="480" y="399" text-anchor="middle" class="t formulaSmall">[[1,1],[0,1]]</text>

  <rect x="656" y="325" width="256" height="100" rx="12"
        fill="#FCFAF7" stroke="#527657" stroke-width="1.8"/>
  <text x="784" y="348" text-anchor="middle" class="t small">HORIZON 2: U FIRST, THEN L</text>
  <text x="784" y="374" text-anchor="middle" class="t formula">Phi(2,r) = L x U</text>
  <text x="784" y="399" text-anchor="middle" class="t formulaSmall">[[1,1],[1,2]]</text>
  <text x="784" y="417" text-anchor="middle" class="t tiny">later matrix L sits on the left</text>

  <rect x="24" y="468" width="912" height="142" rx="16"
        fill="#FCFAF7" stroke="#B9AA98" stroke-width="1.5"/>
  <text x="48" y="495" class="t panelTitle">SPLIT AFTER ONE STEP: MOVE THE BASE BEFORE STARTING THE LATER BLOCK</text>

  <rect x="48" y="512" width="218" height="64" rx="11"
        fill="#F4DFDA" stroke="#9A4D40" stroke-width="1.4"/>
  <text x="157" y="534" text-anchor="middle" class="t h">EARLY BLOCK m = 1</text>
  <text x="157" y="558" text-anchor="middle" class="t formulaSmall">r  -- U --&gt;  g</text>

  <line x1="276" y1="544" x2="320" y2="544" stroke="#8B623E" stroke-width="2"/>
  <path d="M320 537 L330 544 L320 551 Z" fill="#8B623E"/>
  <text x="303" y="531" text-anchor="middle" class="t tiny">shift base</text>

  <rect x="340" y="512" width="218" height="64" rx="11"
        fill="#E2EDE2" stroke="#527657" stroke-width="1.4"/>
  <text x="449" y="534" text-anchor="middle" class="t h">LATER BLOCK k = 1</text>
  <text x="449" y="558" text-anchor="middle" class="t formulaSmall">g  -- L --&gt;  b</text>

  <line x1="568" y1="544" x2="600" y2="544" stroke="#8B623E" stroke-width="2"/>
  <path d="M600 537 L610 544 L600 551 Z" fill="#8B623E"/>

  <rect x="620" y="506" width="292" height="76" rx="11"
        fill="#E8EEF4" stroke="#4C6786" stroke-width="1.5"/>
  <text x="766" y="529" text-anchor="middle" class="t formulaSmall">Phi(2,r) = Phi(1,g) x Phi(1,r)</text>
  <text x="766" y="551" text-anchor="middle" class="t formula">= L x U = [[1,1],[1,2]]</text>
  <text x="766" y="572" text-anchor="middle" class="t tiny">later block left; early block right</text>

  <text x="48" y="597" class="t small" style="fill:#8B3A30">ORDER CHECK: U x L = [[2,1],[1,1]] is different, so reversing the factors changes the evolution.</text>

  <rect x="24" y="626" width="912" height="150" rx="16"
        fill="#EFE9E0" stroke="#B9AA98" stroke-width="1.5"/>
  <text x="48" y="653" class="t panelTitle">WHAT THE INTERFACE STORES, AND WHAT IT DOES NOT REQUIRE</text>

  <rect x="48" y="668" width="264" height="84" rx="11"
        fill="#E2EDE2" stroke="#527657" stroke-width="1.5"/>
  <text x="180" y="690" text-anchor="middle" class="t h">STATE-DRIVEN FACTORS</text>
  <text x="180" y="711" text-anchor="middle" class="t formulaSmall">B_j(r) = A(T^j r)</text>
  <text x="180" y="730" text-anchor="middle" class="t small">one T and one A force U, L, I, U, ...</text>
  <text x="180" y="745" text-anchor="middle" class="t tiny">revisiting a state repeats its factor</text>

  <rect x="348" y="668" width="264" height="84" rx="11"
        fill="#FCFAF7" stroke="#7E756A" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="480" y="690" text-anchor="middle" class="t h">ARBITRARY TIME FACTORS</text>
  <text x="480" y="711" text-anchor="middle" class="t formulaSmall">B_0, B_1, B_2, ...</text>
  <text x="480" y="730" text-anchor="middle" class="t small">each factor map may be supplied separately</text>
  <text x="480" y="745" text-anchor="middle" class="t tiny">no orbit relation is stored by this interface</text>

  <rect x="648" y="668" width="264" height="84" rx="11"
        fill="#E8EEF4" stroke="#4C6786" stroke-width="1.5" stroke-dasharray="2 4"/>
  <text x="780" y="690" text-anchor="middle" class="t h">ONE-SIDED BOUNDARY</text>
  <text x="780" y="711" text-anchor="middle" class="t formulaSmall">time = 0, 1, 2, ...</text>
  <text x="780" y="730" text-anchor="middle" class="t small">noninvertible T and singular A are allowed</text>
  <text x="780" y="745" text-anchor="middle" class="t tiny">no backward orbit or negative-time value is stored</text>
</svg>
