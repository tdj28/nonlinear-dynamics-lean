<svg xmlns="http://www.w3.org/2000/svg" width="800" height="540"
     viewBox="0 0 800 540" role="img"
     aria-labelledby="oneSidedCocycleTitle oneSidedCocycleDesc">
  <title id="oneSidedCocycleTitle">One generator sampled along a forward base orbit produces a cocycle</title>
  <desc id="oneSidedCocycleDesc">A top timeline advances from a starting environment through successive forward base states. One generator is evaluated at every visited state, and those sampled matrices form an ordered value with the newest factor on the left. A lower split shows an early block followed by a later block that begins at the shifted environment. The composition strip places the later block on the left and the earlier block on the right.</desc>
  <rect width="800" height="540" fill="#F7F4F0"/>
  <style>
    .t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#2C2924}
    .title{font-size:16px;font-weight:700}
    .h{font-size:13px;font-weight:700}
    .s{font-size:12px}
    .m{font-size:11px;fill:#5A544C}
  </style>
  <defs>
    <marker id="oneSidedCocycleArrow" markerWidth="8" markerHeight="8"
            refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#A67C52"/>
    </marker>
  </defs>

  <text x="24" y="32" class="t title">One generator turns a moving environment into a matrix cocycle</text>
  <text x="24" y="53" class="t m">Forward base time chooses the next matrix factor and the later block's starting state.</text>

  <rect x="24" y="88" width="154" height="78" rx="12"
        fill="#E8F0F7" stroke="#4B6787" stroke-width="1.5"/>
  <text x="101" y="118" text-anchor="middle" class="t h">STARTING</text>
  <text x="101" y="140" text-anchor="middle" class="t h">ENVIRONMENT</text>

  <path d="M180 127 L216 127" fill="none" stroke="#A67C52"
        stroke-width="2.5" marker-end="url(#oneSidedCocycleArrow)"/>

  <rect x="222" y="88" width="154" height="78" rx="12"
        fill="#FBF9F6" stroke="#C4B8A8" stroke-width="1.5"/>
  <text x="299" y="118" text-anchor="middle" class="t h">NEXT BASE</text>
  <text x="299" y="140" text-anchor="middle" class="t h">STATE</text>

  <path d="M378 127 L414 127" fill="none" stroke="#A67C52"
        stroke-width="2.5" marker-end="url(#oneSidedCocycleArrow)"/>

  <rect x="420" y="88" width="154" height="78" rx="12"
        fill="#FBF9F6" stroke="#C4B8A8" stroke-width="1.5"/>
  <text x="497" y="118" text-anchor="middle" class="t h">LATER BASE</text>
  <text x="497" y="140" text-anchor="middle" class="t h">STATE</text>

  <path d="M576 127 L612 127" fill="none" stroke="#A67C52"
        stroke-width="2.5" marker-end="url(#oneSidedCocycleArrow)"/>

  <rect x="618" y="88" width="158" height="78" rx="12"
        fill="#EAF1E5" stroke="#6F8D5E" stroke-width="1.5"/>
  <text x="697" y="118" text-anchor="middle" class="t h">FORWARD TIME</text>
  <text x="697" y="140" text-anchor="middle" class="t m">continues one way</text>

  <path d="M400 168 L400 198" fill="none" stroke="#A67C52"
        stroke-width="2.5" marker-end="url(#oneSidedCocycleArrow)"/>

  <rect x="126" y="204" width="548" height="76" rx="14"
        fill="#F3E8E0" stroke="#A67C52" stroke-width="1.5"/>
  <text x="400" y="234" text-anchor="middle" class="t h">EVALUATE THE SAME MATRIX GENERATOR</text>
  <text x="400" y="258" text-anchor="middle" class="t m">one sampled matrix at every visited environment</text>

  <path d="M400 282 L400 312" fill="none" stroke="#A67C52"
        stroke-width="2.5" marker-end="url(#oneSidedCocycleArrow)"/>

  <rect x="126" y="318" width="548" height="76" rx="14"
        fill="#16243A"/>
  <text x="400" y="348" text-anchor="middle" class="t h"
        style="fill:#FFFDF8">FINITE ORDERED MATRIX VALUE</text>
  <text x="400" y="372" text-anchor="middle" class="t m"
        style="fill:#D9E1EA">the newest sampled factor is written on the left</text>

  <rect x="58" y="430" width="264" height="58" rx="12"
        fill="#E8F0F7" stroke="#4B6787" stroke-width="1.5"/>
  <text x="190" y="455" text-anchor="middle" class="t h">EARLY BLOCK</text>
  <text x="190" y="476" text-anchor="middle" class="t m">begins at the initial environment</text>

  <path d="M324 459 L358 459" fill="none" stroke="#A67C52"
        stroke-width="2.5" marker-end="url(#oneSidedCocycleArrow)"/>

  <rect x="364" y="430" width="378" height="58" rx="12"
        fill="#EAF1E5" stroke="#6F8D5E" stroke-width="1.5"/>
  <text x="553" y="455" text-anchor="middle" class="t h">SHIFTED LATER BLOCK</text>
  <text x="553" y="476" text-anchor="middle" class="t m">begins where the early base orbit ends</text>

  <rect x="132" y="506" width="536" height="24" rx="10"
        fill="#EAF1E5" stroke="#6F8D5E" stroke-width="1.2"/>
  <text x="400" y="523" text-anchor="middle" class="t m">COMPOSITION: LATER BLOCK ON THE LEFT, EARLY BLOCK ON THE RIGHT</text>
</svg>
