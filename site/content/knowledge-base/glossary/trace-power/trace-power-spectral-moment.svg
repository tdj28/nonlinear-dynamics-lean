<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="trace-power-title trace-power-desc">
  <title id="trace-power-title">A two by two trace power computed from entries and eigenvalues</title>
  <desc id="trace-power-desc">The Hermitian matrix A has rows two one and one two. Multiplying A by itself gives rows five four and four five. The trace of A is four and the trace of A squared is ten. The characteristic polynomial factors as lambda minus one times lambda minus three, so the eigenvalues are three and one. Their first powers sum to four and their squares sum to ten. A closed-walk expansion also gives four plus one plus one plus four equals ten. The unnormalized spectral counting measure has second moment ten, while the empirical probability measure divides by dimension two and has second moment five.</desc>
  <defs>
    <pattern id="trace-diagonal-a" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="12" height="12" fill="#f5d89c"/>
      <rect width="4" height="12" fill="#9c642e"/>
    </pattern>
    <pattern id="trace-diagonal-b" width="14" height="14" patternUnits="userSpaceOnUse">
      <rect width="14" height="14" fill="#dcebe3"/>
      <circle cx="4" cy="4" r="2.4" fill="#39715f"/>
      <circle cx="11" cy="11" r="2.4" fill="#39715f"/>
    </pattern>
    <filter id="trace-power-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#332921" flood-opacity="0.13"/>
    </filter>
    <marker id="trace-power-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#715846"/>
    </marker>
    <style>
      .ink { fill: #29231e; }
      .muted { fill: #675c52; }
      .title { font: 700 31px Georgia, serif; }
      .heading { font: 700 21px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .body { font: 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .small { font: 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .equation { font: 700 21px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .cell { font: 700 24px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; }
      .center { text-anchor: middle; }
    </style>
  </defs>

  <rect width="1200" height="900" rx="24" fill="#f7f0e3"/>
  <text x="48" y="52" class="title ink">One trace power, three compatible views</text>
  <text x="48" y="82" class="body muted">Matrix multiplication, closed index walks, and eigenvalue powers all return the same scalar.</text>

  <rect x="40" y="108" width="1120" height="274" rx="22" fill="#fffaf1" stroke="#997859" stroke-width="2" filter="url(#trace-power-shadow)"/>
  <text x="68" y="148" class="heading ink">1. Multiply the matrix, then read the diagonal</text>

  <text x="78" y="235" class="equation ink">A =</text>
  <g aria-label="Matrix A with entries two one one two">
    <rect x="135" y="175" width="74" height="62" rx="8" fill="url(#trace-diagonal-a)" stroke="#87582b" stroke-width="2"/>
    <rect x="209" y="175" width="74" height="62" rx="8" fill="#f1eee8" stroke="#796e64" stroke-width="2"/>
    <rect x="135" y="237" width="74" height="62" rx="8" fill="#f1eee8" stroke="#796e64" stroke-width="2"/>
    <rect x="209" y="237" width="74" height="62" rx="8" fill="url(#trace-diagonal-a)" stroke="#87582b" stroke-width="2"/>
    <text x="172" y="214" class="cell ink">2</text>
    <text x="246" y="214" class="cell ink">1</text>
    <text x="172" y="276" class="cell ink">1</text>
    <text x="246" y="276" class="cell ink">2</text>
  </g>

  <text x="317" y="243" class="equation ink">× A</text>
  <path d="M 370 236 H 438" stroke="#715846" stroke-width="3" marker-end="url(#trace-power-arrow)"/>

  <text x="466" y="235" class="equation ink">A² =</text>
  <g aria-label="Matrix A squared with entries five four four five">
    <rect x="540" y="175" width="74" height="62" rx="8" fill="url(#trace-diagonal-b)" stroke="#356753" stroke-width="2"/>
    <rect x="614" y="175" width="74" height="62" rx="8" fill="#eef3f8" stroke="#46678b" stroke-width="2"/>
    <rect x="540" y="237" width="74" height="62" rx="8" fill="#eef3f8" stroke="#46678b" stroke-width="2"/>
    <rect x="614" y="237" width="74" height="62" rx="8" fill="url(#trace-diagonal-b)" stroke="#356753" stroke-width="2"/>
    <text x="577" y="214" class="cell ink">5</text>
    <text x="651" y="214" class="cell ink">4</text>
    <text x="577" y="276" class="cell ink">4</text>
    <text x="651" y="276" class="cell ink">5</text>
  </g>

  <rect x="742" y="172" width="375" height="132" rx="16" fill="#f3f7f4" stroke="#39715f" stroke-width="2"/>
  <text x="769" y="207" class="heading ink">Diagonal sums</text>
  <text x="769" y="244" class="equation ink">tr(A) = 2 + 2 = 4</text>
  <text x="769" y="281" class="equation ink">tr(A²) = 5 + 5 = 10</text>
  <text x="68" y="344" class="small muted">The hatched diagonal gives the first trace. After multiplication, off-diagonal products enter the dotted diagonal.</text>
  <text x="68" y="369" class="small muted">A is real symmetric, hence Hermitian when viewed as a complex matrix.</text>

  <rect x="40" y="406" width="1120" height="245" rx="22" fill="#fffaf1" stroke="#997859" stroke-width="2" filter="url(#trace-power-shadow)"/>
  <text x="68" y="446" class="heading ink">2. The spectrum and the closed walks agree</text>

  <rect x="68" y="470" width="475" height="100" rx="16" fill="#fff4df" stroke="#96602d" stroke-width="2"/>
  <text x="94" y="503" class="body ink">det(A - λI) = (2 - λ)² - 1</text>
  <text x="94" y="537" class="equation ink">= (λ - 1)(λ - 3)</text>
  <text x="94" y="562" class="small muted">eigenvalues: λ₁ = 3 and λ₂ = 1</text>

  <path d="M 559 519 H 636" stroke="#715846" stroke-width="3" marker-end="url(#trace-power-arrow)"/>

  <rect x="655" y="470" width="462" height="100" rx="16" fill="#f1f5fa" stroke="#46678b" stroke-width="2"/>
  <text x="681" y="503" class="body ink">tr(Aᵏ) = λ₁ᵏ + λ₂ᵏ</text>
  <text x="681" y="537" class="equation ink">k = 1: 3 + 1 = 4</text>
  <text x="881" y="537" class="equation ink">k = 2: 9 + 1 = 10</text>

  <rect x="68" y="589" width="1049" height="42" rx="12" fill="#f3f7f4" stroke="#39715f" stroke-width="2"/>
  <text x="92" y="616" class="body ink">Closed walks at k = 2:  A₀₀A₀₀ + A₀₁A₁₀ + A₁₀A₀₁ + A₁₁A₁₁ = 4 + 1 + 1 + 4 = 10</text>

  <rect x="40" y="675" width="540" height="164" rx="20" fill="#fffaf1" stroke="#997859" stroke-width="2"/>
  <text x="68" y="714" class="heading ink">3a. Spectral counting measure</text>
  <text x="68" y="748" class="body ink">N_A = δ₃ + δ₁ has total mass 2.</text>
  <text x="68" y="784" class="equation ink">∫ x² dN_A = 3² + 1² = 10</text>
  <text x="68" y="816" class="small muted">This equals the ordinary trace power tr(A²).</text>

  <rect x="600" y="675" width="560" height="164" rx="20" fill="#fff2ef" stroke="#ad4036" stroke-width="2"/>
  <text x="628" y="714" class="heading ink">3b. Empirical probability measure</text>
  <text x="628" y="748" class="body ink">L_A = 1/2(δ₃ + δ₁) has total mass 1.</text>
  <text x="628" y="784" class="equation ink">∫ x² dL_A = 1/2 tr(A²) = 5</text>
  <text x="628" y="816" class="small muted">Calling the normalized moment 10 misses the dimension factor.</text>

  <rect x="40" y="856" width="1120" height="24" rx="12" fill="#eadfce"/>
  <text x="600" y="873" class="small ink center">Ordinary trace power = spectral sum. Empirical spectral moment = dimension-normalized spectral sum.</text>
</svg>
