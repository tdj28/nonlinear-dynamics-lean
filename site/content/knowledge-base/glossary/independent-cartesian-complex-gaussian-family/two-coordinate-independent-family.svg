<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="family-example-title family-example-desc">
  <title id="family-example-title">Two independent Cartesian complex Gaussian coordinates and a dependent near miss</title>
  <desc id="family-example-desc">Four independent centered real Gaussian sources, each with variance one half, feed two separate complex coordinates Z one and Z two. Each coordinate has expected squared magnitude one. A joint-event ledger multiplies four sign probabilities one half to obtain one sixteenth. A lower contrast reuses the first two sources to define Z two as i times the conjugate of Z one, giving the same marginal shape but a deterministic relation instead of a product joint law.</desc>
  <defs>
    <marker id="family-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#58666c"/>
    </marker>
    <pattern id="family-independent" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="12" height="12" fill="#dbeaf0"/>
      <rect width="4" height="12" fill="#5f8795"/>
    </pattern>
    <pattern id="family-reused" width="12" height="12" patternUnits="userSpaceOnUse">
      <rect width="12" height="12" fill="#f2ded4"/>
      <circle cx="3" cy="3" r="2" fill="#9b5f45"/>
      <circle cx="9" cy="9" r="2" fill="#9b5f45"/>
    </pattern>
    <filter id="family-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#2c2924" flood-opacity=".14"/>
    </filter>
    <style>
      .t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#292722}
      .title{font-size:27px;font-weight:750}
      .sub{font-size:14px;fill:#5a554e}
      .band{font-size:14px;font-weight:750;letter-spacing:1px}
      .node{font-size:18px;font-weight:750}
      .body{font-size:14px}
      .small{font-size:12px;fill:#56514a}
      .arrow{fill:none;stroke:#58666c;stroke-width:2.4;marker-end:url(#family-arrow)}
      .dash{fill:none;stroke:#9b5f45;stroke-width:2.4;stroke-dasharray:8 7;marker-end:url(#family-arrow)}
    </style>
  </defs>
  <rect width="1200" height="820" rx="28" fill="#f7f1e7"/>
  <text class="t title" x="48" y="48">Coordinate laws are local; independence is global</text>
  <text class="t sub" x="48" y="75">An exact two-coordinate calculation, followed by the dependence trap</text>

  <rect x="34" y="104" width="1132" height="488" rx="24" fill="#eaf1f2" stroke="#7e9fa9" stroke-width="1.6"/>
  <text class="t band" x="58" y="136" fill="#3d6773">PRODUCT CONSTRUCTION · FOUR FRESH REAL SOURCES</text>

  <g filter="url(#family-shadow)">
    <rect x="62" y="164" width="190" height="78" rx="14" fill="url(#family-independent)" stroke="#547b88" stroke-width="2"/>
    <rect x="62" y="264" width="190" height="78" rx="14" fill="url(#family-independent)" stroke="#547b88" stroke-width="2"/>
    <rect x="62" y="384" width="190" height="78" rx="14" fill="url(#family-independent)" stroke="#547b88" stroke-width="2"/>
    <rect x="62" y="484" width="190" height="78" rx="14" fill="url(#family-independent)" stroke="#547b88" stroke-width="2"/>
  </g>
  <text class="t node" x="157" y="194" text-anchor="middle">X₁ ~ N(0, ½)</text>
  <text class="t small" x="157" y="220" text-anchor="middle">fresh real source</text>
  <text class="t node" x="157" y="294" text-anchor="middle">Y₁ ~ N(0, ½)</text>
  <text class="t small" x="157" y="320" text-anchor="middle">fresh real source</text>
  <text class="t node" x="157" y="414" text-anchor="middle">X₂ ~ N(0, ½)</text>
  <text class="t small" x="157" y="440" text-anchor="middle">fresh real source</text>
  <text class="t node" x="157" y="514" text-anchor="middle">Y₂ ~ N(0, ½)</text>
  <text class="t small" x="157" y="540" text-anchor="middle">fresh real source</text>

  <g filter="url(#family-shadow)">
    <rect x="356" y="198" width="260" height="112" rx="18" fill="#fffdfa" stroke="#547b88" stroke-width="2"/>
    <rect x="356" y="416" width="260" height="112" rx="18" fill="#fffdfa" stroke="#547b88" stroke-width="2"/>
  </g>
  <text class="t node" x="486" y="235" text-anchor="middle">Z₁ = X₁ + iY₁</text>
  <text class="t body" x="486" y="266" text-anchor="middle">E[Z₁] = 0</text>
  <text class="t body" x="486" y="290" text-anchor="middle">E|Z₁|² = ½ + ½ = 1</text>
  <text class="t node" x="486" y="453" text-anchor="middle">Z₂ = X₂ + iY₂</text>
  <text class="t body" x="486" y="484" text-anchor="middle">E[Z₂] = 0</text>
  <text class="t body" x="486" y="508" text-anchor="middle">E|Z₂|² = ½ + ½ = 1</text>

  <path class="arrow" d="M252 203 C310 203 310 226 346 236"/>
  <path class="arrow" d="M252 303 C310 303 310 277 346 268"/>
  <path class="arrow" d="M252 423 C310 423 310 446 346 456"/>
  <path class="arrow" d="M252 523 C310 523 310 497 346 488"/>

  <g filter="url(#family-shadow)">
    <rect x="706" y="172" width="420" height="350" rx="20" fill="#fffdfa" stroke="#63845b" stroke-width="2"/>
  </g>
  <text class="t node" x="916" y="210" text-anchor="middle">One joint event uses all four sources</text>
  <text class="t body" x="742" y="253">Re Z₁ &gt; 0</text><text class="t body" x="1005" y="253">probability ½</text>
  <text class="t body" x="742" y="291">Im Z₁ &gt; 0</text><text class="t body" x="1005" y="291">probability ½</text>
  <text class="t body" x="742" y="329">Re Z₂ &gt; 0</text><text class="t body" x="1005" y="329">probability ½</text>
  <text class="t body" x="742" y="367">Im Z₂ &gt; 0</text><text class="t body" x="1005" y="367">probability ½</text>
  <line x1="742" y1="389" x2="1090" y2="389" stroke="#8a8378" stroke-width="1.5"/>
  <text class="t body" x="742" y="424">Mutual independence permits multiplication:</text>
  <text class="t node" x="916" y="466" text-anchor="middle">½ · ½ · ½ · ½ = 1⁄16</text>
  <path class="arrow" d="M616 254 C663 254 663 306 696 317"/>
  <path class="arrow" d="M616 472 C663 472 663 411 696 399"/>

  <rect x="34" y="618" width="1132" height="160" rx="24" fill="#f2e5de" stroke="#a16d53" stroke-width="1.6"/>
  <text class="t band" x="58" y="650" fill="#815039">DEPENDENT NEAR MISS · REUSE THE SAME SOURCES</text>
  <rect x="70" y="674" width="260" height="72" rx="14" fill="url(#family-reused)" stroke="#9b5f45" stroke-width="2"/>
  <text class="t node" x="200" y="703" text-anchor="middle">Z₁ = A + iB</text>
  <text class="t small" x="200" y="728" text-anchor="middle">only two real sources</text>
  <rect x="454" y="674" width="292" height="72" rx="14" fill="#fffdfa" stroke="#9b5f45" stroke-width="2"/>
  <text class="t node" x="600" y="703" text-anchor="middle">Z₂ = B + iA = i·conj(Z₁)</text>
  <text class="t small" x="600" y="728" text-anchor="middle">same marginal shape, deterministic relation</text>
  <rect x="870" y="674" width="250" height="72" rx="14" fill="#f8d8ca" stroke="#9b5f45" stroke-width="2"/>
  <text class="t node" x="995" y="703" text-anchor="middle">not a product law</text>
  <text class="t small" x="995" y="728" text-anchor="middle">marginals alone are insufficient</text>
  <path class="dash" d="M330 710 H444"/><path class="dash" d="M746 710 H860"/>
</svg>
