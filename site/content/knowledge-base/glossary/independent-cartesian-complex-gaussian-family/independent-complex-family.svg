<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400" role="img" aria-labelledby="familyTitle familyDesc">
  <title id="familyTitle">Coordinate laws and family independence determine the product law</title>
  <desc id="familyDesc">Three indexed complex coordinates carry measurable exact laws with two visible variances. A separate mutual-independence statement combines them into one exact finite product law.</desc>
  <rect width="760" height="400" fill="#F7F4F0"/>
  <style>
    .t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#2C2924}
    .title{font-size:15px;font-weight:700}.h{font-size:13px;font-weight:700}
    .s{font-size:12px}.m{font-size:11px;fill:#5A544C}
    .coord{fill:#E8F0F7;stroke:#4B6787;stroke-width:1.6}
    .family{fill:#F3E8E0;stroke:#A67C52;stroke-width:1.7}
    .joint{fill:#EAF1E5;stroke:#6F8D5E;stroke-width:1.8}
    .arrow{fill:none;stroke:#7F786D;stroke-width:2;marker-end:url(#arrow)}
  </style>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#7F786D"/>
    </marker>
  </defs>

  <text x="24" y="28" class="t title">An independent family has a local layer and a global layer</text>
  <text x="24" y="48" class="t m">Exact coordinate laws do not replace the mutual-independence obligation.</text>

  <rect x="24" y="78" width="235" height="60" rx="11" class="coord"/>
  <text x="42" y="102" class="t h">Complex coordinate one</text>
  <text x="42" y="122" class="t s">ordinary measurable sample map</text>

  <rect x="24" y="151" width="235" height="60" rx="11" class="coord"/>
  <text x="42" y="175" class="t h">Complex coordinate two</text>
  <text x="42" y="195" class="t s">ordinary measurable sample map</text>

  <rect x="24" y="224" width="235" height="60" rx="11" class="coord"/>
  <text x="42" y="248" class="t h">Every further coordinate</text>
  <text x="42" y="268" class="t s">the same measurable interface</text>

  <path d="M259 108 C278 108 278 112 290 112" class="arrow"/>
  <path d="M259 181 C278 181 278 134 290 134" class="arrow"/>
  <path d="M259 254 C278 254 278 156 290 156" class="arrow"/>

  <rect x="294" y="84" width="185" height="96" rx="12" class="coord"/>
  <text x="316" y="112" class="t h">Exact coordinate laws</text>
  <text x="316" y="137" class="t s">one law at every index</text>
  <text x="316" y="159" class="t m">means and variances retained</text>

  <rect x="294" y="208" width="185" height="96" rx="12" class="family"/>
  <text x="316" y="236" class="t h">Mutual independence</text>
  <text x="316" y="261" class="t s">one statement across</text>
  <text x="316" y="283" class="t m">all complex blocks</text>

  <path d="M479 132 C516 132 516 163 544 168" class="arrow"/>
  <path d="M479 256 C516 256 516 225 544 220" class="arrow"/>

  <rect x="548" y="132" width="188" height="128" rx="12" class="joint"/>
  <text x="570" y="162" class="t h">Exact product law</text>
  <text x="570" y="187" class="t s">one finite coordinate</text>
  <text x="570" y="207" class="t s">vector with all laws</text>
  <text x="570" y="236" class="t m">normalization retained</text>

  <rect x="24" y="330" width="712" height="46" rx="10" fill="#EAF1E5" stroke="#6F8D5E" stroke-width="1.4"/>
  <text x="44" y="358" class="t s">Coordinate facts plus mutual independence earn the joint product law; neither layer alone is enough.</text>
</svg>
