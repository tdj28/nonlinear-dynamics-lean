<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1000"
     viewBox="0 0 1200 1000" role="img"
     aria-labelledby="logEnvelopeTitle logEnvelopeDesc">
  <title id="logEnvelopeTitle">A four-state log-positive integrability envelope</title>
  <desc id="logEnvelopeDesc">Four equally weighted states rotate in a cycle. Their one-step scalar matrix norms are one half, four, one quarter, and eight. In units of log two, their log-positive values are zero, two, zero, and three. The true four-step product has norm four and log-positive value two log two. The orbit envelope is five log two, and the one-step probability average is five fourths log two.</desc>
  <defs>
    <pattern id="contractPattern" width="12" height="12" patternUnits="userSpaceOnUse">
      <rect width="12" height="12" fill="#EAF1F8"/>
      <path d="M0 12L12 0" stroke="#91ABC2" stroke-width="2"/>
    </pattern>
    <pattern id="expandPattern" width="12" height="12" patternUnits="userSpaceOnUse">
      <rect width="12" height="12" fill="#E9F3E7"/>
      <path d="M0 0L12 12M-3 3L3 9M9-3L15 3" stroke="#86A783" stroke-width="2"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0 0L10 4L0 8Z" fill="#665E54"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#574F46" flood-opacity="0.16"/>
    </filter>
    <style>
      .title { font: 700 36px Georgia, serif; fill: #2E2924; }
      .subtitle { font: 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #635A50; }
      .panelTitle { font: 700 22px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #2E2924; }
      .state { font: 700 20px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #2E2924; }
      .formula { font: 700 22px Georgia, serif; fill: #2E2924; }
      .body { font: 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #463F38; }
      .small { font: 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #665E54; }
      .result { font: 700 28px Georgia, serif; fill: #2F5D4A; }
      .warn { font: 700 24px Georgia, serif; fill: #8E443A; }
    </style>
  </defs>

  <rect width="1200" height="1000" fill="#F8F4EC"/>
  <text x="60" y="58" class="title">Expansion survives; contraction becomes zero</text>
  <text x="60" y="88" class="subtitle">A finite probability model makes the product, envelope, and integrability ledger exact.</text>

  <rect x="50" y="115" width="1100" height="350" rx="20" fill="#FFFDFC"
        stroke="#B98554" stroke-width="2" filter="url(#shadow)"/>
  <text x="75" y="153" class="panelTitle">1. Rotate four equal atoms and read one generator at each state</text>

  <g transform="translate(78 178)">
    <rect width="220" height="190" rx="16" fill="url(#contractPattern)" stroke="#557A99" stroke-width="2"/>
    <text x="18" y="34" class="state">state 0 · mass 1/4</text>
    <text x="18" y="78" class="formula">||A(0)|| = 1/2</text>
    <text x="18" y="119" class="body">log⁺ coefficient</text>
    <text x="18" y="157" class="warn">max(0, −1) = 0</text>
  </g>

  <path d="M305 273H340" stroke="#665E54" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="315" y="259" class="small">T</text>

  <g transform="translate(348 178)">
    <rect width="220" height="190" rx="16" fill="url(#expandPattern)" stroke="#56805D" stroke-width="2"/>
    <text x="18" y="34" class="state">state 1 · mass 1/4</text>
    <text x="18" y="78" class="formula">||A(1)|| = 4</text>
    <text x="18" y="119" class="body">log⁺ coefficient</text>
    <text x="18" y="157" class="result">max(0, 2) = 2</text>
  </g>

  <path d="M575 273H610" stroke="#665E54" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="585" y="259" class="small">T</text>

  <g transform="translate(618 178)">
    <rect width="220" height="190" rx="16" fill="url(#contractPattern)" stroke="#557A99" stroke-width="2"/>
    <text x="18" y="34" class="state">state 2 · mass 1/4</text>
    <text x="18" y="78" class="formula">||A(2)|| = 1/4</text>
    <text x="18" y="119" class="body">log⁺ coefficient</text>
    <text x="18" y="157" class="warn">max(0, −2) = 0</text>
  </g>

  <path d="M845 273H880" stroke="#665E54" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="855" y="259" class="small">T</text>

  <g transform="translate(888 178)">
    <rect width="220" height="190" rx="16" fill="url(#expandPattern)" stroke="#56805D" stroke-width="2"/>
    <text x="18" y="34" class="state">state 3 · mass 1/4</text>
    <text x="18" y="78" class="formula">||A(3)|| = 8</text>
    <text x="18" y="119" class="body">log⁺ coefficient</text>
    <text x="18" y="157" class="result">max(0, 3) = 3</text>
  </g>

  <path d="M998 377C998 430 188 430 188 378" fill="none" stroke="#665E54"
        stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow)"/>
  <text x="493" y="425" class="small">T returns state 3 to state 0; equal masses are only permuted</text>

  <rect x="50" y="495" width="530" height="300" rx="20" fill="#FFFDFC"
        stroke="#557A99" stroke-width="2" filter="url(#shadow)"/>
  <text x="75" y="535" class="panelTitle">2. Keep the actual four-step product</text>
  <text x="75" y="587" class="formula">1/2 · 4 · 1/4 · 8 = 4</text>
  <text x="75" y="633" class="body">the exponent sum is −1 + 2 − 2 + 3 = 2</text>
  <rect x="75" y="665" width="480" height="75" rx="13" fill="#EAF1F8" stroke="#557A99"/>
  <text x="315" y="712" text-anchor="middle" class="result">P₄(0) = log 4 = 2 log 2</text>
  <text x="75" y="770" class="small">Contraction remains visible inside the product before log⁺ is applied.</text>

  <rect x="620" y="495" width="530" height="300" rx="20" fill="#FFFDFC"
        stroke="#56805D" stroke-width="2" filter="url(#shadow)"/>
  <text x="645" y="535" class="panelTitle">3. Add the clipped one-step values</text>
  <text x="645" y="587" class="formula">0 + 2 + 0 + 3 = 5</text>
  <text x="645" y="633" class="body">coefficients are measured in exact units of log 2</text>
  <rect x="645" y="665" width="480" height="75" rx="13" fill="#E9F3E7" stroke="#56805D"/>
  <text x="885" y="712" text-anchor="middle" class="result">P₄(0) = 2 log 2  &lt;=  S₄(0) = 5 log 2</text>
  <text x="645" y="770" class="small">The simpler envelope is larger because negative log terms were erased.</text>

  <rect x="50" y="830" width="1100" height="120" rx="18" fill="#F2EAF6"
        stroke="#7C6191" stroke-width="2"/>
  <text x="75" y="870" class="panelTitle">4. The one-step integrability certificate is a finite weighted sum</text>
  <text x="75" y="912" class="formula">∫ P₁ dμ = 1/4 · (0 + 2 log 2 + 0 + 3 log 2) = 5/4 log 2</text>
  <text x="75" y="940" class="small">Finite horizon only: this proves no signed-log integrability, asymptotic limit, or Lyapunov exponent.</text>
</svg>
