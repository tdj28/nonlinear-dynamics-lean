<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500"
     viewBox="0 0 800 500" role="img"
     aria-labelledby="traceMomentTitle traceMomentDesc">
  <title id="traceMomentTitle">A finite matrix trace moment requires an integrability gate</title>
  <desc id="traceMomentDesc">A matrix law feeds a measurable trace-power observable. A separate integrability proof licenses the complex Bochner integral. Only after that gate may the integral be read as a finite expectation. Exact finite identities sit at the end of this chain, while spectral limits remain a later topic.</desc>
  <rect width="800" height="500" fill="#F7F4F0"/>
  <style>
    .t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#2C2924}
    .title{font-size:15px;font-weight:700}
    .h{font-size:13px;font-weight:700}
    .s{font-size:12px}
    .m{font-size:11px;fill:#5A544C}
  </style>
  <defs>
    <marker id="traceMomentArrow" markerWidth="8" markerHeight="8" refX="7" refY="4"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#A67C52"/>
    </marker>
  </defs>

  <text x="24" y="30" class="t title">An observable becomes a moment only after analysis</text>
  <text x="24" y="50" class="t m">Measurability opens the question; integrability makes the finite expectation meaningful.</text>

  <rect x="24" y="92" width="168" height="132" rx="12" fill="#E8F0F7" stroke="#4B6787" stroke-width="1.5"/>
  <text x="108" y="124" text-anchor="middle" class="t h">MATRIX LAW</text>
  <text x="108" y="156" text-anchor="middle" class="t s">probability on finite</text>
  <text x="108" y="178" text-anchor="middle" class="t s">complex matrices</text>
  <text x="108" y="207" text-anchor="middle" class="t m">normalization fixed first</text>

  <path d="M194 158 L222 158" fill="none" stroke="#A67C52" stroke-width="2" marker-end="url(#traceMomentArrow)"/>

  <rect x="228" y="92" width="168" height="132" rx="12" fill="#FBF9F6" stroke="#C4B8A8" stroke-width="1.5"/>
  <text x="312" y="124" text-anchor="middle" class="t h">TRACE-POWER</text>
  <text x="312" y="146" text-anchor="middle" class="t h">OBSERVABLE</text>
  <text x="312" y="178" text-anchor="middle" class="t s">measurable complex value</text>
  <text x="312" y="207" text-anchor="middle" class="t m">not yet a finite moment</text>

  <path d="M398 158 L426 158" fill="none" stroke="#A67C52" stroke-width="2" marker-end="url(#traceMomentArrow)"/>

  <rect x="432" y="92" width="168" height="132" rx="12" fill="#F3E8E0" stroke="#A67C52" stroke-width="1.5"/>
  <text x="516" y="124" text-anchor="middle" class="t h">INTEGRABILITY</text>
  <text x="516" y="156" text-anchor="middle" class="t s">measurable plus finite</text>
  <text x="516" y="178" text-anchor="middle" class="t s">integral of the norm</text>
  <text x="516" y="207" text-anchor="middle" class="t m">a separate theorem</text>

  <path d="M602 158 L630 158" fill="none" stroke="#A67C52" stroke-width="2" marker-end="url(#traceMomentArrow)"/>

  <rect x="636" y="92" width="140" height="132" rx="12" fill="#EAF1E5" stroke="#6F8D5E" stroke-width="1.5"/>
  <text x="706" y="124" text-anchor="middle" class="t h">EXPECTATION</text>
  <text x="706" y="156" text-anchor="middle" class="t s">complex Bochner</text>
  <text x="706" y="178" text-anchor="middle" class="t s">integral of the</text>
  <text x="706" y="198" text-anchor="middle" class="t s">observable</text>

  <rect x="72" y="278" width="300" height="112" rx="12" fill="#EAF1E5" stroke="#6F8D5E" stroke-width="1.5"/>
  <text x="222" y="309" text-anchor="middle" class="t h">CHECKED FINITE IDENTITY</text>
  <text x="222" y="340" text-anchor="middle" class="t s">one fixed law and one fixed dimension</text>
  <text x="222" y="365" text-anchor="middle" class="t m">exact after every obligation is discharged</text>

  <rect x="428" y="278" width="300" height="112" rx="12" fill="#EDE8E1" stroke="#7F786D" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="578" y="309" text-anchor="middle" class="t h">LATER SPECTRAL QUESTIONS</text>
  <text x="578" y="340" text-anchor="middle" class="t s">eigenvalue laws and large-size limits</text>
  <text x="578" y="365" text-anchor="middle" class="t m">not implied by a first finite moment</text>

  <path d="M706 226 C706 252,338 246,258 276" fill="none" stroke="#A67C52" stroke-width="2" marker-end="url(#traceMomentArrow)"/>
  <path d="M372 334 L426 334" fill="none" stroke="#A89B8C" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#traceMomentArrow)"/>

  <rect x="104" y="424" width="592" height="52" rx="12" fill="#16243A"/>
  <text x="400" y="456" text-anchor="middle" class="t h" style="fill:#FFFDF8">THE INTEGRABILITY PROOF IS PART OF THE MATHEMATICS</text>
</svg>
