<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="title desc">
  <title id="title">A translation flow grid</title>
  <desc id="desc">Three horizontal trajectories cross columns for time zero, time s, and time s plus t. Arrows show that consecutive steps and a combined step have the same endpoints.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#315f63"/></marker></defs>
  <rect width="960" height="480" rx="24" fill="#fbf8f0"/>
  <text x="54" y="58" font-family="Georgia,serif" font-size="30" fill="#23343b">One time action, many initial states</text>
  <g font-family="Arial,sans-serif" font-size="18" fill="#7a4d69"><text x="118" y="105">identity</text><text x="445" y="105">after s</text><text x="755" y="105">after s + t</text></g>
  <g stroke="#d6c9b5" stroke-width="2"><line x1="160" y1="126" x2="160" y2="398"/><line x1="480" y1="126" x2="480" y2="398"/><line x1="800" y1="126" x2="800" y2="398"/></g>
  <g stroke="#315f63" stroke-width="5" marker-end="url(#arrow)"><line x1="174" y1="185" x2="466" y2="185"/><line x1="494" y1="185" x2="786" y2="185"/><line x1="174" y1="265" x2="466" y2="265"/><line x1="494" y1="265" x2="786" y2="265"/><line x1="174" y1="345" x2="466" y2="345"/><line x1="494" y1="345" x2="786" y2="345"/></g>
  <g fill="#b24b40"><circle cx="160" cy="185" r="10"/><circle cx="480" cy="185" r="10"/><circle cx="800" cy="185" r="10"/><circle cx="160" cy="265" r="10"/><circle cx="480" cy="265" r="10"/><circle cx="800" cy="265" r="10"/><circle cx="160" cy="345" r="10"/><circle cx="480" cy="345" r="10"/><circle cx="800" cy="345" r="10"/></g>
  <text x="265" y="435" font-family="Arial,sans-serif" font-size="20" fill="#23343b">two steps = one step with the summed time</text>
</svg>
