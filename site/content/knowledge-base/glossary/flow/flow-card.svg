<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Flow</title>
  <desc id="desc">A glossary card shows identity at time zero and two consecutive time steps combining into one summed step.</desc>
  <rect width="1200" height="630" fill="#f1e9da"/><rect x="38" y="38" width="1124" height="554" rx="28" fill="#fbf8f0" stroke="#315f63" stroke-width="4"/>
  <text x="76" y="104" font-family="Arial,sans-serif" font-size="21" letter-spacing="3" fill="#7a4d69">GLOSSARY · CONTINUOUS TIME</text>
  <text x="76" y="194" font-family="Georgia,serif" font-size="72" fill="#23343b">Flow</text><text x="76" y="252" font-family="Georgia,serif" font-size="30" fill="#315f63">identity + composition + joint continuity</text>
  <line x1="105" y1="380" x2="1050" y2="380" stroke="#315f63" stroke-width="6"/><g fill="#b24b40"><circle cx="160" cy="380" r="15"/><circle cx="515" cy="380" r="15"/><circle cx="950" cy="380" r="15"/></g><g font-family="Arial,sans-serif" font-size="20" fill="#23343b"><text x="118" y="430">time 0</text><text x="482" y="430">time s</text><text x="880" y="430">time s + t</text></g>
  <text x="76" y="548" font-family="Arial,sans-serif" font-size="19" fill="#7a4d69">real-time action · orbit through every point · professional review pending</text>
</svg>
