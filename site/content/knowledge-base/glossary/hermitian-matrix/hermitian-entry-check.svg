<svg xmlns="http://www.w3.org/2000/svg" width="920" height="640"
     viewBox="0 0 920 640" role="img"
     aria-labelledby="hermitianTitle hermitianDesc">
  <title id="hermitianTitle">Checking a Hermitian matrix by its diagonal and reflected entry pair</title>
  <desc id="hermitianDesc">The matrix with rows two, one plus three i and one minus three i, minus one passes the Hermitian test. Its diagonal entries are real, and its two off-diagonal entries are complex conjugates. A near-miss matrix repeats one plus three i in both off-diagonal positions and fails. The passing matrix has characteristic polynomial lambda squared minus lambda minus twelve and real eigenvalues four and minus three.</desc>
  <rect width="920" height="640" fill="#F7F4F0"/>
  <style>
    .t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#2C2924}
    .title{font-size:17px;font-weight:700}
    .h{font-size:13px;font-weight:700;letter-spacing:.35px}
    .body{font-size:13px}
    .small{font-size:12px}
    .muted{font-size:11px;fill:#5A544C}
    .panel{fill:#FBF9F6;stroke:#A89C8E;stroke-width:1.6}
    .diag{fill:#E8F0F7;stroke:#4B6787;stroke-width:1.7}
    .upper{fill:#F3E8E0;stroke:#95653E;stroke-width:1.7}
    .lower{fill:url(#hermitianHatch);stroke:#95653E;stroke-width:1.7}
    .good{fill:#EAF1E5;stroke:#5F7F50;stroke-width:1.8}
    .badPanel{fill:#FBF9F6;stroke:#8A3E38;stroke-width:1.8}
    .bad{fill:url(#nearMissHatch);stroke:#8A3E38;stroke-width:1.8}
    .gold{fill:#F5EDD9;stroke:#9A772F;stroke-width:1.6}
    .arrow{fill:none;stroke:#95653E;stroke-width:2.1}
    .badArrow{fill:none;stroke:#8A3E38;stroke-width:2.1;stroke-dasharray:6 4}
  </style>
  <defs>
    <pattern id="hermitianHatch" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#F3E8E0"/>
      <path d="M-2 2 L2 -2 M0 8 L8 0 M6 10 L10 6" stroke="#D2B69E" stroke-width="1"/>
    </pattern>
    <pattern id="nearMissHatch" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#F7E9E7"/>
      <path d="M-2 2 L2 -2 M0 8 L8 0 M6 10 L10 6" stroke="#CF9C97" stroke-width="1"/>
    </pattern>
    <marker id="hermitianArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#95653E"/>
    </marker>
    <marker id="nearMissArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#8A3E38"/>
    </marker>
  </defs>

  <text x="24" y="30" class="t title">Hermitian means real diagonal plus conjugate-reflected off-diagonal entries</text>
  <text x="24" y="51" class="t muted">The same entry-by-entry check explains both a passing matrix and a near miss before the spectral theorem enters.</text>

  <rect x="24" y="76" width="872" height="290" rx="14" class="panel"/>
  <text x="44" y="103" class="t h">PASS: CHECK H ENTRY BY ENTRY</text>

  <text x="54" y="150" class="t h">H =</text>
  <rect x="100" y="123" width="112" height="86" rx="9" class="diag"/>
  <rect x="212" y="123" width="112" height="86" rx="9" class="upper"/>
  <rect x="100" y="209" width="112" height="86" rx="9" class="lower"/>
  <rect x="212" y="209" width="112" height="86" rx="9" class="diag"/>
  <text x="150" y="174" class="t title">2</text>
  <text x="244" y="174" class="t title">1+3i</text>
  <text x="126" y="260" class="t title">1-3i</text>
  <text x="252" y="260" class="t title">-1</text>
  <path d="M268 199 C350 199 350 219 268 219" class="arrow" marker-end="url(#hermitianArrow)"/>
  <text x="334" y="213" class="t small">conjugate</text>
  <text x="100" y="320" class="t muted">Solid clay and hatched clay mark one reflected conjugate pair.</text>

  <rect x="422" y="123" width="438" height="172" rx="12" class="good"/>
  <text x="442" y="150" class="t h">THREE CHECKS</text>
  <text x="442" y="180" class="t body">1. top-left: 2 has imaginary part 0</text>
  <text x="442" y="210" class="t body">2. bottom-right: -1 has imaginary part 0</text>
  <text x="442" y="240" class="t body">3. conjugate(1+3i) = 1-3i</text>
  <text x="442" y="273" class="t h">THEREFORE Hᴴ = H</text>
  <text x="422" y="320" class="t muted">The diagonal checks are the i = j cases of the same conjugate-reflection rule.</text>

  <rect x="24" y="390" width="420" height="220" rx="14" class="badPanel"/>
  <text x="44" y="418" class="t h">NEAR MISS: COPYING IS NOT CONJUGATING</text>
  <text x="54" y="463" class="t h">K =</text>
  <rect x="100" y="436" width="92" height="66" rx="9" class="diag"/>
  <rect x="192" y="436" width="118" height="66" rx="9" class="upper"/>
  <rect x="100" y="502" width="92" height="66" rx="9" class="bad"/>
  <rect x="192" y="502" width="118" height="66" rx="9" class="diag"/>
  <text x="140" y="477" class="t h">2</text>
  <text x="225" y="477" class="t h">1+3i</text>
  <text x="127" y="543" class="t h">1+3i</text>
  <text x="241" y="543" class="t h">-1</text>
  <path d="M246 493 C232 510 210 518 184 523" class="badArrow" marker-end="url(#nearMissArrow)"/>
  <text x="324" y="475" class="t small">conjugate required:</text>
  <text x="324" y="498" class="t h">1-3i</text>
  <text x="324" y="528" class="t small">not the copied</text>
  <text x="324" y="549" class="t h">1+3i</text>
  <text x="44" y="590" class="t muted">Kᴴ differs from K, so K is not Hermitian.</text>

  <rect x="468" y="390" width="428" height="220" rx="14" class="gold"/>
  <text x="488" y="418" class="t h">SPECTRAL CHECK FOR THE PASSING MATRIX</text>
  <text x="488" y="451" class="t body">trace(H) = 2 + (-1) = 1</text>
  <text x="488" y="480" class="t body">det(H) = 2(-1) - (1+3i)(1-3i) = -12</text>
  <text x="488" y="513" class="t body">characteristic polynomial:</text>
  <text x="514" y="540" class="t h">λ² − λ − 12 = (λ − 4)(λ + 3)</text>
  <text x="488" y="572" class="t h">EIGENVALUES: 4 AND -3, BOTH REAL</text>
  <text x="488" y="594" class="t muted">This example illustrates, but does not prove, the general spectral theorem.</text>
</svg>
