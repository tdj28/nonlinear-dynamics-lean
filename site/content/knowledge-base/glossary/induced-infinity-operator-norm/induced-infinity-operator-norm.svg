<svg xmlns="http://www.w3.org/2000/svg" width="800" height="490"
     viewBox="0 0 800 490" role="img"
     aria-labelledby="infinityNormTitle infinityNormDesc">
  <title id="infinityNormTitle">From matrix rows to a bound on vector amplification</title>
  <desc id="infinityNormDesc">Four boxes form a left-to-right process. First take the absolute sizes of all matrix entries. Then add the sizes within each row. Next keep the largest row total. Finally use that total to bound the supremum size of every output vector. A lower note contrasts this row-action geometry with an entrywise Euclidean geometry.</desc>
  <rect width="800" height="490" fill="#F7F4F0"/>
  <style>
    .t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#2C2924}
    .title{font-size:16px;font-weight:700}
    .h{font-size:12px;font-weight:700}
    .s{font-size:11px}
    .m{font-size:11px;fill:#5A544C}
  </style>
  <defs>
    <marker id="infinityNormArrow" markerWidth="8" markerHeight="8" refX="7" refY="4"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#A67C52"/>
    </marker>
  </defs>

  <text x="24" y="32" class="t title">One row controls one output coordinate</text>
  <text x="24" y="53" class="t m">The largest absolute row budget controls every coordinate simultaneously.</text>

  <rect x="24" y="100" width="158" height="126" rx="12" fill="#E8F0F7" stroke="#4B6787" stroke-width="1.5"/>
  <text x="103" y="135" text-anchor="middle" class="t h">ABSOLUTE</text>
  <text x="103" y="156" text-anchor="middle" class="t h">ENTRY SIZES</text>
  <text x="103" y="186" text-anchor="middle" class="t s">discard phase and sign</text>
  <text x="103" y="207" text-anchor="middle" class="t m">retain magnitude</text>

  <path d="M184 163 L214 163" fill="none" stroke="#A67C52" stroke-width="2.5" marker-end="url(#infinityNormArrow)"/>

  <rect x="220" y="100" width="158" height="126" rx="12" fill="#F3E8E0" stroke="#A67C52" stroke-width="1.5"/>
  <text x="299" y="135" text-anchor="middle" class="t h">ADD WITHIN</text>
  <text x="299" y="156" text-anchor="middle" class="t h">EACH ROW</text>
  <text x="299" y="186" text-anchor="middle" class="t s">one total per output</text>
  <text x="299" y="207" text-anchor="middle" class="t m">triangle-inequality budget</text>

  <path d="M380 163 L410 163" fill="none" stroke="#A67C52" stroke-width="2.5" marker-end="url(#infinityNormArrow)"/>

  <rect x="416" y="100" width="158" height="126" rx="12" fill="#EAF1E5" stroke="#6F8D5E" stroke-width="1.5"/>
  <text x="495" y="135" text-anchor="middle" class="t h">KEEP THE</text>
  <text x="495" y="156" text-anchor="middle" class="t h">LARGEST TOTAL</text>
  <text x="495" y="186" text-anchor="middle" class="t s">worst output row</text>
  <text x="495" y="207" text-anchor="middle" class="t m">one matrix bound</text>

  <path d="M576 163 L606 163" fill="none" stroke="#A67C52" stroke-width="2.5" marker-end="url(#infinityNormArrow)"/>

  <rect x="612" y="100" width="164" height="126" rx="12" fill="#16243A"/>
  <text x="694" y="135" text-anchor="middle" class="t h" style="fill:#FFFDF8">BOUND EVERY</text>
  <text x="694" y="156" text-anchor="middle" class="t h" style="fill:#FFFDF8">OUTPUT STATE</text>
  <text x="694" y="186" text-anchor="middle" class="t s" style="fill:#FFFDF8">supremum size</text>
  <text x="694" y="207" text-anchor="middle" class="t m" style="fill:#D9E1EA">uniform amplification</text>

  <rect x="74" y="282" width="652" height="126" rx="14" fill="#FBF9F6" stroke="#C4B8A8" stroke-width="1.5"/>
  <text x="400" y="317" text-anchor="middle" class="t h">WHY THIS IS AN OPERATOR NORM</text>
  <text x="400" y="348" text-anchor="middle" class="t s">INPUT SUPREMUM SIZE ENTERS ONCE; THE ROW BUDGET LIMITS OUTPUT SUPREMUM SIZE</text>
  <text x="400" y="378" text-anchor="middle" class="t m">successive matrix actions multiply these worst-case budgets</text>

  <text x="24" y="454" class="t m">This row-action geometry is different from summing squared sizes across every matrix entry.</text>
</svg>
