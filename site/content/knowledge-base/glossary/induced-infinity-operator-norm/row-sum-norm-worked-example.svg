<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1000"
     viewBox="0 0 1200 1000" role="img"
     aria-labelledby="rowSumNormTitle rowSumNormDesc">
  <title id="rowSumNormTitle">A worked induced infinity operator norm calculation</title>
  <desc id="rowSumNormDesc">For the two by two real matrix with rows one minus two and three four, absolute row sums are three and seven, so the induced infinity norm is seven. Absolute column sums are four and six, and using six is shown as a near-miss. The vector two minus one gives output four two and verifies four is at most fourteen. The vector one one gives output minus one seven and attains equality. A final strip connects submultiplicativity to finite product growth and notes that the empty-index matrix norm is zero.</desc>
  <defs>
    <pattern id="rowOne" width="12" height="12" patternUnits="userSpaceOnUse">
      <rect width="12" height="12" fill="#EAF1F8"/>
      <path d="M0 0H12M0 6H12M0 12H12" stroke="#7691AC" stroke-width="1"/>
    </pattern>
    <pattern id="rowTwo" width="12" height="12" patternUnits="userSpaceOnUse"
             patternTransform="rotate(45)">
      <rect width="12" height="12" fill="#EAF4E7"/>
      <path d="M0 0V12" stroke="#55805F" stroke-width="3"/>
    </pattern>
    <pattern id="warning" width="10" height="10" patternUnits="userSpaceOnUse"
             patternTransform="rotate(45)">
      <rect width="10" height="10" fill="#FFF0EE"/>
      <path d="M0 0V10" stroke="#D14B40" stroke-width="3"/>
    </pattern>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#372D25" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#695A4C"/>
    </marker>
    <style>
      .ink { fill: #2E2924; font-family: Inter, Arial, Helvetica, sans-serif; }
      .serif { fill: #2E2924; font-family: Georgia, 'Times New Roman', serif; }
      .title { font-size: 34px; font-weight: 700; }
      .subtitle { fill: #685E55; font-size: 17px; }
      .panel-title { font-size: 22px; font-weight: 700; }
      .label { font-size: 17px; font-weight: 700; }
      .body { font-size: 16px; }
      .small { fill: #685E55; font-size: 14px; }
      .math { font-size: 20px; font-weight: 600; }
    </style>
  </defs>

  <rect width="1200" height="1000" rx="24" fill="#F7F0E4"/>
  <text x="48" y="54" class="serif title">Rows control output coordinates</text>
  <text x="48" y="84" class="ink subtitle">Absolute row sums give the exact worst-case amplification of the vector supremum norm.</text>

  <g filter="url(#shadow)">
    <rect x="40" y="112" width="1120" height="328" rx="20" fill="#FFFDFC" stroke="#A67B50" stroke-width="2"/>
  </g>
  <text x="68" y="151" class="ink panel-title">1. Compute the matrix norm</text>
  <g transform="translate(82 194)" class="ink math">
    <path d="M16 0H0V142H16M242 0H258V142H242" fill="none" stroke="#3E3934" stroke-width="3"/>
    <rect x="24" y="12" width="98" height="52" rx="9" fill="url(#rowOne)" stroke="#527496"/>
    <rect x="132" y="12" width="98" height="52" rx="9" fill="url(#rowOne)" stroke="#527496"/>
    <rect x="24" y="78" width="98" height="52" rx="9" fill="url(#rowTwo)" stroke="#55805F"/>
    <rect x="132" y="78" width="98" height="52" rx="9" fill="url(#rowTwo)" stroke="#55805F"/>
    <text x="73" y="46" text-anchor="middle">1</text>
    <text x="181" y="46" text-anchor="middle">−2</text>
    <text x="73" y="112" text-anchor="middle">3</text>
    <text x="181" y="112" text-anchor="middle">4</text>
  </g>
  <path d="M360 266H418" fill="none" stroke="#695A4C" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="389" y="249" text-anchor="middle" class="ink small">absolute values</text>

  <g class="ink">
    <rect x="436" y="190" width="286" height="78" rx="12" fill="url(#rowOne)" stroke="#527496" stroke-width="1.5"/>
    <text x="579" y="220" text-anchor="middle" class="label">row 0 budget</text>
    <text x="579" y="250" text-anchor="middle" class="math">|1| + |−2| = 3</text>
    <rect x="436" y="284" width="286" height="96" rx="12" fill="url(#rowTwo)" stroke="#55805F" stroke-width="2"/>
    <text x="579" y="316" text-anchor="middle" class="label">row 1 is largest</text>
    <text x="579" y="347" text-anchor="middle" class="math">|3| + |4| = 7</text>
    <text x="579" y="369" text-anchor="middle" class="small">therefore ‖A‖∞ = 7</text>
    <rect x="758" y="190" width="374" height="190" rx="14" fill="url(#warning)" stroke="#C84C43" stroke-width="1.5"/>
    <text x="945" y="222" text-anchor="middle" class="label">Near-miss: summing columns</text>
    <text x="945" y="257" text-anchor="middle" class="math">column sums: 4 and 6</text>
    <text x="945" y="291" text-anchor="middle" class="body">maximum column sum = 6</text>
    <text x="945" y="323" text-anchor="middle" class="body">but 6 is not ‖A‖∞</text>
    <text x="945" y="355" text-anchor="middle" class="small">it belongs to the induced one-norm convention</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="40" y="474" width="548" height="256" rx="20" fill="#FFFDFC" stroke="#527496" stroke-width="2"/>
    <rect x="612" y="474" width="548" height="256" rx="20" fill="#FFFDFC" stroke="#55805F" stroke-width="2"/>
  </g>
  <text x="68" y="514" class="ink panel-title">2. Verify the inequality on one vector</text>
  <text x="640" y="514" class="ink panel-title">3. Choose a vector that attains equality</text>
  <g class="ink">
    <rect x="68" y="544" width="198" height="62" rx="12" fill="#F6EFE3" stroke="#A67B50"/>
    <text x="167" y="582" text-anchor="middle" class="math">x = (2, −1)</text>
    <path d="M280 575H326" fill="none" stroke="#695A4C" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="342" y="544" width="218" height="62" rx="12" fill="url(#rowOne)" stroke="#527496"/>
    <text x="451" y="582" text-anchor="middle" class="math">Ax = (4, 2)</text>
    <text x="68" y="642" class="body">‖x‖∞ = 2 and ‖Ax‖∞ = 4</text>
    <text x="68" y="681" class="math">4 ≤ 7 · 2 = 14</text>
    <text x="68" y="710" class="small">valid bound, with slack because x is not worst-case</text>

    <rect x="640" y="544" width="198" height="62" rx="12" fill="#F6EFE3" stroke="#A67B50"/>
    <text x="739" y="582" text-anchor="middle" class="math">x* = (1, 1)</text>
    <path d="M852 575H898" fill="none" stroke="#695A4C" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="914" y="544" width="218" height="62" rx="12" fill="url(#rowTwo)" stroke="#55805F"/>
    <text x="1023" y="582" text-anchor="middle" class="math">Ax* = (−1, 7)</text>
    <text x="640" y="642" class="body">‖x*‖∞ = 1 and ‖Ax*‖∞ = 7</text>
    <text x="640" y="681" class="math">7 = 7 · 1</text>
    <text x="640" y="710" class="small">signs align the largest row, so the bound is sharp</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="40" y="762" width="1120" height="176" rx="20" fill="#FFFDFC" stroke="#80629B" stroke-width="2"/>
  </g>
  <text x="68" y="802" class="ink panel-title">4. Multiply amplification budgets along a product</text>
  <g class="ink">
    <rect x="68" y="826" width="282" height="70" rx="12" fill="#F2ECF8" stroke="#80629B"/>
    <text x="209" y="856" text-anchor="middle" class="math">‖AB‖∞ ≤ ‖A‖∞ ‖B‖∞</text>
    <text x="209" y="881" text-anchor="middle" class="small">submultiplicativity</text>
    <path d="M366 861H420" fill="none" stroke="#695A4C" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="438" y="826" width="424" height="70" rx="12" fill="#F2ECF8" stroke="#80629B"/>
    <text x="650" y="856" text-anchor="middle" class="math">‖Ak−1 ··· A₀ x‖∞ ≤ (∏j ‖Aj‖∞) ‖x‖∞</text>
    <text x="650" y="881" text-anchor="middle" class="small">finite product growth envelope</text>
    <rect x="880" y="826" width="252" height="70" rx="12" fill="#F6EFE3" stroke="#A67B50"/>
    <text x="1006" y="853" text-anchor="middle" class="label">Empty index type</text>
    <text x="1006" y="880" text-anchor="middle" class="small">unique matrix norm = 0</text>
  </g>

  <rect x="40" y="960" width="1120" height="24" rx="9" fill="#F6EFE3" stroke="#A67B50"/>
  <text x="600" y="978" text-anchor="middle" class="ink small">The project asks for a nonempty coordinate type in its normalized finite-product norm theorems.</text>
</svg>
