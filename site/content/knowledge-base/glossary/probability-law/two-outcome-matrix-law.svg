<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520"
     viewBox="0 0 900 520" role="img"
     aria-labelledby="probLawTitle probLawDesc">
  <title id="probLawTitle">A two-outcome random matrix and its probability law</title>
  <desc id="probLawDesc">The source outcome omega 0 has probability one quarter and maps to matrix A0, while omega 1 has probability three quarters and maps to matrix A1. The target law assigns the same masses to those matrices. A trace-zero event contains only A0, so its probability under the law is one quarter.</desc>
  <rect width="900" height="520" fill="#F7F4F0"/>
  <style>
    .t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#2C2924}
    .title{font-size:17px;font-weight:700}
    .h{font-size:13px;font-weight:700;letter-spacing:.4px}
    .body{font-size:13px}
    .small{font-size:12px}
    .muted{font-size:11px;fill:#5A544C}
    .source{fill:#E8F0F7;stroke:#4B6787;stroke-width:1.6}
    .target{fill:#EAF1E5;stroke:#5F7F50;stroke-width:1.6}
    .matrix{fill:#FBF9F6;stroke:#8C8174;stroke-width:1.4}
    .selected{fill:#F3E8E0;stroke:#95653E;stroke-width:1.8}
    .excluded{fill:url(#probLawHatch);stroke:#5F5952;stroke-width:1.6}
    .arrow{fill:none;stroke:#95653E;stroke-width:2.1}
  </style>
  <defs>
    <pattern id="probLawHatch" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#F3F0EB"/>
      <path d="M-2 2 L2 -2 M0 8 L8 0 M6 10 L10 6" stroke="#B8AFA5" stroke-width="1"/>
    </pattern>
    <marker id="probLawArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#95653E"/>
    </marker>
  </defs>

  <text x="24" y="30" class="t title">One random matrix, viewed on its source and on its value space</text>
  <text x="24" y="51" class="t muted">The pushforward keeps probability mass and forgets the names of the source outcomes.</text>

  <rect x="24" y="76" width="220" height="258" rx="14" class="source"/>
  <text x="44" y="102" class="t h">SOURCE OUTCOMES</text>
  <text x="44" y="121" class="t muted">Probability space Omega</text>
  <rect x="44" y="143" width="180" height="68" rx="10" class="matrix"/>
  <text x="60" y="169" class="t body">outcome omega_0</text>
  <text x="60" y="193" class="t h">mass = 1/4</text>
  <rect x="44" y="231" width="180" height="68" rx="10" class="matrix"/>
  <text x="60" y="257" class="t body">outcome omega_1</text>
  <text x="60" y="281" class="t h">mass = 3/4</text>
  <text x="44" y="322" class="t muted">Unequal source masses are allowed.</text>

  <text x="262" y="145" class="t muted">map X</text>
  <path d="M244 177 C264 177 276 163 296 163" class="arrow" marker-end="url(#probLawArrow)"/>
  <path d="M244 265 C264 265 276 253 296 253" class="arrow" marker-end="url(#probLawArrow)"/>

  <rect x="304" y="76" width="270" height="258" rx="14" fill="#FBF9F6" stroke="#A89C8E" stroke-width="1.6"/>
  <text x="324" y="102" class="t h">MATRIX VALUES</text>
  <text x="324" y="121" class="t muted">The measurable value space</text>
  <rect x="324" y="141" width="230" height="76" rx="10" class="matrix"/>
  <text x="342" y="166" class="t h">A0</text>
  <text x="387" y="163" class="t body">[ 1   0 ]</text>
  <text x="387" y="187" class="t body">[ 0  -1 ]</text>
  <text x="480" y="178" class="t small">trace = 0</text>
  <rect x="324" y="231" width="230" height="76" rx="10" class="matrix"/>
  <text x="342" y="256" class="t h">A1</text>
  <text x="387" y="253" class="t body">[ 2   0 ]</text>
  <text x="387" y="277" class="t body">[ 0   0 ]</text>
  <text x="480" y="268" class="t small">trace = 2</text>

  <path d="M574 206 L620 206" class="arrow" marker-end="url(#probLawArrow)"/>

  <rect x="628" y="76" width="248" height="258" rx="14" class="target"/>
  <text x="648" y="102" class="t h">LAW ON MATRIX SPACE</text>
  <text x="648" y="121" class="t muted">Same total mass, new locations</text>
  <rect x="648" y="143" width="52" height="54" rx="7" class="selected"/>
  <rect x="700" y="143" width="156" height="54" rx="7" class="source"/>
  <text x="663" y="166" class="t h">A0</text>
  <text x="659" y="185" class="t small">1/4</text>
  <text x="764" y="166" class="t h">A1</text>
  <text x="760" y="185" class="t small">3/4</text>
  <text x="648" y="225" class="t body">law(X) assigns:</text>
  <text x="668" y="250" class="t body">mass 1/4 to A0</text>
  <text x="668" y="275" class="t body">mass 3/4 to A1</text>
  <text x="648" y="311" class="t muted">It does not remember omega_0 or omega_1.</text>

  <rect x="24" y="360" width="852" height="132" rx="14" fill="#FBF9F6" stroke="#A89C8E" stroke-width="1.6"/>
  <text x="44" y="386" class="t h">CHECK THE EVENT B = {MATRICES WITH TRACE ZERO}</text>
  <rect x="44" y="405" width="294" height="60" rx="10" class="selected"/>
  <text x="62" y="430" class="t body">trace(A0) = 0</text>
  <text x="62" y="451" class="t h">IN B: contributes 1/4</text>
  <rect x="354" y="405" width="294" height="60" rx="10" class="excluded"/>
  <text x="372" y="430" class="t body">trace(A1) = 2</text>
  <text x="372" y="451" class="t h">OUTSIDE B: contributes 0</text>
  <path d="M656 435 L691 435" class="arrow" marker-end="url(#probLawArrow)"/>
  <rect x="704" y="405" width="152" height="60" rx="10" class="target"/>
  <text x="724" y="430" class="t body">law(X)(B)</text>
  <text x="752" y="453" class="t h">= 1/4</text>
</svg>
