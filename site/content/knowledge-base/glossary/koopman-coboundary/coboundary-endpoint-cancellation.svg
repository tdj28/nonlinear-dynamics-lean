<svg xmlns="http://www.w3.org/2000/svg" width="760" height="410"
     viewBox="0 0 760 410" role="img"
     aria-labelledby="coboundaryCancelTitle coboundaryCancelDesc">
  <title id="coboundaryCancelTitle">A forward coboundary sum leaves only two endpoints</title>
  <desc id="coboundaryCancelDesc">The initial potential value appears once with a minus sign and remains. Interior potential values each appear once with a plus sign and once with a minus sign, so they cancel in pairs. The final potential value appears once with a plus sign and remains. A footer explains that bounded endpoints divided by a growing positive horizon tend to zero, while horizon zero is valid but vacuous.</desc>
  <rect width="760" height="410" fill="#F7F4F0"/>
  <style>
    .t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#2C2924}
    .title{font-size:15px;font-weight:700}
    .h{font-size:13px;font-weight:700}
    .s{font-size:12px}
    .m{font-size:11px;fill:#5A544C}
    .neutral{fill:#FBF9F6;stroke:#C4B8A8;stroke-width:1.5}
    .data{fill:#E8F0F7;stroke:#4B6787;stroke-width:1.5}
    .kept{fill:#EAF1E5;stroke:#6F8D5E;stroke-width:1.5}
    .warn{fill:#F3E8E0;stroke:#A67C52;stroke-width:1.5}
  </style>
  <text x="24" y="28" class="t title">A coboundary sum keeps endpoints and cancels the interior</text>
  <text x="24" y="48" class="t m">Each one-step change contributes the next potential value positively and the current value negatively.</text>

  <rect class="warn" x="24" y="74" width="184" height="214" rx="12"/>
  <text x="45" y="105" class="t h">INITIAL ENDPOINT</text>
  <circle cx="116" cy="161" r="38" fill="#FBF9F6" stroke="#A67C52" stroke-width="1.7"/>
  <text x="91" y="157" class="t s">starting</text>
  <text x="88" y="174" class="t s">potential</text>
  <rect class="neutral" x="48" y="222" width="136" height="42" rx="8"/>
  <text x="66" y="240" class="t s">one minus sign</text>
  <text x="94" y="256" class="t m">remains</text>

  <path d="M214 181 L246 181" fill="none" stroke="#A67C52" stroke-width="2.5"/>
  <polygon points="253,181 241,174 241,188" fill="#A67C52"/>

  <rect class="data" x="258" y="74" width="244" height="214" rx="12"/>
  <text x="315" y="105" class="t h">INTERIOR VALUES</text>
  <rect class="neutral" x="282" y="132" width="196" height="48" rx="8"/>
  <text x="302" y="153" class="t s">arrives with a plus sign</text>
  <text x="299" y="170" class="t s">and with a minus sign</text>
  <path d="M315 205 L445 205" fill="none" stroke="#7F786D" stroke-width="2"/>
  <path d="M315 193 L445 217 M315 217 L445 193" fill="none" stroke="#A67C52" stroke-width="2.5"/>
  <rect class="kept" x="302" y="231" width="156" height="36" rx="8"/>
  <text x="330" y="254" class="t h">PAIR CANCELS</text>

  <path d="M508 181 L540 181" fill="none" stroke="#A67C52" stroke-width="2.5"/>
  <polygon points="547,181 535,174 535,188" fill="#A67C52"/>

  <rect class="kept" x="552" y="74" width="184" height="214" rx="12"/>
  <text x="579" y="105" class="t h">FINAL ENDPOINT</text>
  <circle cx="644" cy="161" r="38" fill="#FBF9F6" stroke="#6F8D5E" stroke-width="1.7"/>
  <text x="625" y="157" class="t s">final</text>
  <text x="616" y="174" class="t s">potential</text>
  <rect class="neutral" x="576" y="222" width="136" height="42" rx="8"/>
  <text x="599" y="240" class="t s">one plus sign</text>
  <text x="622" y="256" class="t m">remains</text>

  <rect class="warn" x="24" y="306" width="712" height="34" rx="9"/>
  <text x="42" y="328" class="t m">Horizon zero: the empty sum equals the zero endpoint difference. The identity is valid but vacuous.</text>
  <rect class="kept" x="24" y="350" width="712" height="40" rx="10"/>
  <text x="44" y="375" class="t s">Bounded endpoint remainder divided by a growing positive horizon tends pointwise to zero.</text>
</svg>
