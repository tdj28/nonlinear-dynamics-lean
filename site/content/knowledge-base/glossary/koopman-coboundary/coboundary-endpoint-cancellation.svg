<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700"
     viewBox="0 0 1000 700" role="img"
     aria-labelledby="coboundaryNumericTitle coboundaryNumericDesc">
  <title id="coboundaryNumericTitle">Exact endpoint cancellation on a four-state cycle</title>
  <desc id="coboundaryNumericDesc">States zero, one, two, and three have potential values 3, -2, 1, and 0. Forward next-minus-current changes are -5, 3, -1, and 3. Starting at state zero, horizons zero through five have sums 0, -5, -2, -3, 0, -5 and totalized averages 0, -5, -1, -1, 0, -1. At horizon three the sum -3 equals final potential 0 minus initial potential 3. Horizon zero is an empty equality. Reversing the subtraction gives horizon-three sum 3 and the opposite endpoint order.</desc>
  <rect width="1000" height="700" fill="#F7F4F0"/>
  <defs>
    <marker id="arrowClay" markerWidth="8" markerHeight="8" refX="7" refY="4"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#A67C52"/>
    </marker>
  </defs>
  <style>
    .t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#2C2924}
    .title{font-size:18px;font-weight:700}
    .h{font-size:14px;font-weight:700}
    .s{font-size:12px}
    .m{font-size:11px;fill:#5A544C}
    .tiny{font-size:10px;fill:#5A544C}
    .panel{fill:#FBF9F6;stroke:#C4B8A8;stroke-width:1.5}
    .state{fill:#E8F0F7;stroke:#4B6787;stroke-width:1.5}
    .kept{fill:#EAF1E5;stroke:#6F8D5E;stroke-width:1.5}
    .warn{fill:#F3E8E0;stroke:#A67C52;stroke-width:1.5}
    .rule{stroke:#D9D0C4;stroke-width:1}
    .arrow{fill:none;stroke:#A67C52;stroke-width:2.2;marker-end:url(#arrowClay)}
  </style>

  <text x="24" y="32" class="t title">A four-cycle turns a long sum into one endpoint difference</text>
  <text x="24" y="55" class="t m">Toy values are exact: each forward change is next potential minus current potential.</text>

  <rect class="panel" x="24" y="76" width="952" height="166" rx="12"/>
  <text x="44" y="101" class="t h">One lap around the cycle</text>

  <rect class="state" x="44" y="116" width="174" height="78" rx="10"/>
  <text x="61" y="142" class="t h">STATE 0</text>
  <text x="61" y="166" class="t s">potential = 3</text>
  <text x="61" y="184" class="t m">starting point</text>

  <path class="arrow" d="M224 154 L267 154"/>
  <text x="232" y="140" class="t h">-5</text>

  <rect class="state" x="278" y="116" width="174" height="78" rx="10"/>
  <text x="295" y="142" class="t h">STATE 1</text>
  <text x="295" y="166" class="t s">potential = -2</text>
  <text x="295" y="184" class="t m">after 1 step</text>

  <path class="arrow" d="M458 154 L501 154"/>
  <text x="466" y="140" class="t h">+3</text>

  <rect class="state" x="512" y="116" width="174" height="78" rx="10"/>
  <text x="529" y="142" class="t h">STATE 2</text>
  <text x="529" y="166" class="t s">potential = 1</text>
  <text x="529" y="184" class="t m">after 2 steps</text>

  <path class="arrow" d="M692 154 L735 154"/>
  <text x="700" y="140" class="t h">-1</text>

  <rect class="state" x="746" y="116" width="174" height="78" rx="10"/>
  <text x="763" y="142" class="t h">STATE 3</text>
  <text x="763" y="166" class="t s">potential = 0</text>
  <text x="763" y="184" class="t m">after 3 steps</text>

  <rect class="kept" x="44" y="204" width="876" height="26" rx="7"/>
  <text x="62" y="222" class="t s">Return step: state 3 to state 0 changes potential 0 to 3, so the fourth forward change is +3.</text>

  <rect class="panel" x="24" y="258" width="600" height="230" rx="12"/>
  <text x="44" y="285" class="t h">Starting at state 0: exact prefix ledger</text>
  <text x="44" y="306" class="t tiny">HORIZON</text>
  <text x="122" y="306" class="t tiny">CHANGES INCLUDED</text>
  <text x="420" y="306" class="t tiny">SUM</text>
  <text x="507" y="306" class="t tiny">AVERAGE</text>
  <line class="rule" x1="44" y1="313" x2="604" y2="313"/>

  <text x="64" y="334" class="t s">0</text>
  <text x="122" y="334" class="t s">empty</text>
  <text x="425" y="334" class="t s">0</text>
  <text x="523" y="334" class="t s">0</text>
  <line class="rule" x1="44" y1="341" x2="604" y2="341"/>

  <text x="64" y="362" class="t s">1</text>
  <text x="122" y="362" class="t s">-5</text>
  <text x="420" y="362" class="t s">-5</text>
  <text x="518" y="362" class="t s">-5</text>
  <line class="rule" x1="44" y1="369" x2="604" y2="369"/>

  <text x="64" y="390" class="t s">2</text>
  <text x="122" y="390" class="t s">-5 + 3</text>
  <text x="420" y="390" class="t s">-2</text>
  <text x="518" y="390" class="t s">-1</text>
  <line class="rule" x1="44" y1="397" x2="604" y2="397"/>

  <text x="64" y="418" class="t s">3</text>
  <text x="122" y="418" class="t s">-5 + 3 - 1</text>
  <text x="420" y="418" class="t s">-3</text>
  <text x="518" y="418" class="t s">-1</text>
  <line class="rule" x1="44" y1="425" x2="604" y2="425"/>

  <text x="64" y="446" class="t s">4</text>
  <text x="122" y="446" class="t s">-5 + 3 - 1 + 3</text>
  <text x="425" y="446" class="t s">0</text>
  <text x="523" y="446" class="t s">0</text>
  <line class="rule" x1="44" y1="453" x2="604" y2="453"/>

  <text x="64" y="474" class="t s">5</text>
  <text x="122" y="474" class="t s">-5 + 3 - 1 + 3 - 5</text>
  <text x="420" y="474" class="t s">-5</text>
  <text x="518" y="474" class="t s">-1</text>

  <rect class="kept" x="644" y="258" width="332" height="230" rx="12"/>
  <text x="664" y="285" class="t h">Endpoint check at horizon 3</text>
  <rect class="panel" x="664" y="303" width="292" height="50" rx="8"/>
  <text x="680" y="324" class="t s">Start: state 0, potential 3</text>
  <text x="680" y="343" class="t s">After 3 steps: state 3, potential 0</text>
  <text x="664" y="380" class="t h">Forward changes</text>
  <text x="796" y="380" class="t s">-5 + 3 - 1 = -3</text>
  <text x="664" y="407" class="t h">Endpoints</text>
  <text x="796" y="407" class="t s">0 - 3 = -3</text>
  <text x="664" y="434" class="t h">Average</text>
  <text x="796" y="434" class="t s">-3 / 3 = -1</text>
  <rect class="panel" x="664" y="451" width="292" height="25" rx="7"/>
  <text x="679" y="468" class="t m">Interior potential values cancel in pairs.</text>

  <rect class="warn" x="24" y="506" width="466" height="118" rx="12"/>
  <text x="44" y="533" class="t h">Boundary: horizon 0</text>
  <text x="44" y="555" class="t s">No change is sampled, so the empty sum is 0.</text>
  <text x="44" y="576" class="t s">After 0 steps the state is still state 0.</text>
  <text x="44" y="597" class="t s">Endpoint: potential 3 minus potential 3 = 0.</text>
  <text x="44" y="616" class="t m">The totalized average is 0. Valid, but no positive-time information.</text>

  <rect class="warn" x="510" y="506" width="466" height="118" rx="12"/>
  <text x="530" y="533" class="t h">Near-miss: reverse subtraction</text>
  <text x="530" y="555" class="t s">Reverse changes: +5, -3, +1, -3.</text>
  <text x="530" y="576" class="t s">First 3 sum: 5 - 3 + 1 = +3.</text>
  <text x="530" y="597" class="t s">Correct endpoint: initial 3 minus final 0 = +3.</text>
  <text x="530" y="616" class="t m">Using final minus initial would give -3 and the wrong sign.</text>

  <rect class="kept" x="24" y="642" width="952" height="38" rx="10"/>
  <text x="44" y="666" class="t s">The endpoint numerator stays bounded; dividing it by a growing positive horizon sends every orbit average to 0.</text>
</svg>
