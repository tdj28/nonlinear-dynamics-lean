<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="980"
     viewBox="0 0 1200 980" role="img"
     aria-labelledby="parityFeketeTitle parityFeketeDesc">
  <title id="parityFeketeTitle">A matrix cocycle whose normalized integrated growth alternates toward rate two</title>
  <desc id="parityFeketeDesc">On a one-point probability space, a constant two by two matrix has even powers equal to scalar identities and odd powers equal to scalar copies of the generator. Its integrated log-positive sequence is two n plus the parity of n. A table gives values from zero through six. A plot shows normalized values three, two, seven thirds, two, eleven fifths, and two, with even horizons exactly on the infimum and limit line at two. A lower strip distinguishes the sample envelope, raw integral, subadditive sequence, positive-horizon infimum, and deterministic rate.</desc>
  <defs>
    <pattern id="parityDots" width="10" height="10" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#315B73" opacity="0.32"/>
    </pattern>
    <pattern id="paritySlashes" width="10" height="10" patternUnits="userSpaceOnUse"
             patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#995B39" stroke-width="2" opacity="0.3"/>
    </pattern>
    <marker id="parityArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#9A774E"/>
    </marker>
    <style>
      .t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#202B34}
      .title{font-size:27px;font-weight:750}
      .sub{font-size:15px;fill:#53616C}
      .h{font-size:18px;font-weight:750}
      .label{font-size:13px;font-weight:750;letter-spacing:.35px}
      .body{font-size:14px}
      .small{font-size:12px;fill:#53616C}
      .math{font-family:"STIX Two Text","Times New Roman",serif;font-size:20px;fill:#162936}
      .mathBig{font-family:"STIX Two Text","Times New Roman",serif;font-size:24px;font-weight:700;fill:#162936}
      .mono{font-family:"SFMono-Regular",Consolas,monospace;font-size:13px;fill:#253844}
    </style>
  </defs>

  <rect width="1200" height="980" fill="#F7F5F0"/>
  <rect x="32" y="28" width="1136" height="82" rx="18" fill="#E7EEF1" stroke="#315B73" stroke-width="1.5"/>
  <text x="62" y="66" class="t title">A rate can converge without decreasing at every step</text>
  <text x="62" y="92" class="t sub">One constant matrix produces an exact parity wobble: 3, 2, 7/3, 2, 11/5, 2, ...</text>

  <!-- Matrix and parity-power calculation. -->
  <rect x="32" y="138" width="440" height="356" rx="18" fill="#FFFDF9" stroke="#9A774E" stroke-width="1.5"/>
  <rect x="32" y="138" width="440" height="50" rx="18" fill="url(#parityDots)"/>
  <text x="54" y="170" class="t h">One-point probability cocycle</text>
  <text x="54" y="214" class="t label">CONSTANT GENERATOR</text>
  <text x="252" y="254" text-anchor="middle" class="t mathBig">A = [ 0   e³ ]</text>
  <text x="252" y="286" text-anchor="middle" class="t mathBig">    [ e    0 ]</text>
  <text x="54" y="322" class="t body">A = e²M,  M² = I,  ||M||∞ = e</text>
  <line x1="54" y1="342" x2="450" y2="342" stroke="#D5C7B4"/>
  <rect x="54" y="362" width="180" height="90" rx="12" fill="#E9F1E5" stroke="#5E7954"/>
  <text x="144" y="389" text-anchor="middle" class="t label">EVEN n</text>
  <text x="144" y="419" text-anchor="middle" class="t math">||Aⁿ||∞ = e²ⁿ</text>
  <text x="144" y="442" text-anchor="middle" class="t small">parity cost 0</text>
  <rect x="250" y="362" width="200" height="90" rx="12" fill="#F5E9E2" stroke="#995B39"/>
  <text x="350" y="389" text-anchor="middle" class="t label">ODD n</text>
  <text x="350" y="419" text-anchor="middle" class="t math">||Aⁿ||∞ = e²ⁿ⁺¹</text>
  <text x="350" y="442" text-anchor="middle" class="t small">parity cost 1</text>
  <text x="54" y="480" class="t mathBig">I(n) = 2n + (n mod 2)</text>

  <!-- Exact table. -->
  <rect x="500" y="138" width="668" height="356" rx="18" fill="#FFFDF9" stroke="#B8AC9C" stroke-width="1.5"/>
  <text x="526" y="170" class="t h">Integrate, then divide by positive time</text>
  <text x="526" y="195" class="t small">The one outcome has mass one, so the integral equals the displayed envelope.</text>
  <rect x="526" y="216" width="616" height="42" rx="8" fill="#162936"/>
  <text x="558" y="242" class="t label" style="fill:#FFFDF8">n</text>
  <text x="675" y="242" text-anchor="middle" class="t label" style="fill:#FFFDF8">||Aⁿ||∞</text>
  <text x="828" y="242" text-anchor="middle" class="t label" style="fill:#FFFDF8">I(n)</text>
  <text x="1010" y="242" text-anchor="middle" class="t label" style="fill:#FFFDF8">I(n)/n</text>

  <g class="t body">
    <rect x="526" y="266" width="616" height="31" fill="#F2EEE7"/>
    <text x="558" y="287">0</text><text x="675" y="287" text-anchor="middle">1</text><text x="828" y="287" text-anchor="middle">0</text><text x="1010" y="287" text-anchor="middle">0 by total division; excluded</text>
    <text x="558" y="326">1</text><text x="675" y="326" text-anchor="middle">e³</text><text x="828" y="326" text-anchor="middle">3</text><text x="1010" y="326" text-anchor="middle">3</text>
    <rect x="526" y="336" width="616" height="31" fill="#E9F1E5"/>
    <text x="558" y="357">2</text><text x="675" y="357" text-anchor="middle">e⁴</text><text x="828" y="357" text-anchor="middle">4</text><text x="1010" y="357" text-anchor="middle">2</text>
    <text x="558" y="396">3</text><text x="675" y="396" text-anchor="middle">e⁷</text><text x="828" y="396" text-anchor="middle">7</text><text x="1010" y="396" text-anchor="middle">7/3</text>
    <rect x="526" y="406" width="616" height="31" fill="#E9F1E5"/>
    <text x="558" y="427">4</text><text x="675" y="427" text-anchor="middle">e⁸</text><text x="828" y="427" text-anchor="middle">8</text><text x="1010" y="427" text-anchor="middle">2</text>
    <text x="558" y="466">5</text><text x="675" y="466" text-anchor="middle">e¹¹</text><text x="828" y="466" text-anchor="middle">11</text><text x="1010" y="466" text-anchor="middle">11/5</text>
  </g>
  <text x="1132" y="484" text-anchor="end" class="t small">At n=6: e¹², 12, 2</text>

  <!-- Exact normalized-value plot. -->
  <rect x="32" y="522" width="1136" height="244" rx="18" fill="#FFFDF9" stroke="#B8AC9C" stroke-width="1.5"/>
  <text x="58" y="558" class="t h">Positive-horizon ratios and their infimum</text>
  <line x1="102" y1="708" x2="1122" y2="708" stroke="#53616C" stroke-width="1.5"/>
  <line x1="102" y1="596" x2="102" y2="708" stroke="#53616C" stroke-width="1.5"/>
  <line x1="102" y1="680" x2="1122" y2="680" stroke="#5E7954" stroke-width="3" stroke-dasharray="8 6"/>
  <text x="92" y="684" text-anchor="end" class="t small">2</text>
  <text x="92" y="604" text-anchor="end" class="t small">3</text>
  <text x="1116" y="620" text-anchor="end" class="t label">INFIMUM AND LIMIT = 2</text>
  <polyline points="180,600 350,680 520,653 690,680 860,664 1030,680"
            fill="none" stroke="#315B73" stroke-width="3"/>
  <g fill="#315B73" stroke="#FFFDF9" stroke-width="3">
    <circle cx="180" cy="600" r="8"/><circle cx="350" cy="680" r="8"/>
    <circle cx="520" cy="653" r="8"/><circle cx="690" cy="680" r="8"/>
    <circle cx="860" cy="664" r="8"/><circle cx="1030" cy="680" r="8"/>
  </g>
  <g class="t small" text-anchor="middle">
    <text x="180" y="584">3</text><text x="350" y="664">2</text>
    <text x="520" y="637">7/3</text><text x="690" y="664">2</text>
    <text x="860" y="648">11/5</text><text x="1030" y="664">2</text>
    <text x="180" y="732">n=1</text><text x="350" y="732">n=2</text>
    <text x="520" y="732">n=3</text><text x="690" y="732">n=4</text>
    <text x="860" y="732">n=5</text><text x="1030" y="732">n=6</text>
  </g>
  <text x="58" y="752" class="t small">Odd ratios are 2 + 1/n; every even ratio is exactly 2. Convergence does not require monotone decrease.</text>

  <!-- Concept-to-formal pipeline. -->
  <rect x="32" y="794" width="1136" height="154" rx="18" fill="#162936"/>
  <text x="58" y="826" class="t h" style="fill:#FFFDF8">The checked order of operations</text>
  <rect x="58" y="844" width="188" height="68" rx="11" fill="#E5EEF4"/>
  <text x="152" y="870" text-anchor="middle" class="t label">ENVELOPE</text>
  <text x="152" y="894" text-anchor="middle" class="t math">P(n,ω)</text>
  <path d="M248 878 L282 878" stroke="#D2B37C" stroke-width="3" marker-end="url(#parityArrow)"/>
  <rect x="288" y="844" width="188" height="68" rx="11" fill="#F3E8E0"/>
  <text x="382" y="870" text-anchor="middle" class="t label">RAW INTEGRAL</text>
  <text x="382" y="894" text-anchor="middle" class="t math">I(n)=∫P(n,ω)dμ</text>
  <path d="M478 878 L512 878" stroke="#D2B37C" stroke-width="3" marker-end="url(#parityArrow)"/>
  <rect x="518" y="844" width="188" height="68" rx="11" fill="#E9F1E5"/>
  <text x="612" y="870" text-anchor="middle" class="t label">SUBADDITIVE</text>
  <text x="612" y="894" text-anchor="middle" class="t math">I(m+n) ≤ I(m)+I(n)</text>
  <path d="M708 878 L742 878" stroke="#D2B37C" stroke-width="3" marker-end="url(#parityArrow)"/>
  <rect x="748" y="844" width="188" height="68" rx="11" fill="#FFFDF9"/>
  <text x="842" y="870" text-anchor="middle" class="t label">POSITIVE INFIMUM</text>
  <text x="842" y="894" text-anchor="middle" class="t math">inf n≥1 I(n)/n</text>
  <path d="M938 878 L972 878" stroke="#D2B37C" stroke-width="3" marker-end="url(#parityArrow)"/>
  <rect x="978" y="844" width="164" height="68" rx="11" fill="#315B73" stroke="#D2B37C"/>
  <rect x="978" y="844" width="164" height="68" rx="11" fill="url(#paritySlashes)"/>
  <text x="1060" y="870" text-anchor="middle" class="t label" style="fill:#FFFDF8">FEKETE RATE</text>
  <text x="1060" y="896" text-anchor="middle" class="t mathBig" style="fill:#FFFDF8">γ = 2</text>
  <text x="58" y="934" class="t small" style="fill:#C5D0D6">On a probability space the raw integral may be called an expectation. Without mass one, it is not automatically an expectation.</text>
</svg>
