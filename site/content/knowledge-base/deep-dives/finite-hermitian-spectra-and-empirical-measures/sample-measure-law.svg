<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800"
     viewBox="0 0 1200 800" role="img"
     aria-labelledby="typedSpectraTitle typedSpectraDesc">
  <title id="typedSpectraTitle">Five distinct types from an ordered spectrum to its mean measure</title>
  <desc id="typedSpectraDesc">For the fixed matrix H, the ordered eigenvalue function returns three and one, and the sample empirical measure puts one-half mass at each. If H varies randomly, the same construction is a function from Hermitian matrices to measures. After measurability is proved, pushing the matrix law through that function produces a measure on measures. Joining the outer law produces one mean measure on the real line. The vector, sample measure, function, outer law, and mean measure are different typed objects.</desc>
  <rect width="1200" height="800" fill="#F7F1E7"/>
  <style>
    .ink{fill:#17283F;font-family:Inter,Arial,Helvetica,sans-serif}
    .title{font-size:30px;font-weight:700}
    .sub{font-size:18px;fill:#536172}
    .head{font-size:18px;font-weight:700;letter-spacing:.5px}
    .body{font-size:18px}
    .small{font-size:15px;fill:#536172}
    .code{font-family:"SFMono-Regular",Consolas,monospace;font-size:16px}
    .math{font-family:"STIX Two Text","Times New Roman",serif;font-size:24px}
    .panel{fill:#FFFDF8;stroke:#C9BBA7;stroke-width:2}
    .blue{fill:#E7F0F7;stroke:#527394;stroke-width:2}
    .green{fill:#E8F2E3;stroke:#6C8A5B;stroke-width:2}
    .clay{fill:#F5E5DA;stroke:#B36B3D;stroke-width:2}
    .gray{fill:#ECE8E1;stroke:#7A756D;stroke-width:2}
    .arrow{fill:none;stroke:#B36B3D;stroke-width:3}
    .dash{fill:none;stroke:#8A96A5;stroke-width:2;stroke-dasharray:7 6}
  </style>
  <defs>
    <marker id="typedArrow" markerWidth="10" markerHeight="10" refX="9" refY="5"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#B36B3D"/>
    </marker>
  </defs>

  <text x="56" y="54" class="ink title">“Spectral distribution” can hide five different objects</text>
  <text x="56" y="84" class="ink sub">Follow the types, not the nickname: vector → sample measure → random measure → outer law → mean.</text>

  <rect x="48" y="118" width="1104" height="238" rx="18" class="panel"/>
  <text x="76" y="154" class="ink head">DETERMINISTIC PATH FOR THE FIXED MATRIX H = [[2,1],[1,2]]</text>

  <rect x="76" y="178" width="226" height="142" rx="14" class="blue"/>
  <text x="98" y="210" class="ink head">ORDERED SPECTRUM</text>
  <text x="98" y="250" class="ink math">Λ(H) = (3, 1)</text>
  <text x="98" y="282" class="ink code">Fin 2 → ℝ</text>
  <text x="98" y="306" class="ink small">vector; slot order matters</text>

  <path d="M314 249 L362 249" class="arrow" marker-end="url(#typedArrow)"/>

  <rect x="374" y="178" width="300" height="142" rx="14" class="green"/>
  <text x="396" y="210" class="ink head">ONE SAMPLE MEASURE</text>
  <text x="396" y="250" class="ink math">L<tspan baseline-shift="sub" font-size="14">H</tspan> = ½δ₃ + ½δ₁</text>
  <text x="396" y="282" class="ink code">Measure ℝ</text>
  <text x="396" y="306" class="ink small">mass at 3 = ½; mass at 1 = ½</text>

  <path d="M686 249 L734 249" class="arrow" marker-end="url(#typedArrow)"/>

  <rect x="746" y="178" width="378" height="142" rx="14" class="clay"/>
  <text x="768" y="210" class="ink head">THE OBSERVABLE WHEN H VARIES</text>
  <text x="768" y="250" class="ink math">H ↦ L<tspan baseline-shift="sub" font-size="14">H</tspan></text>
  <text x="768" y="282" class="ink code">HermitianEuclidean n → Measure ℝ</text>
  <text x="768" y="306" class="ink small">a function; not yet a probability law</text>

  <path d="M935 332 L935 390" class="dash"/>
  <rect x="756" y="380" width="368" height="72" rx="14" class="clay"/>
  <text x="780" y="410" class="ink head">MEASURABILITY GATE · RMT-10B</text>
  <text x="780" y="438" class="ink small">licenses the pushforward; chooses no source law</text>

  <rect x="48" y="488" width="1104" height="238" rx="18" class="panel"/>
  <text x="76" y="524" class="ink head">PROBABILISTIC PATH AFTER A MATRIX LAW μ<tspan baseline-shift="sub" font-size="13">n</tspan> AND MEASURABILITY ARE AVAILABLE</text>

  <rect x="76" y="548" width="240" height="142" rx="14" class="gray"/>
  <text x="98" y="580" class="ink head">MATRIX LAW</text>
  <text x="98" y="620" class="ink math">μ<tspan baseline-shift="sub" font-size="15">n</tspan></text>
  <text x="98" y="650" class="ink code">Measure (Hermitian…)</text>
  <text x="98" y="674" class="ink small">probability across matrices</text>

  <path d="M328 619 L376 619" class="arrow" marker-end="url(#typedArrow)"/>
  <text x="333" y="602" class="ink small">map</text>

  <rect x="388" y="548" width="330" height="142" rx="14" class="blue"/>
  <text x="410" y="580" class="ink head">LAW ON SAMPLE MEASURES</text>
  <text x="410" y="618" class="ink math">Q<tspan baseline-shift="sub" font-size="15">n</tspan> = map(μ<tspan baseline-shift="sub" font-size="15">n</tspan>, H ↦ L<tspan baseline-shift="sub" font-size="15">H</tspan>)</text>
  <text x="410" y="650" class="ink code">Measure (Measure ℝ)</text>
  <text x="410" y="674" class="ink small">one outer sample is a whole measure</text>

  <path d="M730 619 L778 619" class="arrow" marker-end="url(#typedArrow)"/>
  <text x="733" y="602" class="ink small">join</text>

  <rect x="790" y="548" width="334" height="142" rx="14" class="green"/>
  <text x="812" y="580" class="ink head">MEAN EMPIRICAL MEASURE</text>
  <text x="812" y="618" class="ink math">mean L<tspan baseline-shift="sub" font-size="15">n</tspan> = join(Q<tspan baseline-shift="sub" font-size="15">n</tspan>)</text>
  <text x="812" y="650" class="ink code">Measure ℝ</text>
  <text x="812" y="674" class="ink small">one average; sample pairing is forgotten</text>

  <rect x="48" y="748" width="1104" height="32" rx="10" class="clay"/>
  <text x="71" y="770" class="ink small">Zero-size audit: sample measure = 0; outer law = Dirac at 0; joined mean = 0.  Inner zero mass and outer unit mass are compatible.</text>
</svg>
