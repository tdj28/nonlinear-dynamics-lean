<svg xmlns="http://www.w3.org/2000/svg" width="760" height="410" viewBox="0 0 760 410" role="img" aria-labelledby="realTitle realDesc">
  <title id="realTitle">Real projection is safe only at a finite target</title>
  <desc id="realDesc">A green upper lane shows extended convergence with a finite union target passing through real projection to real convergence. A clay lower lane shows infinity mapping to zero and blocks a general continuity claim. A footer says finite total measure automatically supplies the finite-target gate.</desc>
  <defs><marker id="realArrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#A67C52"/></marker></defs>
  <style>.t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#2C2924}.title{font-size:15px;font-weight:700}.h{font-size:13px;font-weight:700}.s{font-size:12px}.m{font-size:11px;fill:#5A544C}.data{fill:#E8F0F7;stroke:#4B6787;stroke-width:1.5}.neutral{fill:#FBF9F6;stroke:#C4B8A8;stroke-width:1.5}.keep{fill:#EAF1E5;stroke:#6F8D5E;stroke-width:1.5}.warn{fill:#F3E8E0;stroke:#A67C52;stroke-width:1.5}</style>
  <rect width="760" height="410" fill="#F7F4F0"/>
  <text x="24" y="28" class="t title">The finite union target is the gate to real-measure continuity</text>
  <text x="24" y="48" class="t m">Projection is continuous away from infinity and totalized at infinity.</text>
  <rect x="34" y="78" width="692" height="116" rx="12" class="keep"/>
  <text x="56" y="105" class="t h">FINITE TARGET LANE</text>
  <rect x="58" y="120" width="170" height="48" rx="9" class="neutral"/><text x="76" y="149" class="t s">extended convergence</text>
  <line x1="238" y1="144" x2="284" y2="144" stroke="#A67C52" stroke-width="3" marker-end="url(#realArrow)"/>
  <rect x="296" y="120" width="170" height="48" rx="9" class="data"/><text x="318" y="149" class="t s">finite union target</text>
  <line x1="476" y1="144" x2="522" y2="144" stroke="#A67C52" stroke-width="3" marker-end="url(#realArrow)"/>
  <rect x="534" y="120" width="166" height="48" rx="9" class="neutral"/><text x="557" y="149" class="t s">real convergence</text>
  <rect x="34" y="218" width="692" height="108" rx="12" class="warn"/>
  <text x="56" y="245" class="t h">INFINITY CLIFF</text>
  <rect x="58" y="260" width="174" height="42" rx="9" class="neutral"/><text x="80" y="286" class="t s">extended target: infinity</text>
  <line x1="242" y1="281" x2="300" y2="281" stroke="#934F1F" stroke-width="3" marker-end="url(#realArrow)"/>
  <rect x="312" y="260" width="154" height="42" rx="9" class="data"/><text x="344" y="286" class="t s">real view: zero</text>
  <path d="M508 258 L542 281 L508 304" fill="none" stroke="#934F1F" stroke-width="5"/>
  <text x="562" y="278" class="t h">NO GENERAL</text><text x="562" y="298" class="t h">LIMIT TRANSFER</text>
  <rect x="72" y="350" width="616" height="40" rx="10" class="keep"/>
  <text x="102" y="375" class="t s">Finite total measure automatically makes the all-length union target finite.</text>
</svg>
