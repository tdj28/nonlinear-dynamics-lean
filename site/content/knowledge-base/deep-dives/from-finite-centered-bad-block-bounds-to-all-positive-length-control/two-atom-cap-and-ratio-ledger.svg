<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760"
     viewBox="0 0 1200 760" role="img"
     aria-labelledby="twoAtomCapTitle twoAtomCapDesc">
  <title id="twoAtomCapTitle">Two-atom centered bad-block caps and the all-length ratio</title>
  <desc id="twoAtomCapDesc">On two equally weighted atoms under identity dynamics, the amber centered process is minus n minus one and the blue process is zero. Against slope negative three quarters, lengths zero through four are not strict witnesses, length five is the first witness, and every cap from five onward contains only amber. The union has mass one half. The normalized integral is bounded below by negative one half, so the all-length ratio is one half less than or equal to two thirds. At slope zero, cap one is empty while cap two contains amber.</desc>
  <rect width="1200" height="760" fill="#F7F4F0"/>
  <style>
    .t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#2C2924}
    .serif{font-family:Georgia,Times,serif;fill:#17243A}
    .title{font-size:31px;font-weight:700}
    .eyebrow{font-size:15px;font-weight:700;letter-spacing:1.5px;fill:#A95320}
    .h{font-size:17px;font-weight:700}
    .s{font-size:14px}
    .m{font-size:12px;fill:#4D5B6B}
    .mono{font-family:Menlo,Consolas,monospace;font-size:14px;fill:#17243A}
    .light{fill:#FFFDF8}
    .neutral{fill:#FBF9F6;stroke:#C4B8A8;stroke-width:1.5}
    .data{fill:#E8F0F7;stroke:#4B6787;stroke-width:1.5}
    .keep{fill:#EAF1E5;stroke:#6F8D5E;stroke-width:1.5}
    .warn{fill:#F3E8E0;stroke:#A67C52;stroke-width:1.5}
    .navy{fill:#17243A}
    .blue{fill:#284E72}
    .green{fill:#47633B}
    .rust{fill:#934F1F}
  </style>

  <text x="70" y="40" class="t eyebrow">ONE EXACT NONERGODIC MODEL · UNIFORM TWO-ATOM MEASURE</text>
  <text x="70" y="78" class="serif title">Length five is the first strict bad-block witness</text>
  <text x="70" y="105" class="t m">Identity dynamics · amber Y_n=−(n−1) · blue Y_n=0 · slope c=−3/4 · rate floor δ=−1/2</text>

  <rect x="64" y="128" width="694" height="472" rx="16" class="neutral"/>
  <text x="86" y="160" class="t h">Compare the amber value with the strict line c·n</text>
  <rect x="84" y="178" width="654" height="42" rx="8" class="data"/>
  <text x="108" y="204" class="t h">n</text>
  <text x="190" y="204" class="t h">Y_n(amber)</text>
  <text x="356" y="204" class="t h">c·n</text>
  <text x="494" y="204" class="t h">Y_n &lt; c·n?</text>
  <text x="641" y="204" class="t h">meaning</text>

  <rect x="84" y="229" width="654" height="42" rx="7" class="data"/>
  <text x="110" y="255" class="mono">0</text><text x="218" y="255" class="mono">0</text>
  <text x="374" y="255" class="mono">0</text><text x="528" y="255" class="t s">no</text>
  <text x="632" y="255" class="t m">n must be positive</text>

  <rect x="84" y="278" width="654" height="42" rx="7" class="data"/>
  <text x="110" y="304" class="mono">1</text><text x="218" y="304" class="mono">0</text>
  <text x="362" y="304" class="mono">−3/4</text><text x="528" y="304" class="t s">no</text>
  <text x="632" y="304" class="t m">above the line</text>

  <rect x="84" y="327" width="654" height="42" rx="7" class="data"/>
  <text x="110" y="353" class="mono">2</text><text x="210" y="353" class="mono">−1</text>
  <text x="354" y="353" class="mono">−3/2</text><text x="528" y="353" class="t s">no</text>
  <text x="632" y="353" class="t m">above the line</text>

  <rect x="84" y="376" width="654" height="42" rx="7" class="data"/>
  <text x="110" y="402" class="mono">3</text><text x="210" y="402" class="mono">−2</text>
  <text x="354" y="402" class="mono">−9/4</text><text x="528" y="402" class="t s">no</text>
  <text x="632" y="402" class="t m">above the line</text>

  <rect x="84" y="425" width="654" height="42" rx="7" class="warn"/>
  <text x="110" y="451" class="mono">4</text><text x="210" y="451" class="mono">−3</text>
  <text x="374" y="451" class="mono">−3</text><text x="528" y="451" class="t s rust">no</text>
  <text x="632" y="451" class="t m">equality is excluded</text>

  <rect x="84" y="474" width="654" height="42" rx="7" class="keep"/>
  <text x="110" y="500" class="mono">5</text><text x="210" y="500" class="mono">−4</text>
  <text x="346" y="500" class="mono">−15/4</text><text x="516" y="500" class="t h green">yes</text>
  <text x="632" y="500" class="t m">first strict witness</text>

  <rect x="84" y="523" width="654" height="57" rx="7" class="keep"/>
  <text x="110" y="549" class="mono">6,7,…</text>
  <text x="190" y="549" class="t s">strict forever in this model</text>
  <text x="190" y="571" class="t m">blue remains zero and never enters for negative c</text>

  <rect x="782" y="128" width="354" height="174" rx="16" class="data"/>
  <text x="804" y="160" class="t eyebrow">NESTED CAPS</text>
  <text x="804" y="193" class="mono">B₀=B₁=…=B₄=∅</text>
  <text x="804" y="224" class="mono">B₅=B₆=…={amber}</text>
  <rect x="804" y="245" width="310" height="39" rx="8" class="keep"/>
  <text x="959" y="270" class="t h green" text-anchor="middle">B∞={amber}, μ(B∞)=1/2</text>

  <rect x="782" y="324" width="354" height="171" rx="16" class="keep"/>
  <text x="804" y="356" class="t eyebrow">UNIFORM RATE RATIO</text>
  <text x="804" y="389" class="mono">(∫Y_n dμ)/n = −(n−1)/(2n)</text>
  <text x="804" y="418" class="mono">−1/2 = δ ≤ (∫Y_n dμ)/n</text>
  <text x="804" y="447" class="mono">c=−3/4 &lt; δ</text>
  <text x="804" y="478" class="t h green">1/2 ≤ δ/c = 2/3</text>

  <rect x="782" y="517" width="354" height="83" rx="16" class="warn"/>
  <text x="804" y="547" class="t eyebrow">STRICTNESS AT SLOPE ZERO</text>
  <text x="804" y="574" class="mono">cap 1: ∅   ·   cap 2: {amber}</text>
  <text x="804" y="593" class="t m">Y_1=0 is equality; Y_2=−1 is strict.</text>

  <rect x="64" y="623" width="1072" height="67" rx="14" class="neutral"/>
  <text x="86" y="650" class="t h">What the union means</text>
  <text x="86" y="676" class="t s">Amber belongs because one finite length works. The event does not say bad lengths recur or that a normalized lower limit is below c.</text>

  <rect x="0" y="716" width="1200" height="44" class="navy"/>
  <text x="600" y="744" class="t s light" text-anchor="middle">CAPS 0–4 EMPTY · FIRST WITNESS 5 · UNION MASS 1/2 · UNCHANGED RATIO CEILING 2/3</text>
</svg>
