<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700"
     viewBox="0 0 1200 700" role="img"
     aria-labelledby="collapseRawTitle collapseRawDesc">
  <title id="collapseRawTitle">A one-shot strict witness produces a noninvariant raw event</title>
  <desc id="collapseRawDesc">A collapse map sends both amber and blue to blue and preserves a Dirac measure at blue. The amber centered process is zero at length one and negative one from length two onward, while blue is always zero. Against slope negative two fifths, amber is strict only at length two. Thus the raw all-length event is the singleton amber, but its preimage under the collapse map is empty. The event is once-bad, not recurrent, and differs setwise from its preimage even though both sets have zero Dirac measure.</desc>
  <rect width="1200" height="700" fill="#F7F4F0"/>
  <style>
    .t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#2C2924}
    .serif{font-family:Georgia,Times,serif;fill:#17243A}
    .title{font-size:31px;font-weight:700}
    .eyebrow{font-size:15px;font-weight:700;letter-spacing:1.5px;fill:#A95320}
    .h{font-size:17px;font-weight:700}
    .s{font-size:14px}
    .m{font-size:12px;fill:#4D5B6B}
    .mono{font-family:Menlo,Consolas,monospace;font-size:14px;fill:#17243A}
    .light{fill:#FFFDF8}
    .neutral{fill:#FBF9F6;stroke:#C4B8A8;stroke-width:1.5}
    .data{fill:#E8F0F7;stroke:#4B6787;stroke-width:1.5}
    .keep{fill:#EAF1E5;stroke:#6F8D5E;stroke-width:1.5}
    .warn{fill:#F3E8E0;stroke:#A67C52;stroke-width:1.5}
    .navy{fill:#17243A}
    .blue{fill:#284E72}
    .green{fill:#47633B}
    .rust{fill:#934F1F}
  </style>

  <text x="70" y="40" class="t eyebrow">SEPARATE CHECKED COUNTERMODEL · SLOPE c=−2/5</text>
  <text x="70" y="78" class="serif title">One bad length does not make the raw event invariant</text>
  <text x="70" y="105" class="t m">Collapse dynamics · both atoms map to blue · Dirac mass at blue is preserved · setwise equality still fails</text>

  <rect x="64" y="128" width="1072" height="112" rx="16" class="neutral"/>
  <text x="86" y="158" class="t h">The base map</text>
  <rect x="180" y="174" width="176" height="46" rx="11" class="warn"/>
  <text x="268" y="203" class="t h rust" text-anchor="middle">amber</text>
  <path d="M366 197 H557" stroke="#A67C52" stroke-width="3"/>
  <polygon points="557,197 541,188 541,206" fill="#A67C52"/>
  <rect x="570" y="174" width="176" height="46" rx="11" class="data"/>
  <text x="658" y="203" class="t h blue" text-anchor="middle">blue</text>
  <path d="M756 197 H948" stroke="#4B6787" stroke-width="3"/>
  <polygon points="948,197 932,188 932,206" fill="#4B6787"/>
  <rect x="961" y="174" width="132" height="46" rx="11" class="data"/>
  <text x="1027" y="203" class="t h blue" text-anchor="middle">blue</text>
  <text x="178" y="232" class="t m">T(amber)=blue</text>
  <text x="960" y="232" class="t m">T(blue)=blue</text>

  <rect x="64" y="263" width="690" height="274" rx="16" class="neutral"/>
  <text x="86" y="295" class="t h">The one-shot centered ledger</text>
  <rect x="84" y="313" width="650" height="42" rx="8" class="data"/>
  <text x="108" y="339" class="t h">n</text>
  <text x="184" y="339" class="t h">Y_n(amber)</text>
  <text x="358" y="339" class="t h">c·n</text>
  <text x="490" y="339" class="t h">strict?</text>
  <text x="604" y="339" class="t h">status</text>

  <rect x="84" y="365" width="650" height="40" rx="7" class="data"/>
  <text x="110" y="390" class="mono">1</text><text x="210" y="390" class="mono">0</text>
  <text x="356" y="390" class="mono">−2/5</text><text x="502" y="390" class="t s">no</text>
  <text x="604" y="390" class="t m">above line</text>

  <rect x="84" y="413" width="650" height="40" rx="7" class="keep"/>
  <text x="110" y="438" class="mono">2</text><text x="202" y="438" class="mono">−1</text>
  <text x="356" y="438" class="mono">−4/5</text><text x="494" y="438" class="t h green">yes</text>
  <text x="604" y="438" class="t m">only witness</text>

  <rect x="84" y="461" width="650" height="56" rx="7" class="data"/>
  <text x="108" y="486" class="mono">3,4,…</text>
  <text x="202" y="486" class="mono">−1</text>
  <text x="342" y="486" class="mono">−6/5,−8/5,…</text>
  <text x="502" y="486" class="t s">no</text>
  <text x="202" y="509" class="t m">the line keeps falling, so the one-shot value is no longer below it</text>

  <rect x="778" y="263" width="358" height="128" rx="16" class="warn"/>
  <text x="800" y="295" class="t eyebrow">RAW ALL-LENGTH EVENT</text>
  <text x="800" y="331" class="mono">B∞ = {amber}</text>
  <text x="800" y="362" class="t s">one strict witness at n=2 is enough</text>

  <rect x="778" y="409" width="358" height="128" rx="16" class="data"/>
  <text x="800" y="441" class="t eyebrow">PREIMAGE UNDER COLLAPSE</text>
  <text x="800" y="477" class="mono">T⁻¹(B∞) = ∅</text>
  <text x="800" y="508" class="t h rust">∅ ≠ {amber}: not invariant</text>

  <rect x="64" y="561" width="516" height="82" rx="16" class="keep"/>
  <text x="86" y="592" class="t eyebrow">ONCE-BAD, NOT ASYMPTOTIC</text>
  <text x="86" y="620" class="t s">The only strict witness is n=2; no arbitrarily late witnesses exist.</text>

  <rect x="604" y="561" width="532" height="82" rx="16" class="neutral"/>
  <text x="626" y="592" class="t eyebrow">SETWISE VERSUS ALMOST EVERYWHERE</text>
  <text x="626" y="620" class="t s">Dirac-blue measure gives both sets mass 0, but the sets are unequal.</text>

  <rect x="0" y="656" width="1200" height="44" class="navy"/>
  <text x="600" y="684" class="t s light" text-anchor="middle">EVENT {AMBER} · PREIMAGE ∅ · MEASURE PRESERVED · RAW ONCE-BAD EVENT STILL NOT SETWISE INVARIANT</text>
</svg>
