<svg xmlns="http://www.w3.org/2000/svg" width="760" height="390" viewBox="0 0 760 390" role="img" aria-labelledby="capsTitle capsDesc">
  <title id="capsTitle">Nested finite caps need only one finite witness</title>
  <desc id="capsDesc">Four nested search windows show a point absent from caps one and two, entering at cap three through one witness, and remaining in the all-length union. A label says one witness is not the same as infinitely many witnesses.</desc>
  <style>.t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#2C2924}.title{font-size:15px;font-weight:700}.h{font-size:13px;font-weight:700}.s{font-size:12px}.m{font-size:11px;fill:#5A544C}.data{fill:#E8F0F7;stroke:#4B6787;stroke-width:1.5}.neutral{fill:#FBF9F6;stroke:#C4B8A8;stroke-width:1.5}.keep{fill:#EAF1E5;stroke:#6F8D5E;stroke-width:1.5}.warn{fill:#F3E8E0;stroke:#A67C52;stroke-width:1.5}</style>
  <rect width="760" height="390" fill="#F7F4F0"/>
  <text x="24" y="28" class="t title">Finite caps nest; membership still comes from one finite witness</text>
  <text x="24" y="48" class="t m">Increasing the cap adds candidate lengths without changing earlier witnesses.</text>
  <rect x="36" y="78" width="688" height="220" rx="18" class="neutral"/>
  <rect x="70" y="106" width="620" height="164" rx="70" class="warn"/>
  <text x="90" y="130" class="t h">ALL POSITIVE LENGTHS</text>
  <rect x="132" y="139" width="496" height="108" rx="52" class="keep"/>
  <text x="151" y="163" class="t s">cap three and later</text>
  <rect x="208" y="170" width="344" height="54" rx="27" class="data"/>
  <text x="225" y="202" class="t s">caps one and two</text>
  <circle cx="575" cy="194" r="12" fill="#8B3E33" stroke="#2C2924" stroke-width="1.5"/>
  <line x1="575" y1="208" x2="575" y2="238" stroke="#8B3E33" stroke-width="1.5"/>
  <text x="445" y="263" class="t h">first witness: length three</text>
  <text x="90" y="288" class="t m">The point enters once its finite witness is inside the search window.</text>
  <rect x="84" y="320" width="592" height="46" rx="10" class="keep"/>
  <text x="125" y="348" class="t s">ONE FINITE WITNESS IS ENOUGH; INFINITELY MANY WITNESSES ARE NOT CLAIMED.</text>
</svg>
