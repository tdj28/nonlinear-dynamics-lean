<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360" role="img" aria-labelledby="ennTitle ennDesc">
  <title id="ennTitle">Continuity from below is unconditional in extended measure</title>
  <desc id="ennDesc">Nested finite caps flow to their exact union and then to extended-measure convergence. A side list marks set measurability, preservation, and finite mass as unnecessary for this step, and the target may be finite or infinite.</desc>
  <defs><marker id="ennArrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#A67C52"/></marker></defs>
  <style>.t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#2C2924}.title{font-size:15px;font-weight:700}.h{font-size:13px;font-weight:700}.s{font-size:12px}.m{font-size:11px;fill:#5A544C}.data{fill:#E8F0F7;stroke:#4B6787;stroke-width:1.5}.neutral{fill:#FBF9F6;stroke:#C4B8A8;stroke-width:1.5}.keep{fill:#EAF1E5;stroke:#6F8D5E;stroke-width:1.5}.warn{fill:#F3E8E0;stroke:#A67C52;stroke-width:1.5}</style>
  <rect width="760" height="360" fill="#F7F4F0"/>
  <text x="24" y="28" class="t title">Take continuity from below before asking for real numbers</text>
  <text x="24" y="48" class="t m">Extended nonnegative real measure keeps infinity as an honest target.</text>
  <rect x="34" y="82" width="170" height="120" rx="12" class="data"/>
  <text x="58" y="112" class="t h">NESTED CAPS</text><text x="58" y="143" class="t s">each earlier event</text><text x="58" y="164" class="t s">stays inside later ones</text>
  <line x1="214" y1="142" x2="268" y2="142" stroke="#A67C52" stroke-width="3" marker-end="url(#ennArrow)"/>
  <rect x="280" y="82" width="170" height="120" rx="12" class="neutral"/>
  <text x="306" y="112" class="t h">EXACT UNION</text><text x="306" y="143" class="t s">one finite witness</text><text x="306" y="164" class="t s">somewhere in the union</text>
  <line x1="460" y1="142" x2="514" y2="142" stroke="#A67C52" stroke-width="3" marker-end="url(#ennArrow)"/>
  <rect x="526" y="82" width="200" height="120" rx="12" class="keep"/>
  <text x="551" y="112" class="t h">EXTENDED LIMIT</text><text x="551" y="143" class="t s">measure of caps tends to</text><text x="551" y="164" class="t s">measure of the union</text><text x="551" y="185" class="t m">finite or infinite target</text>
  <rect x="70" y="238" width="620" height="54" rx="10" class="warn"/>
  <text x="94" y="260" class="t h">NOT NEEDED FOR THIS STEP</text>
  <text x="94" y="280" class="t s">set measurability / integrability / preservation / finite mass / probability / ergodicity</text>
  <rect x="24" y="316" width="712" height="28" rx="9" class="keep"/>
  <text x="77" y="335" class="t s">The native measure limit is unconditional because extended measure can converge to infinity.</text>
</svg>
