<svg xmlns="http://www.w3.org/2000/svg" width="920" height="700" viewBox="0 0 920 700" role="img" aria-labelledby="measure-cliff-title measure-cliff-desc">
  <title id="measure-cliff-title">Extended measure is continuous from below while totalized real measure can fail at infinite mass</title>
  <desc id="measure-cliff-desc">The upper lane shows nested sets whose extended nonnegative real measures increase to the extended measure of their union, even when that value is infinity. The lower lane uses finite initial segments of the natural numbers under counting measure: their real measures grow without bound, but the real measure of the infinite union is totalized to zero. A side gate says that local finiteness of the union supplies a clean sufficient passage to real values.</desc>
  <defs>
    <marker id="measure-cliff-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#A67C52"/>
    </marker>
  </defs>
  <style>
    .t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#2C2924}
    .title{font-size:15px;font-weight:700}
    .h{font-size:13px;font-weight:700}
    .s{font-size:12px}
    .m{font-size:11px;fill:#5A544C}
  </style>
  <rect width="920" height="700" rx="18" fill="#F7F4F0"/>
  <text class="t title" x="24" y="28">Cross the limit in extended measure before converting to real measure</text>
  <text class="t m" x="24" y="48">Continuity from below tolerates infinite mass; conversion to a real number need not preserve that limit.</text>

  <rect x="36" y="82" width="848" height="230" rx="12" fill="#E8F0F7" stroke="#4B6787" stroke-width="1.6"/>
  <text class="t h" x="60" y="114">SAFE LANE: EXTENDED NONNEGATIVE REAL MEASURE</text>
  <rect x="72" y="148" width="102" height="102" rx="18" fill="#FBF9F6" stroke="#C4B8A8" stroke-width="1.4"/>
  <rect x="86" y="162" width="74" height="74" rx="14" fill="#EAF1E5" stroke="#6F8D5E" stroke-width="1.2"/>
  <text class="t m" x="95" y="268">early set</text>
  <line x1="187" y1="199" x2="247" y2="199" stroke="#A67C52" stroke-width="3" marker-end="url(#measure-cliff-arrow)"/>
  <rect x="260" y="136" width="128" height="126" rx="20" fill="#FBF9F6" stroke="#C4B8A8" stroke-width="1.4"/>
  <rect x="274" y="150" width="100" height="98" rx="16" fill="#EAF1E5" stroke="#6F8D5E" stroke-width="1.2"/>
  <text class="t m" x="289" y="281">later set</text>
  <line x1="401" y1="199" x2="461" y2="199" stroke="#A67C52" stroke-width="3" marker-end="url(#measure-cliff-arrow)"/>
  <rect x="474" y="122" width="154" height="154" rx="24" fill="#FBF9F6" stroke="#C4B8A8" stroke-width="1.4"/>
  <rect x="488" y="136" width="126" height="126" rx="20" fill="#EAF1E5" stroke="#6F8D5E" stroke-width="1.2"/>
  <text class="t m" x="521" y="295">union</text>
  <rect x="680" y="142" width="166" height="114" rx="10" fill="#EAF1E5" stroke="#6F8D5E" stroke-width="1.4"/>
  <text class="t h" x="712" y="176">CONTINUOUS</text>
  <text class="t s" x="703" y="204">finite or infinite limit</text>
  <text class="t m" x="705" y="229">no set measurability gate</text>
  <line x1="640" y1="199" x2="667" y2="199" stroke="#A67C52" stroke-width="3" marker-end="url(#measure-cliff-arrow)"/>

  <rect x="36" y="342" width="848" height="252" rx="12" fill="#F3E8E0" stroke="#A67C52" stroke-width="1.6"/>
  <text class="t h" x="60" y="374">CLIFF LANE: TOTALIZED REAL MEASURE AT INFINITY</text>
  <rect x="72" y="410" width="126" height="98" rx="10" fill="#FBF9F6" stroke="#C4B8A8" stroke-width="1.3"/>
  <text class="t s" x="93" y="440">finite prefixes</text>
  <text class="t m" x="93" y="466">one, two, three, ...</text>
  <text class="t m" x="93" y="487">real masses grow</text>
  <line x1="211" y1="459" x2="281" y2="459" stroke="#A67C52" stroke-width="3" marker-end="url(#measure-cliff-arrow)"/>
  <rect x="294" y="398" width="172" height="122" rx="10" fill="#FBF9F6" stroke="#C4B8A8" stroke-width="1.3"/>
  <text class="t s" x="326" y="431">countable union</text>
  <text class="t m" x="322" y="459">all natural numbers</text>
  <text class="t m" x="319" y="483">extended mass is infinite</text>
  <line x1="479" y1="459" x2="549" y2="459" stroke="#A67C52" stroke-width="3" marker-end="url(#measure-cliff-arrow)"/>
  <rect x="562" y="398" width="132" height="122" rx="10" fill="#EDE8E1" stroke="#7F786D" stroke-width="1.3"/>
  <text class="t h" x="591" y="431">REAL VIEW</text>
  <text class="t s" x="585" y="462">infinite maps</text>
  <text class="t s" x="603" y="484">to zero</text>
  <path d="M706 432 L744 470 L706 508" fill="none" stroke="#934F1F" stroke-width="5"/>
  <rect x="758" y="398" width="92" height="122" rx="10" fill="#F3E8E0" stroke="#A67C52" stroke-width="1.3"/>
  <text class="t h" x="779" y="445">LIMIT</text>
  <text class="t h" x="782" y="471">FAILS</text>
  <text class="t m" x="773" y="496">at the cliff</text>
  <text class="t m" x="73" y="556">This is a definitional totalization boundary, not a paradox about counting measure.</text>

  <rect x="154" y="622" width="612" height="52" rx="10" fill="#EAF1E5" stroke="#6F8D5E" stroke-width="1.4"/>
  <text class="t s" x="182" y="645">LOCAL FINITENESS GATE</text>
  <text class="t m" x="349" y="645">If the union has finite extended mass, conversion is continuous and the real limit is valid.</text>
  <text class="t m" x="182" y="662">Event finiteness is the weaker sufficient premise used here; it is not necessary for every sequence.</text>
</svg>
