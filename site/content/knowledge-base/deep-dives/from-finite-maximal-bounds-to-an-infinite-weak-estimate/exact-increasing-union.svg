<svg xmlns="http://www.w3.org/2000/svg" width="920" height="650" viewBox="0 0 920 650" role="img" aria-labelledby="exact-union-title exact-union-desc">
  <title id="exact-union-title">An infinite average-exceedance event is the exact increasing union of finite events</title>
  <desc id="exact-union-desc">The left lane starts with a strict crossing at one positive witness time and chooses that same time as a finite horizon. The right lane starts with a witness inside one finite horizon and forgets only the upper bound. Nested event shapes show that larger horizons retain all earlier witnesses. The equality is set-theoretic and needs no measurable structure.</desc>
  <defs>
    <marker id="exact-union-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#A67C52"/>
    </marker>
  </defs>
  <style>
    .t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#2C2924}
    .title{font-size:15px;font-weight:700}
    .h{font-size:13px;font-weight:700}
    .s{font-size:12px}
    .m{font-size:11px;fill:#5A544C}
  </style>
  <rect width="920" height="650" rx="18" fill="#F7F4F0"/>
  <text class="t title" x="24" y="28">Exact union: existence at infinite horizon always has a finite witness</text>
  <text class="t m" x="24" y="48">The word infinite describes the search range, not the duration of any individual witness.</text>

  <rect x="36" y="78" width="400" height="250" rx="12" fill="#E8F0F7" stroke="#4B6787" stroke-width="1.6"/>
  <text class="t h" x="60" y="110">FROM THE INFINITE EVENT</text>
  <rect x="64" y="137" width="344" height="60" rx="10" fill="#FBF9F6" stroke="#C4B8A8" stroke-width="1.3"/>
  <text class="t s" x="86" y="162">Extract one positive witness time</text>
  <text class="t m" x="86" y="182">the average crosses the threshold strictly</text>
  <line x1="236" y1="204" x2="236" y2="235" stroke="#A67C52" stroke-width="3" marker-end="url(#exact-union-arrow)"/>
  <rect x="64" y="246" width="344" height="55" rx="10" fill="#EAF1E5" stroke="#6F8D5E" stroke-width="1.3"/>
  <text class="t s" x="86" y="270">Choose that witness time as the finite horizon</text>
  <text class="t m" x="86" y="289">the upper-bound condition is immediate</text>

  <rect x="484" y="78" width="400" height="250" rx="12" fill="#F3E8E0" stroke="#A67C52" stroke-width="1.6"/>
  <text class="t h" x="508" y="110">FROM ONE FINITE EVENT</text>
  <rect x="512" y="137" width="344" height="60" rx="10" fill="#FBF9F6" stroke="#C4B8A8" stroke-width="1.3"/>
  <text class="t s" x="534" y="162">Extract its positive witness time</text>
  <text class="t m" x="534" y="182">the witness is positive and within the horizon</text>
  <line x1="684" y1="204" x2="684" y2="235" stroke="#A67C52" stroke-width="3" marker-end="url(#exact-union-arrow)"/>
  <rect x="512" y="246" width="344" height="55" rx="10" fill="#EAF1E5" stroke="#6F8D5E" stroke-width="1.3"/>
  <text class="t s" x="534" y="270">Forget the finite upper bound</text>
  <text class="t m" x="534" y="289">the same witness certifies the infinite event</text>

  <rect x="36" y="360" width="848" height="196" rx="12" fill="#FBF9F6" stroke="#C4B8A8" stroke-width="1.6"/>
  <text class="t h" x="60" y="392">THE FINITE EVENTS ARE NESTED</text>
  <rect x="76" y="418" width="768" height="104" rx="48" fill="#EDE8E1" stroke="#7F786D" stroke-width="1.4"/>
  <rect x="151" y="429" width="618" height="82" rx="40" fill="#F3E8E0" stroke="#A67C52" stroke-width="1.4"/>
  <rect x="225" y="440" width="470" height="60" rx="30" fill="#EAF1E5" stroke="#6F8D5E" stroke-width="1.4"/>
  <rect x="299" y="451" width="322" height="38" rx="19" fill="#E8F0F7" stroke="#4B6787" stroke-width="1.4"/>
  <text class="t s" x="383" y="476">earliest horizon</text>
  <text class="t m" x="637" y="476">later</text>
  <text class="t m" x="716" y="476">later still</text>
  <text class="t m" x="777" y="539">union of all finite horizons</text>

  <rect x="24" y="586" width="872" height="42" rx="10" fill="#EAF1E5" stroke="#6F8D5E" stroke-width="1.4"/>
  <text class="t s" x="48" y="612">Takeaway: the equality and horizon monotonicity are pure set theory; measure enters only after this bridge is built.</text>
</svg>
