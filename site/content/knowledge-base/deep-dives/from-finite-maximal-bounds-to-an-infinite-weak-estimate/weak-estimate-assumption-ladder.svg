<svg xmlns="http://www.w3.org/2000/svg" width="920" height="760" viewBox="0 0 920 760" role="img" aria-labelledby="assumption-ladder-title assumption-ladder-desc">
  <title id="assumption-ladder-title">Assumptions enter at distinct stages of the infinite weak maximal estimate</title>
  <desc id="assumption-ladder-desc">A dependency ladder separates the theorem boundary. Event definition and exact union use no measurable structure. Ordinary measurability uses measurable dynamics and observable. Null measurability instead uses measure preservation and integrability. Extended measure continuity uses only increasing sets. The checked real-measure corollary uses local event finiteness as a sufficient premise. The multiplication bound adds finite total measure, preservation, and integrability and accepts every real threshold. The final weak estimate additionally requires the threshold to be positive so division preserves order.</desc>
  <defs>
    <marker id="assumption-ladder-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#A67C52"/>
    </marker>
  </defs>
  <style>
    .t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#2C2924}
    .title{font-size:15px;font-weight:700}
    .h{font-size:13px;font-weight:700}
    .s{font-size:12px}
    .m{font-size:11px;fill:#5A544C}
  </style>
  <rect width="920" height="760" rx="18" fill="#F7F4F0"/>
  <text class="t title" x="24" y="28">Assumption ladder: add a premise only when the next operation needs it</text>
  <text class="t m" x="24" y="48">The two measurability routes are alternatives; neither is a hidden step in the set-theoretic union.</text>

  <rect x="52" y="82" width="816" height="78" rx="12" fill="#E8F0F7" stroke="#4B6787" stroke-width="1.6"/>
  <text class="t h" x="78" y="111">EVENT AND EXACT UNION</text>
  <text class="t s" x="78" y="137">Premises: none beyond the map, observable, threshold, and natural-time sums.</text>
  <text class="t m" x="647" y="123">strict positive time</text>
  <text class="t m" x="647" y="142">set equality</text>
  <line x1="460" y1="166" x2="460" y2="188" stroke="#A67C52" stroke-width="3" marker-end="url(#assumption-ladder-arrow)"/>

  <rect x="52" y="198" width="388" height="96" rx="12" fill="#FBF9F6" stroke="#C4B8A8" stroke-width="1.6"/>
  <text class="t h" x="78" y="227">ORDINARY MEASURABILITY ROUTE</text>
  <text class="t s" x="78" y="253">Measurable dynamics</text>
  <text class="t s" x="78" y="274">Measurable observable</text>
  <rect x="480" y="198" width="388" height="96" rx="12" fill="#F3E8E0" stroke="#A67C52" stroke-width="1.6"/>
  <text class="t h" x="506" y="227">NULL-MEASURABILITY ROUTE</text>
  <text class="t s" x="506" y="253">Measure-preserving dynamics</text>
  <text class="t s" x="506" y="274">Integrable observable, no finite mass</text>
  <text class="t m" x="380" y="315">alternative analytic interfaces</text>
  <line x1="460" y1="322" x2="460" y2="344" stroke="#A67C52" stroke-width="3" marker-end="url(#assumption-ladder-arrow)"/>

  <rect x="52" y="354" width="816" height="78" rx="12" fill="#EAF1E5" stroke="#6F8D5E" stroke-width="1.6"/>
  <text class="t h" x="78" y="383">EXTENDED MEASURE CONTINUITY</text>
  <text class="t s" x="78" y="409">Premise: finite events increase with the horizon. No finiteness or set-measurability gate.</text>
  <text class="t m" x="675" y="398">infinite values allowed</text>
  <line x1="460" y1="438" x2="460" y2="460" stroke="#A67C52" stroke-width="3" marker-end="url(#assumption-ladder-arrow)"/>

  <rect x="52" y="470" width="816" height="90" rx="12" fill="#FBF9F6" stroke="#C4B8A8" stroke-width="1.6"/>
  <text class="t h" x="78" y="499">REAL MEASURE CONTINUITY</text>
  <text class="t s" x="78" y="525">Sufficient premise used here: this infinite event has finite extended measure.</text>
  <text class="t m" x="78" y="546">Finite total measure is stronger; no claim says local finiteness is necessary for every sequence.</text>
  <line x1="460" y1="566" x2="460" y2="588" stroke="#A67C52" stroke-width="3" marker-end="url(#assumption-ladder-arrow)"/>

  <rect x="52" y="598" width="388" height="96" rx="12" fill="#E8F0F7" stroke="#4B6787" stroke-width="1.6"/>
  <text class="t h" x="78" y="627">MULTIPLICATION BOUND</text>
  <text class="t s" x="78" y="653">Finite total measure</text>
  <text class="t s" x="78" y="674">Preservation, integrability, every real threshold</text>
  <rect x="480" y="598" width="388" height="96" rx="12" fill="#F3E8E0" stroke="#A67C52" stroke-width="1.6"/>
  <text class="t h" x="506" y="627">DIVIDED WEAK ESTIMATE</text>
  <text class="t s" x="506" y="653">All multiplication-bound premises</text>
  <text class="t s" x="506" y="674">Plus a strictly positive threshold</text>
  <line x1="446" y1="646" x2="467" y2="646" stroke="#A67C52" stroke-width="3" marker-end="url(#assumption-ladder-arrow)"/>

  <rect x="24" y="718" width="872" height="30" rx="10" fill="#EAF1E5" stroke="#6F8D5E" stroke-width="1.4"/>
  <text class="t s" x="48" y="738">Never added: probability normalization, ergodicity, injectivity, surjectivity, invertibility, or pointwise convergence.</text>
</svg>
