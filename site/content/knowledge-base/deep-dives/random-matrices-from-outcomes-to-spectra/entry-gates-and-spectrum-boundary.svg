<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720"
     viewBox="0 0 1000 720" role="img"
     aria-labelledby="entryGateTitle entryGateDesc">
  <title id="entryGateTitle">Entrywise measurability opens the law gate, while a nilpotent boundary shows that eigenvalues do not determine a matrix</title>
  <desc id="entryGateDesc">The red then blue coordinate pairs are upper left two then zero, upper right zero then one, lower left zero then one, and lower right zero then zero. The event where the upper-left entry exceeds one has preimage red and probability one half. The center separates the measurable matrix map, its pushforward law, the spectral observable, and the outer law on measures. The right side compares the zero matrix with a nonzero upper-triangular matrix whose square is zero: both have two zero eigenvalue slots, but only the nonzero matrix moves the vertical vector to the horizontal vector, and it is not Hermitian.</desc>
  <rect width="1000" height="720" fill="#F7F4F0"/>
  <style>
    .t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#2C2924}
    .title{font-size:21px;font-weight:700}
    .h{font-size:15px;font-weight:700}
    .s{font-size:13px}
    .m{font-size:11.5px;fill:#5A544C}
    .card{fill:#FBF9F6;stroke:#C4B8A8;stroke-width:1.5}
    .blue{fill:#E8F0F7;stroke:#4B6787;stroke-width:1.5}
    .clay{fill:#F3E8E0;stroke:#A67C52;stroke-width:1.5}
    .green{fill:#EAF1E5;stroke:#6F8D5E;stroke-width:1.5}
    .gray{fill:#EDE8E1;stroke:#7F786D;stroke-width:1.5}
    .cell{fill:#FFFDF8;stroke:#7F786D;stroke-width:1.1}
    .arrow{fill:none;stroke:#A67C52;stroke-width:2.2;marker-end:url(#gateArrow)}
  </style>
  <defs>
    <marker id="gateArrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#A67C52"/>
    </marker>
  </defs>

  <text x="28" y="38" class="t title">Two gates and one warning: coordinates license probability, spectra discard information</text>
  <text x="28" y="62" class="t m">The values below are the same fair two-outcome example as the running calculation.</text>

  <rect x="28" y="90" width="308" height="536" rx="14" class="blue"/>
  <text x="48" y="122" class="t h">1. Audit every entry map</text>
  <text x="48" y="145" class="t m">Each row lists red value, then blue value.</text>

  <rect x="48" y="170" width="126" height="74" rx="10" class="card"/>
  <text x="111" y="196" text-anchor="middle" class="t h">upper left</text>
  <text x="111" y="224" text-anchor="middle" class="t s">2, then 0</text>
  <rect x="190" y="170" width="126" height="74" rx="10" class="card"/>
  <text x="253" y="196" text-anchor="middle" class="t h">upper right</text>
  <text x="253" y="224" text-anchor="middle" class="t s">0, then 1</text>
  <rect x="48" y="260" width="126" height="74" rx="10" class="card"/>
  <text x="111" y="286" text-anchor="middle" class="t h">lower left</text>
  <text x="111" y="314" text-anchor="middle" class="t s">0, then 1</text>
  <rect x="190" y="260" width="126" height="74" rx="10" class="card"/>
  <text x="253" y="286" text-anchor="middle" class="t h">lower right</text>
  <text x="253" y="314" text-anchor="middle" class="t s">0, then 0</text>

  <rect x="48" y="360" width="268" height="116" rx="10" class="green"/>
  <text x="64" y="389" class="t h">Check one matrix event</text>
  <text x="64" y="416" class="t s">upper-left entry &gt; 1</text>
  <text x="64" y="442" class="t s">preimage: RED only</text>
  <text x="64" y="466" class="t s">source probability: 1/2</text>

  <rect x="48" y="500" width="268" height="96" rx="10" class="card"/>
  <text x="64" y="528" class="t h">Finite discrete source</text>
  <text x="64" y="552" class="t s">every subset is declared measurable</text>
  <text x="64" y="576" class="t m">Every coordinate preimage is therefore an event.</text>

  <rect x="356" y="90" width="288" height="536" rx="14" class="clay"/>
  <text x="376" y="122" class="t h">2. Keep the typed gates separate</text>

  <rect x="382" y="160" width="236" height="72" rx="10" class="card"/>
  <text x="500" y="188" text-anchor="middle" class="t h">Outcome-to-matrix rule</text>
  <text x="500" y="212" text-anchor="middle" class="t m">a bare function first</text>
  <path d="M 500 234 V 260" class="arrow"/>
  <rect x="382" y="270" width="236" height="72" rx="10" class="blue"/>
  <text x="500" y="298" text-anchor="middle" class="t h">Coordinate measurability</text>
  <text x="500" y="322" text-anchor="middle" class="t m">licenses the matrix pushforward</text>
  <path d="M 500 344 V 370" class="arrow"/>
  <rect x="382" y="380" width="236" height="72" rx="10" class="green"/>
  <text x="500" y="408" text-anchor="middle" class="t h">Law on matrix space</text>
  <text x="500" y="432" text-anchor="middle" class="t m">probability now lives on matrices</text>
  <path d="M 500 454 V 480" class="arrow"/>
  <rect x="382" y="490" width="236" height="108" rx="10" class="card"/>
  <text x="500" y="518" text-anchor="middle" class="t h">Measurable spectral map</text>
  <text x="500" y="542" text-anchor="middle" class="t m">one matrix becomes one measure</text>
  <text x="500" y="568" text-anchor="middle" class="t h">then: law on measures</text>

  <rect x="664" y="90" width="308" height="536" rx="14" class="gray"/>
  <text x="684" y="122" class="t h">3. Boundary: the spectrum forgets</text>
  <text x="684" y="145" class="t m">These two matrices have the same eigenvalue slots.</text>

  <rect x="686" y="170" width="120" height="166" rx="10" class="card"/>
  <text x="746" y="196" text-anchor="middle" class="t h">Zero matrix</text>
  <rect x="712" y="216" width="34" height="34" class="cell"/>
  <rect x="746" y="216" width="34" height="34" class="cell"/>
  <rect x="712" y="250" width="34" height="34" class="cell"/>
  <rect x="746" y="250" width="34" height="34" class="cell"/>
  <text x="729" y="238" text-anchor="middle" class="t s">0</text>
  <text x="763" y="238" text-anchor="middle" class="t s">0</text>
  <text x="729" y="272" text-anchor="middle" class="t s">0</text>
  <text x="763" y="272" text-anchor="middle" class="t s">0</text>
  <text x="746" y="314" text-anchor="middle" class="t m">moves no vector</text>

  <rect x="826" y="170" width="126" height="166" rx="10" class="clay"/>
  <text x="889" y="196" text-anchor="middle" class="t h">Nilpotent</text>
  <rect x="855" y="216" width="34" height="34" class="cell"/>
  <rect x="889" y="216" width="34" height="34" class="cell"/>
  <rect x="855" y="250" width="34" height="34" class="cell"/>
  <rect x="889" y="250" width="34" height="34" class="cell"/>
  <text x="872" y="238" text-anchor="middle" class="t s">0</text>
  <text x="906" y="238" text-anchor="middle" class="t s">1</text>
  <text x="872" y="272" text-anchor="middle" class="t s">0</text>
  <text x="906" y="272" text-anchor="middle" class="t s">0</text>
  <text x="889" y="300" text-anchor="middle" class="t m">square is zero</text>
  <text x="889" y="315" text-anchor="middle" class="t m">vertical to horizontal</text>
  <text x="889" y="330" text-anchor="middle" class="t m">not Hermitian</text>

  <rect x="686" y="366" width="266" height="106" rx="10" class="blue"/>
  <text x="819" y="396" text-anchor="middle" class="t h">Same empirical spectrum</text>
  <circle cx="778" cy="430" r="23" fill="#FFFDF8" stroke="#4B6787" stroke-width="2"/>
  <circle cx="860" cy="430" r="23" fill="#FFFDF8" stroke="#4B6787" stroke-width="2"/>
  <text x="778" y="436" text-anchor="middle" class="t h">0</text>
  <text x="860" y="436" text-anchor="middle" class="t h">0</text>
  <text x="819" y="462" text-anchor="middle" class="t m">all sample mass at zero</text>

  <rect x="686" y="500" width="266" height="96" rx="10" class="card"/>
  <text x="819" y="528" text-anchor="middle" class="t h">Different operators</text>
  <text x="819" y="548" text-anchor="middle" class="t s">eigenvalues do not reconstruct entries</text>
  <text x="819" y="570" text-anchor="middle" class="t m">real eigenvalues alone</text>
  <text x="819" y="588" text-anchor="middle" class="t m">do not imply Hermitian symmetry</text>

  <rect x="28" y="652" width="944" height="48" rx="12" class="green"/>
  <text x="500" y="682" text-anchor="middle" class="t h">Measurability makes probability questions legal; a spectrum answers fewer questions than the full matrix.</text>
</svg>
