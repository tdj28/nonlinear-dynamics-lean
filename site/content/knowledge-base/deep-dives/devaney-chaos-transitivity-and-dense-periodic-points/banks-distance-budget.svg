<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360" role="img" aria-labelledby="budgetTitle budgetDesc">
  <title id="budgetTitle">Distance budget in the Banks proof</title>
  <desc id="budgetDesc">A horizontal scale marks periodic orbit P, reference x, and far periodic orbit Q with separation r equal to eight delta. Below, nearby candidates p and y become more than two delta apart, forcing one to be more than delta from the reference image.</desc>
  <rect width="760" height="360" fill="#F7F4F0"/>
  <style>.t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#2C2924}.title{font-size:15px;font-weight:700}.h{font-size:13px;font-weight:700}.s{font-size:12px}.m{font-size:11px;fill:#5A544C}.axis{stroke:#7F786D;stroke-width:2}.blue{fill:#E8F0F7;stroke:#4B6787;stroke-width:1.5}.clay{fill:#F3E8E0;stroke:#A67C52;stroke-width:1.5}</style>
  <text x="24" y="28" class="t title">The proof spends a positive separation in stages</text><text x="24" y="48" class="t m">Exact locations are schematic; the labeled inequalities are the content.</text>
  <line x1="90" y1="130" x2="670" y2="130" class="axis"/><circle cx="140" cy="130" r="14" fill="#4B6787"/><circle cx="380" cy="130" r="12" fill="#7F786D"/><circle cx="620" cy="130" r="14" fill="#A67C52"/>
  <text x="126" y="102" class="t h">orbit P</text><text x="375" y="102" class="t h">x</text><text x="596" y="102" class="t h">orbit Q</text>
  <path d="M156 157H604" stroke="#A89B8C" stroke-width="2" stroke-dasharray="6 4"/><text x="317" y="180" class="t s">r = 8 delta between P and Q</text>
  <rect x="72" y="220" width="280" height="76" rx="10" class="blue"/><text x="92" y="245" class="t h">Before transport</text><text x="92" y="267" class="t s">one orbit stays at least 4 delta from x</text>
  <rect x="408" y="220" width="280" height="76" rx="10" class="clay"/><text x="428" y="245" class="t h">After alignment</text><text x="428" y="267" class="t s">p and y are more than 2 delta apart</text>
  <rect x="150" y="318" width="460" height="28" rx="8" fill="#EAF1E5" stroke="#6F8D5E"/><text x="172" y="337" class="t s">Therefore p or y is more than delta from the corresponding iterate of x.</text>
</svg>
