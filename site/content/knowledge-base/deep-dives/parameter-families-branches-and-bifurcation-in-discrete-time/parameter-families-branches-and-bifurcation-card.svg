<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Parameter Families, Branches, and Bifurcation in Discrete Time</title>
  <desc id="desc">Three panels show zero, one, and two blue fixed-state dots as a parameter crosses a clay threshold.</desc>
  <rect width="1200" height="630" fill="#F7F4F0"/>
  <text x="75" y="100" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="700" fill="#A67C52">KNOWLEDGE BASE DEEP DIVE</text>
  <text x="75" y="170" font-family="Inter,Arial,sans-serif" font-size="45" font-weight="750" fill="#16324F">Parameter Families and Branches</text>
  <text x="75" y="222" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="650" fill="#2C2924">What the first bifurcation interface does and does not say</text>
  <rect x="75" y="290" width="310" height="185" rx="16" fill="#FBF9F6" stroke="#C4B8A8" stroke-width="2"/>
  <text x="230" y="335" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="700" fill="#2C2924">below</text><text x="230" y="430" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="22" fill="#5A544C">no fixed state</text>
  <rect x="445" y="290" width="310" height="185" rx="16" fill="#FBF9F6" stroke="#A67C52" stroke-width="3"/>
  <text x="600" y="335" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="700" fill="#2C2924">threshold</text><circle cx="600" cy="392" r="15" fill="#E8F0F7" stroke="#4B6787" stroke-width="3"/><text x="600" y="445" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="22" fill="#5A544C">one fixed state</text>
  <rect x="815" y="290" width="310" height="185" rx="16" fill="#FBF9F6" stroke="#C4B8A8" stroke-width="2"/>
  <text x="970" y="335" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="700" fill="#2C2924">above</text><circle cx="925" cy="392" r="15" fill="#E8F0F7" stroke="#4B6787" stroke-width="3"/><circle cx="1015" cy="392" r="15" fill="#E8F0F7" stroke="#4B6787" stroke-width="3"/><text x="970" y="445" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="22" fill="#5A544C">two fixed states</text>
  <rect x="75" y="530" width="1050" height="50" rx="13" fill="#EAF1E5" stroke="#6F8D5E"/>
  <text x="600" y="562" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="21" fill="#2C2924">parameter is not time  |  branch is not orbit  |  specified period is not least period</text>
</svg>
