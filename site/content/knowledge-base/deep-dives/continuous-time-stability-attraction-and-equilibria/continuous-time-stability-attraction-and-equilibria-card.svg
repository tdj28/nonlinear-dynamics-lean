<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Continuous-time stability, attraction, and equilibria</title>
  <desc id="desc">A moving stability tube leads to three labeled concepts that stay separate until Lyapunov stability and a local attraction basin combine.</desc>
  <rect width="1200" height="630" fill="#f1e9da"/><rect x="38" y="38" width="1124" height="554" rx="28" fill="#fbf8f0" stroke="#315f63" stroke-width="4"/>
  <text x="76" y="102" font-family="Arial,sans-serif" font-size="21" letter-spacing="3" fill="#7a4d69">DEEP DIVE · CONTINUOUS-TIME DYNAMICS</text>
  <text x="76" y="174" font-family="Georgia,serif" font-size="49" fill="#23343b">Stability, attraction,</text><text x="76" y="231" font-family="Georgia,serif" font-size="49" fill="#23343b">and equilibria are distinct</text>
  <path d="M86 409 L474 308" fill="none" stroke="#6F8D5E" stroke-width="62" opacity="0.28"/><path d="M86 397 L474 296" fill="none" stroke="#315f63" stroke-width="6"/><path d="M86 421 L474 320" fill="none" stroke="#b06f45" stroke-width="5"/>
  <rect x="542" y="282" width="178" height="72" rx="14" fill="#E8F0F7" stroke="#4B6787" stroke-width="3"/><text x="631" y="326" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#23343b">STABILITY</text>
  <rect x="542" y="382" width="178" height="72" rx="14" fill="#F3E8E0" stroke="#A67C52" stroke-width="3"/><text x="631" y="426" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#23343b">ATTRACTION</text>
  <rect x="768" y="332" width="178" height="72" rx="14" fill="#EDE8E1" stroke="#7F786D" stroke-width="3"/><text x="857" y="376" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#23343b">EQUILIBRIUM</text>
  <path d="M964 368 L1020 368" stroke="#315f63" stroke-width="5"/><polygon points="1020,368 1004,357 1004,379" fill="#315f63"/>
  <text x="1040" y="349" font-family="Georgia,serif" font-size="20" fill="#23343b">combine only</text><text x="1040" y="378" font-family="Georgia,serif" font-size="20" fill="#23343b">with stated</text><text x="1040" y="407" font-family="Georgia,serif" font-size="20" fill="#23343b">conditions</text>
  <text x="76" y="540" font-family="Arial,sans-serif" font-size="19" fill="#7a4d69">translation boundary · identity boundary · exact nonnegative-time quantifier</text>
</svg>
