<svg xmlns="http://www.w3.org/2000/svg" width="760" height="390" viewBox="0 0 760 390" role="img" aria-labelledby="title desc">
  <title id="title">Ledger separating forward stability, equilibrium, attraction, and asymptotic stability</title>
  <desc id="desc">Rows show translation as stable without equilibrium, identity as stable equilibrium without attraction of distinct starts, local attraction as a separate basin condition, and asymptotic stability as the conjunction of Lyapunov stability and local attraction.</desc>
  <rect width="760" height="390" fill="#F7F4F0"/>
  <style>.t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#2C2924}.title{font-size:15px;font-weight:700}.h{font-size:13px;font-weight:700}.s{font-size:12px}.m{font-size:11px;fill:#5A544C}.line{stroke:#C4B8A8;stroke-width:1}.yes{fill:#EAF1E5;stroke:#6F8D5E}.no{fill:#F3E8E0;stroke:#A67C52}.need{fill:#E8F0F7;stroke:#4B6787}</style>
  <text x="24" y="28" class="t title">Each predicate answers a different question</text>
  <text x="24" y="48" class="t m">A check mark in one column does not silently fill another column.</text>
  <text x="28" y="92" class="t h">Example or definition</text><text x="322" y="92" class="t h">Stable</text><text x="420" y="92" class="t h">Equilibrium</text><text x="540" y="92" class="t h">Local attraction</text>
  <line x1="24" y1="104" x2="736" y2="104" class="line"/>
  <text x="36" y="137" class="t s">Nonzero translation</text><rect x="320" y="116" width="66" height="30" rx="7" class="yes"/><text x="353" y="136" text-anchor="middle" class="t s">yes</text><rect x="438" y="116" width="66" height="30" rx="7" class="no"/><text x="471" y="136" text-anchor="middle" class="t s">no</text><text x="560" y="136" class="t m">not applicable</text>
  <line x1="24" y1="158" x2="736" y2="158" class="line"/>
  <text x="36" y="191" class="t s">Identity at p</text><rect x="320" y="170" width="66" height="30" rx="7" class="yes"/><text x="353" y="190" text-anchor="middle" class="t s">yes</text><rect x="438" y="170" width="66" height="30" rx="7" class="yes"/><text x="471" y="190" text-anchor="middle" class="t s">yes</text><rect x="576" y="170" width="66" height="30" rx="7" class="no"/><text x="609" y="190" text-anchor="middle" class="t s">no</text>
  <line x1="24" y1="212" x2="736" y2="212" class="line"/>
  <text x="36" y="245" class="t s">Locally attracting equilibrium</text><text x="322" y="244" class="t m">not built in</text><rect x="438" y="224" width="66" height="30" rx="7" class="yes"/><text x="471" y="244" text-anchor="middle" class="t s">yes</text><rect x="576" y="224" width="66" height="30" rx="7" class="yes"/><text x="609" y="244" text-anchor="middle" class="t s">yes</text>
  <line x1="24" y1="266" x2="736" y2="266" class="line"/>
  <text x="36" y="303" class="t h">Asymptotically stable</text><rect x="302" y="278" width="102" height="36" rx="8" class="need"/><text x="353" y="301" text-anchor="middle" class="t s">Lyapunov</text><text x="421" y="301" class="t h">+</text><rect x="558" y="278" width="102" height="36" rx="8" class="need"/><text x="609" y="301" text-anchor="middle" class="t s">local basin</text>
  <rect x="24" y="334" width="712" height="34" rx="9" fill="#EAF1E5" stroke="#6F8D5E"/><text x="380" y="356" text-anchor="middle" class="t s">Asymptotic stability requires both the all-time bound and the long-time limit condition.</text>
</svg>
