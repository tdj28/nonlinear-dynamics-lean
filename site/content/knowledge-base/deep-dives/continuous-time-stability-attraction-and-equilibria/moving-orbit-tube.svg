<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" role="img" aria-labelledby="title desc">
  <title id="title">A moving orbit can be forward stable</title>
  <desc id="desc">Two parallel straight trajectories begin 0.2 units apart and keep that separation through a shaded tolerance band for all nonnegative real times.</desc>
  <rect width="760" height="330" fill="#F7F4F0"/>
  <style>.t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#2C2924}.title{font-size:15px;font-weight:700}.h{font-size:13px;font-weight:700}.s{font-size:12px}.m{font-size:11px;fill:#5A544C}.axis{stroke:#7F786D;stroke-width:1.4}.ref{stroke:#4B6787;stroke-width:4}.near{stroke:#A67C52;stroke-width:4}.dash{stroke:#A89B8C;stroke-width:1.5;stroke-dasharray:5 4}</style>
  <text x="24" y="28" class="t title">Translation preserves the initial gap for a continuum of times</text>
  <text x="24" y="48" class="t m">Here p = 1, x = 1.2, and both trajectories have velocity 3.</text>
  <line x1="66" y1="270" x2="720" y2="270" class="axis"/><text x="690" y="294" class="t s">t >= 0</text>
  <polygon points="84,236 694,82 694,142 84,296" fill="#EAF1E5" opacity="0.8"/>
  <line x1="84" y1="256" x2="694" y2="102" class="ref"/>
  <line x1="84" y1="280" x2="694" y2="126" class="near"/>
  <line x1="488" y1="154" x2="488" y2="178" class="dash"/>
  <text x="500" y="169" class="t s">gap 0.2</text>
  <text x="98" y="241" class="t h">reference orbit</text><text x="98" y="305" class="t h">nearby orbit</text>
  <rect x="24" y="64" width="276" height="50" rx="9" fill="#E8F0F7" stroke="#4B6787"/>
  <text x="42" y="86" class="t s">Stable: the same initial tolerance works</text><text x="42" y="104" class="t s">Not equilibrium: the reference point moves</text>
</svg>
