<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="factor-title factor-desc">
  <title id="factor-title">A four-direction cycle factors onto a two-axis toggle</title>
  <desc id="factor-desc">North, east, south, and west form a clockwise four-cycle. North and south project to the vertical axis, while east and west project to the horizontal axis. The target axes toggle. The projection is onto but not one-to-one because opposite directions merge.</desc>
  <defs><marker id="factor-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#A36B3F"/></marker><style>.paper{fill:#FBF7F0}.ink{fill:#26343A}.muted{fill:#655F57}.source{fill:#E8F0F7;stroke:#4B6787;stroke-width:2}.target{fill:#EAF1E5;stroke:#668357;stroke-width:2}.cycle{stroke:#A36B3F;stroke-width:3;fill:none;marker-end:url(#factor-arrow)}.project{stroke:#4B6787;stroke-width:2.5;stroke-dasharray:7 6;fill:none;marker-end:url(#factor-arrow)}.head{font:700 29px Georgia,serif}.title{font:700 18px Arial,sans-serif}.body{font:15px Arial,sans-serif}.value{font:700 17px Arial,sans-serif}</style></defs>
  <rect class="paper" width="1200" height="700" rx="18"/>
  <text class="head ink" x="60" y="58">A factor keeps the update pattern while forgetting orientation</text>
  <text class="body muted" x="60" y="88">Dashed arrows are the projection. Solid arrows are the dynamics.</text>
  <circle class="source" cx="300" cy="165" r="58"/><circle class="source" cx="470" cy="300" r="58"/><circle class="source" cx="300" cy="435" r="58"/><circle class="source" cx="130" cy="300" r="58"/>
  <text class="value ink" x="300" y="171" text-anchor="middle">north</text><text class="value ink" x="470" y="306" text-anchor="middle">east</text><text class="value ink" x="300" y="441" text-anchor="middle">south</text><text class="value ink" x="130" y="306" text-anchor="middle">west</text>
  <path class="cycle" d="M347 199 C390 220 420 245 435 258"/><path class="cycle" d="M437 342 C412 379 378 405 355 418"/><path class="cycle" d="M245 418 C205 396 173 367 158 347"/><path class="cycle" d="M158 253 C185 216 222 192 246 180"/>
  <rect class="target" x="760" y="190" width="300" height="92" rx="15"/><rect class="target" x="760" y="390" width="300" height="92" rx="15"/>
  <text class="title ink" x="910" y="245" text-anchor="middle">vertical axis</text><text class="title ink" x="910" y="445" text-anchor="middle">horizontal axis</text>
  <path class="cycle" d="M945 290 C995 318 995 352 945 382"/><path class="cycle" d="M875 382 C825 352 825 318 875 290"/>
  <path class="project" d="M360 165 C560 145 650 175 750 220"/><path class="project" d="M360 435 C560 455 650 305 750 260"/><path class="project" d="M530 300 C630 320 680 360 750 412"/><path class="project" d="M190 300 C440 330 620 375 750 425"/>
  <rect x="158" y="560" width="884" height="90" rx="13" fill="#26343A"/>
  <text class="title" fill="#FBF7F0" x="600" y="596" text-anchor="middle">Surjective but not injective</text>
  <text class="body" fill="#FBF7F0" x="600" y="625" text-anchor="middle">Both axes have representatives, but opposite directions have the same image.</text>
</svg>
