<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760"
     viewBox="0 0 1200 760" role="img"
     aria-labelledby="parity-boundary-title parity-boundary-desc">
  <title id="parity-boundary-title">Three parity-linked bits are pairwise independent but not mutually independent</title>
  <desc id="parity-boundary-desc">Four equally likely triples are zero zero zero, zero one one, one zero one, and one one zero. Every pair shows all four pair values once, but the all-zero triple has probability one quarter instead of the one eighth required by mutual independence.</desc>
  <rect width="1200" height="760" fill="#F7F4F0"/>
  <style>
    .t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#2C2924}
    .title{font-size:28px;font-weight:700}.sub{font-size:17px;fill:#5A544C}
    .h{font-size:19px;font-weight:700}.s{font-size:16px}.m{font-size:14px;fill:#5A544C}
    .num{font-size:20px;font-weight:700}
    .blue{fill:#E8F0F7;stroke:#4B6787;stroke-width:2}
    .cream{fill:#FBF9F6;stroke:#C4B8A8;stroke-width:2}
    .green{fill:#EAF1E5;stroke:#6F8D5E;stroke-width:2}
    .clay{fill:#F3E8E0;stroke:#A67C52;stroke-width:2}
    .line{stroke:#7F786D;stroke-width:1.6}
  </style>

  <text x="48" y="48" class="t title">Pairwise checks can all pass while mutual independence fails</text>
  <text x="48" y="78" class="t sub">Let C be the exclusive-or of two fair bits A and B. The four rows below are equally likely.</text>

  <rect x="48" y="112" width="430" height="500" rx="16" class="blue"/>
  <text x="72" y="150" class="t h">The complete probability space</text>
  <text x="72" y="177" class="t m">Each row has probability 1/4; C records whether A and B differ.</text>
  <rect x="86" y="208" width="354" height="306" rx="12" class="cream"/>
  <line x1="86" y1="258" x2="440" y2="258" class="line"/>
  <line x1="168" y1="208" x2="168" y2="514" class="line"/>
  <line x1="248" y1="208" x2="248" y2="514" class="line"/>
  <line x1="328" y1="208" x2="328" y2="514" class="line"/>
  <text x="111" y="241" class="t h">row</text><text x="200" y="241" class="t h">A</text><text x="280" y="241" class="t h">B</text><text x="359" y="241" class="t h">C</text>
  <text x="118" y="303" class="t s">1</text><text x="203" y="303" class="t s">0</text><text x="283" y="303" class="t s">0</text><text x="363" y="303" class="t s">0</text>
  <text x="118" y="365" class="t s">2</text><text x="203" y="365" class="t s">0</text><text x="283" y="365" class="t s">1</text><text x="363" y="365" class="t s">1</text>
  <text x="118" y="427" class="t s">3</text><text x="203" y="427" class="t s">1</text><text x="283" y="427" class="t s">0</text><text x="363" y="427" class="t s">1</text>
  <text x="118" y="489" class="t s">4</text><text x="203" y="489" class="t s">1</text><text x="283" y="489" class="t s">1</text><text x="363" y="489" class="t s">0</text>
  <rect x="86" y="536" width="354" height="48" rx="9" class="green"/>
  <text x="112" y="566" class="t s">Every bit is zero on exactly 2 of 4 rows.</text>

  <rect x="510" y="112" width="300" height="500" rx="16" class="green"/>
  <text x="534" y="150" class="t h">All three pair tests pass</text>
  <text x="534" y="178" class="t m">Each displayed zero-zero pair occurs once.</text>
  <rect x="546" y="218" width="228" height="82" rx="11" class="cream"/>
  <text x="576" y="247" class="t s">A = 0 and B = 0</text>
  <text x="575" y="279" class="t num">1/4 = 1/2 x 1/2</text>
  <rect x="546" y="322" width="228" height="82" rx="11" class="cream"/>
  <text x="576" y="351" class="t s">A = 0 and C = 0</text>
  <text x="575" y="383" class="t num">1/4 = 1/2 x 1/2</text>
  <rect x="546" y="426" width="228" height="82" rx="11" class="cream"/>
  <text x="576" y="455" class="t s">B = 0 and C = 0</text>
  <text x="575" y="487" class="t num">1/4 = 1/2 x 1/2</text>
  <text x="556" y="555" class="t h">PAIRWISE: PASS</text>
  <text x="556" y="582" class="t m">Every two-coordinate marginal factors.</text>

  <rect x="842" y="112" width="310" height="500" rx="16" class="clay"/>
  <text x="866" y="150" class="t h">The three-way test fails</text>
  <text x="866" y="178" class="t m">The first row is the all-zero event.</text>
  <rect x="878" y="218" width="238" height="106" rx="11" class="cream"/>
  <text x="908" y="251" class="t s">actual probability</text>
  <text x="948" y="294" class="t num">1/4</text>
  <rect x="878" y="346" width="238" height="106" rx="11" class="cream"/>
  <text x="901" y="379" class="t s">product of marginals</text>
  <text x="919" y="422" class="t num">1/2 x 1/2 x 1/2 = 1/8</text>
  <rect x="878" y="478" width="238" height="76" rx="11" class="blue"/>
  <text x="916" y="509" class="t h">1/4 is not 1/8</text>
  <text x="906" y="536" class="t m">C is fixed once A and B are known.</text>
  <text x="883" y="582" class="t h">MUTUAL: FAIL</text>

  <rect x="48" y="650" width="1104" height="70" rx="14" class="green"/>
  <text x="122" y="681" class="t s">Takeaway: pairwise independence inspects every pair; mutual independence factors every finite joint event.</text>
  <text x="212" y="706" class="t m">The parity model is a finite boundary example, not a Gaussian family.</text>
</svg>
