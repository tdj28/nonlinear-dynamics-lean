<svg xmlns="http://www.w3.org/2000/svg" width="760" height="590"
     viewBox="0 0 760 590" role="img"
     aria-labelledby="assumptionLadderTitle assumptionLadderDesc">
  <title id="assumptionLadderTitle">Use the weakest assumption at each proof rung</title>
  <desc id="assumptionLadderDesc">A five-rung ladder starts with exact invariance and no dynamics assumption. Pre-ergodic invariant-set rigidity, defined here as every measurable exactly invariant set being null or conull, gives almost-everywhere constancy. Positive finite mass and integrability identify the normalized average. Adding measure preservation creates full ergodicity, which supports Birkhoff convergence. Labels, numbered rungs, borders, and color distinguish the assumption layers.</desc>
  <rect width="760" height="590" fill="#F7F4F0"/>
  <style>
    .t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#2C2924}
    .title{font-size:15px;font-weight:700}.h{font-size:13px;font-weight:700}
    .s{font-size:12px}.m{font-size:11px;fill:#5A544C}.tag{font-size:10px;font-weight:700;letter-spacing:.5px}
    .blue{fill:#E8F0F7;stroke:#4B6787;stroke-width:1.5}
    .green{fill:#EAF1E5;stroke:#6F8D5E;stroke-width:1.5}
    .clay{fill:#F3E8E0;stroke:#A67C52;stroke-width:1.5}
    .cream{fill:#FBF9F6;stroke:#C4B8A8;stroke-width:1.5}
    .arrow{fill:none;stroke:#A67C52;stroke-width:2.2;marker-end:url(#assumptionArrow)}
  </style>
  <defs>
    <marker id="assumptionArrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#A67C52"/>
    </marker>
  </defs>

  <text x="24" y="28" class="t title">Use the weakest assumption at each proof rung</text>
  <text x="24" y="48" class="t m">Identification stops below full ergodicity; convergence needs measure preservation too.</text>

  <rect x="24" y="70" width="712" height="66" rx="12" class="blue"/>
  <rect x="42" y="86" width="94" height="22" rx="11" fill="#4B6787"/>
  <text x="89" y="101" text-anchor="middle" class="t tag" style="fill:#FFFDF8">RUNG ONE</text>
  <text x="158" y="100" class="t h">EXACT INVARIANCE OF THE SELECTED REPRESENTATIVE</text>
  <text x="158" y="120" class="t s">No ergodicity, preservation, mass, or integrability premise.</text>

  <path d="M 380 140 L 380 158" class="arrow"/>
  <rect x="24" y="164" width="712" height="84" rx="12" class="cream"/>
  <rect x="42" y="180" width="94" height="22" rx="11" fill="#7F786D"/>
  <text x="89" y="195" text-anchor="middle" class="t tag" style="fill:#FFFDF8">RUNG TWO</text>
  <text x="158" y="194" class="t h">PRE-ERGODIC INVARIANT-SET RIGIDITY</text>
  <text x="158" y="216" class="t s">Every measurable exactly invariant set is null or conull.</text>
  <text x="158" y="234" class="t m">Result: the invariant representative is one constant almost everywhere.</text>

  <path d="M 380 252 L 380 270" class="arrow"/>
  <rect x="24" y="276" width="712" height="78" rx="12" class="green"/>
  <rect x="42" y="292" width="94" height="22" rx="11" fill="#6F8D5E"/>
  <text x="89" y="307" text-anchor="middle" class="t tag" style="fill:#FFFDF8">RUNG THREE</text>
  <text x="158" y="306" class="t h">FINITE POSITIVE MASS AND INTEGRABILITY</text>
  <text x="158" y="328" class="t s">The integral identity fixes the constant as the normalized space average.</text>
  <text x="712" y="344" text-anchor="end" class="t tag">IDENTIFICATION COMPLETE</text>

  <path d="M 380 358 L 380 376" class="arrow"/>
  <rect x="90" y="382" width="580" height="76" rx="12" class="clay"/>
  <rect x="108" y="398" width="94" height="22" rx="11" fill="#A67C52"/>
  <text x="155" y="413" text-anchor="middle" class="t tag" style="fill:#FFFDF8">RUNG FOUR</text>
  <text x="224" y="412" class="t h">ADD MEASURE PRESERVATION</text>
  <text x="224" y="434" class="t s">Pre-ergodic rigidity plus preservation is full ergodicity.</text>

  <path d="M 380 462 L 380 480" class="arrow"/>
  <rect x="24" y="486" width="712" height="66" rx="12" class="green"/>
  <rect x="42" y="502" width="94" height="22" rx="11" fill="#6F8D5E"/>
  <text x="89" y="517" text-anchor="middle" class="t tag" style="fill:#FFFDF8">RUNG FIVE</text>
  <text x="158" y="516" class="t h">BIRKHOFF AVERAGES CONVERGE TO THE IDENTIFIED CONSTANT</text>
  <text x="158" y="536" class="t s">This final rung consumes the full ergodicity structure.</text>

  <rect x="24" y="566" width="712" height="12" rx="6" fill="#6F8D5E"/>
</svg>
