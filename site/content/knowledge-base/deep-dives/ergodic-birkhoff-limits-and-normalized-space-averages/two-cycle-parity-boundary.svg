<svg xmlns="http://www.w3.org/2000/svg" width="760" height="590"
     viewBox="0 0 760 590" role="img"
     aria-labelledby="twoCycleTitle twoCycleDesc">
  <title id="twoCycleTitle">A two-state flip is ergodic without being mixing</title>
  <desc id="twoCycleDesc">Two equally weighted states flip back and forth, alternating observable values A and B. Even averages equal their common mean exactly, and odd averages approach it from opposite sides. Event overlap alternates between one half and zero instead of approaching one quarter, so the flip is not mixing. Flipping twice gives the identity, whose singleton states remain invariant, so the second iterate is not ergodic. Labels, position, borders, and alternating patterns carry the distinctions in addition to color.</desc>
  <rect width="760" height="590" fill="#F7F4F0"/>
  <style>
    .t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#2C2924}
    .title{font-size:15px;font-weight:700}.h{font-size:13px;font-weight:700}
    .s{font-size:12px}.m{font-size:11px;fill:#5A544C}.tag{font-size:10px;font-weight:700;letter-spacing:.5px}
    .blue{fill:#E8F0F7;stroke:#4B6787;stroke-width:1.5}
    .green{fill:#EAF1E5;stroke:#6F8D5E;stroke-width:1.5}
    .clay{fill:#F3E8E0;stroke:#A67C52;stroke-width:1.5}
    .cream{fill:#FBF9F6;stroke:#C4B8A8;stroke-width:1.5}
    .arrow{fill:none;stroke:#A67C52;stroke-width:2.2;marker-end:url(#cycleArrow)}
  </style>
  <defs>
    <marker id="cycleArrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#A67C52"/>
    </marker>
  </defs>

  <text x="24" y="28" class="t title">A two-cycle reaches the mean but stops short of mixing</text>
  <text x="24" y="48" class="t m">The original flip is ergodic; parity exposes two stronger properties it does not have.</text>

  <rect x="24" y="70" width="712" height="132" rx="12" class="cream"/>
  <rect x="58" y="96" width="190" height="78" rx="12" class="blue"/>
  <text x="78" y="123" class="t h">STATE ZERO</text>
  <text x="78" y="148" class="t s">observable value A</text>
  <rect x="512" y="96" width="190" height="78" rx="12" class="clay"/>
  <text x="532" y="123" class="t h">STATE ONE</text>
  <text x="532" y="148" class="t s">observable value B</text>
  <path d="M 256 112 C 330 82, 430 82, 504 112" class="arrow"/>
  <path d="M 504 158 C 430 188, 330 188, 256 158" class="arrow"/>
  <text x="362" y="104" class="t tag">FLIP</text>
  <text x="362" y="181" class="t tag">FLIP</text>

  <rect x="24" y="220" width="344" height="100" rx="12" class="green"/>
  <rect x="42" y="238" width="112" height="22" rx="11" fill="#6F8D5E"/>
  <text x="98" y="253" text-anchor="middle" class="t tag" style="fill:#FFFDF8">EVEN HORIZONS</text>
  <text x="42" y="282" class="t h">EXACTLY THE AVERAGE OF A AND B</text>
  <text x="42" y="304" class="t s">Both starting states give the same value.</text>

  <rect x="392" y="220" width="344" height="100" rx="12" class="blue"/>
  <rect x="410" y="238" width="112" height="22" rx="11" fill="#4B6787"/>
  <text x="466" y="253" text-anchor="middle" class="t tag" style="fill:#FFFDF8">ODD HORIZONS</text>
  <text x="410" y="282" class="t h">OPPOSITE SMALL IMBALANCES</text>
  <text x="410" y="304" class="t s">Both sides still approach the same average.</text>

  <rect x="24" y="340" width="436" height="166" rx="12" class="clay"/>
  <rect x="42" y="358" width="96" height="22" rx="11" fill="#A67C52"/>
  <text x="90" y="373" text-anchor="middle" class="t tag" style="fill:#FFFDF8">NOT MIXING</text>
  <text x="158" y="373" class="t h">EVENT OVERLAP KEEPS ALTERNATING</text>
  <rect x="42" y="396" width="88" height="44" rx="8" class="cream"/>
  <rect x="144" y="396" width="88" height="44" rx="8" class="blue"/>
  <rect x="246" y="396" width="88" height="44" rx="8" class="cream"/>
  <rect x="348" y="396" width="88" height="44" rx="8" class="blue"/>
  <text x="86" y="423" text-anchor="middle" class="t s">ONE HALF</text>
  <text x="188" y="423" text-anchor="middle" class="t s">ZERO</text>
  <text x="290" y="423" text-anchor="middle" class="t s">ONE HALF</text>
  <text x="392" y="423" text-anchor="middle" class="t s">ZERO</text>
  <text x="42" y="468" class="t s">Mixing would require approach to one quarter.</text>
  <text x="42" y="488" class="t m">The alternating pattern never settles there.</text>

  <rect x="484" y="340" width="252" height="166" rx="12" class="blue"/>
  <rect x="502" y="358" width="122" height="22" rx="11" fill="#4B6787"/>
  <text x="563" y="373" text-anchor="middle" class="t tag" style="fill:#FFFDF8">SECOND ITERATE</text>
  <text x="502" y="410" class="t h">FLIP TWICE</text>
  <text x="502" y="432" class="t s">The result is the identity map.</text>
  <text x="502" y="458" class="t h">NOT ERGODIC</text>
  <text x="502" y="480" class="t s">Each singleton stays invariant.</text>

  <rect x="24" y="524" width="712" height="46" rx="10" class="green"/>
  <text x="44" y="552" class="t s">Original flip: measure preservation plus invariant-set rigidity, so it is ergodic.</text>
</svg>
