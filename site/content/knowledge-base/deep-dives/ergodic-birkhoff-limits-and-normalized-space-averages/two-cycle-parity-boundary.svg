<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700"
     viewBox="0 0 1000 700" role="img"
     aria-labelledby="twoCycleTitle twoCycleDesc">
  <title id="twoCycleTitle">The uniform two-state flip is ergodic but not mixing</title>
  <desc id="twoCycleDesc">States left and right each have mass one half and swap every step. Their observable values are three and seven, whose Birkhoff averages converge to five. For the event containing only left, overlap masses at times zero through seven alternate one half, zero, one half, zero, one half, zero, one half, zero instead of approaching one quarter. Applying the flip twice gives identity dynamics, under which both singletons are invariant, so the second iterate is not ergodic.</desc>
  <rect width="1000" height="700" fill="#F7F4F0"/>
  <style>
    .t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#2C2924}
    .title{font-size:22px;font-weight:700}.sub{font-size:15px;fill:#5A544C}
    .h{font-size:17px;font-weight:700}.s{font-size:14px}.m{font-size:13px;fill:#5A544C}
    .tag{font-size:12px;font-weight:700;letter-spacing:.7px}
    .blue{fill:#E8F0F7;stroke:#4B6787;stroke-width:2}
    .green{fill:#EAF1E5;stroke:#6F8D5E;stroke-width:2}
    .clay{fill:#F3E8E0;stroke:#A67C52;stroke-width:2}
    .cream{fill:#FBF9F6;stroke:#C4B8A8;stroke-width:2}
    .arrow{fill:none;stroke:#A67C52;stroke-width:3;marker-end:url(#cycleArrow)}
  </style>
  <defs>
    <marker id="cycleArrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#A67C52"/>
    </marker>
  </defs>

  <text x="36" y="42" class="t title">Ergodic does not mean mixing, even on two points</text>
  <text x="36" y="68" class="t sub">The Birkhoff limit is five, but a one-point overlap remembers the parity of time forever.</text>

  <rect x="36" y="94" width="928" height="162" rx="16" class="cream"/>
  <rect x="76" y="128" width="252" height="88" rx="14" class="blue"/>
  <text x="102" y="160" class="t h">LEFT</text>
  <text x="102" y="190" class="t s">mass 1/2   |   f = 3</text>
  <rect x="672" y="128" width="252" height="88" rx="14" class="clay"/>
  <text x="698" y="160" class="t h">RIGHT</text>
  <text x="698" y="190" class="t s">mass 1/2   |   f = 7</text>
  <path d="M 338 148 C 435 108, 565 108, 662 148" class="arrow"/>
  <path d="M 662 198 C 565 238, 435 238, 338 198" class="arrow"/>
  <text x="500" y="131" text-anchor="middle" class="t tag">T</text>
  <text x="500" y="234" text-anchor="middle" class="t tag">T</text>

  <rect x="36" y="284" width="928" height="216" rx="16" class="clay"/>
  <text x="62" y="318" class="t tag" style="fill:#8B3E33">EVENT E = {LEFT}</text>
  <text x="62" y="348" class="t h">overlap mass of E with the n-step preimage of E</text>

  <rect x="62" y="374" width="94" height="78" rx="10" class="cream"/>
  <rect x="170" y="374" width="94" height="78" rx="10" class="blue"/>
  <rect x="278" y="374" width="94" height="78" rx="10" class="cream"/>
  <rect x="386" y="374" width="94" height="78" rx="10" class="blue"/>
  <rect x="494" y="374" width="94" height="78" rx="10" class="cream"/>
  <rect x="602" y="374" width="94" height="78" rx="10" class="blue"/>
  <rect x="710" y="374" width="94" height="78" rx="10" class="cream"/>
  <rect x="818" y="374" width="94" height="78" rx="10" class="blue"/>
  <text x="109" y="400" text-anchor="middle" class="t tag">n = 0</text>
  <text x="217" y="400" text-anchor="middle" class="t tag">n = 1</text>
  <text x="325" y="400" text-anchor="middle" class="t tag">n = 2</text>
  <text x="433" y="400" text-anchor="middle" class="t tag">n = 3</text>
  <text x="541" y="400" text-anchor="middle" class="t tag">n = 4</text>
  <text x="649" y="400" text-anchor="middle" class="t tag">n = 5</text>
  <text x="757" y="400" text-anchor="middle" class="t tag">n = 6</text>
  <text x="865" y="400" text-anchor="middle" class="t tag">n = 7</text>
  <text x="109" y="434" text-anchor="middle" class="t h">1/2</text>
  <text x="217" y="434" text-anchor="middle" class="t h">0</text>
  <text x="325" y="434" text-anchor="middle" class="t h">1/2</text>
  <text x="433" y="434" text-anchor="middle" class="t h">0</text>
  <text x="541" y="434" text-anchor="middle" class="t h">1/2</text>
  <text x="649" y="434" text-anchor="middle" class="t h">0</text>
  <text x="757" y="434" text-anchor="middle" class="t h">1/2</text>
  <text x="865" y="434" text-anchor="middle" class="t h">0</text>
  <text x="62" y="480" class="t s">Mixing would require convergence to μ(E)² = 1/4. This sequence never converges.</text>

  <rect x="36" y="528" width="448" height="136" rx="16" class="green"/>
  <text x="62" y="562" class="t tag" style="fill:#315F55">WHAT STILL HOLDS</text>
  <text x="62" y="596" class="t h">Averages → 5 from both starts</text>
  <text x="62" y="624" class="t s">The original flip is measure preserving and ergodic.</text>
  <text x="62" y="646" class="t m">Mixing is stronger than this conclusion.</text>

  <rect x="516" y="528" width="448" height="136" rx="16" class="blue"/>
  <text x="542" y="562" class="t tag" style="fill:#284E72">WHAT FAILS FOR T SQUARED</text>
  <text x="542" y="596" class="t h">T² = identity</text>
  <text x="542" y="624" class="t s">Both singletons are invariant with mass 1/2.</text>
  <text x="542" y="646" class="t m">Ergodicity of T does not pass to every power.</text>
</svg>
