<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860" role="img" aria-labelledby="ledgerTitle ledgerDesc">
  <title id="ledgerTitle">Exact moment and scaling ledger for one anisotropic complex Gaussian</title>
  <desc id="ledgerDesc">A centered independent pair with real variance four and imaginary variance one is shifted to mean one minus two i. The symbol E denotes expectation. The centered squared-modulus moment is five and the full squared-modulus moment is ten. Scaling by negative two changes the mean to negative two plus four i, the component variances to sixteen and four, and the two moments to twenty and forty.</desc>
  <rect width="1200" height="860" fill="#F7F1E7"/>
  <style>
    .ink{fill:#16243A;font-family:Inter,Arial,Helvetica,sans-serif}
    .title{font-size:34px;font-weight:750}.sub{font-size:19px;fill:#4D5B6B}
    .h{font-size:23px;font-weight:750}.label{font-size:18px;font-weight:650}
    .value{font-size:23px;font-weight:750}.small{font-size:16px;fill:#4D5B6B}
    .card{fill:#FFFDF8;stroke:#BDAF9D;stroke-width:2}
    .blue{fill:#E7EFF7;stroke:#496B8A;stroke-width:2}
    .orange{fill:#F5E8DC;stroke:#A8652B;stroke-width:2}
    .green{fill:#E8F0E2;stroke:#587A4E;stroke-width:2}
    .axis{stroke:#8B8174;stroke-width:2}.arrow{stroke:#A8652B;stroke-width:4;fill:none}
  </style>
  <defs>
    <marker id="ledgerArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#A8652B"/>
    </marker>
  </defs>

  <text x="54" y="62" class="ink title">One exact Cartesian complex Gaussian ledger</text>
  <text x="54" y="94" class="ink sub">Keep the mean, both component variances, and both squared-modulus moments in separate slots.</text>

  <rect x="54" y="132" width="326" height="300" rx="20" class="card"/>
  <text x="82" y="174" class="ink h">1. Name the coordinates</text>
  <rect x="82" y="196" width="270" height="64" rx="12" class="blue"/>
  <text x="104" y="222" class="ink label">Z = 1 - 2i + X + iY</text>
  <text x="104" y="247" class="ink small">centered, independent coordinates</text>
  <text x="92" y="296" class="ink label">Mean(Re Z) = 1</text>
  <text x="92" y="326" class="ink label">Mean(Im Z) = -2</text>
  <text x="92" y="366" class="ink value">Var(Re Z) = 4</text>
  <text x="92" y="400" class="ink value">Var(Im Z) = 1</text>

  <path d="M392 282 H424" class="arrow" marker-end="url(#ledgerArrow)"/>

  <rect x="438" y="132" width="326" height="300" rx="20" class="card"/>
  <text x="466" y="174" class="ink h">2. Compute the moments</text>
  <rect x="466" y="198" width="270" height="78" rx="12" class="orange"/>
  <text x="488" y="228" class="ink label">Centered spread</text>
  <text x="488" y="258" class="ink value">E|Z - m|^2 = 4 + 1 = 5</text>
  <rect x="466" y="294" width="270" height="98" rx="12" class="green"/>
  <text x="488" y="324" class="ink label">Full squared modulus</text>
  <text x="488" y="354" class="ink value">E|Z|^2 = |m|^2 + 5</text>
  <text x="488" y="381" class="ink value">= (1 + 4) + 5 = 10</text>
  <text x="474" y="418" class="ink small">Pseudocovariance: 4 - 1 = 3</text>

  <path d="M776 282 H808" class="arrow" marker-end="url(#ledgerArrow)"/>

  <rect x="822" y="132" width="324" height="300" rx="20" class="card"/>
  <text x="850" y="174" class="ink h">3. Scale by c = -2</text>
  <rect x="850" y="196" width="268" height="64" rx="12" class="blue"/>
  <text x="872" y="222" class="ink label">W = -2 Z</text>
  <text x="872" y="247" class="ink small">real scaling preserves the axes</text>
  <text x="860" y="296" class="ink label">Mean(W) = -2 + 4i</text>
  <text x="860" y="330" class="ink value">variances = (16, 4)</text>
  <text x="860" y="366" class="ink value">E|W - E W|^2 = 20</text>
  <text x="860" y="400" class="ink value">E|W|^2 = 40</text>

  <rect x="54" y="468" width="1092" height="324" rx="20" class="card"/>
  <text x="82" y="510" class="ink h">The same numbers have a geometric reading</text>
  <text x="82" y="540" class="ink small">Contours are schematic, but centers and axis-variance labels are exact.</text>

  <line x1="122" y1="684" x2="500" y2="684" class="axis"/>
  <line x1="310" y1="566" x2="310" y2="764" class="axis"/>
  <ellipse cx="358" cy="636" rx="112" ry="54" fill="#E7EFF7" fill-opacity="0.8" stroke="#496B8A" stroke-width="4"/>
  <circle cx="358" cy="636" r="7" fill="#16243A"/>
  <text x="374" y="628" class="ink label">m = (1, -2)</text>
  <text x="160" y="730" class="ink small">horizontal variance 4</text>
  <text x="330" y="580" class="ink small">vertical variance 1</text>

  <path d="M540 650 H650" class="arrow" marker-end="url(#ledgerArrow)"/>
  <text x="572" y="610" class="ink label">c = -2</text>

  <line x1="700" y1="684" x2="1080" y2="684" class="axis"/>
  <line x1="890" y1="566" x2="890" y2="764" class="axis"/>
  <ellipse cx="794" cy="588" rx="154" ry="72" fill="#F5E8DC" fill-opacity="0.82" stroke="#A8652B" stroke-width="4"/>
  <circle cx="794" cy="588" r="7" fill="#16243A"/>
  <text x="666" y="574" class="ink label">scaled mean = (-2, 4)</text>
  <text x="714" y="730" class="ink small">horizontal variance 16</text>
  <text x="914" y="630" class="ink small">vertical variance 4</text>

  <rect x="54" y="810" width="1092" height="30" rx="10" fill="#16243A"/>
  <text x="600" y="831" text-anchor="middle" fill="#FFFDF8" font-family="Inter,Arial,Helvetica,sans-serif" font-size="16">Exact toy parameters, not sampled data: a law-level ledger determines every displayed number.</text>
</svg>
