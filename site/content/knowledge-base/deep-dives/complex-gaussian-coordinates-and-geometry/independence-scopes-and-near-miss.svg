<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860" role="img" aria-labelledby="scopeTitle scopeDesc">
  <title id="scopeTitle">Within-pair independence, family independence, and a copied-coordinate near-miss</title>
  <desc id="scopeDesc">The left panel shows independent real and imaginary coordinates with covariance matrix diagonal four and one. The middle panel shows equal standard Gaussian marginals copied from one variable, producing covariance matrix with every entry one, diagonal-line support, and pseudocovariance two i. The right panel shows that a two-coordinate family needs both product structure within each pair and independence between the pair-vectors. A bottom strip records the line-supported and point-mass zero-variance boundaries.</desc>
  <rect width="1200" height="860" fill="#F7F1E7"/>
  <style>
    .ink{fill:#16243A;font-family:Inter,Arial,Helvetica,sans-serif}
    .title{font-size:32px;font-weight:750}.sub{font-size:18px;fill:#4D5B6B}
    .h{font-size:22px;font-weight:750}.label{font-size:17px;font-weight:650}
    .value{font-size:20px;font-weight:750}.small{font-size:15px;fill:#4D5B6B}
    .card{fill:#FFFDF8;stroke:#BDAF9D;stroke-width:2}
    .good{fill:#E8F0E2;stroke:#587A4E;stroke-width:2}
    .warn{fill:#F5E8DC;stroke:#A8652B;stroke-width:2}
    .blue{fill:#E7EFF7;stroke:#496B8A;stroke-width:2}
    .axis{stroke:#8B8174;stroke-width:1.8}.link{stroke:#587A4E;stroke-width:3;fill:none}
    .missing{stroke:#A8652B;stroke-width:3;stroke-dasharray:8 7;fill:none}
  </style>
  <defs>
    <marker id="scopeArrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M0,0 L11,5.5 L0,11 z" fill="#587A4E"/>
    </marker>
  </defs>

  <text x="54" y="60" class="ink title">Gaussian marginals do not choose the dependence structure</text>
  <text x="54" y="92" class="ink sub">Product law inside one complex coordinate and mutual independence across coordinates are different proof obligations.</text>

  <rect x="54" y="128" width="334" height="424" rx="20" class="card"/>
  <text x="82" y="168" class="ink h">Cartesian running pair</text>
  <text x="82" y="197" class="ink label">X independent of Y</text>
  <rect x="82" y="220" width="278" height="86" rx="12" class="good"/>
  <text x="104" y="250" class="ink label">cross covariance = 0</text>
  <text x="104" y="280" class="ink value">covariance = [[4, 0], [0, 1]]</text>
  <line x1="112" y1="414" x2="332" y2="414" class="axis"/>
  <line x1="222" y1="324" x2="222" y2="500" class="axis"/>
  <ellipse cx="222" cy="414" rx="88" ry="40" fill="#E7EFF7" fill-opacity="0.8" stroke="#496B8A" stroke-width="4"/>
  <circle cx="222" cy="414" r="6" fill="#16243A"/>
  <text x="98" y="524" class="ink small">full-plane anisotropic law</text>
  <text x="244" y="346" class="ink small">pseudocovariance = 3</text>

  <rect x="414" y="128" width="334" height="424" rx="20" class="card"/>
  <text x="442" y="168" class="ink h">Copied coordinates: Y = X</text>
  <text x="442" y="197" class="ink label">equal marginals: mean 0, variance 1</text>
  <rect x="442" y="220" width="278" height="86" rx="12" class="warn"/>
  <text x="464" y="250" class="ink label">cross covariance = 1</text>
  <text x="464" y="280" class="ink value">covariance = [[1, 1], [1, 1]]</text>
  <line x1="472" y1="414" x2="692" y2="414" class="axis"/>
  <line x1="582" y1="324" x2="582" y2="500" class="axis"/>
  <line x1="500" y1="496" x2="664" y2="332" stroke="#A8652B" stroke-width="7" stroke-linecap="round"/>
  <circle cx="582" cy="414" r="6" fill="#16243A"/>
  <text x="458" y="524" class="ink small">support is the diagonal line y = x</text>
  <text x="604" y="346" class="ink small">pseudocovariance = 2i</text>

  <rect x="774" y="128" width="372" height="424" rx="20" class="card"/>
  <text x="802" y="168" class="ink h">Two-coordinate family</text>
  <text x="802" y="197" class="ink small">Both green gates are required.</text>
  <rect x="808" y="228" width="130" height="62" rx="12" class="blue"/>
  <text x="873" y="253" text-anchor="middle" class="ink label">pair 0</text>
  <text x="873" y="276" text-anchor="middle" class="ink small">(X0, Y0)</text>
  <rect x="982" y="228" width="130" height="62" rx="12" class="blue"/>
  <text x="1047" y="253" text-anchor="middle" class="ink label">pair 1</text>
  <text x="1047" y="276" text-anchor="middle" class="ink small">(X1, Y1)</text>
  <path d="M942 259 H976" class="link" marker-end="url(#scopeArrow)"/>
  <text x="960" y="326" text-anchor="middle" class="ink label">pair-vectors independent</text>
  <rect x="808" y="350" width="304" height="76" rx="12" class="good"/>
  <text x="960" y="379" text-anchor="middle" class="ink label">inside each pair</text>
  <text x="960" y="407" text-anchor="middle" class="ink value">law(Xj,Yj) = law(Xj) x law(Yj)</text>
  <rect x="808" y="446" width="304" height="76" rx="12" class="warn"/>
  <text x="960" y="475" text-anchor="middle" class="ink label">insufficient shortcut</text>
  <text x="960" y="503" text-anchor="middle" class="ink small">X-family independent + Y-family independent</text>

  <rect x="54" y="586" width="1092" height="214" rx="20" class="card"/>
  <text x="82" y="626" class="ink h">Zero-variance boundaries stay inside the same exact measure family</text>
  <rect x="82" y="652" width="478" height="116" rx="14" class="blue"/>
  <text x="108" y="684" class="ink label">One zero component variance</text>
  <text x="108" y="716" class="ink value">real variance = 0, imaginary variance = 1</text>
  <text x="108" y="746" class="ink small">Re Z = 1 almost surely; support is the vertical line x = 1.</text>
  <rect x="586" y="652" width="532" height="116" rx="14" class="good"/>
  <text x="612" y="684" class="ink label">Both component variances zero</text>
  <text x="612" y="716" class="ink value">both variances = 0 gives the Dirac law at 1 - 2i</text>
  <text x="612" y="746" class="ink small">The random variable equals its mean almost everywhere.</text>

  <text x="600" y="836" text-anchor="middle" class="ink small">Exact toy covariance and variance values; the diagrams are not empirical samples.</text>
</svg>
