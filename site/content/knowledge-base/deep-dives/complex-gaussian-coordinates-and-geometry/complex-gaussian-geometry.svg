<svg xmlns="http://www.w3.org/2000/svg" width="760" height="460" viewBox="0 0 760 460" role="img" aria-labelledby="geometryTitle geometryDesc">
  <title id="geometryTitle">Four exact component-variance pairs determine four support geometries</title>
  <desc id="geometryDesc">Four labeled panels compare component variances one and one, four and one, zero and one, and zero and zero. They produce circular contours, an axis-aligned ellipse, a vertical line-supported law, and a point mass respectively.</desc>
  <rect width="760" height="460" fill="#F7F4F0"/>
  <style>
    .t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#2C2924}
    .title{font-size:15px;font-weight:700}.h{font-size:13px;font-weight:700}
    .s{font-size:12px}.m{font-size:11px;fill:#5A544C}
    .card{fill:#FBF9F6;stroke:#C4B8A8;stroke-width:1.5}
    .axis{stroke:#A89B8C;stroke-width:1.1}
    .shapeA{fill:#E8F0F7;fill-opacity:.72;stroke:#4B6787;stroke-width:2}
    .shapeB{fill:#F3E8E0;fill-opacity:.72;stroke:#A67C52;stroke-width:2}
    .center{fill:#2C2924}
  </style>
  <text x="24" y="28" class="t title">Exact variance pairs control support and contour shape</text>
  <text x="24" y="48" class="t m">Each pair is ordered as (real variance, imaginary variance).</text>

  <rect x="24" y="72" width="344" height="140" rx="12" class="card"/>
  <text x="42" y="98" class="t h">variance pair = (1, 1)</text>
  <line x1="193" y1="113" x2="193" y2="193" class="axis"/>
  <line x1="118" y1="153" x2="268" y2="153" class="axis"/>
  <circle cx="193" cy="153" r="34" class="shapeA"/>
  <circle cx="193" cy="153" r="4" class="center"/>
  <text x="282" y="146" class="t s">circular</text>
  <text x="282" y="165" class="t m">full plane</text>

  <rect x="392" y="72" width="344" height="140" rx="12" class="card"/>
  <text x="410" y="98" class="t h">variance pair = (4, 1)</text>
  <line x1="561" y1="113" x2="561" y2="193" class="axis"/>
  <line x1="478" y1="153" x2="644" y2="153" class="axis"/>
  <ellipse cx="561" cy="153" rx="57" ry="25" class="shapeB"/>
  <circle cx="561" cy="153" r="4" class="center"/>
  <text x="654" y="146" class="t s">elliptical</text>
  <text x="654" y="165" class="t m">full plane</text>

  <rect x="24" y="232" width="344" height="140" rx="12" class="card"/>
  <text x="42" y="258" class="t h">variance pair = (0, 1)</text>
  <line x1="193" y1="273" x2="193" y2="353" class="axis"/>
  <line x1="118" y1="313" x2="268" y2="313" class="axis"/>
  <line x1="193" y1="276" x2="193" y2="350" stroke="#A67C52" stroke-width="6" stroke-linecap="round"/>
  <circle cx="193" cy="313" r="4" class="center"/>
  <text x="282" y="306" class="t s">line support</text>
  <text x="282" y="325" class="t m">no area density</text>

  <rect x="392" y="232" width="344" height="140" rx="12" class="card"/>
  <text x="410" y="258" class="t h">variance pair = (0, 0)</text>
  <line x1="561" y1="273" x2="561" y2="353" class="axis"/>
  <line x1="486" y1="313" x2="636" y2="313" class="axis"/>
  <circle cx="561" cy="313" r="9" fill="#EAF1E5" stroke="#6F8D5E" stroke-width="3"/>
  <text x="654" y="306" class="t s">point mass</text>
  <text x="654" y="325" class="t m">one exact value</text>

  <rect x="24" y="394" width="712" height="42" rx="10" fill="#EAF1E5" stroke="#6F8D5E" stroke-width="1.4"/>
  <text x="44" y="420" class="t s">The numeric pair decides the branch before any density or symmetry name is used.</text>
</svg>
