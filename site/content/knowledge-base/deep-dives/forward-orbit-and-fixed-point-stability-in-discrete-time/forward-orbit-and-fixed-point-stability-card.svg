<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Forward-orbit and fixed-point stability</title>
  <desc id="desc">Two starts remain inside one forward-time tube before a separate fixedness test.</desc>
  <rect width="1200" height="630" fill="#f1e9da"/>
  <rect x="38" y="38" width="1124" height="554" rx="28" fill="#fbf8f0" stroke="#315f63" stroke-width="4"/>
  <text x="76" y="104" font-family="Arial,sans-serif" font-size="21" letter-spacing="3" fill="#7a4d69">DEEP DIVE · DISCRETE DYNAMICS</text>
  <text x="76" y="166" font-family="Georgia,serif" font-size="43" fill="#23343b">Forward orbit or fixed point?</text>
  <rect x="80" y="225" width="610" height="210" rx="24" fill="#e4efe9" stroke="#315f63" stroke-width="3"/>
  <path d="M125 360 C260 285 380 390 635 275" fill="none" stroke="#315f63" stroke-width="7"/>
  <path d="M125 392 C260 317 380 422 635 307" fill="none" stroke="#b24b40" stroke-width="6"/>
  <text x="385" y="412" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#23343b">one δ controls every n ∈ ℕ</text>
  <path d="M700 330 H770" stroke="#8a6d38" stroke-width="5"/>
  <rect x="770" y="245" width="325" height="170" rx="24" fill="#eadfe7" stroke="#7a4d69" stroke-width="4"/>
  <text x="932" y="300" text-anchor="middle" font-family="Georgia,serif" font-size="29" fill="#23343b">Is f(p)=p?</text>
  <text x="932" y="344" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#7a4d69">fixedness is separate</text>
  <text x="76" y="510" font-family="Arial,sans-serif" font-size="21" fill="#b24b40">stability bounds separation · attraction asks for decay</text>
  <text x="76" y="558" font-family="Arial,sans-serif" font-size="18" fill="#7a4d69">public working note · professional review pending</text>
