<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
  <title id="title">One initial delta ball controls every forward epsilon ball</title>
  <desc id="desc">An initial delta ball maps into epsilon balls centered along a reference orbit at five natural-number times.</desc>
  <rect width="1200" height="690" fill="#f4eddf"/>
  <rect x="36" y="36" width="1128" height="618" rx="28" fill="#fffaf0" stroke="#315f63" stroke-width="3"/>
  <text x="74" y="92" font-family="Arial,sans-serif" font-size="20" letter-spacing="2" fill="#7a4d69">ONE INITIAL CHOICE · EVERY FORWARD TIME</text>
  <text x="74" y="142" font-family="Georgia,serif" font-size="31" fill="#23343b">δ-ball at time zero → ε-tube along the reference orbit</text>
  <path d="M150 420 C350 220 565 450 760 260 S1010 370 1080 210" fill="none" stroke="#315f63" stroke-width="7"/>
  <path d="M150 450 C350 250 565 480 760 290 S1010 400 1080 240" fill="none" stroke="#b24b40" stroke-width="5"/>
  <g fill="#e4efe9" stroke="#315f63" stroke-width="3"><circle cx="150" cy="420" r="62"/><circle cx="370" cy="292" r="62"/><circle cx="585" cy="393" r="62"/><circle cx="790" cy="241" r="62"/><circle cx="1025" cy="285" r="62"/></g>
  <g fill="#315f63"><circle cx="150" cy="420" r="9"/><circle cx="370" cy="292" r="9"/><circle cx="585" cy="393" r="9"/><circle cx="790" cy="241" r="9"/><circle cx="1025" cy="285" r="9"/></g>
  <g fill="#b24b40"><circle cx="150" cy="450" r="8"/><circle cx="370" cy="322" r="8"/><circle cx="585" cy="423" r="8"/><circle cx="790" cy="271" r="8"/><circle cx="1025" cy="315" r="8"/></g>
  <g font-family="Arial,sans-serif" font-size="18" fill="#23343b" text-anchor="middle"><text x="150" y="535">n=0</text><text x="370" y="535">n=1</text><text x="585" y="535">n=2</text><text x="790" y="535">n=3</text><text x="1025" y="535">n=4</text></g>
  <text x="150" y="585" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#8a6d38">initial δ</text>
  <text x="620" y="605" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#6a675f">each green disk is an ε-ball centered at fⁿ(p)</text>
</svg>
