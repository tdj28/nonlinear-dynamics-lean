<svg xmlns="http://www.w3.org/2000/svg" width="960" height="650" viewBox="0 0 960 650" role="img" aria-labelledby="congruenceTitle congruenceDesc">
  <title id="congruenceTitle">Exact two by two Hermitian reconstruction and permutation congruence ledger</title>
  <desc id="congruenceDesc">Diagonal coordinates one and three with upper coordinate one plus two i reconstruct the Hermitian matrix with rows one, one plus two i and one minus two i, three. Congruence by the coordinate-swap permutation produces rows three, one minus two i and one plus two i, one. Both matrices are Hermitian, both have trace four and squared Frobenius norm twenty, but the matrices are not equal.</desc>
  <rect width="960" height="650" fill="#F7F1E7"/>
  <style>
    .text{font-family:Inter,Arial,Helvetica,sans-serif;fill:#18283C}
    .title{font-size:22px;font-weight:700}.head{font-size:15px;font-weight:700}
    .body{font-size:14px}.small{font-size:12px}.muted{font-size:12px;fill:#4C5968}
    .panel{fill:#FFFDF8;stroke:#B9AA98;stroke-width:1.5}
    .blue{fill:#E7F0F7;stroke:#4C6E91;stroke-width:1.5}
    .orange{fill:#F5E8DB;stroke:#A75D26;stroke-width:1.5}
    .green{fill:#E8F1E3;stroke:#557B4C;stroke-width:1.6}
    .cell{fill:#FFFDF8;stroke:#8D8173;stroke-width:1.2}
    .arrow{fill:none;stroke:#59697A;stroke-width:2;marker-end:url(#arrow)}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#59697A"/>
    </marker>
  </defs>

  <text x="28" y="36" class="text title">One matrix changes; its Hermitian geometry does not</text>
  <text x="28" y="59" class="text muted">Exact toy calculation over Gaussian-integer entries, with no sampling or density formula.</text>

  <rect x="28" y="84" width="258" height="261" rx="14" class="panel"/>
  <text x="48" y="114" class="text head">1. Free coordinates</text>
  <rect x="48" y="134" width="218" height="112" rx="10" class="blue"/>
  <text x="70" y="165" class="text body">diagonal d0 = 1</text>
  <text x="70" y="194" class="text body">diagonal d1 = 3</text>
  <text x="70" y="223" class="text body">upper z = 1 + 2i</text>
  <text x="48" y="275" class="text small">lower entry = conjugate(z)</text>
  <text x="48" y="299" class="text body">intrinsic coordinates:</text>
  <text x="48" y="325" class="text small">q = (1, 3, sqrt(2), 2 sqrt(2))</text>

  <path d="M288 214 L326 214" class="arrow"/>
  <rect x="332" y="84" width="252" height="261" rx="14" class="panel"/>
  <text x="352" y="114" class="text head">2. Reconstructed H</text>
  <rect x="364" y="137" width="94" height="69" class="cell"/>
  <rect x="458" y="137" width="94" height="69" class="orange"/>
  <rect x="364" y="206" width="94" height="69" class="orange"/>
  <rect x="458" y="206" width="94" height="69" class="cell"/>
  <text x="405" y="178" text-anchor="middle" class="text body">1</text>
  <text x="505" y="178" text-anchor="middle" class="text body">1 + 2i</text>
  <text x="411" y="247" text-anchor="middle" class="text body">1 - 2i</text>
  <text x="505" y="247" text-anchor="middle" class="text body">3</text>
  <text x="352" y="300" class="text small">H* = H because lower = conjugate(upper).</text>
  <text x="352" y="325" class="text small">trace = 1 + 3 = 4</text>

  <path d="M586 214 L624 214" class="arrow"/>
  <rect x="630" y="84" width="302" height="261" rx="14" class="panel"/>
  <text x="650" y="114" class="text head">3. Swap congruence P H P*</text>
  <text x="650" y="139" class="text small">P swaps the two coordinate axes and P* = P.</text>
  <rect x="667" y="158" width="106" height="69" class="cell"/>
  <rect x="773" y="158" width="126" height="69" class="orange"/>
  <rect x="667" y="227" width="106" height="69" class="orange"/>
  <rect x="773" y="227" width="126" height="69" class="cell"/>
  <text x="720" y="199" text-anchor="middle" class="text body">3</text>
  <text x="836" y="199" text-anchor="middle" class="text body">1 - 2i</text>
  <text x="720" y="268" text-anchor="middle" class="text body">1 + 2i</text>
  <text x="836" y="268" text-anchor="middle" class="text body">1</text>
  <text x="650" y="321" class="text small">q' = (3, 1, sqrt(2), -2 sqrt(2))</text>

  <rect x="28" y="373" width="904" height="214" rx="15" class="green"/>
  <text x="52" y="405" class="text head">Four checks a reader can audit</text>
  <rect x="52" y="425" width="198" height="93" rx="10" class="panel"/>
  <text x="70" y="454" class="text head">Hermiticity</text>
  <text x="70" y="480" class="text body">H* = H</text>
  <text x="70" y="503" class="text body">(P H P*)* = P H P*</text>
  <rect x="268" y="425" width="190" height="93" rx="10" class="panel"/>
  <text x="286" y="454" class="text head">Trace</text>
  <text x="286" y="480" class="text body">1 + 3 = 4</text>
  <text x="286" y="503" class="text body">3 + 1 = 4</text>
  <rect x="476" y="425" width="245" height="93" rx="10" class="panel"/>
  <text x="494" y="454" class="text head">Squared Frobenius norm</text>
  <text x="494" y="480" class="text body">1 + 5 + 5 + 9 = 20</text>
  <text x="494" y="503" class="text body">9 + 5 + 5 + 1 = 20</text>
  <rect x="739" y="425" width="169" height="93" rx="10" class="orange"/>
  <text x="757" y="454" class="text head">Pointwise change</text>
  <text x="757" y="480" class="text body">H != P H P*</text>
  <text x="757" y="503" class="text small">top-left: 1 != 3</text>
  <text x="52" y="553" class="text body">Norm check in intrinsic coordinates: 1^2 + 3^2 + (sqrt(2))^2 + (2 sqrt(2))^2 = 20.</text>
  <text x="52" y="577" class="text small">Preserving geometry does not mean preserving each point. Law invariance is a separate measure equality.</text>
</svg>
