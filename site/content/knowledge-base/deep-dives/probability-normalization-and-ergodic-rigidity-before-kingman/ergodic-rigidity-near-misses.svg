<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Three two-point systems separate ergodicity, probability normalization, and invariant rigidity</title>
  <desc id="desc">With uniform probability and the swap map, only the empty and full events are invariant, with masses zero and one, and invariant observables are constant. With uniform probability and the identity map, the singleton a is invariant with mass one half and the observable zero at a and two at b is invariant but nonconstant. With raw mass and the swap map, the system is ergodic but the full invariant event has mass two, so normalization is required for the numerical zero-one law.</desc>
  <defs>
    <style>
      .bg { fill: #f7f2e8; }
      .ink { fill: #18283b; }
      .muted { fill: #566273; }
      .navy { fill: #244d70; }
      .green { fill: #2f6658; }
      .orange { fill: #b86025; }
      .red { fill: #98483c; }
      .panel { fill: #fffdf8; stroke: #c9bdac; stroke-width: 2; }
      .good { fill: #e9f2e7; stroke: #719267; stroke-width: 2; }
      .bad { fill: #f7e7e2; stroke: #b45c4c; stroke-width: 2; }
      .raw { fill: #f7e8da; stroke: #bd713d; stroke-width: 2; }
      .node { fill: #e7f0f7; stroke: #4d7292; stroke-width: 2; }
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .h1 { font-size: 32px; font-weight: 700; }
      .h2 { font-size: 20px; font-weight: 700; letter-spacing: .4px; }
      .body { font-size: 18px; }
      .small { font-size: 16px; }
      .big { font-size: 27px; font-weight: 700; }
    </style>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4d7292"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b45c4c"/>
    </marker>
  </defs>

  <rect class="bg" width="1200" height="760"/>
  <rect x="0" y="0" width="1200" height="18" class="navy"/>
  <text x="60" y="67" class="ink h1">Invariant events reveal exactly which gate is missing</text>
  <text x="60" y="101" class="muted body">Every column uses Ω={a,b}; the map or the measure scale changes.</text>

  <rect x="45" y="128" width="350" height="562" rx="22" class="good"/>
  <text x="70" y="166" class="green h2">μ UNIFORM + SWAP</text>
  <text x="70" y="195" class="muted small">μ(a)=μ(b)=1/2 · ergodic</text>
  <circle cx="142" cy="262" r="29" class="node"/>
  <circle cx="298" cy="262" r="29" class="node"/>
  <text x="133" y="270" class="navy big">a</text>
  <text x="290" y="270" class="navy big">b</text>
  <path d="M 174 248 C 210 216, 254 216, 286 248" fill="none" stroke="#4d7292" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
  <path d="M 286 277 C 250 310, 206 310, 174 277" fill="none" stroke="#4d7292" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
  <rect x="70" y="331" width="300" height="115" rx="14" class="panel"/>
  <text x="88" y="365" class="ink body">strict invariant events</text>
  <text x="88" y="400" class="green big">∅, Ω</text>
  <text x="88" y="430" class="muted small">masses 0 and 1</text>
  <rect x="70" y="467" width="300" height="148" rx="14" class="panel"/>
  <text x="88" y="502" class="ink body">invariant g requires</text>
  <text x="88" y="540" class="green big">g(a) = g(b)</text>
  <text x="88" y="573" class="muted small">so g is constant here</text>
  <text x="70" y="657" class="green h2">BOTH RIGIDITY RESULTS FIT</text>

  <rect x="425" y="128" width="350" height="562" rx="22" class="bad"/>
  <text x="450" y="166" class="red h2">μ UNIFORM + IDENTITY</text>
  <text x="450" y="195" class="muted small">μ(a)=μ(b)=1/2 · nonergodic</text>
  <circle cx="522" cy="262" r="29" class="node"/>
  <circle cx="678" cy="262" r="29" class="node"/>
  <text x="513" y="270" class="navy big">a</text>
  <text x="670" y="270" class="navy big">b</text>
  <path d="M 506 231 C 474 193, 565 186, 540 231" fill="none" stroke="#b45c4c" stroke-width="2.5" marker-end="url(#arrowRed)"/>
  <path d="M 662 231 C 630 193, 721 186, 696 231" fill="none" stroke="#b45c4c" stroke-width="2.5" marker-end="url(#arrowRed)"/>
  <rect x="450" y="331" width="300" height="115" rx="14" class="panel"/>
  <text x="468" y="365" class="ink body">near-miss event {a}</text>
  <text x="468" y="402" class="red big">T⁻¹{a}={a}</text>
  <text x="468" y="431" class="muted small">but μ({a}) = 1/2</text>
  <rect x="450" y="467" width="300" height="148" rx="14" class="panel"/>
  <text x="468" y="502" class="ink body">near-miss observable</text>
  <text x="468" y="540" class="red big">g(a)=0, g(b)=2</text>
  <text x="468" y="573" class="muted small">invariant, yet nonconstant</text>
  <text x="450" y="657" class="red h2">ERGODICITY IS MISSING</text>

  <rect x="805" y="128" width="350" height="562" rx="22" class="raw"/>
  <text x="830" y="166" class="orange h2">ν RAW + SWAP</text>
  <text x="830" y="195" class="muted small">ν(a)=ν(b)=1 · ergodic</text>
  <circle cx="902" cy="262" r="29" class="node"/>
  <circle cx="1058" cy="262" r="29" class="node"/>
  <text x="893" y="270" class="navy big">a</text>
  <text x="1050" y="270" class="navy big">b</text>
  <path d="M 934 248 C 970 216, 1014 216, 1046 248" fill="none" stroke="#4d7292" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
  <path d="M 1046 277 C 1010 310, 966 310, 934 277" fill="none" stroke="#4d7292" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
  <rect x="830" y="331" width="300" height="115" rx="14" class="panel"/>
  <text x="848" y="365" class="ink body">strict invariant events</text>
  <text x="848" y="400" class="orange big">∅, Ω</text>
  <text x="848" y="430" class="muted small">masses 0 and 2</text>
  <rect x="830" y="467" width="300" height="148" rx="14" class="panel"/>
  <text x="848" y="502" class="ink body">invariant g still has</text>
  <text x="848" y="540" class="green big">g(a) = g(b)</text>
  <text x="848" y="573" class="muted small">function rigidity survives</text>
  <text x="830" y="644" class="orange h2">NUMERIC 0/1 FAILS:</text>
  <text x="830" y="672" class="orange h2">NORMALIZATION IS MISSING</text>

  <text x="600" y="731" text-anchor="middle" class="muted small">Ergodicity controls invariant information; probability normalization converts null/conull into the numbers 0 and 1.</text>
</svg>
