<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Finite Hamiltonians, unitary evolution, and normalized trace</title>
  <desc id="desc">A Deep Dive card shows a two-level Hermitian Hamiltonian, its minus-i-time unitary evolution, normalized trace, and a boundary before quantum-chaos claims.</desc>
  <rect width="1200" height="630" fill="#f1e9da"/>
  <rect x="40" y="40" width="1120" height="550" rx="28" fill="#fffaf1" stroke="#315f63" stroke-width="4"/>
  <text x="78" y="105" font-family="system-ui,sans-serif" font-size="25" font-weight="750" fill="#2d7f73">KNOWLEDGE BASE · DEEP DIVE</text>
  <text x="78" y="172" font-family="system-ui,sans-serif" font-size="43" font-weight="780" fill="#16324f">FINITE HAMILTONIANS, UNITARY</text>
  <text x="78" y="224" font-family="system-ui,sans-serif" font-size="43" font-weight="780" fill="#16324f">EVOLUTION, AND NORMALIZED TRACE</text>
  <rect x="88" y="266" width="1024" height="112" rx="20" fill="#dfece3" stroke="#315f63" stroke-width="3"/>
  <text x="600" y="308" text-anchor="middle" font-family="Georgia,serif" font-size="31" fill="#263c3b">H = diag(1, −1)   ·   U_H(t) = exp(−itH)</text>
  <text x="600" y="349" text-anchor="middle" font-family="system-ui,sans-serif" font-size="20" font-weight="650" fill="#285448">ONE CARRIER · ONE SIGN · ONE ZERO-DIMENSION POLICY</text>
  <rect x="90" y="412" width="310" height="96" rx="18" fill="#e4eef4"/>
  <rect x="445" y="412" width="310" height="96" rx="18" fill="#f3dfca"/>
  <rect x="800" y="412" width="310" height="96" rx="18" fill="#f5dddd"/>
  <text x="245" y="451" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" font-weight="700" fill="#16324f">UNITARY GROUP LAW</text>
  <text x="245" y="483" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" fill="#263c3b">U(s+t) = U(s)U(t)</text>
  <text x="600" y="451" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" font-weight="700" fill="#70442d">NORMALIZED TRACE</text>
  <text x="600" y="483" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" fill="#263c3b">τ_n(A) = n⁻¹ Tr(A)</text>
  <text x="955" y="451" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" font-weight="700" fill="#8a3333">CLAIM BOUNDARY</text>
  <text x="955" y="483" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" fill="#263c3b">no chaos diagnostic yet</text>
  <text x="600" y="558" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" font-weight="650" fill="#285448">FINITE WORKSHEET · GENERAL LEAN INTERFACE · EXPLICIT LIMITS</text>
</svg>
