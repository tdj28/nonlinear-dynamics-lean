<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420"
     viewBox="0 0 760 420" role="img"
     aria-labelledby="finiteBlocksTitle finiteBlocksDesc">
  <title id="finiteBlocksTitle">Two finite block-and-remainder orientations</title>
  <desc id="finiteBlocksDesc">The first row places three equal full blocks before a short terminal remainder. The second row places the same short remainder first and then starts the three equal blocks from a shifted sample. A footer states that both are finite upper bounds and neither is a limit theorem.</desc>
  <rect width="760" height="420" fill="#F7F4F0"/>
  <style>
    .t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#2C2924}
    .title{font-size:15px;font-weight:700}
    .h{font-size:13px;font-weight:700}
    .s{font-size:12px}
    .m{font-size:11px;fill:#5A544C}
    .row{fill:#FBF9F6;stroke:#C4B8A8;stroke-width:1.5}
    .block{fill:#E8F0F7;stroke:#4B6787;stroke-width:1.5}
    .remainder{fill:#F3E8E0;stroke:#A67C52;stroke-width:1.5}
    .guide{stroke:#A89B8C;stroke-width:1.2;stroke-dasharray:5 4}
  </style>

  <text x="24" y="28" class="t title">Two legal cuts through the same finite horizon</text>
  <text x="24" y="48" class="t m">Subadditivity follows temporal order, so moving the short piece changes every later sample.</text>

  <rect x="24" y="70" width="712" height="126" rx="12" class="row"/>
  <text x="44" y="98" class="t h">BLOCKS FIRST</text>
  <text x="44" y="118" class="t m">Short piece stays at the far boundary</text>
  <line x1="200" y1="103" x2="588" y2="103" class="guide"/>
  <rect x="200" y="123" width="100" height="42" rx="8" class="block"/>
  <rect x="306" y="123" width="100" height="42" rx="8" class="block"/>
  <rect x="412" y="123" width="100" height="42" rx="8" class="block"/>
  <rect x="518" y="123" width="70" height="42" rx="8" class="remainder"/>
  <text x="219" y="149" class="t s">Full block</text>
  <text x="325" y="149" class="t s">Full block</text>
  <text x="431" y="149" class="t s">Full block</text>
  <text x="529" y="142" class="t m">Short</text>
  <text x="527" y="156" class="t m">piece</text>
  <text x="200" y="184" class="t m">Each full block advances the sample by one block.</text>
  <text x="591" y="149" class="t h">END</text>

  <rect x="24" y="212" width="712" height="126" rx="12" class="row"/>
  <text x="44" y="240" class="t h">REMAINDER FIRST</text>
  <text x="44" y="260" class="t m">Full blocks begin from a shifted sample</text>
  <line x1="200" y1="245" x2="588" y2="245" class="guide"/>
  <rect x="200" y="265" width="70" height="42" rx="8" class="remainder"/>
  <rect x="276" y="265" width="100" height="42" rx="8" class="block"/>
  <rect x="382" y="265" width="100" height="42" rx="8" class="block"/>
  <rect x="488" y="265" width="100" height="42" rx="8" class="block"/>
  <text x="211" y="284" class="t m">Short</text>
  <text x="209" y="298" class="t m">piece</text>
  <text x="295" y="291" class="t s">Full block</text>
  <text x="401" y="291" class="t s">Full block</text>
  <text x="507" y="291" class="t s">Full block</text>
  <text x="200" y="326" class="t m">The first short piece shifts the starting sample for every full block.</text>
  <text x="591" y="291" class="t h">END</text>

  <rect x="24" y="356" width="712" height="44" rx="10" fill="#EAF1E5" stroke="#6F8D5E" stroke-width="1.5"/>
  <text x="52" y="383" class="t s">Both routes are finite upper bounds. Neither route states what happens at infinite time.</text>
</svg>
