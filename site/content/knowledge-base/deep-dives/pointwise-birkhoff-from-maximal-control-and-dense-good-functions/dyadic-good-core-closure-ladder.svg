<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720"
     viewBox="0 0 1200 720" role="img"
     aria-labelledby="dyadicLadderTitle dyadicLadderDesc">
  <title id="dyadicLadderTitle">Dyadic pointwise-good approximants shrink a fixed Cauchy-failure bound</title>
  <desc id="dyadicLadderDesc">For the eight-cycle target with spike one third, four periodic approximants use spike heights zero, one quarter, five sixteenths, and twenty-one sixty-fourths. Their uniform L1 errors are one twenty-fourth, one ninety-sixth, one three-hundred-eighty-fourth, and one fifteen-hundred-thirty-sixth. At Cauchy scale one quarter the corresponding closure bounds are one half, one eighth, one thirty-second, and one one-hundred-twenty-eighth. Since one atom has mass one eighth, the third bound is too small for a nonempty exceptional set. A boundary panel notes that scale zero makes every point exceptional.</desc>
  <rect width="1200" height="720" fill="#F7F4F0"/>
  <style>
    .t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#2C2924}
    .serif{font-family:Georgia,Times,serif;fill:#17243A}
    .title{font-size:31px;font-weight:700}
    .eyebrow{font-size:15px;font-weight:700;letter-spacing:1.5px;fill:#A95320}
    .h{font-size:17px;font-weight:700}
    .s{font-size:14px}
    .m{font-size:12px;fill:#4D5B6B}
    .mono{font-family:Menlo,Consolas,monospace;font-size:14px;fill:#17243A}
    .light{fill:#FFFDF8}
    .neutral{fill:#FBF9F6;stroke:#C4B8A8;stroke-width:1.5}
    .data{fill:#E8F0F7;stroke:#4B6787;stroke-width:1.5}
    .keep{fill:#EAF1E5;stroke:#6F8D5E;stroke-width:1.5}
    .warn{fill:#F3E8E0;stroke:#A67C52;stroke-width:1.5}
    .navy{fill:#17243A}
    .blue{fill:#284E72}
    .green{fill:#47633B}
    .rust{fill:#934F1F}
  </style>

  <text x="70" y="40" class="t eyebrow">DENSE-GOOD CORE · ONE FIXED SCALE ε = 1/4</text>
  <text x="70" y="78" class="serif title">Better good approximants squeeze the bad-set bound to zero</text>
  <text x="70" y="105" class="t m">Target spike 1/3 · dyadic spike qᵣ · all approximants are pointwise-good because the model is eight-periodic</text>

  <rect x="64" y="128" width="710" height="354" rx="16" class="neutral"/>
  <text x="86" y="160" class="t h">Exact approximation ladder</text>
  <rect x="84" y="179" width="670" height="42" rx="8" class="data"/>
  <text x="104" y="205" class="t h">r</text>
  <text x="161" y="205" class="t h">spike qᵣ</text>
  <text x="304" y="205" class="t h">‖f−gᵣ‖₁</text>
  <text x="456" y="205" class="t h">3‖f−gᵣ‖₁/ε</text>
  <text x="636" y="205" class="t h">good?</text>

  <rect x="84" y="231" width="670" height="51" rx="8" class="data"/>
  <text x="108" y="262" class="mono">0</text>
  <text x="174" y="262" class="mono">0</text>
  <text x="304" y="262" class="mono">1/24</text>
  <text x="494" y="262" class="mono">1/2</text>
  <text x="638" y="262" class="t s green">periodic ✓</text>

  <rect x="84" y="291" width="670" height="51" rx="8" class="data"/>
  <text x="108" y="322" class="mono">1</text>
  <text x="162" y="322" class="mono">1/4</text>
  <text x="304" y="322" class="mono">1/96</text>
  <text x="494" y="322" class="mono">1/8</text>
  <text x="638" y="322" class="t s green">periodic ✓</text>

  <rect x="84" y="351" width="670" height="51" rx="8" class="keep"/>
  <text x="108" y="382" class="mono">2</text>
  <text x="154" y="382" class="mono">5/16</text>
  <text x="296" y="382" class="mono">1/384</text>
  <text x="486" y="382" class="mono">1/32</text>
  <text x="638" y="382" class="t s green">periodic ✓</text>

  <rect x="84" y="411" width="670" height="51" rx="8" class="data"/>
  <text x="108" y="442" class="mono">3</text>
  <text x="146" y="442" class="mono">21/64</text>
  <text x="288" y="442" class="mono">1/1536</text>
  <text x="478" y="442" class="mono">1/128</text>
  <text x="638" y="442" class="t s green">periodic ✓</text>

  <rect x="798" y="128" width="338" height="213" rx="16" class="keep"/>
  <text x="820" y="160" class="t eyebrow">FINITE ATOM CHECK</text>
  <text x="820" y="194" class="serif h">A nonempty bad set costs one atom</text>
  <text x="820" y="228" class="mono">atom mass = 1/8</text>
  <text x="820" y="260" class="mono">r=2 bound = 1/32</text>
  <rect x="820" y="278" width="294" height="43" rx="9" class="neutral"/>
  <text x="967" y="305" class="t h green" text-anchor="middle">1/32 &lt; 1/8 ⇒ D₁⁄₄ = ∅</text>

  <rect x="798" y="365" width="338" height="117" rx="16" class="data"/>
  <text x="820" y="397" class="t eyebrow">GENERAL CLOSURE MOVE</text>
  <text x="820" y="427" class="t s">No atom-size shortcut is needed.</text>
  <text x="820" y="452" class="t s">Arbitrary L¹ accuracy makes μ(Dε)</text>
  <text x="820" y="473" class="t s">smaller than every positive η, hence zero.</text>

  <rect x="64" y="508" width="516" height="137" rx="16" class="warn"/>
  <text x="86" y="541" class="t eyebrow">NEARBY FAILURE: ε = 0</text>
  <text x="86" y="573" class="t s">Choose m=n=N. Then |A_m f − A_n f|=0 and 0≤0.</text>
  <text x="86" y="600" class="t h rust">Every point lies in D₀.</text>
  <text x="86" y="625" class="t m">Strict positivity is required before dividing by ε/3.</text>

  <rect x="604" y="508" width="532" height="137" rx="16" class="neutral"/>
  <text x="626" y="541" class="t eyebrow">FROM ONE SCALE TO CONVERGENCE</text>
  <text x="626" y="573" class="mono">D₁, D₁⁄₂, D₁⁄₃, … all null</text>
  <text x="626" y="600" class="t h blue">countable union null ⇒ Cauchy almost everywhere</text>
  <text x="626" y="625" class="t m">Completeness of ℝ supplies a limit; this step does not identify it.</text>

  <rect x="0" y="676" width="1200" height="44" class="navy"/>
  <text x="600" y="704" class="t s light" text-anchor="middle">GOOD APPROXIMANTS + MAXIMAL CONTROL ⇒ CLOSED POINTWISE-GOOD CLASS · LIMIT FORMULA STILL OPEN</text>
</svg>
