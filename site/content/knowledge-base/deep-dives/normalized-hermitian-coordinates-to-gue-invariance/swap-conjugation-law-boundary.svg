<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900"
     viewBox="0 0 1200 900" role="img"
     aria-labelledby="swap-law-title swap-law-desc">
  <title id="swap-law-title">Swap conjugation changes the concrete matrix but preserves its norm and the full Gaussian unitary ensemble law</title>
  <desc id="swap-law-desc">The Hermitian matrix with rows two, one plus two i and one minus two i, minus one is conjugated by the two by two coordinate-swap unitary. The result has rows minus one, one minus two i and one plus two i, two, so it is not the same matrix. Both matrices have Frobenius square fifteen. Their normalized real coordinates are two, minus one, square root two, two square root two and minus one, two, square root two, minus two square root two. At the law level, the pushforward of the ambient Gaussian unitary ensemble matrix law under this congruence equals the original law.</desc>
  <defs>
    <marker id="swap-law-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#A67C52"/>
    </marker>
  </defs>
  <rect width="1200" height="900" fill="#F7F4F0"/>
  <style>
    .t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#2C2924}
    .title{font-size:28px;font-weight:700}.sub{font-size:17px;fill:#5A544C}
    .h{font-size:19px;font-weight:700}.s{font-size:16px}.m{font-size:14px;fill:#5A544C}
    .num{font-size:19px;font-weight:700}.tiny{font-size:13px;fill:#5A544C}
    .blue{fill:#E8F0F7;stroke:#4B6787;stroke-width:2}
    .cream{fill:#FBF9F6;stroke:#C4B8A8;stroke-width:2}
    .green{fill:#EAF1E5;stroke:#6F8D5E;stroke-width:2}
    .clay{fill:#F3E8E0;stroke:#A67C52;stroke-width:2}
    .ink{fill:#16243A;stroke:#16243A;stroke-width:2}.line{stroke:#7F786D;stroke-width:1.6}
  </style>

  <text x="48" y="48" class="t title">One matrix moves; the probability law does not</text>
  <text x="48" y="78" class="t sub">Conjugate by the swap unitary P. Pointwise equality fails, while norm preservation and law equality hold.</text>

  <rect x="48" y="112" width="300" height="284" rx="16" class="blue"/>
  <text x="70" y="148" class="t h">Starting Hermitian point H</text>
  <rect x="80" y="173" width="236" height="116" rx="10" class="cream"/>
  <line x1="198" y1="173" x2="198" y2="289" class="line"/>
  <line x1="80" y1="231" x2="316" y2="231" class="line"/>
  <text x="127" y="210" class="t num">2</text><text x="226" y="210" class="t num">1 + 2i</text>
  <text x="103" y="268" class="t num">1 - 2i</text><text x="252" y="268" class="t num">-1</text>
  <text x="70" y="325" class="t s">normalized coordinates</text>
  <text x="70" y="352" class="t num">(2, -1, sqrt(2), 2 sqrt(2))</text>
  <text x="70" y="380" class="t m">Frobenius square = 15</text>

  <rect x="380" y="112" width="254" height="284" rx="16" class="cream"/>
  <text x="402" y="148" class="t h">Swap unitary P</text>
  <rect x="423" y="173" width="168" height="116" rx="10" class="blue"/>
  <line x1="507" y1="173" x2="507" y2="289" class="line"/>
  <line x1="423" y1="231" x2="591" y2="231" class="line"/>
  <text x="461" y="210" class="t num">0</text><text x="545" y="210" class="t num">1</text>
  <text x="461" y="268" class="t num">1</text><text x="545" y="268" class="t num">0</text>
  <text x="402" y="325" class="t num">P H P* = P H P</text>
  <text x="402" y="353" class="t m">P* = P and P* P = identity.</text>
  <line x1="640" y1="254" x2="679" y2="254" stroke="#A67C52" stroke-width="4" marker-end="url(#swap-law-arrow)"/>

  <rect x="690" y="112" width="462" height="284" rx="16" class="green"/>
  <text x="712" y="148" class="t h">Conjugated Hermitian point P H P*</text>
  <rect x="804" y="173" width="236" height="116" rx="10" class="cream"/>
  <line x1="922" y1="173" x2="922" y2="289" class="line"/>
  <line x1="804" y1="231" x2="1040" y2="231" class="line"/>
  <text x="848" y="210" class="t num">-1</text><text x="950" y="210" class="t num">1 - 2i</text>
  <text x="827" y="268" class="t num">1 + 2i</text><text x="978" y="268" class="t num">2</text>
  <text x="712" y="325" class="t s">normalized coordinates</text>
  <text x="712" y="352" class="t num">(-1, 2, sqrt(2), -2 sqrt(2))</text>
  <text x="712" y="380" class="t m">Frobenius square = 15</text>

  <rect x="48" y="428" width="532" height="142" rx="16" class="clay"/>
  <text x="70" y="465" class="t h">Pointwise statement: false</text>
  <text x="70" y="499" class="t num">P H P* is not H</text>
  <text x="70" y="530" class="t s">The diagonal values trade places and the</text>
  <text x="70" y="554" class="t s">upper imaginary sign changes.</text>

  <rect x="604" y="428" width="548" height="142" rx="16" class="green"/>
  <text x="626" y="465" class="t h">Geometric statement: true</text>
  <text x="626" y="499" class="t num">15 = 15</text>
  <text x="626" y="530" class="t s">On normalized coordinates the swap acts as</text>
  <text x="626" y="554" class="t s">(d0,d1,r,s) to (d1,d0,r,-s), a real isometry.</text>

  <rect x="48" y="604" width="1104" height="222" rx="16" class="blue"/>
  <text x="70" y="641" class="t h">Law-level statement: the checked theorem</text>
  <rect x="70" y="668" width="304" height="78" rx="11" class="cream"/>
  <text x="93" y="698" class="t s">scaled standard Gaussian</text>
  <text x="93" y="724" class="t m">on intrinsic Hermitian space</text>
  <line x1="382" y1="707" x2="438" y2="707" stroke="#A67C52" stroke-width="4" marker-end="url(#swap-law-arrow)"/>
  <rect x="450" y="668" width="298" height="78" rx="11" class="green"/>
  <text x="477" y="698" class="t s">intrinsic law unchanged</text>
  <text x="477" y="724" class="t m">after Hermitian congruence</text>
  <line x1="756" y1="707" x2="812" y2="707" stroke="#A67C52" stroke-width="4" marker-end="url(#swap-law-arrow)"/>
  <rect x="824" y="668" width="306" height="78" rx="11" class="cream"/>
  <text x="849" y="698" class="t s">ambient matrix law unchanged</text>
  <text x="849" y="724" class="t m">after inclusion and congruence</text>
  <rect x="70" y="766" width="1060" height="38" rx="10" class="ink"/>
  <text x="136" y="792" class="t s" style="fill:#FFFDF8">map(congruence P, GUE matrix law at size 2) = GUE matrix law at size 2</text>

  <rect x="48" y="852" width="1104" height="30" rx="10" class="green"/>
  <text x="178" y="873" class="t s">Takeaway: invariance compares pushed-forward measures; it never says every sampled matrix is fixed.</text>
</svg>
