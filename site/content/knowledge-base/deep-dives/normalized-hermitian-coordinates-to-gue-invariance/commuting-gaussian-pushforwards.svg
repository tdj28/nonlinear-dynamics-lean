<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900"
     viewBox="0 0 1200 900" role="img"
     aria-labelledby="normalized-n2-title normalized-n2-desc">
  <title id="normalized-n2-title">At size two, normalized real coordinates decode isometrically into the repository's Hermitian matrix convention</title>
  <desc id="normalized-n2-desc">Four independent normalized real Gaussian slots each have variance one half. The numeric coordinate point two, minus one, square root two, two square root two decodes by dividing the two upper slots by square root two into the Hermitian matrix with rows two, one plus two i and one minus two i, minus one. The coordinate squared norm and Frobenius squared norm both equal fifteen. Omitting the division would give squared norm twenty-five and upper component variance one half instead of one quarter.</desc>
  <defs>
    <marker id="normalized-n2-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#A67C52"/>
    </marker>
    <pattern id="normalized-n2-hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#A67C52" stroke-width="3" opacity="0.34"/>
    </pattern>
  </defs>
  <rect width="1200" height="900" fill="#F7F4F0"/>
  <style>
    .t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#2C2924}
    .title{font-size:28px;font-weight:700}.sub{font-size:17px;fill:#5A544C}
    .h{font-size:19px;font-weight:700}.s{font-size:16px}.m{font-size:14px;fill:#5A544C}
    .num{font-size:19px;font-weight:700}.tiny{font-size:13px;fill:#5A544C}
    .blue{fill:#E8F0F7;stroke:#4B6787;stroke-width:2}
    .cream{fill:#FBF9F6;stroke:#C4B8A8;stroke-width:2}
    .green{fill:#EAF1E5;stroke:#6F8D5E;stroke-width:2}
    .clay{fill:#F3E8E0;stroke:#A67C52;stroke-width:2}
    .line{stroke:#7F786D;stroke-width:1.6}.dash{stroke:#A89B8C;stroke-width:2;stroke-dasharray:7 6}
  </style>

  <text x="48" y="48" class="t title">Size 2: one normalization fixes geometry and probability together</text>
  <text x="48" y="78" class="t sub">Every normalized slot has variance 1/2; decoding the upper pair by 1/sqrt(2) produces the approved entry law.</text>

  <rect x="48" y="108" width="1104" height="168" rx="16" class="blue"/>
  <text x="70" y="143" class="t h">The common normalized Gaussian product</text>
  <text x="70" y="169" class="t m">Four mutually independent centered real coordinates; variances are shown in ordinary units.</text>

  <rect x="70" y="190" width="248" height="62" rx="10" class="cream"/>
  <text x="91" y="216" class="t s">diagonal 0: d0</text>
  <text x="91" y="240" class="t num">variance 1/2</text>
  <rect x="337" y="190" width="248" height="62" rx="10" class="cream"/>
  <text x="358" y="216" class="t s">diagonal 1: d1</text>
  <text x="358" y="240" class="t num">variance 1/2</text>
  <rect x="604" y="190" width="248" height="62" rx="10" class="green"/>
  <text x="625" y="216" class="t s">upper real: r</text>
  <text x="625" y="240" class="t num">variance 1/2</text>
  <rect x="871" y="190" width="259" height="62" rx="10" class="green"/>
  <text x="892" y="216" class="t s">upper imaginary: s</text>
  <text x="892" y="240" class="t num">variance 1/2</text>

  <rect x="48" y="306" width="324" height="218" rx="16" class="cream"/>
  <text x="70" y="342" class="t h">One exact coordinate point</text>
  <rect x="74" y="367" width="272" height="64" rx="11" class="blue"/>
  <text x="93" y="393" class="t s">z = (d0, d1, r, s)</text>
  <text x="91" y="419" class="t num">= (2, -1, sqrt(2), 2 sqrt(2))</text>
  <text x="70" y="461" class="t m">The square-root values are chosen so the</text>
  <text x="70" y="483" class="t m">decoded matrix has integer real and</text>
  <text x="70" y="505" class="t m">imaginary parts.</text>

  <line x1="382" y1="414" x2="421" y2="414" stroke="#A67C52" stroke-width="4" marker-end="url(#normalized-n2-arrow)"/>

  <rect x="432" y="306" width="346" height="218" rx="16" class="green"/>
  <text x="454" y="342" class="t h">Decode the upper pair</text>
  <text x="454" y="372" class="t s">H00 = d0 = 2</text>
  <text x="454" y="400" class="t s">H11 = d1 = -1</text>
  <text x="454" y="428" class="t s">H01 = r/sqrt(2) + i s/sqrt(2)</text>
  <text x="454" y="456" class="t num">H01 = 1 + 2i</text>
  <text x="454" y="484" class="t s">H10 = conjugate(H01) = 1 - 2i</text>
  <text x="454" y="509" class="t m">Upper real and imaginary variances: 1/4, 1/4</text>

  <line x1="788" y1="414" x2="827" y2="414" stroke="#A67C52" stroke-width="4" marker-end="url(#normalized-n2-arrow)"/>

  <rect x="838" y="306" width="314" height="218" rx="16" class="blue"/>
  <text x="860" y="342" class="t h">The Hermitian matrix</text>
  <rect x="876" y="365" width="238" height="116" rx="10" class="cream"/>
  <line x1="995" y1="365" x2="995" y2="481" class="line"/>
  <line x1="876" y1="423" x2="1114" y2="423" class="line"/>
  <text x="922" y="402" class="t num">2</text>
  <text x="1024" y="402" class="t num">1 + 2i</text>
  <text x="899" y="460" class="t num">1 - 2i</text>
  <text x="1049" y="460" class="t num">-1</text>
  <text x="860" y="509" class="t m">Lower entry is forced by conjugation.</text>

  <rect x="48" y="552" width="1104" height="80" rx="15" class="green"/>
  <text x="70" y="582" class="t h">The isometry audit closes exactly</text>
  <text x="70" y="612" class="t num">coordinate square: 4 + 1 + 2 + 8 = 15</text>
  <text x="611" y="612" class="t num">Frobenius square: 4 + 1 + 2(1 + 4) = 15</text>

  <line x1="48" y1="658" x2="1152" y2="658" class="dash"/>

  <rect x="48" y="684" width="1104" height="154" rx="16" class="clay"/>
  <rect x="48" y="684" width="1104" height="154" rx="16" fill="url(#normalized-n2-hatch)" opacity="0.24"/>
  <text x="70" y="720" class="t h">Wrong-normalization near-miss: omit both divisions by sqrt(2)</text>
  <text x="70" y="752" class="t s">The same normalized point would place sqrt(2) + 2 sqrt(2)i above the diagonal.</text>
  <text x="70" y="783" class="t num">wrong Frobenius square: 4 + 1 + 2(2 + 8) = 25, not 15</text>
  <text x="70" y="814" class="t s">The displayed upper component variances would stay 1/2 instead of the required 1/4.</text>
  <rect x="880" y="735" width="238" height="72" rx="11" class="cream"/>
  <text x="918" y="764" class="t h">NOT AN ISOMETRY</text>
  <text x="916" y="792" class="t s">and not the project law</text>

  <rect x="48" y="858" width="1104" height="30" rx="10" class="green"/>
  <text x="158" y="879" class="t s">Takeaway: the factor 1/sqrt(2) is forced by both the Frobenius metric and the Wigner variance ledger.</text>
</svg>
