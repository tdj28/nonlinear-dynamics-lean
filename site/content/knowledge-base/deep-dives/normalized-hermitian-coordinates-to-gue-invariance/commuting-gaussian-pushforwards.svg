<svg xmlns="http://www.w3.org/2000/svg" width="820" height="620"
     viewBox="0 0 820 620" role="img"
     aria-labelledby="commutingPushforwardsTitle commutingPushforwardsDesc">
  <title id="commutingPushforwardsTitle">Coordinate and intrinsic routes commute to the same ambient Gaussian matrix law</title>
  <desc id="commutingPushforwardsDesc">The coordinate route starts with an independent normalized real Gaussian product, decodes the three kinds of real slots, and assembles an ambient Hermitian matrix. The intrinsic route starts with the standard Gaussian on Hermitian Euclidean space, applies the common Wigner scale, and includes the result into ambient matrix space. The comparison theorem proves both routes produce the same matrix law. Unitary congruence commutes with scaling and inclusion, so intrinsic Gaussian symmetry transfers to the ambient Gaussian unitary ensemble law.</desc>
  <rect width="820" height="620" fill="#F7F4F0"/>
  <style>
    .t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#2C2924}
    .title{font-size:15px;font-weight:700}
    .h{font-size:13px;font-weight:700}
    .s{font-size:12px}
    .m{font-size:11px;fill:#5A544C}
  </style>
  <defs>
    <marker id="pushforwardArrow" markerWidth="8" markerHeight="8" refX="7" refY="4"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#A67C52"/>
    </marker>
    <marker id="symmetryLoopArrow" markerWidth="8" markerHeight="8" refX="7" refY="4"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6F8D5E"/>
    </marker>
  </defs>

  <text x="24" y="30" class="t title">Two measure routes meet before symmetry is transported</text>
  <text x="24" y="50" class="t m">The routes use measurable pushforwards, proved commuting identities, and the exact law comparison.</text>

  <text x="24" y="86" class="t h">COORDINATE ROUTE</text>
  <rect x="24" y="104" width="212" height="96" rx="12" fill="#E8F0F7" stroke="#4B6787" stroke-width="1.5"/>
  <text x="130" y="133" text-anchor="middle" class="t h">INDEPENDENT REAL PRODUCT</text>
  <text x="130" y="159" text-anchor="middle" class="t s">one shared Gaussian variance</text>
  <text x="130" y="181" text-anchor="middle" class="t m">all normalized slots together</text>

  <path d="M238 152 L274 152" fill="none" stroke="#A67C52" stroke-width="2" marker-end="url(#pushforwardArrow)"/>
  <rect x="280" y="104" width="226" height="96" rx="12" fill="#F3E8E0" stroke="#A67C52" stroke-width="1.5"/>
  <text x="393" y="133" text-anchor="middle" class="t h">NORMALIZED DECODING</text>
  <text x="393" y="159" text-anchor="middle" class="t s">diagonal and two upper slots</text>
  <text x="393" y="181" text-anchor="middle" class="t m">metric correction included</text>

  <path d="M508 152 L544 152" fill="none" stroke="#A67C52" stroke-width="2" marker-end="url(#pushforwardArrow)"/>
  <rect x="550" y="104" width="246" height="96" rx="12" fill="#EAF1E5" stroke="#6F8D5E" stroke-width="1.5"/>
  <text x="673" y="133" text-anchor="middle" class="t h">COORDINATE-BUILT MATRIX LAW</text>
  <text x="673" y="159" text-anchor="middle" class="t s">measurable Hermitian assembly</text>
  <text x="673" y="181" text-anchor="middle" class="t m">ambient complex matrix space</text>

  <line x1="24" y1="226" x2="796" y2="226" stroke="#C4B8A8" stroke-width="1"/>
  <text x="24" y="258" class="t h">INTRINSIC ROUTE</text>
  <rect x="24" y="276" width="212" height="96" rx="12" fill="#E8F0F7" stroke="#4B6787" stroke-width="1.5"/>
  <text x="130" y="299" text-anchor="middle" class="t h">INTRINSIC STANDARD</text>
  <text x="130" y="318" text-anchor="middle" class="t h">HERMITIAN GAUSSIAN</text>
  <text x="130" y="343" text-anchor="middle" class="t s">basis-neutral Euclidean law</text>
  <text x="130" y="364" text-anchor="middle" class="t m">unitary symmetry already checked</text>

  <path d="M238 324 L274 324" fill="none" stroke="#A67C52" stroke-width="2" marker-end="url(#pushforwardArrow)"/>
  <rect x="280" y="276" width="226" height="96" rx="12" fill="#F3E8E0" stroke="#A67C52" stroke-width="1.5"/>
  <text x="393" y="305" text-anchor="middle" class="t h">UNIFORM WIGNER SCALING</text>
  <text x="393" y="331" text-anchor="middle" class="t s">one scale in every direction</text>
  <text x="393" y="353" text-anchor="middle" class="t m">including the zero-size branch</text>

  <path d="M508 324 L544 324" fill="none" stroke="#A67C52" stroke-width="2" marker-end="url(#pushforwardArrow)"/>
  <rect x="550" y="276" width="246" height="96" rx="12" fill="#EAF1E5" stroke="#6F8D5E" stroke-width="1.5"/>
  <text x="673" y="305" text-anchor="middle" class="t h">INTRINSIC AMBIENT IMAGE</text>
  <text x="673" y="331" text-anchor="middle" class="t s">include the Hermitian point</text>
  <text x="673" y="353" text-anchor="middle" class="t m">into ambient matrix space</text>

  <path d="M673 274 L673 206" fill="none" stroke="#A67C52" stroke-width="2.5" marker-end="url(#pushforwardArrow)"/>
  <rect x="544" y="398" width="252" height="84" rx="12" fill="#FBF9F6" stroke="#C4B8A8" stroke-width="1.5"/>
  <text x="670" y="428" text-anchor="middle" class="t h">EXACT COMPARISON THEOREM</text>
  <text x="670" y="454" text-anchor="middle" class="t s">both routes give the same law</text>

  <path d="M544 440 C472 440,468 514,402 514" fill="none" stroke="#A67C52" stroke-width="2" marker-end="url(#pushforwardArrow)"/>
  <rect x="170" y="488" width="228" height="84" rx="12" fill="#16243A" stroke="#16243A" stroke-width="1.5"/>
  <text x="284" y="518" text-anchor="middle" class="t h" style="fill:#FFFDF8">AMBIENT UNITARY INVARIANCE</text>
  <text x="284" y="544" text-anchor="middle" class="t s" style="fill:#FFFDF8">the first nontrivial ensemble symmetry</text>

  <path d="M130 374 C76 414,76 506,164 526" fill="none" stroke="#6F8D5E" stroke-width="2.5" marker-end="url(#symmetryLoopArrow)"/>
  <text x="48" y="427" class="t m">intrinsic symmetry</text>
  <text x="48" y="447" class="t m">commutes with scaling</text>
  <text x="48" y="467" class="t m">and ambient inclusion</text>

  <text x="24" y="605" class="t m">The comparison closes the symmetry proof without defining a density, a Jacobian, or any spectral observable.</text>
</svg>
