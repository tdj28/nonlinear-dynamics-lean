<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">Local existence, uniform time, and global integral curves</title><desc id="desc">A finite-time blow-up graph at left is contrasted with equal-width continuation windows at right.</desc><rect width="1200" height="630" fill="#f7f1e5"/><text x="65" y="75" font-family="system-ui" font-size="27" font-weight="700" fill="#315d4b">ODE EXISTENCE: THE QUANTIFIERS MATTER</text><text x="65" y="145" font-family="system-ui" font-size="45" font-weight="750" fill="#183c3a">LOCAL IS NOT GLOBAL</text><rect x="60" y="195" width="500" height="340" rx="24" fill="#fffaf0" stroke="#874d3b" stroke-width="3"/><line x1="110" y1="480" x2="510" y2="480" stroke="#263c3b" stroke-width="3"/><line x1="110" y1="480" x2="110" y2="245" stroke="#263c3b" stroke-width="3"/><line x1="445" y1="225" x2="445" y2="490" stroke="#874d3b" stroke-width="3" stroke-dasharray="11 9"/><path d="M110 445 C245 430 350 360 400 270 C423 235 436 222 443 220" fill="none" stroke="#874d3b" stroke-width="8"/><text x="145" y="520" font-family="system-ui" font-size="23" fill="#263c3b">x′=x² reaches a finite-time pole</text><rect x="620" y="195" width="520" height="340" rx="24" fill="#fffaf0" stroke="#315d4b" stroke-width="3"/><path d="M670 305 C800 230 935 370 1085 270" fill="none" stroke="#874d3b" stroke-width="8"/><line x1="665" y1="420" x2="1090" y2="420" stroke="#263c3b" stroke-width="3"/><g fill="#dce9df" stroke="#315d4b" stroke-width="3"><rect x="675" y="380" width="175" height="70" rx="17"/><rect x="795" y="405" width="175" height="70" rx="17"/><rect x="915" y="380" width="175" height="70" rx="17"/></g><text x="683" y="500" font-family="system-ui" font-size="23" fill="#263c3b">one radius ε works everywhere</text><text x="65" y="585" font-family="system-ui" font-size="24" fill="#263c3b">POINTWISE LOCAL TIME  ≠  UNIFORM LOCAL TIME  ⇒  GLOBAL CONTINUATION</text></svg>
