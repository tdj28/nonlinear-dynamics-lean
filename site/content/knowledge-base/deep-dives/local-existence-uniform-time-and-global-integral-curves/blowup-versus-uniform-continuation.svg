<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">Finite-time blow-up versus uniform continuation</title><desc id="desc">The left panel graphs one over one minus t rising toward a vertical asymptote at t equals one. The right panel shows equal-width overlapping local intervals extending along a time axis.</desc><rect width="1200" height="700" fill="#f7f1e5"/><style>.h{font:700 31px system-ui;fill:#183c3a}.t{font:500 22px system-ui;fill:#263c3b}.s{font:700 19px system-ui;fill:#315d4b}</style><text class="h" x="55" y="70">SMOOTH DOES NOT MEAN GLOBAL</text><rect x="45" y="110" width="520" height="500" rx="24" fill="#fffaf0" stroke="#874d3b" stroke-width="3"/><line x1="105" y1="540" x2="515" y2="540" stroke="#263c3b" stroke-width="3"/><line x1="105" y1="540" x2="105" y2="170" stroke="#263c3b" stroke-width="3"/><line x1="445" y1="160" x2="445" y2="550" stroke="#874d3b" stroke-width="3" stroke-dasharray="12 10"/><path d="M105 500 C230 480 335 430 385 335 C420 270 435 210 443 165" fill="none" stroke="#874d3b" stroke-width="7"/><text class="t" x="170" y="580">x(t)=1/(1−t)</text><text class="s" x="414" y="590">t=1 pole</text><rect x="635" y="110" width="520" height="500" rx="24" fill="#fffaf0" stroke="#315d4b" stroke-width="3"/><text class="h" x="680" y="175">UNIFORM RADIUS ε</text><line x1="690" y1="420" x2="1100" y2="420" stroke="#263c3b" stroke-width="4"/><g fill="#dce9df" stroke="#315d4b" stroke-width="3"><rect x="680" y="370" width="160" height="80" rx="18"/><rect x="790" y="400" width="160" height="80" rx="18"/><rect x="900" y="370" width="160" height="80" rx="18"/></g><path d="M690 300 C800 215 930 355 1080 240" fill="none" stroke="#874d3b" stroke-width="7"/><text class="t" x="687" y="535">same guaranteed width</text><text class="t" x="687" y="568">at every new point</text></svg>
