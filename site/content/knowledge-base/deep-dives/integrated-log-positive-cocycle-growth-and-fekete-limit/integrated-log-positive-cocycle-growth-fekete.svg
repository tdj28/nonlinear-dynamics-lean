<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820"
     viewBox="0 0 1200 820" role="img"
     aria-labelledby="integratedLedgerTitle integratedLedgerDesc">
  <title id="integratedLedgerTitle">Exact two-state integrated log-positive growth ledger</title>
  <desc id="integratedLedgerDesc">A uniform two-state base swaps amber and blue. The one-by-one generator is 2 at amber and 1 at blue. In units of log 2, the finite sample values from horizons zero through six are zero zero, one zero, one one, two one, two two, three two, and three three. Their uniform integrals are zero, one half, one, three halves, two, five halves, and three. Every positive-horizon normalized integral is one half, while the formal zero-horizon quotient is zero.</desc>
  <defs>
    <marker id="ledgerArrowBlue" markerWidth="9" markerHeight="9"
            refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#416887"/>
    </marker>
    <style>
      .sans{font-family:Inter,Arial,Helvetica,sans-serif;fill:#262A2E}
      .serif{font-family:Georgia,'Times New Roman',serif;fill:#16243A}
      .title{font-size:30px;font-weight:700}
      .subtitle{font-size:17px;fill:#52606D}
      .section{font-size:17px;font-weight:700;letter-spacing:.5px}
      .body{font-size:16px}
      .small{font-size:14px;fill:#59636D}
      .tableHead{font-size:15px;font-weight:700;fill:#FFFDF8}
      .cell{font-size:17px;font-weight:600}
      .math{font-family:Georgia,'Times New Roman',serif;font-size:18px}
    </style>
  </defs>

  <rect width="1200" height="820" fill="#F5F0E6"/>
  <rect x="0" y="0" width="1200" height="16" fill="#16243A"/>
  <text x="56" y="62" class="serif title">Integrate the two sample rows, then normalize</text>
  <text x="56" y="91" class="sans subtitle">Exact finite values for a uniform swap base; L denotes log 2, approximately 0.6931.</text>

  <rect x="56" y="124" width="420" height="134" rx="18"
        fill="#F4E4CD" stroke="#B66A2C" stroke-width="2"/>
  <circle cx="98" cy="169" r="20" fill="#C97932"/>
  <text x="132" y="163" class="sans section">AMBER</text>
  <text x="132" y="188" class="sans body">mass 1/2 - generator [2]</text>
  <text x="80" y="230" class="serif math">P_1(amber) = positive log of norm [2] = L</text>

  <rect x="724" y="124" width="420" height="134" rx="18"
        fill="#DFEAF2" stroke="#416887" stroke-width="2"/>
  <circle cx="766" cy="169" r="20" fill="#416887"/>
  <text x="800" y="163" class="sans section">BLUE</text>
  <text x="800" y="188" class="sans body">mass 1/2 - generator [1]</text>
  <text x="748" y="230" class="serif math">P_1(blue) = positive log of norm [1] = 0</text>

  <path d="M478 151 C555 111 645 111 722 151" fill="none"
        stroke="#416887" stroke-width="3" marker-end="url(#ledgerArrowBlue)"/>
  <path d="M722 225 C645 276 555 276 478 225" fill="none"
        stroke="#416887" stroke-width="3" marker-end="url(#ledgerArrowBlue)"/>
  <text x="600" y="133" text-anchor="middle" class="sans small">T</text>
  <text x="600" y="265" text-anchor="middle" class="sans small">T</text>

  <rect x="56" y="294" width="1088" height="416" rx="18"
        fill="#FFFDF8" stroke="#C9BBA6" stroke-width="2"/>
  <rect x="56" y="294" width="1088" height="48" rx="18"
        fill="#16243A"/>
  <rect x="56" y="324" width="1088" height="18" fill="#16243A"/>

  <text x="116" y="325" text-anchor="middle" class="sans tableHead">horizon k</text>
  <text x="315" y="325" text-anchor="middle" class="sans tableHead">P_k(amber) / L</text>
  <text x="520" y="325" text-anchor="middle" class="sans tableHead">P_k(blue) / L</text>
  <text x="756" y="325" text-anchor="middle" class="sans tableHead">I_k / L = average</text>
  <text x="1004" y="325" text-anchor="middle" class="sans tableHead">A_k / L = (I_k / k) / L</text>

  <rect x="57" y="343" width="1086" height="46" fill="#F4E9E4"/>
  <g class="sans cell" text-anchor="middle">
    <text x="116" y="374">0</text><text x="315" y="374">0</text>
    <text x="520" y="374">0</text><text x="756" y="374">0</text>
    <text x="1004" y="374" fill="#9A473B">0  (formal 0/0)</text>

    <text x="116" y="424">1</text><text x="315" y="424">1</text>
    <text x="520" y="424">0</text><text x="756" y="424">1/2</text>
    <text x="1004" y="424">1/2</text>

    <text x="116" y="474">2</text><text x="315" y="474">1</text>
    <text x="520" y="474">1</text><text x="756" y="474">1</text>
    <text x="1004" y="474">1/2</text>

    <text x="116" y="524">3</text><text x="315" y="524">2</text>
    <text x="520" y="524">1</text><text x="756" y="524">3/2</text>
    <text x="1004" y="524">1/2</text>

    <text x="116" y="574">4</text><text x="315" y="574">2</text>
    <text x="520" y="574">2</text><text x="756" y="574">2</text>
    <text x="1004" y="574">1/2</text>

    <text x="116" y="624">5</text><text x="315" y="624">3</text>
    <text x="520" y="624">2</text><text x="756" y="624">5/2</text>
    <text x="1004" y="624">1/2</text>

    <text x="116" y="674">6</text><text x="315" y="674">3</text>
    <text x="520" y="674">3</text><text x="756" y="674">3</text>
    <text x="1004" y="674">1/2</text>
  </g>

  <g stroke="#D8CEC0" stroke-width="1">
    <path d="M56 389 H1144 M56 439 H1144 M56 489 H1144 M56 539 H1144
             M56 589 H1144 M56 639 H1144"/>
    <path d="M176 294 V710 M418 294 V710 M624 294 V710 M888 294 V710"/>
  </g>

  <rect x="56" y="736" width="662" height="56" rx="14"
        fill="#E5EEF4" stroke="#416887" stroke-width="1.5"/>
  <text x="78" y="770" class="serif math">I_5 = (5/2)L = I_2 + I_3 = L + (3/2)L</text>
  <rect x="742" y="736" width="402" height="56" rx="14"
        fill="#E8F0E3" stroke="#668253" stroke-width="1.5"/>
  <text x="943" y="760" text-anchor="middle" class="sans section">positive horizons only</text>
  <text x="943" y="782" text-anchor="middle" class="sans body">A_k = L/2 approx. 0.3466 for k &gt;= 1</text>
</svg>
