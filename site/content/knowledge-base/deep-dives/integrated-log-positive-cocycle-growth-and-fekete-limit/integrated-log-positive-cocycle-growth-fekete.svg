<svg xmlns="http://www.w3.org/2000/svg" width="800" height="760"
     viewBox="0 0 800 760" role="img"
     aria-labelledby="integratedFeketeTitle integratedFeketeDesc">
  <title id="integratedFeketeTitle">Dependency graph for the deterministic Fekete limit</title>
  <desc id="integratedFeketeDesc">A pointwise cocycle bound, an unconditional preserved-shift integral identity, and finite-horizon integrability propagated from the explicit one-step hypothesis jointly justify integral monotonicity and additivity, producing a subadditive real sequence. In a separate unconditional branch, log-positive nonnegativity produces nonnegative normalized values and a zero lower bound. Subadditivity and the lower bound merge at the deterministic positive-time Fekete limit. No samplewise, ergodic, or Lyapunov conclusion follows.</desc>
  <rect width="800" height="760" fill="#F7F4F0"/>
  <style>
    .t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#2C2924}
    .title{font-size:16px;font-weight:700}
    .h{font-size:12px;font-weight:700}
    .s{font-size:11px}
    .m{font-size:10px;fill:#5A544C}
  </style>
  <defs>
    <marker id="integratedFeketeAlgebraArrow" markerWidth="8" markerHeight="8"
            refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4B6787"/>
    </marker>
    <marker id="integratedFeketeIntegrabilityArrow" markerWidth="8" markerHeight="8"
            refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#C16F2C"/>
    </marker>
    <marker id="integratedFeketeOrderArrow" markerWidth="8" markerHeight="8"
            refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6F8D5E"/>
    </marker>
  </defs>

  <text x="24" y="32" class="t title">Dependency graph for the deterministic limit</text>
  <text x="24" y="53" class="t m">Integrability joins the algebra before subadditivity; the lower-bound branch is unconditional.</text>

  <rect x="24" y="78" width="236" height="42" rx="12" fill="#16243A"/>
  <text x="142" y="104" text-anchor="middle" class="t h" style="fill:#FFFDF8">ALGEBRA</text>
  <rect x="282" y="78" width="236" height="42" rx="12" fill="#9B5523"/>
  <text x="400" y="104" text-anchor="middle" class="t h" style="fill:#FFFDF8">INTEGRABILITY</text>
  <rect x="540" y="78" width="236" height="42" rx="12" fill="#315F55"/>
  <text x="658" y="104" text-anchor="middle" class="t h" style="fill:#FFFDF8">UNCONDITIONAL ORDER</text>

  <rect x="24" y="142" width="236" height="66" rx="13"
        fill="#E8F0F7" stroke="#4B6787" stroke-width="1.5"/>
  <text x="142" y="169" text-anchor="middle" class="t h">SHIFTED POINTWISE BOUND</text>
  <text x="142" y="191" text-anchor="middle" class="t s">split a long cocycle product</text>

  <rect x="282" y="142" width="236" height="66" rx="13"
        fill="#F7E9DA" stroke="#C16F2C" stroke-width="1.5"/>
  <text x="400" y="169" text-anchor="middle" class="t h">ONE-STEP INTEGRABILITY</text>
  <text x="400" y="191" text-anchor="middle" class="t s">the explicit hypothesis hC</text>

  <rect x="540" y="142" width="236" height="66" rx="13"
        fill="#EAF1E5" stroke="#6F8D5E" stroke-width="1.5"/>
  <text x="658" y="169" text-anchor="middle" class="t h">LOG-POSITIVE NONNEGATIVITY</text>
  <text x="658" y="191" text-anchor="middle" class="t s">pointwise and hypothesis-free</text>

  <rect x="24" y="246" width="236" height="68" rx="13"
        fill="#E8F0F7" stroke="#4B6787" stroke-width="1.5"/>
  <text x="142" y="273" text-anchor="middle" class="t h">SHIFT INTEGRAL IDENTITY</text>
  <text x="142" y="295" text-anchor="middle" class="t s">unconditional under preservation</text>

  <path d="M400 210 L400 240" fill="none" stroke="#C16F2C"
        stroke-width="2.5" marker-end="url(#integratedFeketeIntegrabilityArrow)"/>
  <rect x="282" y="246" width="236" height="68" rx="13"
        fill="#F7E9DA" stroke="#C16F2C" stroke-width="1.5"/>
  <text x="400" y="273" text-anchor="middle" class="t h">EVERY HORIZON INTEGRABLE</text>
  <text x="400" y="295" text-anchor="middle" class="t s">hC propagates through finite sums</text>

  <path d="M658 210 L658 240" fill="none" stroke="#6F8D5E"
        stroke-width="2.5" marker-end="url(#integratedFeketeOrderArrow)"/>
  <rect x="540" y="246" width="236" height="68" rx="13"
        fill="#EAF1E5" stroke="#6F8D5E" stroke-width="1.5"/>
  <text x="658" y="273" text-anchor="middle" class="t h">NORMALIZED VALUES NONNEGATIVE</text>
  <text x="658" y="295" text-anchor="middle" class="t s">also true for totalized integrals</text>

  <path d="M142 210 L12 210 L12 338 L170 360" fill="none" stroke="#4B6787"
        stroke-width="2.5" marker-end="url(#integratedFeketeAlgebraArrow)"/>
  <path d="M142 316 L142 338 L240 360" fill="none" stroke="#4B6787"
        stroke-width="2.5" marker-end="url(#integratedFeketeAlgebraArrow)"/>
  <path d="M400 316 L400 360" fill="none" stroke="#C16F2C"
        stroke-width="2.5" marker-end="url(#integratedFeketeIntegrabilityArrow)"/>
  <rect x="24" y="366" width="494" height="76" rx="14"
        fill="#FBF9F6" stroke="#C4B8A8" stroke-width="1.5"/>
  <text x="271" y="393" text-anchor="middle" class="t h">JUSTIFIED INTEGRAL STEP</text>
  <text x="271" y="414" text-anchor="middle" class="t s">finite integrability licenses monotonicity and addition;</text>
  <text x="271" y="430" text-anchor="middle" class="t s">preservation removes the shifted base point</text>

  <path d="M658 316 L658 360" fill="none" stroke="#6F8D5E"
        stroke-width="2.5" marker-end="url(#integratedFeketeOrderArrow)"/>
  <rect x="540" y="366" width="236" height="76" rx="14"
        fill="#EAF1E5" stroke="#6F8D5E" stroke-width="1.5"/>
  <text x="658" y="393" text-anchor="middle" class="t h">ZERO IS A LOWER BOUND</text>
  <text x="658" y="414" text-anchor="middle" class="t s">for the full normalized range</text>
  <text x="658" y="430" text-anchor="middle" class="t m">no hC required</text>

  <path d="M271 444 L271 472" fill="none" stroke="#4B6787"
        stroke-width="2.5" marker-end="url(#integratedFeketeAlgebraArrow)"/>
  <rect x="24" y="478" width="494" height="68" rx="14"
        fill="#E8F0F7" stroke="#4B6787" stroke-width="1.5"/>
  <text x="271" y="505" text-anchor="middle" class="t h">SUBADDITIVE REAL SEQUENCE</text>
  <text x="271" y="527" text-anchor="middle" class="t s">this branch carries the hC dependency</text>

  <path d="M271 548 L271 568 L360 590" fill="none" stroke="#4B6787"
        stroke-width="2.5" marker-end="url(#integratedFeketeAlgebraArrow)"/>
  <path d="M658 444 L658 568 L440 590" fill="none" stroke="#6F8D5E"
        stroke-width="2.5" marker-end="url(#integratedFeketeOrderArrow)"/>
  <rect x="130" y="596" width="540" height="74" rx="15" fill="#16243A"/>
  <text x="400" y="624" text-anchor="middle" class="t h" style="fill:#FFFDF8">DETERMINISTIC FEKETE LIMIT</text>
  <text x="400" y="648" text-anchor="middle" class="t s" style="fill:#D9E1EA">positive-horizon ratios converge to their infimum</text>

  <rect x="24" y="690" width="752" height="46" rx="12"
        fill="#F3E8E0" stroke="#A55445" stroke-width="1.5"/>
  <text x="400" y="710" text-anchor="middle" class="t h">OUTCOME DEPENDENCE WAS INTEGRATED AWAY BEFORE THE LIMIT</text>
  <text x="400" y="728" text-anchor="middle" class="t m">No samplewise convergence, ergodic theorem, limit interchange, or Lyapunov exponent is established.</text>

  <text x="24" y="752" class="t m">The raw measure is not automatically probabilistic; finite scalar rescaling rescales the integrated sequence and rate.</text>
</svg>
