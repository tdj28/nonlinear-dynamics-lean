<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430"
     viewBox="0 0 760 430" role="img"
     aria-labelledby="strictTitle strictDesc">
  <title id="strictTitle">Strict versus nonstrict finite maximal events at time zero</title>
  <desc id="strictDesc">Two conceptual partial-sum paths start at the forced zero value. A nonstrict event accepts both paths immediately, while the strict event accepts only the path that rises above zero at a positive time.</desc>
  <rect width="760" height="430" fill="#F7F4F0"/>
  <style>
    .t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#2C2924}
    .title{font-size:15px;font-weight:700}
    .h{font-size:13px;font-weight:700}
    .s{font-size:12px}
    .m{font-size:11px;fill:#5A544C}
    .neutral{fill:#FBF9F6;stroke:#C4B8A8;stroke-width:1.5}
    .keep{fill:#EAF1E5;stroke:#6F8D5E;stroke-width:1.5}
    .warn{fill:#F3E8E0;stroke:#A67C52;stroke-width:1.5}
  </style>
  <text x="24" y="28" class="t title">Time zero forces nonnegativity, so the useful event must be strict</text>
  <text x="24" y="48" class="t m">The paths show sign geometry only; their heights are not measurements.</text>

  <rect class="neutral" x="24" y="72" width="338" height="264" rx="12"/>
  <text x="44" y="101" class="t h">Path A: never above zero</text>
  <line x1="62" y1="211" x2="330" y2="211" stroke="#7F786D" stroke-width="1.5"/>
  <line x1="62" y1="132" x2="62" y2="286" stroke="#7F786D" stroke-width="1.5"/>
  <polyline points="82,211 134,244 186,225 238,266 290,238 326,257"
            fill="none" stroke="#7F786D" stroke-width="3"/>
  <circle cx="82" cy="211" r="7" fill="#FBF9F6" stroke="#2C2924" stroke-width="1.5"/>
  <text x="70" y="307" class="t m">time zero</text>
  <text x="211" y="307" class="t m">positive times</text>
  <text x="44" y="126" class="t s">running maximum = zero</text>

  <rect class="neutral" x="398" y="72" width="338" height="264" rx="12"/>
  <text x="418" y="101" class="t h">Path B: positive-time witness</text>
  <line x1="436" y1="211" x2="704" y2="211" stroke="#7F786D" stroke-width="1.5"/>
  <line x1="436" y1="132" x2="436" y2="286" stroke="#7F786D" stroke-width="1.5"/>
  <polyline points="456,211 508,250 560,183 612,225 664,149 700,176"
            fill="none" stroke="#4B6787" stroke-width="3"/>
  <circle cx="456" cy="211" r="7" fill="#FBF9F6" stroke="#2C2924" stroke-width="1.5"/>
  <circle cx="664" cy="149" r="9" fill="#EAF1E5" stroke="#6F8D5E" stroke-width="2"/>
  <text x="444" y="307" class="t m">time zero</text>
  <text x="585" y="307" class="t m">positive times</text>
  <text x="418" y="126" class="t s">running maximum is positive</text>

  <rect class="warn" x="24" y="356" width="338" height="50" rx="10"/>
  <text x="44" y="378" class="t h">NONSTRICT EVENT</text>
  <text x="44" y="397" class="t m">Accepts both paths at time zero: always the full space.</text>
  <rect class="keep" x="398" y="356" width="338" height="50" rx="10"/>
  <text x="418" y="378" class="t h">STRICT EVENT</text>
  <text x="418" y="397" class="t m">Accepts Path B only: a positive-time witness exists.</text>
</svg>
