<svg xmlns="http://www.w3.org/2000/svg" width="760" height="440"
     viewBox="0 0 760 440" role="img"
     aria-labelledby="peelTitle peelDesc">
  <title id="peelTitle">Positive-maximizer peeling and integral cancellation</title>
  <desc id="peelDesc">A strict-event witness selects a positive maximizing time. The winning partial sum is split into the first observable value and a shorter shifted sum, then bounded by the shifted running maximum. Integration and measure preservation cancel the two maximum terms and leave a nonnegative event integral.</desc>
  <rect width="760" height="440" fill="#F7F4F0"/>
  <style>
    .t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#2C2924}
    .title{font-size:15px;font-weight:700}
    .h{font-size:13px;font-weight:700}
    .s{font-size:12px}
    .m{font-size:11px;fill:#5A544C}
    .data{fill:#E8F0F7;stroke:#4B6787;stroke-width:1.5}
    .neutral{fill:#FBF9F6;stroke:#C4B8A8;stroke-width:1.5}
    .keep{fill:#EAF1E5;stroke:#6F8D5E;stroke-width:1.5}
    .warn{fill:#F3E8E0;stroke:#A67C52;stroke-width:1.5}
    .arrow{fill:none;stroke:#A67C52;stroke-width:2.5}
  </style>
  <defs>
    <marker id="peelArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#A67C52"/>
    </marker>
  </defs>
  <text x="24" y="28" class="t title">A positive maximizer peels pointwise; preservation cancels after integration</text>
  <text x="24" y="48" class="t m">No measurable maximizing-time function and no inverse transformation are needed.</text>

  <rect class="data" x="24" y="76" width="206" height="96" rx="12"/>
  <text x="44" y="103" class="t h">STRICT EVENT</text>
  <text x="44" y="128" class="t s">Choose any winning time</text>
  <text x="44" y="149" class="t m">The positive winner is not time zero.</text>

  <path class="arrow" d="M238 124 L272 124" marker-end="url(#peelArrow)"/>
  <rect class="warn" x="282" y="76" width="206" height="96" rx="12"/>
  <text x="302" y="103" class="t h">PEEL FIRST VALUE</text>
  <text x="302" y="128" class="t s">first value + shifted sum</text>
  <text x="302" y="149" class="t m">The shorter time remains in range.</text>

  <path class="arrow" d="M496 124 L530 124" marker-end="url(#peelArrow)"/>
  <rect class="data" x="540" y="76" width="196" height="96" rx="12"/>
  <text x="560" y="103" class="t h">BOUND REMAINDER</text>
  <text x="560" y="128" class="t s">Use the shifted maximum</text>
  <text x="560" y="149" class="t m">One pointwise inequality remains.</text>

  <path class="arrow" d="M638 181 L638 215 L380 215 L380 240" marker-end="url(#peelArrow)"/>
  <rect class="neutral" x="172" y="250" width="416" height="76" rx="12"/>
  <text x="192" y="278" class="t h">GLOBAL INDICATOR INEQUALITY</text>
  <text x="192" y="302" class="t s">maximum - shifted maximum is at most the observable on the event</text>

  <path class="arrow" d="M380 334 L380 359" marker-end="url(#peelArrow)"/>
  <rect class="keep" x="24" y="370" width="330" height="50" rx="10"/>
  <text x="44" y="392" class="t h">INTEGRATE</text>
  <text x="44" y="411" class="t m">All terms are integrable; preserve the inequality.</text>
  <rect class="keep" x="370" y="370" width="366" height="50" rx="10"/>
  <text x="390" y="392" class="t h">CANCEL BY PRESERVATION</text>
  <text x="390" y="411" class="t m">The two maximum integrals agree; the event integral is nonnegative.</text>
</svg>
