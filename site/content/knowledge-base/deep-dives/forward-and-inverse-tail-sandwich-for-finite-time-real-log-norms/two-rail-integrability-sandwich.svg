<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="sandwich-title sandwich-desc">
  <title id="sandwich-title">Two integrable rails certify the finite-time signed real log</title>
  <desc id="sandwich-desc">Pointwise units and the inverse generator moment feed an integrable lower rail. Forward positive-log integrability feeds an integrable upper rail. The measurable finite-time real log lies between them. A domination gate certifies its integrability, and signed subadditivity joins that result to form a finite-time process candidate.</desc>
  <defs>
    <marker id="sandwich-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8B3E33"/>
    </marker>
  </defs>
  <rect width="1200" height="720" fill="#F7F4F0"/>
  <text x="64" y="58" fill="#A67C52" font-family="Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="1.4">FINITE-HORIZON INTEGRABILITY</text>
  <text x="64" y="102" fill="#16243A" font-family="Georgia, serif" font-size="32" font-weight="700">The signed real log travels between two rails</text>

  <rect x="62" y="145" width="315" height="120" rx="16" fill="#F3E8E0" stroke="#A67C52" stroke-width="2"/>
  <text x="93" y="185" fill="#8B3E33" font-family="Arial, sans-serif" font-size="16" font-weight="700">POINTWISE UNITS</text>
  <text x="93" y="219" fill="#4D5B6B" font-family="Arial, sans-serif" font-size="14">make the inverse lower</text>
  <text x="93" y="243" fill="#4D5B6B" font-family="Arial, sans-serif" font-size="14">inequality honest</text>

  <rect x="442" y="145" width="315" height="120" rx="16" fill="#EAF1E5" stroke="#6F8D5E" stroke-width="2"/>
  <text x="473" y="185" fill="#315F55" font-family="Arial, sans-serif" font-size="16" font-weight="700">INVERSE GENERATOR MOMENT</text>
  <text x="473" y="219" fill="#4D5B6B" font-family="Arial, sans-serif" font-size="14">makes every finite inverse</text>
  <text x="473" y="243" fill="#4D5B6B" font-family="Arial, sans-serif" font-size="14">orbit sum integrable</text>

  <rect x="822" y="145" width="315" height="120" rx="16" fill="#E8F0F7" stroke="#4B6787" stroke-width="2"/>
  <text x="853" y="185" fill="#284E72" font-family="Arial, sans-serif" font-size="16" font-weight="700">FORWARD GENERATOR MOMENT</text>
  <text x="853" y="219" fill="#4D5B6B" font-family="Arial, sans-serif" font-size="14">makes every finite positive-log</text>
  <text x="853" y="243" fill="#4D5B6B" font-family="Arial, sans-serif" font-size="14">envelope integrable</text>

  <path d="M 220 275 L 220 342 L 368 342" fill="none" stroke="#8B3E33" stroke-width="3" marker-end="url(#sandwich-arrow)"/>
  <path d="M 599 275 L 599 342 L 515 342" fill="none" stroke="#315F55" stroke-width="3" marker-end="url(#sandwich-arrow)"/>
  <path d="M 979 275 L 979 342 L 832 342" fill="none" stroke="#284E72" stroke-width="3" marker-end="url(#sandwich-arrow)"/>

  <rect x="93" y="354" width="384" height="112" rx="16" fill="#EAF1E5" stroke="#6F8D5E" stroke-width="3"/>
  <text x="124" y="394" fill="#315F55" font-family="Arial, sans-serif" font-size="17" font-weight="700">INTEGRABLE LOWER RAIL</text>
  <text x="124" y="430" fill="#4D5B6B" font-family="Arial, sans-serif" font-size="15">negative finite inverse-orbit sum</text>

  <rect x="492" y="324" width="216" height="172" rx="20" fill="#FFFDF8" stroke="#8B3E33" stroke-width="3"/>
  <text x="600" y="370" text-anchor="middle" fill="#8B3E33" font-family="Arial, sans-serif" font-size="17" font-weight="700">SIGNED MIDDLE</text>
  <text x="600" y="410" text-anchor="middle" fill="#16243A" font-family="Georgia, serif" font-size="21" font-weight="700">finite-time</text>
  <text x="600" y="440" text-anchor="middle" fill="#16243A" font-family="Georgia, serif" font-size="21" font-weight="700">real log norm</text>
  <text x="600" y="470" text-anchor="middle" fill="#5A544C" font-family="Arial, sans-serif" font-size="14">measurable globally</text>

  <rect x="723" y="354" width="384" height="112" rx="16" fill="#E8F0F7" stroke="#4B6787" stroke-width="3"/>
  <text x="754" y="394" fill="#284E72" font-family="Arial, sans-serif" font-size="17" font-weight="700">INTEGRABLE UPPER RAIL</text>
  <text x="754" y="430" fill="#4D5B6B" font-family="Arial, sans-serif" font-size="15">finite forward positive-log envelope</text>

  <line x1="477" y1="410" x2="492" y2="410" stroke="#315F55" stroke-width="5"/>
  <line x1="708" y1="410" x2="723" y2="410" stroke="#284E72" stroke-width="5"/>

  <path d="M 600 506 L 600 548" stroke="#8B3E33" stroke-width="3" marker-end="url(#sandwich-arrow)"/>
  <rect x="326" y="560" width="548" height="88" rx="16" fill="#16243A" stroke="#16243A" stroke-width="2"/>
  <text x="600" y="596" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="17" font-weight="700">DOMINATION CERTIFIES INTEGRABILITY</text>
  <text x="600" y="626" text-anchor="middle" fill="#E8F0F7" font-family="Arial, sans-serif" font-size="14">join with signed subadditivity to obtain the finite-time candidate</text>

  <text x="64" y="691" fill="#5A544C" font-family="Arial, sans-serif" font-size="14">Vertical placement shows inequality roles, not a quantitative scale or equal distance between bounds.</text>
</svg>
