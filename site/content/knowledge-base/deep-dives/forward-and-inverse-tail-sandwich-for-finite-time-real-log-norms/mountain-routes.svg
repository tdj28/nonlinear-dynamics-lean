<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="mountain-routes-title mountain-routes-desc">
  <title id="mountain-routes-title">Two routes from positive-log growth to finite-time signed control</title>
  <desc id="mountain-routes-desc">The main route passes through three log observables, pointwise units, measurable total inversion, reversed products, two integrable rails, and a signed finite-time candidate. A separate lower route uses a strictly positive positive-log rate to turn clipping off eventually and transfer the normalized limit.</desc>
  <defs>
    <marker id="mountain-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8B3E33"/>
    </marker>
  </defs>
  <rect width="1200" height="720" fill="#F7F4F0"/>
  <text x="64" y="58" fill="#A67C52" font-family="Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="1.4">FINITE-TIME SIGNED GROWTH</text>
  <text x="64" y="101" fill="#16243A" font-family="Georgia, serif" font-size="32" font-weight="700">Two routes climb toward different summits</text>

  <text x="65" y="151" fill="#8B3E33" font-family="Arial, sans-serif" font-size="16" font-weight="700">MAIN ROUTE: BUILD THE INFRASTRUCTURE</text>
  <line x1="65" y1="165" x2="1135" y2="165" stroke="#C4B8A8" stroke-width="2"/>

  <rect x="55" y="195" width="160" height="145" rx="16" fill="#E8F0F7" stroke="#4B6787" stroke-width="2"/>
  <text x="82" y="234" fill="#284E72" font-family="Arial, sans-serif" font-size="15" font-weight="700">THREE LOGS</text>
  <text x="82" y="268" fill="#4D5B6B" font-family="Arial, sans-serif" font-size="14">separate collapse,</text>
  <text x="82" y="292" fill="#4D5B6B" font-family="Arial, sans-serif" font-size="14">contraction, and</text>
  <text x="82" y="316" fill="#4D5B6B" font-family="Arial, sans-serif" font-size="14">expansion</text>

  <path d="M 225 267 L 256 267" stroke="#8B3E33" stroke-width="3" marker-end="url(#mountain-arrow)"/>
  <rect x="267" y="195" width="160" height="145" rx="16" fill="#F3E8E0" stroke="#A67C52" stroke-width="2"/>
  <text x="294" y="234" fill="#8B3E33" font-family="Arial, sans-serif" font-size="15" font-weight="700">UNITS</text>
  <text x="294" y="268" fill="#4D5B6B" font-family="Arial, sans-serif" font-size="14">protect every</text>
  <text x="294" y="292" fill="#4D5B6B" font-family="Arial, sans-serif" font-size="14">finite product</text>
  <text x="294" y="316" fill="#4D5B6B" font-family="Arial, sans-serif" font-size="14">from vanishing</text>

  <path d="M 437 267 L 468 267" stroke="#8B3E33" stroke-width="3" marker-end="url(#mountain-arrow)"/>
  <rect x="479" y="195" width="160" height="145" rx="16" fill="#EAF1E5" stroke="#6F8D5E" stroke-width="2"/>
  <text x="506" y="234" fill="#315F55" font-family="Arial, sans-serif" font-size="15" font-weight="700">TOTAL INVERSE</text>
  <text x="506" y="268" fill="#4D5B6B" font-family="Arial, sans-serif" font-size="14">measurable from</text>
  <text x="506" y="292" fill="#4D5B6B" font-family="Arial, sans-serif" font-size="14">determinant and</text>
  <text x="506" y="316" fill="#4D5B6B" font-family="Arial, sans-serif" font-size="14">adjugate</text>

  <path d="M 649 267 L 680 267" stroke="#8B3E33" stroke-width="3" marker-end="url(#mountain-arrow)"/>
  <rect x="691" y="195" width="160" height="145" rx="16" fill="#FBF9F6" stroke="#8B3E33" stroke-width="2"/>
  <text x="718" y="234" fill="#8B3E33" font-family="Arial, sans-serif" font-size="15" font-weight="700">REVERSE ORDER</text>
  <text x="718" y="268" fill="#4D5B6B" font-family="Arial, sans-serif" font-size="14">becomes a finite</text>
  <text x="718" y="292" fill="#4D5B6B" font-family="Arial, sans-serif" font-size="14">forward-orbit</text>
  <text x="718" y="316" fill="#4D5B6B" font-family="Arial, sans-serif" font-size="14">scalar bound</text>

  <path d="M 861 267 L 892 267" stroke="#8B3E33" stroke-width="3" marker-end="url(#mountain-arrow)"/>
  <rect x="903" y="195" width="240" height="145" rx="16" fill="#16243A" stroke="#16243A" stroke-width="2"/>
  <text x="932" y="234" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="15" font-weight="700">TWO INTEGRABLE RAILS</text>
  <text x="932" y="268" fill="#E8F0F7" font-family="Arial, sans-serif" font-size="14">hold the signed real log</text>
  <text x="932" y="292" fill="#E8F0F7" font-family="Arial, sans-serif" font-size="14">and deliver a finite-time</text>
  <text x="932" y="316" fill="#E8F0F7" font-family="Arial, sans-serif" font-size="14">subadditive candidate</text>

  <text x="65" y="405" fill="#315F55" font-family="Arial, sans-serif" font-size="16" font-weight="700">SIDE ROUTE: REUSE A POSITIVE LIMIT</text>
  <line x1="65" y1="419" x2="1135" y2="419" stroke="#C4B8A8" stroke-width="2"/>

  <rect x="125" y="456" width="230" height="122" rx="16" fill="#E8F0F7" stroke="#4B6787" stroke-width="2"/>
  <text x="157" y="494" fill="#284E72" font-family="Arial, sans-serif" font-size="15" font-weight="700">POSITIVE-LOG LIMIT</text>
  <text x="157" y="528" fill="#4D5B6B" font-family="Arial, sans-serif" font-size="14">already checked almost</text>
  <text x="157" y="552" fill="#4D5B6B" font-family="Arial, sans-serif" font-size="14">everywhere</text>

  <path d="M 365 517 L 430 517" stroke="#315F55" stroke-width="3" marker-end="url(#mountain-arrow)"/>
  <rect x="442" y="456" width="230" height="122" rx="16" fill="#EAF1E5" stroke="#6F8D5E" stroke-width="2"/>
  <text x="474" y="494" fill="#315F55" font-family="Arial, sans-serif" font-size="15" font-weight="700">STRICT POSITIVE RATE</text>
  <text x="474" y="528" fill="#4D5B6B" font-family="Arial, sans-serif" font-size="14">forces clipping to become</text>
  <text x="474" y="552" fill="#4D5B6B" font-family="Arial, sans-serif" font-size="14">inactive eventually</text>

  <path d="M 682 517 L 747 517" stroke="#315F55" stroke-width="3" marker-end="url(#mountain-arrow)"/>
  <rect x="759" y="456" width="315" height="122" rx="16" fill="#16243A" stroke="#16243A" stroke-width="2"/>
  <text x="791" y="494" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="15" font-weight="700">SAME NORMALIZED REAL-LOG LIMIT</text>
  <text x="791" y="528" fill="#E8F0F7" font-family="Arial, sans-serif" font-size="14">no unit hypothesis and no</text>
  <text x="791" y="552" fill="#E8F0F7" font-family="Arial, sans-serif" font-size="14">inverse moment required</text>

  <rect x="65" y="627" width="1070" height="52" rx="12" fill="#FFFDF8" stroke="#C4B8A8" stroke-width="2"/>
  <text x="94" y="660" fill="#5A544C" font-family="Arial, sans-serif" font-size="15">Main route: finite-time signed infrastructure. Side route: a strictly positive special case. Neither route supplies a spectrum or splitting.</text>
</svg>
