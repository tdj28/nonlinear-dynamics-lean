<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820"
  role="img" aria-labelledby="title desc">
  <title id="title">Four-step forward and inverse tail sandwich ledger</title>
  <desc id="desc">The base-two exponent steps 2, negative 3, 1, and 2 produce signed prefixes 0, 2, negative 1, 0, and 2. A five-row ledger compares each signed prefix with the inverse lower rail, exact positive log, forward one-step positive rail, and inverse-product value. At horizon two, negative 3 is at most negative 1, which is at most 0, which is at most 2, while inverse value 1 is at most inverse rail 3.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#16243A" flood-opacity=".12"/>
    </filter>
    <style>
      .sans { font-family: Inter, Avenir, Helvetica, Arial, sans-serif; }
      .serif { font-family: Georgia, "Times New Roman", serif; }
      .label { font-size: 17px; font-weight: 700; letter-spacing: .06em; }
      .number { font-size: 22px; font-weight: 700; }
      .small { font-size: 15px; }
    </style>
  </defs>

  <rect width="1200" height="820" rx="28" fill="#F7F4F0"/>
  <rect x="0" y="0" width="1200" height="18" rx="9" fill="#16243A"/>
  <text x="62" y="70" class="sans label" fill="#A06E43">FINITE WORKED EXAMPLE · BASE-TWO LOG UNITS</text>
  <text x="62" y="118" class="serif" font-size="36" fill="#16243A">Four steps, every rail visible</text>
  <text x="64" y="151" class="sans" font-size="17" fill="#556170">Multiply by log 2 to recover the natural-log scale; every inequality keeps the same direction.</text>

  <g aria-label="One-step exponent sequence">
    <text x="64" y="207" class="sans label" fill="#4D5B6B">ONE-STEP EXPONENTS</text>
    <line x1="290" y1="202" x2="1085" y2="202" stroke="#C8BDAE" stroke-width="3"/>
    <g class="sans number" text-anchor="middle">
      <g transform="translate(380 202)">
        <circle r="34" fill="#DCE9F5" stroke="#456B8C" stroke-width="2"/>
        <text y="8" fill="#284E72">+2</text>
      </g>
      <g transform="translate(590 202)">
        <circle r="34" fill="#F5DDD8" stroke="#9A493E" stroke-width="2"/>
        <text y="8" fill="#8B3E33">-3</text>
      </g>
      <g transform="translate(800 202)">
        <circle r="34" fill="#DCE9F5" stroke="#456B8C" stroke-width="2"/>
        <text y="8" fill="#284E72">+1</text>
      </g>
      <g transform="translate(1010 202)">
        <circle r="34" fill="#DCE9F5" stroke="#456B8C" stroke-width="2"/>
        <text y="8" fill="#284E72">+2</text>
      </g>
    </g>
    <g class="sans small" fill="#687381" text-anchor="middle">
      <text x="380" y="254">time 0</text>
      <text x="590" y="254">time 1</text>
      <text x="800" y="254">time 2</text>
      <text x="1010" y="254">time 3</text>
    </g>
  </g>

  <g filter="url(#shadow)" aria-label="Exact numeric ledger">
    <rect x="62" y="292" width="1076" height="350" rx="18" fill="#FFFDF9" stroke="#C8BDAE" stroke-width="2"/>
    <rect x="62" y="292" width="1076" height="62" rx="18" fill="#16243A"/>
    <path d="M62 336V354H1138V336" fill="#16243A"/>
    <g class="sans" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">
      <text x="112" y="330">n</text>
      <text x="252" y="322">lower rail</text><text x="252" y="342">-J</text>
      <text x="426" y="322">signed prefix</text><text x="426" y="342">R</text>
      <text x="600" y="322">exact clipped</text><text x="600" y="342">P</text>
      <text x="774" y="322">forward rail</text><text x="774" y="342">U</text>
      <text x="948" y="322">inverse value</text><text x="948" y="342">Q</text>
      <text x="1086" y="322">Q ≤ J</text><text x="1086" y="342">holds?</text>
    </g>
    <g stroke="#DED6CB" stroke-width="1">
      <line x1="62" y1="412" x2="1138" y2="412"/>
      <line x1="62" y1="470" x2="1138" y2="470"/>
      <line x1="62" y1="528" x2="1138" y2="528"/>
      <line x1="62" y1="586" x2="1138" y2="586"/>
      <line x1="164" y1="292" x2="164" y2="642"/>
      <line x1="338" y1="292" x2="338" y2="642"/>
      <line x1="512" y1="292" x2="512" y2="642"/>
      <line x1="686" y1="292" x2="686" y2="642"/>
      <line x1="860" y1="292" x2="860" y2="642"/>
      <line x1="1036" y1="292" x2="1036" y2="642"/>
    </g>
    <rect x="64" y="470" width="1072" height="58" fill="#F5EDE3"/>
    <g class="sans number" text-anchor="middle" fill="#263548">
      <text x="112" y="392">0</text><text x="252" y="392">0</text><text x="426" y="392">0</text><text x="600" y="392">0</text><text x="774" y="392">0</text><text x="948" y="392">0</text>
      <text x="112" y="450">1</text><text x="252" y="450">0</text><text x="426" y="450" fill="#284E72">2</text><text x="600" y="450">2</text><text x="774" y="450">2</text><text x="948" y="450">0</text>
      <text x="112" y="508">2</text><text x="252" y="508" fill="#8B3E33">-3</text><text x="426" y="508" fill="#8B3E33">-1</text><text x="600" y="508">0</text><text x="774" y="508" fill="#284E72">2</text><text x="948" y="508" fill="#6A713A">1</text>
      <text x="112" y="566">3</text><text x="252" y="566" fill="#8B3E33">-3</text><text x="426" y="566">0</text><text x="600" y="566">0</text><text x="774" y="566" fill="#284E72">3</text><text x="948" y="566">0</text>
      <text x="112" y="624">4</text><text x="252" y="624" fill="#8B3E33">-3</text><text x="426" y="624" fill="#284E72">2</text><text x="600" y="624">2</text><text x="774" y="624" fill="#284E72">5</text><text x="948" y="624">0</text>
    </g>
    <g class="sans" font-size="20" font-weight="700" text-anchor="middle" fill="#39705B">
      <text x="1086" y="392">yes</text><text x="1086" y="450">yes</text><text x="1086" y="508">yes</text><text x="1086" y="566">yes</text><text x="1086" y="624">yes</text>
    </g>
  </g>

  <g aria-label="Horizon two inequality chain">
    <rect x="62" y="678" width="1076" height="95" rx="16" fill="#EAF0F4" stroke="#8AA0B5" stroke-width="2"/>
    <text x="91" y="712" class="sans label" fill="#284E72">HORIZON 2, READ LEFT TO RIGHT</text>
    <text x="91" y="752" class="serif" font-size="29" fill="#16243A">-3 = -J₂  ≤  R₂ = -1  ≤  P₂ = 0  ≤  U₂ = 2</text>
    <rect x="853" y="698" width="251" height="50" rx="12" fill="#FFFDF9" stroke="#6F8D5E" stroke-width="2"/>
    <text x="979" y="731" class="sans" font-size="21" font-weight="700" text-anchor="middle" fill="#315F55">Q₂ = 1  ≤  J₂ = 3</text>
  </g>
</svg>
