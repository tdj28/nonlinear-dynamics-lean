<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610"
  role="img" aria-labelledby="title desc">
  <title id="title">Severe scalar contraction and the missing inverse tail</title>
  <desc id="desc">For the one-step scalar multiplier 2 to the negative 100, the signed base-two log R is negative 100. The forward positive log P and forward one-step rail U are both zero because clipping erases contraction. The inverse positive log Q and inverse rail J are both 100, so the lower rail negative J exactly recovers negative 100.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#16243A" flood-opacity=".12"/>
    </filter>
    <style>
      .sans { font-family: Inter, Avenir, Helvetica, Arial, sans-serif; }
      .serif { font-family: Georgia, "Times New Roman", serif; }
      .caps { font-size: 16px; font-weight: 700; letter-spacing: .06em; }
    </style>
  </defs>

  <rect width="1200" height="610" rx="28" fill="#F7F4F0"/>
  <rect width="1200" height="18" rx="9" fill="#16243A"/>
  <text x="62" y="67" class="sans caps" fill="#A06E43">ONE-STEP BOUNDARY · EXACT BASE-TWO LOGS</text>
  <text x="62" y="114" class="serif" font-size="36" fill="#16243A">Clipping erases -100; the inverse tail restores 100</text>
  <text x="64" y="148" class="sans" font-size="17" fill="#556170">Generator a = 2⁻¹⁰⁰, so a⁻¹ = 2¹⁰⁰. No probability or asymptotic argument is needed.</text>

  <g filter="url(#shadow)" aria-label="Signed scale from negative 100 to positive 100">
    <rect x="62" y="190" width="1076" height="224" rx="18" fill="#FFFDF9" stroke="#C8BDAE" stroke-width="2"/>
    <line x1="132" y1="309" x2="1068" y2="309" stroke="#778595" stroke-width="4"/>
    <g stroke="#778595" stroke-width="3">
      <line x1="132" y1="292" x2="132" y2="326"/>
      <line x1="600" y1="292" x2="600" y2="326"/>
      <line x1="1068" y1="292" x2="1068" y2="326"/>
    </g>
    <g class="sans" font-size="18" font-weight="700" text-anchor="middle" fill="#4D5B6B">
      <text x="132" y="356">-100</text>
      <text x="600" y="356">0</text>
      <text x="1068" y="356">+100</text>
    </g>

    <circle cx="132" cy="309" r="18" fill="#8B3E33"/>
    <path d="M132 287 V235" stroke="#8B3E33" stroke-width="4"/>
    <rect x="79" y="210" width="260" height="54" rx="12" fill="#F5DDD8" stroke="#9A493E" stroke-width="2"/>
    <text x="209" y="244" class="sans" font-size="18" font-weight="700" text-anchor="middle" fill="#8B3E33">R = -100 and -J = -100</text>

    <circle cx="600" cy="309" r="18" fill="#A67C52"/>
    <path d="M600 287 V235" stroke="#A67C52" stroke-width="4"/>
    <rect x="472" y="210" width="256" height="54" rx="12" fill="#F5EDE3" stroke="#A67C52" stroke-width="2"/>
    <text x="600" y="244" class="sans" font-size="18" font-weight="700" text-anchor="middle" fill="#77512F">P = 0 and U = 0</text>

    <circle cx="1068" cy="309" r="18" fill="#315F55"/>
    <path d="M1068 287 V235" stroke="#315F55" stroke-width="4"/>
    <rect x="824" y="210" width="314" height="54" rx="12" fill="#EAF1E5" stroke="#6F8D5E" stroke-width="2"/>
    <text x="981" y="244" class="sans" font-size="18" font-weight="700" text-anchor="middle" fill="#315F55">Q = 100 and J = 100</text>

    <path d="M540 372 H660" stroke="#A67C52" stroke-width="3"/>
    <path d="M540 372 L555 363 V381 Z" fill="#A67C52"/>
    <text x="600" y="398" class="sans" font-size="15" font-weight="700" text-anchor="middle" fill="#77512F">CLIPPING COLLAPSES EVERY NEGATIVE VALUE TO ZERO</text>
  </g>

  <g aria-label="Interpretation cards">
    <rect x="62" y="450" width="520" height="112" rx="16" fill="#F5DDD8" stroke="#9A493E" stroke-width="2"/>
    <text x="88" y="485" class="sans caps" fill="#8B3E33">FORWARD MOMENT SEES</text>
    <text x="88" y="527" class="serif" font-size="28" fill="#16243A">P = U = 0</text>
    <text x="88" y="551" class="sans" font-size="15" fill="#556170">The contraction depth is completely hidden.</text>

    <rect x="618" y="450" width="520" height="112" rx="16" fill="#EAF1E5" stroke="#6F8D5E" stroke-width="2"/>
    <text x="644" y="485" class="sans caps" fill="#315F55">INVERSE MOMENT SUPPLIES</text>
    <text x="644" y="527" class="serif" font-size="28" fill="#16243A">-J = -100 ≤ R = -100</text>
    <text x="644" y="551" class="sans" font-size="15" fill="#556170">The missing lower-tail magnitude is exact here.</text>
  </g>
</svg>
