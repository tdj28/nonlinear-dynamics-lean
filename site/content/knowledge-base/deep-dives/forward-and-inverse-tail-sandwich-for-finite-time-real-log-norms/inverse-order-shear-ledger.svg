<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"
  role="img" aria-labelledby="title desc">
  <title id="title">Inverse chronological order for two noncommuting shears</title>
  <desc id="desc">The lower shear L has rows 1, 0 and 1, 1. The upper shear U has rows 1, 1 and 0, 1. The time-zero lower shear followed by the time-one upper shear forms the newest-factor-left product U L, equal to the matrix with rows 2, 1 and 1, 1. The inverse reverses order: L inverse times U inverse equals the matrix with rows 1, negative 1 and negative 1, 2. Multiplying inverse factors in the unreversed order produces rows 2, negative 1 and negative 1, 1, which is different.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#16243A" flood-opacity=".13"/>
    </filter>
    <style>
      .sans { font-family: Inter, Avenir, Helvetica, Arial, sans-serif; }
      .serif { font-family: Georgia, "Times New Roman", serif; }
      .caps { font-size: 16px; font-weight: 700; letter-spacing: .06em; }
      .matrix { font-size: 25px; font-weight: 700; }
    </style>
  </defs>

  <rect width="1200" height="720" rx="28" fill="#F7F4F0"/>
  <rect width="1200" height="18" rx="9" fill="#16243A"/>
  <text x="62" y="67" class="sans caps" fill="#A06E43">NONCOMMUTATIVE TWO-STEP CHECK</text>
  <text x="62" y="114" class="serif" font-size="36" fill="#16243A">Inversion reverses chronological order</text>
  <text x="64" y="147" class="sans" font-size="17" fill="#556170">The diagonal entries expose the error; this is not a symbolic convention.</text>

  <g aria-label="Timeline and forward product">
    <rect x="62" y="184" width="1076" height="146" rx="18" fill="#FFFDF9" stroke="#C8BDAE" stroke-width="2" filter="url(#shadow)"/>
    <text x="90" y="218" class="sans caps" fill="#4D5B6B">FORWARD TIME</text>
    <line x1="235" y1="238" x2="645" y2="238" stroke="#A67C52" stroke-width="4"/>
    <path d="M645 238 L627 227 L627 249 Z" fill="#A67C52"/>
    <circle cx="310" cy="238" r="35" fill="#EAF1E5" stroke="#6F8D5E" stroke-width="2"/>
    <text x="310" y="246" class="serif" font-size="28" font-weight="700" text-anchor="middle" fill="#315F55">L</text>
    <text x="310" y="294" class="sans" font-size="15" text-anchor="middle" fill="#687381">time 0 · earliest</text>
    <circle cx="545" cy="238" r="35" fill="#E8F0F7" stroke="#4B6787" stroke-width="2"/>
    <text x="545" y="246" class="serif" font-size="28" font-weight="700" text-anchor="middle" fill="#284E72">U</text>
    <text x="545" y="294" class="sans" font-size="15" text-anchor="middle" fill="#687381">time 1 · newest</text>
    <rect x="720" y="204" width="378" height="90" rx="14" fill="#EEF3F7" stroke="#4B6787" stroke-width="2"/>
    <text x="750" y="238" class="sans caps" fill="#284E72">NEWEST FACTOR ON THE LEFT</text>
    <text x="750" y="274" class="serif" font-size="27" fill="#16243A">U L = [[2, 1], [1, 1]]</text>
  </g>

  <g aria-label="Correct reversed inverse product">
    <rect x="62" y="365" width="1076" height="128" rx="18" fill="#EAF1E5" stroke="#6F8D5E" stroke-width="3" filter="url(#shadow)"/>
    <circle cx="111" cy="429" r="26" fill="#39705B"/>
    <path d="M99 429 L108 438 L125 417" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="160" y="405" class="sans caps" fill="#315F55">CORRECT · REVERSE THE FACTORS</text>
    <text x="160" y="453" class="serif matrix" fill="#16243A">(U L)⁻¹ = L⁻¹ U⁻¹ = [[1, -1], [-1, 2]]</text>
    <g transform="translate(907 386)" class="sans" text-anchor="middle">
      <rect x="0" y="0" width="190" height="86" rx="12" fill="#FFFDF9" stroke="#6F8D5E" stroke-width="2"/>
      <text x="95" y="30" font-size="14" font-weight="700" fill="#315F55">CHECK</text>
      <text x="95" y="61" font-size="18" font-weight="700" fill="#16243A">same matrix ✓</text>
    </g>
  </g>

  <g aria-label="Incorrect unreversed inverse product">
    <rect x="62" y="528" width="1076" height="128" rx="18" fill="#F5DDD8" stroke="#9A493E" stroke-width="3" filter="url(#shadow)"/>
    <circle cx="111" cy="592" r="26" fill="#8B3E33"/>
    <path d="M100 581 L122 603 M122 581 L100 603" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
    <text x="160" y="568" class="sans caps" fill="#8B3E33">WRONG · KEEP THE FORWARD ORDER</text>
    <text x="160" y="616" class="serif matrix" fill="#16243A">U⁻¹ L⁻¹ = [[2, -1], [-1, 1]]</text>
    <g transform="translate(850 549)" class="sans" text-anchor="middle">
      <rect x="0" y="0" width="247" height="86" rx="12" fill="#FFFDF9" stroke="#9A493E" stroke-width="2"/>
      <text x="124" y="30" font-size="14" font-weight="700" fill="#8B3E33">VISIBLE MISMATCH</text>
      <text x="124" y="61" font-size="17" font-weight="700" fill="#16243A">diagonal 2,1 not 1,2</text>
    </g>
  </g>

  <text x="600" y="695" class="sans" font-size="16" text-anchor="middle" fill="#556170">The checked theorem takes norms after the honest reversal, then replaces the product by a commutative scalar sum.</text>
</svg>
