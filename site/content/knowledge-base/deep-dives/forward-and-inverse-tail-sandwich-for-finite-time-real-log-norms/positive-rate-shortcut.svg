<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="positive-shortcut-title positive-shortcut-desc">
  <title id="positive-shortcut-title">Strict positive rate eventually turns positive-log clipping off</title>
  <desc id="positive-shortcut-desc">An almost-everywhere normalized positive-log limit enters a strict positive-rate gate. The gate yields eventual positivity, which selects the unclipped real-log branch. Eventual equality then transfers the same normalized limit. Pointwise units and inverse-tail integrability are shown outside the route as unnecessary assumptions.</desc>
  <defs>
    <marker id="shortcut-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8B3E33"/>
    </marker>
  </defs>
  <rect width="1200" height="700" fill="#F7F4F0"/>
  <text x="64" y="58" fill="#A67C52" font-family="Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="1.4">STRICT POSITIVE-RATE SHORTCUT</text>
  <text x="64" y="102" fill="#16243A" font-family="Georgia, serif" font-size="32" font-weight="700">A positive summit makes clipping disappear</text>

  <rect x="55" y="157" width="250" height="158" rx="18" fill="#E8F0F7" stroke="#4B6787" stroke-width="2"/>
  <circle cx="91" cy="193" r="20" fill="#284E72"/>
  <text x="91" y="200" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="18" font-weight="700">1</text>
  <text x="84" y="239" fill="#284E72" font-family="Arial, sans-serif" font-size="16" font-weight="700">POSITIVE-LOG LIMIT</text>
  <text x="84" y="274" fill="#4D5B6B" font-family="Arial, sans-serif" font-size="14">already checked almost</text>
  <text x="84" y="298" fill="#4D5B6B" font-family="Arial, sans-serif" font-size="14">everywhere</text>

  <path d="M 315 236 L 350 236" stroke="#8B3E33" stroke-width="3" marker-end="url(#shortcut-arrow)"/>
  <rect x="361" y="157" width="250" height="158" rx="18" fill="#EAF1E5" stroke="#6F8D5E" stroke-width="2"/>
  <circle cx="397" cy="193" r="20" fill="#315F55"/>
  <text x="397" y="200" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="18" font-weight="700">2</text>
  <text x="390" y="239" fill="#315F55" font-family="Arial, sans-serif" font-size="16" font-weight="700">STRICT POSITIVE RATE</text>
  <text x="390" y="274" fill="#4D5B6B" font-family="Arial, sans-serif" font-size="14">normalized values become</text>
  <text x="390" y="298" fill="#4D5B6B" font-family="Arial, sans-serif" font-size="14">positive eventually</text>

  <path d="M 621 236 L 656 236" stroke="#8B3E33" stroke-width="3" marker-end="url(#shortcut-arrow)"/>
  <rect x="667" y="157" width="250" height="158" rx="18" fill="#F3E8E0" stroke="#A67C52" stroke-width="2"/>
  <circle cx="703" cy="193" r="20" fill="#8B3E33"/>
  <text x="703" y="200" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="18" font-weight="700">3</text>
  <text x="696" y="239" fill="#8B3E33" font-family="Arial, sans-serif" font-size="16" font-weight="700">CLIPPING TURNS OFF</text>
  <text x="696" y="274" fill="#4D5B6B" font-family="Arial, sans-serif" font-size="14">positive log equals total</text>
  <text x="696" y="298" fill="#4D5B6B" font-family="Arial, sans-serif" font-size="14">real log eventually</text>

  <path d="M 927 236 L 962 236" stroke="#8B3E33" stroke-width="3" marker-end="url(#shortcut-arrow)"/>
  <rect x="973" y="157" width="172" height="158" rx="18" fill="#16243A" stroke="#16243A" stroke-width="2"/>
  <circle cx="1009" cy="193" r="20" fill="#A67C52"/>
  <text x="1009" y="200" text-anchor="middle" fill="#16243A" font-family="Arial, sans-serif" font-size="18" font-weight="700">4</text>
  <text x="1001" y="239" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="16" font-weight="700">SAME LIMIT</text>
  <text x="1001" y="274" fill="#E8F0F7" font-family="Arial, sans-serif" font-size="14">eventual equality</text>
  <text x="1001" y="298" fill="#E8F0F7" font-family="Arial, sans-serif" font-size="14">transfers it</text>

  <rect x="95" y="382" width="1010" height="190" rx="20" fill="#FFFDF8" stroke="#C4B8A8" stroke-width="2"/>
  <text x="128" y="425" fill="#16243A" font-family="Georgia, serif" font-size="24" font-weight="700">Assumptions outside this route</text>
  <line x1="128" y1="446" x2="1072" y2="446" stroke="#C4B8A8" stroke-width="2"/>

  <rect x="128" y="474" width="270" height="65" rx="13" fill="#FBF9F6" stroke="#8B3E33" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="263" y="514" text-anchor="middle" fill="#8B3E33" font-family="Arial, sans-serif" font-size="15" font-weight="700">NO POINTWISE UNIT GATE</text>
  <rect x="465" y="474" width="270" height="65" rx="13" fill="#FBF9F6" stroke="#8B3E33" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="600" y="514" text-anchor="middle" fill="#8B3E33" font-family="Arial, sans-serif" font-size="15" font-weight="700">NO INVERSE MOMENT GATE</text>
  <rect x="802" y="474" width="270" height="65" rx="13" fill="#E8F0F7" stroke="#4B6787" stroke-width="2"/>
  <text x="937" y="503" text-anchor="middle" fill="#284E72" font-family="Arial, sans-serif" font-size="15" font-weight="700">SINGULAR EXPANSION</text>
  <text x="937" y="526" text-anchor="middle" fill="#4D5B6B" font-family="Arial, sans-serif" font-size="13">remains allowed</text>

  <rect x="95" y="608" width="1010" height="50" rx="12" fill="#F3E8E0" stroke="#A67C52" stroke-width="2"/>
  <text x="600" y="640" text-anchor="middle" fill="#8B3E33" font-family="Arial, sans-serif" font-size="15" font-weight="700">Empty dimension has zero rate, so the strict positive premise is impossible there.</text>
</svg>
