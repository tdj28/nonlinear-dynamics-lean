<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="reverse-order-title reverse-order-desc">
  <title id="reverse-order-title">Inverse products reverse order before becoming a scalar orbit majorant</title>
  <desc id="reverse-order-desc">The forward product places the latest matrix on the left and earliest matrix on the right. The inverse product places the earliest inverse on the left and latest inverse on the right. A same-order inverse lane is crossed out. A lower pipeline turns the valid reversed product into a norm-product bound, then a positive-log sum, then a forward-orbit scalar majorant.</desc>
  <defs>
    <marker id="order-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8B3E33"/>
    </marker>
  </defs>
  <rect width="1200" height="760" fill="#F7F4F0"/>
  <text x="64" y="58" fill="#A67C52" font-family="Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="1.4">NONCOMMUTATIVE ORDER AUDIT</text>
  <text x="64" y="102" fill="#16243A" font-family="Georgia, serif" font-size="32" font-weight="700">Reverse first, then pass to a scalar envelope</text>

  <text x="72" y="158" fill="#284E72" font-family="Arial, sans-serif" font-size="15" font-weight="700">FORWARD PRODUCT</text>
  <rect x="70" y="180" width="255" height="92" rx="15" fill="#E8F0F7" stroke="#4B6787" stroke-width="2"/>
  <rect x="472" y="180" width="255" height="92" rx="15" fill="#E8F0F7" stroke="#4B6787" stroke-width="2"/>
  <rect x="874" y="180" width="255" height="92" rx="15" fill="#E8F0F7" stroke="#4B6787" stroke-width="2"/>
  <text x="197" y="217" text-anchor="middle" fill="#284E72" font-family="Arial, sans-serif" font-size="16" font-weight="700">LATEST MATRIX</text>
  <text x="197" y="246" text-anchor="middle" fill="#4D5B6B" font-family="Arial, sans-serif" font-size="14">leftmost factor</text>
  <text x="599" y="217" text-anchor="middle" fill="#284E72" font-family="Arial, sans-serif" font-size="16" font-weight="700">MIDDLE MATRIX</text>
  <text x="599" y="246" text-anchor="middle" fill="#4D5B6B" font-family="Arial, sans-serif" font-size="14">middle factor</text>
  <text x="1001" y="217" text-anchor="middle" fill="#284E72" font-family="Arial, sans-serif" font-size="16" font-weight="700">EARLIEST MATRIX</text>
  <text x="1001" y="246" text-anchor="middle" fill="#4D5B6B" font-family="Arial, sans-serif" font-size="14">rightmost factor</text>
  <text x="386" y="237" text-anchor="middle" fill="#8B3E33" font-family="Georgia, serif" font-size="28">times</text>
  <text x="788" y="237" text-anchor="middle" fill="#8B3E33" font-family="Georgia, serif" font-size="28">times</text>

  <text x="72" y="320" fill="#315F55" font-family="Arial, sans-serif" font-size="15" font-weight="700">VALID INVERSE PRODUCT</text>
  <rect x="70" y="342" width="255" height="92" rx="15" fill="#EAF1E5" stroke="#6F8D5E" stroke-width="2"/>
  <rect x="472" y="342" width="255" height="92" rx="15" fill="#EAF1E5" stroke="#6F8D5E" stroke-width="2"/>
  <rect x="874" y="342" width="255" height="92" rx="15" fill="#EAF1E5" stroke="#6F8D5E" stroke-width="2"/>
  <text x="197" y="379" text-anchor="middle" fill="#315F55" font-family="Arial, sans-serif" font-size="16" font-weight="700">EARLIEST INVERSE</text>
  <text x="197" y="408" text-anchor="middle" fill="#4D5B6B" font-family="Arial, sans-serif" font-size="14">moves to the left</text>
  <text x="599" y="379" text-anchor="middle" fill="#315F55" font-family="Arial, sans-serif" font-size="16" font-weight="700">MIDDLE INVERSE</text>
  <text x="599" y="408" text-anchor="middle" fill="#4D5B6B" font-family="Arial, sans-serif" font-size="14">stays in the middle</text>
  <text x="1001" y="379" text-anchor="middle" fill="#315F55" font-family="Arial, sans-serif" font-size="16" font-weight="700">LATEST INVERSE</text>
  <text x="1001" y="408" text-anchor="middle" fill="#4D5B6B" font-family="Arial, sans-serif" font-size="14">moves to the right</text>
  <text x="386" y="399" text-anchor="middle" fill="#8B3E33" font-family="Georgia, serif" font-size="28">times</text>
  <text x="788" y="399" text-anchor="middle" fill="#8B3E33" font-family="Georgia, serif" font-size="28">times</text>

  <rect x="70" y="470" width="1059" height="72" rx="14" fill="#F3E8E0" stroke="#A67C52" stroke-width="2"/>
  <text x="99" y="500" fill="#8B3E33" font-family="Arial, sans-serif" font-size="15" font-weight="700">INVALID SHORTCUT</text>
  <text x="266" y="500" fill="#5A544C" font-family="Arial, sans-serif" font-size="15">latest inverse, then middle inverse, then earliest inverse</text>
  <line x1="262" y1="512" x2="905" y2="512" stroke="#8B3E33" stroke-width="5"/>
  <text x="938" y="514" fill="#8B3E33" font-family="Arial, sans-serif" font-size="15" font-weight="700">fails for noncommuting matrices</text>

  <text x="72" y="590" fill="#8B3E33" font-family="Arial, sans-serif" font-size="15" font-weight="700">SCALAR ENVELOPE PIPELINE</text>
  <rect x="70" y="612" width="220" height="82" rx="14" fill="#FBF9F6" stroke="#C4B8A8" stroke-width="2"/>
  <text x="180" y="645" text-anchor="middle" fill="#16243A" font-family="Arial, sans-serif" font-size="15" font-weight="700">REVERSED PRODUCT</text>
  <text x="180" y="671" text-anchor="middle" fill="#5A544C" font-family="Arial, sans-serif" font-size="13">matrix-valued</text>
  <path d="M 300 653 L 349 653" stroke="#8B3E33" stroke-width="3" marker-end="url(#order-arrow)"/>
  <rect x="360" y="612" width="220" height="82" rx="14" fill="#E8F0F7" stroke="#4B6787" stroke-width="2"/>
  <text x="470" y="645" text-anchor="middle" fill="#284E72" font-family="Arial, sans-serif" font-size="15" font-weight="700">NORM PRODUCT BOUND</text>
  <text x="470" y="671" text-anchor="middle" fill="#5A544C" font-family="Arial, sans-serif" font-size="13">order no longer matters</text>
  <path d="M 590 653 L 639 653" stroke="#8B3E33" stroke-width="3" marker-end="url(#order-arrow)"/>
  <rect x="650" y="612" width="220" height="82" rx="14" fill="#F3E8E0" stroke="#A67C52" stroke-width="2"/>
  <text x="760" y="645" text-anchor="middle" fill="#8B3E33" font-family="Arial, sans-serif" font-size="15" font-weight="700">POSITIVE-LOG SUM</text>
  <text x="760" y="671" text-anchor="middle" fill="#5A544C" font-family="Arial, sans-serif" font-size="13">finite scalar addition</text>
  <path d="M 880 653 L 929 653" stroke="#8B3E33" stroke-width="3" marker-end="url(#order-arrow)"/>
  <rect x="940" y="612" width="189" height="82" rx="14" fill="#16243A" stroke="#16243A" stroke-width="2"/>
  <text x="1034" y="645" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="15" font-weight="700">ORBIT MAJORANT</text>
  <text x="1034" y="671" text-anchor="middle" fill="#E8F0F7" font-family="Arial, sans-serif" font-size="13">forward times only</text>
</svg>
