<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">Three meanings of stochastic stability</title>
  <desc id="desc">One highlighted branch studies a matrix generator and outputs a real growth rate. Two unselected branches study stationary measures under vanishing noise or attractor sets under random-system perturbations.</desc>
  <rect width="1200" height="600" fill="#f4eddf"/>
  <rect x="38" y="38" width="1124" height="524" rx="28" fill="#fffaf0" stroke="#315f63" stroke-width="3"/>
  <text x="78" y="98" font-family="Arial,sans-serif" font-size="20" letter-spacing="2" fill="#7a4d69">SAME PHRASE, DIFFERENT OUTPUT SPACES</text>
  <rect x="410" y="135" width="380" height="80" rx="18" fill="#eee5d2" stroke="#8a6d38" stroke-width="3"/>
  <text x="600" y="185" text-anchor="middle" font-family="Georgia,serif" font-size="30" fill="#23343b">“stochastic stability”</text>
  <g stroke="#8a6d38" stroke-width="4" fill="none"><path d="M600 215 V265 H210 V310"/><path d="M600 215 V310"/><path d="M600 265 H990 V310"/></g>
  <g font-family="Arial,sans-serif" text-anchor="middle">
    <rect x="70" y="310" width="280" height="170" rx="20" fill="#e4efe9" stroke="#315f63" stroke-width="5"/>
    <text x="210" y="350" font-size="22" fill="#315f63">RMT-36 SELECTED</text>
    <text x="210" y="392" font-size="19" fill="#23343b">vary generator G</text>
    <text x="210" y="425" font-size="19" fill="#23343b">output: real rate λ(G)</text>
    <rect x="460" y="310" width="280" height="170" rx="20" fill="#f5f0e6" stroke="#7a4d69" stroke-width="3"/>
    <text x="600" y="350" font-size="22" fill="#7a4d69">ZERO-NOISE</text>
    <text x="600" y="392" font-size="19" fill="#23343b">vary random noise</text>
    <text x="600" y="425" font-size="19" fill="#23343b">output: stationary measure</text>
    <rect x="850" y="310" width="280" height="170" rx="20" fill="#f5f0e6" stroke="#b24b40" stroke-width="3"/>
    <text x="990" y="350" font-size="22" fill="#b24b40">ATTRACTOR</text>
    <text x="990" y="392" font-size="19" fill="#23343b">vary random system</text>
    <text x="990" y="425" font-size="19" fill="#23343b">output: random set</text>
  </g>
  <text x="75" y="525" font-family="Arial,sans-serif" font-size="19" fill="#6a675f">Only the highlighted branch is formalized in GrowthRateStability.lean.</text>
</svg>
