<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Raw adjacent level spacings and normalization</title>
  <desc id="desc">A Deep Dive card shows coincident levels with a zero gap, another gap of three, and a mass-normalized empirical measure whose mean is three halves.</desc>
  <rect width="1200" height="630" fill="#e9f0ed"/>
  <rect x="40" y="40" width="1120" height="550" rx="28" fill="#fffaf1" stroke="#2d7f73" stroke-width="4"/>
  <text x="78" y="102" font-family="system-ui,sans-serif" font-size="25" font-weight="750" fill="#2d7f73">KNOWLEDGE BASE · DEEP DIVE</text>
  <text x="78" y="166" font-family="system-ui,sans-serif" font-size="41" font-weight="780" fill="#17324d">RAW ADJACENT LEVEL SPACINGS</text>
  <text x="78" y="217" font-family="system-ui,sans-serif" font-size="41" font-weight="780" fill="#17324d">COUNTING MEASURES · NORMALIZATION</text>
  <rect x="78" y="257" width="478" height="218" rx="20" fill="#e6eef4" stroke="#376780" stroke-width="3"/>
  <line x1="145" y1="319" x2="470" y2="319" stroke="#2d7f73" stroke-width="7"/>
  <line x1="145" y1="333" x2="470" y2="333" stroke="#2d7f73" stroke-width="7"/>
  <line x1="145" y1="421" x2="470" y2="421" stroke="#8a5b3d" stroke-width="7"/>
  <text x="118" y="329" text-anchor="end" font-family="Georgia,serif" font-size="23" fill="#17324d">2</text>
  <text x="118" y="429" text-anchor="end" font-family="Georgia,serif" font-size="23" fill="#17324d">−1</text>
  <text x="492" y="329" font-family="Georgia,serif" font-size="23" fill="#8a3333">0</text>
  <text x="492" y="385" font-family="Georgia,serif" font-size="23" fill="#8a3333">3</text>
  <rect x="600" y="257" width="522" height="218" rx="20" fill="#e1eee6" stroke="#2d7f73" stroke-width="3"/>
  <text x="861" y="314" text-anchor="middle" font-family="Georgia,serif" font-size="30" fill="#285448">L = ½δ₀ + ½δ₃</text>
  <text x="861" y="367" text-anchor="middle" font-family="system-ui,sans-serif" font-size="21" fill="#285448">total mass = 1</text>
  <text x="861" y="420" text-anchor="middle" font-family="Georgia,serif" font-size="29" fill="#8a3333">mean gap = 3/2</text>
  <text x="600" y="538" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" font-weight="750" fill="#17324d">ZERO GAPS STAY · EMPTY DIMENSIONS STAY ZERO · UNFOLDING STAYS LATER</text>
</svg>
