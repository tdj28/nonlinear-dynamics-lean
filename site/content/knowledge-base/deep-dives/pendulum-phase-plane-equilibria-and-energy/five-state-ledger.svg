<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Five exact quarter-turn pendulum states</title>
  <desc id="desc">Five pendulum poses across one full turn show restoring acceleration directions, three equilibrium representatives, and a symmetric energy pattern.</desc>
  <defs><marker id="down" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#a14f3f"/></marker></defs>
  <rect width="1200" height="650" rx="24" fill="#f7f1e5"/>
  <text x="60" y="67" font-family="system-ui,sans-serif" font-size="30" font-weight="750" fill="#183c3a">FIVE QUARTER-TURN STATES AT ZERO VELOCITY</text>
  <rect x="45" y="105" width="1110" height="410" rx="22" fill="#fffaf1" stroke="#315f63" stroke-width="3"/>
  <g font-family="system-ui,sans-serif" text-anchor="middle">
    <g transform="translate(155 0)"><circle cx="0" cy="178" r="10" fill="#263c3b"/><line x1="0" y1="178" x2="0" y2="280" stroke="#315f63" stroke-width="8"/><circle cx="0" cy="300" r="24" fill="#d18b3c"/><text x="0" y="370" font-size="24" font-weight="700" fill="#16324f">down</text><text x="0" y="405" font-size="19" fill="#285448">equilibrium</text><text x="0" y="459" font-size="20" fill="#874d3b">lowest energy</text></g>
    <g transform="translate(378 0)"><circle cx="0" cy="178" r="10" fill="#263c3b"/><line x1="0" y1="178" x2="102" y2="178" stroke="#315f63" stroke-width="8"/><circle cx="122" cy="178" r="24" fill="#d18b3c"/><line x1="122" y1="220" x2="122" y2="285" stroke="#a14f3f" stroke-width="5" marker-end="url(#down)"/><text x="60" y="370" font-size="24" font-weight="700" fill="#16324f">right quarter</text><text x="60" y="405" font-size="19" fill="#285448">negative acceleration</text><text x="60" y="459" font-size="20" fill="#874d3b">middle energy</text></g>
    <g transform="translate(600 0)"><circle cx="0" cy="300" r="10" fill="#263c3b"/><line x1="0" y1="300" x2="0" y2="198" stroke="#315f63" stroke-width="8"/><circle cx="0" cy="178" r="24" fill="#d18b3c"/><text x="0" y="370" font-size="24" font-weight="700" fill="#16324f">upright</text><text x="0" y="405" font-size="19" fill="#285448">equilibrium</text><text x="0" y="459" font-size="20" fill="#874d3b">highest potential</text></g>
    <g transform="translate(822 0)"><circle cx="122" cy="178" r="10" fill="#263c3b"/><line x1="122" y1="178" x2="20" y2="178" stroke="#315f63" stroke-width="8"/><circle cx="0" cy="178" r="24" fill="#d18b3c"/><line x1="0" y1="285" x2="0" y2="220" stroke="#a14f3f" stroke-width="5" marker-end="url(#down)"/><text x="60" y="370" font-size="24" font-weight="700" fill="#16324f">left quarter</text><text x="60" y="405" font-size="19" fill="#285448">positive acceleration</text><text x="60" y="459" font-size="20" fill="#874d3b">middle energy</text></g>
    <g transform="translate(1045 0)"><circle cx="0" cy="178" r="10" fill="#263c3b"/><line x1="0" y1="178" x2="0" y2="280" stroke="#315f63" stroke-width="8"/><circle cx="0" cy="300" r="24" fill="#d18b3c"/><text x="0" y="370" font-size="24" font-weight="700" fill="#16324f">down + turn</text><text x="0" y="405" font-size="19" fill="#285448">equilibrium</text><text x="0" y="459" font-size="20" fill="#874d3b">lowest energy</text></g>
  </g>
  <text x="600" y="566" text-anchor="middle" font-family="Georgia,serif" font-size="24" fill="#263c3b">The first and last coordinates differ on the real angle cover; the field and energy repeat.</text>
  <text x="600" y="606" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" fill="#285448">Exact numerical values appear in the adjacent checked table and bounded worksheet.</text>
</svg>
