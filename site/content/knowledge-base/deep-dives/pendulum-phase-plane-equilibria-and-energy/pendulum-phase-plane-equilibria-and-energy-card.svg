<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Pendulum phase plane, equilibria, and energy</title>
  <desc id="desc">Five pendulum poses lead to a restoring vector-field pattern and a repeating energy landscape.</desc>
