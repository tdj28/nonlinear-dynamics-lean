  <text x="78" y="177" font-family="system-ui,sans-serif" font-size="44" font-weight="780" fill="#16324f">PENDULUM PHASE PLANE,</text>
  <text x="78" y="230" font-family="system-ui,sans-serif" font-size="44" font-weight="780" fill="#16324f">EQUILIBRIA, AND ENERGY</text>
  <g transform="translate(115 285)"><circle cx="0" cy="0" r="9" fill="#263c3b"/><line x1="0" y1="0" x2="0" y2="95" stroke="#315f63" stroke-width="8"/><circle cx="0" cy="112" r="23" fill="#d18b3c"/><circle cx="240" cy="0" r="9" fill="#263c3b"/><line x1="240" y1="0" x2="335" y2="0" stroke="#315f63" stroke-width="8"/><circle cx="353" cy="0" r="23" fill="#d18b3c"/><circle cx="593" cy="112" r="9" fill="#263c3b"/><line x1="593" y1="112" x2="593" y2="17" stroke="#315f63" stroke-width="8"/><circle cx="593" cy="0" r="23" fill="#d18b3c"/><circle cx="833" cy="0" r="9" fill="#263c3b"/><line x1="833" y1="0" x2="928" y2="0" stroke="#315f63" stroke-width="8"/><circle cx="946" cy="0" r="23" fill="#d18b3c"/></g>
  <rect x="105" y="450" width="990" height="78" rx="18" fill="#dfece3"/><text x="600" y="500" text-anchor="middle" font-family="Georgia,serif" font-size="28" fill="#263c3b">field arrows · repeated equilibria · energy cancellation</text>
  <text x="600" y="560" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" font-weight="650" fill="#874d3b">THE IDENTITY STOPS BEFORE ORBIT AND STABILITY CLAIMS</text>
