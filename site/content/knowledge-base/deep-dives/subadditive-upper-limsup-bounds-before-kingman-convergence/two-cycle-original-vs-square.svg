<svg xmlns="http://www.w3.org/2000/svg" width="760" height="500" viewBox="0 0 760 500" role="img" aria-labelledby="originalSquareTitle originalSquareDesc">
  <title id="originalSquareTitle">The original two-state flip and its square have different ergodicity</title>
  <desc id="originalSquareDesc">The original flip exchanges two equally weighted states and is ergodic. Its square is the identity, fixes both singleton states, and is not ergodic. Phase averaging lets the proof use additive averages only under the original map.</desc>
  <rect width="760" height="500" fill="#F7F4F0"/>
  <style>.t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#2C2924}.title{font-size:18px;font-weight:700}.h{font-size:14px;font-weight:700}.s{font-size:12px}.m{font-size:11px;fill:#5A544C}.blue{fill:#E8F0F7;stroke:#4B6787;stroke-width:1.5}.green{fill:#EAF1E5;stroke:#6F8D5E;stroke-width:1.5}.clay{fill:#F3E8E0;stroke:#A67C52;stroke-width:1.5}.arrow{fill:none;stroke:#A67C52;stroke-width:2.2;marker-end:url(#squareArrow)}</style>
  <defs><marker id="squareArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#A67C52"/></marker></defs>
  <text x="24" y="30" class="t title">Do not transfer ergodicity from a map to its square</text><text x="24" y="51" class="t m">The two-cycle is the smallest sharp warning.</text>
  <rect x="24" y="82" width="344" height="282" rx="14" class="green"/><text x="48" y="113" class="t h">ORIGINAL FLIP</text><circle cx="112" cy="182" r="35" fill="#E8F0F7" stroke="#4B6787" stroke-width="1.5"/><circle cx="280" cy="182" r="35" fill="#F3E8E0" stroke="#A67C52" stroke-width="1.5"/><text x="112" y="187" text-anchor="middle" class="t h">A</text><text x="280" y="187" text-anchor="middle" class="t h">B</text><path d="M150 168C185 135 225 135 242 168" class="arrow"/><path d="M242 197C207 230 167 230 150 197" class="arrow"/><text x="48" y="270" class="t h">ERGODIC</text><text x="48" y="297" class="t s">The singleton states are exchanged.</text><text x="48" y="326" class="t m">Use ordinary-map additive averages here.</text>
  <rect x="392" y="82" width="344" height="282" rx="14" class="clay"/><text x="416" y="113" class="t h">FLIP TWICE</text><circle cx="480" cy="182" r="35" fill="#E8F0F7" stroke="#4B6787" stroke-width="1.5"/><circle cx="648" cy="182" r="35" fill="#F3E8E0" stroke="#A67C52" stroke-width="1.5"/><text x="480" y="187" text-anchor="middle" class="t h">A</text><text x="648" y="187" text-anchor="middle" class="t h">B</text><path d="M480 224V246" class="arrow"/><path d="M648 224V246" class="arrow"/><text x="416" y="270" class="t h">IDENTITY AND NOT ERGODIC</text><text x="416" y="297" class="t s">Both singleton states stay invariant.</text><text x="416" y="326" class="t m">Measure preservation alone still survives.</text>
  <rect x="24" y="390" width="712" height="86" rx="14" class="blue"/><text x="48" y="421" class="t h">SAFE PROOF ROUTE</text><text x="48" y="449" class="t s">Average all block phases first, then call Birkhoff only for the original transformation.</text>
</svg>
