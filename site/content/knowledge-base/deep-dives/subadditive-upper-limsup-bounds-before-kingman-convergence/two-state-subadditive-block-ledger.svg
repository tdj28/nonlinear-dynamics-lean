<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1140"
     viewBox="0 0 1440 1140" role="img"
     aria-labelledby="subadditive-ledger-title subadditive-ledger-desc">
  <title id="subadditive-ledger-title">Two-state subadditive process and sharp block-two limsup ledger</title>
  <desc id="subadditive-ledger-desc">On two equally likely states a and b, the map T swaps the states and T squared is the identity. The process X n omega equals ceiling n over two plus phi of T to the n omega minus phi omega. A table through horizon eight shows both normalized paths approaching one half. A centered ledger shows Y n equals minus floor n over two and the block-two integral identity minus one equals one minus two. Block targets for lengths one through six have infimum one half, and the residue coefficients for block two approach one half under the original map.</desc>
  <defs>
    <marker id="ledger-arrow-blue" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#315a70"/>
    </marker>
    <marker id="ledger-arrow-rust" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#a5532d"/>
    </marker>
    <style>
      .title { font: 700 38px Georgia, serif; fill: #16283a; }
      .subtitle { font: 20px Arial, sans-serif; fill: #516172; }
      .panelTitle { font: 700 24px Arial, sans-serif; fill: #203c54; }
      .label { font: 18px Arial, sans-serif; fill: #263746; }
      .small { font: 16px Arial, sans-serif; fill: #526170; }
      .math { font: 21px Georgia, serif; fill: #172d40; }
      .mathStrong { font: 700 23px Georgia, serif; fill: #172d40; }
      .head { font: 700 17px Arial, sans-serif; fill: #fffaf0; }
      .cell { font: 17px Arial, sans-serif; fill: #243746; }
    </style>
  </defs>

  <rect width="1440" height="1140" fill="#f6f0e4"/>
  <rect width="1440" height="18" fill="#1f3f58"/>
  <text x="66" y="66" class="title">One block sees the exact eventual upper edge</text>
  <text x="66" y="100" class="subtitle">Uniform two-state flip; φ(a)=0, φ(b)=1; X<tspan baseline-shift="sub" font-size="15">n</tspan>(ω)=⌈n/2⌉+φ(T<tspan baseline-shift="super" font-size="15">n</tspan>ω)−φ(ω)</text>

  <rect x="52" y="132" width="506" height="300" rx="20" fill="#fffaf0" stroke="#c8b89e" stroke-width="2"/>
  <text x="80" y="172" class="panelTitle">1 · The original map and its square</text>
  <circle cx="170" cy="258" r="52" fill="#dceaf0" stroke="#315a70" stroke-width="3"/>
  <circle cx="440" cy="258" r="52" fill="#f1dfcf" stroke="#a5532d" stroke-width="3"/>
  <text x="162" y="268" class="mathStrong">a</text>
  <text x="432" y="268" class="mathStrong">b</text>
  <path d="M224 239C280 197 354 197 386 237" fill="none" stroke="#315a70"
        stroke-width="4" marker-end="url(#ledger-arrow-blue)"/>
  <path d="M386 281C335 325 271 325 224 281" fill="none" stroke="#a5532d"
        stroke-width="4" marker-end="url(#ledger-arrow-rust)"/>
  <text x="280" y="210" class="label">T swaps</text>
  <text x="88" y="335" class="label">T is ergodic.</text>
  <text x="88" y="366" class="label">T² = identity is not ergodic.</text>
  <rect x="80" y="385" width="450" height="28" rx="8" fill="#e9f0f3"/>
  <text x="98" y="405" class="small">The proof applies Birkhoff only to T, after combining residues.</text>

  <rect x="586" y="132" width="802" height="300" rx="20" fill="#fffaf0" stroke="#c8b89e" stroke-width="2"/>
  <text x="614" y="172" class="panelTitle">2 · Both normalized paths approach 1/2</text>
  <rect x="614" y="194" width="746" height="38" rx="8" fill="#315a70"/>
  <text x="634" y="219" class="head">n</text>
  <text x="702" y="219" class="head">X<tspan baseline-shift="sub" font-size="13">n</tspan>(a)</text>
  <text x="815" y="219" class="head">X<tspan baseline-shift="sub" font-size="13">n</tspan>(b)</text>
  <text x="931" y="219" class="head">X<tspan baseline-shift="sub" font-size="13">n</tspan>(a)/n</text>
  <text x="1064" y="219" class="head">X<tspan baseline-shift="sub" font-size="13">n</tspan>(b)/n</text>
  <text x="1207" y="219" class="head">integral/n</text>
  <g class="cell">
    <rect x="614" y="233" width="746" height="21" fill="#f2eadb"/>
    <text x="636" y="250">0</text><text x="726" y="250">0</text><text x="839" y="250">0</text><text x="968" y="250">0</text><text x="1101" y="250">0</text><text x="1243" y="250">0</text>
    <rect x="614" y="254" width="746" height="21" fill="#fffaf0"/>
    <text x="636" y="271">1</text><text x="726" y="271">2</text><text x="839" y="271">0</text><text x="968" y="271">2</text><text x="1101" y="271">0</text><text x="1243" y="271">1</text>
    <rect x="614" y="275" width="746" height="21" fill="#e7efe4"/>
    <text x="636" y="292">2</text><text x="726" y="292">1</text><text x="839" y="292">1</text><text x="957" y="292">1/2</text><text x="1090" y="292">1/2</text><text x="1232" y="292">1/2</text>
    <rect x="614" y="296" width="746" height="21" fill="#fffaf0"/>
    <text x="636" y="313">3</text><text x="726" y="313">3</text><text x="839" y="313">1</text><text x="968" y="313">1</text><text x="1090" y="313">1/3</text><text x="1232" y="313">2/3</text>
    <rect x="614" y="317" width="746" height="21" fill="#e7efe4"/>
    <text x="636" y="334">4</text><text x="726" y="334">2</text><text x="839" y="334">2</text><text x="957" y="334">1/2</text><text x="1090" y="334">1/2</text><text x="1232" y="334">1/2</text>
    <rect x="614" y="338" width="746" height="21" fill="#fffaf0"/>
    <text x="636" y="355">5</text><text x="726" y="355">4</text><text x="839" y="355">2</text><text x="957" y="355">4/5</text><text x="1090" y="355">2/5</text><text x="1232" y="355">3/5</text>
    <rect x="614" y="359" width="746" height="21" fill="#e7efe4"/>
    <text x="636" y="376">6</text><text x="726" y="376">3</text><text x="839" y="376">3</text><text x="957" y="376">1/2</text><text x="1090" y="376">1/2</text><text x="1232" y="376">1/2</text>
    <rect x="614" y="380" width="746" height="21" fill="#fffaf0"/>
    <text x="636" y="397">7</text><text x="726" y="397">5</text><text x="839" y="397">3</text><text x="957" y="397">5/7</text><text x="1090" y="397">3/7</text><text x="1232" y="397">4/7</text>
    <rect x="614" y="401" width="746" height="21" fill="#e7efe4"/>
    <text x="636" y="418">8</text><text x="726" y="418">4</text><text x="839" y="418">4</text><text x="957" y="418">1/2</text><text x="1090" y="418">1/2</text><text x="1232" y="418">1/2</text>
  </g>

  <rect x="52" y="460" width="1336" height="102" rx="18" fill="#1f3f58"/>
  <text x="80" y="495" class="head">THE FIXED-BLOCK STATEMENT AT b = 2</text>
  <text x="80" y="535" style="font:700 28px Georgia,serif;fill:#fffaf0;">
    limsup X<tspan baseline-shift="sub" font-size="20">n</tspan>(ω)/n = 1/2  ≤  (integral X<tspan baseline-shift="sub" font-size="20">2</tspan>)/2 = ((1+1)/2)/2 = 1/2
  </text>
  <text x="1130" y="496" style="font:17px Arial,sans-serif;fill:#dce8ec;">sharp equality</text>

  <rect x="52" y="590" width="638" height="492" rx="20" fill="#fffaf0" stroke="#c8b89e" stroke-width="2"/>
  <text x="80" y="630" class="panelTitle">3 · Centering exposes the cancellation</text>
  <text x="80" y="666" class="math">X<tspan baseline-shift="sub" font-size="15">1</tspan>(a)=2, X<tspan baseline-shift="sub" font-size="15">1</tspan>(b)=0; its orbit average tends to 1.</text>
  <text x="80" y="700" class="mathStrong">Y<tspan baseline-shift="sub" font-size="16">n</tspan>(a)=Y<tspan baseline-shift="sub" font-size="16">n</tspan>(b)=−⌊n/2⌋</text>

  <rect x="80" y="724" width="582" height="42" rx="8" fill="#315a70"/>
  <text x="98" y="751" class="head">n</text>
  <text x="162" y="751" class="head">0</text><text x="220" y="751" class="head">1</text>
  <text x="278" y="751" class="head">2</text><text x="336" y="751" class="head">3</text>
  <text x="394" y="751" class="head">4</text><text x="452" y="751" class="head">5</text>
  <text x="510" y="751" class="head">6</text><text x="568" y="751" class="head">7</text>
  <text x="626" y="751" class="head">8</text>
  <rect x="80" y="767" width="582" height="42" fill="#e7efe4"/>
  <text x="98" y="794" class="cell">Y<tspan baseline-shift="sub" font-size="13">n</tspan></text>
  <text x="162" y="794" class="cell">0</text><text x="220" y="794" class="cell">0</text>
  <text x="274" y="794" class="cell">-1</text><text x="332" y="794" class="cell">-1</text>
  <text x="390" y="794" class="cell">-2</text><text x="448" y="794" class="cell">-2</text>
  <text x="506" y="794" class="cell">-3</text><text x="564" y="794" class="cell">-3</text>
  <text x="622" y="794" class="cell">-4</text>

  <rect x="80" y="833" width="582" height="104" rx="12" fill="#edf1e7"/>
  <text x="104" y="866" class="mathStrong">integral Y<tspan baseline-shift="sub" font-size="16">2</tspan> = −1 = 1 − 2(1)</text>
  <text x="104" y="902" class="mathStrong">(−1)/2 + 1 = 1/2</text>
  <text x="104" y="928" class="small">centered limit + one-step Birkhoff limit = block target</text>

  <text x="80" y="976" class="label">Normalized block-integral targets:</text>
  <text x="80" y="1012" class="math">b:       1     2     3     4     5     6</text>
  <text x="80" y="1046" class="math">target: 1    1/2   2/3   1/2   3/5   1/2</text>
  <text x="80" y="1071" class="small">Their positive-block infimum is 1/2.</text>

  <rect x="718" y="590" width="670" height="492" rx="20" fill="#fffaf0" stroke="#c8b89e" stroke-width="2"/>
  <text x="746" y="630" class="panelTitle">4 · Two residues, one original-map limit</text>
  <text x="746" y="666" class="math">n=2a+r, r in {0,1}; prefix=2(a-1)</text>
  <text x="746" y="700" class="math">coefficient = 2(a-1) / (2(2a+r)) → 1/2</text>

  <rect x="746" y="724" width="614" height="42" rx="8" fill="#a5532d"/>
  <text x="770" y="751" class="head">a</text>
  <text x="870" y="751" class="head">r=0 coefficient</text>
  <text x="1110" y="751" class="head">r=1 coefficient</text>
  <g class="cell">
    <rect x="746" y="767" width="614" height="45" fill="#f2eadb"/>
    <text x="772" y="796">2</text><text x="928" y="796">1/4</text><text x="1172" y="796">1/5</text>
    <rect x="746" y="812" width="614" height="45" fill="#fffaf0"/>
    <text x="772" y="841">3</text><text x="928" y="841">1/3</text><text x="1172" y="841">2/7</text>
    <rect x="746" y="857" width="614" height="45" fill="#f2eadb"/>
    <text x="772" y="886">4</text><text x="928" y="886">3/8</text><text x="1172" y="886">1/3</text>
    <rect x="746" y="902" width="614" height="45" fill="#fffaf0"/>
    <text x="772" y="931">5</text><text x="928" y="931">2/5</text><text x="1172" y="931">4/11</text>
    <rect x="746" y="947" width="614" height="45" fill="#f2eadb"/>
    <text x="772" y="976">6</text><text x="918" y="976">5/12</text><text x="1162" y="976">5/13</text>
  </g>
  <rect x="746" y="1012" width="614" height="48" rx="10" fill="#e9f0f3"/>
  <text x="770" y="1043" class="label">Both lanes approach 1/2; Birkhoff is applied to T, never T².</text>
</svg>
