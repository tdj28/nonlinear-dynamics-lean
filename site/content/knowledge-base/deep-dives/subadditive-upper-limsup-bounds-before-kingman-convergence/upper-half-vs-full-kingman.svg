<svg xmlns="http://www.w3.org/2000/svg" width="760" height="470" viewBox="0 0 760 470" role="img" aria-labelledby="upperHalfTitle upperHalfDesc">
  <title id="upperHalfTitle">An upper limsup bound is only half of a convergence argument</title>
  <desc id="upperHalfDesc">The checked upper branch caps the eventual upper edge by a deterministic rate. The lower branch that would control the eventual lower edge is absent. Full Kingman-style convergence would require both branches to meet, so it is not claimed.</desc>
  <rect width="760" height="470" fill="#F7F4F0"/>
  <style>.t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#2C2924}.title{font-size:18px;font-weight:700}.h{font-size:14px;font-weight:700}.s{font-size:12px}.m{font-size:11px;fill:#5A544C}.green{fill:#EAF1E5;stroke:#6F8D5E;stroke-width:1.5}.clay{fill:#F3E8E0;stroke:#A67C52;stroke-width:1.5}.cream{fill:#FBF9F6;stroke:#C4B8A8;stroke-width:1.5}.dash{fill:#EDE8E1;stroke:#7F786D;stroke-width:1.5;stroke-dasharray:7 5}</style>
  <text x="24" y="30" class="t title">RMT-29 formalizes the upper half only</text><text x="24" y="51" class="t m">A one-sided ceiling does not identify a limit.</text>
  <rect x="24" y="86" width="344" height="184" rx="14" class="green"/><text x="48" y="118" class="t h">CHECKED UPPER BRANCH</text><text x="48" y="151" class="t s">Finite phase averaging</text><text x="48" y="178" class="t s">Original-map Birkhoff limits</text><text x="48" y="205" class="t s">Every positive block</text><text x="48" y="235" class="t h">UPPER LIMSUP AT MOST THE RATE</text>
  <rect x="392" y="86" width="344" height="184" rx="14" class="dash"/><text x="416" y="118" class="t h">MISSING LOWER BRANCH</text><text x="416" y="151" class="t s">No lower liminf estimate</text><text x="416" y="178" class="t s">No reverse inequality</text><text x="416" y="205" class="t s">No equality mechanism</text><text x="416" y="235" class="t h">NOT FORMALIZED HERE</text>
  <rect x="112" y="304" width="536" height="88" rx="14" class="cream"/><text x="380" y="337" text-anchor="middle" class="t h">FULL KINGMAN-STYLE CONVERGENCE</text><text x="380" y="365" text-anchor="middle" class="t s">Would need the upper and lower eventual edges to meet.</text>
  <rect x="24" y="414" width="712" height="34" rx="10" class="clay"/><text x="380" y="436" text-anchor="middle" class="t s">No convergence, equality, signed Lyapunov exponent, or invariant splitting is claimed.</text>
</svg>
