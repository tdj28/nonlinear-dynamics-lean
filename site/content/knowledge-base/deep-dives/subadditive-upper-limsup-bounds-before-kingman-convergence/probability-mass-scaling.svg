<svg xmlns="http://www.w3.org/2000/svg" width="760" height="480" viewBox="0 0 760 480" role="img" aria-labelledby="massScalingTitle massScalingDesc">
  <title id="massScalingTitle">A one-point example exposes the probability scaling gate</title>
  <desc id="massScalingDesc">In a toy one-point system with constant sample rate one, assigning total mass one half leaves the sample rate at one but makes the raw integral one half. Assigning probability mass one makes the raw integral one. General finite positive mass therefore needs normalization.</desc>
  <rect width="760" height="480" fill="#F7F4F0"/>
  <style>.t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#2C2924}.title{font-size:18px;font-weight:700}.h{font-size:14px;font-weight:700}.s{font-size:12px}.m{font-size:11px;fill:#5A544C}.blue{fill:#E8F0F7;stroke:#4B6787;stroke-width:1.5}.green{fill:#EAF1E5;stroke:#6F8D5E;stroke-width:1.5}.clay{fill:#F3E8E0;stroke:#A67C52;stroke-width:1.5}.cream{fill:#FBF9F6;stroke:#C4B8A8;stroke-width:1.5}</style>
  <text x="24" y="30" class="t title">Toy one-point system: the orbit rate ignores measure rescaling</text><text x="24" y="51" class="t m">The values below are an analytic counterexample, not collected data.</text>
  <rect x="24" y="82" width="712" height="86" rx="14" class="blue"/><text x="48" y="113" class="t h">SAME POINT, SAME ORBIT, SAME CONSTANT SAMPLE RATE</text><text x="48" y="143" class="t s">The normalized samplewise rate is one in both measure choices.</text>
  <rect x="24" y="194" width="344" height="164" rx="14" class="clay"/><text x="48" y="225" class="t h">TOTAL MASS ONE HALF</text><text x="48" y="260" class="t s">sample rate: one</text><text x="48" y="287" class="t s">raw integral: one half</text><text x="48" y="327" class="t h">RAW SCALES DO NOT MATCH</text>
  <rect x="392" y="194" width="344" height="164" rx="14" class="green"/><text x="416" y="225" class="t h">TOTAL MASS ONE</text><text x="416" y="260" class="t s">sample rate: one</text><text x="416" y="287" class="t s">raw integral: one</text><text x="416" y="327" class="t h">PROBABILITY SCALES MATCH</text>
  <rect x="24" y="386" width="712" height="66" rx="12" class="cream"/><text x="48" y="414" class="t h">GENERAL FINITE POSITIVE MASS</text><text x="48" y="437" class="t s">Normalize the integral by total mass; that is outside the raw-integral theorem.</text>
</svg>
