<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">Constant scalar signed-rate family</title>
  <desc id="desc">A real rate axis marks contraction, neutrality, and expansion. The generator exp r has horizon-n signed log n r and normalized rate r.</desc>
  <rect width="1200" height="440" rx="26" fill="#f7f1e5"/>
  <text x="600" y="58" text-anchor="middle" font-family="Georgia,serif" font-size="34" fill="#23343b">Aᵣ = [exp(r)]  →  Cₙ = [exp(nr)]  →  log ‖Cₙ‖ / n = r</text>
  <line x1="110" y1="240" x2="1090" y2="240" stroke="#23343b" stroke-width="5"/>
  <path d="M1090 240 l-20 -12 v24 z" fill="#23343b"/>
  <g font-family="Arial,sans-serif" text-anchor="middle">
    <circle cx="300" cy="240" r="16" fill="#b24b40"/><text x="300" y="210" font-size="24" fill="#b24b40">−1</text><text x="300" y="300" font-size="23" fill="#23343b">contraction</text><text x="300" y="334" font-size="20" fill="#536165">signed log = −n</text>
    <circle cx="600" cy="240" r="16" fill="#8a6d38"/><text x="600" y="210" font-size="24" fill="#8a6d38">0</text><text x="600" y="300" font-size="23" fill="#23343b">neutral</text><text x="600" y="334" font-size="20" fill="#536165">signed log = 0</text>
    <circle cx="900" cy="240" r="16" fill="#7a4d69"/><text x="900" y="210" font-size="24" fill="#7a4d69">1</text><text x="900" y="300" font-size="23" fill="#23343b">expansion</text><text x="900" y="334" font-size="20" fill="#536165">signed log = n</text>
  </g>
</svg>
