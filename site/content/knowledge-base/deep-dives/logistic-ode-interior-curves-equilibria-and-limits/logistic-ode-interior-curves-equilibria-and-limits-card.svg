<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Logistic ODE interior curves, equilibria, and limits</title>
  <desc id="desc">A five-state vector-field ledger leads to a sigmoid derivative identity and two equilibrium limits.</desc>
  <rect width="1200" height="630" fill="#f1e9da"/><rect x="40" y="40" width="1120" height="550" rx="28" fill="#fffaf1" stroke="#315f63" stroke-width="4"/>
  <text x="78" y="105" font-family="system-ui,sans-serif" font-size="25" font-weight="750" fill="#2d7f73">KNOWLEDGE BASE · DEEP DIVE</text>
  <text x="78" y="170" font-family="system-ui,sans-serif" font-size="43" font-weight="780" fill="#16324f">LOGISTIC-ODE INTERIOR CURVES</text>
  <text x="78" y="220" font-family="system-ui,sans-serif" font-size="31" font-weight="650" fill="#874d3b">equilibria · derivative identity · infinite-time limits</text>
  <g transform="translate(95 300)"><line x1="0" y1="180" x2="390" y2="180" stroke="#263c3b" stroke-width="4"/><g fill="#2d7f73"><rect x="85" y="80" width="42" height="100" rx="5"/><rect x="170" y="45" width="42" height="135" rx="5"/><rect x="255" y="80" width="42" height="100" rx="5"/></g><g font-family="Georgia,serif" font-size="20" fill="#263c3b" text-anchor="middle"><text x="20" y="215">0</text><text x="106" y="215">1/4</text><text x="191" y="215">1/2</text><text x="276" y="215">3/4</text><text x="370" y="215">1</text><text x="20" y="170">0</text><text x="106" y="70">3</text><text x="191" y="35">4</text><text x="276" y="70">3</text><text x="370" y="170">0</text></g></g>
  <line x1="575" y1="490" x2="1075" y2="490" stroke="#a14f3f" stroke-width="3" stroke-dasharray="10 7"/><line x1="575" y1="310" x2="1075" y2="310" stroke="#a14f3f" stroke-width="3" stroke-dasharray="10 7"/><path d="M575 480 C680 472 730 435 780 385 C835 325 910 312 1075 311" fill="none" stroke="#315f63" stroke-width="9"/>
  <text x="825" y="550" text-anchor="middle" font-family="Georgia,serif" font-size="24" fill="#263c3b">x′(t)=r x(t)(1−x(t))</text>
