<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="780"
     viewBox="0 0 1000 780" role="img"
     aria-labelledby="geometryTitle geometryDesc">
  <title id="geometryTitle">Conjugate reflection gives raw upper coordinates weight two</title>
  <desc id="geometryDesc">Ledger H is 2, minus 1, 1, 2. Its diagonal square contribution is 5 and upper-pair contribution is 5. The raw square is 10, but the matrix square is 15 because the upper pair appears twice. Ledger K is 1, 3, minus 2, 1 and has matrix square 20. Their diagonal inner contribution is minus 1, their upper contribution is zero, and the total real Frobenius inner product is minus 1.</desc>
  <rect width="1000" height="780" fill="#F7F4F0"/>
  <style>
    .t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#2C2924}
    .title{font-size:19px;font-weight:700}
    .h{font-size:15px;font-weight:700}
    .s{font-size:13px}
    .m{font-size:12px;fill:#5A544C}
    .v{font-size:18px;font-weight:700}
  </style>
  <defs>
    <marker id="geometryArrow" markerWidth="8" markerHeight="8"
            refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#A67C52"/>
    </marker>
    <pattern id="copyPattern" width="8" height="8"
             patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#F3E8E0"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#D7B99B" stroke-width="2"/>
    </pattern>
  </defs>

  <text x="30" y="34" class="t title">A free upper coordinate counts once as data and twice in matrix geometry</text>
  <text x="30" y="58" class="t m">Exact arithmetic for the running matrix H and comparison matrix K; hatched regions mark the reflected copy.</text>

  <rect x="30" y="86" width="300" height="274" rx="14"
        fill="#FBF9F6" stroke="#C4B8A8" stroke-width="1.6"/>
  <text x="180" y="117" text-anchor="middle" class="t h">LEDGER H: 2, -1, 1, 2</text>
  <text x="180" y="140" text-anchor="middle" class="t m">diagonal 2, -1; upper real 1, imaginary 2</text>

  <rect x="52" y="163" width="256" height="58" rx="9"
        fill="#EAF1E5" stroke="#6F8D5E" stroke-width="1.4"/>
  <text x="68" y="186" class="t s">diagonal squares</text>
  <text x="292" y="204" text-anchor="end" class="t v">4 + 1 = 5</text>

  <rect x="52" y="232" width="256" height="58" rx="9"
        fill="#E8F0F7" stroke="#4B6787" stroke-width="1.4"/>
  <text x="68" y="255" class="t s">upper real-imaginary squares</text>
  <text x="292" y="273" text-anchor="end" class="t v">1 + 4 = 5</text>

  <text x="52" y="318" class="t h">RAW LEDGER SQUARE</text>
  <text x="308" y="318" text-anchor="end" class="t v">5 + 5 = 10</text>
  <text x="52" y="341" class="t m">the lower matrix cell is not in the ledger</text>

  <rect x="350" y="86" width="300" height="274" rx="14"
        fill="#FBF9F6" stroke="#C4B8A8" stroke-width="1.6"/>
  <text x="500" y="117" text-anchor="middle" class="t h">MATRIX WEIGHTING RULE</text>
  <text x="500" y="139" text-anchor="middle" class="t m">free data counts choices</text>
  <text x="500" y="155" text-anchor="middle" class="t m">matrix geometry counts every occupied cell</text>

  <rect x="378" y="164" width="244" height="52" rx="9"
        fill="#EAF1E5" stroke="#6F8D5E" stroke-width="1.4"/>
  <text x="500" y="196" text-anchor="middle" class="t h">DIAGONAL CONTRIBUTION: 5</text>

  <path d="M500 221 L500 247" fill="none" stroke="#A67C52"
        stroke-width="2" marker-end="url(#geometryArrow)"/>

  <rect x="378" y="253" width="114" height="57" rx="9"
        fill="#E8F0F7" stroke="#4B6787" stroke-width="1.4"/>
  <text x="435" y="277" text-anchor="middle" class="t m">upper cell</text>
  <text x="435" y="299" text-anchor="middle" class="t h">5</text>

  <rect x="508" y="253" width="114" height="57" rx="9"
        fill="url(#copyPattern)" stroke="#A67C52" stroke-width="1.4"/>
  <text x="565" y="277" text-anchor="middle" class="t m">reflected cell</text>
  <text x="565" y="299" text-anchor="middle" class="t h">5</text>

  <text x="500" y="338" text-anchor="middle" class="t h">MATRIX SQUARE: 5 + 5 + 5 = 15</text>

  <rect x="670" y="86" width="300" height="274" rx="14"
        fill="#FBF9F6" stroke="#C4B8A8" stroke-width="1.6"/>
  <text x="820" y="117" text-anchor="middle" class="t h">LEDGER K: 1, 3, -2, 1</text>
  <text x="820" y="140" text-anchor="middle" class="t m">diagonal 1, 3; upper real -2, imaginary 1</text>

  <rect x="692" y="163" width="256" height="58" rx="9"
        fill="#EAF1E5" stroke="#6F8D5E" stroke-width="1.4"/>
  <text x="708" y="186" class="t s">diagonal squares</text>
  <text x="932" y="204" text-anchor="end" class="t v">1 + 9 = 10</text>

  <rect x="692" y="232" width="256" height="58" rx="9"
        fill="#E8F0F7" stroke="#4B6787" stroke-width="1.4"/>
  <text x="708" y="255" class="t s">upper real-imaginary squares</text>
  <text x="932" y="273" text-anchor="end" class="t v">4 + 1 = 5</text>

  <text x="692" y="318" class="t h">MATRIX SQUARE</text>
  <text x="948" y="318" text-anchor="end" class="t v">10 + 5 + 5 = 20</text>
  <text x="692" y="341" class="t m">upper contribution appears in both off-diagonal cells</text>

  <rect x="30" y="388" width="940" height="300" rx="14"
        fill="#FBF9F6" stroke="#C4B8A8" stroke-width="1.6"/>
  <text x="500" y="421" text-anchor="middle" class="t h">REAL FROBENIUS INNER PRODUCT OF H WITH K</text>
  <text x="500" y="444" text-anchor="middle" class="t m">multiply matching real coordinates; count the upper pair and its reflected copy</text>

  <rect x="58" y="472" width="262" height="118" rx="10"
        fill="#EAF1E5" stroke="#6F8D5E" stroke-width="1.4"/>
  <text x="189" y="500" text-anchor="middle" class="t h">DIAGONAL CELLS</text>
  <text x="189" y="531" text-anchor="middle" class="t s">2 times 1, plus -1 times 3</text>
  <text x="189" y="562" text-anchor="middle" class="t v">2 - 3 = -1</text>

  <path d="M326 531 L360 531" fill="none" stroke="#A67C52"
        stroke-width="2" marker-end="url(#geometryArrow)"/>

  <rect x="368" y="472" width="264" height="118" rx="10"
        fill="#E8F0F7" stroke="#4B6787" stroke-width="1.4"/>
  <text x="500" y="500" text-anchor="middle" class="t h">ONE UPPER PAIR</text>
  <text x="500" y="531" text-anchor="middle" class="t s">1 times -2, plus 2 times 1</text>
  <text x="500" y="562" text-anchor="middle" class="t v">-2 + 2 = 0</text>

  <path d="M638 531 L672 531" fill="none" stroke="#A67C52"
        stroke-width="2" marker-end="url(#geometryArrow)"/>

  <rect x="680" y="472" width="262" height="118" rx="10"
        fill="url(#copyPattern)" stroke="#A67C52" stroke-width="1.4"/>
  <text x="811" y="500" text-anchor="middle" class="t h">REFLECTED COPY</text>
  <text x="811" y="531" text-anchor="middle" class="t s">same real contribution again</text>
  <text x="811" y="562" text-anchor="middle" class="t v">0</text>

  <rect x="267" y="612" width="466" height="54" rx="10"
        fill="#EAF1E5" stroke="#6F8D5E" stroke-width="1.5"/>
  <text x="500" y="646" text-anchor="middle" class="t h">TOTAL INNER PRODUCT: -1 + 0 + 0 = -1</text>

  <rect x="30" y="710" width="940" height="48" rx="12"
        fill="#EAF1E5" stroke="#6F8D5E" stroke-width="1.5"/>
  <text x="500" y="740" text-anchor="middle" class="t s">TAKEAWAY: REFLECTION ADDS NO FREE COORDINATE, BUT IT DOES ADD A SECOND GEOMETRIC CONTRIBUTION.</text>
</svg>
