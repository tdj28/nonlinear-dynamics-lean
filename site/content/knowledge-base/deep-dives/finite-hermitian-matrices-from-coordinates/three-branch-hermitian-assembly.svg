<svg xmlns="http://www.w3.org/2000/svg" width="760" height="470"
     viewBox="0 0 760 470" role="img"
     aria-labelledby="assemblyTitle assemblyDesc">
  <title id="assemblyTitle">Three-branch deterministic Hermitian assembly</title>
  <desc id="assemblyDesc">A row-column comparison forks to an upper branch that copies a complex input, a diagonal branch that inserts a real input, and a lower branch that conjugates the reflected upper input. The three branches join at a pointwise Hermitian matrix.</desc>
  <rect width="760" height="470" fill="#F7F4F0"/>
  <style>
    .t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#2C2924}
    .title{font-size:15px;font-weight:700}
    .h{font-size:13px;font-weight:700}
    .s{font-size:12px}
    .m{font-size:11px;fill:#5A544C}
  </style>
  <defs>
    <marker id="assemblyArrow" markerWidth="8" markerHeight="8" refX="7" refY="4"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#A67C52"/>
    </marker>
  </defs>

  <text x="24" y="28" class="t title">Each matrix entry follows exactly one branch</text>
  <text x="24" y="48" class="t m">Finite-index order selects the branch; the constructor inserts no scale and assumes no law.</text>

  <rect x="225" y="70" width="310" height="66" rx="12" fill="#FBF9F6" stroke="#C4B8A8" stroke-width="1.5"/>
  <text x="380" y="98" text-anchor="middle" class="t h">COMPARE ROW WITH COLUMN</text>
  <text x="380" y="120" text-anchor="middle" class="t m">before, same, or after</text>

  <path d="M310 138 C270 162,210 166,170 190" fill="none" stroke="#A67C52" stroke-width="2" marker-end="url(#assemblyArrow)"/>
  <path d="M380 138 L380 190" fill="none" stroke="#A67C52" stroke-width="2" marker-end="url(#assemblyArrow)"/>
  <path d="M450 138 C490 162,550 166,590 190" fill="none" stroke="#A67C52" stroke-width="2" marker-end="url(#assemblyArrow)"/>

  <rect x="32" y="194" width="216" height="132" rx="12" fill="#E8F0F7" stroke="#4B6787" stroke-width="1.5"/>
  <text x="140" y="222" text-anchor="middle" class="t h">UPPER BRANCH</text>
  <text x="140" y="246" text-anchor="middle" class="t s">Row comes before column</text>
  <line x1="58" y1="260" x2="222" y2="260" stroke="#4B6787" stroke-width="1"/>
  <text x="140" y="286" text-anchor="middle" class="t h">COPY COMPLEX INPUT</text>
  <text x="140" y="307" text-anchor="middle" class="t m">primitive coordinate</text>

  <rect x="272" y="194" width="216" height="132" rx="12" fill="#EAF1E5" stroke="#6F8D5E" stroke-width="1.5"/>
  <text x="380" y="222" text-anchor="middle" class="t h">DIAGONAL BRANCH</text>
  <text x="380" y="246" text-anchor="middle" class="t s">Row and column are equal</text>
  <line x1="298" y1="260" x2="462" y2="260" stroke="#6F8D5E" stroke-width="1"/>
  <text x="380" y="286" text-anchor="middle" class="t h">INSERT REAL INPUT</text>
  <text x="380" y="307" text-anchor="middle" class="t m">primitive coordinate</text>

  <rect x="512" y="194" width="216" height="132" rx="12" fill="#F3E8E0" stroke="#A67C52" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="620" y="222" text-anchor="middle" class="t h">LOWER BRANCH</text>
  <text x="620" y="246" text-anchor="middle" class="t s">Row comes after column</text>
  <line x1="538" y1="260" x2="702" y2="260" stroke="#A67C52" stroke-width="1"/>
  <text x="620" y="286" text-anchor="middle" class="t h">REFLECT AND CONJUGATE</text>
  <text x="620" y="307" text-anchor="middle" class="t m">determined coordinate</text>

  <path d="M140 328 C190 354,250 356,306 378" fill="none" stroke="#A67C52" stroke-width="2" marker-end="url(#assemblyArrow)"/>
  <path d="M380 328 L380 374" fill="none" stroke="#A67C52" stroke-width="2" marker-end="url(#assemblyArrow)"/>
  <path d="M620 328 C570 354,510 356,454 378" fill="none" stroke="#A67C52" stroke-width="2" marker-end="url(#assemblyArrow)"/>

  <rect x="218" y="380" width="324" height="56" rx="12" fill="#EAF1E5" stroke="#6F8D5E" stroke-width="1.5"/>
  <text x="380" y="405" text-anchor="middle" class="t h">POINTWISE HERMITIAN MATRIX</text>
  <text x="380" y="426" text-anchor="middle" class="t m">all entries are filled; no probability assumptions used</text>

  <text x="380" y="458" text-anchor="middle" class="t m">Upper and diagonal inputs are supplied once; the lower triangle is forced by symmetry.</text>
</svg>
