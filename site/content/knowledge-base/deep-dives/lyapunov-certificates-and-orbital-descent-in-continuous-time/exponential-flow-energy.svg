<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="540" viewBox="0 0 1060 540" role="img" aria-labelledby="title desc">
  <title id="title">Energy along the exponential contraction flow</title>
  <desc id="desc">The value four exp minus two t descends through exact samples four, one, and one quarter. A tangent arrow labels the derivative minus eight exp minus two t as negative, and the far-right limit is zero.</desc>
  <rect width="1060" height="540" rx="24" fill="#fbf8f0"/>
  <text x="52" y="53" font-family="Georgia,serif" font-size="27" fill="#23343b">x(t) = 2e⁻ᵗ, V(x(t)) = 4e⁻²ᵗ</text>
  <line x1="88" y1="420" x2="978" y2="420" stroke="#7f786d" stroke-width="3"/>
  <line x1="88" y1="92" x2="88" y2="420" stroke="#7f786d" stroke-width="3"/>
  <path d="M88 108 C210 182 322 282 470 334 C618 384 786 406 978 415" fill="none" stroke="#315f63" stroke-width="8"/>
  <line x1="270" y1="207" x2="388" y2="292" stroke="#b06f45" stroke-width="5"/>
  <polygon points="388,292 367,286 378,271" fill="#b06f45"/>
  <text x="292" y="189" font-family="Arial,sans-serif" font-size="18" fill="#7a4d69">derivative = −8e⁻²ᵗ &lt; 0</text>
  <circle cx="88" cy="108" r="10" fill="#b06f45"/><text x="108" y="102" font-family="Arial,sans-serif" font-size="18" fill="#23343b">4 at t = 0</text>
  <circle cx="470" cy="334" r="10" fill="#b06f45"/><text x="490" y="326" font-family="Arial,sans-serif" font-size="18" fill="#23343b">1 at t = log 2</text>
  <circle cx="760" cy="402" r="10" fill="#b06f45"/><text x="780" y="394" font-family="Arial,sans-serif" font-size="18" fill="#23343b">1/4 at t = log 4</text>
  <text x="802" y="468" font-family="Arial,sans-serif" font-size="19" fill="#6f8d5e">separate fact: limit = 0</text>
  <text x="88" y="506" font-family="Arial,sans-serif" font-size="18" fill="#7a4d69">finite-time order from derivative sign · asymptotic level from a limit</text>
</svg>
