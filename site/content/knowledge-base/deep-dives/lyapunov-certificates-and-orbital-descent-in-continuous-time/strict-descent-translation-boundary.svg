<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="500" viewBox="0 0 1060 500" role="img" aria-labelledby="title desc">
  <title id="title">Strict descent without an equilibrium</title>
  <desc id="desc">A translation flow moves x to x plus t while the scalar value minus x falls to minus x minus t. A separate equilibrium box is crossed out because p plus one is not p.</desc>
  <rect width="1060" height="500" rx="24" fill="#fbf8f0"/>
  <text x="52" y="54" font-family="Georgia,serif" font-size="28" fill="#23343b">Translation boundary: Φ(t,x) = x + t</text>
  <line x1="92" y1="180" x2="458" y2="180" stroke="#315f63" stroke-width="7"/>
  <polygon points="458,180 438,168 438,192" fill="#315f63"/>
  <circle cx="92" cy="180" r="15" fill="#b06f45"/><circle cx="458" cy="180" r="15" fill="#6f8d5e"/>
  <text x="72" y="226" font-family="Arial,sans-serif" font-size="20" fill="#23343b">x</text><text x="420" y="226" font-family="Arial,sans-serif" font-size="20" fill="#23343b">x + t</text>
  <rect x="78" y="282" width="430" height="92" rx="17" fill="#eaf1e5" stroke="#6f8d5e" stroke-width="3"/>
  <text x="293" y="320" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#23343b">V(x + t) = −x − t &lt; −x = V(x)</text>
  <text x="293" y="350" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#7a4d69">strict descent for every t &gt; 0</text>
  <rect x="620" y="134" width="350" height="240" rx="20" fill="#f3e8e0" stroke="#a67c52" stroke-width="4"/>
  <text x="795" y="183" text-anchor="middle" font-family="Georgia,serif" font-size="25" fill="#23343b">equilibrium gate</text>
  <text x="795" y="244" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" fill="#23343b">Φ(1,p) = p + 1 ≠ p</text>
  <line x1="688" y1="286" x2="902" y2="346" stroke="#9c3d3d" stroke-width="10"/>
  <line x1="902" y1="286" x2="688" y2="346" stroke="#9c3d3d" stroke-width="10"/>
  <text x="52" y="452" font-family="Arial,sans-serif" font-size="19" fill="#7a4d69">The missing hypothesis is named; strict scalar descent does not create a fixed point.</text>
</svg>
