<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="650" viewBox="0 0 1120 650" role="img" aria-labelledby="title desc">
  <title id="title">Five exact states for the integer-normalized Lorenz field</title>
  <desc id="desc">A table-like diagram maps the origin and two symmetric equilibria to zero, then maps one two three to one minus two minus four and its sign flip to minus one two minus four.</desc>
  <rect width="1120" height="650" rx="24" fill="#f1e9da"/>
  <text x="560" y="50" text-anchor="middle" font-family="system-ui,sans-serif" font-size="29" font-weight="750" fill="#16324f">FIVE EXACT INTEGER STATES</text>
  <text x="560" y="84" text-anchor="middle" font-family="Georgia,serif" font-size="23" fill="#285448">sigma = 1, rho = 3, beta = 2</text>
  <rect x="70" y="112" width="980" height="66" rx="14" fill="#315f63"/>
  <text x="260" y="154" text-anchor="middle" font-family="system-ui,sans-serif" font-size="22" font-weight="750" fill="#fffaf1">STATE</text>
  <text x="560" y="154" text-anchor="middle" font-family="system-ui,sans-serif" font-size="22" font-weight="750" fill="#fffaf1">ROLE</text>
  <text x="860" y="154" text-anchor="middle" font-family="system-ui,sans-serif" font-size="22" font-weight="750" fill="#fffaf1">FIELD VALUE</text>
  <g font-family="Georgia,serif" font-size="25" fill="#263c3b">
    <rect x="70" y="188" width="980" height="72" fill="#fffaf1" stroke="#b6aa98"/><text x="260" y="233" text-anchor="middle">(0, 0, 0)</text><text x="560" y="233" text-anchor="middle">origin</text><text x="860" y="233" text-anchor="middle">(0, 0, 0)</text>
    <rect x="70" y="260" width="980" height="72" fill="#dfece3" stroke="#b6aa98"/><text x="260" y="305" text-anchor="middle">(2, 2, 2)</text><text x="560" y="305" text-anchor="middle">positive-sign equilibrium</text><text x="860" y="305" text-anchor="middle">(0, 0, 0)</text>
    <rect x="70" y="332" width="980" height="72" fill="#f3dfca" stroke="#b6aa98"/><text x="260" y="377" text-anchor="middle">(-2, -2, 2)</text><text x="560" y="377" text-anchor="middle">negative-sign equilibrium</text><text x="860" y="377" text-anchor="middle">(0, 0, 0)</text>
    <rect x="70" y="404" width="980" height="72" fill="#e4eef4" stroke="#b6aa98"/><text x="260" y="449" text-anchor="middle">(1, 2, 3)</text><text x="560" y="449" text-anchor="middle">off equilibrium</text><text x="860" y="449" text-anchor="middle">(1, -2, -4)</text>
    <rect x="70" y="476" width="980" height="72" fill="#fffaf1" stroke="#b6aa98"/><text x="260" y="521" text-anchor="middle">(-1, -2, 3)</text><text x="560" y="521" text-anchor="middle">sign-flipped state</text><text x="860" y="521" text-anchor="middle">(-1, 2, -4)</text>
  </g>
  <text x="560" y="590" text-anchor="middle" font-family="system-ui,sans-serif" font-size="21" font-weight="700" fill="#874d3b">THREE STORED ZEROS, THEN ONE SYMMETRY-RELATED PAIR</text>
  <text x="560" y="624" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" fill="#285448">Finite coverage: these five rows only</text>
</svg>
