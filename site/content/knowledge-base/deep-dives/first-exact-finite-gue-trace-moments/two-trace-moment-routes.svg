<svg xmlns="http://www.w3.org/2000/svg" width="840" height="650"
     viewBox="0 0 840 650" role="img"
     aria-labelledby="twoMomentRoutesTitle twoMomentRoutesDesc">
  <title id="twoMomentRoutesTitle">The first two finite Gaussian unitary ensemble trace moments use different exact routes</title>
  <desc id="twoMomentRoutesDesc">The first route reads the trace from centered diagonal marginals and integrates a finite sum. The second represents the matrix law as a pushforward from normalized real coordinates, moves the integral to those coordinates, rewrites the Hermitian trace square as a Frobenius norm square, and sums scalar Gaussian second moments over one coordinate per matrix position. Both routes carry a separate integrability proof. The empty zero-size branch returns zero without a positivity assumption.</desc>
  <rect width="840" height="650" fill="#F7F4F0"/>
  <style>
    .t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#2C2924}
    .title{font-size:15px;font-weight:700}
    .h{font-size:13px;font-weight:700}
    .s{font-size:12px}
    .m{font-size:11px;fill:#5A544C}
  </style>
  <defs>
    <marker id="twoMomentArrow" markerWidth="8" markerHeight="8" refX="7" refY="4"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#A67C52"/>
    </marker>
  </defs>

  <text x="24" y="30" class="t title">Two finite-moment proofs, one analytic gate</text>
  <text x="24" y="50" class="t m">The linear trace route and the geometric trace-square route share a law but expose different structure.</text>

  <rect x="24" y="82" width="792" height="64" rx="12" fill="#E8F0F7" stroke="#4B6787" stroke-width="1.5"/>
  <text x="420" y="110" text-anchor="middle" class="t h">FINITE GAUSSIAN UNITARY ENSEMBLE MATRIX LAW</text>
  <text x="420" y="132" text-anchor="middle" class="t s">one probability measure, ordinary matrix trace, every natural dimension</text>

  <path d="M420 148 L420 174" fill="none" stroke="#A67C52" stroke-width="2"/>
  <path d="M420 174 L206 174 L206 194" fill="none" stroke="#A67C52" stroke-width="2" marker-end="url(#twoMomentArrow)"/>
  <path d="M420 174 L634 174 L634 194" fill="none" stroke="#A67C52" stroke-width="2" marker-end="url(#twoMomentArrow)"/>

  <text x="206" y="190" text-anchor="middle" class="t h">FIRST TRACE POWER</text>
  <rect x="24" y="204" width="364" height="78" rx="12" fill="#FBF9F6" stroke="#C4B8A8" stroke-width="1.5"/>
  <text x="206" y="234" text-anchor="middle" class="t h">CENTERED DIAGONAL MARGINALS</text>
  <text x="206" y="259" text-anchor="middle" class="t s">trace is a finite sum of diagonal entries</text>

  <path d="M206 284 L206 308" fill="none" stroke="#A67C52" stroke-width="2" marker-end="url(#twoMomentArrow)"/>
  <rect x="24" y="314" width="364" height="78" rx="12" fill="#F3E8E0" stroke="#A67C52" stroke-width="1.5"/>
  <text x="206" y="344" text-anchor="middle" class="t h">FINITE INTEGRABLE SUM</text>
  <text x="206" y="369" text-anchor="middle" class="t s">each scalar Gaussian has mean zero</text>

  <text x="634" y="190" text-anchor="middle" class="t h">SECOND TRACE POWER</text>
  <rect x="452" y="204" width="364" height="78" rx="12" fill="#FBF9F6" stroke="#C4B8A8" stroke-width="1.5"/>
  <text x="634" y="234" text-anchor="middle" class="t h">NORMALIZED REAL COORDINATES</text>
  <text x="634" y="259" text-anchor="middle" class="t s">one orthonormal direction per matrix position</text>

  <path d="M634 284 L634 308" fill="none" stroke="#A67C52" stroke-width="2" marker-end="url(#twoMomentArrow)"/>
  <rect x="452" y="314" width="364" height="78" rx="12" fill="#F3E8E0" stroke="#A67C52" stroke-width="1.5"/>
  <text x="634" y="337" text-anchor="middle" class="t h">HERMITIAN TRACE SQUARE</text>
  <text x="634" y="357" text-anchor="middle" class="t h">BECOMES FROBENIUS NORM SQUARE</text>
  <text x="634" y="379" text-anchor="middle" class="t s">sum the scalar Gaussian second moments</text>

  <path d="M206 394 L206 424" fill="none" stroke="#A67C52" stroke-width="2" marker-end="url(#twoMomentArrow)"/>
  <path d="M634 394 L634 424" fill="none" stroke="#A67C52" stroke-width="2" marker-end="url(#twoMomentArrow)"/>

  <rect x="24" y="430" width="364" height="76" rx="12" fill="#EAF1E5" stroke="#6F8D5E" stroke-width="1.5"/>
  <text x="206" y="460" text-anchor="middle" class="t h">CENTERED FIRST EXPECTED TRACE</text>
  <text x="206" y="485" text-anchor="middle" class="t m">exact complex Bochner integral</text>

  <rect x="452" y="430" width="364" height="76" rx="12" fill="#EAF1E5" stroke="#6F8D5E" stroke-width="1.5"/>
  <text x="634" y="460" text-anchor="middle" class="t h">DIMENSION-SIZED SECOND EXPECTED TRACE</text>
  <text x="634" y="485" text-anchor="middle" class="t m">exact complex Bochner integral</text>

  <rect x="110" y="536" width="620" height="46" rx="12" fill="#16243A"/>
  <text x="420" y="565" text-anchor="middle" class="t h" style="fill:#FFFDF8">EACH ROUTE PROVES INTEGRABILITY BEFORE EVALUATING THE INTEGRAL</text>

  <rect x="176" y="600" width="488" height="34" rx="10" fill="#EDE8E1" stroke="#7F786D" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="420" y="622" text-anchor="middle" class="t m">The empty zero-size branch is included and returns zero on both routes.</text>
</svg>
