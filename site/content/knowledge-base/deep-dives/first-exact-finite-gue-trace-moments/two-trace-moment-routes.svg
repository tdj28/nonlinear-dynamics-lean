<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820"
     viewBox="0 0 1200 820" role="img"
     aria-labelledby="two-moment-routes-title two-moment-routes-desc">
  <title id="two-moment-routes-title">The first two finite Gaussian unitary ensemble trace moments pass separate integrability gates and use different exact routes</title>
  <desc id="two-moment-routes-desc">The first route expands trace as a finite diagonal sum, proves each diagonal coordinate integrable, and sums centered means to zero. At size two the means are zero plus zero. The second route pushes a common Gaussian product through normalized Hermitian assembly, converts trace-square to a sum of coordinate squares, and proves that sum integrable. In positive dimension its arithmetic is n squared times one over n equal to n; at size two this is four times one half equal to two. Dimension zero uses empty sums and no division.</desc>
  <defs>
    <marker id="two-moment-routes-arrow" markerWidth="10" markerHeight="8"
            refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#A67C52"/>
    </marker>
  </defs>
  <rect width="1200" height="820" fill="#F7F4F0"/>
  <style>
    .t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#2C2924}
    .title{font-size:29px;font-weight:700}.sub{font-size:17px;fill:#5A544C}
    .h{font-size:20px;font-weight:700}.s{font-size:16px}.m{font-size:14px;fill:#5A544C}
    .num{font-size:20px;font-weight:700}.tiny{font-size:13px;fill:#5A544C}
    .blue{fill:#E8F0F7;stroke:#4B6787;stroke-width:2}
    .cream{fill:#FBF9F6;stroke:#C4B8A8;stroke-width:2}
    .green{fill:#EAF1E5;stroke:#6F8D5E;stroke-width:2}
    .clay{fill:#F3E8E0;stroke:#A67C52;stroke-width:2}
  </style>

  <text x="48" y="48" class="t title">Two expected trace powers, two proof routes, two analytic licenses</text>
  <text x="48" y="78" class="t sub">Both start from the same finite matrix law; neither expectation is read directly from a sample.</text>

  <rect x="318" y="106" width="564" height="78" rx="15" class="blue"/>
  <text x="600" y="138" text-anchor="middle" class="t h">FINITE GUE MATRIX LAW IN DIMENSION n</text>
  <text x="600" y="166" text-anchor="middle" class="t s">ordinary trace, Wigner variance scale, complex Bochner integral</text>

  <path d="M600 186 L600 214 L292 214 L292 236" fill="none" stroke="#A67C52"
        stroke-width="3" marker-end="url(#two-moment-routes-arrow)"/>
  <path d="M600 214 L908 214 L908 236" fill="none" stroke="#A67C52"
        stroke-width="3" marker-end="url(#two-moment-routes-arrow)"/>

  <rect x="48" y="248" width="516" height="360" rx="17" class="cream"/>
  <text x="70" y="284" class="t h">Route 1: the trace sees only the diagonal</text>
  <rect x="72" y="310" width="468" height="66" rx="11" class="blue"/>
  <text x="92" y="338" class="t s">Tr(H) = sum over i of Hii</text>
  <text x="92" y="362" class="t m">exact centered diagonal marginal at every finite index</text>
  <line x1="306" y1="380" x2="306" y2="407" stroke="#A67C52" stroke-width="3"
        marker-end="url(#two-moment-routes-arrow)"/>
  <rect x="72" y="416" width="468" height="72" rx="11" class="clay"/>
  <text x="92" y="444" class="t h">Integrability gate</text>
  <text x="92" y="472" class="t s">finite sum of integrable complex coordinates</text>
  <line x1="306" y1="492" x2="306" y2="519" stroke="#A67C52" stroke-width="3"
        marker-end="url(#two-moment-routes-arrow)"/>
  <rect x="72" y="528" width="468" height="58" rx="11" class="green"/>
  <text x="92" y="564" class="t num">all n: E Tr(H) = 0</text>

  <rect x="636" y="248" width="516" height="360" rx="17" class="cream"/>
  <text x="658" y="284" class="t h">Route 2: Hermitian geometry sees all entries</text>
  <rect x="660" y="310" width="468" height="66" rx="11" class="blue"/>
  <text x="680" y="338" class="t s">normalized product maps to H</text>
  <text x="680" y="362" class="t m">Tr(H^2) = Frobenius square = sum over a of xa^2</text>
  <line x1="894" y1="380" x2="894" y2="407" stroke="#A67C52" stroke-width="3"
        marker-end="url(#two-moment-routes-arrow)"/>
  <rect x="660" y="416" width="468" height="72" rx="11" class="clay"/>
  <text x="680" y="444" class="t h">Integrability gate</text>
  <text x="680" y="472" class="t s">finite sum of integrable Gaussian coordinate squares</text>
  <line x1="894" y1="492" x2="894" y2="519" stroke="#A67C52" stroke-width="3"
        marker-end="url(#two-moment-routes-arrow)"/>
  <rect x="660" y="528" width="468" height="58" rx="11" class="green"/>
  <text x="680" y="554" class="t num">all n: E Tr(H^2) = n</text>
  <text x="680" y="578" class="t tiny">for n &gt; 0, the arithmetic is n^2(1/n) = n</text>

  <rect x="48" y="642" width="516" height="92" rx="15" class="blue"/>
  <text x="70" y="676" class="t h">Size-two checkpoint</text>
  <text x="70" y="708" class="t num">0 + 0 = 0</text>
  <text x="258" y="708" class="t s">two centered diagonal means</text>

  <rect x="636" y="642" width="516" height="92" rx="15" class="green"/>
  <text x="658" y="676" class="t h">Size-two checkpoint</text>
  <text x="658" y="708" class="t num">4(1/2) = 2</text>
  <text x="846" y="708" class="t s">four normalized real squares</text>

  <rect x="186" y="764" width="828" height="36" rx="10" fill="#16243A"/>
  <text x="600" y="788" text-anchor="middle" class="t s" style="fill:#FFFDF8">Dimension zero: both index sets are empty, both sums are zero, and no division by zero is used.</text>
</svg>
