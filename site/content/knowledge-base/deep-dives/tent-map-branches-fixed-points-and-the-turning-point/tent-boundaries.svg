<svg xmlns="http://www.w3.org/2000/svg" width="920" height="520" viewBox="0 0 920 520" role="img" aria-labelledby="title desc">
  <title id="title">Fixed-point boundary at tent-map slope one</title>
  <desc id="desc">The slope-one tent coincides with the diagonal over the entire left half, while the slope-two tent crosses the diagonal at zero and two thirds.</desc>
  <rect width="920" height="520" fill="#F7F4F0"/>
  <style>.t{font-family:Inter,Arial,sans-serif;fill:#2C2924}.h{font-size:20px;font-weight:700}.s{font-size:15px}.m{font-size:13px;fill:#5A544C}.panel{fill:#FBF9F6;stroke:#C4B8A8;stroke-width:2}.axis{stroke:#7F786D;stroke-width:2}.diag{stroke:#A89B8C;stroke-width:3;stroke-dasharray:7 5}.tent{stroke:#4B6787;stroke-width:7;fill:none}</style>
  <text x="28" y="36" class="t h">Slope one is a fixed-interval boundary</text>
  <text x="28" y="60" class="t m">The strict slope hypothesis changes the shape of the entire fixed set.</text>
  <rect x="28" y="86" width="410" height="342" rx="16" class="panel"/>
  <rect x="482" y="86" width="410" height="342" rx="16" class="panel"/>
  <text x="233" y="120" text-anchor="middle" class="t h">slope one</text>
  <text x="687" y="120" text-anchor="middle" class="t h">slope two</text>
  <line x1="78" y1="370" x2="390" y2="370" class="axis"/><line x1="88" y1="390" x2="88" y2="150" class="axis"/>
  <line x1="532" y1="370" x2="844" y2="370" class="axis"/><line x1="542" y1="390" x2="542" y2="150" class="axis"/>
  <line x1="88" y1="370" x2="370" y2="164" class="diag"/><line x1="542" y1="370" x2="824" y2="164" class="diag"/>
  <path d="M88 370 L229 267 L370 370" class="tent"/>
  <path d="M542 370 L683 164 L824 370" class="tent"/>
  <line x1="88" y1="370" x2="229" y2="267" stroke="#6F8D5E" stroke-width="11" opacity="0.65"/>
  <text x="233" y="218" text-anchor="middle" class="t s">every point through one half is fixed</text>
  <circle cx="542" cy="370" r="9" fill="#D18B3C"/><circle cx="730" cy="232" r="9" fill="#D18B3C"/>
  <text x="687" y="208" text-anchor="middle" class="t s">fixed only at zero and two thirds</text>
  <rect x="28" y="454" width="864" height="40" rx="10" fill="#EAF1E5" stroke="#6F8D5E"/>
  <text x="460" y="479" text-anchor="middle" class="t s">Deleting the strict slope-above-one hypothesis would erase a continuum of fixed states.</text>
</svg>
