<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">One-sided full shifts, cylinders, and itineraries</title><desc id="desc">Nested prefix cylinders sit beside a commuting itinerary square and three factor-map gates.</desc><rect width="1200" height="630" fill="#f7f3e8"/><text x="70" y="90" font-family="system-ui,sans-serif" font-size="27" font-weight="700" fill="#2d7f73">KNOWLEDGE BASE · DEEP DIVE</text><text x="70" y="168" font-family="system-ui,sans-serif" font-size="48" font-weight="800" fill="#17324d">Full Shifts, Cylinders,</text><text x="70" y="225" font-family="system-ui,sans-serif" font-size="48" font-weight="800" fill="#17324d">and Itineraries</text><rect x="80" y="290" width="430" height="200" rx="28" fill="#dce9e6" stroke="#2d7f73" stroke-width="4"/><rect x="150" y="335" width="290" height="112" rx="22" fill="#f1d7ca" stroke="#d96c3f" stroke-width="4"/><rect x="230" y="371" width="130" height="52" rx="14" fill="#17324d"/><text x="295" y="404" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="#fff">prefix 0,1</text><text x="725" y="333" font-family="system-ui,sans-serif" font-size="27" font-weight="700" fill="#17324d">itinerary equation</text><text x="725" y="383" font-family="ui-monospace,monospace" font-size="30" fill="#d96c3f">I ∘ f = σ ∘ I</text><text x="725" y="438" font-family="system-ui,sans-serif" font-size="23" fill="#17324d">continuity → semiconjugacy</text><text x="725" y="478" font-family="system-ui,sans-serif" font-size="23" fill="#17324d">surjectivity → factor map</text><text x="70" y="580" font-family="system-ui,sans-serif" font-size="22" fill="#675d4f">Draft working note · professional review pending</text></svg>
