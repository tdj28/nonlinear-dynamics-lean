<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" role="img" aria-labelledby="title desc"><title id="title">Itinerary factor-map gates</title><desc id="desc">A commuting square is followed by gates for continuity, surjectivity, and invertibility.</desc><rect width="760" height="380" rx="24" fill="#f7f3e8"/><g font-family="system-ui,sans-serif" font-size="18" font-weight="700" text-anchor="middle"><rect x="80" y="55" width="150" height="54" rx="12" fill="#17324d"/><text x="155" y="89" fill="#fff">source x</text><rect x="500" y="55" width="150" height="54" rx="12" fill="#17324d"/><text x="575" y="89" fill="#fff">updated f(x)</text><rect x="80" y="172" width="150" height="54" rx="12" fill="#d96c3f"/><text x="155" y="206" fill="#fff">itinerary I(x)</text><rect x="500" y="172" width="150" height="54" rx="12" fill="#d96c3f"/><text x="575" y="206" fill="#fff">shifted σ(I(x))</text></g><g stroke="#2d7f73" stroke-width="4" fill="none"><path d="M230 82H494"/><path d="M155 109V166"/><path d="M575 109V166"/><path d="M230 199H494"/></g><text x="380" y="257" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" font-weight="700" fill="#17324d">the square commutes by the itinerary definition</text><g font-family="system-ui,sans-serif" font-size="16" text-anchor="middle"><rect x="50" y="294" width="190" height="52" rx="12" fill="#dce9e6"/><text x="145" y="316" fill="#17324d">+ continuity</text><text x="145" y="337" fill="#17324d">topological semiconjugacy</text><rect x="285" y="294" width="190" height="52" rx="12" fill="#f1d7ca"/><text x="380" y="316" fill="#17324d">+ surjectivity</text><text x="380" y="337" fill="#17324d">factor map</text><rect x="520" y="294" width="190" height="52" rx="12" fill="#eee6d8"/><text x="615" y="316" fill="#17324d">+ inverse data</text><text x="615" y="337" fill="#17324d">conjugacy boundary</text></g></svg>
