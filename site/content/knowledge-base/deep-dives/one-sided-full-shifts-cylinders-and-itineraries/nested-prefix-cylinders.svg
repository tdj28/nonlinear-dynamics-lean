<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-labelledby="title desc"><title id="title">Nested prefix cylinders</title><desc id="desc">Three nested regions show all sequences, those beginning with zero, and those beginning with zero one.</desc><rect width="760" height="340" rx="24" fill="#f7f3e8"/><rect x="45" y="48" width="670" height="244" rx="28" fill="#dce9e6" stroke="#2d7f73" stroke-width="3"/><text x="70" y="83" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="#17324d">all one-sided sequences</text><rect x="155" y="104" width="480" height="150" rx="24" fill="#f1d7ca" stroke="#d96c3f" stroke-width="3"/><text x="180" y="139" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="#17324d">prefix 0</text><rect x="280" y="158" width="280" height="64" rx="18" fill="#17324d"/><text x="420" y="198" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" font-weight="700" fill="#fff">prefix 0, 1</text><text x="380" y="322" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" fill="#675d4f">more fixed coordinates give a smaller neighborhood</text></svg>
