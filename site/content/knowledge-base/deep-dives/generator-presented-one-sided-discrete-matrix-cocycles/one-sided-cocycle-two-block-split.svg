<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630"
     viewBox="0 0 1200 630" role="img"
     aria-labelledby="cocycleLedgerTitle cocycleLedgerDesc">
  <title id="cocycleLedgerTitle">A noninvertible three-state base generates exact two-by-two matrix cocycle values</title>
  <desc id="cocycleLedgerDesc">The base sends start to middle, middle to sink, and sink to itself, so it is not invertible. The generator matrices are D equals rows two zero and zero one at start, S equals rows one one and zero one at middle, and L equals rows one zero and one one at sink. At start the horizon zero, one, and two cocycle values are I, D, and S D equals rows two one and zero one. At the shifted point middle they are I, S, and L S equals rows one one and one two.</desc>
  <rect width="1200" height="630" fill="#F7F1E7"/>
  <rect width="1200" height="18" fill="#17324D"/>
  <style>
    .sans{font-family:Inter,Arial,Helvetica,sans-serif;fill:#18283A}
    .mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace;fill:#18283A}
    .title{font-size:29px;font-weight:750}
    .subtitle{font-size:17px;fill:#56606B}
    .label{font-size:15px;font-weight:700;letter-spacing:.5px}
    .state{font-size:20px;font-weight:750}
    .matrix{font-size:20px;font-weight:650}
    .small{font-size:14px;fill:#56606B}
    .horizon{font-size:17px;font-weight:700}
  </style>
  <defs>
    <marker id="cocycleLedgerArrow" markerWidth="9" markerHeight="9"
            refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#B86432"/>
    </marker>
  </defs>

  <text x="54" y="62" class="sans title">One generator, sampled along one forward base orbit</text>
  <text x="54" y="91" class="sans subtitle">Exact finite-state example; every product uses the newest factor on the left.</text>

  <rect x="54" y="121" width="1092" height="191" rx="18"
        fill="#FFFDF8" stroke="#C8BBA7" stroke-width="2"/>
  <text x="80" y="151" class="sans label">FORWARD BASE MAP</text>

  <rect x="82" y="174" width="260" height="105" rx="14"
        fill="#E7F0F7" stroke="#52718D" stroke-width="2"/>
  <text x="212" y="205" text-anchor="middle" class="sans state">start</text>
  <text x="212" y="236" text-anchor="middle" class="mono matrix">D = [2 0; 0 1]</text>
  <text x="212" y="260" text-anchor="middle" class="sans small">initial environment</text>

  <path d="M350 226 L460 226" fill="none" stroke="#B86432"
        stroke-width="4" marker-end="url(#cocycleLedgerArrow)"/>
  <text x="405" y="208" text-anchor="middle" class="sans label">T</text>

  <rect x="468" y="174" width="260" height="105" rx="14"
        fill="#F6E6D9" stroke="#B86432" stroke-width="2"/>
  <text x="598" y="205" text-anchor="middle" class="sans state">middle</text>
  <text x="598" y="236" text-anchor="middle" class="mono matrix">S = [1 1; 0 1]</text>
  <text x="598" y="260" text-anchor="middle" class="sans small">shifted environment</text>

  <path d="M736 226 L846 226" fill="none" stroke="#B86432"
        stroke-width="4" marker-end="url(#cocycleLedgerArrow)"/>
  <text x="791" y="208" text-anchor="middle" class="sans label">T</text>

  <rect x="854" y="174" width="260" height="105" rx="14"
        fill="#E8F1E4" stroke="#64845B" stroke-width="2"/>
  <text x="984" y="205" text-anchor="middle" class="sans state">sink</text>
  <text x="984" y="236" text-anchor="middle" class="mono matrix">L = [1 0; 1 1]</text>
  <text x="984" y="260" text-anchor="middle" class="sans small">T(sink) = sink</text>

  <path d="M1091 178 C1160 133 1163 285 1092 269" fill="none"
        stroke="#64845B" stroke-width="3" marker-end="url(#cocycleLedgerArrow)"/>

  <rect x="54" y="335" width="530" height="244" rx="18"
        fill="#E7F0F7" stroke="#52718D" stroke-width="2"/>
  <text x="80" y="369" class="sans label">START AT start</text>
  <line x1="80" y1="386" x2="558" y2="386" stroke="#B5C7D6" stroke-width="2"/>
  <text x="86" y="422" class="sans horizon">n = 0</text>
  <text x="190" y="422" class="mono matrix">Phi(0,start) = I = [1 0; 0 1]</text>
  <text x="86" y="474" class="sans horizon">n = 1</text>
  <text x="190" y="474" class="mono matrix">Phi(1,start) = D = [2 0; 0 1]</text>
  <text x="86" y="526" class="sans horizon">n = 2</text>
  <text x="190" y="526" class="mono matrix">Phi(2,start) = S D</text>
  <text x="190" y="557" class="mono matrix">               = [2 1; 0 1]</text>

  <rect x="616" y="335" width="530" height="244" rx="18"
        fill="#F6E6D9" stroke="#B86432" stroke-width="2"/>
  <text x="642" y="369" class="sans label">RESTART AT middle = T(start)</text>
  <line x1="642" y1="386" x2="1120" y2="386" stroke="#D9BDAA" stroke-width="2"/>
  <text x="648" y="422" class="sans horizon">n = 0</text>
  <text x="752" y="422" class="mono matrix">Phi(0,middle) = I</text>
  <text x="648" y="474" class="sans horizon">n = 1</text>
  <text x="752" y="474" class="mono matrix">Phi(1,middle) = S = [1 1; 0 1]</text>
  <text x="648" y="526" class="sans horizon">n = 2</text>
  <text x="752" y="526" class="mono matrix">Phi(2,middle) = L S</text>
  <text x="752" y="557" class="mono matrix">                = [1 1; 1 2]</text>

  <text x="54" y="610" class="sans small">Noninvertible boundary: middle and sink are distinct, but T(middle) = T(sink) = sink.</text>
</svg>
