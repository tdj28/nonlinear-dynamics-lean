<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Lotka-Volterra positive quadrant, equilibria, and first integral</title>
  <desc id="desc">A deep-dive card shows five normalized prey-predator state vectors and separates their finite ledger from a positive-domain logarithmic cancellation.</desc>
  <rect width="1200" height="630" fill="#f1e9da"/>
  <rect x="40" y="40" width="1120" height="550" rx="28" fill="#fffaf1" stroke="#315f63" stroke-width="4"/>
  <text x="78" y="105" font-family="system-ui,sans-serif" font-size="25" font-weight="750" fill="#2d7f73">DEEP DIVE · PREDATOR-PREY DYNAMICS</text>
  <text x="78" y="173" font-family="system-ui,sans-serif" font-size="44" font-weight="780" fill="#16324f">POSITIVE QUADRANT, EQUILIBRIA,</text>
  <text x="78" y="226" font-family="system-ui,sans-serif" font-size="44" font-weight="780" fill="#16324f">AND FIRST INTEGRAL</text>
  <rect x="80" y="270" width="1040" height="106" rx="20" fill="#dfece3" stroke="#315f63" stroke-width="3"/>
  <text x="600" y="310" text-anchor="middle" font-family="system-ui,sans-serif" font-size="21" font-weight="700" fill="#285448">FIVE EXACT NORMALIZED STATES</text>
  <text x="600" y="349" text-anchor="middle" font-family="Georgia,serif" font-size="28" fill="#263c3b">(0,0) · (1,1) · (2,1) · (1,2) · (2,3)</text>
  <rect x="80" y="410" width="300" height="98" rx="18" fill="#e4eef4"/>
  <text x="230" y="450" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" font-weight="700" fill="#16324f">FIELD LEDGER</text>
  <text x="230" y="484" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" fill="#263c3b">two exact zeros</text>
  <rect x="450" y="410" width="300" height="98" rx="18" fill="#f3dfca"/>
  <text x="600" y="450" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" font-weight="700" fill="#874d3b">LOG DOMAIN</text>
  <text x="600" y="484" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" fill="#263c3b">both values positive</text>
  <rect x="820" y="410" width="300" height="98" rx="18" fill="#ede8e1"/>
  <text x="970" y="450" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" font-weight="700" fill="#5a544c">CLAIM BOUNDARY</text>
  <text x="970" y="484" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" fill="#263c3b">no orbit theorem yet</text>
  <text x="600" y="558" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" font-weight="650" fill="#285448">FINITE WORKSHEET · GENERAL CALCULUS · EXPLICIT LIMITS</text>
</svg>
