<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" role="img" aria-labelledby="title desc">
  <title id="title">Logarithmic first-integral cancellation and nonclaims</title>
  <desc id="desc">Four derivative groups cancel in pairs when both component values are positive. A lower boundary stops before positive invariance, global existence, closed orbits, periodicity, flows, and stability.</desc>
  <rect width="760" height="420" fill="#F7F4F0"/>
  <style>
    .t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#2C2924}.title{font-size:15px;font-weight:700}.h{font-size:13px;font-weight:700}.s{font-size:12px}.m{font-size:11px;fill:#5A544C}.pos{fill:#EAF1E5;stroke:#6F8D5E;stroke-width:1.5}.a{fill:#E8F0F7;stroke:#4B6787;stroke-width:1.5}.b{fill:#F3E8E0;stroke:#A67C52;stroke-width:1.5}.warn{fill:#EDE8E1;stroke:#7F786D;stroke-width:1.4}.dash{stroke:#A89B8C;stroke-width:1.5;stroke-dasharray:5 4}.arrow{stroke:#A67C52;stroke-width:2;fill:none;marker-end:url(#arrow)}
  </style>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#A67C52"/></marker></defs>
  <text x="24" y="28" class="t title">Positive values justify the log rules; algebra does the cancellation</text>
  <text x="24" y="48" class="t m">Each colored pair carries equal terms with opposite signs.</text>
  <rect x="24" y="70" width="712" height="46" rx="10" class="pos"/>
  <text x="380" y="98" text-anchor="middle" class="t h">ASSUME BOTH COMPONENT VALUES ARE STRICTLY POSITIVE</text>
  <rect x="24" y="138" width="330" height="95" rx="12" class="a"/>
  <text x="189" y="166" text-anchor="middle" class="t h">PREY-LINEAR PAIR</text>
  <text x="189" y="192" text-anchor="middle" class="t s">positive delta-alpha-prey term</text>
  <text x="189" y="215" text-anchor="middle" class="t s">negative alpha-delta-prey term</text>
  <rect x="406" y="138" width="330" height="95" rx="12" class="b"/>
  <text x="571" y="166" text-anchor="middle" class="t h">INTERACTION AND CONSTANT PAIRS</text>
  <text x="571" y="192" text-anchor="middle" class="t s">two opposite prey-predator products</text>
  <text x="571" y="215" text-anchor="middle" class="t s">two opposite alpha-gamma constants</text>
  <path d="M354 185 H398" class="arrow"/>
  <rect x="210" y="252" width="340" height="48" rx="10" class="pos"/>
  <text x="380" y="281" text-anchor="middle" class="t h">POINTWISE DERIVATIVE: ZERO</text>
  <line x1="24" y1="322" x2="736" y2="322" class="dash"/>
  <text x="380" y="343" text-anchor="middle" class="t h">ADDITIONAL THEOREMS STILL REQUIRED</text>
  <rect x="24" y="358" width="108" height="40" rx="8" class="warn"/><text x="78" y="383" text-anchor="middle" class="t m">invariance</text>
  <rect x="144" y="358" width="108" height="40" rx="8" class="warn"/><text x="198" y="383" text-anchor="middle" class="t m">existence</text>
  <rect x="264" y="358" width="108" height="40" rx="8" class="warn"/><text x="318" y="383" text-anchor="middle" class="t m">closed orbit</text>
  <rect x="384" y="358" width="108" height="40" rx="8" class="warn"/><text x="438" y="383" text-anchor="middle" class="t m">periodicity</text>
  <rect x="504" y="358" width="108" height="40" rx="8" class="warn"/><text x="558" y="383" text-anchor="middle" class="t m">flow</text>
  <rect x="624" y="358" width="112" height="40" rx="8" class="warn"/><text x="680" y="383" text-anchor="middle" class="t m">stability</text>
</svg>
