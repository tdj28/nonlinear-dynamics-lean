<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" role="img" aria-labelledby="title desc">
  <title id="title">Five normalized Lotka-Volterra states and their exact field vectors</title>
  <desc id="desc">The states zero zero, one one, two one, one two, and two three map to the vectors zero zero, zero zero, zero one, minus one zero, and minus four three.</desc>
  <rect width="760" height="420" fill="#F7F4F0"/>
  <style>
    .t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#2C2924}.title{font-size:15px;font-weight:700}.h{font-size:13px;font-weight:700}.s{font-size:12px}.m{font-size:11px;fill:#5A544C}.eq{fill:#EAF1E5;stroke:#6F8D5E;stroke-width:1.5}.factor{fill:#E8F0F7;stroke:#4B6787;stroke-width:1.5}.bench{fill:#F3E8E0;stroke:#A67C52;stroke-width:1.5}.head{fill:#FBF9F6;stroke:#C4B8A8;stroke-width:1.4}.line{stroke:#C4B8A8;stroke-width:1.2}.arrow{stroke:#A67C52;stroke-width:2;fill:none;marker-end:url(#arrow)}
  </style>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#A67C52"/></marker></defs>
  <text x="24" y="28" class="t title">Five-state normalized field ledger</text>
  <text x="24" y="48" class="t m">The complete stored list checks two equilibria, two factor boundaries, and one benchmark.</text>
  <rect x="24" y="70" width="712" height="42" rx="8" class="head"/>
  <text x="94" y="96" text-anchor="middle" class="t h">STATE</text>
  <text x="280" y="96" text-anchor="middle" class="t h">PREY CALCULATION</text>
  <text x="500" y="96" text-anchor="middle" class="t h">PREDATOR CALCULATION</text>
  <text x="675" y="96" text-anchor="middle" class="t h">VECTOR</text>
  <rect x="24" y="122" width="712" height="48" rx="8" class="eq"/>
  <text x="94" y="151" text-anchor="middle" class="t s">0, 0</text><text x="280" y="151" text-anchor="middle" class="t s">0 times 1 = 0</text><text x="500" y="151" text-anchor="middle" class="t s">0 times -1 = 0</text><text x="675" y="151" text-anchor="middle" class="t h">0, 0</text>
  <rect x="24" y="178" width="712" height="48" rx="8" class="eq"/>
  <text x="94" y="207" text-anchor="middle" class="t s">1, 1</text><text x="280" y="207" text-anchor="middle" class="t s">1 times 0 = 0</text><text x="500" y="207" text-anchor="middle" class="t s">1 times 0 = 0</text><text x="675" y="207" text-anchor="middle" class="t h">0, 0</text>
  <rect x="24" y="234" width="712" height="48" rx="8" class="factor"/>
  <text x="94" y="263" text-anchor="middle" class="t s">2, 1</text><text x="280" y="263" text-anchor="middle" class="t s">2 times 0 = 0</text><text x="500" y="263" text-anchor="middle" class="t s">1 times 1 = 1</text><text x="675" y="263" text-anchor="middle" class="t h">0, 1</text>
  <rect x="24" y="290" width="712" height="48" rx="8" class="factor"/>
  <text x="94" y="319" text-anchor="middle" class="t s">1, 2</text><text x="280" y="319" text-anchor="middle" class="t s">1 times -1 = -1</text><text x="500" y="319" text-anchor="middle" class="t s">2 times 0 = 0</text><text x="675" y="319" text-anchor="middle" class="t h">-1, 0</text>
  <rect x="24" y="346" width="712" height="48" rx="8" class="bench"/>
  <text x="94" y="375" text-anchor="middle" class="t s">2, 3</text><text x="280" y="375" text-anchor="middle" class="t s">2 times -2 = -4</text><text x="500" y="375" text-anchor="middle" class="t s">3 times 1 = 3</text><text x="675" y="375" text-anchor="middle" class="t h">-4, 3</text>
  <text x="380" y="414" text-anchor="middle" class="t m">Exact finite cases, not a phase portrait or numerical integration.</text>
</svg>
