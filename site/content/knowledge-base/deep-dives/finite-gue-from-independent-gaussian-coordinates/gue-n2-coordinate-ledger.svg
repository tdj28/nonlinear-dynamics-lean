<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860" role="img" aria-labelledby="n2LedgerTitle n2LedgerDesc">
  <title id="n2LedgerTitle">Exact size-two Gaussian unitary ensemble coordinate and realization ledger</title>
  <desc id="n2LedgerDesc">At matrix size two, the diagonal Gaussian variances are one half and the real and imaginary strict-upper variances are one quarter. Four primitive real coordinates are shown. The toy coordinate values two, negative one, one, and two assemble to a Hermitian matrix with rows two and one plus two i, then one minus two i and negative one. Its trace is one and its four Frobenius-square contributions are four, five, five, and one, totaling fifteen.</desc>
  <rect width="1200" height="860" fill="#F7F4F0"/>
  <style>
    .t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#16243A}
    .title{font-size:30px;font-weight:700}.sub{font-size:18px;fill:#4D5B6B}
    .h{font-size:22px;font-weight:700}.s{font-size:18px}.m{font-size:15px;fill:#4D5B6B}
    .big{font-size:25px;font-weight:700}.mono{font-family:Menlo,Consolas,monospace;font-size:18px;fill:#16243A}
  </style>
  <defs>
    <marker id="n2Arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#A85F24"/>
    </marker>
  </defs>

  <text x="42" y="48" class="t title">One exact size-two coordinate ledger</text>
  <text x="42" y="76" class="t sub">First fix the law parameters; then use one deterministic coordinate point to test assembly.</text>

  <rect x="42" y="108" width="338" height="258" rx="16" fill="#E8F0F7" stroke="#4B6787" stroke-width="2"/>
  <text x="66" y="143" class="t h">1. Wigner law at size two</text>
  <text x="66" y="178" class="t s">diagonal d0: mean 0, variance 1/2</text>
  <text x="66" y="208" class="t s">diagonal d1: mean 0, variance 1/2</text>
  <text x="66" y="248" class="t s">upper real x: mean 0, variance 1/4</text>
  <text x="66" y="278" class="t s">upper imag y: mean 0, variance 1/4</text>
  <line x1="66" y1="300" x2="354" y2="300" stroke="#8EA2B8" stroke-width="1.5"/>
  <text x="66" y="329" class="t big">4 primitive real degrees</text>
  <text x="66" y="351" class="t m">The product law supplies independence.</text>

  <path d="M388 237 L420 237" fill="none" stroke="#A85F24" stroke-width="3" marker-end="url(#n2Arrow)"/>

  <rect x="430" y="108" width="310" height="258" rx="16" fill="#FBF9F6" stroke="#C4B8A8" stroke-width="2"/>
  <text x="454" y="143" class="t h">2. Toy coordinate point</text>
  <text x="454" y="184" class="t big">d0 = 2</text>
  <text x="454" y="220" class="t big">d1 = -1</text>
  <text x="454" y="270" class="t big">x = 1</text>
  <text x="454" y="306" class="t big">y = 2</text>
  <text x="454" y="346" class="t m">Exact map input, not sampled data</text>

  <path d="M748 237 L780 237" fill="none" stroke="#A85F24" stroke-width="3" marker-end="url(#n2Arrow)"/>

  <rect x="790" y="108" width="368" height="258" rx="16" fill="#F3E8E0" stroke="#A67C52" stroke-width="2"/>
  <text x="814" y="143" class="t h">3. Hermitian assembly</text>
  <rect x="826" y="172" width="296" height="112" rx="10" fill="#FFFDF8" stroke="#D2B394" stroke-width="1.5"/>
  <text x="850" y="211" class="t mono">row 0: [2 | 1 + 2i]</text>
  <text x="850" y="257" class="t mono">row 1: [1 - 2i | -1]</text>
  <text x="814" y="319" class="t s">lower entry = conjugate of upper entry</text>
  <text x="814" y="347" class="t m">The sign of the imaginary part must flip.</text>

  <rect x="42" y="402" width="350" height="214" rx="16" fill="#EAF1E5" stroke="#6F8D5E" stroke-width="2"/>
  <text x="66" y="438" class="t h">Hermitian reflection check</text>
  <text x="66" y="480" class="t big">upper: 1 + 2i</text>
  <text x="66" y="520" class="t big">lower: 1 - 2i</text>
  <text x="66" y="557" class="t s">imaginary sign flips</text>
  <text x="66" y="592" class="t s">conjugate transpose returns H</text>

  <rect x="425" y="402" width="290" height="214" rx="16" fill="#FBF9F6" stroke="#C4B8A8" stroke-width="2"/>
  <text x="449" y="438" class="t h">Trace ledger</text>
  <text x="449" y="493" class="t big">2 + (-1) = 1</text>
  <text x="449" y="538" class="t s">Only diagonal entries enter.</text>
  <text x="449" y="574" class="t m">The trace is exact for this toy point.</text>

  <rect x="748" y="402" width="410" height="214" rx="16" fill="#E8F0F7" stroke="#4B6787" stroke-width="2"/>
  <text x="772" y="438" class="t h">Frobenius-square ledger</text>
  <text x="772" y="486" class="t big">4 + 5 + 5 + 1 = 15</text>
  <text x="772" y="524" class="t s">diagonal, upper, lower, diagonal</text>
  <text x="772" y="561" class="t s">The reflected pair contributes 2 x 5.</text>
  <text x="772" y="592" class="t m">For this Hermitian matrix, trace of H squared is also 15.</text>

  <rect x="42" y="654" width="1116" height="142" rx="16" fill="#16243A"/>
  <text x="68" y="692" class="t h" fill="#FFFDF8" style="fill:#FFFDF8">The law-level variance budget uses the same slots</text>
  <text x="68" y="734" class="t big" fill="#FFFDF8" style="fill:#FFFDF8">2 x (1/2) + 2 x [(1/4) + (1/4)] = 2</text>
  <text x="68" y="771" class="t s" fill="#E9E2D8" style="fill:#E9E2D8">This expectation arithmetic belongs to the distribution, while 15 belongs to the displayed coordinate point.</text>

  <text x="42" y="836" class="t m">Exact toy values and exact variance parameters; no empirical or simulated observations appear.</text>
</svg>
