<svg xmlns="http://www.w3.org/2000/svg" width="820" height="520" viewBox="0 0 820 520" role="img" aria-labelledby="convergenceLadderTitle convergenceLadderDesc">
  <title id="convergenceLadderTitle">The convergence ladder has two independent lower rails</title>
  <desc id="convergenceLadderDesc">Almost-everywhere convergence from maximal closure and uniform integrability from identical orbit laws enter separately. Together they yield absolute-mean norm convergence, then stable invariant-set integrals, then conditional-expectation identification. Pointwise convergence alone does not justify the integral steps.</desc>
  <defs>
    <marker id="convergenceLadderArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#A67C52"/>
    </marker>
  </defs>
  <style>
    .t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#2C2924}
    .title{font-size:16px;font-weight:700}
    .h{font-size:12px;font-weight:700}
    .s{font-size:11px}
    .m{font-size:10px;fill:#5A544C}
    .blue{fill:#E8F0F7;stroke:#4B6787;stroke-width:1.5}
    .green{fill:#EAF1E5;stroke:#6F8D5E;stroke-width:1.5}
    .clay{fill:#F3E8E0;stroke:#A67C52;stroke-width:1.5}
    .neutral{fill:#FBF9F6;stroke:#C4B8A8;stroke-width:1.5}
    .arrow{fill:none;stroke:#A67C52;stroke-width:2.2;marker-end:url(#convergenceLadderArrow)}
  </style>
  <rect width="820" height="520" fill="#F7F4F0"/>
  <text x="28" y="31" class="t title">The convergence ladder begins on two separate rails</text>
  <text x="28" y="51" class="t m">The pointwise theorem and the integrability argument meet only at the Vitali step.</text>

  <rect x="44" y="88" width="302" height="92" rx="16" class="blue"/>
  <text x="195" y="116" text-anchor="middle" class="t h">POINTWISE RAIL</text>
  <text x="195" y="143" text-anchor="middle" class="t s">almost-everywhere convergence</text>
  <text x="195" y="163" text-anchor="middle" class="t m">maximal closure plus dense good functions</text>

  <rect x="474" y="88" width="302" height="92" rx="16" class="clay"/>
  <text x="625" y="116" text-anchor="middle" class="t h">INTEGRABILITY RAIL</text>
  <text x="625" y="143" text-anchor="middle" class="t s">uniform integrability</text>
  <text x="625" y="163" text-anchor="middle" class="t m">identical orbit laws plus finite averaging</text>

  <path d="M195 184 C195 229 340 220 384 248" class="arrow"/>
  <path d="M625 184 C625 229 480 220 436 248" class="arrow"/>
  <rect x="278" y="246" width="264" height="78" rx="17" class="green"/>
  <text x="410" y="274" text-anchor="middle" class="t h">VITALI STEP</text>
  <text x="410" y="301" text-anchor="middle" class="t s">absolute-mean norm convergence</text>

  <path d="M410 328 V350" class="arrow"/>
  <rect x="278" y="356" width="264" height="66" rx="16" class="blue"/>
  <text x="410" y="382" text-anchor="middle" class="t h">SET INTEGRALS STABILIZE</text>
  <text x="410" y="404" text-anchor="middle" class="t s">on every exact invariant set</text>

  <path d="M410 426 V446" class="arrow"/>
  <rect x="160" y="452" width="500" height="46" rx="14" class="green"/>
  <text x="410" y="480" text-anchor="middle" class="t h">CONDITIONAL EXPECTATION IDENTIFIED ALMOST EVERYWHERE</text>

  <rect x="30" y="216" width="204" height="118" rx="14" class="neutral"/>
  <text x="132" y="239" text-anchor="middle" class="t h">NOT ENOUGH ALONE</text>
  <text x="132" y="258" text-anchor="middle" class="t m">a pointwise-zero spike sequence</text>
  <path d="M68 310 H196" stroke="#7F786D" stroke-width="1.5"/>
  <rect x="82" y="294" width="26" height="16" fill="#E8F0F7" stroke="#4B6787" stroke-width="1.2"/>
  <rect x="128" y="284" width="16" height="26" fill="#F3E8E0" stroke="#A67C52" stroke-width="1.2"/>
  <rect x="166" y="272" width="10" height="38" fill="#EAF1E5" stroke="#6F8D5E" stroke-width="1.2"/>
  <text x="132" y="328" text-anchor="middle" class="t m">integrals still need not converge</text>
  <path d="M234 279 H262" stroke="#A89B8C" stroke-width="1.5" stroke-dasharray="5 4"/>

  <text x="410" y="514" text-anchor="middle" class="t m">Every rung is proved on a finite measure space; probability normalization is unnecessary.</text>
</svg>
