<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="740" viewBox="0 0 1000 740" role="img" aria-labelledby="four-point-ce-title four-point-ce-desc">
  <title id="four-point-ce-title">Conditional expectation is computed separately on the two invariant atoms</title>
  <desc id="four-point-ce-desc">The invariant sigma algebra has atoms A with probability four fifths and B with probability one fifth. On A, the weighted original integral is sixteen fifths, so dividing by four fifths gives conditional value four. On B, the weighted integral is one fifth, so dividing by one fifth gives value one. Replacing the original values by four on A and one on B preserves both atom integrals and the whole-space integral seventeen fifths.</desc>
  <style>
    .t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#292721}
    .title{font-size:22px;font-weight:700}
    .sub{font-size:16px;fill:#554F47}
    .head{font-size:17px;font-weight:700}
    .body{font-size:17px}
    .small{font-size:15px;fill:#554F47}
    .value{font-size:21px;font-weight:700}
  </style>
  <rect width="1000" height="740" rx="20" fill="#F7F2E8"/>
  <text class="t title" x="34" y="38">Compute conditional expectation atom by atom</text>
  <text class="t sub" x="34" y="64">Invariant information remembers A versus B, but forgets phase inside each two-cycle.</text>

  <rect x="34" y="96" width="932" height="228" rx="16" fill="#E7EFF7" stroke="#416587" stroke-width="2"/>
  <text class="t head" x="58" y="128">INVARIANT ATOM A = {a0, a1}</text>
  <text class="t body" x="58" y="165">mass(A) = 2/5 + 2/5 = 4/5</text>
  <text class="t body" x="58" y="200">integral_A f = (2/5)(1) + (2/5)(7) = 16/5</text>
  <rect x="58" y="226" width="394" height="68" rx="12" fill="#FFFDF8" stroke="#416587" stroke-width="2"/>
  <text class="t value" x="82" y="267">c_A = (16/5) / (4/5) = 4</text>
  <rect x="516" y="144" width="410" height="150" rx="12" fill="#FFFDF8" stroke="#416587" stroke-width="2"/>
  <text class="t head" x="540" y="176">INTEGRAL TEST ON A</text>
  <text class="t body" x="540" y="212">before: 16/5</text>
  <text class="t body" x="540" y="246">after: (4/5)(4) = 16/5</text>
  <text class="t small" x="540" y="276">the defining equality passes</text>

  <rect x="34" y="348" width="932" height="228" rx="16" fill="#F4E8DF" stroke="#A06733" stroke-width="2"/>
  <text class="t head" x="58" y="380">INVARIANT ATOM B = {b0, b1}</text>
  <text class="t body" x="58" y="417">mass(B) = 1/10 + 1/10 = 1/5</text>
  <text class="t body" x="58" y="452">integral_B f = (1/10)(-3) + (1/10)(5) = 1/5</text>
  <rect x="58" y="478" width="394" height="68" rx="12" fill="#FFFDF8" stroke="#A06733" stroke-width="2"/>
  <text class="t value" x="82" y="519">c_B = (1/5) / (1/5) = 1</text>
  <rect x="516" y="396" width="410" height="150" rx="12" fill="#FFFDF8" stroke="#A06733" stroke-width="2"/>
  <text class="t head" x="540" y="428">INTEGRAL TEST ON B</text>
  <text class="t body" x="540" y="464">before: 1/5</text>
  <text class="t body" x="540" y="498">after: (1/5)(1) = 1/5</text>
  <text class="t small" x="540" y="528">the defining equality passes</text>

  <rect x="34" y="606" width="932" height="102" rx="14" fill="#E5EDDF" stroke="#607B53" stroke-width="2"/>
  <text class="t head" x="58" y="638">COMPRESSED FUNCTION</text>
  <text class="t value" x="58" y="674">E[f | I_T] = [4, 4, 1, 1]</text>
  <text class="t body" x="514" y="654">whole integral before = 17/5</text>
  <text class="t body" x="514" y="684">whole integral after = 17/5</text>
  <text class="t small" x="58" y="727">Exact finite arithmetic only. Conditional expectation remains defined only up to almost-everywhere equality in the general theorem.</text>
</svg>
