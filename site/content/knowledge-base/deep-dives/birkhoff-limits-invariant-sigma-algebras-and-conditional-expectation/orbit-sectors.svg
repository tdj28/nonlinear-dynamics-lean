<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760" role="img" aria-labelledby="orbit-sectors-title orbit-sectors-desc">
  <title id="orbit-sectors-title">Two invariant cycles in a four-state probability model have exact limits four and one</title>
  <desc id="orbit-sectors-desc">States a0 and a1 form a two-cycle, each with probability two fifths and observable values one and seven. States b0 and b1 form a second two-cycle, each with probability one tenth and values negative three and five. The four weights sum to one. The first six averages are listed for every start. The a-cycle averages approach four, while the b-cycle averages approach one.</desc>
  <defs>
    <marker id="orbit-sectors-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#A06733"/>
    </marker>
  </defs>
  <style>
    .t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#292721}
    .title{font-size:22px;font-weight:700}
    .sub{font-size:16px;fill:#554F47}
    .head{font-size:17px;font-weight:700}
    .cell{font-size:18px}
    .small{font-size:15px;fill:#554F47}
    .value{font-size:20px;font-weight:700}
  </style>
  <rect width="1000" height="760" rx="20" fill="#F7F2E8"/>
  <text class="t title" x="34" y="38">Four-state probability model: phase disappears, sector remains</text>
  <text class="t sub" x="34" y="64">The map swaps within A and within B. It never carries a point between the two invariant sectors.</text>

  <rect x="34" y="94" width="450" height="220" rx="16" fill="#E7EFF7" stroke="#416587" stroke-width="2"/>
  <text class="t head" x="58" y="126">A SECTOR, PROBABILITY 4/5</text>
  <rect x="72" y="154" width="150" height="100" rx="14" fill="#FFFDF8" stroke="#416587" stroke-width="2"/>
  <text class="t head" x="96" y="182">state a0</text>
  <text class="t small" x="96" y="207">weight 2/5</text>
  <text class="t value" x="96" y="238">value 1</text>
  <rect x="296" y="154" width="150" height="100" rx="14" fill="#FFFDF8" stroke="#416587" stroke-width="2"/>
  <text class="t head" x="320" y="182">state a1</text>
  <text class="t small" x="320" y="207">weight 2/5</text>
  <text class="t value" x="320" y="238">value 7</text>
  <path d="M228 177 C250 150 270 150 290 177" fill="none" stroke="#A06733" stroke-width="3" marker-end="url(#orbit-sectors-arrow)"/>
  <path d="M290 231 C270 258 250 258 228 231" fill="none" stroke="#A06733" stroke-width="3" marker-end="url(#orbit-sectors-arrow)"/>
  <text class="t value" x="259" y="291" text-anchor="middle">time-average limit 4</text>

  <rect x="516" y="94" width="450" height="220" rx="16" fill="#F4E8DF" stroke="#A06733" stroke-width="2"/>
  <text class="t head" x="540" y="126">B SECTOR, PROBABILITY 1/5</text>
  <rect x="554" y="154" width="150" height="100" rx="14" fill="#FFFDF8" stroke="#A06733" stroke-width="2"/>
  <text class="t head" x="578" y="182">state b0</text>
  <text class="t small" x="578" y="207">weight 1/10</text>
  <text class="t value" x="578" y="238">value -3</text>
  <rect x="778" y="154" width="150" height="100" rx="14" fill="#FFFDF8" stroke="#A06733" stroke-width="2"/>
  <text class="t head" x="802" y="182">state b1</text>
  <text class="t small" x="802" y="207">weight 1/10</text>
  <text class="t value" x="802" y="238">value 5</text>
  <path d="M710 177 C732 150 752 150 772 177" fill="none" stroke="#A06733" stroke-width="3" marker-end="url(#orbit-sectors-arrow)"/>
  <path d="M772 231 C752 258 732 258 710 231" fill="none" stroke="#A06733" stroke-width="3" marker-end="url(#orbit-sectors-arrow)"/>
  <text class="t value" x="741" y="291" text-anchor="middle">time-average limit 1</text>

  <rect x="34" y="342" width="932" height="330" rx="16" fill="#FFFDF8" stroke="#C9BBA9" stroke-width="2"/>
  <text class="t head" x="58" y="374">FIRST SIX POSITIVE-TIME AVERAGES</text>
  <rect x="52" y="392" width="896" height="48" rx="8" fill="#17263A"/>
  <text x="72" y="423" font-family="Inter,Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#FFFDF8">start</text>
  <text x="174" y="423" font-family="Inter,Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#FFFDF8">A1</text>
  <text x="274" y="423" font-family="Inter,Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#FFFDF8">A2</text>
  <text x="374" y="423" font-family="Inter,Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#FFFDF8">A3</text>
  <text x="474" y="423" font-family="Inter,Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#FFFDF8">A4</text>
  <text x="574" y="423" font-family="Inter,Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#FFFDF8">A5</text>
  <text x="674" y="423" font-family="Inter,Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#FFFDF8">A6</text>
  <text x="792" y="423" font-family="Inter,Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#FFFDF8">limit</text>

  <g class="t cell">
    <rect x="52" y="450" width="896" height="44" rx="6" fill="#EDF4F8"/>
    <text x="82" y="479">a0</text><text x="174" y="479">1</text><text x="274" y="479">4</text><text x="374" y="479">3</text><text x="474" y="479">4</text><text x="574" y="479">17/5</text><text x="674" y="479">4</text><text x="804" y="479">4</text>
    <rect x="52" y="504" width="896" height="44" rx="6" fill="#EDF4F8"/>
    <text x="82" y="533">a1</text><text x="174" y="533">7</text><text x="274" y="533">4</text><text x="374" y="533">5</text><text x="474" y="533">4</text><text x="574" y="533">23/5</text><text x="674" y="533">4</text><text x="804" y="533">4</text>
    <rect x="52" y="558" width="896" height="44" rx="6" fill="#FBF1E9"/>
    <text x="82" y="587">b0</text><text x="174" y="587">-3</text><text x="274" y="587">1</text><text x="374" y="587">-1/3</text><text x="474" y="587">1</text><text x="574" y="587">1/5</text><text x="674" y="587">1</text><text x="804" y="587">1</text>
    <rect x="52" y="612" width="896" height="44" rx="6" fill="#FBF1E9"/>
    <text x="82" y="641">b1</text><text x="174" y="641">5</text><text x="274" y="641">1</text><text x="374" y="641">7/3</text><text x="474" y="641">1</text><text x="574" y="641">9/5</text><text x="674" y="641">1</text><text x="804" y="641">1</text>
  </g>

  <rect x="34" y="698" width="932" height="40" rx="10" fill="#E5EDDF" stroke="#607B53" stroke-width="2"/>
  <text class="t head" x="58" y="724">Normalization check: 2/5 + 2/5 + 1/10 + 1/10 = 1. This is an exact toy probability model.</text>
</svg>
