<svg xmlns="http://www.w3.org/2000/svg" width="840" height="500" viewBox="0 0 840 500" role="img" aria-labelledby="orbitSectorsTitle orbitSectorsDesc">
  <title id="orbitSectorsTitle">Two invariant cycles retain different time-average limits</title>
  <desc id="orbitSectorsDesc">A finite teaching model has two swapping two-point cycles. The first cycle has mass two at each point and observable values one and seven, giving time-average limit four. The second has mass one half at each point and values negative three and five, giving limit one. Total mass is five, so the example is finite but not probability normalized.</desc>
  <defs>
    <marker id="orbitSectorsArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#A67C52"/>
    </marker>
  </defs>
  <style>
    .t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#2C2924}
    .title{font-size:16px;font-weight:700}
    .h{font-size:12px;font-weight:700}
    .s{font-size:11px}
    .m{font-size:10px;fill:#5A544C}
    .value{font-size:15px;font-weight:700}
    .blue{fill:#E8F0F7;stroke:#4B6787;stroke-width:1.5}
    .green{fill:#EAF1E5;stroke:#6F8D5E;stroke-width:1.5}
    .clay{fill:#F3E8E0;stroke:#A67C52;stroke-width:1.5}
    .neutral{fill:#FBF9F6;stroke:#C4B8A8;stroke-width:1.5}
    .arrow{fill:none;stroke:#A67C52;stroke-width:2;marker-end:url(#orbitSectorsArrow)}
  </style>
  <rect width="840" height="500" fill="#F7F4F0"/>
  <text x="28" y="31" class="t title">Two invariant cycles retain two different long-time averages</text>
  <text x="28" y="51" class="t m">A finite mass-five teaching model: the map swaps points within each cycle and never crosses between them.</text>

  <rect x="28" y="86" width="530" height="320" rx="20" class="neutral"/>
  <text x="293" y="115" text-anchor="middle" class="t h">FOUR POINTS WITH DECLARED MASSES AND VALUES</text>

  <rect x="58" y="140" width="470" height="108" rx="16" class="blue"/>
  <text x="80" y="168" class="t h">A-CYCLE</text>
  <text x="492" y="168" text-anchor="end" class="t m">sector mass 4</text>
  <circle cx="206" cy="200" r="30" fill="#FBF9F6" stroke="#4B6787" stroke-width="2"/>
  <text x="206" y="193" text-anchor="middle" class="t m">a0, mass 2</text>
  <text x="206" y="215" text-anchor="middle" class="t value">value 1</text>
  <circle cx="390" cy="200" r="30" fill="#FBF9F6" stroke="#4B6787" stroke-width="2"/>
  <text x="390" y="193" text-anchor="middle" class="t m">a1, mass 2</text>
  <text x="390" y="215" text-anchor="middle" class="t value">value 7</text>
  <path d="M238 184 C279 159 326 159 358 184" class="arrow"/>
  <path d="M358 216 C319 240 275 240 238 216" class="arrow"/>

  <rect x="58" y="270" width="470" height="108" rx="16" class="clay"/>
  <text x="80" y="298" class="t h">B-CYCLE</text>
  <text x="492" y="298" text-anchor="end" class="t m">sector mass 1</text>
  <circle cx="206" cy="330" r="30" fill="#FBF9F6" stroke="#A67C52" stroke-width="2"/>
  <text x="206" y="323" text-anchor="middle" class="t m">b0, mass 1/2</text>
  <text x="206" y="345" text-anchor="middle" class="t value">value -3</text>
  <circle cx="390" cy="330" r="30" fill="#FBF9F6" stroke="#A67C52" stroke-width="2"/>
  <text x="390" y="323" text-anchor="middle" class="t m">b1, mass 1/2</text>
  <text x="390" y="345" text-anchor="middle" class="t value">value 5</text>
  <path d="M238 314 C279 289 326 289 358 314" class="arrow"/>
  <path d="M358 346 C319 370 275 370 238 346" class="arrow"/>
  <text x="293" y="397" text-anchor="middle" class="t m">Total mass 5: finite, preserved, and not probability normalized.</text>

  <path d="M562 246 H592" class="arrow"/>
  <rect x="600" y="116" width="212" height="260" rx="18" class="green"/>
  <text x="706" y="145" text-anchor="middle" class="t h">TIME-AVERAGE LIMITS</text>
  <rect x="632" y="177" width="148" height="70" rx="13" class="blue"/>
  <text x="706" y="200" text-anchor="middle" class="t s">every start in A</text>
  <text x="706" y="229" text-anchor="middle" class="t value">limit 4</text>
  <rect x="632" y="270" width="148" height="70" rx="13" class="clay"/>
  <text x="706" y="293" text-anchor="middle" class="t s">every start in B</text>
  <text x="706" y="322" text-anchor="middle" class="t value">limit 1</text>
  <text x="706" y="360" text-anchor="middle" class="t m">the orbit sector is remembered</text>

  <rect x="62" y="438" width="716" height="38" rx="12" class="green"/>
  <text x="420" y="462" text-anchor="middle" class="t s">Finite teaching model only: general invariant components need not be finite cycles.</text>
</svg>
