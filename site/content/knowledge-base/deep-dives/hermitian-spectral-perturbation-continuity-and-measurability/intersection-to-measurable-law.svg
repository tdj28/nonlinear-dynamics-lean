<svg xmlns="http://www.w3.org/2000/svg" width="760" height="410"
     viewBox="0 0 760 410" role="img"
     aria-labelledby="intersectionLawTitle intersectionLawDesc">
  <title id="intersectionLawTitle">A spectral intersection witness unlocks measurable observables and a Gaussian ensemble pushforward comparison</title>
  <desc id="intersectionLawDesc">Top modes from a first Hermitian matrix and bottom modes from a second matrix overlap because their dimensions exceed the ambient dimension. A nonzero witness enters both quadratic estimates, which produce a one-sided level bound. Swapping the matrices gives a Lipschitz ordered spectrum. Continuity first makes the counting and empirical spectral sample maps measurable. That measurability then licenses the separate equality between the ambient and intrinsic Gaussian unitary ensemble pushforward laws.</desc>
  <rect width="760" height="410" fill="#F7F4F0"/>
  <style>
    .t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#2C2924}
    .title{font-size:15px;font-weight:700}
    .h{font-size:13px;font-weight:700}
    .s{font-size:12px}
    .m{font-size:11px;fill:#5A544C}
    .cool{fill:#E8F0F7;stroke:#4B6787;stroke-width:1.5}
    .warm{fill:#F3E8E0;stroke:#A67C52;stroke-width:1.5}
    .neutral{fill:#FBF9F6;stroke:#C4B8A8;stroke-width:1.5}
    .green{fill:#EAF1E5;stroke:#6F8D5E;stroke-width:1.5}
    .muted{fill:#EDE8E1;stroke:#7F786D;stroke-width:1.4}
    .link{fill:none;stroke:#A67C52;stroke-width:2}
  </style>
  <defs>
    <marker id="intersectionArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#A67C52"/>
    </marker>
  </defs>

  <text x="24" y="28" class="t title">From a dimension witness to measurable spectral observables</text>
  <text x="24" y="48" class="t m">Each box is a distinct logical layer; probability enters only after continuity.</text>

  <rect x="24" y="78" width="202" height="74" rx="11" class="cool"/>
  <text x="125" y="106" text-anchor="middle" class="t h">Top modes of the first matrix</text>
  <text x="125" y="129" text-anchor="middle" class="t m">first ordered levels through the index</text>

  <rect x="24" y="174" width="202" height="74" rx="11" class="cool"/>
  <text x="125" y="202" text-anchor="middle" class="t h">Bottom modes of the second</text>
  <text x="125" y="225" text-anchor="middle" class="t m">ordered levels from the index onward</text>

  <path d="M226 115 H257 V137" class="link" marker-end="url(#intersectionArrow)"/>
  <path d="M226 211 H257 V171" class="link" marker-end="url(#intersectionArrow)"/>

  <rect x="266" y="111" width="198" height="98" rx="12" class="warm"/>
  <text x="365" y="140" text-anchor="middle" class="t h">Dimension forces overlap</text>
  <text x="365" y="163" text-anchor="middle" class="t s">choose one nonzero shared witness</text>
  <text x="365" y="185" text-anchor="middle" class="t m">no common eigenvector is assumed</text>

  <path d="M464 160 H497" class="link" marker-end="url(#intersectionArrow)"/>

  <rect x="506" y="111" width="230" height="98" rx="12" class="neutral"/>
  <text x="621" y="139" text-anchor="middle" class="t h">Quadratic forms squeeze one level</text>
  <text x="621" y="162" text-anchor="middle" class="t s">Frobenius control gives one side</text>
  <text x="621" y="185" text-anchor="middle" class="t m">swap the matrices for both sides</text>

  <path d="M621 209 V242" class="link" marker-end="url(#intersectionArrow)"/>

  <rect x="506" y="251" width="230" height="76" rx="11" class="green"/>
  <text x="621" y="279" text-anchor="middle" class="t h">Ordered spectrum is Lipschitz</text>
  <text x="621" y="302" text-anchor="middle" class="t m">coordinate control and finite sup metric</text>

  <path d="M506 289 H466" class="link" marker-end="url(#intersectionArrow)"/>

  <rect x="266" y="251" width="198" height="76" rx="11" class="green"/>
  <text x="365" y="279" text-anchor="middle" class="t h">Continuous, then measurable</text>
  <text x="365" y="302" text-anchor="middle" class="t m">ordinary Borel measurability</text>

  <path d="M266 289 H226" class="link" marker-end="url(#intersectionArrow)"/>

  <rect x="24" y="251" width="202" height="76" rx="11" class="muted"/>
  <text x="125" y="277" text-anchor="middle" class="t h">Measurable observables unlock</text>
  <text x="125" y="299" text-anchor="middle" class="t m">counting + empirical sample maps</text>
  <text x="125" y="317" text-anchor="middle" class="t m">then Gaussian pushforward equality</text>

  <rect x="24" y="350" width="712" height="40" rx="10" class="green"/>
  <text x="380" y="375" text-anchor="middle" class="t s">The result controls eigenvalue locations, not eigenvectors, densities, random tails, or limits.</text>
</svg>
