<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630"
     viewBox="0 0 1200 630" role="img"
     aria-labelledby="exactPerturbationTitle exactPerturbationDesc">
  <title id="exactPerturbationTitle">An exact two by two Hermitian perturbation fits the Frobenius budget</title>
  <desc id="exactPerturbationDesc">Diagonal Hermitian matrix A has ordered levels 3 and negative 1. Matrix B has ordered levels five halves and negative three quarters. The diagonal entries of B minus A are negative one half and positive one quarter. Their absolute level shifts are one half and one quarter. The squared Frobenius distance is five sixteenths, so the largest squared shift one quarter is below the budget.</desc>
  <rect width="1200" height="630" fill="#F7F4F0"/>
  <style>
    .t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#16243A}
    .title{font-size:31px;font-weight:700}.sub{font-size:18px;fill:#4D5B6B}
    .h{font-size:21px;font-weight:700}.s{font-size:17px}.m{font-size:15px;fill:#4D5B6B}
    .mono{font-family:Menlo,Consolas,monospace;font-size:17px;fill:#16243A}
    .cool{fill:#E8F0F7;stroke:#4B6787;stroke-width:2}
    .warm{fill:#F3E8E0;stroke:#A67C52;stroke-width:2}
    .neutral{fill:#FBF9F6;stroke:#C4B8A8;stroke-width:2}
    .green{fill:#EAF1E5;stroke:#6F8D5E;stroke-width:2}
    .link{stroke:#A67C52;stroke-width:3;fill:none}
  </style>
  <defs>
    <marker id="exactArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#A67C52"/>
    </marker>
  </defs>

  <text x="42" y="55" class="t title">One exact Hermitian perturbation budget</text>
  <text x="42" y="86" class="t sub">Every value is rational until the final square root.</text>

  <rect x="42" y="120" width="326" height="332" rx="18" class="cool"/>
  <text x="68" y="158" class="t h">1. Two diagonal matrices</text>
  <text x="68" y="199" class="mono">A rows: [3, 0]</text>
  <text x="142" y="228" class="mono">[0, -1]</text>
  <text x="68" y="278" class="mono">B rows: [5/2, 0]</text>
  <text x="142" y="307" class="mono">[0, -3/4]</text>
  <line x1="68" y1="334" x2="342" y2="334" stroke="#4B6787" stroke-width="1.5"/>
  <text x="68" y="369" class="t s">Both are Hermitian.</text>
  <text x="68" y="399" class="t s">Both diagonals are decreasing.</text>
  <text x="68" y="429" class="t m">Their diagonal entries are their levels.</text>

  <path d="M380 286 H416" class="link" marker-end="url(#exactArrow)"/>

  <rect x="430" y="120" width="326" height="332" rx="18" class="warm"/>
  <text x="456" y="158" class="t h">2. Match equal ordered ranks</text>
  <rect x="456" y="187" width="274" height="83" rx="12" class="neutral"/>
  <text x="476" y="220" class="mono">rank 0: 3 -&gt; 5/2</text>
  <text x="476" y="250" class="t s">absolute shift = 1/2</text>
  <rect x="456" y="287" width="274" height="83" rx="12" class="neutral"/>
  <text x="476" y="320" class="mono">rank 1: -1 -&gt; -3/4</text>
  <text x="476" y="350" class="t s">absolute shift = 1/4</text>
  <text x="456" y="410" class="t m">Largest ordered shift: 1/2</text>

  <path d="M768 286 H804" class="link" marker-end="url(#exactArrow)"/>

  <rect x="818" y="120" width="340" height="332" rx="18" class="green"/>
  <text x="844" y="158" class="t h">3. Audit the matrix budget</text>
  <text x="844" y="202" class="mono">B - A entries: -1/2, +1/4</text>
  <text x="844" y="244" class="mono">Frobenius square = 5/16</text>
  <text x="844" y="286" class="mono">distance = sqrt(5)/4</text>
  <text x="844" y="323" class="t m">approximately 0.559</text>
  <line x1="844" y1="348" x2="1132" y2="348" stroke="#6F8D5E" stroke-width="1.5"/>
  <text x="844" y="386" class="mono">shift square 1/4</text>
  <text x="844" y="420" class="mono">is at most 5/16</text>

  <rect x="42" y="492" width="1116" height="92" rx="15" fill="#16243A"/>
  <text x="600" y="532" text-anchor="middle" class="t h" fill="#FFFDF8" style="fill:#FFFDF8">Hermitian inputs + the same decreasing order make the comparison meaningful.</text>
  <text x="600" y="562" text-anchor="middle" class="t s" fill="#FFFDF8" style="fill:#FFFDF8">The checked theorem gives every ordered level the common Frobenius budget sqrt(5)/4.</text>
</svg>
