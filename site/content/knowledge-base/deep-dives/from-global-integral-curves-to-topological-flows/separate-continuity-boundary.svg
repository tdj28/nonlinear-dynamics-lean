<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="title desc">
  <title id="title">Fixed-state continuity does not imply joint continuity</title>
  <desc id="desc">The left panel shows continuous time traces for fixed states. The right panel shows diagonal inputs approaching the origin while outputs approach one half rather than zero.</desc>
  <rect width="960" height="480" rx="24" fill="#fbf8f0"/>
  <text x="54" y="58" font-family="Georgia,serif" font-size="30" fill="#23343b">A diagonal approach crosses the gap</text>
  <rect x="54" y="92" width="400" height="326" rx="18" fill="#f1e9da"/>
  <text x="82" y="130" font-family="Arial,sans-serif" font-size="19" fill="#7a4d69">FIX ONE STATE</text>
  <g fill="none" stroke="#315f63" stroke-width="4"><path d="M90 330 C175 300 240 210 410 235"/><path d="M90 280 C180 260 260 180 410 198"/><path d="M90 365 C170 340 275 280 410 292"/></g>
  <text x="82" y="395" font-family="Arial,sans-serif" font-size="18" fill="#23343b">each time trace is continuous</text>
  <rect x="506" y="92" width="400" height="326" rx="18" fill="#e5efea"/>
  <text x="534" y="130" font-family="Arial,sans-serif" font-size="19" fill="#7a4d69">MOVE TIME AND STATE TOGETHER</text>
  <line x1="560" y1="360" x2="850" y2="160" stroke="#315f63" stroke-width="3"/>
  <g fill="#b24b40"><circle cx="815" cy="184" r="9"/><circle cx="750" cy="229" r="9"/><circle cx="680" cy="277" r="9"/><circle cx="610" cy="326" r="9"/></g>
  <circle cx="560" cy="360" r="11" fill="#23343b"/>
  <path d="M610 326 C650 220 710 180 820 150" fill="none" stroke="#b24b40" stroke-width="3" stroke-dasharray="7 7"/>
  <text x="537" y="395" font-family="Arial,sans-serif" font-size="18" fill="#23343b">inputs tend to zero; outputs tend to 1/2</text>
</svg>
