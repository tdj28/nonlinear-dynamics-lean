<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">From global integral curves to topological flows</title>
  <desc id="desc">A trajectory restarts at an intermediate state while a separate continuity gate controls the assembled time-and-state map.</desc>
  <rect width="1200" height="630" fill="#f1e9da"/><rect x="38" y="38" width="1124" height="554" rx="28" fill="#fbf8f0" stroke="#315f63" stroke-width="4"/>
  <text x="76" y="102" font-family="Arial,sans-serif" font-size="21" letter-spacing="3" fill="#7a4d69">DEEP DIVE · CONTINUOUS-TIME DYNAMICS</text>
  <text x="76" y="174" font-family="Georgia,serif" font-size="49" fill="#23343b">Global integral curves</text><text x="76" y="231" font-family="Georgia,serif" font-size="49" fill="#23343b">become a topological flow</text>
  <path d="M96 390 C275 230 480 470 720 305" fill="none" stroke="#315f63" stroke-width="7"/><g fill="#b24b40"><circle cx="96" cy="390" r="12"/><circle cx="390" cy="354" r="12"/><circle cx="720" cy="305" r="12"/></g>
  <rect x="790" y="286" width="316" height="148" rx="20" fill="#e5efea" stroke="#315f63" stroke-width="3"/><text x="820" y="331" font-family="Arial,sans-serif" font-size="19" fill="#7a4d69">EXTRA GATE</text><text x="820" y="378" font-family="Georgia,serif" font-size="26" fill="#23343b">joint continuity</text><text x="820" y="411" font-family="Arial,sans-serif" font-size="18" fill="#23343b">in time and state</text>
  <text x="76" y="540" font-family="Arial,sans-serif" font-size="19" fill="#7a4d69">uniqueness proves restart · continuity supplies topology · professional review pending</text>
</svg>
