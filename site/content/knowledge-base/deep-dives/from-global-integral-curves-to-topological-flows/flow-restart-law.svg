<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="title desc">
  <title id="title">The flow restart law</title>
  <desc id="desc">One curved trajectory connects an initial point to an intermediate point after time s and a final point after time t. A second arc marks the combined time s plus t.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#315f63"/></marker></defs>
  <rect width="960" height="480" rx="24" fill="#fbf8f0"/>
  <text x="54" y="58" font-family="Georgia,serif" font-size="30" fill="#23343b">Restart at the intermediate state</text>
  <path d="M100 310 C270 100 520 380 850 150" fill="none" stroke="#315f63" stroke-width="7"/>
  <g fill="#b24b40"><circle cx="100" cy="310" r="12"/><circle cx="470" cy="250" r="12"/><circle cx="850" cy="150" r="12"/></g>
  <g font-family="Arial,sans-serif" font-size="20" fill="#23343b"><text x="72" y="348">start x</text><text x="406" y="292">state after s</text><text x="800" y="125">final state</text></g>
  <path d="M112 322 C280 445 655 430 842 170" fill="none" stroke="#7a4d69" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="382" y="432" font-family="Arial,sans-serif" font-size="20" fill="#7a4d69">one interval: s + t</text>
  <path d="M155 264 L420 248" stroke="#315f63" stroke-width="4" marker-end="url(#arrow)"/><path d="M520 230 L805 165" stroke="#315f63" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="278" y="232" font-family="Arial,sans-serif" font-size="20" fill="#315f63">s</text><text x="665" y="176" font-family="Arial,sans-serif" font-size="20" fill="#315f63">t</text>
</svg>
