<svg xmlns="http://www.w3.org/2000/svg" width="760" height="350" viewBox="0 0 760 350" role="img" aria-labelledby="grcTitle grcDesc">
  <title id="grcTitle">Generic finite ratio specializes to log-positive cocycles</title>
  <desc id="grcDesc">A generic lane takes centered subadditivity, finite integrability, preservation, and lower normalized integral bounds. A cocycle lane supplies these from log-positive observables, one-step integrability, centering, and the deterministic Fekete rate.</desc>
  <rect width="760" height="350" fill="#F7F4F0"/>
  <style>.t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#2C2924}.title{font-size:15px;font-weight:700}.h{font-size:13px;font-weight:700}.s{font-size:12px}.m{font-size:11px;fill:#5A544C}.data{fill:#E8F0F7;stroke:#4B6787;stroke-width:1.5}.warn{fill:#F3E8E0;stroke:#A67C52;stroke-width:1.5}.keep{fill:#EAF1E5;stroke:#6F8D5E;stroke-width:1.5}.neutral{fill:#FBF9F6;stroke:#C4B8A8;stroke-width:1.5}</style>
  <text x="24" y="28" class="t title">The cocycle endpoint discharges a generic rate premise</text>
  <text x="24" y="48" class="t m">Fekete controls normalized integrals, not sample paths.</text>
  <rect x="28" y="80" width="310" height="190" rx="14" class="data"/>
  <text x="54" y="110" class="t h">GENERIC CENTERED PROCESS</text>
  <rect x="54" y="130" width="258" height="34" rx="8" class="neutral"/><text x="75" y="152" class="t s">shifted subadditivity</text>
  <rect x="54" y="174" width="258" height="34" rx="8" class="neutral"/><text x="75" y="196" class="t s">finite integrals and preservation</text>
  <rect x="54" y="218" width="258" height="34" rx="8" class="neutral"/><text x="75" y="240" class="t s">lower normalized integral rate</text>
  <path d="M342 175 H414" stroke="#A67C52" stroke-width="3"/><path d="M414 175 L402 167 V183 Z" fill="#A67C52"/>
  <rect x="420" y="80" width="312" height="190" rx="14" class="warn"/>
  <text x="446" y="110" class="t h">LOG-POSITIVE COCYCLE</text>
  <rect x="446" y="130" width="260" height="34" rx="8" class="neutral"/><text x="467" y="152" class="t s">one-step integrability package</text>
  <rect x="446" y="174" width="260" height="34" rx="8" class="neutral"/><text x="467" y="196" class="t s">centered integral identity</text>
  <rect x="446" y="218" width="260" height="34" rx="8" class="neutral"/><text x="467" y="240" class="t s">deterministic Fekete lower bound</text>
  <rect x="82" y="292" width="596" height="42" rx="10" class="keep"/>
  <text x="164" y="318" class="t h">FINITE COCYCLE BAD-SET MEASURE RATIO, WITHOUT ERGODICITY</text>
</svg>
