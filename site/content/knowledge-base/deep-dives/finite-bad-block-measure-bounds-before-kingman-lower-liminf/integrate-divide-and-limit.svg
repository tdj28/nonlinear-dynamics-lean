<svg xmlns="http://www.w3.org/2000/svg" width="760" height="350" viewBox="0 0 760 350" role="img" aria-labelledby="idlTitle idlDesc">
  <title id="idlTitle">Integrate, establish signs, divide, and remove the buffer</title>
  <desc id="idlDesc">A four-stage ladder first integrates the pointwise packing bound, then derives nonpositive signs, reverses order when dividing by the negative threshold, and finally lets the auxiliary horizon remove the fixed buffer.</desc>
  <rect width="760" height="350" fill="#F7F4F0"/>
  <style>.t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#2C2924}.title{font-size:15px;font-weight:700}.h{font-size:13px;font-weight:700}.s{font-size:12px}.m{font-size:11px;fill:#5A544C}.data{fill:#E8F0F7;stroke:#4B6787;stroke-width:1.5}.warn{fill:#F3E8E0;stroke:#A67C52;stroke-width:1.5}.keep{fill:#EAF1E5;stroke:#6F8D5E;stroke-width:1.5}.neutral{fill:#FBF9F6;stroke:#C4B8A8;stroke-width:1.5}</style>
  <text x="24" y="28" class="t title">The finite inequality survives four controlled transformations</text>
  <text x="24" y="48" class="t m">Only the auxiliary horizon tends to infinity.</text>
  <rect x="24" y="82" width="154" height="142" rx="12" class="data"/>
  <text x="50" y="112" class="t h">1. INTEGRATE</text>
  <text x="47" y="145" class="t s">replace visits by</text><text x="47" y="166" class="t s">horizon times</text><text x="47" y="187" class="t s">bad-set measure</text>
  <path d="M181 153 H205" stroke="#A67C52" stroke-width="2.5"/><path d="M205 153 L195 146 V160 Z" fill="#A67C52"/>
  <rect x="208" y="82" width="154" height="142" rx="12" class="neutral"/>
  <text x="234" y="112" class="t h">2. FIX SIGNS</text>
  <text x="230" y="145" class="t s">time one forces</text><text x="230" y="166" class="t s">the lower rate</text><text x="230" y="187" class="t s">to be nonpositive</text>
  <path d="M365 153 H389" stroke="#A67C52" stroke-width="2.5"/><path d="M389 153 L379 146 V160 Z" fill="#A67C52"/>
  <rect x="392" y="82" width="154" height="142" rx="12" class="warn"/>
  <text x="418" y="112" class="t h">3. DIVIDE</text>
  <text x="415" y="145" class="t s">negative threshold</text><text x="415" y="166" class="t s">reverses the</text><text x="415" y="187" class="t s">order relation</text>
  <path d="M549 153 H573" stroke="#A67C52" stroke-width="2.5"/><path d="M573 153 L563 146 V160 Z" fill="#A67C52"/>
  <rect x="576" y="82" width="160" height="142" rx="12" class="keep"/>
  <text x="602" y="112" class="t h">4. TAKE LIMIT</text>
  <text x="600" y="145" class="t s">growing horizon</text><text x="600" y="166" class="t s">removes the fixed</text><text x="600" y="187" class="t s">length buffer</text>
  <rect x="78" y="256" width="604" height="52" rx="12" class="keep"/>
  <text x="156" y="279" class="t h">FINITE BAD-SET MEASURE RATIO</text>
  <text x="180" y="298" class="t m">No samplewise convergence and no limit-integral exchange</text>
  <rect x="24" y="322" width="712" height="18" rx="7" class="data"/>
</svg>
