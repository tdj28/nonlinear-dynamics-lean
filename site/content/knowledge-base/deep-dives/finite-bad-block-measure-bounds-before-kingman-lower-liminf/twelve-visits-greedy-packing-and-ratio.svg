<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820"
     viewBox="0 0 1200 820" role="img"
     aria-labelledby="packingRatioTitle packingRatioDesc">
  <title id="packingRatioTitle">Twelve marked starts become three disjoint blocks and a finite ratio</title>
  <desc id="packingRatioDesc">The first twelve positions of a seventeen-step amber horizon are marked. Three disjoint length-five intervals starting at zero, five, and ten cover all marks. The amber cost chain is negative sixteen at most negative twelve, below negative forty-five quarters, at most negative nine. Blue contributes zero. Atomwise integration gives visit integral six and centered-process integral negative eight. The bad-event mass one half is at most the ratio two thirds; the unreversed inequality one half at least two thirds is false.</desc>
  <rect width="1200" height="820" fill="#F7F4F0"/>
  <style>
    .t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#2C2924}
    .title{font-size:27px;font-weight:700}
    .sub{font-size:16px;fill:#5A544C}
    .h{font-size:17px;font-weight:700}
    .s{font-size:15px}
    .m{font-size:13px;fill:#5A544C}
    .num{font-size:18px;font-weight:700}
  </style>

  <text x="50" y="47" class="t title">Twelve marked starts become three disjoint blocks</text>
  <text x="50" y="76" class="t sub">H = 12, cap m = 5, buffered horizon H + m = 17, slope c = -3/4.</text>

  <rect x="44" y="104" width="1112" height="335" rx="18"
        fill="#FFFDF8" stroke="#C4B8A8" stroke-width="2"/>
  <text x="69" y="136" class="t h">Amber orbit: every start from 0 through 11 is marked</text>

  <g transform="translate(70 157)">
    <rect x="0" y="0" width="660" height="54" rx="10"
          fill="#F3E8E0" stroke="#A67C52" stroke-width="1.5"/>
    <rect x="660" y="0" width="275" height="54" rx="10"
          fill="#EDE8E1" stroke="#7F786D" stroke-width="1.5"/>
    <text x="272" y="34" class="t h">12 counted starts</text>
    <text x="742" y="34" class="t h">5-step buffer</text>
  </g>

  <g class="t m" text-anchor="middle">
    <text x="82" y="239">0</text><text x="137" y="239">1</text>
    <text x="192" y="239">2</text><text x="247" y="239">3</text>
    <text x="302" y="239">4</text><text x="357" y="239">5</text>
    <text x="412" y="239">6</text><text x="467" y="239">7</text>
    <text x="522" y="239">8</text><text x="577" y="239">9</text>
    <text x="632" y="239">10</text><text x="687" y="239">11</text>
    <text x="742" y="239">12</text><text x="797" y="239">13</text>
    <text x="852" y="239">14</text><text x="907" y="239">15</text>
    <text x="962" y="239">16</text>
  </g>

  <g fill="#8B3E33" stroke="#FFFDF8" stroke-width="2">
    <circle cx="82" cy="264" r="9"/><circle cx="137" cy="264" r="9"/>
    <circle cx="192" cy="264" r="9"/><circle cx="247" cy="264" r="9"/>
    <circle cx="302" cy="264" r="9"/><circle cx="357" cy="264" r="9"/>
    <circle cx="412" cy="264" r="9"/><circle cx="467" cy="264" r="9"/>
    <circle cx="522" cy="264" r="9"/><circle cx="577" cy="264" r="9"/>
    <circle cx="632" cy="264" r="9"/><circle cx="687" cy="264" r="9"/>
  </g>
  <g fill="#FFFDF8" stroke="#7F786D" stroke-width="2">
    <circle cx="742" cy="264" r="8"/><circle cx="797" cy="264" r="8"/>
    <circle cx="852" cy="264" r="8"/><circle cx="907" cy="264" r="8"/>
    <circle cx="962" cy="264" r="8"/>
  </g>

  <rect x="70" y="299" width="275" height="52" rx="10"
        fill="#E8F0F7" stroke="#4B6787" stroke-width="2"/>
  <rect x="345" y="299" width="275" height="52" rx="10"
        fill="#EAF1E5" stroke="#6F8D5E" stroke-width="2"/>
  <rect x="620" y="299" width="275" height="52" rx="10"
        fill="#F3E8E0" stroke="#A67C52" stroke-width="2"/>
  <text x="152" y="331" class="t h">[0, 5) cost -4</text>
  <text x="423" y="331" class="t h">[5, 10) cost -4</text>
  <text x="688" y="331" class="t h">[10, 15) cost -4</text>
  <text x="918" y="329" class="t m">uncovered gap</text>
  <text x="918" y="347" class="t m">has nonpositive cost</text>

  <rect x="70" y="376" width="1030" height="45" rx="10"
        fill="#E8F0F7" stroke="#4B6787" stroke-width="1.5"/>
  <text x="97" y="405" class="t num">amber chain: -16 ≤ -12 &lt; -45/4 ≤ -9 = c · 12</text>

  <rect x="44" y="463" width="534" height="213" rx="18"
        fill="#FFFDF8" stroke="#4B6787" stroke-width="2"/>
  <text x="72" y="500" class="t h">Integrate atom by atom</text>
  <text x="72" y="535" class="t s">visit counts: amber 12, blue 0</text>
  <text x="72" y="566" class="t num">average count = (12 + 0) / 2 = 6</text>
  <text x="72" y="606" class="t s">buffered values: amber -16, blue 0</text>
  <text x="72" y="637" class="t num">average value = (-16 + 0) / 2 = -8</text>
  <text x="72" y="663" class="t m">Pointwise → integral: -8 ≤ (-3/4) · 6 = -9/2.</text>

  <rect x="602" y="463" width="554" height="213" rx="18"
        fill="#EAF1E5" stroke="#6F8D5E" stroke-width="2"/>
  <text x="630" y="500" class="t h">Finite measure ratio</text>
  <text x="630" y="537" class="t s">bad mass q = 1/2</text>
  <text x="630" y="568" class="t s">lower rate δ = -1/2</text>
  <text x="630" y="599" class="t s">threshold c = -3/4</text>
  <text x="630" y="635" class="t num">1/2 ≤ δ / c = 2/3</text>
  <text x="630" y="662" class="t m">Wrong sign reversal: 1/2 ≥ 2/3 is false.</text>

  <rect x="44" y="711" width="1112" height="76" rx="14"
        fill="#F3E8E0" stroke="#A67C52" stroke-width="1.5"/>
  <text x="72" y="743" class="t h">What moved toward a limit?</text>
  <text x="72" y="770" class="t s">Only the scalar boundary factor H / (H + m). No lower liminf and no Kingman convergence are proved.</text>
</svg>
