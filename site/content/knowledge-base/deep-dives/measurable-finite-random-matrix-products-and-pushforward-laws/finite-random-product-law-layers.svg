<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600"
     viewBox="0 0 800 600" role="img"
     aria-labelledby="finiteProductLayersTitle finiteProductLayersDesc">
  <title id="finiteProductLayersTitle">Four interfaces from random matrix factors to a bundled product law</title>
  <desc id="finiteProductLayersDesc">A vertical ladder begins with a finite prefix of outcome-dependent matrix factors. Pointwise chronological multiplication produces a sample product. Exact prefix measurability evidence certifies that product map. A chosen source measure is transported through the certified map to a raw law. A separate mass-one theorem permits the same raw law to be packaged as a bundled probability measure. Side notes distinguish algebraic, measurable, and probability assumptions, and a footer lists conclusions not supplied.</desc>
  <rect width="800" height="600" fill="#F7F4F0"/>
  <style>
    .t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#2C2924}
    .title{font-size:16px;font-weight:700}
    .h{font-size:13px;font-weight:700}
    .s{font-size:12px}
    .m{font-size:11px;fill:#5A544C}
  </style>
  <defs>
    <marker id="finiteProductLayersArrow" markerWidth="8" markerHeight="8"
            refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#A67C52"/>
    </marker>
  </defs>

  <text x="24" y="32" class="t title">Each ascent adds one new kind of evidence</text>
  <text x="24" y="53" class="t m">The sampled matrices and their probabilities remain unchanged when evidence is packaged.</text>

  <rect x="226" y="78" width="348" height="72" rx="12"
        fill="#E8F0F7" stroke="#4B6787" stroke-width="1.5"/>
  <text x="400" y="107" text-anchor="middle" class="t h">FINITE PREFIX OF MATRIX FACTORS</text>
  <text x="400" y="132" text-anchor="middle" class="t m">one outcome-dependent map at each used time</text>

  <path d="M400 152 L400 178" fill="none" stroke="#A67C52"
        stroke-width="2.5" marker-end="url(#finiteProductLayersArrow)"/>

  <rect x="226" y="184" width="348" height="72" rx="12"
        fill="#F3E8E0" stroke="#A67C52" stroke-width="1.5"/>
  <text x="400" y="213" text-anchor="middle" class="t h">POINTWISE CHRONOLOGICAL PRODUCT</text>
  <text x="400" y="238" text-anchor="middle" class="t m">finite semiring algebra, including empty dimension</text>

  <rect x="24" y="184" width="166" height="72" rx="12"
        fill="#FBF9F6" stroke="#C4B8A8" stroke-width="1.5"/>
  <text x="107" y="211" text-anchor="middle" class="t h">ALGEBRA</text>
  <text x="107" y="233" text-anchor="middle" class="t m">no measure needed</text>
  <path d="M192 220 L224 220" fill="none" stroke="#C4B8A8" stroke-width="2"/>

  <path d="M400 258 L400 284" fill="none" stroke="#A67C52"
        stroke-width="2.5" marker-end="url(#finiteProductLayersArrow)"/>

  <rect x="226" y="290" width="348" height="72" rx="12"
        fill="#16243A"/>
  <text x="400" y="319" text-anchor="middle" class="t h"
        style="fill:#FFFDF8">EXACT PREFIX MEASURABILITY</text>
  <text x="400" y="344" text-anchor="middle" class="t m"
        style="fill:#D9E1EA">certifies every factor that the product reads</text>

  <rect x="610" y="290" width="166" height="72" rx="12"
        fill="#FBF9F6" stroke="#4B6787" stroke-width="1.5"/>
  <text x="693" y="317" text-anchor="middle" class="t h">MEASURABILITY</text>
  <text x="693" y="339" text-anchor="middle" class="t m">complex matrices</text>
  <path d="M576 326 L608 326" fill="none" stroke="#4B6787" stroke-width="2"/>

  <path d="M400 364 L400 390" fill="none" stroke="#A67C52"
        stroke-width="2.5" marker-end="url(#finiteProductLayersArrow)"/>

  <rect x="226" y="396" width="348" height="72" rx="12"
        fill="#E8F0F7" stroke="#4B6787" stroke-width="1.5"/>
  <text x="400" y="425" text-anchor="middle" class="t h">RAW PUSHFORWARD LAW</text>
  <text x="400" y="450" text-anchor="middle" class="t m">chosen source measure stays explicit</text>

  <rect x="24" y="396" width="166" height="72" rx="12"
        fill="#FBF9F6" stroke="#C4B8A8" stroke-width="1.5"/>
  <text x="107" y="423" text-anchor="middle" class="t h">TRANSPORT</text>
  <text x="107" y="445" text-anchor="middle" class="t m">no hidden fallback</text>
  <path d="M192 432 L224 432" fill="none" stroke="#C4B8A8" stroke-width="2"/>

  <path d="M400 470 L400 496" fill="none" stroke="#A67C52"
        stroke-width="2.5" marker-end="url(#finiteProductLayersArrow)"/>

  <rect x="226" y="502" width="348" height="62" rx="12"
        fill="#EAF1E5" stroke="#6F8D5E" stroke-width="1.5"/>
  <text x="400" y="528" text-anchor="middle" class="t h">BUNDLED PROBABILITY LAW</text>
  <text x="400" y="550" text-anchor="middle" class="t m">same raw law plus mass-one evidence</text>

  <rect x="610" y="502" width="166" height="62" rx="12"
        fill="#FBF9F6" stroke="#6F8D5E" stroke-width="1.5"/>
  <text x="693" y="527" text-anchor="middle" class="t h">PROBABILITY</text>
  <text x="693" y="549" text-anchor="middle" class="t m">source mass is one</text>
  <path d="M576 533 L608 533" fill="none" stroke="#6F8D5E" stroke-width="2"/>

  <text x="24" y="587" class="t m">Not supplied: independence, stationarity, a cocycle, norm growth, logarithmic integrability, or asymptotic exponents.</text>
</svg>
