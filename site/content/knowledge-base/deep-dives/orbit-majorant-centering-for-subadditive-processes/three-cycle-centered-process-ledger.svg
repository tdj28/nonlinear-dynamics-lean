<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760"
     viewBox="0 0 1200 760" role="img"
     aria-labelledby="centerLedgerTitle centerLedgerDesc">
  <title id="centerLedgerTitle">Exact orbit-majorant and centered-process ledger on a uniform three-state cycle</title>
  <desc id="centerLedgerDesc">Three equally weighted states form a cycle with one-step process values nine, one, and two. The finite process X n equals its one-step orbit sum S n minus n times n minus one, so the centered residual Y n is minus n times n minus one. A horizon table lists the three state values from zero through four. At horizon three, S is twelve, X is six, and Y is minus six at every state. Their normalized identity is two equals minus two plus four. Finite discrete measurability and absolute means six for X and Y establish the concrete integrability ledger.</desc>
  <rect width="1200" height="760" fill="#F7F1E7"/>
  <style>
    .sans{font-family:Inter,Arial,Helvetica,sans-serif;fill:#16243A}
    .serif{font-family:Georgia,'Times New Roman',serif;fill:#16243A}
    .eyebrow{font-size:17px;font-weight:700;letter-spacing:1.5px;fill:#A45524}
    .title{font-size:31px;font-weight:700}
    .sub{font-size:17px;fill:#4D5B6B}
    .state{font-size:20px;font-weight:700}
    .label{font-size:14px;fill:#4D5B6B}
    .value{font-size:24px;font-weight:700}
    .th{font-size:14px;font-weight:700;fill:#FFFDF8}
    .td{font-size:16px}
    .badge{font-size:17px;font-weight:700}
    .small{font-size:14px;fill:#4D5B6B}
  </style>
  <defs>
    <marker id="threeCycleArrow" markerWidth="10" markerHeight="10"
            refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#A45524"/>
    </marker>
  </defs>

  <text x="60" y="48" class="sans eyebrow">EXACT FINITE ORBIT LEDGER</text>
  <text x="60" y="88" class="serif title">Subtract the additive route; expose the subadditive slack</text>
  <text x="60" y="118" class="sans sub">Uniform mass 1/3 · T moves clockwise · X(n) = S(n) − n(n − 1) · Y(n) = X(n) − S(n)</text>

  <path d="M325 222 H438" stroke="#A45524" stroke-width="4"
        fill="none" marker-end="url(#threeCycleArrow)"/>
  <path d="M638 222 H751" stroke="#A45524" stroke-width="4"
        fill="none" marker-end="url(#threeCycleArrow)"/>
  <path d="M903 287 C905 343 186 343 188 287" stroke="#A45524"
        stroke-width="4" fill="none" marker-end="url(#threeCycleArrow)"/>

  <g transform="translate(105 155)">
    <rect width="220" height="132" rx="18" fill="#E8F0F7" stroke="#416B91" stroke-width="2"/>
    <text x="20" y="34" class="sans state">state 0</text>
    <text x="20" y="65" class="sans label">one-step X₁</text>
    <text x="198" y="69" text-anchor="end" class="serif value">9</text>
    <text x="20" y="96" class="sans label">probability mass</text>
    <text x="198" y="100" text-anchor="end" class="serif value">1/3</text>
  </g>
  <g transform="translate(418 155)">
    <rect width="220" height="132" rx="18" fill="#FFFDF8" stroke="#6D7F91" stroke-width="2"/>
    <text x="20" y="34" class="sans state">state 1</text>
    <text x="20" y="65" class="sans label">one-step X₁</text>
    <text x="198" y="69" text-anchor="end" class="serif value">1</text>
    <text x="20" y="96" class="sans label">probability mass</text>
    <text x="198" y="100" text-anchor="end" class="serif value">1/3</text>
  </g>
  <g transform="translate(731 155)">
    <rect width="220" height="132" rx="18" fill="#E8F0F7" stroke="#416B91" stroke-width="2"/>
    <text x="20" y="34" class="sans state">state 2</text>
    <text x="20" y="65" class="sans label">one-step X₁</text>
    <text x="198" y="69" text-anchor="end" class="serif value">2</text>
    <text x="20" y="96" class="sans label">probability mass</text>
    <text x="198" y="100" text-anchor="end" class="serif value">1/3</text>
  </g>
  <rect x="990" y="166" width="150" height="110" rx="18" fill="#16243A"/>
  <text x="1065" y="198" text-anchor="middle" class="sans th">one-step mean</text>
  <text x="1065" y="235" text-anchor="middle" class="serif value" style="fill:#FFFDF8">4</text>
  <text x="1065" y="258" text-anchor="middle" class="sans small" style="fill:#D9E1EA">finite + discrete</text>

  <text x="60" y="380" class="sans state">Every row is an exact three-state function</text>
  <text x="60" y="406" class="sans small">S(n) is the one-step orbit majorant; X(n) subtracts n(n − 1); Y(n) is the centered residual.</text>

  <rect x="60" y="430" width="820" height="44" rx="10" fill="#16243A"/>
  <text x="105" y="458" text-anchor="middle" class="sans th">n</text>
  <text x="290" y="458" text-anchor="middle" class="sans th">S(n) at states 0,1,2</text>
  <text x="550" y="458" text-anchor="middle" class="sans th">X(n) at states 0,1,2</text>
  <text x="770" y="458" text-anchor="middle" class="sans th">Y(n) = X(n) − S(n)</text>
  <g class="sans td">
    <rect x="60" y="474" width="820" height="40" fill="#FFFDF8"/>
    <text x="105" y="500" text-anchor="middle">0</text><text x="290" y="500" text-anchor="middle">[0, 0, 0]</text><text x="550" y="500" text-anchor="middle">[0, 0, 0]</text><text x="770" y="500" text-anchor="middle">[0, 0, 0]</text>
    <rect x="60" y="514" width="820" height="40" fill="#EEF3F6"/>
    <text x="105" y="540" text-anchor="middle">1</text><text x="290" y="540" text-anchor="middle">[9, 1, 2]</text><text x="550" y="540" text-anchor="middle">[9, 1, 2]</text><text x="770" y="540" text-anchor="middle">[0, 0, 0]</text>
    <rect x="60" y="554" width="820" height="40" fill="#FFFDF8"/>
    <text x="105" y="580" text-anchor="middle">2</text><text x="290" y="580" text-anchor="middle">[10, 3, 11]</text><text x="550" y="580" text-anchor="middle">[8, 1, 9]</text><text x="770" y="580" text-anchor="middle">[−2, −2, −2]</text>
    <rect x="60" y="594" width="820" height="40" fill="#EAF1E5"/>
    <text x="105" y="620" text-anchor="middle">3</text><text x="290" y="620" text-anchor="middle">[12, 12, 12]</text><text x="550" y="620" text-anchor="middle">[6, 6, 6]</text><text x="770" y="620" text-anchor="middle">[−6, −6, −6]</text>
    <rect x="60" y="634" width="820" height="40" fill="#FFFDF8"/>
    <text x="105" y="660" text-anchor="middle">4</text><text x="290" y="660" text-anchor="middle">[21, 13, 14]</text><text x="550" y="660" text-anchor="middle">[9, 1, 2]</text><text x="770" y="660" text-anchor="middle">[−12, −12, −12]</text>
  </g>

  <g transform="translate(915 420)">
    <rect width="225" height="118" rx="18" fill="#F3E8E0" stroke="#A45524" stroke-width="2"/>
    <text x="112" y="29" text-anchor="middle" class="sans th" style="fill:#A45524">HORIZON 3 SPLIT</text>
    <text x="112" y="65" text-anchor="middle" class="serif value">2 = −2 + 4</text>
    <text x="112" y="91" text-anchor="middle" class="sans small">X₃/3 = Y₃/3 + S₃/3</text>
  </g>
  <g transform="translate(915 558)">
    <rect width="225" height="116" rx="18" fill="#E8F0F7" stroke="#416B91" stroke-width="2"/>
    <text x="112" y="29" text-anchor="middle" class="sans th" style="fill:#416B91">FINITE ANALYTIC LEDGER</text>
    <text x="18" y="58" class="sans small">mean |X₃|</text><text x="205" y="60" text-anchor="end" class="serif value">6</text>
    <text x="18" y="91" class="sans small">mean |Y₃|</text><text x="205" y="93" text-anchor="end" class="serif value">6</text>
  </g>

  <text x="60" y="711" class="sans small">On a finite discrete probability space, every displayed function is measurable and each finite absolute mean proves integrability.</text>
  <text x="60" y="737" class="sans small">The normalized equality is finite algebra. It asserts no convergence, ergodicity, or mean-zero property.</text>
</svg>
