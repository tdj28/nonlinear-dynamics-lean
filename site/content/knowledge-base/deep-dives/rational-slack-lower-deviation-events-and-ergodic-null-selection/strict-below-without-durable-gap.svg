<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360" role="img" aria-labelledby="gapTitle gapDesc">
  <title id="gapTitle">Strictly below the target without a durable gap</title>
  <desc id="gapDesc">The upper lane approaches the target from below and eventually leaves every fixed lower band, so it is rejected. The lower lane returns to one fixed lower band arbitrarily late, so it has a durable margin.</desc>
  <rect width="760" height="360" fill="#F7F4F0"/>
  <style>
    .t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#2C2924}.title{font-size:15px;font-weight:700}.h{font-size:13px;font-weight:700}.s{font-size:12px}.m{font-size:11px;fill:#5A544C}.target{stroke:#4B6787;stroke-width:2}.margin{stroke:#A67C52;stroke-width:1.5;stroke-dasharray:6 5}.approach{fill:#F3E8E0;stroke:#A67C52;stroke-width:1.5}.durable{fill:#EAF1E5;stroke:#6F8D5E;stroke-width:1.5}.lane{fill:#FBF9F6;stroke:#C4B8A8;stroke-width:1.5}.footer{fill:#EAF1E5;stroke:#6F8D5E;stroke-width:1.5}
  </style>
  <text x="24" y="28" class="t title">Strict at every time can still miss strict lower deviation</text>
  <text x="24" y="48" class="t m">The decisive question is whether one lower band keeps receiving late visits.</text>
  <rect x="24" y="68" width="712" height="105" rx="12" class="lane"/>
  <text x="42" y="92" class="t h">Gap closes: rejected</text>
  <line x1="214" y1="96" x2="696" y2="96" class="target"/>
  <text x="620" y="88" class="t m">target</text>
  <line x1="214" y1="145" x2="696" y2="145" class="margin"/>
  <text x="604" y="160" class="t m">fixed lower band</text>
  <circle cx="250" cy="145" r="7" class="approach"/>
  <circle cx="324" cy="132" r="7" class="approach"/>
  <circle cx="398" cy="120" r="7" class="approach"/>
  <circle cx="472" cy="112" r="7" class="approach"/>
  <circle cx="546" cy="106" r="7" class="approach"/>
  <circle cx="620" cy="102" r="7" class="approach"/>
  <rect x="24" y="187" width="712" height="105" rx="12" class="lane"/>
  <text x="42" y="211" class="t h">Gap persists: accepted</text>
  <line x1="214" y1="215" x2="696" y2="215" class="target"/>
  <text x="620" y="207" class="t m">target</text>
  <line x1="214" y1="264" x2="696" y2="264" class="margin"/>
  <text x="568" y="248" class="t m">fixed lower band</text>
  <circle cx="250" cy="269" r="7" class="durable"/>
  <circle cx="324" cy="237" r="6" class="approach"/>
  <circle cx="398" cy="270" r="7" class="durable"/>
  <circle cx="472" cy="242" r="6" class="approach"/>
  <circle cx="546" cy="271" r="7" class="durable"/>
  <circle cx="620" cy="270" r="7" class="durable"/>
  <rect x="24" y="310" width="712" height="34" rx="9" class="footer"/>
  <text x="72" y="332" class="t s">Rational slack records one durable band, not merely repeated strictness at the target.</text>
</svg>
