<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900"
     viewBox="0 0 1440 900" role="img"
     aria-labelledby="no-slack-boundary-title no-slack-boundary-desc">
  <title id="no-slack-boundary-title">One witness, same-target recurrence, and durable rational slack</title>
  <desc id="no-slack-boundary-desc">A transient sequence is zero at times zero and one and minus one thereafter. At target minus two fifths, only time two is bad, so one finite witness does not recur. At target zero, every time from two onward is strictly below the target, but the normalized values minus one over n rise to zero. For the fixed margin minus one tenth, only times two through nine work and equality occurs at time ten. The main process instead remains below minus three halves from time five onward.</desc>
  <defs>
    <style>
      .title { font: 700 38px Georgia, serif; fill: #16283a; }
      .subtitle { font: 20px Arial, sans-serif; fill: #516172; }
      .panelTitle { font: 700 24px Arial, sans-serif; fill: #203c54; }
      .label { font: 18px Arial, sans-serif; fill: #263746; }
      .small { font: 16px Arial, sans-serif; fill: #526170; }
      .math { font: 21px Georgia, serif; fill: #172d40; }
      .mathStrong { font: 700 24px Georgia, serif; fill: #172d40; }
      .head { font: 700 16px Arial, sans-serif; fill: #fffaf0; }
      .cell { font: 16px Arial, sans-serif; fill: #243746; }
      .good { font: 700 17px Arial, sans-serif; fill: #45683c; }
      .bad { font: 700 17px Arial, sans-serif; fill: #8d3e32; }
    </style>
  </defs>

  <rect width="1440" height="900" fill="#f6f0e4"/>
  <rect width="1440" height="18" fill="#1f3f58"/>
  <text x="66" y="66" class="title">Three quantifier patterns that look similar but are not</text>
  <text x="66" y="101" class="subtitle">Transient boundary: W(0)=W(1)=0 and W(n)=−1 for every n≥2</text>

  <rect x="52" y="136" width="1336" height="386" rx="20"
        fill="#fffaf0" stroke="#c8b89e" stroke-width="2"/>
  <text x="80" y="178" class="panelTitle">1 · Exact normalized values</text>
  <rect x="80" y="208" width="1280" height="42" rx="8" fill="#315a70"/>
  <text x="110" y="235" class="head">n</text>
  <text x="220" y="235" class="head">W(n)</text>
  <text x="350" y="235" class="head">W(n)/n</text>
  <text x="520" y="235" class="head">below target 0?</text>
  <text x="740" y="235" class="head">below fixed q=−1/10?</text>
  <text x="1030" y="235" class="head">interpretation</text>
  <g class="cell">
    <rect x="80" y="251" width="1280" height="42" fill="#f2eadb"/>
    <text x="115" y="279">2</text><text x="218" y="279">−1</text><text x="348" y="279">−1/2</text><text x="565" y="279" class="good">yes</text><text x="815" y="279" class="good">yes</text><text x="1020" y="279">the sole c=−2/5 witness</text>
    <rect x="80" y="293" width="1280" height="42" fill="#fffaf0"/>
    <text x="115" y="321">3</text><text x="218" y="321">−1</text><text x="348" y="321">−1/3</text><text x="565" y="321" class="good">yes</text><text x="815" y="321" class="good">yes</text><text x="1020" y="321">already above −2/5</text>
    <rect x="80" y="335" width="1280" height="42" fill="#f2eadb"/>
    <text x="115" y="363">5</text><text x="218" y="363">−1</text><text x="348" y="363">−1/5</text><text x="565" y="363" class="good">yes</text><text x="815" y="363" class="good">yes</text><text x="1020" y="363">the fixed gap is shrinking</text>
    <rect x="80" y="377" width="1280" height="42" fill="#fffaf0"/>
    <text x="115" y="405">9</text><text x="218" y="405">−1</text><text x="348" y="405">−1/9</text><text x="565" y="405" class="good">yes</text><text x="815" y="405" class="good">yes</text><text x="1020" y="405">last q=−1/10 witness</text>
    <rect x="80" y="419" width="1280" height="42" fill="#f1dfcf"/>
    <text x="108" y="447">10</text><text x="218" y="447">−1</text><text x="340" y="447">−1/10</text><text x="565" y="447" class="good">yes</text><text x="800" y="447" class="bad">equal, not strict</text><text x="1020" y="447">fixed margin has expired</text>
    <rect x="80" y="461" width="1280" height="42" fill="#fffaf0"/>
    <text x="108" y="489">20</text><text x="218" y="489">−1</text><text x="340" y="489">−1/20</text><text x="565" y="489" class="good">yes</text><text x="823" y="489" class="bad">no</text><text x="1020" y="489">the slope is returning to zero</text>
  </g>

  <rect x="52" y="552" width="420" height="276" rx="20"
        fill="#fffaf0" stroke="#c8b89e" stroke-width="2"/>
  <text x="80" y="594" class="panelTitle">2 · One witness</text>
  <text x="80" y="636" class="mathStrong">target c=−2/5</text>
  <text x="80" y="678" class="label">Only n=2 satisfies W(n)&lt;cn.</text>
  <text x="80" y="713" class="label">The once-bad event accepts it.</text>
  <text x="80" y="753" class="bad">No arbitrarily-late recurrence</text>
  <text x="80" y="790" class="small">A finite accident is not an asymptotic slope.</text>

  <rect x="500" y="552" width="420" height="276" rx="20"
        fill="#fffaf0" stroke="#c8b89e" stroke-width="2"/>
  <text x="528" y="594" class="panelTitle">3 · No durable slack</text>
  <text x="528" y="636" class="mathStrong">target c=0</text>
  <text x="528" y="678" class="label">Every n≥2 satisfies W(n)&lt;0.</text>
  <text x="528" y="713" class="label">But W(n)/n=−1/n tends to 0.</text>
  <text x="528" y="753" class="bad">No fixed rational q&lt;0 survives</text>
  <text x="528" y="790" class="small">Same-target recurrence does not prove strict deviation.</text>

  <rect x="948" y="552" width="440" height="276" rx="20"
        fill="#edf1e7" stroke="#7d986e" stroke-width="2"/>
  <text x="976" y="594" class="panelTitle">4 · Durable rational slack</text>
  <text x="976" y="636" class="mathStrong">main model: q=−3/2</text>
  <text x="976" y="678" class="label">Every n≥5 is a strict witness at a.</text>
  <text x="976" y="713" class="label">So every requested cutoff is met.</text>
  <text x="976" y="753" class="good">One fixed q works forever</text>
  <text x="976" y="790" class="small">The fixed-slope arbitrarily-late event A<tspan baseline-shift="sub" font-size="12">q</tspan>.</text>
  <text x="66" y="870" class="small">These are exact toy sequences. Strict threshold conventions explain the equality row at n=10.</text>
</svg>
