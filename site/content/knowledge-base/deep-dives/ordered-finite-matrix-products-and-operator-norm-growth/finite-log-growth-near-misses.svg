<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780"
     viewBox="0 0 1200 780" role="img"
     aria-labelledby="finiteLogTitle finiteLogDesc">
  <title id="finiteLogTitle">Order and factor-count normalization in a finite logarithmic growth ledger</title>
  <desc id="finiteLogDesc">For a two-update history, the correct chronological product has norm two and the finite logarithmic diagnostic is log two divided by two. Reversing the product changes the norm to three and gives log three divided by two. Dividing by the last factor index uses one instead of the factor count two and gives log two, twice the intended value; the same mistake divides by zero at horizon one. None of the three fixed-horizon quantities is a Lyapunov exponent.</desc>
  <rect width="1200" height="780" fill="#F7F1E7"/>
  <style>
    .ink{fill:#17283F;font-family:Inter,Arial,Helvetica,sans-serif}
    .title{font-size:30px;font-weight:700}
    .sub{font-size:18px;fill:#536172}
    .head{font-size:18px;font-weight:700;letter-spacing:.5px}
    .body{font-size:18px}
    .small{font-size:15px;fill:#536172}
    .math{font-family:"STIX Two Text","Times New Roman",serif;font-size:25px}
    .panel{fill:#FFFDF8;stroke:#C9BBA7;stroke-width:2}
    .blue{fill:#E7F0F7;stroke:#527394;stroke-width:2}
    .green{fill:#E8F2E3;stroke:#6C8A5B;stroke-width:2}
    .clay{fill:#F5E5DA;stroke:#B36B3D;stroke-width:2}
    .line{stroke:#6D7887;stroke-width:2}
    .arrow{fill:none;stroke:#B36B3D;stroke-width:3}
  </style>
  <defs>
    <marker id="logArrow" markerWidth="10" markerHeight="10" refX="9" refY="5"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#B36B3D"/>
    </marker>
  </defs>

  <text x="54" y="54" class="ink title">A finite logarithm has two inputs: the correct norm and the factor count</text>
  <text x="54" y="84" class="ink sub">At horizon 2 there are two factors, indexed 0 and 1. The final index is not the number of updates.</text>

  <rect x="48" y="118" width="1104" height="126" rx="18" class="panel"/>
  <text x="76" y="154" class="ink head">TIME LEDGER</text>
  <line x1="260" y1="188" x2="984" y2="188" class="line"/>
  <circle cx="408" cy="188" r="22" fill="#527394"/>
  <circle cx="804" cy="188" r="22" fill="#315F55"/>
  <text x="402" y="195" fill="#FFFDF8" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700">0</text>
  <text x="798" y="195" fill="#FFFDF8" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700">1</text>
  <text x="358" y="225" class="ink small">first factor A0</text>
  <text x="748" y="225" class="ink small">second factor A1</text>
  <text x="76" y="198" class="ink body">horizon 2</text>
  <text x="994" y="198" class="ink body">2 updates</text>

  <rect x="48" y="278" width="342" height="326" rx="18" class="green"/>
  <text x="76" y="316" class="ink head">CORRECT FINITE LEDGER</text>
  <text x="76" y="356" class="ink body">order: A1 A0</text>
  <text x="76" y="390" class="ink body">product norm: 2</text>
  <text x="76" y="424" class="ink body">divisor: 2 updates</text>
  <rect x="76" y="452" width="286" height="92" rx="12" class="panel"/>
  <text x="101" y="491" class="ink math">g₂ = log(2) / 2</text>
  <text x="101" y="523" class="ink small">one fixed-horizon diagnostic</text>
  <text x="76" y="580" class="ink small">uses the matrix generated by the recurrence</text>

  <rect x="429" y="278" width="342" height="326" rx="18" class="blue"/>
  <text x="457" y="316" class="ink head">REVERSED-ORDER NEAR-MISS</text>
  <text x="457" y="356" class="ink body">order: A0 A1</text>
  <text x="457" y="390" class="ink body">product norm: 3</text>
  <text x="457" y="424" class="ink body">divisor: 2 updates</text>
  <rect x="457" y="452" width="286" height="92" rx="12" class="panel"/>
  <text x="482" y="491" class="ink math">g̃₂ = log(3) / 2</text>
  <text x="482" y="523" class="ink small">different input, different number</text>
  <text x="457" y="580" class="ink small">normalization is right; chronology is wrong</text>

  <rect x="810" y="278" width="342" height="326" rx="18" class="clay"/>
  <text x="838" y="316" class="ink head">LAST-INDEX NEAR-MISS</text>
  <text x="838" y="356" class="ink body">order: A1 A0</text>
  <text x="838" y="390" class="ink body">product norm: 2</text>
  <text x="838" y="424" class="ink body">wrong divisor: 2 − 1 = 1</text>
  <rect x="838" y="452" width="286" height="92" rx="12" class="panel"/>
  <text x="863" y="491" class="ink math">ĝ₂ = log(2) / 1</text>
  <text x="863" y="523" class="ink small">twice the correct finite value</text>
  <text x="838" y="580" class="ink small">at horizon 1 this would divide by zero</text>

  <path d="M400 622 L400 652" class="arrow" marker-end="url(#logArrow)"/>
  <path d="M600 622 L600 652" class="arrow" marker-end="url(#logArrow)"/>
  <path d="M800 622 L800 652" class="arrow" marker-end="url(#logArrow)"/>

  <rect x="48" y="660" width="1104" height="78" rx="16" class="clay"/>
  <text x="76" y="694" class="ink head">BOUNDARY</text>
  <text x="204" y="694" class="ink body">All three use the fixed horizon k = 2.</text>
  <text x="555" y="694" class="ink body">No limit, almost-sure claim, splitting, or exponent.</text>
  <text x="76" y="722" class="ink small">FiniteProducts.lean defines the ordered product and proves upper bounds; it contains no logarithm declaration.</text>
</svg>
