<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="scope-title scope-desc">
  <title id="scope-title">Log-positive and signed logarithmic growth separate under contraction and collapse</title>
  <desc id="scope-desc">A three-row comparison shows expansion retained by both observables, constant contraction producing a negative signed rate but zero log-positive rate, and zero products producing negative infinity in extended signed growth but zero in log-positive growth.</desc>
  <rect width="1200" height="700" fill="#F7F4F0"/>
  <text x="70" y="62" fill="#A67C52" font-family="Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="1.5">OBSERVABLE SCOPE</text>
  <text x="70" y="105" fill="#16243A" font-family="Georgia, serif" font-size="32" font-weight="700">Expansion agrees; contraction and collapse separate</text>

  <rect x="70" y="145" width="1060" height="72" rx="14" fill="#16243A"/>
  <text x="115" y="189" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="17" font-weight="700">PRODUCT REGIME</text>
  <text x="500" y="189" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="17" font-weight="700">SIGNED NORMALIZED LOG</text>
  <text x="875" y="189" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="16" font-weight="700">LOG-POSITIVE NORMALIZATION</text>

  <rect x="70" y="235" width="1060" height="115" rx="14" fill="#EAF1E5" stroke="#6F8D5E" stroke-width="2"/>
  <circle cx="115" cy="292" r="23" fill="#315F55"/>
  <text x="115" y="300" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="24" font-weight="700">+</text>
  <text x="160" y="278" fill="#16243A" font-family="Arial, sans-serif" font-size="18" font-weight="700">EXPANSION</text>
  <text x="160" y="310" fill="#4D5B6B" font-family="Arial, sans-serif" font-size="16">C(n) = a^n I, a above 1</text>
  <text x="500" y="299" fill="#315F55" font-family="Georgia, serif" font-size="23" font-weight="700">log a</text>
  <text x="875" y="299" fill="#315F55" font-family="Georgia, serif" font-size="23" font-weight="700">log a</text>

  <rect x="70" y="370" width="1060" height="115" rx="14" fill="#F3E8E0" stroke="#A67C52" stroke-width="2"/>
  <circle cx="115" cy="427" r="23" fill="#8B3E33"/>
  <text x="115" y="435" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="24" font-weight="700">-</text>
  <text x="160" y="413" fill="#16243A" font-family="Arial, sans-serif" font-size="18" font-weight="700">CONTRACTION</text>
  <text x="160" y="445" fill="#4D5B6B" font-family="Arial, sans-serif" font-size="16">C(n) = a^n I, a between 0 and 1</text>
  <text x="500" y="434" fill="#8B3E33" font-family="Georgia, serif" font-size="21" font-weight="700">log a (negative)</text>
  <text x="875" y="434" fill="#8B3E33" font-family="Georgia, serif" font-size="23" font-weight="700">zero</text>

  <rect x="70" y="505" width="1060" height="115" rx="14" fill="#FBF9F6" stroke="#8B3E33" stroke-width="3" stroke-dasharray="10 7"/>
  <circle cx="115" cy="562" r="23" fill="#16243A"/>
  <text x="115" y="569" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="18" font-weight="700">0</text>
  <text x="160" y="548" fill="#16243A" font-family="Arial, sans-serif" font-size="18" font-weight="700">SINGULAR COLLAPSE</text>
  <text x="160" y="580" fill="#4D5B6B" font-family="Arial, sans-serif" font-size="16">C(n) becomes the zero matrix</text>
  <text x="500" y="569" fill="#8B3E33" font-family="Georgia, serif" font-size="22" font-weight="700">minus infinity</text>
  <text x="875" y="569" fill="#8B3E33" font-family="Georgia, serif" font-size="23" font-weight="700">zero</text>

  <text x="70" y="665" fill="#5A544C" font-family="Arial, sans-serif" font-size="16">Milestone 33 proves convergence only in the right column.</text>
</svg>
