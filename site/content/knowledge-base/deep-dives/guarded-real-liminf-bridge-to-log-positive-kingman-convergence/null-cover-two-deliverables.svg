<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="null-cover-title null-cover-desc">
  <title id="null-cover-title">One countable null cover produces two deliverables</title>
  <desc id="null-cover-desc">The countable union of rational lower-deviation events has measure zero. Its complement feeds one branch that excludes strict lower-liminf deviation and another that turns absence of frequent crossing below q into an eventual lower bound q. The branches reunite as a guarded almost-everywhere theorem.</desc>
  <defs>
    <marker id="null-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8B3E33"/>
    </marker>
  </defs>
  <rect width="1200" height="680" fill="#F7F4F0"/>
  <text x="70" y="62" fill="#A67C52" font-family="Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="1.5">COUNTABLE EXHAUSTION</text>
  <text x="70" y="105" fill="#16243A" font-family="Georgia, serif" font-size="32" font-weight="700">Nullity carries both a number and a witness</text>

  <rect x="355" y="145" width="490" height="120" rx="18" fill="#16243A"/>
  <text x="600" y="185" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="18" font-weight="700">R(delta): UNION OF RATIONAL EVENTS D(c)</text>
  <text x="600" y="221" text-anchor="middle" fill="#E8F0F7" font-family="Arial, sans-serif" font-size="16">each c is rational and lies below delta</text>
  <text x="600" y="247" text-anchor="middle" fill="#AFC7DA" font-family="Arial, sans-serif" font-size="16">measure of R(delta) is zero</text>

  <path d="M 530 265 C 500 315, 405 315, 355 350" fill="none" stroke="#8B3E33" stroke-width="4" marker-end="url(#null-arrow)"/>
  <path d="M 670 265 C 700 315, 795 315, 845 350" fill="none" stroke="#8B3E33" stroke-width="4" marker-end="url(#null-arrow)"/>

  <rect x="95" y="360" width="450" height="190" rx="18" fill="#E8F0F7" stroke="#4B6787" stroke-width="2"/>
  <circle cx="133" cy="398" r="21" fill="#284E72"/>
  <text x="133" y="405" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="20" font-weight="700">A</text>
  <text x="170" y="405" fill="#284E72" font-family="Arial, sans-serif" font-size="18" font-weight="700">NUMERICAL OUTPUT</text>
  <text x="130" y="450" fill="#4D5B6B" font-family="Arial, sans-serif" font-size="16">low-liminf exceptional set is inside R(delta)</text>
  <text x="130" y="484" fill="#4D5B6B" font-family="Arial, sans-serif" font-size="16">outside R(delta): delta is at most real liminf</text>
  <text x="130" y="520" fill="#8B3E33" font-family="Arial, sans-serif" font-size="15" font-weight="700">Not enough by itself</text>

  <rect x="655" y="360" width="450" height="190" rx="18" fill="#EAF1E5" stroke="#6F8D5E" stroke-width="2"/>
  <circle cx="693" cy="398" r="21" fill="#315F55"/>
  <text x="693" y="405" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="20" font-weight="700">B</text>
  <text x="730" y="405" fill="#315F55" font-family="Arial, sans-serif" font-size="18" font-weight="700">SEMANTIC OUTPUT</text>
  <text x="690" y="450" fill="#4D5B6B" font-family="Arial, sans-serif" font-size="16">no frequent crossing below one fixed q</text>
  <text x="690" y="484" fill="#4D5B6B" font-family="Arial, sans-serif" font-size="16">eventually every normalized value is at least q</text>
  <text x="690" y="520" fill="#315F55" font-family="Arial, sans-serif" font-size="15" font-weight="700">Actual lower-bound witness</text>

  <path d="M 420 550 C 465 590, 520 595, 555 604" fill="none" stroke="#4B6787" stroke-width="4" marker-end="url(#null-arrow)"/>
  <path d="M 780 550 C 735 590, 680 595, 645 604" fill="none" stroke="#6F8D5E" stroke-width="4" marker-end="url(#null-arrow)"/>
  <rect x="430" y="590" width="340" height="62" rx="31" fill="#8B3E33"/>
  <text x="600" y="617" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="16" font-weight="700">GUARDED LOWER ENDPOINT</text>
  <text x="600" y="640" text-anchor="middle" fill="#F7EDEA" font-family="Arial, sans-serif" font-size="14">return A and B on the same sample</text>
</svg>
