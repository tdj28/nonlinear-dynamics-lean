<svg xmlns="http://www.w3.org/2000/svg" width="760" height="390" viewBox="0 0 760 390" role="img" aria-labelledby="geomTitle geomDesc">
  <title id="geomTitle">Fixed-space projection and coboundary approximation</title>
  <desc id="geomDesc">A vector splits into a fixed projection and an orthogonal residual. A one-way subset arrow sends the residual region into the closure of the coboundary range, whose simple-generated part is drawn as a dense dotted region.</desc>
  <rect width="760" height="390" fill="#F7F4F0"/>
  <style>.t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#2C2924}.title{font-size:15px;font-weight:700}.h{font-size:13px;font-weight:700}.s{font-size:12px}.m{font-size:11px;fill:#5A544C}.fixed{fill:#E8F0F7;stroke:#4B6787;stroke-width:1.7}.orth{fill:#F3E8E0;stroke:#A67C52;stroke-width:1.7}.closure{fill:#EAF1E5;stroke:#6F8D5E;stroke-width:1.7}.simple{fill:#FBF9F6;stroke:#47633B;stroke-width:1.5;stroke-dasharray:5 4}.arrow{fill:none;stroke:#A67C52;stroke-width:2.3;marker-end:url(#gArrow)}</style>
  <defs><marker id="gArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#A67C52"/></marker></defs>
  <text x="24" y="28" class="t title">Projection separates what survives from what can be approximated away</text>
  <text x="24" y="48" class="t m">The checked closure statement is one-sided; the diagram never replaces inclusion by equality.</text>
  <rect x="40" y="82" width="306" height="220" rx="18" fill="#FBF9F6" stroke="#C4B8A8" stroke-width="1.5"/>
  <text x="58" y="108" class="t h">HILBERT DECOMPOSITION</text>
  <rect x="70" y="132" width="114" height="126" rx="12" class="fixed"/><text x="96" y="160" class="t h">fixed part</text><text x="83" y="188" class="t s">projected input</text><text x="88" y="216" class="t m">survives means</text>
  <rect x="202" y="132" width="114" height="126" rx="12" class="orth"/><text x="231" y="160" class="t h">residual</text><text x="223" y="188" class="t s">orthogonal</text><text x="217" y="216" class="t m">to fixed space</text>
  <text x="84" y="282" class="t s">input splits into fixed part and residual</text>
  <path d="M320 194 C368 194 378 194 420 194" class="arrow"/>
  <text x="349" y="178" class="t h">subset</text>
  <rect x="430" y="82" width="290" height="220" rx="18" class="closure"/>
  <text x="464" y="109" class="t h">CLOSURE OF COBOUNDARY RANGE</text>
  <text x="485" y="137" class="t s">all limits of one-step differences</text>
  <rect x="476" y="163" width="198" height="100" rx="14" class="simple"/>
  <text x="508" y="193" class="t h">SIMPLE COBOUNDARIES</text>
  <circle cx="518" cy="224" r="5" fill="#4B6787"/><circle cx="551" cy="237" r="5" fill="#4B6787"/><circle cx="589" cy="220" r="5" fill="#4B6787"/><circle cx="625" cy="239" r="5" fill="#4B6787"/>
  <text x="500" y="281" class="t m">dense enough to approach each residual</text>
  <rect x="24" y="326" width="712" height="46" rx="10" fill="#EAF1E5" stroke="#6F8D5E"/>
  <text x="74" y="346" class="t s">Keep the fixed projection. Approximate the orthogonal residual by simple coboundaries.</text>
  <text x="174" y="363" class="t m">This produces a dense fixed-plus-simple pointwise-good core.</text>
</svg>
