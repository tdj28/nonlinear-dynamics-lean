<svg xmlns="http://www.w3.org/2000/svg" width="760" height="350" viewBox="0 0 760 350" role="img" aria-labelledby="roadTitle roadDesc">
  <title id="roadTitle">Road from the dense core and maximal control to the pointwise theorem</title>
  <desc id="roadDesc">A dense pointwise-good core and an infinite weak maximal estimate enter a central unfinished closure bridge. The far side is the planned full finite-measure pointwise Birkhoff theorem for integrable observables.</desc>
  <rect width="760" height="350" fill="#F7F4F0"/>
  <style>.t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#2C2924}.title{font-size:15px;font-weight:700}.h{font-size:13px;font-weight:700}.s{font-size:12px}.m{font-size:11px;fill:#5A544C}.input{fill:#E8F0F7;stroke:#4B6787;stroke-width:1.6}.bridge{fill:#F3E8E0;stroke:#A67C52;stroke-width:1.7;stroke-dasharray:6 4}.goal{fill:#EAF1E5;stroke:#6F8D5E;stroke-width:1.7}.arrow{fill:none;stroke:#A67C52;stroke-width:2.3;marker-end:url(#rArrow)}</style>
  <defs><marker id="rArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#A67C52"/></marker></defs>
  <text x="24" y="28" class="t title">Two completed inputs, one unfinished closure bridge</text>
  <text x="24" y="48" class="t m">The far-side pointwise theorem is the Milestone 26 target, not a Milestone 25 result.</text>
  <rect x="42" y="84" width="210" height="78" rx="12" class="input"/><text x="76" y="113" class="t h">MILESTONE 25 DENSE CORE</text><text x="67" y="138" class="t s">full-sequence convergence on</text><text x="94" y="155" class="t m">special approximants</text>
  <rect x="42" y="198" width="210" height="78" rx="12" class="input"/><text x="67" y="227" class="t h">MILESTONE 24 WEAK CONTROL</text><text x="70" y="252" class="t s">bounds positive all-time</text><text x="101" y="269" class="t m">threshold events</text>
  <rect x="322" y="119" width="210" height="124" rx="14" class="bridge"/><text x="355" y="150" class="t h">MILESTONE 26 BRIDGE</text><text x="354" y="179" class="t s">absolute error control</text><text x="355" y="201" class="t s">oscillation or Cauchy sets</text><text x="365" y="224" class="t m">integrable-function closure</text>
  <path d="M252 123 C283 123 289 154 316 165" class="arrow"/><path d="M252 237 C283 237 289 208 316 198" class="arrow"/>
  <rect x="594" y="119" width="134" height="124" rx="14" class="goal"/><text x="621" y="150" class="t h">POINTWISE</text><text x="620" y="174" class="t h">BIRKHOFF</text><text x="614" y="202" class="t s">all integrable</text><text x="615" y="223" class="t m">finite measure</text>
  <path d="M532 181 L588 181" class="arrow"/>
  <rect x="24" y="302" width="712" height="30" rx="9" fill="#EAF1E5" stroke="#6F8D5E"/>
  <text x="82" y="322" class="t s">Density chooses a nearby good input; maximal control limits the worst all-time approximation error.</text>
</svg>
