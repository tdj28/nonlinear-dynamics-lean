<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="980"
     viewBox="0 0 1440 980" role="img"
     aria-labelledby="typewriter-ledger-title typewriter-ledger-desc">
  <title id="typewriter-ledger-title">Dyadic typewriter norm, full-sequence, and subsequence ledger</title>
  <desc id="typewriter-ledger-desc">Dyadic levels zero through four partition the unit interval into one, two, four, eight, and sixteen half-open cells. At level m each indicator has squared L2 norm two to the minus m. The point five eighths lies in the active cell at global indices one, three, six, thirteen, and twenty-six, so its full sequence keeps returning to one with zeros between. Selecting global indices one, two, four, eight, and sixteen chooses the leftmost intervals, which converge to zero for every positive point but remain one at the single null point zero.</desc>
  <defs>
    <style>
      .title { font: 700 38px Georgia, serif; fill: #16283a; }
      .subtitle { font: 20px Arial, sans-serif; fill: #516172; }
      .panelTitle { font: 700 24px Arial, sans-serif; fill: #203c54; }
      .label { font: 18px Arial, sans-serif; fill: #263746; }
      .small { font: 16px Arial, sans-serif; fill: #526170; }
      .math { font: 21px Georgia, serif; fill: #172d40; }
      .strong { font: 700 20px Arial, sans-serif; fill: #172d40; }
      .white { font: 700 17px Arial, sans-serif; fill: #fffaf0; }
      .mono { font: 17px "Courier New", monospace; fill: #243746; }
    </style>
  </defs>

  <rect width="1440" height="980" fill="#f6f0e4"/>
  <rect x="0" y="0" width="1440" height="18" fill="#1f3f58"/>
  <text x="68" y="68" class="title">Norm convergence does not control every pointwise index</text>
  <text x="68" y="101" class="subtitle">The dyadic typewriter is a diagnostic sequence—not a sequence of Birkhoff averages</text>

  <rect x="52" y="133" width="1336" height="482" rx="20" fill="#fffaf0" stroke="#c8b89e" stroke-width="2"/>
  <text x="80" y="174" class="panelTitle">1 · Shrinking support, but a fixed point is hit once at every level</text>
  <text x="80" y="207" class="small">q_(2^m+k) is the indicator of [k/2^m, (k+1)/2^m); the active cell below contains x = 5/8.</text>

  <rect x="80" y="231" width="1280" height="42" rx="8" fill="#315a70"/>
  <text x="96" y="258" class="white">level m</text>
  <text x="205" y="258" class="white">global hit n</text>
  <text x="355" y="258" class="white">partition of [0,1)</text>
  <text x="1121" y="258" class="white">||q_n||_2^2</text>
  <text x="1251" y="258" class="white">q_n(5/8)</text>

  <g>
    <text x="119" y="312" class="strong">0</text>
    <text x="249" y="312" class="strong">1</text>
    <rect x="355" y="286" width="700" height="36" fill="#c77342" stroke="#914522" stroke-width="2"/>
    <line x1="793" y1="281" x2="793" y2="327" stroke="#172d40" stroke-width="4"/>
    <text x="1139" y="312" class="math">1</text>
    <text x="1290" y="312" class="strong">1</text>

    <text x="119" y="371" class="strong">1</text>
    <text x="249" y="371" class="strong">3</text>
    <rect x="355" y="345" width="350" height="36" fill="#e8eee6" stroke="#82967c" stroke-width="2"/>
    <rect x="705" y="345" width="350" height="36" fill="#c77342" stroke="#914522" stroke-width="2"/>
    <line x1="793" y1="340" x2="793" y2="386" stroke="#172d40" stroke-width="4"/>
    <text x="1139" y="371" class="math">1/2</text>
    <text x="1290" y="371" class="strong">1</text>

    <text x="119" y="430" class="strong">2</text>
    <text x="249" y="430" class="strong">6</text>
    <rect x="355" y="404" width="175" height="36" fill="#e8eee6" stroke="#82967c" stroke-width="2"/>
    <rect x="530" y="404" width="175" height="36" fill="#e8eee6" stroke="#82967c" stroke-width="2"/>
    <rect x="705" y="404" width="175" height="36" fill="#c77342" stroke="#914522" stroke-width="2"/>
    <rect x="880" y="404" width="175" height="36" fill="#e8eee6" stroke="#82967c" stroke-width="2"/>
    <line x1="793" y1="399" x2="793" y2="445" stroke="#172d40" stroke-width="4"/>
    <text x="1139" y="430" class="math">1/4</text>
    <text x="1290" y="430" class="strong">1</text>

    <text x="119" y="489" class="strong">3</text>
    <text x="239" y="489" class="strong">13</text>
    <g stroke="#82967c" stroke-width="2">
      <rect x="355" y="463" width="87.5" height="36" fill="#e8eee6"/>
      <rect x="442.5" y="463" width="87.5" height="36" fill="#e8eee6"/>
      <rect x="530" y="463" width="87.5" height="36" fill="#e8eee6"/>
      <rect x="617.5" y="463" width="87.5" height="36" fill="#e8eee6"/>
      <rect x="705" y="463" width="87.5" height="36" fill="#e8eee6"/>
      <rect x="792.5" y="463" width="87.5" height="36" fill="#c77342" stroke="#914522"/>
      <rect x="880" y="463" width="87.5" height="36" fill="#e8eee6"/>
      <rect x="967.5" y="463" width="87.5" height="36" fill="#e8eee6"/>
    </g>
    <line x1="793" y1="458" x2="793" y2="504" stroke="#172d40" stroke-width="4"/>
    <text x="1139" y="489" class="math">1/8</text>
    <text x="1290" y="489" class="strong">1</text>

    <text x="119" y="548" class="strong">4</text>
    <text x="239" y="548" class="strong">26</text>
    <g stroke="#82967c" stroke-width="1.5">
      <rect x="355" y="522" width="43.75" height="36" fill="#e8eee6"/>
      <rect x="398.75" y="522" width="43.75" height="36" fill="#e8eee6"/>
      <rect x="442.5" y="522" width="43.75" height="36" fill="#e8eee6"/>
      <rect x="486.25" y="522" width="43.75" height="36" fill="#e8eee6"/>
      <rect x="530" y="522" width="43.75" height="36" fill="#e8eee6"/>
      <rect x="573.75" y="522" width="43.75" height="36" fill="#e8eee6"/>
      <rect x="617.5" y="522" width="43.75" height="36" fill="#e8eee6"/>
      <rect x="661.25" y="522" width="43.75" height="36" fill="#e8eee6"/>
      <rect x="705" y="522" width="43.75" height="36" fill="#e8eee6"/>
      <rect x="748.75" y="522" width="43.75" height="36" fill="#e8eee6"/>
      <rect x="792.5" y="522" width="43.75" height="36" fill="#c77342" stroke="#914522"/>
      <rect x="836.25" y="522" width="43.75" height="36" fill="#e8eee6"/>
      <rect x="880" y="522" width="43.75" height="36" fill="#e8eee6"/>
      <rect x="923.75" y="522" width="43.75" height="36" fill="#e8eee6"/>
      <rect x="967.5" y="522" width="43.75" height="36" fill="#e8eee6"/>
      <rect x="1011.25" y="522" width="43.75" height="36" fill="#e8eee6"/>
    </g>
    <line x1="793" y1="517" x2="793" y2="563" stroke="#172d40" stroke-width="4"/>
    <text x="1128" y="548" class="math">1/16</text>
    <text x="1290" y="548" class="strong">1</text>
  </g>

  <text x="355" y="590" class="small">0</text>
  <text x="770" y="590" class="small">x = 5/8</text>
  <text x="1044" y="590" class="small">1</text>

  <rect x="52" y="643" width="790" height="284" rx="20" fill="#fffaf0" stroke="#c8b89e" stroke-width="2"/>
  <text x="80" y="684" class="panelTitle">2 · Full sequence: zeros between infinitely many hits</text>
  <text x="80" y="719" class="math">hit indices at x = 5/8:  1, 3, 6, 13, 26, …</text>

  <g>
    <text x="88" y="770" class="small">n</text>
    <text x="88" y="815" class="small">q_n(5/8)</text>
    <line x1="173" y1="757" x2="795" y2="757" stroke="#9c8d79" stroke-width="2"/>
    <g class="small" text-anchor="middle">
      <text x="190" y="748">1</text><text x="230" y="748">2</text><text x="270" y="748">3</text>
      <text x="310" y="748">4</text><text x="350" y="748">5</text><text x="390" y="748">6</text>
      <text x="430" y="748">7</text><text x="470" y="748">8</text><text x="510" y="748">9</text>
      <text x="550" y="748">10</text><text x="590" y="748">11</text><text x="630" y="748">12</text>
      <text x="670" y="748">13</text><text x="710" y="748">14</text><text x="750" y="748">15</text>
    </g>
    <g text-anchor="middle" class="strong">
      <circle cx="190" cy="805" r="16" fill="#c77342"/><text x="190" y="812" fill="#fffaf0">1</text>
      <text x="230" y="812">0</text>
      <circle cx="270" cy="805" r="16" fill="#c77342"/><text x="270" y="812" fill="#fffaf0">1</text>
      <text x="310" y="812">0</text><text x="350" y="812">0</text>
      <circle cx="390" cy="805" r="16" fill="#c77342"/><text x="390" y="812" fill="#fffaf0">1</text>
      <text x="430" y="812">0</text><text x="470" y="812">0</text><text x="510" y="812">0</text>
      <text x="550" y="812">0</text><text x="590" y="812">0</text><text x="630" y="812">0</text>
      <circle cx="670" cy="805" r="16" fill="#c77342"/><text x="670" y="812" fill="#fffaf0">1</text>
      <text x="710" y="812">0</text><text x="750" y="812">0</text>
    </g>
  </g>
  <rect x="80" y="850" width="734" height="50" rx="10" fill="#f1dfcf"/>
  <text x="102" y="881" class="strong">Infinitely many 1s + infinitely many 0s ⇒ no pointwise limit.</text>

  <rect x="870" y="643" width="518" height="284" rx="20" fill="#fffaf0" stroke="#c8b89e" stroke-width="2"/>
  <text x="898" y="684" class="panelTitle">3 · One selected subsequence</text>
  <text x="898" y="719" class="math">choose n = 2^m: 1, 2, 4, 8, 16, …</text>
  <text x="898" y="754" class="label">These are the leftmost intervals [0,2^(-m)).</text>

  <rect x="898" y="780" width="462" height="54" rx="10" fill="#e7efe4"/>
  <text x="920" y="813" class="strong">At x = 5/8:  1, 0, 0, 0, 0, … → 0</text>
  <rect x="898" y="840" width="462" height="50" rx="10" fill="#f1dfcf"/>
  <text x="920" y="871" class="strong">At x = 0:     1, 1, 1, 1, 1, …</text>
  <text x="898" y="908" class="small">The singleton {0} has measure zero,</text>
  <text x="898" y="925" class="small">so this subsequence converges almost everywhere.</text>

  <rect x="52" y="946" width="1336" height="4" fill="#1f3f58"/>
  <text x="70" y="971" class="small">Conclusion: L2 norm → convergence in measure → some almost-everywhere subsequence; the full sequence needs another argument.</text>
</svg>
