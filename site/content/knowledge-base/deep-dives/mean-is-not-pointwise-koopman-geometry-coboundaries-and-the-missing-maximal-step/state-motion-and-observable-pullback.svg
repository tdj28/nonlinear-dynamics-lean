<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" role="img" aria-labelledby="stateTitle stateDesc">
  <title id="stateTitle">State motion and observable pullback</title>
  <desc id="stateDesc">A nonlinear state map moves a starting state to its updated state, while the Koopman operator turns an original observable into its pullback by composition. Both routes meet at the same reading.</desc>
  <rect width="760" height="330" fill="#F7F4F0"/>
  <style>
    .t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#2C2924}.title{font-size:15px;font-weight:700}.h{font-size:13px;font-weight:700}.s{font-size:12px}.m{font-size:11px;fill:#5A544C}.state{fill:#E8F0F7;stroke:#4B6787;stroke-width:1.6}.obs{fill:#F3E8E0;stroke:#A67C52;stroke-width:1.6}.meet{fill:#EAF1E5;stroke:#6F8D5E;stroke-width:1.6}.arrow{fill:none;stroke:#A67C52;stroke-width:2.2;marker-end:url(#arrow)}
  </style>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#A67C52"/></marker></defs>
  <text x="24" y="28" class="t title">Move states forward, pull observables back</text>
  <text x="24" y="48" class="t m">The induced operator is linear even when the state map is nonlinear.</text>
  <rect x="42" y="82" width="170" height="72" rx="12" class="state"/>
  <text x="104" y="112" class="t h">STATE</text><text x="89" y="136" class="t s">starting state</text>
  <rect x="292" y="82" width="170" height="72" rx="12" class="state"/>
  <text x="338" y="112" class="t h">FORWARD MAP</text><text x="339" y="136" class="t s">updated state</text>
  <path d="M212 118 L286 118" class="arrow"/><text x="218" y="104" class="t m">state update</text>
  <rect x="42" y="190" width="170" height="72" rx="12" class="obs"/>
  <text x="87" y="220" class="t h">OBSERVABLE</text><text x="70" y="244" class="t s">original reading rule</text>
  <rect x="292" y="190" width="170" height="72" rx="12" class="obs"/>
  <text x="320" y="220" class="t h">KOOPMAN PULLBACK</text><text x="318" y="244" class="t s">compose before reading</text>
  <path d="M212 226 L286 226" class="arrow"/><text x="225" y="212" class="t m">pull back</text>
  <rect x="548" y="119" width="170" height="108" rx="12" class="meet"/>
  <text x="586" y="151" class="t h">SAME READING</text><text x="586" y="180" class="t s">read after update</text><text x="570" y="204" class="t s">equals pulled-back read</text>
  <path d="M462 118 C505 118 511 150 542 158" class="arrow"/><path d="M462 226 C505 226 511 196 542 188" class="arrow"/>
  <rect x="24" y="286" width="712" height="28" rx="9" fill="#EAF1E5" stroke="#6F8D5E"/>
  <text x="74" y="305" class="t s">Linearity lives in observable space; no inverse of the state map is asserted.</text>
</svg>
