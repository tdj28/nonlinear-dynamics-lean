<svg xmlns="http://www.w3.org/2000/svg" width="760" height="410" viewBox="0 0 760 410" role="img" aria-labelledby="typeTitle typeDesc">
  <title id="typeTitle">Dyadic typewriter sequence</title>
  <desc id="typeDesc">Four levels divide a unit interval into smaller cells. One active cell moves across each level. Cell measure shrinks, but a fixed typical point belongs to one active cell at every level, so its indicator repeatedly returns to one.</desc>
  <rect width="760" height="410" fill="#F7F4F0"/>
  <style>.t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#2C2924}.title{font-size:15px;font-weight:700}.h{font-size:13px;font-weight:700}.s{font-size:12px}.m{font-size:11px;fill:#5A544C}.cell{fill:#FBF9F6;stroke:#C4B8A8;stroke-width:1.2}.hit{fill:#E8F0F7;stroke:#4B6787;stroke-width:1.6}.point{stroke:#A67C52;stroke-width:2.2;stroke-dasharray:5 4}</style>
  <text x="24" y="28" class="t title">Shrinking norm does not force the full pointwise sequence</text>
  <text x="24" y="48" class="t m">Intervals are enumerated level by level; blue is the current indicator support.</text>
  <text x="28" y="99" class="t h">level 0</text><rect x="120" y="76" width="560" height="34" rx="5" class="hit"/>
  <text x="28" y="153" class="t h">level 1</text><rect x="120" y="130" width="280" height="34" class="hit"/><rect x="400" y="130" width="280" height="34" class="cell"/>
  <text x="28" y="207" class="t h">level 2</text><rect x="120" y="184" width="140" height="34" class="cell"/><rect x="260" y="184" width="140" height="34" class="hit"/><rect x="400" y="184" width="140" height="34" class="cell"/><rect x="540" y="184" width="140" height="34" class="cell"/>
  <text x="28" y="261" class="t h">level 3</text><rect x="120" y="238" width="70" height="34" class="cell"/><rect x="190" y="238" width="70" height="34" class="cell"/><rect x="260" y="238" width="70" height="34" class="cell"/><rect x="330" y="238" width="70" height="34" class="hit"/><rect x="400" y="238" width="70" height="34" class="cell"/><rect x="470" y="238" width="70" height="34" class="cell"/><rect x="540" y="238" width="70" height="34" class="cell"/><rect x="610" y="238" width="70" height="34" class="cell"/>
  <line x1="365" y1="66" x2="365" y2="290" class="point"/><text x="374" y="291" class="t m">one typical point</text>
  <rect x="58" y="314" width="300" height="62" rx="11" fill="#EAF1E5" stroke="#6F8D5E"/>
  <text x="87" y="340" class="t h">NORM VIEW</text><text x="86" y="361" class="t s">active-cell measure shrinks to zero</text>
  <rect x="402" y="314" width="300" height="62" rx="11" fill="#F3E8E0" stroke="#A67C52"/>
  <text x="433" y="340" class="t h">POINTWISE VIEW</text><text x="431" y="361" class="t s">the point is hit once at every level</text>
  <text x="92" y="398" class="t m">Conceptual counterexample to a general inference, not a counterexample to Birkhoff's theorem.</text>
</svg>
