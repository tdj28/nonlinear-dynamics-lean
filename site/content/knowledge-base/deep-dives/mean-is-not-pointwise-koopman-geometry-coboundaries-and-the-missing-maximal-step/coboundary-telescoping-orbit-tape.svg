<svg xmlns="http://www.w3.org/2000/svg" width="760" height="350" viewBox="0 0 760 350" role="img" aria-labelledby="telTitle telDesc">
  <title id="telTitle">A forward coboundary sum telescopes to two endpoints</title>
  <desc id="telDesc">Four consecutive one-step differences display matching interior potential values in opposing roles. Matching copies cancel, leaving the final endpoint against the initial endpoint before division by the horizon.</desc>
  <rect width="760" height="350" fill="#F7F4F0"/>
  <style>.t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#2C2924}.title{font-size:15px;font-weight:700}.h{font-size:13px;font-weight:700}.s{font-size:12px}.m{font-size:11px;fill:#5A544C}.term{fill:#FBF9F6;stroke:#C4B8A8;stroke-width:1.4}.keep{fill:#EAF1E5;stroke:#6F8D5E;stroke-width:1.6}.cancel{fill:#EDE8E1;stroke:#7F786D;stroke-width:1.2}.line{stroke:#A67C52;stroke-width:2}</style>
  <text x="24" y="28" class="t title">The orbit sum keeps only two endpoints</text>
  <text x="24" y="48" class="t m">Forward coboundary convention: potential after one step minus potential now.</text>
  <rect x="30" y="88" width="160" height="70" rx="10" class="term"/><text x="50" y="112" class="t h">step zero</text><text x="62" y="134" class="t m">next value added</text><text x="52" y="150" class="t m">current value removed</text>
  <rect x="210" y="88" width="160" height="70" rx="10" class="term"/><text x="230" y="112" class="t h">next step</text><text x="242" y="134" class="t m">next value added</text><text x="232" y="150" class="t m">prior value removed</text>
  <rect x="390" y="88" width="160" height="70" rx="10" class="term"/><text x="410" y="112" class="t h">next step</text><text x="422" y="134" class="t m">next value added</text><text x="412" y="150" class="t m">prior value removed</text>
  <rect x="570" y="88" width="160" height="70" rx="10" class="term"/><text x="590" y="112" class="t h">last step</text><text x="602" y="134" class="t m">final value added</text><text x="592" y="150" class="t m">prior value removed</text>
  <line x1="139" y1="171" x2="264" y2="171" class="line"/><text x="151" y="190" class="t m">opposite copies cancel</text>
  <line x1="319" y1="205" x2="444" y2="205" class="line"/><text x="331" y="224" class="t m">opposite copies cancel</text>
  <rect x="92" y="248" width="230" height="56" rx="11" class="keep"/><text x="141" y="276" class="t h">INITIAL ENDPOINT</text><text x="155" y="295" class="t m">starting value removed</text>
  <rect x="438" y="248" width="230" height="56" rx="11" class="keep"/><text x="493" y="276" class="t h">FINAL ENDPOINT</text><text x="527" y="295" class="t m">final value added</text>
  <rect x="24" y="318" width="712" height="24" rx="8" fill="#EAF1E5" stroke="#6F8D5E"/>
  <text x="43" y="335" class="t s">Divide by a positive horizon: bounded endpoints force the average to zero. At horizon zero the identity is vacuous.</text>
</svg>
