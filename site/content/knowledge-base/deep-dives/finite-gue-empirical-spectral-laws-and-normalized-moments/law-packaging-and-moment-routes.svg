<svg xmlns="http://www.w3.org/2000/svg" width="760" height="455"
     viewBox="0 0 760 455" role="img"
     aria-labelledby="gueLawTitle gueLawDesc">
  <title id="gueLawTitle">Finite Gaussian unitary ensemble spectral laws and moments follow related but separate routes</title>
  <desc id="gueLawDesc">The intrinsic Hermitian Gaussian unitary ensemble law and the ambient matrix ensemble law lead to the same raw empirical spectral law. The raw law has a probability wrapper in every dimension, while a probability-valued version exists in positive dimension. Giry join produces a mean measure, but this chapter proves no interchange between its moments and expected sample moments. A separate route turns sample spectral moments into normalized traces and then exact finite expectations.</desc>
  <rect width="760" height="455" fill="#F7F4F0"/>
  <style>
    .t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#2C2924}
    .title{font-size:15px;font-weight:700}
    .h{font-size:12.5px;font-weight:700}
    .s{font-size:11.5px}
    .m{font-size:10.5px;fill:#5A544C}
    .blue{fill:#E8F0F7;stroke:#4B6787;stroke-width:1.5}
    .green{fill:#EAF1E5;stroke:#6F8D5E;stroke-width:1.5}
    .orange{fill:#F3E8E0;stroke:#A67C52;stroke-width:1.5}
    .paper{fill:#FBF9F6;stroke:#C4B8A8;stroke-width:1.5}
    .warning{fill:#F8E7DE;stroke:#B45D3A;stroke-width:1.5}
    .arrow{stroke:#A67C52;stroke-width:2;fill:none}
    .dash{stroke:#8F887E;stroke-width:1.5;stroke-dasharray:5 4;fill:none}
  </style>
  <defs>
    <marker id="gueLawArrow" markerWidth="8" markerHeight="8" refX="7" refY="4"
            orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#A67C52"/>
    </marker>
  </defs>

  <text x="24" y="28" class="t title">One formal slice, two routes: laws of measures and expected sample moments</text>
  <text x="24" y="48" class="t m">Transport connects the routes, but it does not identify every plausible integral.</text>

  <rect x="24" y="76" width="205" height="70" rx="11" class="blue"/>
  <text x="126.5" y="103" text-anchor="middle" class="t h">Intrinsic Hermitian ensemble law</text>
  <text x="126.5" y="126" text-anchor="middle" class="t s">Every sample is Hermitian by type</text>

  <rect x="24" y="168" width="205" height="70" rx="11" class="blue"/>
  <text x="126.5" y="195" text-anchor="middle" class="t h">Ambient matrix ensemble law</text>
  <text x="126.5" y="218" text-anchor="middle" class="t s">Hermitian almost everywhere</text>

  <path d="M229,111 L282,111" class="arrow" marker-end="url(#gueLawArrow)"/>
  <path d="M229,203 L258,203 L258,132 L282,132" class="dash" marker-end="url(#gueLawArrow)"/>

  <rect x="286" y="82" width="202" height="84" rx="12" class="orange"/>
  <text x="387" y="108" text-anchor="middle" class="t h">Same raw spectral law</text>
  <text x="387" y="130" text-anchor="middle" class="t s">A probability law on measures</text>
  <text x="387" y="149" text-anchor="middle" class="t m">Defined even in empty dimension</text>

  <path d="M488,112 L533,112" class="arrow" marker-end="url(#gueLawArrow)"/>
  <path d="M387,166 L387,207" class="arrow" marker-end="url(#gueLawArrow)"/>

  <rect x="537" y="76" width="199" height="92" rx="12" class="green"/>
  <text x="636.5" y="102" text-anchor="middle" class="t h">Probability packaging</text>
  <text x="636.5" y="124" text-anchor="middle" class="t s">Raw outcomes in every dimension</text>
  <text x="636.5" y="145" text-anchor="middle" class="t s">Bundled outcomes in positive size</text>

  <rect x="286" y="211" width="202" height="75" rx="12" class="paper"/>
  <text x="387" y="238" text-anchor="middle" class="t h">Mean measure by Giry join</text>
  <text x="387" y="261" text-anchor="middle" class="t s">Average the measure-valued outcomes</text>

  <rect x="537" y="211" width="199" height="75" rx="12" class="warning"/>
  <text x="636.5" y="237" text-anchor="middle" class="t h">Important boundary</text>
  <text x="636.5" y="259" text-anchor="middle" class="t s">No moment interchange is proved</text>
  <path d="M488,249 L533,249" class="dash" marker-end="url(#gueLawArrow)"/>

  <rect x="24" y="323" width="205" height="75" rx="12" class="green"/>
  <text x="126.5" y="349" text-anchor="middle" class="t h">Sample spectral moments</text>
  <text x="126.5" y="372" text-anchor="middle" class="t s">First and second powers</text>

  <path d="M229,360 L282,360" class="arrow" marker-end="url(#gueLawArrow)"/>

  <rect x="286" y="323" width="202" height="75" rx="12" class="blue"/>
  <text x="387" y="349" text-anchor="middle" class="t h">Normalized trace identities</text>
  <text x="387" y="372" text-anchor="middle" class="t s">All dimensions, including empty</text>

  <path d="M488,360 L533,360" class="arrow" marker-end="url(#gueLawArrow)"/>

  <rect x="537" y="323" width="199" height="75" rx="12" class="orange"/>
  <text x="636.5" y="349" text-anchor="middle" class="t h">Exact finite expectations</text>
  <text x="636.5" y="372" text-anchor="middle" class="t s">Centered first, normalized second</text>

  <rect x="24" y="418" width="712" height="24" rx="8"
        fill="#16243A" stroke="#16243A" stroke-width="1"/>
  <text x="380" y="435" text-anchor="middle"
        style="font-family:Inter,Arial,Helvetica,sans-serif;font-size:10.5px;fill:#FFFDF8">
    Finite pushforwards and exact moments are a foundation, not a density or an asymptotic law.
  </text>
</svg>
