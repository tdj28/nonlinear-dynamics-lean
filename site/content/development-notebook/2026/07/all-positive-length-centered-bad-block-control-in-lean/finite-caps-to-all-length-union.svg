<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" role="img" aria-labelledby="capsTitle capsDesc">
  <title id="capsTitle">Finite caps form the all-positive-length union</title>
  <desc id="capsDesc">Three nested search windows expand from a short finite cap to every positive finite length. The union means one finite witness somewhere, not infinitely many witnesses.</desc>
  <rect width="760" height="330" fill="#F7F4F0"/>
  <style>
    .t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#2C2924}.title{font-size:15px;font-weight:700}.h{font-size:13px;font-weight:700}.s{font-size:12px}.m{font-size:11px;fill:#5A544C}.blue{fill:#E8F0F7;stroke:#4B6787;stroke-width:1.5}.neutral{fill:#FBF9F6;stroke:#C4B8A8;stroke-width:1.4}.warn{fill:#F3E8E0;stroke:#A67C52;stroke-width:1.4}.good{fill:#EAF1E5;stroke:#6F8D5E;stroke-width:1.5}
  </style>
  <text x="24" y="28" class="t title">A growing cap removes the preset ceiling</text>
  <text x="24" y="48" class="t m">Every stage is finite; their nested union reaches every positive finite length.</text>
  <rect x="24" y="76" width="154" height="88" rx="10" class="neutral"/>
  <text x="43" y="101" class="t h">Short cap</text>
  <rect x="43" y="118" width="30" height="24" rx="5" class="blue"/><text x="55" y="135" class="t s">1</text>
  <rect x="80" y="118" width="30" height="24" rx="5" class="blue"/><text x="92" y="135" class="t s">2</text>
  <rect x="117" y="118" width="30" height="24" rx="5" class="blue"/><text x="129" y="135" class="t s">3</text>
  <path d="M184 120 H215" stroke="#A67C52" stroke-width="2.5"/><path d="M215 120 l-9 -6 v12 z" fill="#A67C52"/>
  <rect x="224" y="70" width="200" height="100" rx="10" class="blue"/>
  <text x="244" y="97" class="t h">Larger finite cap</text>
  <text x="244" y="122" class="t s">Keeps every earlier length</text>
  <text x="244" y="144" class="t s">and adds more finite choices</text>
  <path d="M430 120 H461" stroke="#A67C52" stroke-width="2.5"/><path d="M461 120 l-9 -6 v12 z" fill="#A67C52"/>
  <rect x="470" y="64" width="266" height="112" rx="10" class="good"/>
  <text x="491" y="93" class="t h">All positive finite lengths</text>
  <text x="491" y="119" class="t s">Union of every finite cap</text>
  <text x="491" y="143" class="t s">One witness may enter at any stage</text>
  <rect x="24" y="199" width="346" height="70" rx="10" class="good"/>
  <text x="44" y="226" class="t h">Asserted</text>
  <text x="44" y="250" class="t s">There is one positive finite witness somewhere.</text>
  <rect x="390" y="199" width="346" height="70" rx="10" class="warn"/>
  <text x="410" y="226" class="t h">Not asserted</text>
  <text x="410" y="250" class="t s">Bad witnesses recur infinitely often or arbitrarily late.</text>
  <rect x="24" y="289" width="712" height="25" rx="9" class="good"/>
  <text x="380" y="306" text-anchor="middle" class="t s">Unbounded existential search is still a one-witness statement.</text>
</svg>
