<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" role="img" aria-labelledby="probeTitle probeDesc">
  <title id="probeTitle">Ten compiled RMT-31 boundary probes</title>
  <desc id="probeDesc">A two-row grid names the ten compiled checks: empty cap, finite-cap inclusion, zero process, zero measure, nonergodic half-mass model, later witness, cap-one strictness, mass-two measure, empty matrix index, and preserving raw non-invariance.</desc>
  <rect width="760" height="420" fill="#F7F4F0"/>
  <style>
    .t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#2C2924}.title{font-size:15px;font-weight:700}.h{font-size:12px;font-weight:700}.s{font-size:11px}.m{font-size:11px;fill:#5A544C}.blue{fill:#E8F0F7;stroke:#4B6787;stroke-width:1.3}.neutral{fill:#FBF9F6;stroke:#C4B8A8;stroke-width:1.3}.warn{fill:#F3E8E0;stroke:#A67C52;stroke-width:1.3}.good{fill:#EAF1E5;stroke:#6F8D5E;stroke-width:1.3}
  </style>
  <text x="24" y="28" class="t title">Compiled boundaries, not prose-only promises</text>
  <text x="24" y="48" class="t m">Each cell corresponds to one anonymous example in exact source order.</text>
  <rect x="24" y="72" width="132" height="116" rx="10" class="neutral"/><text x="40" y="98" class="t h">1  Empty cap</text><text x="40" y="124" class="t s">Cap zero set</text><text x="40" y="143" class="t s">is empty</text>
  <rect x="169" y="72" width="132" height="116" rx="10" class="blue"/><text x="185" y="98" class="t h">2  Inclusion</text><text x="185" y="124" class="t s">Every finite cap</text><text x="185" y="143" class="t s">enters the union</text>
  <rect x="314" y="72" width="132" height="116" rx="10" class="neutral"/><text x="330" y="98" class="t h">3  Zero process</text><text x="330" y="124" class="t s">Negative slope</text><text x="330" y="143" class="t s">gives no witness</text>
  <rect x="459" y="72" width="132" height="116" rx="10" class="neutral"/><text x="475" y="98" class="t h">4  Zero measure</text><text x="475" y="124" class="t s">Real event mass</text><text x="475" y="143" class="t s">is zero</text>
  <rect x="604" y="72" width="132" height="116" rx="10" class="good"/><text x="620" y="98" class="t h">5  Nonergodic</text><text x="620" y="124" class="t s">Half-mass event</text><text x="620" y="143" class="t s">has real bound</text>
  <rect x="24" y="205" width="132" height="116" rx="10" class="blue"/><text x="40" y="231" class="t h">6  Later witness</text><text x="40" y="257" class="t s">Time one equal</text><text x="40" y="276" class="t s">time two strict</text>
  <rect x="169" y="205" width="132" height="116" rx="10" class="blue"/><text x="185" y="231" class="t h">7  Cap one</text><text x="185" y="257" class="t s">Exact strictness</text><text x="185" y="276" class="t s">formula</text>
  <rect x="314" y="205" width="132" height="116" rx="10" class="good"/><text x="330" y="231" class="t h">8  Mass two</text><text x="330" y="257" class="t s">Finite measure</text><text x="330" y="276" class="t s">not probability</text>
  <rect x="459" y="205" width="132" height="116" rx="10" class="neutral"/><text x="475" y="231" class="t h">9  Empty index</text><text x="475" y="257" class="t s">Matrix index</text><text x="475" y="276" class="t s">may be empty</text>
  <rect x="604" y="205" width="132" height="116" rx="10" class="warn"/><text x="620" y="231" class="t h">10  Not invariant</text><text x="620" y="257" class="t s">Preserved base</text><text x="620" y="276" class="t s">unequal raw sets</text>
  <rect x="24" y="354" width="712" height="40" rx="9" class="good"/>
  <text x="380" y="379" text-anchor="middle" class="t s">The probes protect strictness, finiteness gates, missing assumptions, and event semantics.</text>
</svg>
