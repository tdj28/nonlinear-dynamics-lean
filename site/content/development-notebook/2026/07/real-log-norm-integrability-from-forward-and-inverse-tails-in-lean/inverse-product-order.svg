<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">Matrix inversion reverses the order of cocycle factors</title>
  <desc id="desc">A forward newest-factor-left product is mirrored into an inverse product with the earliest inverse first. A same-order inverse lane is crossed out.</desc>
  <rect width="960" height="520" rx="30" fill="#F7F4F0"/>
  <text x="48" y="62" fill="#16243A" font-family="Georgia,serif" font-size="31" font-weight="700">The inverse walks the product backward</text>
  <text x="48" y="91" fill="#657183" font-family="system-ui,sans-serif" font-size="15">Factor order is proof structure, not notation</text>
  <g font-family="system-ui,sans-serif" text-anchor="middle">
    <text x="118" y="163" fill="#4B6787" font-size="14" font-weight="700" letter-spacing="1.3">FORWARD VALUE</text>
    <rect x="194" y="126" width="142" height="70" rx="18" fill="#E8F0F7" stroke="#4B6787"/><text x="265" y="155" fill="#16243A" font-size="15">newest</text><text x="265" y="177" fill="#16243A" font-size="16" font-weight="700">factor</text>
    <text x="370" y="169" fill="#16243A" font-size="25">times</text>
    <rect x="420" y="126" width="142" height="70" rx="18" fill="#E8F0F7" stroke="#4B6787"/><text x="491" y="155" fill="#16243A" font-size="15">middle</text><text x="491" y="177" fill="#16243A" font-size="16" font-weight="700">factor</text>
    <text x="596" y="169" fill="#16243A" font-size="25">times</text>
    <rect x="646" y="126" width="142" height="70" rx="18" fill="#E8F0F7" stroke="#4B6787"/><text x="717" y="155" fill="#16243A" font-size="15">earliest</text><text x="717" y="177" fill="#16243A" font-size="16" font-weight="700">factor</text>
    <path d="M717 208C717 266 265 266 265 318" fill="none" stroke="#A67C52" stroke-width="3" stroke-dasharray="8 7"/>
    <path d="M265 208C265 266 717 266 717 318" fill="none" stroke="#A67C52" stroke-width="3" stroke-dasharray="8 7"/>
    <text x="118" y="361" fill="#315F55" font-size="14" font-weight="700" letter-spacing="1.3">TRUE INVERSE</text>
    <rect x="194" y="318" width="142" height="70" rx="18" fill="#EAF1E5" stroke="#315F55"/><text x="265" y="347" fill="#16243A" font-size="15">earliest</text><text x="265" y="369" fill="#16243A" font-size="16" font-weight="700">inverse</text>
    <text x="370" y="361" fill="#16243A" font-size="25">times</text>
    <rect x="420" y="318" width="142" height="70" rx="18" fill="#EAF1E5" stroke="#315F55"/><text x="491" y="347" fill="#16243A" font-size="15">middle</text><text x="491" y="369" fill="#16243A" font-size="16" font-weight="700">inverse</text>
    <text x="596" y="361" fill="#16243A" font-size="25">times</text>
    <rect x="646" y="318" width="142" height="70" rx="18" fill="#EAF1E5" stroke="#315F55"/><text x="717" y="347" fill="#16243A" font-size="15">newest</text><text x="717" y="369" fill="#16243A" font-size="16" font-weight="700">inverse</text>
  </g>
  <rect x="254" y="438" width="452" height="48" rx="24" fill="#F4E5E2"/>
  <text x="480" y="468" text-anchor="middle" fill="#8B3E33" font-family="system-ui,sans-serif" font-size="16" font-weight="700">Keeping the forward order is false without commutativity</text>
  <path d="M271 449 689 477M689 449 271 477" stroke="#8B3E33" stroke-width="2" opacity=".35"/>
</svg>
