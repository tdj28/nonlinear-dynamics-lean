<svg xmlns="http://www.w3.org/2000/svg" width="760" height="455" viewBox="0 0 760 455" role="img" aria-labelledby="rmt33BridgeTitle rmt33BridgeDesc">
  <title id="rmt33BridgeTitle">Asymmetric boundedness gates in the lower-limit event bridge</title>
  <desc id="rmt33BridgeDesc">A strict real lower-limit deviation points to rational frequent crossing using a pointwise upper ceiling. The reverse arrow requires a separate eventual lower bound. A guarded equivalence encloses both directions.</desc>
  <rect width="760" height="455" fill="#F7F4F0"/>
  <style>
    .t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#2C2924}.title{font-size:16px;font-weight:700}.h{font-size:13px;font-weight:700}.s{font-size:12px}.m{font-size:11px;fill:#5A544C}
    .blue{fill:#E8F0F7;stroke:#4B6787;stroke-width:1.5}.green{fill:#EAF1E5;stroke:#6F8D5E;stroke-width:1.5}.clay{fill:#F3E8E0;stroke:#A67C52;stroke-width:1.5}.red{fill:#F4E5E2;stroke:#8B3E33;stroke-width:1.5}
  </style>
  <text x="24" y="30" class="t title">The two directions spend different one-sided bounds</text>
  <rect x="46" y="100" width="246" height="94" rx="14" class="blue"/>
  <text x="72" y="131" class="t h">REAL LOWER LIMIT</text>
  <text x="72" y="157" class="t s">strictly below target</text>
  <text x="72" y="179" class="t m">Choose an intermediate rational.</text>
  <rect x="468" y="100" width="246" height="94" rx="14" class="green"/>
  <text x="494" y="131" class="t h">RATIONAL EVENT</text>
  <text x="494" y="157" class="t s">one slope crossed frequently</text>
  <text x="494" y="179" class="t m">A fixed strict margin survives.</text>
  <path d="M300 123 L458 123" stroke="#4B6787" stroke-width="3"/>
  <path d="M449 116 L462 123 L449 130" fill="#4B6787"/>
  <rect x="300" y="52" width="160" height="54" rx="11" class="clay"/>
  <text x="322" y="75" class="t h">UPPER CEILING</text>
  <text x="315" y="94" class="t m">Candidate gives zero.</text>
  <path d="M460 174 L302 174" stroke="#8B3E33" stroke-width="3"/>
  <path d="M311 167 L298 174 L311 181" fill="#8B3E33"/>
  <rect x="294" y="213" width="172" height="62" rx="11" class="red"/>
  <text x="315" y="238" class="t h">EVENTUAL LOWER BOUND</text>
  <text x="316" y="258" class="t m">Required, not inferred.</text>
  <path d="M380 212 L380 182" stroke="#8B3E33" stroke-width="2"/>
  <rect x="102" y="311" width="556" height="90" rx="15" class="clay"/>
  <text x="128" y="341" class="t h">GUARDED EQUIVALENCE</text>
  <text x="128" y="368" class="t s">Under the candidate ceiling and an actual eventual lower bound,</text>
  <text x="128" y="388" class="t s">rational event membership exactly matches strict real lower-limit deviation.</text>
  <text x="24" y="434" class="t m">Removing the red gate is refuted by the checked quadratic boundary example.</text>
</svg>
