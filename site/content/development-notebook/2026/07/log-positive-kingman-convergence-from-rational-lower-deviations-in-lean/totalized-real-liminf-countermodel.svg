<svg xmlns="http://www.w3.org/2000/svg" width="760" height="470" viewBox="0 0 760 470" role="img" aria-labelledby="rmt33CounterTitle rmt33CounterDesc">
  <title id="rmt33CounterTitle">Quadratic countermodel for an unguarded real lower-limit bridge</title>
  <desc id="rmt33CounterDesc">A sequence plot shows centered normalized positive-time values descending without a real lower bound and crossing a negative target. A separate box explains that the totalized real lower limit is zero because the set of eventual real lower bounds is empty.</desc>
  <rect width="760" height="470" fill="#F7F4F0"/>
  <style>
    .t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#2C2924}.title{font-size:16px;font-weight:700}.h{font-size:13px;font-weight:700}.s{font-size:12px}.m{font-size:11px;fill:#5A544C}
    .neutral{fill:#FBF9F6;stroke:#C4B8A8;stroke-width:1.5}.blue{fill:#E8F0F7;stroke:#4B6787;stroke-width:1.5}.green{fill:#EAF1E5;stroke:#6F8D5E;stroke-width:1.5}.red{fill:#F4E5E2;stroke:#8B3E33;stroke-width:1.5}
  </style>
  <text x="24" y="30" class="t title">A genuine candidate can escape below every real bound</text>
  <text x="24" y="51" class="t m">The graph is schematic for positive-time centered normalized values.</text>
  <rect x="36" y="78" width="402" height="310" rx="14" class="neutral"/>
  <line x1="84" y1="112" x2="84" y2="346" stroke="#4D5B6B" stroke-width="2"/>
  <line x1="84" y1="142" x2="404" y2="142" stroke="#4D5B6B" stroke-width="2"/>
  <line x1="84" y1="205" x2="404" y2="205" stroke="#8B3E33" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="49" y="148" class="t m">zero</text>
  <text x="44" y="210" class="t m">target</text>
  <polyline points="116,142 166,173 216,205 266,237 316,269 366,301" fill="none" stroke="#4B6787" stroke-width="3"/>
  <circle cx="116" cy="142" r="6" fill="#4B6787"/>
  <circle cx="166" cy="173" r="6" fill="#4B6787"/>
  <circle cx="216" cy="205" r="6" fill="#4B6787"/>
  <circle cx="266" cy="237" r="6" fill="#4B6787"/>
  <circle cx="316" cy="269" r="6" fill="#4B6787"/>
  <circle cx="366" cy="301" r="6" fill="#4B6787"/>
  <path d="M366 301 L390 326" stroke="#4B6787" stroke-width="3"/>
  <path d="M382 321 L394 330 L390 316" fill="#4B6787"/>
  <text x="112" y="371" class="t m">positive natural time</text>
  <rect x="468" y="78" width="256" height="128" rx="14" class="red"/>
  <text x="492" y="108" class="t h">CHECKED FACTS</text>
  <text x="492" y="135" class="t s">Rational event: yes</text>
  <text x="492" y="158" class="t s">Eventual lower bound: no</text>
  <text x="492" y="181" class="t s">Negative escape: yes</text>
  <rect x="468" y="231" width="256" height="157" rx="14" class="blue"/>
  <text x="492" y="261" class="t h">TOTALIZED REAL OPERATION</text>
  <text x="492" y="291" class="t s">Eventual real lower bounds:</text>
  <text x="492" y="314" class="t h">EMPTY SET</text>
  <text x="492" y="341" class="t s">Supremum of empty real set:</text>
  <text x="492" y="366" class="t h">ZERO</text>
  <rect x="20" y="416" width="720" height="34" rx="10" class="green"/>
  <text x="48" y="438" class="t s">Conclusion: retain the eventual lower-bound gate whenever real liminf carries analytic meaning.</text>
</svg>
