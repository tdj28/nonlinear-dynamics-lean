<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img" aria-labelledby="rmt33ZeroTitle rmt33ZeroDesc">
  <title id="rmt33ZeroTitle">Time zero is forgotten by total normalization</title>
  <desc id="rmt33ZeroDesc">A natural-time line marks time zero as totalized to zero independently of the process slice. Positive times retain ordinary quotients, and a finite-prefix shift leads to the same real lower limit.</desc>
  <rect width="760" height="430" fill="#F7F4F0"/>
  <style>
    .t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#2C2924}.title{font-size:16px;font-weight:700}.h{font-size:13px;font-weight:700}.s{font-size:12px}.m{font-size:11px;fill:#5A544C}
    .neutral{fill:#FBF9F6;stroke:#C4B8A8;stroke-width:1.5}.blue{fill:#E8F0F7;stroke:#4B6787;stroke-width:1.5}.green{fill:#EAF1E5;stroke:#6F8D5E;stroke-width:1.5}.red{fill:#F4E5E2;stroke:#8B3E33;stroke-width:1.5}
  </style>
  <text x="24" y="30" class="t title">The zero-time slice is formally present and asymptotically silent</text>
  <text x="24" y="52" class="t m">Two different theorems protect the boundary.</text>
  <line x1="86" y1="156" x2="682" y2="156" stroke="#4D5B6B" stroke-width="3"/>
  <circle cx="112" cy="156" r="31" class="red"/>
  <text x="104" y="162" class="t h">0</text>
  <circle cx="248" cy="156" r="22" class="blue"/>
  <text x="244" y="162" class="t h">1</text>
  <circle cx="374" cy="156" r="22" class="blue"/>
  <text x="370" y="162" class="t h">2</text>
  <circle cx="500" cy="156" r="22" class="blue"/>
  <text x="496" y="162" class="t h">3</text>
  <circle cx="626" cy="156" r="22" class="blue"/>
  <text x="620" y="162" class="t h">n</text>
  <text x="61" y="215" class="t h">TOTALIZED ZERO</text>
  <text x="54" y="239" class="t m">Any original value is forgotten.</text>
  <text x="221" y="215" class="t h">POSITIVE-TIME QUOTIENTS</text>
  <text x="221" y="239" class="t m">Ordinary division carries the growth information.</text>
  <rect x="54" y="282" width="300" height="88" rx="13" class="neutral"/>
  <text x="75" y="310" class="t h">POINTWISE UPDATE THEOREM</text>
  <text x="75" y="337" class="t s">Replace the full zero-time slice.</text>
  <text x="75" y="356" class="t m">Every normalized value stays equal.</text>
  <rect x="406" y="282" width="300" height="88" rx="13" class="green"/>
  <text x="427" y="310" class="t h">FINITE-PREFIX FILTER THEOREM</text>
  <text x="427" y="337" class="t s">Start the sequence one step later.</text>
  <text x="427" y="356" class="t m">The real lower limit stays equal.</text>
  <path d="M357 326 L397 326" stroke="#A67C52" stroke-width="2.5"/>
  <path d="M390 319 L401 326 L390 333" fill="#A67C52"/>
  <text x="24" y="407" class="t m">Formal truth at time zero does not assign physical meaning to a zero-horizon rate.</text>
</svg>
