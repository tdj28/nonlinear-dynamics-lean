<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img" aria-labelledby="rmt33CutsTitle rmt33CutsDesc">
  <title id="rmt33CutsTitle">Two rational cuts below the target rate</title>
  <desc id="rmt33CutsDesc">A number line orders the formal lower limit, an inner rational witness, an outer rational event target, and the integral offset. The inner cut witnesses frequency and the outer cut indexes the null cover.</desc>
  <rect width="760" height="430" fill="#F7F4F0"/>
  <style>
    .t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#2C2924}.title{font-size:16px;font-weight:700}.h{font-size:13px;font-weight:700}.s{font-size:12px}.m{font-size:11px;fill:#5A544C}
    .blue{fill:#E8F0F7;stroke:#4B6787;stroke-width:1.5}.green{fill:#EAF1E5;stroke:#6F8D5E;stroke-width:1.5}.clay{fill:#F3E8E0;stroke:#A67C52;stroke-width:1.5}.red{fill:#F4E5E2;stroke:#8B3E33;stroke-width:1.5}
  </style>
  <text x="24" y="30" class="t title">Strict slack is spent twice</text>
  <text x="24" y="52" class="t m">The positions are schematic; only their order matters.</text>
  <line x1="72" y1="188" x2="688" y2="188" stroke="#4D5B6B" stroke-width="4"/>
  <path d="M678 180 L692 188 L678 196" fill="#4D5B6B"/>
  <line x1="130" y1="166" x2="130" y2="210" stroke="#8B3E33" stroke-width="3"/>
  <line x1="300" y1="166" x2="300" y2="210" stroke="#A67C52" stroke-width="3"/>
  <line x1="470" y1="166" x2="470" y2="210" stroke="#4B6787" stroke-width="3"/>
  <line x1="638" y1="166" x2="638" y2="210" stroke="#6F8D5E" stroke-width="3"/>
  <rect x="58" y="90" width="144" height="58" rx="11" class="red"/>
  <text x="84" y="115" class="t h">LOWER LIMIT</text>
  <text x="84" y="136" class="t m">Point under study</text>
  <rect x="228" y="231" width="144" height="68" rx="11" class="clay"/>
  <text x="248" y="256" class="t h">INNER RATIONAL</text>
  <text x="248" y="279" class="t m">Frequency witness</text>
  <rect x="398" y="90" width="144" height="58" rx="11" class="blue"/>
  <text x="416" y="115" class="t h">OUTER RATIONAL</text>
  <text x="416" y="136" class="t m">Null-cover index</text>
  <rect x="566" y="231" width="144" height="68" rx="11" class="green"/>
  <text x="588" y="256" class="t h">TARGET RATE</text>
  <text x="588" y="279" class="t m">Integral offset</text>
  <path d="M144 332 L286 332" stroke="#A67C52" stroke-width="3"/>
  <path d="M277 325 L290 332 L277 339" fill="#A67C52"/>
  <text x="135" y="359" class="t s">first strict gap</text>
  <path d="M314 332 L456 332" stroke="#4B6787" stroke-width="3"/>
  <path d="M447 325 L460 332 L447 339" fill="#4B6787"/>
  <text x="306" y="359" class="t s">event margin</text>
  <path d="M484 332 L624 332" stroke="#6F8D5E" stroke-width="3"/>
  <path d="M615 325 L628 332 L615 339" fill="#6F8D5E"/>
  <text x="492" y="359" class="t s">milestone 32 hypothesis</text>
  <text x="24" y="407" class="t m">The outer cut prevents the impossible endpoint request that the target be strictly below itself.</text>
</svg>
