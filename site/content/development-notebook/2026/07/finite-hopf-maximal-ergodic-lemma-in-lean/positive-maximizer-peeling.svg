<svg xmlns="http://www.w3.org/2000/svg" width="920" height="720"
     viewBox="0 0 920 720" role="img"
     aria-labelledby="titlePeeling descPeeling">
  <title id="titlePeeling">Peeling a positive maximizing Birkhoff-sum prefix</title>
  <desc id="descPeeling">The upper event branch chooses a positive maximizing prefix, rules out time zero, peels off the first observation, and bounds the remaining shifted prefix by the shifted running maximum. The lower complement branch makes the current maximum zero and uses nonnegativity of the shifted maximum. A selector joins the branches into the pointwise indicator inequality.</desc>
  <rect width="920" height="720" fill="#F7F4F0"/>
  <style>
    .blue{fill:#E8F0F7;stroke:#4B6787;stroke-width:1.7}
    .cream{fill:#FBF9F6;stroke:#C4B8A8;stroke-width:1.7}
    .green{fill:#EAF1E5;stroke:#6F8D5E;stroke-width:1.7}
    .clay{fill:#F3E8E0;stroke:#A67C52;stroke-width:1.7}
    .gray{fill:#EDE8E1;stroke:#7F786D;stroke-width:1.7}
    .arrow{stroke:#A67C52;stroke-width:2.5;fill:none}
    .guide{stroke:#A89B8C;stroke-width:1.5;stroke-dasharray:5 4;fill:none}
    .t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#2C2924}
    .title{font-size:18px;font-weight:700}
    .h{font-size:14px;font-weight:700}
    .s{font-size:13px}
    .m{font-size:12px;fill:#5A544C}
    .warn{font-size:13px;font-weight:700;fill:#934F1F}
  </style>

  <text x="34" y="38" class="t title">A positive maximizing prefix can be peeled</text>
  <text x="34" y="62" class="t m">Strict positivity separates the successor branch from the exact zero branch.</text>

  <rect x="34" y="88" width="852" height="40" rx="10" class="green"/>
  <text x="58" y="114" class="t h">ON THE STRICT EVENT: THE RUNNING MAXIMUM IS POSITIVE</text>

  <rect x="52" y="158" width="220" height="92" rx="12" class="blue"/>
  <text x="76" y="189" class="t h">CHOOSE A MAXIMIZER</text>
  <text x="76" y="216" class="t s">A finite prefix attains</text>
  <text x="76" y="237" class="t s">the running maximum.</text>

  <line x1="272" y1="204" x2="316" y2="204" class="arrow"/>
  <polygon points="328,204 313,196 313,212" fill="#A67C52"/>

  <rect x="328" y="158" width="232" height="92" rx="12" class="clay"/>
  <text x="352" y="189" class="t h">RULE OUT TIME ZERO</text>
  <text x="352" y="216" class="t s">The zero-time sum is zero,</text>
  <text x="352" y="237" class="t s">so a positive maximizer is later.</text>

  <line x1="560" y1="204" x2="604" y2="204" class="arrow"/>
  <polygon points="616,204 601,196 601,212" fill="#A67C52"/>

  <rect x="616" y="158" width="252" height="92" rx="12" class="blue"/>
  <text x="640" y="189" class="t h">PEEL THE FIRST VALUE</text>
  <text x="640" y="216" class="t s">What remains is a shorter prefix</text>
  <text x="640" y="237" class="t s">based after one map step.</text>

  <line x1="162" y1="250" x2="162" y2="284" class="guide"/>
  <line x1="444" y1="250" x2="444" y2="284" class="guide"/>
  <line x1="742" y1="250" x2="742" y2="284" class="guide"/>

  <rect x="80" y="284" width="220" height="82" rx="12" class="cream"/>
  <text x="105" y="315" class="t h">FIRST OBSERVATION</text>
  <text x="105" y="342" class="t s">kept as the visible term</text>

  <text x="319" y="333" class="t title">+</text>

  <rect x="352" y="284" width="220" height="82" rx="12" class="blue"/>
  <text x="378" y="315" class="t h">SHIFTED PREFIX</text>
  <text x="378" y="342" class="t s">same orbit after one step</text>

  <line x1="572" y1="325" x2="618" y2="325" class="arrow"/>
  <polygon points="630,325 615,317 615,333" fill="#A67C52"/>

  <rect x="630" y="284" width="238" height="82" rx="12" class="green"/>
  <text x="655" y="315" class="t h">SHIFTED MAXIMUM</text>
  <text x="655" y="342" class="t s">bounds every shifted prefix</text>

  <rect x="34" y="402" width="852" height="40" rx="10" class="gray"/>
  <text x="58" y="428" class="t h">OFF THE STRICT EVENT: THE CURRENT RUNNING MAXIMUM IS EXACTLY ZERO</text>

  <rect x="80" y="472" width="230" height="88" rx="12" class="cream"/>
  <text x="105" y="503" class="t h">CURRENT MAXIMUM</text>
  <text x="105" y="531" class="t s">not positive plus nonnegative</text>
  <text x="105" y="551" class="t s">means exactly zero</text>

  <line x1="310" y1="516" x2="356" y2="516" class="arrow"/>
  <polygon points="368,516 353,508 353,524" fill="#A67C52"/>

  <rect x="368" y="472" width="230" height="88" rx="12" class="blue"/>
  <text x="393" y="503" class="t h">SHIFTED MAXIMUM</text>
  <text x="393" y="531" class="t s">remains nonnegative</text>

  <line x1="598" y1="516" x2="644" y2="516" class="arrow"/>
  <polygon points="656,516 641,508 641,524" fill="#A67C52"/>

  <rect x="656" y="472" width="212" height="88" rx="12" class="green"/>
  <text x="681" y="503" class="t h">ZERO UPPER BOUND</text>
  <text x="681" y="531" class="t s">matches the vanished</text>
  <text x="681" y="551" class="t s">event indicator</text>

  <path d="M 749 366 L 884 366 L 884 584 L 760 584 L 760 602" class="guide"/>
  <line x1="762" y1="560" x2="762" y2="602" class="guide"/>

  <rect x="126" y="602" width="668" height="62" rx="12" class="clay"/>
  <text x="154" y="629" class="t h">ONE POINTWISE INDICATOR INEQUALITY</text>
  <text x="154" y="650" class="t s">The event selects the first observation; its complement selects zero.</text>

  <rect x="34" y="680" width="852" height="28" rx="9" class="green"/>
  <text x="95" y="699" class="t m">Finite orbit algebra only: no measure, measurability, probability, ergodicity, or inverse map.</text>
</svg>
