<svg xmlns="http://www.w3.org/2000/svg" width="760" height="390" viewBox="0 0 760 390" role="img" aria-labelledby="threeErrorTitle threeErrorDesc">
  <title id="threeErrorTitle">Why the error budget has three pieces</title>
  <desc id="threeErrorDesc">Four labeled average values are joined by three controlled links: approximation error at the first time, the convergent approximant tail, and approximation error at the second time.</desc>
  <style>
    .t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#2C2924}
    .title{font-size:15px;font-weight:700}
    .h{font-size:12px;font-weight:700}
    .s{font-size:11px}
    .m{font-size:10px;fill:#5A544C}
    .target{fill:#E8F0F7;stroke:#4B6787;stroke-width:1.5}
    .good{fill:#EAF1E5;stroke:#6F8D5E;stroke-width:1.5}
    .piece{fill:#FBF9F6;stroke:#C4B8A8;stroke-width:1.5}
  </style>
  <rect width="760" height="390" fill="#F7F4F0"/>
  <text x="24" y="28" class="t title">Why the error budget has three pieces</text>
  <text x="24" y="48" class="t m">Compare two target averages by walking through one convergent approximant.</text>

  <rect x="24" y="82" width="132" height="96" rx="12" class="target"/>
  <text x="90" y="112" text-anchor="middle" class="t h">TARGET</text>
  <text x="90" y="139" text-anchor="middle" class="t s">first late time</text>
  <circle cx="90" cy="158" r="6" fill="#4B6787"/>

  <rect x="214" y="82" width="132" height="96" rx="12" class="good"/>
  <text x="280" y="112" text-anchor="middle" class="t h">APPROXIMANT</text>
  <text x="280" y="139" text-anchor="middle" class="t s">same late time</text>
  <circle cx="280" cy="158" r="6" fill="#6F8D5E"/>

  <rect x="404" y="82" width="132" height="96" rx="12" class="good"/>
  <text x="470" y="112" text-anchor="middle" class="t h">APPROXIMANT</text>
  <text x="470" y="139" text-anchor="middle" class="t s">other late time</text>
  <circle cx="470" cy="158" r="6" fill="#6F8D5E"/>

  <rect x="594" y="82" width="132" height="96" rx="12" class="target"/>
  <text x="660" y="112" text-anchor="middle" class="t h">TARGET</text>
  <text x="660" y="139" text-anchor="middle" class="t s">other late time</text>
  <circle cx="660" cy="158" r="6" fill="#4B6787"/>

  <path d="M156 130 H214" stroke="#A67C52" stroke-width="2.5"/>
  <path d="M346 130 H404" stroke="#A67C52" stroke-width="2.5"/>
  <path d="M536 130 H594" stroke="#A67C52" stroke-width="2.5"/>

  <rect x="52" y="216" width="196" height="76" rx="10" class="piece"/>
  <text x="150" y="244" text-anchor="middle" class="t h">FIRST PIECE</text>
  <text x="150" y="268" text-anchor="middle" class="t s">approximation error</text>
  <path d="M150 216 V188" stroke="#A89B8C" stroke-width="1.5" stroke-dasharray="5 4"/>

  <rect x="282" y="216" width="196" height="76" rx="10" class="piece"/>
  <text x="380" y="244" text-anchor="middle" class="t h">MIDDLE PIECE</text>
  <text x="380" y="268" text-anchor="middle" class="t s">good sequence tail</text>
  <path d="M380 216 V188" stroke="#A89B8C" stroke-width="1.5" stroke-dasharray="5 4"/>

  <rect x="512" y="216" width="196" height="76" rx="10" class="piece"/>
  <text x="610" y="244" text-anchor="middle" class="t h">FINAL PIECE</text>
  <text x="610" y="268" text-anchor="middle" class="t s">approximation error</text>
  <path d="M610 216 V188" stroke="#A89B8C" stroke-width="1.5" stroke-dasharray="5 4"/>

  <rect x="24" y="320" width="712" height="48" rx="12" class="good"/>
  <text x="380" y="349" text-anchor="middle" class="t s">When all three pieces are small, a fixed Cauchy failure cannot survive.</text>
</svg>
