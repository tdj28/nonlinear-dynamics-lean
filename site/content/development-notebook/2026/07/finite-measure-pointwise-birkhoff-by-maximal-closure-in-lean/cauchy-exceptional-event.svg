<svg xmlns="http://www.w3.org/2000/svg" width="760" height="410" viewBox="0 0 760 410" role="img" aria-labelledby="cauchyEventTitle cauchyEventDesc">
  <title id="cauchyEventTitle">A fixed-scale Cauchy exceptional event</title>
  <desc id="cauchyEventDesc">Three successively later tail cutoffs each retain a labeled pair of averages separated at the chosen scale, illustrating persistent Cauchy failure.</desc>
  <style>
    .t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#2C2924}
    .title{font-size:15px;font-weight:700}
    .h{font-size:12px;font-weight:700}
    .s{font-size:11px}
    .m{font-size:10px;fill:#5A544C}
    .cut{fill:#FBF9F6;stroke:#C4B8A8;stroke-width:1.5}
    .bad{fill:#F3E8E0;stroke:#A67C52;stroke-width:1.5}
    .good{fill:#EAF1E5;stroke:#6F8D5E;stroke-width:1.5}
  </style>
  <rect width="760" height="410" fill="#F7F4F0"/>
  <text x="24" y="28" class="t title">A fixed-scale Cauchy exceptional event</text>
  <text x="24" y="48" class="t m">Failure persists when every tail still contains a separated pair of averages.</text>

  <rect x="24" y="82" width="130" height="58" rx="10" class="cut"/>
  <text x="89" y="106" text-anchor="middle" class="t h">EARLY CUTOFF</text>
  <text x="89" y="126" text-anchor="middle" class="t m">inspect its tail</text>
  <path d="M170 111 H594" stroke="#7F786D" stroke-width="2"/>
  <path d="M170 93 V129" stroke="#A89B8C" stroke-width="2" stroke-dasharray="5 4"/>
  <circle cx="356" cy="111" r="9" fill="#E8F0F7" stroke="#4B6787" stroke-width="2"/>
  <circle cx="500" cy="111" r="9" fill="#F3E8E0" stroke="#A67C52" stroke-width="2"/>
  <path d="M365 111 H491" stroke="#A67C52" stroke-width="3"/>
  <text x="428" y="96" text-anchor="middle" class="t m">separated pair remains</text>

  <rect x="24" y="166" width="130" height="58" rx="10" class="cut"/>
  <text x="89" y="190" text-anchor="middle" class="t h">LATER CUTOFF</text>
  <text x="89" y="210" text-anchor="middle" class="t m">inspect again</text>
  <path d="M232 195 H594" stroke="#7F786D" stroke-width="2"/>
  <path d="M232 177 V213" stroke="#A89B8C" stroke-width="2" stroke-dasharray="5 4"/>
  <circle cx="414" cy="195" r="9" fill="#E8F0F7" stroke="#4B6787" stroke-width="2"/>
  <circle cx="546" cy="195" r="9" fill="#F3E8E0" stroke="#A67C52" stroke-width="2"/>
  <path d="M423 195 H537" stroke="#A67C52" stroke-width="3"/>
  <text x="480" y="180" text-anchor="middle" class="t m">another separated pair</text>

  <rect x="24" y="250" width="130" height="58" rx="10" class="cut"/>
  <text x="89" y="274" text-anchor="middle" class="t h">ANY CUTOFF</text>
  <text x="89" y="294" text-anchor="middle" class="t m">the pattern repeats</text>
  <path d="M294 279 H594" stroke="#7F786D" stroke-width="2"/>
  <path d="M294 261 V297" stroke="#A89B8C" stroke-width="2" stroke-dasharray="5 4"/>
  <circle cx="470" cy="279" r="9" fill="#E8F0F7" stroke="#4B6787" stroke-width="2"/>
  <circle cx="574" cy="279" r="9" fill="#F3E8E0" stroke="#A67C52" stroke-width="2"/>
  <path d="M479 279 H565" stroke="#A67C52" stroke-width="3"/>

  <rect x="614" y="82" width="122" height="226" rx="12" class="bad"/>
  <text x="675" y="124" text-anchor="middle" class="t h">EXCEPTIONAL</text>
  <text x="675" y="144" text-anchor="middle" class="t h">STATE</text>
  <path d="M639 170 H711" stroke="#A67C52" stroke-width="2"/>
  <text x="675" y="203" text-anchor="middle" class="t s">no tail makes</text>
  <text x="675" y="221" text-anchor="middle" class="t s">all later pairs</text>
  <text x="675" y="239" text-anchor="middle" class="t s">close together</text>
  <text x="675" y="278" text-anchor="middle" class="t m">fixed scale</text>

  <rect x="24" y="342" width="712" height="46" rx="12" class="good"/>
  <text x="380" y="370" text-anchor="middle" class="t s">Outside this event, one tail exists where every later pair is close.</text>
</svg>
