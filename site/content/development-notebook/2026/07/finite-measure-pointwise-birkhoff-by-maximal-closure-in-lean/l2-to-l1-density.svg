<svg xmlns="http://www.w3.org/2000/svg" width="760" height="390" viewBox="0 0 760 390" role="img" aria-labelledby="densityBridgeTitle densityBridgeDesc">
  <title id="densityBridgeTitle">The finite-mass density bridge</title>
  <desc id="densityBridgeDesc">A dense pointwise-good core on the square-integrable side passes through a finite-total-mass continuous inclusion and becomes dense among integrable observables, with measurable finite-range functions linking both spaces.</desc>
  <defs>
    <marker id="densityArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#A67C52"/>
    </marker>
  </defs>
  <style>
    .t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#2C2924}
    .title{font-size:15px;font-weight:700}
    .h{font-size:12px;font-weight:700}
    .s{font-size:11px}
    .m{font-size:10px;fill:#5A544C}
    .blue{fill:#E8F0F7;stroke:#4B6787;stroke-width:1.5}
    .neutral{fill:#FBF9F6;stroke:#C4B8A8;stroke-width:1.5}
    .green{fill:#EAF1E5;stroke:#6F8D5E;stroke-width:1.5}
    .clay{fill:#F3E8E0;stroke:#A67C52;stroke-width:1.5}
    .arrow{fill:none;stroke:#A67C52;stroke-width:2.4;marker-end:url(#densityArrow)}
  </style>
  <rect width="760" height="390" fill="#F7F4F0"/>
  <text x="24" y="28" class="t title">The finite-mass density bridge</text>
  <text x="24" y="48" class="t m">A stronger function space supplies a dense good class for the weaker one.</text>

  <rect x="28" y="82" width="210" height="190" rx="14" class="blue"/>
  <text x="133" y="112" text-anchor="middle" class="t h">SQUARE-INTEGRABLE SIDE</text>
  <text x="133" y="138" text-anchor="middle" class="t m">stronger norm</text>
  <rect x="58" y="160" width="150" height="78" rx="10" class="green"/>
  <text x="133" y="187" text-anchor="middle" class="t h">DENSE GOOD CORE</text>
  <text x="133" y="210" text-anchor="middle" class="t s">fixed observables</text>
  <text x="133" y="227" text-anchor="middle" class="t s">and simple coboundaries</text>

  <path d="M242 177 H267" class="arrow"/>

  <rect x="275" y="104" width="210" height="146" rx="14" class="clay"/>
  <text x="380" y="135" text-anchor="middle" class="t h">FINITE-TOTAL-MASS GATE</text>
  <path d="M310 153 H450" stroke="#A67C52" stroke-width="2"/>
  <text x="380" y="181" text-anchor="middle" class="t s">continuous inclusion</text>
  <text x="380" y="202" text-anchor="middle" class="t s">controls the weaker norm</text>
  <text x="380" y="229" text-anchor="middle" class="t m">probability is not required</text>

  <path d="M489 177 H514" class="arrow"/>

  <rect x="522" y="82" width="210" height="190" rx="14" class="neutral"/>
  <text x="627" y="112" text-anchor="middle" class="t h">INTEGRABLE SIDE</text>
  <text x="627" y="138" text-anchor="middle" class="t m">weaker norm</text>
  <circle cx="576" cy="183" r="7" fill="#4B6787"/>
  <circle cx="615" cy="208" r="7" fill="#6F8D5E"/>
  <circle cx="665" cy="177" r="7" fill="#A67C52"/>
  <circle cx="690" cy="224" r="7" fill="#7F786D"/>
  <text x="627" y="253" text-anchor="middle" class="t s">every target lies in the closure</text>

  <rect x="150" y="282" width="460" height="38" rx="10" class="neutral"/>
  <text x="380" y="306" text-anchor="middle" class="t s">Measurable finite-range functions belong on both sides and make the inclusion dense.</text>

  <rect x="24" y="334" width="712" height="34" rx="10" class="green"/>
  <text x="380" y="356" text-anchor="middle" class="t s">Density passes through the map; no pointwise representative is declared canonical.</text>
</svg>
