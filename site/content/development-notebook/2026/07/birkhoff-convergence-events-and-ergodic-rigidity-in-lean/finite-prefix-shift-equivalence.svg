<svg xmlns="http://www.w3.org/2000/svg" width="920" height="620"
     viewBox="0 0 920 620" role="img"
     aria-labelledby="titlePrefixShift descPrefixShift">
  <title id="titlePrefixShift">Deleting one orbit prefix preserves convergence and its limit</title>
  <desc id="descPrefixShift">Two timelines compare averages based at an orbit point and at its image. The lower timeline deletes the first observation and reweights the remaining prefix. Two arrows show that convergence transports in both directions. A footer states that no boundedness, invertibility, or convergence-existence theorem is used.</desc>
  <rect width="920" height="620" fill="#F7F4F0"/>
  <style>
    .blue{fill:#E8F0F7;stroke:#4B6787;stroke-width:1.7}
    .cream{fill:#FBF9F6;stroke:#C4B8A8;stroke-width:1.7}
    .green{fill:#EAF1E5;stroke:#6F8D5E;stroke-width:1.7}
    .clay{fill:#F3E8E0;stroke:#A67C52;stroke-width:1.7}
    .gray{fill:#EDE8E1;stroke:#7F786D;stroke-width:1.7}
    .axis{stroke:#7F786D;stroke-width:2;fill:none}
    .guide{stroke:#A89B8C;stroke-width:1.5;stroke-dasharray:5 4;fill:none}
    .arrow{stroke:#A67C52;stroke-width:2.5;fill:none}
    .t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#2C2924}
    .title{font-size:18px;font-weight:700}
    .h{font-size:14px;font-weight:700}
    .s{font-size:13px}
    .m{font-size:12px;fill:#5A544C}
  </style>

  <text x="34" y="38" class="t title">One deleted prefix does not decide convergence</text>
  <text x="34" y="62" class="t m">The two average sequences contain the same tail information with vanishing endpoint corrections.</text>

  <text x="34" y="108" class="t h">AVERAGES BASED AT THE ORIGINAL POINT</text>
  <line x1="64" y1="186" x2="856" y2="186" class="axis"/>
  <rect x="78" y="135" width="112" height="102" rx="10" class="clay"/>
  <text x="103" y="166" class="t h">FIRST TERM</text>
  <text x="101" y="207" class="t m">kept at base</text>
  <rect x="214" y="135" width="142" height="102" rx="10" class="blue"/>
  <text x="249" y="166" class="t h">NEXT TERM</text>
  <text x="239" y="207" class="t m">same orbit tail</text>
  <rect x="380" y="135" width="142" height="102" rx="10" class="blue"/>
  <text x="415" y="166" class="t h">NEXT TERM</text>
  <text x="405" y="207" class="t m">same orbit tail</text>
  <rect x="546" y="135" width="142" height="102" rx="10" class="blue"/>
  <text x="581" y="166" class="t h">NEXT TERM</text>
  <text x="571" y="207" class="t m">same orbit tail</text>
  <rect x="712" y="135" width="130" height="102" rx="10" class="gray"/>
  <text x="755" y="166" class="t h">TAIL</text>
  <text x="738" y="207" class="t m">continues onward</text>

  <line x1="134" y1="250" x2="134" y2="322" class="guide"/>
  <text x="64" y="285" class="t m">delete this finite prefix</text>
  <line x1="285" y1="250" x2="285" y2="322" class="guide"/>
  <line x1="451" y1="250" x2="451" y2="322" class="guide"/>
  <line x1="617" y1="250" x2="617" y2="322" class="guide"/>
  <line x1="777" y1="250" x2="777" y2="322" class="guide"/>

  <text x="34" y="357" class="t h">AVERAGES BASED AFTER ONE APPLICATION OF THE MAP</text>
  <line x1="64" y1="431" x2="856" y2="431" class="axis"/>
  <rect x="214" y="380" width="142" height="102" rx="10" class="green"/>
  <text x="249" y="411" class="t h">FIRST TERM</text>
  <text x="234" y="452" class="t m">old second term</text>
  <rect x="380" y="380" width="142" height="102" rx="10" class="green"/>
  <text x="415" y="411" class="t h">NEXT TERM</text>
  <text x="405" y="452" class="t m">same orbit tail</text>
  <rect x="546" y="380" width="142" height="102" rx="10" class="green"/>
  <text x="581" y="411" class="t h">NEXT TERM</text>
  <text x="571" y="452" class="t m">same orbit tail</text>
  <rect x="712" y="380" width="130" height="102" rx="10" class="gray"/>
  <text x="755" y="411" class="t h">TAIL</text>
  <text x="738" y="452" class="t m">continues onward</text>

  <line x1="122" y1="518" x2="432" y2="518" class="arrow"/>
  <polygon points="448,518 432,510 432,526" fill="#A67C52"/>
  <line x1="806" y1="518" x2="488" y2="518" class="arrow"/>
  <polygon points="472,518 488,510 488,526" fill="#A67C52"/>
  <text x="154" y="552" class="t s">convergence moves forward</text>
  <text x="539" y="552" class="t s">convergence moves backward</text>

  <rect x="34" y="571" width="852" height="35" rx="10" class="green"/>
  <text x="77" y="594" class="t s">Same finite real limit in both directions; no boundedness, invertibility, or existence theorem.</text>
</svg>
