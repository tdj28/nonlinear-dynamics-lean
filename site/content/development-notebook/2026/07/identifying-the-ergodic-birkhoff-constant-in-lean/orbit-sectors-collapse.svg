<svg xmlns="http://www.w3.org/2000/svg" width="760" height="410"
     viewBox="0 0 760 410" role="img"
     aria-labelledby="orbitSectorsTitle orbitSectorsDesc">
  <title id="orbitSectorsTitle">Invariant measurable outputs collapse to one value</title>
  <desc id="orbitSectorsDesc">Two separated invariant values on the left become one almost-everywhere value on the right after invariant-set rigidity is imposed. Labels, position, and color all distinguish the cases. The diagram does not claim literal orbit mixing.</desc>
  <rect width="760" height="410" fill="#F7F4F0"/>
  <style>
    .t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#2C2924}
    .title{font-size:15px;font-weight:700}.h{font-size:13px;font-weight:700}
    .s{font-size:12px}.m{font-size:11px;fill:#5A544C}
    .blue{fill:#E8F0F7;stroke:#4B6787;stroke-width:1.5}
    .clay{fill:#F3E8E0;stroke:#A67C52;stroke-width:1.5}
    .green{fill:#EAF1E5;stroke:#6F8D5E;stroke-width:1.5}
    .neutral{fill:#FBF9F6;stroke:#C4B8A8;stroke-width:1.5}
    .arrow{fill:none;stroke:#A67C52;stroke-width:2.2;marker-end:url(#orbitArrow)}
  </style>
  <defs>
    <marker id="orbitArrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#A67C52"/>
    </marker>
  </defs>

  <text x="24" y="28" class="t title">What invariant information can still remember</text>
  <text x="24" y="48" class="t m">Separate invariant values are possible until invariant-set rigidity is assumed.</text>

  <rect x="24" y="72" width="300" height="250" rx="12" class="neutral"/>
  <text x="44" y="98" class="t h">WITHOUT INVARIANT-SET RIGIDITY</text>
  <text x="44" y="118" class="t m">Distinct invariant sectors may retain distinct values.</text>

  <rect x="48" y="138" width="252" height="68" rx="10" class="blue"/>
  <circle cx="76" cy="172" r="13" fill="#4B6787"/>
  <circle cx="108" cy="172" r="9" fill="#4B6787" opacity="0.72"/>
  <text x="132" y="164" class="t h">SECTOR A</text>
  <text x="132" y="184" class="t s">invariant value A</text>

  <rect x="48" y="226" width="252" height="68" rx="10" class="clay"/>
  <circle cx="76" cy="260" r="13" fill="#A67C52"/>
  <circle cx="108" cy="260" r="9" fill="#A67C52" opacity="0.72"/>
  <text x="132" y="252" class="t h">SECTOR B</text>
  <text x="132" y="272" class="t s">invariant value B</text>

  <path d="M 338 188 C 365 188, 382 188, 412 188" class="arrow"/>
  <text x="342" y="171" class="t m">add rigidity</text>

  <rect x="430" y="72" width="306" height="250" rx="12" class="green"/>
  <text x="450" y="98" class="t h">WITH INVARIANT-SET RIGIDITY</text>
  <text x="450" y="118" class="t m">Every measurable invariant output</text>
  <text x="450" y="135" class="t m">is constant almost everywhere.</text>

  <rect x="466" y="154" width="234" height="136" rx="12" fill="#FBF9F6" stroke="#6F8D5E" stroke-width="1.5"/>
  <circle cx="505" cy="198" r="13" fill="#6F8D5E"/>
  <circle cx="542" cy="198" r="10" fill="#6F8D5E" opacity="0.78"/>
  <circle cx="578" cy="198" r="12" fill="#6F8D5E" opacity="0.62"/>
  <circle cx="614" cy="198" r="9" fill="#6F8D5E" opacity="0.48"/>
  <text x="490" y="236" class="t h">ONE INVARIANT VALUE</text>
  <text x="507" y="258" class="t s">outside a null set</text>

  <rect x="24" y="342" width="712" height="48" rx="10" class="green"/>
  <text x="44" y="371" class="t s">Takeaway: the collapse concerns invariant measurable outputs, not literal orbit mixing.</text>
</svg>
