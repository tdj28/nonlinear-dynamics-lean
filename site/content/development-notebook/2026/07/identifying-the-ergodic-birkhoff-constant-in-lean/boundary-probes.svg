<svg xmlns="http://www.w3.org/2000/svg" width="760" height="620"
     viewBox="0 0 760 620" role="img"
     aria-labelledby="boundaryProbesTitle boundaryProbesDesc">
  <title id="boundaryProbesTitle">Five boundary jobs keep every assumption visible</title>
  <desc id="boundaryProbesDesc">Five stacked test cases separate the roles of positive mass, normalization, measure preservation, invertibility, and invariant-set rigidity. Each case has a distinct status label, position, and color.</desc>
  <rect width="760" height="620" fill="#F7F4F0"/>
  <style>
    .t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#2C2924}
    .title{font-size:15px;font-weight:700}.h{font-size:13px;font-weight:700}
    .s{font-size:12px}.m{font-size:11px;fill:#5A544C}.tag{font-size:10px;font-weight:700;letter-spacing:.5px}
    .gray{fill:#EDE8E1;stroke:#7F786D;stroke-width:1.5}
    .green{fill:#EAF1E5;stroke:#6F8D5E;stroke-width:1.5}
    .blue{fill:#E8F0F7;stroke:#4B6787;stroke-width:1.5}
    .cream{fill:#FBF9F6;stroke:#C4B8A8;stroke-width:1.5}
    .clay{fill:#F3E8E0;stroke:#A67C52;stroke-width:1.5}
  </style>

  <text x="24" y="28" class="t title">Five boundary jobs keep every assumption visible</text>
  <text x="24" y="48" class="t m">Mass, normalization, preservation, invertibility, and rigidity are tested separately.</text>

  <rect x="24" y="70" width="712" height="82" rx="10" class="gray"/>
  <rect x="42" y="88" width="92" height="22" rx="11" fill="#7F786D"/>
  <text x="88" y="103" text-anchor="middle" class="t tag" fill="#FFFFFF" style="fill:#FFFFFF">SEPARATE</text>
  <text x="154" y="103" class="t h">ZERO MEASURE</text>
  <text x="154" y="125" class="t s">No division theorem. The almost-everywhere statement is vacuous.</text>
  <text x="598" y="103" class="t m">No mass to cancel</text>

  <rect x="24" y="164" width="712" height="82" rx="10" class="green"/>
  <rect x="42" y="182" width="92" height="22" rx="11" fill="#6F8D5E"/>
  <text x="88" y="197" text-anchor="middle" class="t tag" fill="#FFFFFF" style="fill:#FFFFFF">FULL FINAL</text>
  <text x="154" y="197" class="t h">PROBABILITY POINT MASS, CONSTANT MAP</text>
  <text x="154" y="219" class="t s">Preservation and rigidity hold without injectivity or surjectivity.</text>
  <text x="598" y="197" class="t m">No inverse used</text>

  <rect x="24" y="258" width="712" height="82" rx="10" class="cream"/>
  <rect x="42" y="276" width="92" height="22" rx="11" fill="#C4B8A8"/>
  <text x="88" y="291" text-anchor="middle" class="t tag">IDENTIFY ONLY</text>
  <text x="154" y="291" class="t h">PRE-ERGODIC DIRAC, NOT PRESERVING</text>
  <text x="154" y="313" class="t s">Rigidity identifies the conditional expectation, but the final limit theorem does not apply.</text>
  <text x="598" y="291" class="t m">Support moves</text>

  <rect x="24" y="352" width="712" height="82" rx="10" class="blue"/>
  <rect x="42" y="370" width="92" height="22" rx="11" fill="#4B6787"/>
  <text x="88" y="385" text-anchor="middle" class="t tag" fill="#FFFFFF" style="fill:#FFFFFF">FULL FINAL</text>
  <text x="154" y="385" class="t h">MASS-TWO POINT MASS</text>
  <text x="154" y="407" class="t s">Finite positive nonprobability mass forces the mass factor to be divided out.</text>
  <text x="598" y="385" class="t m">Normalized average</text>

  <rect x="24" y="446" width="712" height="82" rx="10" class="clay"/>
  <rect x="42" y="464" width="92" height="22" rx="11" fill="#A67C52"/>
  <text x="88" y="479" text-anchor="middle" class="t tag" fill="#FFFFFF" style="fill:#FFFFFF">REJECTED</text>
  <text x="154" y="479" class="t h">TWO ATOMS WITH IDENTITY MAP</text>
  <text x="154" y="501" class="t s">Preservation holds, but different invariant values remain.</text>
  <text x="598" y="479" class="t m">Rigidity fails</text>

  <rect x="24" y="550" width="712" height="46" rx="10" class="green"/>
  <text x="44" y="578" class="t s">Takeaway: identification needs rigidity; convergence also needs preservation.</text>
</svg>
