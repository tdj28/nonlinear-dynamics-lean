<svg xmlns="http://www.w3.org/2000/svg" width="760" height="450"
     viewBox="0 0 760 450" role="img"
     aria-labelledby="normalizedBridgeTitle normalizedBridgeDesc">
  <title id="normalizedBridgeTitle">From a constant invariant limit to the normalized space average</title>
  <desc id="normalizedBridgeDesc">A top-to-bottom proof flow integrates the constant limit, preserves the original integral through conditional expectation, and cancels positive total mass. A right-hand branch shows that probability mass removes the normalization. Color, labels, and position distinguish each step.</desc>
  <rect width="760" height="450" fill="#F7F4F0"/>
  <style>
    .t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#2C2924}
    .title{font-size:15px;font-weight:700}.h{font-size:13px;font-weight:700}
    .s{font-size:12px}.m{font-size:11px;fill:#5A544C}.badge{font-size:10px;font-weight:700;letter-spacing:.5px}
    .blue{fill:#E8F0F7;stroke:#4B6787;stroke-width:1.5}
    .cream{fill:#FBF9F6;stroke:#C4B8A8;stroke-width:1.5}
    .green{fill:#EAF1E5;stroke:#6F8D5E;stroke-width:1.5}
    .clay{fill:#F3E8E0;stroke:#A67C52;stroke-width:1.5}
    .arrow{fill:none;stroke:#A67C52;stroke-width:2.2;marker-end:url(#bridgeArrow)}
  </style>
  <defs>
    <marker id="bridgeArrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#A67C52"/>
    </marker>
  </defs>

  <text x="24" y="28" class="t title">The constant is fixed by one integral identity</text>
  <text x="24" y="48" class="t m">Integrability supplies the identity; positive finite mass makes cancellation meaningful.</text>

  <rect x="24" y="78" width="430" height="76" rx="12" class="blue"/>
  <rect x="42" y="94" width="82" height="22" rx="11" fill="#4B6787"/>
  <text x="57" y="109" class="t badge" style="fill:#FFFDF8">STEP ONE</text>
  <text x="142" y="106" class="t h">INTEGRATE THE CONSTANT LIMIT</text>
  <text x="142" y="128" class="t s">Its integral is total mass times the constant.</text>

  <path d="M 239 158 L 239 177" class="arrow"/>

  <rect x="24" y="184" width="430" height="88" rx="12" class="cream"/>
  <rect x="42" y="201" width="82" height="22" rx="11" fill="#A67C52"/>
  <text x="57" y="216" class="t badge" style="fill:#FFFDF8">STEP TWO</text>
  <text x="142" y="213" class="t h">PRESERVE THE ORIGINAL INTEGRAL</text>
  <text x="142" y="235" class="t s">Conditional expectation has the same total integral</text>
  <text x="142" y="253" class="t s">as the integrable observable.</text>

  <path d="M 239 276 L 239 295" class="arrow"/>

  <rect x="24" y="302" width="430" height="82" rx="12" class="green"/>
  <rect x="42" y="320" width="94" height="22" rx="11" fill="#6F8D5E"/>
  <text x="56" y="335" class="t badge" style="fill:#FFFDF8">STEP THREE</text>
  <text x="154" y="333" class="t h">CANCEL POSITIVE TOTAL MASS</text>
  <text x="154" y="355" class="t s">The constant is the normalized space average.</text>

  <path d="M 462 343 C 488 343, 490 155, 512 155" class="arrow"/>
  <rect x="520" y="88" width="216" height="118" rx="12" class="clay"/>
  <text x="540" y="116" class="t h">FINITE POSITIVE MASS</text>
  <text x="540" y="140" class="t s">Divide the integral by</text>
  <text x="540" y="159" class="t s">the total mass.</text>
  <rect x="540" y="174" width="176" height="20" rx="8" fill="#FBF9F6" stroke="#A67C52"/>
  <text x="550" y="188" class="t m">normalized space average</text>

  <path d="M 628 212 L 628 246" class="arrow"/>
  <rect x="520" y="254" width="216" height="130" rx="12" class="green"/>
  <text x="540" y="282" class="t h">PROBABILITY MASS</text>
  <text x="540" y="306" class="t s">Total mass is one, so</text>
  <text x="540" y="325" class="t s">normalization disappears.</text>
  <rect x="540" y="342" width="150" height="24" rx="8" fill="#FBF9F6" stroke="#6F8D5E"/>
  <text x="567" y="359" class="t s">ordinary integral</text>

  <rect x="24" y="402" width="712" height="30" rx="10" class="clay"/>
  <text x="44" y="422" class="t m">Zero mass stays separate because division cannot identify a constant there.</text>
</svg>
