<svg xmlns="http://www.w3.org/2000/svg" width="760" height="450" viewBox="0 0 760 450" role="img" aria-labelledby="rmt32BoundaryTitle rmt32BoundaryDesc">
  <title id="rmt32BoundaryTitle">Compiled boundary probes for the lower-deviation event</title>
  <desc id="rmt32BoundaryDesc">Six labeled cells separate a one-shot event from an arbitrarily-late event, show a nonergodic half-mass event, show an ergodic subprobability event with subunit mass that is still full, check the zero process, inspect a fixed zero slope, and retain the empty matrix-index boundary.</desc>
  <rect width="760" height="450" fill="#F7F4F0"/>
  <style>
    .t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#2C2924}.title{font-size:15px;font-weight:700}.h{font-size:13px;font-weight:700}.s{font-size:12px}.m{font-size:11px;fill:#5A544C}
    .blue{fill:#E8F0F7;stroke:#4B6787;stroke-width:1.5}.cream{fill:#FBF9F6;stroke:#C4B8A8;stroke-width:1.5}.green{fill:#EAF1E5;stroke:#6F8D5E;stroke-width:1.5}.clay{fill:#F3E8E0;stroke:#A67C52;stroke-width:1.5}.gray{fill:#EDE8E1;stroke:#7F786D;stroke-width:1.5}
  </style>
  <text x="24" y="28" class="t title">Boundary probes make each assumption answerable</text>
  <text x="24" y="48" class="t m">Every cell is a conceptual summary of a compiled Lean example, not an empirical result.</text>
  <rect x="30" y="76" width="220" height="104" rx="11" class="clay"/>
  <text x="50" y="101" class="t h">One-shot collapse</text>
  <text x="50" y="127" class="t s">Once-bad: one point</text>
  <text x="50" y="148" class="t s">Strict late event: empty</text>
  <rect x="270" y="76" width="220" height="104" rx="11" class="blue"/>
  <text x="290" y="101" class="t h">Nonergodic identity</text>
  <text x="290" y="127" class="t s">Strict event: one atom</text>
  <text x="290" y="148" class="t s">Mass: one half</text>
  <rect x="510" y="76" width="220" height="104" rx="11" class="green"/>
  <text x="530" y="101" class="t h">Ergodic half-Dirac</text>
  <text x="530" y="127" class="t s">Strict event: full space</text>
  <text x="530" y="148" class="t s">Subunit mass still full</text>
  <rect x="30" y="202" width="220" height="104" rx="11" class="cream"/>
  <text x="50" y="227" class="t h">Zero process</text>
  <text x="50" y="253" class="t s">Negative target</text>
  <text x="50" y="274" class="t s">Strict event: empty</text>
  <rect x="270" y="202" width="220" height="104" rx="11" class="gray"/>
  <text x="290" y="227" class="t h">Fixed zero slope</text>
  <text x="290" y="253" class="t s">Tests raw fixed-margin</text>
  <text x="290" y="274" class="t s">membership semantics</text>
  <rect x="510" y="202" width="220" height="104" rx="11" class="blue"/>
  <text x="530" y="227" class="t h">Empty matrix index</text>
  <text x="530" y="253" class="t s">Cocycle wrapper still</text>
  <text x="530" y="274" class="t s">typechecks at zero dimension</text>
  <rect x="58" y="330" width="644" height="58" rx="11" class="cream"/>
  <text x="81" y="354" class="t h">The decisive separation</text>
  <text x="81" y="376" class="t m">Finite-measure rigidity and probability branch selection are tested by different models.</text>
  <rect x="20" y="405" width="720" height="28" rx="9" class="green"/>
  <text x="49" y="424" class="t s">Takeaway: the probes reject hidden invariance, normalization, and nonempty-dimension assumptions.</text>
</svg>
