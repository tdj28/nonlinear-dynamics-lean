<svg xmlns="http://www.w3.org/2000/svg" width="760" height="410" viewBox="0 0 760 410" role="img" aria-labelledby="rmt32ShiftTitle rmt32ShiftDesc">
  <title id="rmt32ShiftTitle">A one-step shift needs a relaxed slope</title>
  <desc id="rmt32ShiftDesc">A witness after shifting the base point is pulled back to an original-point witness one time step later. Centered subadditivity controls the added endpoint. A slightly larger rational slope absorbs that endpoint for all sufficiently late witnesses.</desc>
  <rect width="760" height="410" fill="#F7F4F0"/>
  <style>
    .t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#2C2924}.title{font-size:15px;font-weight:700}.h{font-size:13px;font-weight:700}.s{font-size:12px}.m{font-size:11px;fill:#5A544C}
    .blue{fill:#E8F0F7;stroke:#4B6787;stroke-width:1.5}.cream{fill:#FBF9F6;stroke:#C4B8A8;stroke-width:1.5}.green{fill:#EAF1E5;stroke:#6F8D5E;stroke-width:1.5}.clay{fill:#F3E8E0;stroke:#A67C52;stroke-width:1.5}
  </style>
  <text x="24" y="28" class="t title">Pull a late witness back through one time step</text>
  <text x="24" y="48" class="t m">The shift changes both the witness length and the threshold budget.</text>
  <rect x="34" y="82" width="194" height="104" rx="12" class="blue"/>
  <text x="57" y="111" class="t h">Shifted point</text>
  <text x="57" y="137" class="t s">Choose a witness later</text>
  <text x="57" y="157" class="t s">than both cutoffs.</text>
  <path d="M228 134 L280 134" stroke="#A67C52" stroke-width="3"/>
  <path d="M271 126 L284 134 L271 142" fill="#A67C52"/>
  <rect x="286" y="82" width="194" height="104" rx="12" class="cream"/>
  <text x="309" y="111" class="t h">Centered split</text>
  <text x="309" y="137" class="t s">Move to the original point</text>
  <text x="309" y="157" class="t s">and add one to the length.</text>
  <path d="M480 134 L532 134" stroke="#A67C52" stroke-width="3"/>
  <path d="M523 126 L536 134 L523 142" fill="#A67C52"/>
  <rect x="538" y="82" width="188" height="104" rx="12" class="green"/>
  <text x="561" y="111" class="t h">Relaxed lane</text>
  <text x="561" y="137" class="t s">A slightly larger slope</text>
  <text x="561" y="157" class="t s">pays for the endpoint.</text>
  <rect x="94" y="221" width="572" height="92" rx="12" class="clay"/>
  <text x="119" y="248" class="t h">Why the relaxation is eventually enough</text>
  <text x="119" y="274" class="t s">The slope gap grows with witness length. The one-step endpoint cost does not.</text>
  <text x="119" y="295" class="t m">An Archimedean cutoff makes this comparison uniform for every later witness.</text>
  <rect x="20" y="350" width="720" height="34" rx="9" class="green"/>
  <text x="45" y="372" class="t s">Takeaway: fixed-slope invariance is not claimed; the countable target union restores one-sided stability.</text>
</svg>
