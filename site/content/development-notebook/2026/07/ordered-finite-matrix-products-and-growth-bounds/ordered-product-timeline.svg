<svg xmlns="http://www.w3.org/2000/svg" width="760" height="350"
     viewBox="0 0 760 350" role="img" aria-labelledby="titleTimeline descTimeline">
  <title id="titleTimeline">Chronological action and written product order</title>
  <desc id="descTimeline">An initial vector passes through the earliest, middle, and newest matrix in chronological order. A lower strip explains that written composition places the later shifted block to the left of the earlier prefix.</desc>
  <rect width="760" height="350" fill="#F7F4F0"/>
  <style>
    .card{fill:#E8F0F7;stroke:#4B6787;stroke-width:1.5}
    .neutral{fill:#FBF9F6;stroke:#C4B8A8;stroke-width:1.5}
    .latest{fill:#F3E8E0;stroke:#A67C52;stroke-width:1.5}
    .footer{fill:#EAF1E5;stroke:#6F8D5E;stroke-width:1.5}
    .arrow{stroke:#A67C52;stroke-width:2.5;fill:none}
    .t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#2C2924}
    .title{font-size:15px;font-weight:700}
    .h{font-size:13px;font-weight:700}
    .s{font-size:12px}
    .m{font-size:11px;fill:#5A544C}
  </style>
  <text x="24" y="28" class="t title">A forward product acts in chronological order</text>
  <text x="24" y="48" class="t m">The first matrix touches the vector first; the newest matrix completes the finite horizon.</text>

  <rect x="24" y="86" width="126" height="122" rx="12" class="neutral"/>
  <text x="50" y="119" class="t h">INITIAL STATE</text>
  <text x="63" y="152" class="t s">time zero</text>
  <text x="45" y="181" class="t m">nothing has acted</text>

  <line x1="158" y1="147" x2="190" y2="147" class="arrow"/>
  <polygon points="200,147 187,139 187,155" fill="#A67C52"/>

  <rect x="208" y="86" width="126" height="122" rx="12" class="card"/>
  <text x="239" y="119" class="t h">EARLIEST</text>
  <text x="237" y="152" class="t s">first update</text>
  <text x="230" y="181" class="t m">acts nearest state</text>

  <line x1="342" y1="147" x2="374" y2="147" class="arrow"/>
  <polygon points="384,147 371,139 371,155" fill="#A67C52"/>

  <rect x="392" y="86" width="126" height="122" rx="12" class="card"/>
  <text x="423" y="119" class="t h">MIDDLE</text>
  <text x="421" y="152" class="t s">next update</text>
  <text x="418" y="181" class="t m">continues the orbit</text>

  <line x1="526" y1="147" x2="558" y2="147" class="arrow"/>
  <polygon points="568,147 555,139 555,155" fill="#A67C52"/>

  <rect x="576" y="86" width="160" height="122" rx="12" class="latest"/>
  <text x="624" y="119" class="t h">NEWEST</text>
  <text x="614" y="152" class="t s">final update</text>
  <text x="599" y="181" class="t m">written on the left</text>

  <rect x="24" y="238" width="712" height="76" rx="12" class="footer"/>
  <text x="48" y="270" class="t h">SPLIT RULE</text>
  <text x="48" y="295" class="t s">The later shifted block is written left of the earlier prefix because it acts afterward.</text>
  <text x="598" y="295" class="t m">finite time only</text>
</svg>
