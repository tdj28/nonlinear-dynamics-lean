<svg xmlns="http://www.w3.org/2000/svg" width="920" height="610" viewBox="0 0 920 610" role="img" aria-labelledby="realTitle realDesc">
  <title id="realTitle">Extended measure is continuous from below, while a finite target gives a safe real conversion</title>
  <desc id="realDesc">Two parallel lanes compare measure representations. The upper lane keeps extended nonnegative real values, including infinity, so increasing finite-stage measures converge to the union measure without a finiteness premise. The lower lane applies the real projection. Finite values convert faithfully, but infinite union mass converts to zero, so convergence can fail. Local finite mass supplies a clean sufficient route through the real projection, not a necessary condition for every particular sequence.</desc>
  <rect width="920" height="610" fill="#F7F4F0"/>
  <style>
    .t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#2C2924}
    .title{font-size:15px;font-weight:700}.h{font-size:13px;font-weight:700}
    .s{font-size:12px}.m{font-size:11px;fill:#5A544C}
    .blue{fill:#E8F0F7;stroke:#4B6787;stroke-width:1.5}
    .cream{fill:#FBF9F6;stroke:#C4B8A8;stroke-width:1.5}
    .clay{fill:#F3E8E0;stroke:#A67C52;stroke-width:1.5}
    .green{fill:#EAF1E5;stroke:#6F8D5E;stroke-width:1.5}
    .gray{fill:#EDE8E1;stroke:#7F786D;stroke-width:1.5}
    .arrow{fill:none;stroke:#A67C52;stroke-width:2.5}
  </style>
  <text x="24" y="28" class="t title">The codomain decides whether continuity survives infinite mass</text>
  <text x="24" y="48" class="t m">The event sets are the same in both lanes. Only the representation of their measures changes.</text>

  <rect class="blue" x="24" y="82" width="872" height="190" rx="12"/>
  <text x="48" y="114" class="t h">EXTENDED NONNEGATIVE REAL MEASURE</text>
  <rect class="cream" x="48" y="140" width="218" height="82" rx="10"/>
  <text x="70" y="170" class="t s">finite-stage measures</text>
  <text x="70" y="194" class="t m">increasing with the horizon</text>
  <path class="arrow" d="M 278 181 L 346 181"/>
  <polygon points="360,181 344,172 344,190" fill="#A67C52"/>
  <rect class="cream" x="360" y="140" width="218" height="82" rx="10"/>
  <text x="382" y="170" class="t s">limit in the extended</text>
  <text x="382" y="194" class="t m">nonnegative real numbers</text>
  <path class="arrow" d="M 590 181 L 658 181"/>
  <polygon points="672,181 656,172 656,190" fill="#A67C52"/>
  <rect class="green" x="672" y="140" width="200" height="82" rx="10"/>
  <text x="694" y="170" class="t s">union measure</text>
  <text x="694" y="194" class="t m">infinity remains visible</text>
  <text x="48" y="250" class="t s">Continuity from below needs monotonicity, but no event measurability and no finite-mass premise.</text>

  <rect class="clay" x="24" y="296" width="872" height="226" rx="12"/>
  <text x="48" y="328" class="t h">REAL-VALUED PROJECTION</text>
  <rect class="cream" x="48" y="354" width="218" height="82" rx="10"/>
  <text x="70" y="384" class="t s">finite-stage real values</text>
  <text x="70" y="408" class="t m">finite masses convert faithfully</text>
  <path class="arrow" d="M 278 395 L 346 395"/>
  <polygon points="360,395 344,386 344,404" fill="#A67C52"/>
  <rect class="gray" x="360" y="354" width="218" height="82" rx="10"/>
  <text x="382" y="384" class="t s">unbounded growth</text>
  <text x="382" y="408" class="t m">finite ranges under counting measure</text>
  <path class="arrow" d="M 590 395 L 658 395"/>
  <polygon points="672,395 656,386 656,404" fill="#A67C52"/>
  <rect class="clay" x="672" y="354" width="200" height="82" rx="10"/>
  <text x="694" y="384" class="t s">union projects to zero</text>
  <text x="694" y="408" class="t m">infinite mass is totalized</text>
  <text x="48" y="466" class="t s">The real sequence need not converge to the real projection of the union measure.</text>
  <rect class="green" x="48" y="482" width="824" height="26" rx="7"/>
  <text x="69" y="500" class="t m">Clean sufficient route: a finite event target makes toReal continuous here; this is not an if-and-only-if condition.</text>

  <rect class="green" x="24" y="546" width="872" height="40" rx="10"/>
  <text x="47" y="571" class="t s">Takeaway: prove the extended limit first; use a finite target for the reusable real corollary and inspect infinite targets separately.</text>
</svg>
