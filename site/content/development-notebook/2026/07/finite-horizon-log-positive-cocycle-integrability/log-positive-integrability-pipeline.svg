<svg xmlns="http://www.w3.org/2000/svg" width="820" height="520"
     viewBox="0 0 820 520" role="img"
     aria-labelledby="titleLogPlusPipeline descLogPlusPipeline">
  <title id="titleLogPlusPipeline">Finite-horizon log-positive integrability pipeline</title>
  <desc id="descLogPlusPipeline">A prose-only diagram. A one-step expansion envelope is observed at successive points of a measure-preserving base orbit. The terms enter a finite orbit sum, which is integrable and dominates the whole-product envelope at the same finite horizon. Contraction and singular collapse both contribute zero, and no asymptotic conclusion is shown.</desc>
  <rect width="820" height="520" fill="#F7F4F0"/>
  <style>
    .paper{fill:#FBF9F6;stroke:#C4B8A8;stroke-width:1.5}
    .blue{fill:#E8F0F7;stroke:#4B6787;stroke-width:1.5}
    .green{fill:#EAF1E5;stroke:#6F8D5E;stroke-width:1.5}
    .rust{fill:#F3E8E0;stroke:#A67C52;stroke-width:1.5}
    .muted{fill:#EDE8E1;stroke:#7F786D;stroke-width:1.5}
    .arrow{stroke:#A67C52;stroke-width:2.5;fill:none}
    .dash{stroke:#A89B8C;stroke-width:1.5;stroke-dasharray:5 4;fill:none}
    .t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#2C2924}
    .title{font-size:16px;font-weight:700}
    .h{font-size:12px;font-weight:700}
    .s{font-size:12px}
    .m{font-size:11px;fill:#5A544C}
  </style>

  <text x="28" y="31" class="t title">One integrable expansion budget controls every fixed finite horizon</text>
  <text x="28" y="51" class="t m">Move the same one-step observable along a measure-preserving orbit, add finitely many copies, then dominate.</text>

  <rect x="28" y="84" width="180" height="168" rx="13" class="rust"/>
  <text x="54" y="113" class="t h">ONE-STEP ENVELOPE</text>
  <rect x="49" y="133" width="138" height="40" rx="8" class="paper"/>
  <text x="69" y="151" class="t s">expansion above one</text>
  <text x="82" y="166" class="t m">keeps its log cost</text>
  <rect x="49" y="187" width="138" height="40" rx="8" class="paper"/>
  <text x="68" y="205" class="t s">contraction or collapse</text>
  <text x="88" y="220" class="t m">becomes zero cost</text>

  <line x1="216" y1="168" x2="246" y2="168" class="arrow"/>
  <polygon points="256,168 243,160 243,176" fill="#A67C52"/>

  <rect x="264" y="84" width="282" height="168" rx="13" class="blue"/>
  <text x="337" y="113" class="t h">BASE-ORBIT OBSERVATIONS</text>
  <rect x="285" y="137" width="72" height="50" rx="8" class="paper"/>
  <rect x="369" y="137" width="72" height="50" rx="8" class="paper"/>
  <rect x="453" y="137" width="72" height="50" rx="8" class="paper"/>
  <text x="300" y="157" class="t s">current</text>
  <text x="300" y="174" class="t m">base point</text>
  <text x="385" y="157" class="t s">after one</text>
  <text x="382" y="174" class="t m">base step</text>
  <text x="468" y="157" class="t s">after two</text>
  <text x="466" y="174" class="t m">base steps</text>
  <path d="M 321 196 L 321 215 L 489 215 L 489 196" class="dash"/>
  <text x="322" y="236" class="t m">every iterate preserves the same measure</text>

  <line x1="554" y1="168" x2="584" y2="168" class="arrow"/>
  <polygon points="594,168 581,160 581,176" fill="#A67C52"/>

  <rect x="602" y="84" width="190" height="168" rx="13" class="green"/>
  <text x="642" y="113" class="t h">FINITE ORBIT SUM</text>
  <rect x="623" y="137" width="148" height="50" rx="8" class="paper"/>
  <text x="653" y="157" class="t s">add one cost from</text>
  <text x="655" y="174" class="t s">each visited point</text>
  <rect x="623" y="199" width="148" height="30" rx="8" class="muted"/>
  <text x="645" y="219" class="t m">finite sum is integrable</text>

  <path d="M 697 260 L 697 294 L 410 294 L 410 323" class="arrow"/>
  <polygon points="410,333 402,320 418,320" fill="#A67C52"/>

  <rect x="180" y="342" width="460" height="96" rx="14" class="paper"/>
  <text x="280" y="373" class="t h">WHOLE-PRODUCT ENVELOPE AT THE SAME HORIZON</text>
  <text x="243" y="397" class="t s">nonnegative and measurable, bounded above by the finite orbit sum</text>
  <text x="278" y="419" class="t m">domination supplies integrability for each fixed horizon</text>

  <rect x="28" y="464" width="764" height="34" rx="10" class="rust"/>
  <text x="104" y="486" class="t s">Finite horizon only: no probability, ergodicity, normalized limit, Lyapunov exponent, or invariant splitting.</text>
</svg>
