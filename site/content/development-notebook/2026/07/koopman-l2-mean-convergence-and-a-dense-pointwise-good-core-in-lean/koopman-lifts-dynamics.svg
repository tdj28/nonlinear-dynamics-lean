<svg xmlns="http://www.w3.org/2000/svg" width="920" height="540" viewBox="0 0 920 540" role="img" aria-labelledby="koopmanTitle koopmanDesc">
  <title id="koopmanTitle">Koopman composition turns state evolution into a linear action on observables</title>
  <desc id="koopmanDesc">The lower lane shows a state moving under a possibly nonlinear and noninvertible map. The upper lane shows an observable pulled back by composition. Addition and scalar multiplication are preserved in the observable lane, even though the state map need not be linear. Measure preservation makes this action a contraction on square-integrable observables.</desc>
  <rect width="920" height="540" fill="#F7F4F0"/>
  <style>
    .t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#2C2924}
    .title{font-size:15px;font-weight:700}.h{font-size:13px;font-weight:700}
    .s{font-size:12px}.m{font-size:11px;fill:#5A544C}
    .blue{fill:#E8F0F7;stroke:#4B6787;stroke-width:1.5}
    .cream{fill:#FBF9F6;stroke:#C4B8A8;stroke-width:1.5}
    .clay{fill:#F3E8E0;stroke:#A67C52;stroke-width:1.5}
    .green{fill:#EAF1E5;stroke:#6F8D5E;stroke-width:1.5}
    .gray{fill:#EDE8E1;stroke:#7F786D;stroke-width:1.5}
    .arrow{fill:none;stroke:#A67C52;stroke-width:3}
  </style>
  <text x="24" y="28" class="t title">Move the dynamics from states to observables</text>
  <text x="24" y="48" class="t m">The state map may be nonlinear or noninvertible; composition is linear in the observable.</text>

  <rect class="cream" x="44" y="86" width="832" height="168" rx="12"/>
  <text x="68" y="116" class="t h">OBSERVABLE LANE: SQUARE-INTEGRABLE FUNCTIONS</text>
  <rect class="blue" x="86" y="142" width="220" height="72" rx="10"/>
  <text x="112" y="172" class="t h">observable before pullback</text>
  <text x="112" y="195" class="t m">read a real value from each state</text>
  <path class="arrow" d="M326 178 L430 178"/>
  <polygon points="430,178 413,169 413,187" fill="#A67C52"/>
  <rect class="clay" x="448" y="142" width="182" height="72" rx="10"/>
  <text x="478" y="172" class="t h">compose with the map</text>
  <text x="478" y="195" class="t m">evaluate after one step</text>
  <path class="arrow" d="M650 178 L728 178"/>
  <polygon points="728,178 711,169 711,187" fill="#A67C52"/>
  <rect class="green" x="746" y="142" width="98" height="72" rx="10"/>
  <text x="768" y="172" class="t h">pulled back</text>
  <text x="765" y="195" class="t m">same space</text>

  <rect class="gray" x="44" y="278" width="832" height="156" rx="12"/>
  <text x="68" y="308" class="t h">STATE LANE: ONE ORBIT STEP</text>
  <circle cx="164" cy="366" r="35" fill="#E8F0F7" stroke="#4B6787" stroke-width="1.5"/>
  <text x="139" y="371" class="t h">state</text>
  <path class="arrow" d="M220 366 C330 306, 468 426, 594 366"/>
  <polygon points="594,366 576,359 578,378" fill="#A67C52"/>
  <text x="331" y="340" class="t s">one application of the base map</text>
  <text x="322" y="403" class="t m">no linearity or inverse is assumed</text>
  <circle cx="658" cy="366" r="35" fill="#F3E8E0" stroke="#A67C52" stroke-width="1.5"/>
  <text x="633" y="371" class="t h">next</text>
  <rect class="cream" x="724" y="330" width="120" height="72" rx="10"/>
  <text x="744" y="358" class="t h">preserves</text>
  <text x="744" y="379" class="t m">the measure</text>

  <rect class="green" x="24" y="474" width="872" height="42" rx="10"/>
  <text x="48" y="500" class="t s">Takeaway: measure preservation controls the square-integrable norm; linearity comes from composition acting on functions.</text>
</svg>
