<svg xmlns="http://www.w3.org/2000/svg" width="760" height="390"
     viewBox="0 0 760 390" role="img" aria-labelledby="titlePipeline descPipeline">
  <title id="titlePipeline">From realized factors to a certified finite product law</title>
  <desc id="descPipeline">Four connected regions show outcome-wise factors becoming an ordered sample product, a used-prefix measurability certificate, a pushforward law, and an optional mass-one wrapper supplied by a probability source.</desc>
  <rect width="760" height="390" fill="#F7F4F0"/>
  <style>
    .data{fill:#E8F0F7;stroke:#4B6787;stroke-width:1.5}
    .proof{fill:#F3E8E0;stroke:#A67C52;stroke-width:1.5}
    .law{fill:#EAF1E5;stroke:#6F8D5E;stroke-width:1.5}
    .neutral{fill:#FBF9F6;stroke:#C4B8A8;stroke-width:1.5}
    .arrow{stroke:#A67C52;stroke-width:2.5;fill:none}
    .t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#2C2924}
    .title{font-size:15px;font-weight:700}
    .h{font-size:12px;font-weight:700}
    .s{font-size:12px}
    .m{font-size:11px;fill:#5A544C}
  </style>
  <text x="24" y="28" class="t title">A finite random-matrix product becomes a law in stages</text>
  <text x="24" y="48" class="t m">Pointwise algebra comes first; regularity evidence licenses the measure-level name.</text>

  <rect x="24" y="82" width="154" height="154" rx="12" class="neutral"/>
  <text x="51" y="113" class="t h">REALIZED FACTORS</text>
  <rect x="49" y="134" width="104" height="30" rx="7" class="data"/>
  <rect x="49" y="173" width="104" height="30" rx="7" class="data"/>
  <text x="72" y="154" class="t s">early factor</text>
  <text x="69" y="193" class="t s">newest factor</text>
  <text x="49" y="220" class="t m">one shared outcome</text>

  <line x1="186" y1="159" x2="207" y2="159" class="arrow"/>
  <polygon points="217,159 204,151 204,167" fill="#A67C52"/>

  <rect x="225" y="82" width="154" height="154" rx="12" class="data"/>
  <text x="246" y="113" class="t h">ORDERED PRODUCT</text>
  <text x="249" y="151" class="t s">earliest acts first</text>
  <text x="243" y="177" class="t s">newest written left</text>
  <rect x="250" y="196" width="104" height="24" rx="7" class="neutral"/>
  <text x="271" y="212" class="t m">finite horizon</text>

  <line x1="387" y1="159" x2="408" y2="159" class="arrow"/>
  <polygon points="418,159 405,151 405,167" fill="#A67C52"/>

  <rect x="426" y="82" width="154" height="154" rx="12" class="proof"/>
  <text x="445" y="113" class="t h">PREFIX CERTIFICATE</text>
  <text x="450" y="151" class="t s">check every factor</text>
  <text x="454" y="177" class="t s">the horizon uses</text>
  <rect x="440" y="196" width="126" height="24" rx="7" class="neutral"/>
  <text x="448" y="212" class="t m">ordinary measurable</text>

  <line x1="588" y1="159" x2="609" y2="159" class="arrow"/>
  <polygon points="619,159 606,151 606,167" fill="#A67C52"/>

  <rect x="627" y="82" width="109" height="154" rx="12" class="law"/>
  <text x="648" y="113" class="t h">LAW</text>
  <text x="646" y="151" class="t s">push source</text>
  <text x="643" y="177" class="t s">mass forward</text>
  <text x="645" y="211" class="t m">matrix space</text>

  <rect x="24" y="266" width="712" height="82" rx="12" class="law"/>
  <text x="48" y="298" class="t h">PROBABILITY SOURCE</text>
  <text x="208" y="298" class="t s">preserves total mass one</text>
  <text x="48" y="327" class="t m">The wrapper records mass one only. It adds no independence, factorization, or long-time behavior.</text>
</svg>
