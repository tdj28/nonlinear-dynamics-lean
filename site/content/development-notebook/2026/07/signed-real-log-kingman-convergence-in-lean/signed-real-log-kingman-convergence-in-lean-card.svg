<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Signed Real-Log Kingman Convergence in Lean</title>
  <desc id="desc">A social card with three signed scalar boundary rates and a liminf-limsup squeeze to a finite Fekete rate.</desc>
  <rect width="1200" height="630" fill="#f6efe1"/>
  <rect x="36" y="36" width="1128" height="558" rx="30" fill="#fbf8f0" stroke="#315f63" stroke-width="4"/>
  <text x="78" y="105" font-family="Arial,sans-serif" font-size="22" letter-spacing="3" fill="#7a4d69">RMT–35 · CHECKED LEAN MILESTONE</text>
  <text x="78" y="170" font-family="Georgia,serif" font-size="46" fill="#23343b">Signed Real-Log Kingman Convergence</text>
  <text x="78" y="213" font-family="Arial,sans-serif" font-size="24" fill="#536165">contraction · neutral · expansion</text>
  <g font-family="Arial,sans-serif" text-anchor="middle">
    <rect x="78" y="265" width="250" height="150" rx="22" fill="#e8f0ee"/><text x="203" y="315" font-size="23" fill="#315f63">exp(−1)</text><text x="203" y="375" font-size="46" font-weight="700" fill="#b24b40">−1</text>
    <rect x="365" y="265" width="250" height="150" rx="22" fill="#f0eadc"/><text x="490" y="315" font-size="23" fill="#8a6d38">1</text><text x="490" y="375" font-size="46" font-weight="700" fill="#8a6d38">0</text>
    <rect x="652" y="265" width="250" height="150" rx="22" fill="#efe9e4"/><text x="777" y="315" font-size="23" fill="#7a4d69">exp(1)</text><text x="777" y="375" font-size="46" font-weight="700" fill="#7a4d69">1</text>
  </g>
  <path d="M925 300 H1090 M925 380 H1090" stroke="#315f63" stroke-width="5"/>
  <path d="M955 380 L1010 340 L1060 300" fill="none" stroke="#b24b40" stroke-width="8"/>
  <text x="1008" y="447" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#536165">liminf = limsup = λ</text>
  <text x="78" y="525" font-family="Georgia,serif" font-size="28" fill="#23343b">inverse-tail lower control + subadditive Fekete rate + two samplewise rails</text>
  <text x="78" y="562" font-family="Arial,sans-serif" font-size="19" fill="#7a4d69">public working note · professional review pending</text>
</svg>
