<svg xmlns="http://www.w3.org/2000/svg" width="760" height="500" viewBox="0 0 760 500" role="img" aria-labelledby="residueLanesTitle residueLanesDesc">
  <title id="residueLanesTitle">Every arithmetic residue lane is controlled</title>
  <desc id="residueLanesDesc">For a toy block length of three, three lanes collect horizons with remainders zero, one, and two. Finite phase averaging controls each lane, then the three eventual statements recombine into a complete-sequence upper limsup bound using ordinary-map averages.</desc>
  <rect width="760" height="500" fill="#F7F4F0"/>
  <style>.t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#2C2924}.title{font-size:18px;font-weight:700}.h{font-size:14px;font-weight:700}.s{font-size:12px}.m{font-size:11px;fill:#5A544C}.blue{fill:#E8F0F7;stroke:#4B6787;stroke-width:1.5}.green{fill:#EAF1E5;stroke:#6F8D5E;stroke-width:1.5}.clay{fill:#F3E8E0;stroke:#A67C52;stroke-width:1.5}.cream{fill:#FBF9F6;stroke:#C4B8A8;stroke-width:1.5}.arrow{fill:none;stroke:#A67C52;stroke-width:2.2;marker-end:url(#laneArrow)}</style>
  <defs><marker id="laneArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#A67C52"/></marker></defs>
  <text x="24" y="30" class="t title">A block of three creates three residue lanes</text><text x="24" y="51" class="t m">The toy labels show horizons only; they are not measured data.</text>
  <rect x="24" y="80" width="712" height="82" rx="12" class="blue"/><text x="46" y="110" class="t h">REMAINDER ZERO</text><text x="210" y="110" class="t s">horizons 3, 6, 9, 12</text><text x="210" y="137" class="t m">complete blocks</text>
  <rect x="24" y="178" width="712" height="82" rx="12" class="cream"/><text x="46" y="208" class="t h">REMAINDER ONE</text><text x="210" y="208" class="t s">horizons 4, 7, 10, 13</text><text x="210" y="235" class="t m">one boundary step after complete blocks</text>
  <rect x="24" y="276" width="712" height="82" rx="12" class="clay"/><text x="46" y="306" class="t h">REMAINDER TWO</text><text x="210" y="306" class="t s">horizons 5, 8, 11, 14</text><text x="210" y="333" class="t m">two boundary steps after complete blocks</text>
  <path d="M250 366V396H350" class="arrow"/><path d="M510 366V396H410" class="arrow"/>
  <rect x="126" y="410" width="508" height="66" rx="13" class="green"/><text x="380" y="438" text-anchor="middle" class="t h">RECOMBINE THE COMPLETE SEQUENCE</text><text x="380" y="460" text-anchor="middle" class="t s">All lanes share one fixed-block ceiling under the original map.</text>
</svg>
