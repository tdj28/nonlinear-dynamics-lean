<svg xmlns="http://www.w3.org/2000/svg" width="760" height="470" viewBox="0 0 760 470" role="img" aria-labelledby="probabilityBoundaryTitle probabilityBoundaryDesc">
  <title id="probabilityBoundaryTitle">Probability mass is the scaling boundary</title>
  <desc id="probabilityBoundaryDesc">Rescaling a finite measure leaves a pointwise orbit rate unchanged but rescales the raw integral. At probability mass one the raw integral has the matching scale. For general finite positive mass, a normalized average would be required instead.</desc>
  <rect width="760" height="470" fill="#F7F4F0"/>
  <style>.t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#2C2924}.title{font-size:18px;font-weight:700}.h{font-size:14px;font-weight:700}.s{font-size:12px}.m{font-size:11px;fill:#5A544C}.blue{fill:#E8F0F7;stroke:#4B6787;stroke-width:1.5}.green{fill:#EAF1E5;stroke:#6F8D5E;stroke-width:1.5}.clay{fill:#F3E8E0;stroke:#A67C52;stroke-width:1.5}.cream{fill:#FBF9F6;stroke:#C4B8A8;stroke-width:1.5}</style>
  <text x="24" y="30" class="t title">A raw integral matches a samplewise rate only at probability scale</text><text x="24" y="51" class="t m">Changing the measure mass changes one side of the proposed comparison.</text>
  <rect x="24" y="82" width="344" height="166" rx="14" class="blue"/><text x="48" y="112" class="t h">SAMPLEWISE ORBIT RATE</text><text x="48" y="146" class="t s">Depends on the orbit and observable.</text><text x="48" y="174" class="t s">Rescale the reference measure:</text><text x="48" y="202" class="t h">THE RATE STAYS THE SAME</text><text x="48" y="228" class="t m">No raw measure mass appears.</text>
  <rect x="392" y="82" width="344" height="166" rx="14" class="clay"/><text x="416" y="112" class="t h">RAW BLOCK INTEGRAL</text><text x="416" y="146" class="t s">Depends linearly on measure mass.</text><text x="416" y="174" class="t s">Rescale the reference measure:</text><text x="416" y="202" class="t h">THE INTEGRAL RESCALES</text><text x="416" y="228" class="t m">This can break an unnormalized bound.</text>
  <rect x="24" y="276" width="344" height="118" rx="14" class="green"/><text x="48" y="307" class="t h">PROBABILITY MASS ONE</text><text x="48" y="338" class="t s">The raw integral is already normalized.</text><text x="48" y="366" class="t m">This is the checked theorem boundary.</text>
  <rect x="392" y="276" width="344" height="118" rx="14" class="cream"/><text x="416" y="307" class="t h">GENERAL FINITE POSITIVE MASS</text><text x="416" y="338" class="t s">Divide by total mass to compare scales.</text><text x="416" y="366" class="t m">That normalized variant is not this theorem.</text>
  <rect x="24" y="416" width="712" height="34" rx="10" class="clay"/><text x="380" y="438" text-anchor="middle" class="t s">Probability is analytic content, not a cosmetic specialization.</text>
</svg>
