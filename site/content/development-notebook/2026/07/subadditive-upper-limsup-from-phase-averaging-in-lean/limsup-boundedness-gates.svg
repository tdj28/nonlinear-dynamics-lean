<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img" aria-labelledby="boundedGatesTitle boundedGatesDesc">
  <title id="boundedGatesTitle">Two boundedness gates make the real-valued limsup usable</title>
  <desc id="boundedGatesDesc">The lower gate comes from pointwise nonnegativity. The upper gate comes from the one-step Birkhoff majorant. Together they permit a real-valued upper limsup argument, but they do not prove convergence.</desc>
  <rect width="760" height="430" fill="#F7F4F0"/>
  <style>.t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#2C2924}.title{font-size:18px;font-weight:700}.h{font-size:14px;font-weight:700}.s{font-size:12px}.m{font-size:11px;fill:#5A544C}.blue{fill:#E8F0F7;stroke:#4B6787;stroke-width:1.5}.green{fill:#EAF1E5;stroke:#6F8D5E;stroke-width:1.5}.clay{fill:#F3E8E0;stroke:#A67C52;stroke-width:1.5}.arrow{fill:none;stroke:#A67C52;stroke-width:2.2;marker-end:url(#gateArrow)}</style>
  <defs><marker id="gateArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#A67C52"/></marker></defs>
  <text x="24" y="30" class="t title">A real-valued limsup needs two eventual bounds</text><text x="24" y="51" class="t m">The hypotheses do analytic work before the fixed-block estimate begins.</text>
  <rect x="24" y="84" width="330" height="126" rx="14" class="green"/><text x="48" y="113" class="t h">LOWER BOUNDEDNESS GATE</text><text x="48" y="142" class="t s">Pointwise nonnegativity keeps every</text><text x="48" y="162" class="t s">normalized value above the floor.</text><text x="48" y="190" class="t m">This assumption is not bookkeeping.</text>
  <rect x="406" y="84" width="330" height="126" rx="14" class="blue"/><text x="430" y="113" class="t h">UPPER BOUNDEDNESS GATE</text><text x="430" y="142" class="t s">The one-step Birkhoff majorant gives</text><text x="430" y="162" class="t s">an eventual ceiling under the original map.</text><text x="430" y="190" class="t m">Integrability makes the ceiling finite.</text>
  <path d="M189 214V256H350" class="arrow"/><path d="M571 214V256H410" class="arrow"/>
  <rect x="170" y="270" width="420" height="78" rx="14" class="clay"/><text x="202" y="302" class="t h">REAL UPPER LIMSUP ARGUMENT IS AVAILABLE</text><text x="202" y="327" class="t s">The fixed-block estimate can now cap the eventual upper edge.</text>
  <text x="150" y="392" class="t h">ONE-SIDED OUTPUT</text><text x="292" y="392" class="t s">Boundedness plus an upper cap still does not imply convergence.</text>
</svg>
