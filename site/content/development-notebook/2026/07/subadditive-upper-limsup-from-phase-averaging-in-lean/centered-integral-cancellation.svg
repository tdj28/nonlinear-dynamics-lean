<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img" aria-labelledby="cancellationTitle cancellationDesc">
  <title id="cancellationTitle">Centering cancels the one-step mean</title>
  <desc id="cancellationDesc">The centered block contribution contains the block integral divided by block length minus the one-step integral. Adding back the one-step Birkhoff mean cancels that subtraction, leaving the block integral divided by block length. The finite coefficient already contains the division by block length.</desc>
  <rect width="760" height="430" fill="#F7F4F0"/>
  <style>.t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#2C2924}.title{font-size:18px;font-weight:700}.h{font-size:14px;font-weight:700}.s{font-size:12px}.m{font-size:11px;fill:#5A544C}.blue{fill:#E8F0F7;stroke:#4B6787;stroke-width:1.5}.green{fill:#EAF1E5;stroke:#6F8D5E;stroke-width:1.5}.clay{fill:#F3E8E0;stroke:#A67C52;stroke-width:1.5}.cream{fill:#FBF9F6;stroke:#C4B8A8;stroke-width:1.5}.arrow{fill:none;stroke:#A67C52;stroke-width:2.2;marker-end:url(#cancelArrow)}</style>
  <defs><marker id="cancelArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#A67C52"/></marker></defs>
  <text x="24" y="30" class="t title">The centered term and the one-step mean cancel exactly</text><text x="24" y="51" class="t m">Read every division in words: the coefficient already includes one block-length division.</text>
  <rect x="24" y="86" width="326" height="150" rx="14" class="blue"/><text x="48" y="116" class="t h">CENTERED BLOCK CONTRIBUTION</text><rect x="48" y="139" width="278" height="36" rx="8" class="cream"/><text x="187" y="162" text-anchor="middle" class="t s">block integral divided by block length</text><text x="187" y="198" text-anchor="middle" class="t h">MINUS ONE-STEP INTEGRAL</text><text x="187" y="220" text-anchor="middle" class="t m">after reciprocal-block scaling</text>
  <text x="380" y="164" text-anchor="middle" class="t title">PLUS</text>
  <rect x="410" y="86" width="326" height="150" rx="14" class="clay"/><text x="434" y="116" class="t h">RECONSTRUCTION CONTRIBUTION</text><rect x="434" y="139" width="278" height="36" rx="8" class="cream"/><text x="573" y="162" text-anchor="middle" class="t s">one-step integral</text><text x="573" y="198" text-anchor="middle" class="t h">ORDINARY-MAP BIRKHOFF MEAN</text><text x="573" y="220" text-anchor="middle" class="t m">added back after centering</text>
  <path d="M187 242V272H350" class="arrow"/><path d="M573 242V272H410" class="arrow"/>
  <rect x="156" y="286" width="448" height="76" rx="14" class="green"/><text x="380" y="316" text-anchor="middle" class="t h">ONE-STEP TERMS CANCEL</text><text x="380" y="340" text-anchor="middle" class="t s">What remains is the block integral divided by block length.</text>
  <text x="154" y="402" class="t m">The coefficient tends to the reciprocal block length, not to one.</text>
</svg>
