<svg xmlns="http://www.w3.org/2000/svg" width="760" height="500" viewBox="0 0 760 500" role="img" aria-labelledby="powerBoundaryTitle powerBoundaryDesc">
  <title id="powerBoundaryTitle">Ergodicity need not survive passing to a power</title>
  <desc id="powerBoundaryDesc">On two equally weighted states, the original flip exchanges the states and is ergodic. Applying the flip twice fixes each state, gives the identity, and is not ergodic. The RMT-29 proof therefore uses Birkhoff averaging only under the original map.</desc>
  <rect width="760" height="500" fill="#F7F4F0"/>
  <style>.t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#2C2924}.title{font-size:18px;font-weight:700}.h{font-size:14px;font-weight:700}.s{font-size:12px}.m{font-size:11px;fill:#5A544C}.blue{fill:#E8F0F7;stroke:#4B6787;stroke-width:1.5}.green{fill:#EAF1E5;stroke:#6F8D5E;stroke-width:1.5}.clay{fill:#F3E8E0;stroke:#A67C52;stroke-width:1.5}.cream{fill:#FBF9F6;stroke:#C4B8A8;stroke-width:1.5}.arrow{fill:none;stroke:#A67C52;stroke-width:2.2;marker-end:url(#flipArrow)}</style>
  <defs><marker id="flipArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#A67C52"/></marker></defs>
  <text x="24" y="30" class="t title">The original flip is ergodic; the two-step map is not</text><text x="24" y="51" class="t m">Both states have equal probability mass.</text>
  <rect x="24" y="82" width="344" height="284" rx="14" class="green"/><text x="48" y="113" class="t h">ORIGINAL MAP: ONE FLIP</text><rect x="62" y="151" width="96" height="58" rx="12" class="blue"/><text x="110" y="185" text-anchor="middle" class="t h">STATE A</text><rect x="234" y="151" width="96" height="58" rx="12" class="clay"/><text x="282" y="185" text-anchor="middle" class="t h">STATE B</text><path d="M165 166C188 140 210 140 227 166" class="arrow"/><path d="M227 195C204 221 182 221 165 195" class="arrow"/><text x="48" y="262" class="t h">ERGODIC</text><text x="48" y="289" class="t s">Neither singleton stays invariant.</text><text x="48" y="316" class="t s">Measure is preserved.</text><text x="48" y="343" class="t m">This is the map used by Birkhoff.</text>
  <rect x="392" y="82" width="344" height="284" rx="14" class="clay"/><text x="416" y="113" class="t h">TWO-STEP MAP: FLIP TWICE</text><rect x="430" y="151" width="96" height="58" rx="12" class="blue"/><text x="478" y="185" text-anchor="middle" class="t h">STATE A</text><rect x="602" y="151" width="96" height="58" rx="12" class="clay"/><text x="650" y="185" text-anchor="middle" class="t h">STATE B</text><path d="M478 216V239" class="arrow"/><path d="M650 216V239" class="arrow"/><text x="416" y="262" class="t h">IDENTITY AND NOT ERGODIC</text><text x="416" y="289" class="t s">Each singleton stays invariant.</text><text x="416" y="316" class="t s">Measure is still preserved.</text><text x="416" y="343" class="t m">Ergodicity did not pass to the power.</text>
  <rect x="24" y="392" width="712" height="84" rx="14" class="blue"/><text x="48" y="423" class="t h">RMT-29 ROUTE</text><text x="48" y="449" class="t s">Average every phase at finite time, then invoke Birkhoff only under the original flip.</text>
</svg>
