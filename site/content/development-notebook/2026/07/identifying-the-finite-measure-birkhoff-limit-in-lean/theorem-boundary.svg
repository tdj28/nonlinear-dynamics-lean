<svg xmlns="http://www.w3.org/2000/svg" width="820" height="500" viewBox="0 0 820 500" role="img" aria-labelledby="rmt27BoundaryTitle rmt27BoundaryDesc">
  <title id="rmt27BoundaryTitle">The boundary of the identified finite-measure Birkhoff theorem</title>
  <desc id="rmt27BoundaryDesc">The theorem assumes a finite measure, a measure-preserving self-map, and a real integrable observable. It proves almost-everywhere convergence of the complete Birkhoff-average sequence to conditional expectation on the exact invariant sigma algebra, without probability normalization, ergodicity, injectivity, surjectivity, or invertibility.</desc>
  <style>
    .t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#2C2924}
    .title{font-size:16px;font-weight:700}
    .h{font-size:12px;font-weight:700}
    .s{font-size:11px}
    .m{font-size:10px;fill:#5A544C}
    .blue{fill:#E8F0F7;stroke:#4B6787;stroke-width:1.5}
    .green{fill:#EAF1E5;stroke:#6F8D5E;stroke-width:1.5}
    .clay{fill:#F3E8E0;stroke:#A67C52;stroke-width:1.5}
    .neutral{fill:#FBF9F6;stroke:#C4B8A8;stroke-width:1.5}
  </style>
  <rect width="820" height="500" fill="#F7F4F0"/>
  <text x="28" y="31" class="t title">The theorem identifies the limit without collapsing the dynamics</text>
  <text x="28" y="51" class="t m">Read assumptions, conclusion, and deliberate nonclaims as three separate regions.</text>

  <rect x="24" y="84" width="238" height="302" rx="18" class="blue"/>
  <text x="143" y="113" text-anchor="middle" class="t h">ASSUMES</text>
  <circle cx="55" cy="152" r="8" fill="#4B6787"/>
  <text x="76" y="156" class="t s">a finite measure</text>
  <circle cx="55" cy="197" r="8" fill="#4B6787"/>
  <text x="76" y="194" class="t s">a measure-preserving</text>
  <text x="76" y="211" class="t s">self-map</text>
  <circle cx="55" cy="250" r="8" fill="#4B6787"/>
  <text x="76" y="247" class="t s">a real integrable</text>
  <text x="76" y="264" class="t s">observable</text>
  <path d="M48 304 H238" stroke="#4B6787" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="143" y="330" text-anchor="middle" class="t m">the zero measure is included</text>
  <text x="143" y="348" text-anchor="middle" class="t m">its almost-everywhere claim</text>
  <text x="143" y="364" text-anchor="middle" class="t m">is vacuous</text>

  <rect x="291" y="84" width="238" height="302" rx="18" class="green"/>
  <text x="410" y="113" text-anchor="middle" class="t h">PROVES</text>
  <circle cx="322" cy="152" r="10" fill="#FBF9F6" stroke="#6F8D5E" stroke-width="2"/>
  <path d="M316 152 L321 157 L329 147" fill="none" stroke="#6F8D5E" stroke-width="2"/>
  <text x="345" y="149" class="t s">complete sequence</text>
  <text x="345" y="166" class="t s">converges almost everywhere</text>
  <circle cx="322" cy="211" r="10" fill="#FBF9F6" stroke="#6F8D5E" stroke-width="2"/>
  <path d="M316 211 L321 216 L329 206" fill="none" stroke="#6F8D5E" stroke-width="2"/>
  <text x="345" y="208" class="t s">the target is conditional</text>
  <text x="345" y="225" class="t s">expectation</text>
  <circle cx="322" cy="270" r="10" fill="#FBF9F6" stroke="#6F8D5E" stroke-width="2"/>
  <path d="M316 270 L321 275 L329 265" fill="none" stroke="#6F8D5E" stroke-width="2"/>
  <text x="345" y="267" class="t s">the sigma algebra is</text>
  <text x="345" y="284" class="t s">the exact invariant one</text>
  <text x="410" y="338" text-anchor="middle" class="t m">the limit may vary between</text>
  <text x="410" y="355" text-anchor="middle" class="t m">invariant sectors</text>

  <rect x="558" y="84" width="238" height="302" rx="18" class="neutral"/>
  <text x="677" y="113" text-anchor="middle" class="t h">DOES NOT REQUIRE</text>
  <rect x="590" y="141" width="14" height="14" rx="3" class="clay"/>
  <text x="620" y="153" class="t s">probability normalization</text>
  <rect x="590" y="181" width="14" height="14" rx="3" class="clay"/>
  <text x="620" y="193" class="t s">ergodicity</text>
  <rect x="590" y="221" width="14" height="14" rx="3" class="clay"/>
  <text x="620" y="233" class="t s">injectivity</text>
  <rect x="590" y="261" width="14" height="14" rx="3" class="clay"/>
  <text x="620" y="273" class="t s">surjectivity</text>
  <rect x="590" y="301" width="14" height="14" rx="3" class="clay"/>
  <text x="620" y="313" class="t s">invertibility</text>
  <text x="677" y="356" text-anchor="middle" class="t m">these are not hidden premises</text>

  <rect x="66" y="420" width="688" height="54" rx="14" class="clay"/>
  <text x="410" y="442" text-anchor="middle" class="t h">SEPARATE FUTURE LAYERS</text>
  <text x="410" y="461" text-anchor="middle" class="t s">Ergodic constant reduction, subadditive limits, and Lyapunov theory are not proved here.</text>
</svg>
