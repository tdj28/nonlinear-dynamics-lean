<svg xmlns="http://www.w3.org/2000/svg" width="820" height="470" viewBox="0 0 820 470" role="img" aria-labelledby="threeLocksTitle threeLocksDesc">
  <title id="threeLocksTitle">Three properties identify conditional expectation</title>
  <desc id="threeLocksDesc">The chosen limit is integrable, measurable for the exact invariant sigma algebra, and has the same integral as the observable on every exactly invariant measurable set. Conditional-expectation uniqueness then identifies the two functions almost everywhere.</desc>
  <defs>
    <marker id="threeLocksArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#A67C52"/>
    </marker>
  </defs>
  <style>
    .t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#2C2924}
    .title{font-size:16px;font-weight:700}
    .h{font-size:12px;font-weight:700}
    .s{font-size:11px}
    .m{font-size:10px;fill:#5A544C}
    .blue{fill:#E8F0F7;stroke:#4B6787;stroke-width:1.5}
    .green{fill:#EAF1E5;stroke:#6F8D5E;stroke-width:1.5}
    .clay{fill:#F3E8E0;stroke:#A67C52;stroke-width:1.5}
    .neutral{fill:#FBF9F6;stroke:#C4B8A8;stroke-width:1.5}
    .arrow{fill:none;stroke:#A67C52;stroke-width:2.2;marker-end:url(#threeLocksArrow)}
  </style>
  <rect width="820" height="470" fill="#F7F4F0"/>
  <text x="28" y="31" class="t title">Conditional expectation opens only after three locks align</text>
  <text x="28" y="51" class="t m">Existence of a pointwise limit is not enough; the identification needs all three properties.</text>

  <rect x="28" y="92" width="226" height="148" rx="16" class="blue"/>
  <text x="141" y="120" text-anchor="middle" class="t h">LOCK 1: INTEGRABLE</text>
  <path d="M117 163 V149 C117 121 165 121 165 149 V163" fill="none" stroke="#4B6787" stroke-width="3"/>
  <rect x="104" y="162" width="74" height="46" rx="9" fill="#FBF9F6" stroke="#4B6787" stroke-width="2"/>
  <circle cx="141" cy="181" r="5" fill="#4B6787"/>
  <path d="M141 186 V196" stroke="#4B6787" stroke-width="2"/>
  <text x="141" y="227" text-anchor="middle" class="t m">absolute integral is finite</text>

  <rect x="297" y="92" width="226" height="148" rx="16" class="green"/>
  <text x="410" y="120" text-anchor="middle" class="t h">LOCK 2: INVARIANT-MEASURABLE</text>
  <path d="M386 163 V149 C386 121 434 121 434 149 V163" fill="none" stroke="#6F8D5E" stroke-width="3"/>
  <rect x="373" y="162" width="74" height="46" rx="9" fill="#FBF9F6" stroke="#6F8D5E" stroke-width="2"/>
  <circle cx="410" cy="181" r="5" fill="#6F8D5E"/>
  <path d="M410 186 V196" stroke="#6F8D5E" stroke-width="2"/>
  <text x="410" y="227" text-anchor="middle" class="t m">exact invariant sigma algebra</text>

  <rect x="566" y="92" width="226" height="148" rx="16" class="clay"/>
  <text x="679" y="120" text-anchor="middle" class="t h">LOCK 3: MATCHING INTEGRALS</text>
  <path d="M655 163 V149 C655 121 703 121 703 149 V163" fill="none" stroke="#A67C52" stroke-width="3"/>
  <rect x="642" y="162" width="74" height="46" rx="9" fill="#FBF9F6" stroke="#A67C52" stroke-width="2"/>
  <circle cx="679" cy="181" r="5" fill="#A67C52"/>
  <path d="M679 186 V196" stroke="#A67C52" stroke-width="2"/>
  <text x="679" y="227" text-anchor="middle" class="t m">every invariant measurable set</text>

  <path d="M141 245 C141 292 324 285 363 314" class="arrow"/>
  <path d="M410 245 V304" class="arrow"/>
  <path d="M679 245 C679 292 496 285 457 314" class="arrow"/>
  <rect x="294" y="312" width="232" height="88" rx="18" class="neutral"/>
  <text x="410" y="341" text-anchor="middle" class="t h">UNIQUENESS PRINCIPLE</text>
  <text x="410" y="367" text-anchor="middle" class="t s">the three properties characterize</text>
  <text x="410" y="385" text-anchor="middle" class="t s">conditional expectation</text>

  <rect x="148" y="414" width="524" height="44" rx="12" class="green"/>
  <text x="410" y="433" text-anchor="middle" class="t s">The chosen limit equals invariant conditional expectation almost everywhere.</text>
  <text x="410" y="451" text-anchor="middle" class="t m">Representative transport returns the result to the original integrable observable.</text>
</svg>
