<svg xmlns="http://www.w3.org/2000/svg" width="820" height="470" viewBox="0 0 820 470" role="img" aria-labelledby="canonicalLimitTitle canonicalLimitDesc">
  <title id="canonicalLimitTitle">A total limit representative with an invariant fallback branch</title>
  <desc id="canonicalLimitDesc">The total limit operator selects the genuine limit on convergent average sequences and a fixed fallback otherwise. Shifting one step along an orbit preserves convergence or divergence and therefore gives the same representative on both branches.</desc>
  <defs>
    <marker id="canonicalLimitArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#A67C52"/>
    </marker>
  </defs>
  <style>
    .t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#2C2924}
    .title{font-size:16px;font-weight:700}
    .h{font-size:12px;font-weight:700}
    .s{font-size:11px}
    .m{font-size:10px;fill:#5A544C}
    .blue{fill:#E8F0F7;stroke:#4B6787;stroke-width:1.5}
    .green{fill:#EAF1E5;stroke:#6F8D5E;stroke-width:1.5}
    .clay{fill:#F3E8E0;stroke:#A67C52;stroke-width:1.5}
    .neutral{fill:#FBF9F6;stroke:#C4B8A8;stroke-width:1.5}
    .arrow{fill:none;stroke:#A67C52;stroke-width:2.2;marker-end:url(#canonicalLimitArrow)}
  </style>
  <rect width="820" height="470" fill="#F7F4F0"/>
  <text x="28" y="31" class="t title">One total representative covers convergent and divergent points</text>
  <text x="28" y="51" class="t m">The fallback makes a total function; it is not a claimed analytic limit at divergent points.</text>

  <rect x="28" y="98" width="196" height="94" rx="14" class="blue"/>
  <text x="126" y="125" text-anchor="middle" class="t h">AVERAGE SEQUENCE</text>
  <path d="M66 166 C86 138 104 177 124 151 C143 126 164 163 190 143" fill="none" stroke="#4B6787" stroke-width="2.4"/>
  <text x="126" y="181" text-anchor="middle" class="t m">at one state</text>

  <path d="M228 145 C273 145 275 116 310 112" class="arrow"/>
  <path d="M228 145 C273 145 275 256 310 260" class="arrow"/>

  <rect x="318" y="78" width="210" height="108" rx="14" class="green"/>
  <text x="423" y="105" text-anchor="middle" class="t h">CONVERGENT BRANCH</text>
  <text x="423" y="133" text-anchor="middle" class="t s">select the unique limit</text>
  <path d="M366 158 C383 142 401 151 418 145 C438 138 456 140 480 140" fill="none" stroke="#6F8D5E" stroke-width="2.4"/>
  <circle cx="480" cy="140" r="5" fill="#6F8D5E"/>

  <rect x="318" y="224" width="210" height="108" rx="14" class="clay"/>
  <text x="423" y="251" text-anchor="middle" class="t h">DIVERGENT BRANCH</text>
  <text x="423" y="279" text-anchor="middle" class="t s">use the fixed total fallback</text>
  <path d="M366 303 L385 285 L404 306 L423 284 L442 306 L461 285 L480 303" fill="none" stroke="#A67C52" stroke-width="2.4"/>

  <path d="M532 132 H574" class="arrow"/>
  <path d="M532 278 H574" class="arrow"/>
  <rect x="582" y="126" width="208" height="160" rx="16" class="neutral"/>
  <text x="686" y="155" text-anchor="middle" class="t h">TOTAL LIMIT FUNCTION</text>
  <text x="686" y="184" text-anchor="middle" class="t s">defined at every state</text>
  <rect x="620" y="207" width="132" height="48" rx="10" class="blue"/>
  <text x="686" y="236" text-anchor="middle" class="t s">one real value</text>

  <rect x="170" y="366" width="480" height="54" rx="14" class="green"/>
  <text x="410" y="387" text-anchor="middle" class="t h">SHIFT ONE STEP ALONG THE ORBIT</text>
  <text x="410" y="407" text-anchor="middle" class="t s">Convergence status and selected value stay the same on either branch.</text>
  <path d="M686 290 C686 340 652 352 626 366" class="arrow"/>

  <text x="410" y="449" text-anchor="middle" class="t m">Exact pointwise invariance is available before discarding the null divergent set.</text>
</svg>
