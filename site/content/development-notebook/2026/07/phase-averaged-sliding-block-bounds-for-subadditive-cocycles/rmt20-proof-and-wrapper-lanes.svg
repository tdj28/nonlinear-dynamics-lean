<svg xmlns="http://www.w3.org/2000/svg" width="920" height="650"
     viewBox="0 0 920 650" role="img"
     aria-labelledby="proofLanesTitle proofLanesDesc">
  <title id="proofLanesTitle">Finite phase proof and public wrapper lanes</title>
  <desc id="proofLanesDesc">Pure finite reindexing and raw shifted subadditivity meet in a boundary-free phase estimate. Summing phases yields a multiplication form, while a nonzero block length yields division. Candidate and cocycle wrappers carry analytic context not inspected by the finite proof.</desc>
  <rect width="920" height="650" fill="#F7F4F0"/>
  <style>
    .t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#2C2924}
    .title{font-size:18px;font-weight:700}.h{font-size:13px;font-weight:700}
    .s{font-size:12px}.m{font-size:11px;fill:#5A544C}
    .data{fill:#E8F0F7;stroke:#4B6787;stroke-width:1.5}
    .raw{fill:#F3E8E0;stroke:#A67C52;stroke-width:1.5}
    .result{fill:#EAF1E5;stroke:#6F8D5E;stroke-width:1.5}
    .wrap{fill:#EDE8E1;stroke:#7F786D;stroke-width:1.5}
    .neutral{fill:#FBF9F6;stroke:#C4B8A8;stroke-width:1.5}
    .arrow{stroke:#A67C52;stroke-width:2.6;fill:none}
  </style>

  <text x="24" y="30" class="t title">The proof kernel is smaller than its public wrappers</text>
  <text x="24" y="52" class="t m">Read downward for proof dependencies; read the right column for context carried but not consumed.</text>

  <rect x="24" y="82" width="270" height="92" rx="12" class="data"/>
  <text x="48" y="110" class="t h">FINITE REINDEXING</text>
  <text x="48" y="134" class="t s">Birkhoff sums and natural iterates</text>
  <text x="48" y="154" class="t m">Any additive commutative monoid</text>

  <rect x="320" y="82" width="270" height="92" rx="12" class="raw"/>
  <text x="344" y="110" class="t h">RAW PHASE DECOMPOSITION</text>
  <text x="344" y="134" class="t s">Prefix, complete blocks, terminal gap</text>
  <text x="344" y="154" class="t m">Shifted subadditivity only</text>

  <rect x="616" y="82" width="280" height="174" rx="12" class="wrap"/>
  <text x="640" y="110" class="t h">PUBLIC WRAPPERS CARRY</text>
  <text x="640" y="136" class="t s">Measurable space and measure</text>
  <text x="640" y="158" class="t s">Candidate integrability field</text>
  <text x="640" y="180" class="t s">Cocycle's preserved base</text>
  <line x1="640" y1="196" x2="872" y2="196" stroke="#A89B8C" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="640" y="220" class="t m">THE FINITE PROOF DOES NOT INSPECT</text>
  <text x="640" y="238" class="t m">THESE ANALYTIC FIELDS.</text>

  <path d="M159 174 L159 210 L318 210 L318 238" class="arrow"/>
  <polygon points="308,230 318,244 328,230" fill="#A67C52"/>
  <path d="M455 174 L455 210 L318 210" class="arrow"/>

  <rect x="134" y="244" width="368" height="84" rx="12" class="neutral"/>
  <text x="158" y="273" class="t h">BOUNDARIES RETAINED</text>
  <text x="158" y="296" class="t s">Exact finite inequality at one common horizon</text>
  <text x="158" y="316" class="t m">No sign, measure, probability, or limit step</text>

  <line x1="318" y1="328" x2="318" y2="360" class="arrow"/>
  <polygon points="308,352 318,366 328,352" fill="#A67C52"/>

  <rect x="134" y="368" width="368" height="86" rx="12" class="raw"/>
  <text x="158" y="397" class="t h">POSITIVE-TIME SIGN REMOVES GAPS</text>
  <text x="158" y="420" class="t s">Phase zero uses a separate remainder route</text>
  <text x="158" y="440" class="t m">No time-zero normalization is added</text>

  <line x1="318" y1="454" x2="318" y2="486" class="arrow"/>
  <polygon points="308,478 318,492 328,478" fill="#A67C52"/>

  <rect x="24" y="494" width="420" height="84" rx="12" class="result"/>
  <text x="48" y="523" class="t h">SUM EVERY PHASE</text>
  <text x="48" y="546" class="t s">Multiplication form includes zero block length</text>
  <text x="48" y="566" class="t m">At zero it is valid but vacuous</text>

  <rect x="470" y="494" width="238" height="84" rx="12" class="data"/>
  <text x="494" y="523" class="t h">NONZERO BLOCK LENGTH</text>
  <text x="494" y="546" class="t s">Division preserves order</text>
  <text x="494" y="566" class="t m">Only extra premise</text>

  <line x1="444" y1="536" x2="464" y2="536" class="arrow"/>
  <polygon points="456,526 470,536 456,546" fill="#A67C52"/>

  <rect x="734" y="494" width="162" height="84" rx="12" class="neutral"/>
  <text x="758" y="523" class="t h">SPECIALIZE</text>
  <text x="758" y="546" class="t s">Centered process</text>
  <text x="758" y="566" class="t s">Centered cocycle</text>
  <line x1="708" y1="536" x2="728" y2="536" class="arrow"/>
  <polygon points="720,526 734,536 720,546" fill="#A67C52"/>

  <rect x="24" y="596" width="872" height="38" rx="10" fill="#EAF1E5" stroke="#6F8D5E" stroke-width="1.4"/>
  <text x="156" y="620" class="t s">FINITE ONLY: NO POINTWISE OR MEAN ERGODIC LIMIT, KINGMAN THEOREM, OR LYAPUNOV EXPONENT.</text>
</svg>
