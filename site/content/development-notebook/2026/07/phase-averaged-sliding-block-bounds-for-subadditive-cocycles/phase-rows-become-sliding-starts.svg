<svg xmlns="http://www.w3.org/2000/svg" width="920" height="620"
     viewBox="0 0 920 620" role="img"
     aria-labelledby="phaseRowsTitle phaseRowsDesc">
  <title id="phaseRowsTitle">Residue-phase rows become one sliding sequence</title>
  <desc id="phaseRowsDesc">Three residue-phase rows have growing prefixes, equally spaced complete blocks, and shrinking terminal gaps. The rows merge into one continuous line of sliding starts, while every row retains one common horizon.</desc>
  <rect width="920" height="620" fill="#F7F4F0"/>
  <style>
    .t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#2C2924}
    .title{font-size:18px;font-weight:700}.h{font-size:13px;font-weight:700}
    .s{font-size:12px}.m{font-size:11px;fill:#5A544C}
    .phase{fill:#FBF9F6;stroke:#C4B8A8;stroke-width:1.4}
    .prefix{fill:#F3E8E0;stroke:#A67C52;stroke-width:1.3}
    .block{fill:#E8F0F7;stroke:#4B6787;stroke-width:1.3}
    .tail{fill:#EDE8E1;stroke:#7F786D;stroke-width:1.3}
    .slide{fill:#EAF1E5;stroke:#6F8D5E;stroke-width:1.2}
  </style>

  <text x="24" y="30" class="t title">One horizon, every residue phase</text>
  <text x="24" y="52" class="t m">A longer prefix is paired with a shorter tail; the complete blocks keep the same stride.</text>

  <rect x="24" y="78" width="872" height="102" rx="12" class="phase"/>
  <text x="42" y="104" class="t h">PHASE ZERO</text>
  <rect x="42" y="122" width="74" height="38" rx="7" class="prefix"/>
  <text x="57" y="146" class="t m">NO PREFIX</text>
  <rect x="132" y="116" width="116" height="50" rx="8" class="block"/>
  <rect x="262" y="116" width="116" height="50" rx="8" class="block"/>
  <rect x="392" y="116" width="116" height="50" rx="8" class="block"/>
  <rect x="522" y="116" width="116" height="50" rx="8" class="block"/>
  <text x="169" y="146" class="t h">BLOCK</text>
  <text x="299" y="146" class="t h">BLOCK</text>
  <text x="429" y="146" class="t h">BLOCK</text>
  <text x="559" y="146" class="t h">BLOCK</text>
  <rect x="654" y="116" width="218" height="50" rx="8" class="tail"/>
  <text x="720" y="146" class="t h">LONGEST TAIL</text>

  <rect x="24" y="194" width="872" height="102" rx="12" class="phase"/>
  <text x="42" y="220" class="t h">MIDDLE PHASE</text>
  <rect x="42" y="232" width="106" height="50" rx="8" class="prefix"/>
  <text x="68" y="262" class="t h">PREFIX</text>
  <rect x="162" y="232" width="116" height="50" rx="8" class="block"/>
  <rect x="292" y="232" width="116" height="50" rx="8" class="block"/>
  <rect x="422" y="232" width="116" height="50" rx="8" class="block"/>
  <rect x="552" y="232" width="116" height="50" rx="8" class="block"/>
  <text x="199" y="262" class="t h">BLOCK</text>
  <text x="329" y="262" class="t h">BLOCK</text>
  <text x="459" y="262" class="t h">BLOCK</text>
  <text x="589" y="262" class="t h">BLOCK</text>
  <rect x="682" y="232" width="190" height="50" rx="8" class="tail"/>
  <text x="727" y="262" class="t h">SHORTER TAIL</text>

  <rect x="24" y="310" width="872" height="102" rx="12" class="phase"/>
  <text x="42" y="336" class="t h">LAST PHASE</text>
  <rect x="42" y="348" width="136" height="50" rx="8" class="prefix"/>
  <text x="82" y="378" class="t h">PREFIX</text>
  <rect x="192" y="348" width="116" height="50" rx="8" class="block"/>
  <rect x="322" y="348" width="116" height="50" rx="8" class="block"/>
  <rect x="452" y="348" width="116" height="50" rx="8" class="block"/>
  <rect x="582" y="348" width="116" height="50" rx="8" class="block"/>
  <text x="229" y="378" class="t h">BLOCK</text>
  <text x="359" y="378" class="t h">BLOCK</text>
  <text x="489" y="378" class="t h">BLOCK</text>
  <text x="619" y="378" class="t h">BLOCK</text>
  <rect x="712" y="348" width="160" height="50" rx="8" class="tail"/>
  <text x="750" y="378" class="t h">SHORTEST TAIL</text>

  <line x1="460" y1="424" x2="460" y2="455" stroke="#A67C52" stroke-width="3"/>
  <polygon points="450,448 460,461 470,448" fill="#A67C52"/>

  <rect x="24" y="474" width="872" height="72" rx="12" fill="#FBF9F6" stroke="#C4B8A8" stroke-width="1.4"/>
  <text x="42" y="498" class="t h">ALL SLIDING STARTS APPEAR ONCE</text>
  <rect x="42" y="512" width="60" height="22" rx="5" class="slide"/>
  <rect x="108" y="512" width="60" height="22" rx="5" class="slide"/>
  <rect x="174" y="512" width="60" height="22" rx="5" class="slide"/>
  <rect x="240" y="512" width="60" height="22" rx="5" class="slide"/>
  <rect x="306" y="512" width="60" height="22" rx="5" class="slide"/>
  <rect x="372" y="512" width="60" height="22" rx="5" class="slide"/>
  <rect x="438" y="512" width="60" height="22" rx="5" class="slide"/>
  <rect x="504" y="512" width="60" height="22" rx="5" class="slide"/>
  <rect x="570" y="512" width="60" height="22" rx="5" class="slide"/>
  <rect x="636" y="512" width="60" height="22" rx="5" class="slide"/>
  <rect x="702" y="512" width="60" height="22" rx="5" class="slide"/>
  <rect x="768" y="512" width="60" height="22" rx="5" class="slide"/>
  <text x="837" y="528" class="t m">CONTINUES</text>

  <rect x="24" y="562" width="872" height="38" rx="10" fill="#EAF1E5" stroke="#6F8D5E" stroke-width="1.4"/>
  <text x="122" y="586" class="t s">TAKEAWAY: EVERY ROW COVERS ONE COMMON HORIZON; AVERAGING REINDEXES THE COMPLETE-BLOCK STARTS.</text>
</svg>
