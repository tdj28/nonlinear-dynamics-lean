<svg xmlns="http://www.w3.org/2000/svg" width="760" height="470" viewBox="0 0 760 470" role="img" aria-labelledby="bridgeTitle bridgeDesc">
  <title id="bridgeTitle">Finite counting becomes an exact measure identity</title>
  <desc id="bridgeDesc">A bad set and finite horizon produce a natural visit count. Casting the count gives an indicator Birkhoff sum. Under null measurability, finite total measure, and preservation, integration gives the horizon times real set measure. Probability and ergodicity are not used.</desc>
  <rect width="760" height="470" fill="#F7F4F0"/>
  <style>.t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#2C2924}.title{font-size:18px;font-weight:700}.h{font-size:14px;font-weight:700}.s{font-size:12px}.m{font-size:11px;fill:#5A544C}.blue{fill:#E8F0F7;stroke:#4B6787;stroke-width:1.5}.cream{fill:#FBF9F6;stroke:#C4B8A8;stroke-width:1.5}.green{fill:#EAF1E5;stroke:#6F8D5E;stroke-width:1.5}.clay{fill:#F3E8E0;stroke:#A67C52;stroke-width:1.5}.arrow{fill:none;stroke:#A67C52;stroke-width:2.2;marker-end:url(#bridgeArrow)}</style>
  <defs><marker id="bridgeArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#A67C52"/></marker></defs>
  <text x="24" y="31" class="t title">The exact finite-measure bridge</text>
  <text x="24" y="52" class="t m">Assumptions enter only where their mathematical jobs begin.</text>
  <rect x="28" y="94" width="154" height="110" rx="14" class="cream"/>
  <text x="105" y="123" text-anchor="middle" class="t h">BAD SET</text>
  <text x="105" y="149" text-anchor="middle" class="t s">Choose a finite</text><text x="105" y="168" text-anchor="middle" class="t s">orbit horizon</text>
  <text x="105" y="189" text-anchor="middle" class="t m">No measure yet</text>
  <path d="M184 149H215" class="arrow"/>
  <rect x="220" y="94" width="154" height="110" rx="14" class="blue"/>
  <text x="297" y="123" text-anchor="middle" class="t h">VISIT COUNT</text>
  <text x="297" y="149" text-anchor="middle" class="t s">Filter the finite</text><text x="297" y="168" text-anchor="middle" class="t s">range and count</text>
  <text x="297" y="189" text-anchor="middle" class="t m">Natural valued</text>
  <path d="M376 149H407" class="arrow"/>
  <rect x="412" y="94" width="154" height="110" rx="14" class="blue"/>
  <text x="489" y="123" text-anchor="middle" class="t h">INDICATOR SUM</text>
  <text x="489" y="149" text-anchor="middle" class="t s">Cast equals a finite</text><text x="489" y="168" text-anchor="middle" class="t s">Birkhoff sum</text>
  <text x="489" y="189" text-anchor="middle" class="t m">Still combinatorial</text>
  <path d="M568 149H599" class="arrow"/>
  <rect x="604" y="94" width="128" height="110" rx="14" class="green"/>
  <text x="668" y="123" text-anchor="middle" class="t h">INTEGRATE</text>
  <text x="668" y="149" text-anchor="middle" class="t s">Horizon times</text><text x="668" y="168" text-anchor="middle" class="t s">real measure</text>
  <text x="668" y="189" text-anchor="middle" class="t m">Exact identity</text>
  <rect x="92" y="254" width="576" height="98" rx="14" class="cream"/>
  <text x="116" y="282" class="t h">ASSUMPTIONS AT THE FINAL ARROW</text>
  <circle cx="126" cy="310" r="7" fill="#4B6787"/><text x="144" y="315" class="t s">Null-measurable set</text>
  <circle cx="310" cy="310" r="7" fill="#6F8D5E"/><text x="328" y="315" class="t s">Finite total mass</text>
  <circle cx="494" cy="310" r="7" fill="#A67C52"/><text x="512" y="315" class="t s">Preservation</text>
  <rect x="92" y="378" width="576" height="58" rx="12" class="clay"/>
  <text x="380" y="403" text-anchor="middle" class="t h">NOT REQUIRED</text>
  <text x="380" y="423" text-anchor="middle" class="t s">Probability mass one, ergodicity, mixing, or independence</text>
</svg>
