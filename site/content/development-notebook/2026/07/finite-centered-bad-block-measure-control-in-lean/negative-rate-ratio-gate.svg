<svg xmlns="http://www.w3.org/2000/svg" width="760" height="490" viewBox="0 0 760 490" role="img" aria-labelledby="signTitle signDesc">
  <title id="signTitle">The sign chain makes negative division valid</title>
  <desc id="signDesc">The centered process at time one is zero. The lower-rate premise therefore makes delta nonpositive. A threshold strictly below delta is negative. Dividing the integrated inequality by that negative threshold reverses the order and gives the measure ratio.</desc>
  <rect width="760" height="490" fill="#F7F4F0"/>
  <style>.t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#2C2924}.title{font-size:18px;font-weight:700}.h{font-size:14px;font-weight:700}.s{font-size:12px}.m{font-size:11px;fill:#5A544C}.blue{fill:#E8F0F7;stroke:#4B6787;stroke-width:1.5}.cream{fill:#FBF9F6;stroke:#C4B8A8;stroke-width:1.5}.green{fill:#EAF1E5;stroke:#6F8D5E;stroke-width:1.5}.clay{fill:#F3E8E0;stroke:#A67C52;stroke-width:1.5}.arrow{fill:none;stroke:#A67C52;stroke-width:2.2;marker-end:url(#signArrow)}</style>
  <defs><marker id="signArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#A67C52"/></marker></defs>
  <text x="24" y="31" class="t title">The theorem derives the negative divisor</text>
  <text x="24" y="52" class="t m">No separate negative-threshold premise is needed.</text>
  <rect x="118" y="79" width="524" height="64" rx="12" class="blue"/>
  <text x="380" y="105" text-anchor="middle" class="t h">TIME-ONE CENTER IS EXACTLY ZERO</text>
  <text x="380" y="127" text-anchor="middle" class="t s">The one-step observable cancels its own orbit sum</text>
  <path d="M380 146V172" class="arrow"/>
  <rect x="118" y="179" width="524" height="64" rx="12" class="cream"/>
  <text x="380" y="205" text-anchor="middle" class="t h">LOWER RATE IS NONPOSITIVE</text>
  <text x="380" y="227" text-anchor="middle" class="t s">Specialize the all-positive-length premise at time one</text>
  <path d="M380 246V272" class="arrow"/>
  <rect x="118" y="279" width="524" height="64" rx="12" class="clay"/>
  <text x="380" y="305" text-anchor="middle" class="t h">STRICTLY LOWER THRESHOLD IS NEGATIVE</text>
  <text x="380" y="327" text-anchor="middle" class="t s">Threshold below rate, rate at most zero</text>
  <path d="M380 346V372" class="arrow"/>
  <rect x="64" y="379" width="632" height="76" rx="14" class="green"/>
  <text x="380" y="408" text-anchor="middle" class="t h">NEGATIVE DIVISION REVERSES THE ORDER</text>
  <text x="380" y="433" text-anchor="middle" class="t s">Integrated rate below threshold times measure becomes measure below rate ratio</text>
  <text x="380" y="473" text-anchor="middle" class="t m">The sign proof is part of the theorem, not a prose convention.</text>
</svg>
