<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img" aria-labelledby="windowTitle windowDesc">
  <title id="windowTitle">Finite witness lengths define the centered bad-block set</title>
  <desc id="windowDesc">Lengths one through m form a finite candidate window. A point enters the bad set if at least one centered block passes a strict below-threshold test. Longer lengths are outside this definition.</desc>
  <rect width="760" height="430" fill="#F7F4F0"/>
  <style>.t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#2C2924}.title{font-size:18px;font-weight:700}.h{font-size:14px;font-weight:700}.s{font-size:12px}.m{font-size:11px;fill:#5A544C}.blue{fill:#E8F0F7;stroke:#4B6787;stroke-width:1.5}.cream{fill:#FBF9F6;stroke:#C4B8A8;stroke-width:1.5}.green{fill:#EAF1E5;stroke:#6F8D5E;stroke-width:1.5}.clay{fill:#F3E8E0;stroke:#A67C52;stroke-width:1.5}.gray{fill:#EDE8E1;stroke:#7F786D;stroke-width:1.5}.arrow{fill:none;stroke:#A67C52;stroke-width:2.2;marker-end:url(#windowArrow)}</style>
  <defs><marker id="windowArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#A67C52"/></marker></defs>
  <text x="24" y="31" class="t title">One finite window, one strict witness</text>
  <text x="24" y="52" class="t m">The theorem scans only positive block lengths up to the chosen cap.</text>
  <rect x="32" y="86" width="456" height="116" rx="14" class="cream"/>
  <text x="52" y="113" class="t h">ALLOWED WITNESS LENGTHS</text>
  <rect x="54" y="133" width="62" height="46" rx="9" class="blue"/><text x="82" y="161" text-anchor="middle" class="t h">ONE</text>
  <rect x="128" y="133" width="62" height="46" rx="9" class="blue"/><text x="159" y="161" text-anchor="middle" class="t h">TWO</text>
  <rect x="202" y="133" width="62" height="46" rx="9" class="blue"/><text x="233" y="161" text-anchor="middle" class="t h">THREE</text>
  <text x="287" y="161" class="t h">...</text>
  <rect x="328" y="133" width="136" height="46" rx="9" class="green"/><text x="396" y="161" text-anchor="middle" class="t h">CAP LENGTH</text>
  <path d="M488 144H535" class="arrow"/>
  <rect x="540" y="98" width="188" height="92" rx="14" class="clay"/>
  <text x="634" y="128" text-anchor="middle" class="t h">STRICT TEST</text>
  <text x="634" y="151" text-anchor="middle" class="t s">Centered block lies</text>
  <text x="634" y="169" text-anchor="middle" class="t s">below the slope line</text>
  <path d="M634 190V237" class="arrow"/>
  <rect x="438" y="244" width="290" height="78" rx="14" class="green"/>
  <text x="583" y="275" text-anchor="middle" class="t h">FINITE BAD-BLOCK SET</text>
  <text x="583" y="299" text-anchor="middle" class="t s">At least one allowed witness succeeds</text>
  <rect x="32" y="244" width="352" height="78" rx="14" class="gray"/>
  <text x="208" y="275" text-anchor="middle" class="t h">OUTSIDE THIS DEFINITION</text>
  <text x="208" y="299" text-anchor="middle" class="t s">Longer blocks and infinite recurrence</text>
  <rect x="32" y="350" width="696" height="52" rx="12" class="cream"/>
  <text x="52" y="375" class="t h">BOUNDARY</text><text x="142" y="375" class="t s">Cap zero makes the window empty. Equality at the line is not marked.</text>
  <text x="52" y="393" class="t m">A finite union is the whole object proved here.</text>
</svg>
