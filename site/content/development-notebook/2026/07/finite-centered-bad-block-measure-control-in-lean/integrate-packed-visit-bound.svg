<svg xmlns="http://www.w3.org/2000/svg" width="760" height="520" viewBox="0 0 760 520" role="img" aria-labelledby="integrateTitle integrateDesc">
  <title id="integrateTitle">Integrating the packed visit bound leaves one finite correction</title>
  <desc id="integrateDesc">A pointwise inequality at the enlarged horizon enters integral monotonicity. Exact integration of the visit count gives threshold times horizon times bad-set measure. Normalization at the enlarged horizon leaves horizon divided by horizon plus cap, which tends to one.</desc>
  <rect width="760" height="520" fill="#F7F4F0"/>
  <style>.t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#2C2924}.title{font-size:18px;font-weight:700}.h{font-size:14px;font-weight:700}.s{font-size:12px}.m{font-size:11px;fill:#5A544C}.blue{fill:#E8F0F7;stroke:#4B6787;stroke-width:1.5}.cream{fill:#FBF9F6;stroke:#C4B8A8;stroke-width:1.5}.green{fill:#EAF1E5;stroke:#6F8D5E;stroke-width:1.5}.clay{fill:#F3E8E0;stroke:#A67C52;stroke-width:1.5}.arrow{fill:none;stroke:#A67C52;stroke-width:2.2;marker-end:url(#integrateArrow)}</style>
  <defs><marker id="integrateArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#A67C52"/></marker></defs>
  <text x="24" y="31" class="t title">Pointwise packing becomes a measure ratio</text>
  <text x="24" y="52" class="t m">The visit integral is exact; only the enlarged-horizon factor remains.</text>
  <rect x="88" y="82" width="584" height="70" rx="13" class="blue"/>
  <text x="380" y="109" text-anchor="middle" class="t h">POINTWISE PACKED BOUND</text>
  <text x="380" y="133" text-anchor="middle" class="t s">Centered value at horizon plus cap is below threshold times visit count</text>
  <path d="M380 155V181" class="arrow"/>
  <rect x="88" y="188" width="584" height="70" rx="13" class="cream"/>
  <text x="380" y="215" text-anchor="middle" class="t h">INTEGRAL MONOTONICITY</text>
  <text x="380" y="239" text-anchor="middle" class="t s">Both centered process and real visit count are integrable</text>
  <path d="M380 261V287" class="arrow"/>
  <rect x="88" y="294" width="584" height="70" rx="13" class="green"/>
  <text x="380" y="321" text-anchor="middle" class="t h">EXACT VISIT INTEGRAL</text>
  <text x="380" y="345" text-anchor="middle" class="t s">Threshold times horizon times real bad-set measure</text>
  <path d="M380 367V393" class="arrow"/>
  <rect x="88" y="400" width="584" height="70" rx="13" class="clay"/>
  <text x="380" y="427" text-anchor="middle" class="t h">ONE FINITE CORRECTION</text>
  <text x="380" y="451" text-anchor="middle" class="t s">Horizon divided by horizon plus cap tends to one</text>
  <text x="380" y="495" text-anchor="middle" class="t m">This deterministic horizon limit is not convergence of the process.</text>
</svg>
