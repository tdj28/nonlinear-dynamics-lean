<svg xmlns="http://www.w3.org/2000/svg" width="760" height="500" viewBox="0 0 760 500" role="img" aria-labelledby="witnessTitle witnessDesc">
  <title id="witnessTitle">Bad visits supply finite witness lengths</title>
  <desc id="witnessDesc">A finite orbit row contains marked and unmarked starts. Each marked start chooses one witness length between one and the cap. Unmarked starts receive a harmless default that packing never reads. The marked starts and chosen lengths feed ordered interval packing.</desc>
  <rect width="760" height="500" fill="#F7F4F0"/>
  <style>.t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#2C2924}.title{font-size:18px;font-weight:700}.h{font-size:14px;font-weight:700}.s{font-size:12px}.m{font-size:11px;fill:#5A544C}.blue{fill:#E8F0F7;stroke:#4B6787;stroke-width:1.5}.cream{fill:#FBF9F6;stroke:#C4B8A8;stroke-width:1.5}.green{fill:#EAF1E5;stroke:#6F8D5E;stroke-width:1.5}.clay{fill:#F3E8E0;stroke:#A67C52;stroke-width:1.5}.gray{fill:#EDE8E1;stroke:#7F786D;stroke-width:1.5}.arrow{fill:none;stroke:#A67C52;stroke-width:2;marker-end:url(#witnessArrow)}</style>
  <defs><marker id="witnessArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#A67C52"/></marker></defs>
  <text x="24" y="31" class="t title">Every marked start contributes one chosen witness</text>
  <text x="24" y="52" class="t m">Choice is local; packing controls the selected family globally.</text>
  <text x="42" y="94" class="t h">FINITE ORBIT STARTS</text>
  <line x1="66" y1="148" x2="694" y2="148" stroke="#7F786D" stroke-width="2"/>
  <g class="t s" text-anchor="middle">
    <circle cx="86" cy="148" r="15" fill="#EAF1E5" stroke="#6F8D5E" stroke-width="2"/><text x="86" y="153">BAD</text>
    <circle cx="190" cy="148" r="15" fill="#EDE8E1" stroke="#7F786D" stroke-width="2"/><text x="190" y="153">OK</text>
    <circle cx="294" cy="148" r="15" fill="#EAF1E5" stroke="#6F8D5E" stroke-width="2"/><text x="294" y="153">BAD</text>
    <circle cx="398" cy="148" r="15" fill="#EDE8E1" stroke="#7F786D" stroke-width="2"/><text x="398" y="153">OK</text>
    <circle cx="502" cy="148" r="15" fill="#EAF1E5" stroke="#6F8D5E" stroke-width="2"/><text x="502" y="153">BAD</text>
    <circle cx="606" cy="148" r="15" fill="#EDE8E1" stroke="#7F786D" stroke-width="2"/><text x="606" y="153">OK</text>
  </g>
  <path d="M86 166V222" class="arrow"/><path d="M294 166V222" class="arrow"/><path d="M502 166V222" class="arrow"/>
  <rect x="38" y="230" width="146" height="72" rx="12" class="blue"/><text x="111" y="257" text-anchor="middle" class="t h">CHOSEN LENGTH</text><text x="111" y="281" text-anchor="middle" class="t s">Positive, at most cap</text>
  <rect x="246" y="230" width="146" height="72" rx="12" class="blue"/><text x="319" y="257" text-anchor="middle" class="t h">CHOSEN LENGTH</text><text x="319" y="281" text-anchor="middle" class="t s">Strict bad cost</text>
  <rect x="454" y="230" width="146" height="72" rx="12" class="blue"/><text x="527" y="257" text-anchor="middle" class="t h">CHOSEN LENGTH</text><text x="527" y="281" text-anchor="middle" class="t s">Positive, at most cap</text>
  <rect x="618" y="230" width="104" height="72" rx="12" class="gray"/><text x="670" y="257" text-anchor="middle" class="t h">DEFAULT</text><text x="670" y="281" text-anchor="middle" class="t s">Never read</text>
  <path d="M111 305V346H380V370" class="arrow"/><path d="M319 305V346" class="arrow"/><path d="M527 305V346H380" class="arrow"/>
  <rect x="146" y="377" width="468" height="78" rx="14" class="green"/>
  <text x="380" y="407" text-anchor="middle" class="t h">ORDERED GREEDY PACKING</text>
  <text x="380" y="431" text-anchor="middle" class="t s">Selected starts and lengths control the enlarged centered horizon</text>
  <text x="380" y="479" text-anchor="middle" class="t m">Color and labels both distinguish marked, unmarked, chosen, and default cases.</text>
</svg>
