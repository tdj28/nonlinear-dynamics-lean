<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">The exact unit-interval parameter window for the logistic map</title>
  <desc id="desc">Three panels compare the midpoint image r over four. It is below zero for negative r, lies in the unit interval for r from zero through four, and is above one for r greater than four.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#315f63"/></marker></defs>
  <rect width="1200" height="680" rx="24" fill="#f7f1e5"/>
  <text x="60" y="70" font-family="system-ui,sans-serif" font-size="30" font-weight="750" fill="#183c3a">THE MIDPOINT DETECTS BOTH SHARP BOUNDARIES</text>
  <g font-family="system-ui,sans-serif">
    <rect x="55" y="125" width="330" height="425" rx="24" fill="#f7e4dd" stroke="#a14f3f" stroke-width="4"/>
    <text x="220" y="177" text-anchor="middle" font-size="31" font-weight="700" fill="#8b3d32">r &lt; 0</text>
    <line x1="105" y1="405" x2="335" y2="405" stroke="#263c3b" stroke-width="4"/>
    <circle cx="220" cy="465" r="12" fill="#a14f3f"/><text x="245" y="474" font-size="27" fill="#263c3b">r / 4 &lt; 0</text>
    <path d="M220 300 L220 447" stroke="#315f63" stroke-width="4" marker-end="url(#arrow)"/>
    <text x="220" y="270" text-anchor="middle" font-size="25" fill="#263c3b">start x = 1 / 2</text>
    <text x="220" y="520" text-anchor="middle" font-size="23" font-weight="650" fill="#8b3d32">leaves below the interval</text>

    <rect x="435" y="125" width="330" height="425" rx="24" fill="#dfece3" stroke="#315f63" stroke-width="5"/>
    <text x="600" y="177" text-anchor="middle" font-size="31" font-weight="700" fill="#285448">0 ≤ r ≤ 4</text>
    <line x1="485" y1="405" x2="715" y2="405" stroke="#263c3b" stroke-width="4"/>
    <rect x="500" y="274" width="200" height="131" fill="#eef6ef" stroke="#5c8a72" stroke-width="2"/>
    <text x="475" y="290" text-anchor="end" font-size="22" fill="#263c3b">1</text><text x="475" y="411" text-anchor="end" font-size="22" fill="#263c3b">0</text>
    <circle cx="600" cy="338" r="12" fill="#315f63"/><text x="625" y="347" font-size="24" fill="#263c3b">0 ≤ r / 4 ≤ 1</text>
    <text x="600" y="500" text-anchor="middle" font-size="23" font-weight="650" fill="#285448">every state is controlled</text>
    <text x="600" y="530" text-anchor="middle" font-size="21" fill="#285448">by x(1-x) ≤ 1/4</text>

    <rect x="815" y="125" width="330" height="425" rx="24" fill="#f7e4dd" stroke="#a14f3f" stroke-width="4"/>
    <text x="980" y="177" text-anchor="middle" font-size="31" font-weight="700" fill="#8b3d32">r &gt; 4</text>
    <line x1="865" y1="405" x2="1095" y2="405" stroke="#263c3b" stroke-width="4"/>
    <circle cx="980" cy="235" r="12" fill="#a14f3f"/><text x="1005" y="244" font-size="27" fill="#263c3b">r / 4 &gt; 1</text>
    <path d="M980 355 L980 253" stroke="#315f63" stroke-width="4" marker-end="url(#arrow)"/>
    <text x="980" y="382" text-anchor="middle" font-size="25" fill="#263c3b">start x = 1 / 2</text>
    <text x="980" y="520" text-anchor="middle" font-size="23" font-weight="650" fill="#8b3d32">leaves above the interval</text>
  </g>
  <text x="600" y="625" text-anchor="middle" font-family="Georgia,serif" font-size="27" fill="#263c3b">fᵣ([0,1]) ⊆ [0,1]  exactly when  r ∈ [0,4]</text>
</svg>
