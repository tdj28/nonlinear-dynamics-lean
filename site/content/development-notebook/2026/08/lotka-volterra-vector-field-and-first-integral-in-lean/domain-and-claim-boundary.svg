<svg xmlns="http://www.w3.org/2000/svg" width="760" height="390" viewBox="0 0 760 390" role="img" aria-labelledby="title desc">
  <title id="title">Full-plane field and positive-domain first-integral boundary</title>
  <desc id="desc">A full-plane polynomial field contains a highlighted positive quadrant. Logarithmic differentiation is allowed only in the highlighted region. A lower boundary stops before invariance, periodic orbits, flows, and stability.</desc>
  <rect width="760" height="390" fill="#F7F4F0"/>
  <style>
    .t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#2C2924}.title{font-size:15px;font-weight:700}.h{font-size:13px;font-weight:700}.s{font-size:12px}.m{font-size:11px;fill:#5A544C}.plane{fill:#E8F0F7;stroke:#4B6787;stroke-width:1.6}.pos{fill:#EAF1E5;stroke:#6F8D5E;stroke-width:1.8}.warn{fill:#F3E8E0;stroke:#A67C52;stroke-width:1.5}.neutral{fill:#FBF9F6;stroke:#C4B8A8;stroke-width:1.4}.dash{stroke:#A89B8C;stroke-width:1.5;stroke-dasharray:5 4}.arrow{stroke:#A67C52;stroke-width:2;fill:none;marker-end:url(#arrow)}
  </style>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#A67C52"/></marker></defs>
  <text x="24" y="28" class="t title">Keep the carrier, logarithmic domain, and dynamics distinct</text>
  <text x="24" y="48" class="t m">Each box states a different mathematical obligation.</text>
  <rect x="24" y="72" width="330" height="168" rx="12" class="plane"/>
  <text x="42" y="99" class="t h">FULL REAL PLANE</text>
  <text x="42" y="121" class="t m">polynomial vector field is defined here</text>
  <line x1="189" y1="140" x2="189" y2="220" class="dash"/>
  <line x1="75" y1="181" x2="304" y2="181" class="dash"/>
  <rect x="189" y="140" width="115" height="41" class="pos"/>
  <text x="246" y="165" text-anchor="middle" class="t s">positive quadrant</text>
  <circle cx="259" cy="156" r="5" fill="#6F8D5E"/>
  <text x="43" y="215" class="t s">axes: exact field formulas</text>
  <path d="M354 155 H398" class="arrow"/>
  <rect x="406" y="72" width="330" height="168" rx="12" class="pos"/>
  <text x="424" y="99" class="t h">STRICTLY POSITIVE VALUES</text>
  <text x="424" y="123" class="t s">both logarithmic derivatives valid</text>
  <rect x="430" y="143" width="282" height="68" rx="9" class="neutral"/>
  <text x="571" y="168" text-anchor="middle" class="t s">component ODE hypotheses</text>
  <text x="571" y="191" text-anchor="middle" class="t h">pointwise derivative cancels to zero</text>
  <line x1="24" y1="264" x2="736" y2="264" class="dash"/>
  <text x="380" y="286" text-anchor="middle" class="t h">NOT CROSSED BY THIS SLICE</text>
  <rect x="24" y="302" width="166" height="48" rx="10" class="warn"/><text x="107" y="331" text-anchor="middle" class="t s">positive invariance</text>
  <rect x="206" y="302" width="166" height="48" rx="10" class="warn"/><text x="289" y="331" text-anchor="middle" class="t s">closed periodic orbits</text>
  <rect x="388" y="302" width="166" height="48" rx="10" class="warn"/><text x="471" y="331" text-anchor="middle" class="t s">global flow</text>
  <rect x="570" y="302" width="166" height="48" rx="10" class="warn"/><text x="653" y="331" text-anchor="middle" class="t s">stability</text>
</svg>
