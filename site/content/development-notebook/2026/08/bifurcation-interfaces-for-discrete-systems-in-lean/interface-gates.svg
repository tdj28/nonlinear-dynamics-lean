<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
  <title id="title">Gates from a parameterized family to a checked bifurcation witness</title>
  <desc id="desc">Four cards show a family of maps, a conjugacy-invariant classifier, failure of local constancy, and an obstruction to whole-state-space conjugacy. A separate lower row lists stronger layers not supplied: derivatives, hyperbolicity, normal forms, and numerical detection.</desc>
  <rect width="1200" height="690" fill="#F7F4F0"/>
  <style>.t{font-family:Inter,Arial,sans-serif;fill:#2C2924}.title{font-size:28px;font-weight:700}.h{font-size:19px;font-weight:700}.s{font-size:16px}.m{font-size:14px;fill:#5A544C}.card{stroke-width:2}.arrow{stroke:#A67C52;stroke-width:4;fill:none;marker-end:url(#a)}</style>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#A67C52"/></marker></defs>
  <text x="50" y="56" class="t title">A safe route from family data to bifurcation</text>
  <text x="50" y="88" class="t m">Every implication names the invariant being used.</text>
  <rect x="55" y="145" width="235" height="180" rx="14" fill="#E8F0F7" stroke="#4B6787" class="card"/>
  <text x="172" y="188" text-anchor="middle" class="t h">Family of self-maps</text>
  <text x="172" y="230" text-anchor="middle" class="t s">one update rule</text><text x="172" y="256" text-anchor="middle" class="t s">for each parameter</text>
  <rect x="350" y="145" width="235" height="180" rx="14" fill="#FBF9F6" stroke="#C4B8A8" class="card"/>
  <text x="467" y="188" text-anchor="middle" class="t h">Selected classifier</text>
  <text x="467" y="230" text-anchor="middle" class="t s">fixed-point existence</text><text x="467" y="256" text-anchor="middle" class="t s">is conjugacy-invariant</text>
  <rect x="645" y="145" width="235" height="180" rx="14" fill="#F3E8E0" stroke="#A67C52" class="card"/>
  <text x="762" y="188" text-anchor="middle" class="t h">Nearby change</text>
  <text x="762" y="230" text-anchor="middle" class="t s">different classifier values</text><text x="762" y="256" text-anchor="middle" class="t s">occur arbitrarily near</text>
  <rect x="940" y="145" width="215" height="180" rx="14" fill="#EAF1E5" stroke="#6F8D5E" class="card"/>
  <text x="1047" y="188" text-anchor="middle" class="t h">Obstruction</text>
  <text x="1047" y="230" text-anchor="middle" class="t s">nearby maps cannot all</text><text x="1047" y="256" text-anchor="middle" class="t s">be globally conjugate</text>
  <path d="M290 235 H340" class="arrow"/><path d="M585 235 H635" class="arrow"/><path d="M880 235 H930" class="arrow"/>
  <text x="55" y="405" class="t h">Separate stronger layers</text>
  <rect x="55" y="440" width="250" height="92" rx="12" fill="#EDE8E1" stroke="#7F786D"/><text x="180" y="478" text-anchor="middle" class="t h">Differentiability</text><text x="180" y="505" text-anchor="middle" class="t m">not bundled</text>
  <rect x="330" y="440" width="250" height="92" rx="12" fill="#EDE8E1" stroke="#7F786D"/><text x="455" y="478" text-anchor="middle" class="t h">Hyperbolicity</text><text x="455" y="505" text-anchor="middle" class="t m">not inferred</text>
  <rect x="605" y="440" width="250" height="92" rx="12" fill="#EDE8E1" stroke="#7F786D"/><text x="730" y="478" text-anchor="middle" class="t h">Normal form</text><text x="730" y="505" text-anchor="middle" class="t m">requires more hypotheses</text>
  <rect x="880" y="440" width="275" height="92" rx="12" fill="#EDE8E1" stroke="#7F786D"/><text x="1017" y="478" text-anchor="middle" class="t h">Numerical detection</text><text x="1017" y="505" text-anchor="middle" class="t m">not supplied</text>
  <rect x="55" y="605" width="1100" height="48" rx="12" fill="#EAF1E5" stroke="#6F8D5E"/>
  <text x="605" y="636" text-anchor="middle" class="t s">A classifier change is a sufficient witness only after conjugacy invariance has been established.</text>
</svg>
