<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="commuting-square-title commuting-square-desc">
  <title id="commuting-square-title">A commuting square for one quarter turn</title>
  <desc id="commuting-square-desc">North turns right to east along the top row. Projecting north to the vertical axis and then toggling reaches the horizontal axis along the bottom row. Projecting east directly also reaches horizontal, so both paths have the same endpoint.</desc>
  <defs><marker id="sq-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#A36B3F"/></marker><style>.paper{fill:#FBF7F0}.ink{fill:#26343A}.muted{fill:#655F57}.source{fill:#E8F0F7;stroke:#4B6787;stroke-width:2}.target{fill:#EAF1E5;stroke:#668357;stroke-width:2}.arrow{stroke:#A36B3F;stroke-width:3;fill:none;marker-end:url(#sq-arrow)}.projection{stroke:#4B6787;stroke-width:3;stroke-dasharray:8 6;fill:none;marker-end:url(#sq-arrow)}.head{font:700 30px Georgia,serif}.label{font:700 21px Arial,sans-serif}.body{font:16px Arial,sans-serif}.small{font:14px Arial,sans-serif}</style></defs>
  <rect class="paper" width="1200" height="650" rx="18"/>
  <text class="head ink" x="60" y="58">One update commutes with one projection</text>
  <text class="body muted" x="60" y="88">Follow either route from north. Both finish at the horizontal axis.</text>
  <rect class="source" x="155" y="150" width="250" height="100" rx="15"/><rect class="source" x="795" y="150" width="250" height="100" rx="15"/>
  <text class="label ink" x="280" y="210" text-anchor="middle">north</text><text class="label ink" x="920" y="210" text-anchor="middle">east</text>
  <path class="arrow" d="M415 200 H785"/><text class="body muted" x="600" y="181" text-anchor="middle">quarter turn</text>
  <rect class="target" x="155" y="410" width="250" height="100" rx="15"/><rect class="target" x="795" y="410" width="250" height="100" rx="15"/>
  <text class="label ink" x="280" y="470" text-anchor="middle">vertical axis</text><text class="label ink" x="920" y="470" text-anchor="middle">horizontal axis</text>
  <path class="arrow" d="M415 460 H785"/><text class="body muted" x="600" y="441" text-anchor="middle">toggle axis</text>
  <path class="projection" d="M280 260 V400"/><path class="projection" d="M920 260 V400"/>
  <text class="small muted" x="305" y="335">forget orientation</text><text class="small muted" x="945" y="335">forget orientation</text>
  <rect x="170" y="560" width="860" height="58" rx="11" fill="#26343A"/>
  <text class="body" fill="#FBF7F0" x="600" y="596" text-anchor="middle">The equality of the two routes is the semiconjugacy equation.</text>
</svg>
