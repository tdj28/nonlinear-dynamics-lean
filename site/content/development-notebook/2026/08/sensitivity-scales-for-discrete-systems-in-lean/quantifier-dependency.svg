<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 560" role="img" aria-labelledby="title desc">
  <title id="title">Sensitivity quantifier dependency</title>
  <desc id="desc">A vertical sequence fixes a positive separation scale, receives a state and neighborhood, then chooses a nearby state and separation time. A red crossed branch chooses the time before the neighborhood and is invalid.</desc>
  <rect width="1080" height="560" rx="28" fill="#f7f2e8"/>
  <text x="540" y="58" text-anchor="middle" font-family="system-ui,sans-serif" font-size="30" font-weight="700" fill="#173f46">Who may depend on whom?</text>
  <g font-family="system-ui,sans-serif" text-anchor="middle">
    <rect x="350" y="90" width="380" height="72" rx="18" fill="#0a7280"/>
    <text x="540" y="120" font-size="22" font-weight="700" fill="white">1. Fix δ &gt; 0</text>
    <text x="540" y="145" font-size="16" fill="#e4fbff">one scale for the whole space</text>
    <path d="M540 162V202" stroke="#486b70" stroke-width="5" marker-end="url(#arrow)"/>
    <rect x="320" y="205" width="440" height="82" rx="18" fill="#d8e8e4" stroke="#0a7280" stroke-width="3"/>
    <text x="540" y="238" font-size="22" font-weight="700" fill="#173f46">2. Receive x and its neighborhood</text>
    <text x="540" y="265" font-size="16" fill="#355c61">the requested input resolution</text>
    <path d="M540 287V327" stroke="#486b70" stroke-width="5" marker-end="url(#arrow)"/>
    <rect x="300" y="330" width="480" height="92" rx="18" fill="#f4c86a" stroke="#9b6715" stroke-width="3"/>
    <text x="540" y="365" font-size="22" font-weight="700" fill="#4d350d">3. Choose y and n</text>
    <text x="540" y="393" font-size="16" fill="#5e471e">y is nearby; fⁿ(x) and fⁿ(y) separate</text>
  </g>
  <g font-family="system-ui,sans-serif">
    <path d="M318 246C210 246 170 310 170 372" fill="none" stroke="#b84a5a" stroke-width="5" stroke-dasharray="10 8"/>
    <rect x="55" y="370" width="230" height="88" rx="16" fill="#f8dfe2" stroke="#b84a5a" stroke-width="3"/>
    <text x="170" y="402" text-anchor="middle" font-size="19" font-weight="700" fill="#7c2633">Choose n too early</text>
    <text x="170" y="430" text-anchor="middle" font-size="15" fill="#7c2633">fails for deep prefixes</text>
    <path d="M78 382L262 447M262 382L78 447" stroke="#b84a5a" stroke-width="7" stroke-linecap="round" opacity=".85"/>
    <text x="540" y="486" text-anchor="middle" font-size="19" font-weight="700" fill="#173f46">Required output: δ &lt; d(fⁿ(x), fⁿ(y))</text>
    <text x="540" y="520" text-anchor="middle" font-size="16" fill="#486b70">No fixed n, rate, or persistent separation is asserted.</text>
  </g>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#486b70"/></marker></defs>
</svg>
