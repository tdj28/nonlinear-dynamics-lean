<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc">
  <title id="title">Exact Lorenz field value at the classical parameters</title>
  <desc id="desc">Three calculation rows evaluate the Lorenz vector field at state one comma two comma three and produce tangent coordinates ten, twenty-three, and minus six.</desc>
  <rect width="1120" height="560" rx="24" fill="#f1e9da"/>
  <text x="560" y="52" text-anchor="middle" font-family="system-ui,sans-serif" font-size="29" font-weight="750" fill="#16324f">CLASSICAL PARAMETERS AT ONE EXACT STATE</text>
  <text x="560" y="88" text-anchor="middle" font-family="Georgia,serif" font-size="24" fill="#285448">sigma = 10, rho = 28, beta = 8/3, state = (1, 2, 3)</text>
  <rect x="64" y="122" width="992" height="92" rx="18" fill="#fffaf1" stroke="#315f63" stroke-width="3"/>
  <circle cx="115" cy="168" r="25" fill="#dfece3" stroke="#315f63" stroke-width="2"/>
  <text x="115" y="176" text-anchor="middle" font-family="system-ui,sans-serif" font-size="24" font-weight="750" fill="#16324f">x</text>
  <text x="180" y="176" font-family="Georgia,serif" font-size="28" fill="#263c3b">10 (2 - 1)</text>
  <path d="M405 168 H585" stroke="#315f63" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="760" y="176" text-anchor="middle" font-family="Georgia,serif" font-size="32" font-weight="700" fill="#874d3b">x' = 10</text>
  <rect x="64" y="232" width="992" height="92" rx="18" fill="#fffaf1" stroke="#315f63" stroke-width="3"/>
  <circle cx="115" cy="278" r="25" fill="#e4eef4" stroke="#315f63" stroke-width="2"/>
  <text x="115" y="286" text-anchor="middle" font-family="system-ui,sans-serif" font-size="24" font-weight="750" fill="#16324f">y</text>
  <text x="180" y="286" font-family="Georgia,serif" font-size="28" fill="#263c3b">1 (28 - 3) - 2</text>
  <path d="M405 278 H585" stroke="#315f63" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="760" y="286" text-anchor="middle" font-family="Georgia,serif" font-size="32" font-weight="700" fill="#874d3b">y' = 23</text>
  <rect x="64" y="342" width="992" height="92" rx="18" fill="#fffaf1" stroke="#315f63" stroke-width="3"/>
  <circle cx="115" cy="388" r="25" fill="#f3dfca" stroke="#315f63" stroke-width="2"/>
  <text x="115" y="396" text-anchor="middle" font-family="system-ui,sans-serif" font-size="24" font-weight="750" fill="#16324f">z</text>
  <text x="180" y="396" font-family="Georgia,serif" font-size="28" fill="#263c3b">1 x 2 - (8/3) x 3</text>
  <path d="M405 388 H585" stroke="#315f63" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="760" y="396" text-anchor="middle" font-family="Georgia,serif" font-size="32" font-weight="700" fill="#874d3b">z' = -6</text>
  <rect x="185" y="468" width="750" height="62" rx="18" fill="#dfece3" stroke="#315f63" stroke-width="3"/>
  <text x="560" y="508" text-anchor="middle" font-family="Georgia,serif" font-size="29" font-weight="700" fill="#16324f">F(1, 2, 3) = (10, 23, -6)</text>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#315f63"/></marker></defs>
</svg>
