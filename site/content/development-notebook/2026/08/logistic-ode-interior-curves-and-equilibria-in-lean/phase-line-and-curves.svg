<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Positive-rate logistic phase line and interior curves</title>
  <desc id="desc">The phase line has equilibria at zero and one, with negative, positive, and negative vector-field signs across the three open regions. Three sigmoid curves stay between zero and one.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#315f63"/></marker>
    <clipPath id="curveClip"><rect x="650" y="120" width="470" height="410" rx="20"/></clipPath>
  </defs>
  <rect width="1200" height="650" rx="24" fill="#f7f1e5"/>
  <text x="60" y="68" font-family="system-ui,sans-serif" font-size="30" font-weight="750" fill="#183c3a">ONE VECTOR FIELD, TWO CHECKED VIEWS</text>
  <g transform="translate(55 120)">
    <rect width="520" height="410" rx="22" fill="#fffaf1" stroke="#315f63" stroke-width="3"/>
    <text x="30" y="48" font-family="system-ui,sans-serif" font-size="23" font-weight="700" fill="#285448">PHASE LINE FOR r &gt; 0</text>
    <line x1="60" y1="205" x2="460" y2="205" stroke="#263c3b" stroke-width="5"/>
    <circle cx="180" cy="205" r="13" fill="#a14f3f"/><circle cx="350" cy="205" r="13" fill="#a14f3f"/>
    <text x="174" y="250" font-family="Georgia,serif" font-size="26" fill="#263c3b">0</text><text x="344" y="250" font-family="Georgia,serif" font-size="26" fill="#263c3b">1</text>
    <line x1="140" y1="150" x2="75" y2="150" stroke="#315f63" stroke-width="6" marker-end="url(#arrow)"/>
    <line x1="220" y1="150" x2="310" y2="150" stroke="#315f63" stroke-width="6" marker-end="url(#arrow)"/>
    <line x1="430" y1="150" x2="375" y2="150" stroke="#315f63" stroke-width="6" marker-end="url(#arrow)"/>
    <text x="100" y="120" text-anchor="middle" font-family="Georgia,serif" font-size="22" fill="#874d3b">Fᵣ(x) &lt; 0</text>
    <text x="265" y="120" text-anchor="middle" font-family="Georgia,serif" font-size="22" fill="#285448">Fᵣ(x) &gt; 0</text>
    <text x="410" y="120" text-anchor="middle" font-family="Georgia,serif" font-size="22" fill="#874d3b">Fᵣ(x) &lt; 0</text>
    <rect x="55" y="290" width="410" height="78" rx="14" fill="#dfece3"/>
    <text x="260" y="323" text-anchor="middle" font-family="Georgia,serif" font-size="22" fill="#263c3b">Fᵣ(x) = r x(1 − x)</text>
    <text x="260" y="351" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" fill="#285448">zero and one are the nonzero-rate equilibria</text>
  </g>
  <g clip-path="url(#curveClip)">
    <rect x="650" y="120" width="470" height="410" rx="20" fill="#fffaf1" stroke="#315f63" stroke-width="3"/>
    <line x1="700" y1="470" x2="1080" y2="470" stroke="#a14f3f" stroke-width="3" stroke-dasharray="10 8"/>
    <line x1="700" y1="180" x2="1080" y2="180" stroke="#a14f3f" stroke-width="3" stroke-dasharray="10 8"/>
    <path d="M680 456 C790 452 820 430 860 340 C900 250 930 196 1090 185" fill="none" stroke="#315f63" stroke-width="7"/>
    <path d="M680 445 C760 425 810 365 850 285 C895 205 965 183 1090 181" fill="none" stroke="#2d7f73" stroke-width="7"/>
    <path d="M680 400 C745 300 785 215 900 188 C965 180 1030 180 1090 180" fill="none" stroke="#d18b3c" stroke-width="7"/>
  </g>
  <text x="885" y="158" text-anchor="middle" font-family="system-ui,sans-serif" font-size="23" font-weight="700" fill="#285448">PHASE-SHIFTED INTERIOR CURVES</text>
  <text x="675" y="185" font-family="Georgia,serif" font-size="23" fill="#874d3b">1</text><text x="675" y="477" font-family="Georgia,serif" font-size="23" fill="#874d3b">0</text>
  <text x="600" y="606" text-anchor="middle" font-family="Georgia,serif" font-size="24" fill="#263c3b">The arrows give derivative signs; the sigmoid derivative checks the displayed curve family.</text>
</svg>
