<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="600" viewBox="0 0 1120 600" role="img" aria-labelledby="title desc">
  <title id="title">Raw finite spacing pipeline</title>
  <desc id="desc">The decreasing levels two, two, and minus one give gaps zero and three. A counting measure retains both gaps. Dividing by two gives mass one but mean three halves.</desc>
  <rect width="1120" height="600" rx="24" fill="#f7f2e8"/>
  <text x="50" y="55" font-family="system-ui,sans-serif" font-size="29" font-weight="750" fill="#17324d">From ordered levels to a raw empirical measure</text>
  <rect x="48" y="90" width="276" height="410" rx="20" fill="#e6eef4" stroke="#376780" stroke-width="3"/>
  <text x="186" y="126" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" font-weight="750" fill="#17324d">DECREASING LEVELS</text>
  <line x1="94" y1="195" x2="278" y2="195" stroke="#2d7f73" stroke-width="6"/>
  <line x1="94" y1="207" x2="278" y2="207" stroke="#2d7f73" stroke-width="6"/>
  <line x1="94" y1="399" x2="278" y2="399" stroke="#8a5b3d" stroke-width="6"/>
  <text x="72" y="202" text-anchor="end" font-family="Georgia,serif" font-size="24" fill="#17324d">2</text>
  <text x="72" y="406" text-anchor="end" font-family="Georgia,serif" font-size="24" fill="#17324d">−1</text>
  <text x="186" y="458" text-anchor="middle" font-family="Georgia,serif" font-size="26" fill="#17324d">λ₀ ≥ λ₁ ≥ λ₂</text>
  <path d="M326 290 H384" stroke="#315f63" stroke-width="5" marker-end="url(#a)"/>
  <rect x="396" y="90" width="276" height="410" rx="20" fill="#f4e4d2" stroke="#8a5b3d" stroke-width="3"/>
  <text x="534" y="126" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" font-weight="750" fill="#70442d">ADJACENT GAPS</text>
  <rect x="438" y="177" width="192" height="88" rx="16" fill="#fffaf1"/>
  <text x="534" y="214" text-anchor="middle" font-family="Georgia,serif" font-size="27" fill="#70442d">2 − 2 = 0</text>
  <text x="534" y="246" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" fill="#70442d">repeated levels retained</text>
  <rect x="438" y="302" width="192" height="88" rx="16" fill="#fffaf1"/>
  <text x="534" y="339" text-anchor="middle" font-family="Georgia,serif" font-size="27" fill="#70442d">2 − (−1) = 3</text>
  <text x="534" y="371" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" fill="#70442d">same rank adjacency</text>
  <text x="534" y="458" text-anchor="middle" font-family="Georgia,serif" font-size="26" fill="#70442d">Δ = (0, 3)</text>
  <path d="M674 290 H732" stroke="#315f63" stroke-width="5" marker-end="url(#a)"/>
  <rect x="744" y="90" width="328" height="410" rx="20" fill="#e1eee6" stroke="#2d7f73" stroke-width="3"/>
  <text x="908" y="126" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" font-weight="750" fill="#285448">MEASURES</text>
  <text x="908" y="195" text-anchor="middle" font-family="Georgia,serif" font-size="27" fill="#285448">C = δ₀ + δ₃</text>
  <text x="908" y="230" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" fill="#285448">counting mass = 2</text>
  <line x1="796" y1="267" x2="1020" y2="267" stroke="#8eb5aa" stroke-width="2"/>
  <text x="908" y="326" text-anchor="middle" font-family="Georgia,serif" font-size="26" fill="#285448">L = ½δ₀ + ½δ₃</text>
  <text x="908" y="361" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" fill="#285448">probability mass = 1</text>
  <text x="908" y="414" text-anchor="middle" font-family="Georgia,serif" font-size="25" fill="#8a3333">mean = 3/2 ≠ 1</text>
  <text x="908" y="458" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" font-weight="700" fill="#8a3333">MASS NORMALIZATION ≠ UNFOLDING</text>
  <text x="560" y="555" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="#17324d">EVERY ADJACENT SLOT COUNTS · ZERO GAPS STAY · GAP SCALE STAYS RAW</text>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#315f63"/></marker></defs>
</svg>
