<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">A stable moving reference orbit under translation</title>
  <desc id="desc">At four times, reference and nearby translation orbits remain a constant distance apart inside an epsilon tube.</desc>
  <rect width="1200" height="680" fill="#f4eddf"/>
  <rect x="36" y="36" width="1128" height="608" rx="28" fill="#fffaf0" stroke="#315f63" stroke-width="3"/>
  <text x="76" y="94" font-family="Arial,sans-serif" font-size="20" letter-spacing="2" fill="#7a4d69">TRANSLATION f(x)=x+3</text>
  <text x="76" y="145" font-family="Georgia,serif" font-size="31" fill="#23343b">The reference orbit moves; the gap does not grow</text>
  <path d="M125 390 L415 310 L705 230 L995 150 L995 280 L705 360 L415 440 L125 520 Z" fill="#e4efe9"/>
  <path d="M125 455 L415 375 L705 295 L995 215" fill="none" stroke="#315f63" stroke-width="7"/>
  <path d="M125 420 L415 340 L705 260 L995 180" fill="none" stroke="#b24b40" stroke-width="6"/>
  <g fill="#315f63"><circle cx="125" cy="455" r="10"/><circle cx="415" cy="375" r="10"/><circle cx="705" cy="295" r="10"/><circle cx="995" cy="215" r="10"/></g>
  <g fill="#b24b40"><circle cx="125" cy="420" r="9"/><circle cx="415" cy="340" r="9"/><circle cx="705" cy="260" r="9"/><circle cx="995" cy="180" r="9"/></g>
  <g font-family="Arial,sans-serif" font-size="19" fill="#23343b" text-anchor="middle"><text x="125" y="560">n=0</text><text x="415" y="480">n=1</text><text x="705" y="400">n=2</text><text x="995" y="320">n=3</text></g>
  <text x="83" y="420" font-family="Arial,sans-serif" font-size="18" fill="#b24b40" text-anchor="end">nearby</text>
  <text x="83" y="459" font-family="Arial,sans-serif" font-size="18" fill="#315f63" text-anchor="end">reference</text>
  <line x1="1035" y1="180" x2="1035" y2="215" stroke="#8a6d38" stroke-width="4"/>
  <text x="1050" y="205" font-family="Arial,sans-serif" font-size="18" fill="#8a6d38">gap = 0.2</text>
  <text x="76" y="608" font-family="Arial,sans-serif" font-size="19" fill="#6a675f">The band is an ε-tube, not a basin pulling points toward the reference.</text>
</svg>
