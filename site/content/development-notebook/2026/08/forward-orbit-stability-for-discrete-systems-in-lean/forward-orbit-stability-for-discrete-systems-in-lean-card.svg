  <text x="1025" y="304" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#23343b">fixedness</text>
  <text x="1025" y="340" text-anchor="middle" font-family="Georgia,serif" font-size="25" fill="#7a4d69">separate gate</text>
  <text x="76" y="512" font-family="Arial,sans-serif" font-size="21" fill="#23343b">one δ · every n ∈ ℕ · one ε-tube around the reference orbit</text>
