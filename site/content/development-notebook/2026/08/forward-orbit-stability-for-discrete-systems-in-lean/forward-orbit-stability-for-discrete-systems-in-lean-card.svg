  <text x="76" y="168" font-family="Georgia,serif" font-size="46" fill="#23343b">Forward-orbit stability</text>
  <path d="M105 330 C250 300 350 215 505 235 S735 360 900 270 L900 400 C735 490 660 365 505 365 S250 430 105 460 Z" fill="#e4efe9" opacity="0.8"/>
  <path d="M105 380 C250 350 350 265 505 285 S735 410 900 320" fill="none" stroke="#315f63" stroke-width="8"/>
