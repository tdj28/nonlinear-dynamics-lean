<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420" role="img" aria-labelledby="title desc">
  <title id="title">The exact tent-map parameter gate</title>
  <desc id="desc">Three panels compare negative slopes, slopes from zero through two, and slopes above two using the midpoint image.</desc>
  <rect width="920" height="420" fill="#F7F4F0"/>
  <style>.t{font-family:Inter,Arial,sans-serif;fill:#2C2924}.h{font-size:20px;font-weight:700}.s{font-size:15px}.m{font-size:13px;fill:#5A544C}.bad{fill:#F3E8E0;stroke:#A67C52;stroke-width:2}.good{fill:#EAF1E5;stroke:#6F8D5E;stroke-width:2}.axis{stroke:#4B6787;stroke-width:3}</style>
  <text x="28" y="36" class="t h">The midpoint image decides necessity</text>
  <text x="28" y="60" class="t m">The peak has height s / 2; the whole tent is no higher on the unit interval.</text>
  <rect x="28" y="88" width="260" height="230" rx="14" class="bad"/>
  <rect x="330" y="88" width="260" height="230" rx="14" class="good"/>
  <rect x="632" y="88" width="260" height="230" rx="14" class="bad"/>
  <text x="158" y="122" text-anchor="middle" class="t h">negative slope</text>
  <text x="460" y="122" text-anchor="middle" class="t h">zero through two</text>
  <text x="762" y="122" text-anchor="middle" class="t h">slope above two</text>
  <line x1="70" y1="248" x2="246" y2="248" class="axis"/><line x1="372" y1="248" x2="548" y2="248" class="axis"/><line x1="674" y1="248" x2="850" y2="248" class="axis"/>
  <path d="M80 248 L158 282 L236 248" fill="none" stroke="#A67C52" stroke-width="6"/>
  <path d="M382 248 L460 160 L538 248" fill="none" stroke="#6F8D5E" stroke-width="6"/>
  <path d="M684 248 L762 132 L840 248" fill="none" stroke="#A67C52" stroke-width="6"/>
  <text x="158" y="302" text-anchor="middle" class="t s">peak below zero</text>
  <text x="460" y="190" text-anchor="middle" class="t s">peak inside interval</text>
  <text x="762" y="154" text-anchor="middle" class="t s">peak above one</text>
  <rect x="28" y="342" width="864" height="52" rx="12" fill="#EAF1E5" stroke="#6F8D5E"/>
  <text x="460" y="374" text-anchor="middle" class="t s">Exactly the slopes from zero through two preserve the closed unit interval.</text>
</svg>
