<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Pendulum vector field and energy in Lean</title>
  <desc id="desc">A quarter-turn pendulum, phase-plane vector, and energy cancellation introduce a Lean research note.</desc>
  <rect width="1200" height="630" fill="#f1e9da"/><rect x="40" y="40" width="1120" height="550" rx="28" fill="#fffaf1" stroke="#315f63" stroke-width="4"/>
  <text x="78" y="105" font-family="system-ui,sans-serif" font-size="25" font-weight="750" fill="#2d7f73">RESEARCH NOTE · CONTINUOUS DYNAMICS</text>
  <text x="78" y="177" font-family="system-ui,sans-serif" font-size="46" font-weight="780" fill="#16324f">PENDULUM VECTOR FIELD</text>
  <text x="78" y="233" font-family="system-ui,sans-serif" font-size="46" font-weight="780" fill="#16324f">AND ENERGY IN LEAN</text>
  <circle cx="915" cy="150" r="12" fill="#263c3b"/><line x1="915" y1="150" x2="1045" y2="150" stroke="#315f63" stroke-width="10" stroke-linecap="round"/><circle cx="1045" cy="150" r="30" fill="#d18b3c" stroke="#874d3b" stroke-width="4"/>
  <rect x="105" y="290" width="990" height="96" rx="20" fill="#dfece3" stroke="#315f63" stroke-width="3"/><text x="600" y="350" text-anchor="middle" font-family="Georgia,serif" font-size="35" fill="#263c3b">Fκ(angle, velocity) = (velocity, −κ sin(angle))</text>
  <rect x="105" y="415" width="465" height="108" rx="18" fill="#e4eef4"/><text x="338" y="458" text-anchor="middle" font-family="system-ui,sans-serif" font-size="20" font-weight="700" fill="#16324f">QUARTER-TURN CHECK</text><text x="338" y="498" text-anchor="middle" font-family="Georgia,serif" font-size="29" fill="#263c3b">field (0, −1) · energy 1</text>
  <rect x="630" y="415" width="465" height="108" rx="18" fill="#f3dfca"/><text x="862" y="458" text-anchor="middle" font-family="system-ui,sans-serif" font-size="20" font-weight="700" fill="#874d3b">CLAIM BOUNDARY</text><text x="862" y="498" text-anchor="middle" font-family="Georgia,serif" font-size="25" fill="#263c3b">local cancellation, not a flow</text>
  <text x="600" y="560" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" font-weight="650" fill="#285448">EQUILIBRIA · PERIODICITY · POINTWISE CONSERVATION</text>
</svg>
