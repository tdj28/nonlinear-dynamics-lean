<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Quarter-turn pendulum state, field, and energy</title>
  <desc id="desc">A pendulum at a rightward quarter turn connects to its phase-plane state, vector-field value, and normalized energy.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#315f63"/></marker></defs>
  <rect width="1200" height="650" rx="24" fill="#f7f1e5"/>
  <text x="60" y="68" font-family="system-ui,sans-serif" font-size="30" font-weight="750" fill="#183c3a">ONE STATE, THREE MATHEMATICAL OBJECTS</text>
  <g transform="translate(55 118)">
    <rect width="330" height="420" rx="22" fill="#fffaf1" stroke="#315f63" stroke-width="3"/>
    <text x="165" y="48" text-anchor="middle" font-family="system-ui,sans-serif" font-size="22" font-weight="700" fill="#285448">PHYSICAL POSE</text>
    <line x1="165" y1="82" x2="165" y2="280" stroke="#d6c8b1" stroke-width="4" stroke-dasharray="9 8"/>
    <circle cx="165" cy="92" r="13" fill="#263c3b"/>
    <line x1="165" y1="92" x2="285" y2="92" stroke="#315f63" stroke-width="10" stroke-linecap="round"/>
    <circle cx="285" cy="92" r="29" fill="#d18b3c" stroke="#874d3b" stroke-width="4"/>
    <path d="M165 162 A70 70 0 0 1 235 92" fill="none" stroke="#a14f3f" stroke-width="4" marker-end="url(#arrow)"/>
    <text x="215" y="154" font-family="Georgia,serif" font-size="27" fill="#874d3b">quarter turn</text>
    <rect x="36" y="310" width="258" height="72" rx="14" fill="#dfece3"/>
    <text x="165" y="355" text-anchor="middle" font-family="Georgia,serif" font-size="28" fill="#263c3b">angle π/2, velocity 0</text>
  </g>
  <line x1="410" y1="330" x2="495" y2="330" stroke="#315f63" stroke-width="5" marker-end="url(#arrow)"/>
  <g transform="translate(515 118)">
    <rect width="630" height="420" rx="22" fill="#fffaf1" stroke="#315f63" stroke-width="3"/>
    <text x="315" y="48" text-anchor="middle" font-family="system-ui,sans-serif" font-size="22" font-weight="700" fill="#285448">PHASE-PLANE LABELS AT κ = 1</text>
    <rect x="45" y="88" width="540" height="86" rx="16" fill="#e4eef4"/>
    <text x="315" y="142" text-anchor="middle" font-family="Georgia,serif" font-size="31" fill="#16324f">state = (π/2, 0)</text>
    <rect x="45" y="198" width="255" height="142" rx="16" fill="#dfece3"/>
    <text x="172" y="238" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="#285448">VECTOR FIELD</text>
    <text x="172" y="292" text-anchor="middle" font-family="Georgia,serif" font-size="33" fill="#263c3b">(0, −1)</text>
    <rect x="330" y="198" width="255" height="142" rx="16" fill="#f3dfca"/>
    <text x="457" y="238" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="#874d3b">ENERGY</text>
    <text x="457" y="292" text-anchor="middle" font-family="Georgia,serif" font-size="33" fill="#263c3b">1</text>
    <text x="315" y="385" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" fill="#465b59">instantaneous derivative and scalar state label</text>
  </g>
  <text x="600" y="607" text-anchor="middle" font-family="Georgia,serif" font-size="23" fill="#263c3b">Neither value advances the state through a finite time interval.</text>
</svg>
