<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">Global integral curves from uniform local time</title><desc id="desc">Overlapping green local intervals extend across time beneath a continuous rust-colored trajectory. A separate uniqueness gate appears at right.</desc><rect width="1200" height="630" fill="#f7f1e5"/><text x="70" y="88" font-family="system-ui" font-size="28" font-weight="700" fill="#315d4b">ODE CONTINUATION IN LEAN</text><text x="70" y="155" font-family="system-ui" font-size="49" font-weight="750" fill="#183c3a">LOCAL WINDOWS</text><text x="70" y="214" font-family="system-ui" font-size="49" font-weight="750" fill="#183c3a">TO A GLOBAL CURVE</text><path d="M80 345 C250 235 370 440 545 310 S820 235 1010 350" fill="none" stroke="#874d3b" stroke-width="9" stroke-linecap="round"/><line x1="80" y1="455" x2="1010" y2="455" stroke="#263c3b" stroke-width="4"/><g fill="#dce9df" stroke="#315d4b" stroke-width="3"><rect x="95" y="412" width="240" height="72" rx="20"/><rect x="275" y="432" width="240" height="72" rx="20"/><rect x="455" y="412" width="240" height="72" rx="20"/><rect x="635" y="432" width="240" height="72" rx="20"/></g><rect x="935" y="270" width="195" height="205" rx="22" fill="#efe1d5" stroke="#874d3b" stroke-width="3"/><text x="967" y="325" font-family="system-ui" font-size="22" font-weight="700" fill="#874d3b">SEPARATE GATE</text><text x="967" y="370" font-family="system-ui" font-size="27" fill="#263c3b">C¹ field</text><text x="967" y="410" font-family="system-ui" font-size="27" fill="#263c3b">+ same start</text><text x="967" y="450" font-family="system-ui" font-size="27" font-weight="700" fill="#315d4b">unique curve</text><text x="70" y="570" font-family="system-ui" font-size="25" fill="#263c3b">UNIFORM LOCAL TIME  ·  GLOBAL EXISTENCE  ·  UNIQUENESS KEPT DISTINCT</text></svg>
