<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Lyapunov certificates for continuous-time flows in Lean</title>
  <desc id="desc">A descending scalar curve feeds a stability gate while a separate zero-limit path feeds attraction, and the two join at asymptotic stability.</desc>
  <rect width="1200" height="630" fill="#f1e9da"/><rect x="38" y="38" width="1124" height="554" rx="28" fill="#fbf8f0" stroke="#315f63" stroke-width="4"/>
  <text x="76" y="102" font-family="Arial,sans-serif" font-size="21" letter-spacing="3" fill="#7a4d69">DEVELOPMENT NOTEBOOK · ODE LYAPUNOV</text>
  <text x="76" y="174" font-family="Georgia,serif" font-size="49" fill="#23343b">Scalar descent is one path;</text><text x="76" y="231" font-family="Georgia,serif" font-size="49" fill="#23343b">a zero limit is another</text>
  <path d="M90 310 C250 332 360 410 518 436" fill="none" stroke="#315f63" stroke-width="7"/>
  <line x1="210" y1="340" x2="330" y2="388" stroke="#b06f45" stroke-width="5"/><polygon points="330,388 310,387 318,370" fill="#b06f45"/>
  <rect x="574" y="292" width="210" height="72" rx="14" fill="#e8f0f7" stroke="#4b6787" stroke-width="3"/><text x="679" y="335" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#23343b">STABILITY</text>
  <rect x="574" y="398" width="210" height="72" rx="14" fill="#f3e8e0" stroke="#a67c52" stroke-width="3"/><text x="679" y="441" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#23343b">ATTRACTION</text>
  <path d="M804 328 L886 381 L804 434" fill="none" stroke="#315f63" stroke-width="5"/>
  <rect x="888" y="338" width="230" height="90" rx="18" fill="#eaf1e5" stroke="#6f8d5e" stroke-width="3"/><text x="1003" y="376" text-anchor="middle" font-family="Georgia,serif" font-size="23" fill="#23343b">asymptotic</text><text x="1003" y="405" text-anchor="middle" font-family="Georgia,serif" font-size="23" fill="#23343b">stability</text>
  <text x="76" y="540" font-family="Arial,sans-serif" font-size="19" fill="#7a4d69">nonnegative real time · invariant sublevels · explicit limit hypothesis</text>
</svg>
