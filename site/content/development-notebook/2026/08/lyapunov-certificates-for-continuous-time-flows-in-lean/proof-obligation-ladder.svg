<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="610" viewBox="0 0 1120 610" role="img" aria-labelledby="title desc">
  <title id="title">Separate proof paths from Lyapunov certificates</title>
  <desc id="desc">Continuity and a zero value give an initial sublevel, sublevel control embeds it in a metric ball, and weak descent preserves it to yield stability. A zero scalar limit plus sublevel control yields attraction. Stability and local attraction combine into asymptotic stability.</desc>
  <rect width="1120" height="610" rx="24" fill="#fbf8f0"/>
  <text x="52" y="54" font-family="Georgia,serif" font-size="28" fill="#23343b">Two proof paths, one explicit conjunction</text>
  <rect x="48" y="92" width="230" height="74" rx="15" fill="#e8f0f7" stroke="#4b6787" stroke-width="3"/>
  <text x="163" y="122" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#23343b">V(p) = 0 and</text><text x="163" y="147" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#23343b">continuity at p</text>
  <path d="M278 129 H326" stroke="#315f63" stroke-width="4"/><polygon points="326,129 312,120 312,138" fill="#315f63"/>
  <rect x="328" y="92" width="230" height="74" rx="15" fill="#f3e8e0" stroke="#a67c52" stroke-width="3"/>
  <text x="443" y="122" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#23343b">initial ball lies in</text><text x="443" y="147" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#23343b">a positive sublevel</text>
  <path d="M558 129 H606" stroke="#315f63" stroke-width="4"/><polygon points="606,129 592,120 592,138" fill="#315f63"/>
  <rect x="608" y="92" width="230" height="74" rx="15" fill="#eaf1e5" stroke="#6f8d5e" stroke-width="3"/>
  <text x="723" y="122" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#23343b">weak descent keeps</text><text x="723" y="147" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#23343b">every forward time inside</text>
  <path d="M838 129 H886" stroke="#315f63" stroke-width="4"/><polygon points="886,129 872,120 872,138" fill="#315f63"/>
  <rect x="888" y="92" width="184" height="74" rx="15" fill="#315f63"/>
  <text x="980" y="136" text-anchor="middle" font-family="Georgia,serif" font-size="23" fill="#fff">stability</text>
  <rect x="48" y="242" width="230" height="74" rx="15" fill="#f3e8e0" stroke="#a67c52" stroke-width="3"/>
  <text x="163" y="272" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#23343b">orbital scalar value</text><text x="163" y="297" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#23343b">tends to zero</text>
  <path d="M278 279 H416" stroke="#315f63" stroke-width="4"/><polygon points="416,279 402,270 402,288" fill="#315f63"/>
  <rect x="418" y="242" width="230" height="74" rx="15" fill="#e8f0f7" stroke="#4b6787" stroke-width="3"/>
  <text x="533" y="263" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#23343b">sublevel control</text><text x="533" y="286" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#23343b">turns scalar small</text><text x="533" y="309" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#23343b">into distance small</text>
  <path d="M648 279 H886" stroke="#315f63" stroke-width="4"/><polygon points="886,279 872,270 872,288" fill="#315f63"/>
  <rect x="888" y="242" width="184" height="74" rx="15" fill="#b06f45"/>
  <text x="980" y="286" text-anchor="middle" font-family="Georgia,serif" font-size="23" fill="#fff">attraction</text>
  <path d="M1072 129 H1090 V390 H921 V406 M1072 279 H1090" fill="none" stroke="#315f63" stroke-width="4"/>
  <polygon points="921,420 911,402 931,402" fill="#315f63"/>
  <rect x="770" y="422" width="302" height="92" rx="18" fill="#eaf1e5" stroke="#6f8d5e" stroke-width="4"/>
  <text x="921" y="460" text-anchor="middle" font-family="Georgia,serif" font-size="24" fill="#23343b">asymptotic stability</text>
  <text x="921" y="490" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#7a4d69">stability + local attraction</text>
  <text x="52" y="566" font-family="Arial,sans-serif" font-size="18" fill="#7a4d69">Positive definiteness and forward invariance remain separately named assumptions where needed.</text>
</svg>
