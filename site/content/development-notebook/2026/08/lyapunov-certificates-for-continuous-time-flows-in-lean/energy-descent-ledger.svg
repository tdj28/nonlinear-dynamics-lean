<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="560" viewBox="0 0 1080 560" role="img" aria-labelledby="title desc">
  <title id="title">Exact scalar descent along an exponential orbit</title>
  <desc id="desc">The squared value along x of t equal to two exp minus t falls from four at zero to one at log two and one quarter at log four. The derivative is nonpositive and the limit is zero.</desc>
  <rect width="1080" height="560" rx="24" fill="#fbf8f0"/>
  <text x="54" y="54" font-family="Georgia,serif" font-size="27" fill="#23343b">V(Φ(t,2)) = 4e⁻²ᵗ</text>
  <line x1="92" y1="430" x2="990" y2="430" stroke="#7f786d" stroke-width="3"/>
  <line x1="92" y1="92" x2="92" y2="430" stroke="#7f786d" stroke-width="3"/>
  <path d="M92 112 C210 190 320 274 462 328 C612 383 790 408 990 419" fill="none" stroke="#315f63" stroke-width="8"/>
  <circle cx="92" cy="112" r="11" fill="#b06f45"/><text x="114" y="106" font-family="Arial,sans-serif" font-size="20" fill="#23343b">t = 0, V = 4</text>
  <circle cx="462" cy="328" r="11" fill="#b06f45"/><text x="484" y="321" font-family="Arial,sans-serif" font-size="20" fill="#23343b">t = log 2, V = 1</text>
  <circle cx="742" cy="397" r="11" fill="#b06f45"/><text x="764" y="390" font-family="Arial,sans-serif" font-size="20" fill="#23343b">t = log 4, V = 1/4</text>
  <text x="108" y="480" font-family="Arial,sans-serif" font-size="19" fill="#7a4d69">every t ≥ 0</text>
  <rect x="116" y="495" width="372" height="43" rx="12" fill="#e8f0f7" stroke="#4b6787" stroke-width="2"/>
  <text x="302" y="523" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#23343b">derivative −8e⁻²ᵗ ≤ 0: descent</text>
  <rect x="590" y="495" width="372" height="43" rx="12" fill="#eaf1e5" stroke="#6f8d5e" stroke-width="2"/>
  <text x="776" y="523" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#23343b">value → 0: separate limit</text>
</svg>
