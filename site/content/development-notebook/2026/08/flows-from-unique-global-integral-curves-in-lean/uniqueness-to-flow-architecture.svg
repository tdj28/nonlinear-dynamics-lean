<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-labelledby="title desc">
  <title id="title">From unique curves to a flow</title>
  <desc id="desc">A selected curve and its time shift meet a restarted curve at the same state. Uniqueness supplies composition, while joint continuity enters through a separate gate before the Flow structure.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#315f63"/></marker></defs>
  <rect width="960" height="500" rx="24" fill="#fbf8f0"/>
  <text x="54" y="58" font-family="Georgia,serif" font-size="30" fill="#23343b">Two obligations, two sources</text>
  <rect x="54" y="98" width="394" height="250" rx="18" fill="#f1e9da" stroke="#315f63" stroke-width="3"/>
  <text x="82" y="136" font-family="Arial,sans-serif" font-size="20" fill="#7a4d69">ALGEBRAIC PATH</text>
  <path d="M96 260 C175 165 265 320 406 188" fill="none" stroke="#315f63" stroke-width="5"/>
  <circle cx="96" cy="260" r="9" fill="#b24b40"/><circle cx="250" cy="244" r="9" fill="#b24b40"/><circle cx="406" cy="188" r="9" fill="#b24b40"/>
  <text x="82" y="326" font-family="Arial,sans-serif" font-size="18" fill="#23343b">time shift + same start + uniqueness</text>
  <rect x="512" y="98" width="394" height="130" rx="18" fill="#e5efea" stroke="#315f63" stroke-width="3"/>
  <text x="540" y="140" font-family="Arial,sans-serif" font-size="20" fill="#7a4d69">TOPOLOGICAL PATH</text>
  <text x="540" y="184" font-family="Georgia,serif" font-size="23" fill="#23343b">joint continuity in time and state</text>
  <line x1="250" y1="360" x2="250" y2="412" stroke="#315f63" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="710" y1="238" x2="710" y2="412" stroke="#315f63" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="330" y="402" width="300" height="70" rx="18" fill="#315f63"/>
  <text x="411" y="447" font-family="Georgia,serif" font-size="28" fill="#fbf8f0">Flow R M</text>
</svg>
