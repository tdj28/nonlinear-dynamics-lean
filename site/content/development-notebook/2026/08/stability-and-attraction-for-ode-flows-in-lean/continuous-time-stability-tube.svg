<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360" role="img" aria-labelledby="title desc">
  <title id="title">One initial neighborhood controls a continuous forward-time tube</title>
  <desc id="desc">A delta interval at time zero feeds a shaded epsilon tube around a curved reference orbit from time zero through all nonnegative real times. A nearby orbit remains inside the tube.</desc>
  <rect width="760" height="360" fill="#F7F4F0"/>
  <style>
    .t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#2C2924}.title{font-size:15px;font-weight:700}.h{font-size:13px;font-weight:700}.s{font-size:12px}.m{font-size:11px;fill:#5A544C}.axis{stroke:#7F786D;stroke-width:1.4}.ref{stroke:#4B6787;stroke-width:3.5;fill:none}.near{stroke:#A67C52;stroke-width:3;fill:none}.bound{stroke:#6F8D5E;stroke-width:1.5;stroke-dasharray:5 4;fill:none}
  </style>
  <text x="24" y="28" class="t title">Continuous-time forward stability is uniform in every t at or after zero</text>
  <text x="24" y="48" class="t m">The tube center follows the reference orbit; it need not be an equilibrium.</text>
  <line x1="70" y1="290" x2="718" y2="290" class="axis"/><text x="694" y="314" class="t s">time</text>
  <line x1="82" y1="302" x2="82" y2="78" class="axis"/><text x="46" y="86" class="t s">state</text>
  <path d="M82 235 C205 210 290 122 412 152 S610 205 704 104 L704 156 C608 254 500 188 412 202 S205 260 82 265 Z" fill="#EAF1E5" opacity="0.88"/>
  <path d="M82 235 C205 210 290 122 412 152 S610 205 704 104" class="bound"/>
  <path d="M82 265 C205 260 290 172 412 202 S608 254 704 156" class="bound"/>
  <path d="M82 250 C205 235 290 147 412 177 S609 229 704 130" class="ref"/>
  <path d="M82 258 C205 246 289 159 412 188 S606 239 704 141" class="near"/>
  <line x1="62" y1="243" x2="62" y2="265" stroke="#A67C52" stroke-width="2"/><line x1="55" y1="243" x2="69" y2="243" stroke="#A67C52"/><line x1="55" y1="265" x2="69" y2="265" stroke="#A67C52"/>
  <text x="28" y="258" class="t s">delta</text>
  <line x1="660" y1="109" x2="660" y2="160" stroke="#6F8D5E" stroke-width="2"/><text x="618" y="101" class="t s">epsilon tube</text>
  <text x="456" y="165" class="t s">reference orbit</text><text x="468" y="215" class="t s">nearby orbit</text>
  <rect x="24" y="318" width="712" height="28" rx="8" fill="#EAF1E5" stroke="#6F8D5E"/>
  <text x="380" y="337" text-anchor="middle" class="t s">One delta works for the entire continuum of nonnegative real times.</text>
</svg>
