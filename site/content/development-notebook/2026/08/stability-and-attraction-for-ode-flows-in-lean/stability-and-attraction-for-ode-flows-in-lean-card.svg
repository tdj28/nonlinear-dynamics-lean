<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Stability and attraction for ODE flows in Lean</title>
  <desc id="desc">A continuous forward-time tube sits beside separate equilibrium and attraction gates that join only at asymptotic stability.</desc>
  <rect width="1200" height="630" fill="#f1e9da"/><rect x="38" y="38" width="1124" height="554" rx="28" fill="#fbf8f0" stroke="#315f63" stroke-width="4"/>
  <text x="76" y="102" font-family="Arial,sans-serif" font-size="21" letter-spacing="3" fill="#7a4d69">DEVELOPMENT NOTEBOOK · ODE STABILITY</text>
  <text x="76" y="174" font-family="Georgia,serif" font-size="51" fill="#23343b">Stability follows an orbit</text><text x="76" y="232" font-family="Georgia,serif" font-size="51" fill="#23343b">at every forward real time</text>
  <path d="M92 394 C230 300 360 434 520 334" fill="none" stroke="#6F8D5E" stroke-width="58" opacity="0.28"/>
  <path d="M92 394 C230 300 360 434 520 334" fill="none" stroke="#315f63" stroke-width="6"/>
  <path d="M92 407 C230 313 360 447 520 347" fill="none" stroke="#b06f45" stroke-width="5"/>
  <rect x="590" y="288" width="224" height="78" rx="16" fill="#E8F0F7" stroke="#4B6787" stroke-width="3"/><text x="702" y="322" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#23343b">EQUILIBRIUM</text><text x="702" y="347" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#7a4d69">fixed for all time</text>
  <rect x="590" y="390" width="224" height="78" rx="16" fill="#F3E8E0" stroke="#A67C52" stroke-width="3"/><text x="702" y="424" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#23343b">ATTRACTION</text><text x="702" y="449" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#7a4d69">limit as t grows</text>
  <path d="M830 328 L902 370 L830 430" fill="none" stroke="#315f63" stroke-width="5"/>
  <rect x="904" y="334" width="224" height="92" rx="18" fill="#EAF1E5" stroke="#6F8D5E" stroke-width="3"/><text x="1016" y="372" text-anchor="middle" font-family="Georgia,serif" font-size="23" fill="#23343b">asymptotic</text><text x="1016" y="402" text-anchor="middle" font-family="Georgia,serif" font-size="23" fill="#23343b">stability</text>
  <text x="76" y="540" font-family="Arial,sans-serif" font-size="19" fill="#7a4d69">nonnegative real time · uniform closeness · separate long-time limit</text>
</svg>
