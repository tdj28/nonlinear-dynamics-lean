<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="descent-trace-title descent-trace-desc">
  <title id="descent-trace-title">A halving orbit and its decreasing squared energy</title>
  <desc id="descent-trace-desc">Starting at four, the state is halved to two, one, and one half. The squared energy decreases from sixteen to four, one, and one quarter. Separate rows prevent the state values from being confused with the energy values.</desc>
  <defs>
    <marker id="descent-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#A36B3F"/>
    </marker>
    <style>
      .paper{fill:#FBF7F0}.ink{fill:#26343A}.muted{fill:#655F57}.state{fill:#E8F0F7;stroke:#4B6787;stroke-width:2}.energy{fill:#EAF1E5;stroke:#668357;stroke-width:2}.arrow{stroke:#A36B3F;stroke-width:3;fill:none;marker-end:url(#descent-arrow)}.guide{stroke:#C8BCAA;stroke-width:1.5;stroke-dasharray:6 7}.title{font:700 30px Georgia,serif}.label{font:700 18px Arial,sans-serif}.value{font:700 27px Georgia,serif}.small{font:16px Arial,sans-serif}.note{font:17px Arial,sans-serif}
    </style>
  </defs>
  <rect class="paper" width="1200" height="620" rx="18"/>
  <text class="title ink" x="60" y="58">One orbit, two exact ledgers</text>
  <text class="small muted" x="60" y="88">The update halves the state. The certificate is the square of the state.</text>

  <text class="label ink" x="60" y="176">state</text>
  <text class="label ink" x="60" y="356">energy</text>

  <line class="guide" x1="250" y1="112" x2="250" y2="480"/>
  <line class="guide" x1="500" y1="112" x2="500" y2="480"/>
  <line class="guide" x1="750" y1="112" x2="750" y2="480"/>
  <line class="guide" x1="1000" y1="112" x2="1000" y2="480"/>

  <rect class="state" x="174" y="132" width="152" height="82" rx="13"/>
  <rect class="state" x="424" y="132" width="152" height="82" rx="13"/>
  <rect class="state" x="674" y="132" width="152" height="82" rx="13"/>
  <rect class="state" x="924" y="132" width="152" height="82" rx="13"/>
  <text class="value ink" x="250" y="184" text-anchor="middle">4</text>
  <text class="value ink" x="500" y="184" text-anchor="middle">2</text>
  <text class="value ink" x="750" y="184" text-anchor="middle">1</text>
  <text class="value ink" x="1000" y="184" text-anchor="middle">1/2</text>
  <path class="arrow" d="M330 173 H412"/>
  <path class="arrow" d="M580 173 H662"/>
  <path class="arrow" d="M830 173 H912"/>
  <text class="small muted" x="371" y="146" text-anchor="middle">halve</text>
  <text class="small muted" x="621" y="146" text-anchor="middle">halve</text>
  <text class="small muted" x="871" y="146" text-anchor="middle">halve</text>

  <rect class="energy" x="174" y="312" width="152" height="82" rx="13"/>
  <rect class="energy" x="424" y="312" width="152" height="82" rx="13"/>
  <rect class="energy" x="674" y="312" width="152" height="82" rx="13"/>
  <rect class="energy" x="924" y="312" width="152" height="82" rx="13"/>
  <text class="value ink" x="250" y="364" text-anchor="middle">16</text>
  <text class="value ink" x="500" y="364" text-anchor="middle">4</text>
  <text class="value ink" x="750" y="364" text-anchor="middle">1</text>
  <text class="value ink" x="1000" y="364" text-anchor="middle">1/4</text>
  <path class="arrow" d="M330 353 H412"/>
  <path class="arrow" d="M580 353 H662"/>
  <path class="arrow" d="M830 353 H912"/>
  <text class="small muted" x="371" y="326" text-anchor="middle">quarter</text>
  <text class="small muted" x="621" y="326" text-anchor="middle">quarter</text>
  <text class="small muted" x="871" y="326" text-anchor="middle">quarter</text>

  <rect x="116" y="488" width="968" height="82" rx="12" fill="#F2E8DC" stroke="#A36B3F" stroke-width="1.6"/>
  <text class="label ink" x="600" y="523" text-anchor="middle">The displayed arithmetic checks this orbit.</text>
  <text class="note muted" x="600" y="551" text-anchor="middle">A general Lyapunov conclusion still uses the exact hypotheses of a checked theorem.</text>
</svg>
