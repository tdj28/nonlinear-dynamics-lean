<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" role="img" aria-labelledby="cycleTitle cycleDesc">
  <title id="cycleTitle">A finite cyclic system meets the topological core but not sensitivity</title>
  <desc id="cycleDesc">States zero, one, and two form a directed cycle. A dashed ball of radius one half surrounds only state zero, preventing a distinct nearby sensitivity witness.</desc>
  <rect width="760" height="300" fill="#F7F4F0"/>
  <style>.t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#2C2924}.title{font-size:15px;font-weight:700}.h{font-size:13px;font-weight:700}.s{font-size:12px}.m{font-size:11px;fill:#5A544C}.node{fill:#E8F0F7;stroke:#4B6787;stroke-width:2}.arrow{fill:none;stroke:#A67C52;stroke-width:2.5}</style>
  <defs><marker id="arrowCycle" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#A67C52"/></marker></defs>
  <text x="24" y="28" class="t title">The three-cycle marks the infinitude boundary</text>
  <text x="24" y="48" class="t m">Positive-time transport and periodicity survive; metric sensitivity does not.</text>
  <circle cx="180" cy="150" r="35" class="node"/><circle cx="380" cy="105" r="35" class="node"/><circle cx="580" cy="150" r="35" class="node"/>
  <text x="176" y="155" class="t h">0</text><text x="376" y="110" class="t h">1</text><text x="576" y="155" class="t h">2</text>
  <path d="M214 140 C265 105 315 95 344 102" class="arrow" marker-end="url(#arrowCycle)"/>
  <path d="M415 112 C470 120 515 135 545 145" class="arrow" marker-end="url(#arrowCycle)"/>
  <path d="M558 177 C470 245 275 245 198 181" class="arrow" marker-end="url(#arrowCycle)"/>
  <circle cx="180" cy="150" r="58" fill="none" stroke="#A89B8C" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="84" y="82" class="t s">ball radius 1/2</text><text x="76" y="99" class="t m">contains only state 0</text>
  <rect x="24" y="256" width="712" height="28" rx="8" fill="#EAF1E5" stroke="#6F8D5E"/>
  <text x="42" y="275" class="t s">Every point is periodic, but a singleton neighborhood leaves no distinct sensitivity partner.</text>
</svg>
