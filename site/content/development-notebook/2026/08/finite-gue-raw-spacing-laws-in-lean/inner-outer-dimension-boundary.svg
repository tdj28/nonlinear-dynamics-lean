<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" role="img" aria-labelledby="massTitle massDesc">
  <title id="massTitle">Outer and inner probability boundaries by dimension</title>
  <desc id="massDesc">The outer pushforward law is a probability measure in every dimension. The inner raw-spacing measure is zero in dimensions zero and one and becomes a probability measure from dimension two onward.</desc>
  <rect width="1120" height="560" rx="24" fill="#F7F4F0"/>
  <style>
    .t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#2C2924}.title{font-size:25px;font-weight:700}.h{font-size:17px;font-weight:700}.s{font-size:15px}.m{font-size:13px;fill:#5A544C}.card{stroke-width:2}
  </style>
  <text x="48" y="49" class="t title">Outer mass and inner mass answer different questions</text>
  <text x="48" y="74" class="t m">Pushforward preserves the outer probability law; gap count controls the inner wrapper.</text>
  <rect x="48" y="105" width="1024" height="92" rx="16" fill="#E8F0F7" stroke="#4B6787" class="card"/>
  <text x="78" y="142" class="t h">ALL DIMENSIONS</text>
  <text x="272" y="142" class="t s">finite GUE input law</text>
  <line x1="474" y1="136" x2="566" y2="136" stroke="#A67C52" stroke-width="4" marker-end="url(#massArrow)"/>
  <text x="606" y="142" class="t s">raw-spacing pushforward</text>
  <text x="846" y="142" class="t h">outer mass = 1</text>
  <text x="78" y="176" class="t m">Outcome type is always Measure(real numbers), including the zero measure.</text>
  <rect x="48" y="228" width="486" height="240" rx="18" fill="#F3E8E0" stroke="#A67C52" class="card"/>
  <text x="291" y="267" text-anchor="middle" class="t h">DIMENSION 0 OR 1</text>
  <text x="291" y="310" text-anchor="middle" class="t s">no adjacent gap slot</text>
  <rect x="96" y="336" width="390" height="72" rx="12" fill="#FBF9F6" stroke="#C4B8A8"/>
  <text x="291" y="365" text-anchor="middle" class="t s">inner outcome: zero measure</text>
  <text x="291" y="392" text-anchor="middle" class="t h">inner mass = 0</text>
  <text x="291" y="444" text-anchor="middle" class="t m">outer law: Dirac at that measure-valued point</text>
  <rect x="586" y="228" width="486" height="240" rx="18" fill="#EAF1E5" stroke="#6F8D5E" class="card"/>
  <text x="829" y="267" text-anchor="middle" class="t h">DIMENSION 2 OR MORE</text>
  <text x="829" y="310" text-anchor="middle" class="t s">at least one adjacent gap slot</text>
  <rect x="634" y="336" width="390" height="72" rx="12" fill="#FBF9F6" stroke="#C4B8A8"/>
  <text x="829" y="365" text-anchor="middle" class="t s">inner outcome: probability measure</text>
  <text x="829" y="392" text-anchor="middle" class="t h">inner mass = 1</text>
  <text x="829" y="444" text-anchor="middle" class="t m">forgetting the wrapper recovers the raw law</text>
  <rect x="48" y="493" width="1024" height="42" rx="12" fill="#EAF1E5" stroke="#6F8D5E"/>
  <text x="560" y="520" text-anchor="middle" class="t h">No empty gap is invented; no positive-dimensional measure is changed.</text>
  <defs><marker id="massArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#A67C52"/></marker></defs>
</svg>
