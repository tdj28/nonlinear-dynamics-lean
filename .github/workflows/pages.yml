name: Deploy Hugo site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - ".env.example"
      - "README.md"
      - "Makefile"
      - "scripts/check_public_reader_language.py"
      - "scripts/check_teaching_source_hygiene.py"
      - "scripts/test_check_teaching_source_hygiene.py"
      - "site/**"
      - "formalization/NonlinearDynamics/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: "0.160.1"
      TZ: America/Los_Angeles

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Install pinned Hugo Extended
        run: |
          mkdir -p "${RUNNER_TEMP}/hugo"
          curl -fsSL \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_withdeploy_${HUGO_VERSION}_linux-amd64.tar.gz" \
            | tar -xz -C "${RUNNER_TEMP}/hugo"
          echo "${RUNNER_TEMP}/hugo" >> "${GITHUB_PATH}"

      - name: Validate Hugo content
        run: |
          hugo version
          make checkpoint-check
          make content-coverage-test
          make content-hygiene-test
          make content-hygiene
          make site-check

      - name: Build publication site
        run: |
          hugo \
            --source site \
            --config hugo.yaml \
            --baseURL "${{ steps.pages.outputs.base_url }}/" \
            --cleanDestinationDir \
            --gc \
            --minify \
            --panicOnWarning \
            --noBuildLock \
            --cacheDir "${RUNNER_TEMP}/hugo-cache"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
